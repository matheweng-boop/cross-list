<svg viewBox="0 0 720 280" role="img" aria-labelledby="hw-uwb-t" class="hw-svg" font-family="inherit" font-size="13">
  <title id="hw-uwb-t">UWB: a 2 ns pulse, double-sided two-way ranging between device A and device B, and angle of arrival from the phase difference at two antennas</title>
  <style>.hw-svg .b{fill:var(--pico-card-background-color,#fff);stroke:currentColor;stroke-width:1.4}.hw-svg .s{fill:none;stroke:currentColor;stroke-width:1.4}.hw-svg .p{fill:none;stroke:#1f5fa8;stroke-width:2}.hw-svg .a{fill:none;stroke:#0b6b74;stroke-width:2;marker-end:url(#hw-u-ar)}.hw-svg text{fill:currentColor}.hw-svg .m{font-size:11px;opacity:.8}</style>
  <defs><marker id="hw-u-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6b74"/></marker></defs>
  <text x="10" y="20" class="m">1 · Impulse: about 2 ns wide, 500 MHz channel</text>
  <path class="s" d="M10 80H200"/><path class="p" d="M10 80H90C95 80 97 40 102 40S108 120 113 120S119 60 122 80H200"/>
  <text x="105" y="140" text-anchor="middle" class="m">sharp edge = precise timestamp</text>
  <text x="250" y="20" class="m">2 · Double-sided two-way ranging</text>
  <path class="s" d="M280 35V250M450 35V250"/><text x="280" y="32" text-anchor="middle">A</text><text x="450" y="32" text-anchor="middle">B</text>
  <path class="a" d="M280 50L448 90"/><text x="365" y="58" text-anchor="middle" class="m">poll</text>
  <path class="a" d="M450 120L282 160"/><text x="365" y="128" text-anchor="middle" class="m">response</text>
  <path class="a" d="M280 190L448 230"/><text x="365" y="198" text-anchor="middle" class="m">final</text>
  <text x="365" y="270" text-anchor="middle" class="m">flight time from the round trips minus reply delays</text>
  <text x="500" y="20" class="m">3 · Angle of arrival (two antennas)</text>
  <path class="s" d="M540 230H660"/><path class="s" d="M560 230V210M640 230V210"/><circle class="b" cx="560" cy="205" r="5"/><circle class="b" cx="640" cy="205" r="5"/>
  <text x="600" y="250" text-anchor="middle" class="m">d ≈ λ/2 (about 2 cm)</text>
  <path class="p" d="M520 70L560 200M600 70L640 200"/><path class="s" d="M560 200L600 187" stroke-dasharray="4 3"/>
  <text x="612" y="120" class="m">extra path = d·sin θ</text><text x="612" y="136" class="m">→ phase difference</text>
</svg>
<figcaption>Drawn by us from the DW3000 datasheet description and FiRa's overview. Channel 5 = 6.5 GHz, channel 9 = 8.0 GHz.</figcaption>
