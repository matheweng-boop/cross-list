{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/shareable.css">
<h1>Shareable</h1>
<p class="subtitle">Everything here is public information, ready to share outside the company or save as PDF.</p>
<div class="sh-cards">
  {% for label, href, desc in items %}
  <a class="sh-card" href="{{ href }}"><b>{{ label }}</b><span>{{ desc }}</span></a>
  {% endfor %}
</div>
{% endblock %}
