# General application categories for searching the block diagrams (walk-through "Sell around it", case from a part).
# Typing a category name or any of its words finds the diagrams whose name, category, market or block frames
# contain one of the words. Keep the categories broad: a person types "HVAC" or "BMS", not a diagram name.
#   key:   short id
#   label: what the page shows
#   words: words that mean the same (lower case; matched as whole words or phrases; a trailing * matches any ending)

