# Functions for the block-diagram generator. Each function says which parts in BizDev can fill it.
#
# source:  {family: <rules family>}        Skyworks parts of that BizDev family
#          {broadcast: tuner|coprocessor|receiver}  Skyworks broadcast parts of that role
#          external                         the customer's own part (processor, memory, sensors): not counted
#          (omitted)                        no Skyworks part in BizDev yet: shown as an opportunity
# Qorvo catalogue parts (data/blocks/research/qorvo_parts.yaml, store.qorvo.com) are added to the function named
# in that file, so a block can show the best two Skyworks and the best two Qorvo parts.
# companions: functions usually designed in next to this one (suggested when the block is added)
# requirements: optional questions that narrow the parts that fit (nothing is assumed; unanswered = no filter)
#   {id, label, param, op: contains | eq | gte | in, value} for yes/no; {id, label, param, op, choices: [...] | auto} for a choice
#   param "feature" checks the broadcast feature set (data/broadcast/tuner_features.yaml)
# Note: "opportunity" only means BizDev has no Skyworks part for it yet. The full Skyworks portfolio is not
# imported (backlog), so some opportunities are covered by Skyworks products that are simply not loaded.

categories:
  power: Power rail
  protection: Protection
  isolation: Isolation
  timing: Timing
  rf: RF front end
  radio: Broadcast radio
  sensing: Sensing & amplification
  interface: Interface
  networking: Networking
  processing: Processing
  memory: Memory
  audio: Audio & user interface
  sensors: Sensors & external parts

functions:
  # power
  pmic: {label: PMIC, category: power, companions: [supervisor, voltage_reference], note: Multi-rail power management IC}
  buck_boost: {label: Buck-boost controller, category: power, companions: [wide_vin_buck, tvs_esd]}
  wide_vin_buck: {label: Wide-Vin buck, category: power, companions: [pol_buck, pol_ldo]}
  pol_buck: {label: PoL buck, category: power}
  pol_ldo: {label: PoL LDO, category: power}
  ldo_tracker: {label: LDO tracker, category: power}
  termination_ldo: {label: Termination LDO, category: power}
  multiphase: {label: Multi-phase controller, category: power, note: High-current core supply for processors}
  supervisor: {label: Supervisor, category: power}
  sequencer: {label: Sequencer, category: power}
  voltage_reference: {label: Voltage reference, category: power}
  load_switch: {label: High-side / load switch, category: power, companions: [tvs_esd]}
  isolated_dcdc: {label: Isolated DC-DC, category: power, companions: [digital_isolator], note: Power across an isolation barrier}
  pre_regulator: {label: Pre-regulator (SEPIC / boost / buck-boost), category: power, companions: [isolated_dcdc], note: Stabilises the battery voltage for the isolated bias supplies}
  hv_flyback: {label: HV flyback controller, category: power, companions: [isolated_dcdc], note: Supply from the 400 / 800 V battery (redundant or main bias input)}
  isolated_switch_driver: {label: Isolated switch driver, category: isolation, note: "Drives a switch across the barrier with its own secondary bias (e.g. DC-link active discharge). Skyworks Si875x isolated FET drivers fit here but are not imported yet"}
  power_loss_protection: {label: Power-loss protection (eFuse + hold-up), category: power, companions: [pmic]}
  cc_regulator: {label: Constant-current regulator, category: power}
  # protection
  tvs_esd: {label: TVS / ESD protection, category: protection}
  reverse_polarity: {label: Reverse-polarity / ideal-diode controller, category: protection}
  # isolation
  digital_isolator:
    label: Digital isolator
    category: isolation
    source: {family: digital_isolator}
    companions: [isolated_dcdc, pol_ldo, tvs_esd]
    requirements:
      - {id: reinforced, label: Reinforced isolation, param: isolation_class, op: eq, value: reinforced}
      - {id: rating, label: Isolation rating at least, param: isolation_rating_kvrms, op: gte, choices: [2.5, 3.75, 5]}
      - {id: channels, label: Channel configuration, param: channel_config, op: eq, choices: auto}
      - {id: default_output, label: Output state when unpowered, param: default_output, op: eq, choices: auto}
      - {id: automotive, label: Automotive (AEC-Q100), param: qualification, op: eq, value: automotive}
  gate_driver:
    label: Isolated gate driver
    category: isolation
    source: {family: gate_driver}
    companions: [digital_isolator, isolated_dcdc, current_sensor, isolated_amplifier, temperature_sensor, mcu, tvs_esd]
    requirements:
      - {id: desat, label: DESAT / overcurrent detection, param: protection, op: contains, value: desaturation}
      - {id: miller, label: Active Miller clamp, param: protection, op: contains, value: Miller clamp}
      - {id: soft_off, label: Soft turn-off, param: protection, op: contains, value: soft shutdown}
      - {id: deadtime, label: Programmable dead time, param: deadtime, op: eq, value: programmable}
      - {id: input, label: Input type, param: input_type, op: eq, choices: auto}
      - {id: channels, label: Channels, param: channel_config, op: eq, choices: auto}
      - {id: uvlo, label: Output UVLO, param: uvlo_v, op: eq, choices: auto}
      - {id: peak, label: Peak sink current at least (A), param: peak_sink_a, op: gte, choices: [2, 4, 6, 10, 15, 20, 30]}
      - {id: reinforced, label: Reinforced isolation, param: isolation_class, op: eq, value: reinforced}
      - {id: cmti, label: CMTI at least (kV/µs), param: cmti_kv_us, op: gte, choices: [50, 100, 150]}
      - {id: automotive, label: Automotive (AEC-Q100), param: qualification, op: eq, value: automotive}
  three_phase_gate_driver: {label: 3-phase gate driver (non-isolated), category: power, companions: [amplifier, wide_vin_buck, mcu], note: Smart BLDC gate driver for 12-100 V buses; often with current-sense amplifiers and a buck}
  half_bridge_driver: {label: Half-bridge gate driver (non-isolated), category: power, companions: [amplifier, mcu]}
  isolated_amplifier: {label: Isolated amplifier / modulator, category: isolation, source: {family: isolated_amplifier}, companions: [isolated_dcdc, adc]}
  optocoupler: {label: Optocoupler, category: isolation}
  isolated_smart_switch: {label: Isolated smart (high-side) switch, category: isolation}
  isolated_digital_input: {label: Isolated digital input (24 V field input), category: isolation, companions: [tvs_esd, mcu]}
  isolated_can: {label: Isolated CAN transceiver, category: networking, companions: [isolated_dcdc, tvs_esd]}
  current_sensor: {label: Isolated current sensor, category: isolation, source: {family: current_sensor}, companions: [adc, mcu]}
  # timing
  crystal_oscillator: {label: Crystal / oscillator, category: timing, companions: [clock_buffer]}
  clock_generator: {label: Clock generator, category: timing, companions: [clock_buffer]}
  clock_buffer: {label: Clock buffer, category: timing}
  jitter_attenuator: {label: Jitter attenuator, category: timing}
  rtc: {label: RTC, category: timing}
  watchdog: {label: Watchdog, category: timing}
  # RF
  antenna: {label: Antenna, category: rf, source: external, companions: [antenna_switch, lna, tvs_esd]}
  antenna_switch:
    label: Antenna / RF switch
    category: rf
    source: {family: rf_switch}
    companions: [lna, tvs_esd]
    requirements: &switch_req
      - {id: config, label: Configuration, param: configuration, op: eq, choices: auto}
      - {id: control, label: Control interface, param: control_interface, op: eq, choices: auto}
      - {id: automotive, label: Automotive (AEC-Q100), param: qualification, op: eq, value: automotive}
  rf_switch: {label: RF switch, category: rf, source: {family: rf_switch}, requirements: *switch_req}
  lna: {label: LNA, category: rf, companions: [antenna_switch]}
  rf_pa_bias: {label: RF PA bias controller, category: rf}
  rf_frontend: {label: RF front-end module, category: rf}
  # RF sockets from the MediaTek / Qualcomm / NXP platform research (data/blocks/research/rf_platforms.md)
  power_amplifier: {label: RF power amplifier, category: rf, companions: [rf_pa_bias, circulator_isolator, filter_saw_baw], note: "Discrete / infrastructure PA (massive MIMO, small cell)"}
  pa_module: {label: PA module / PAMiD, category: rf, companions: [antenna_tuner, diversity_rx_module, pmic], note: PA + switch + filter for the cellular TX path}
  rf_predriver: {label: RF pre-driver amplifier, category: rf, companions: [power_amplifier]}
  diversity_rx_module: {label: Diversity / RX front-end module, category: rf, companions: [antenna_switch, filter_saw_baw], note: LNA + switch + filter}
  wifi_fem: {label: Wi-Fi front-end module, category: rf, companions: [diplexer, antenna_switch], note: "PA + LNA + switch per chain, 2.4 / 5 / 6 GHz"}
  bt_fem: {label: Bluetooth / 802.15.4 front end, category: rf, note: 2.4 GHz PA / LNA range extension}
  uwb_fem: {label: UWB front end, category: rf, companions: [rf_switch], note: Switch / LNA / filter for angle-of-arrival antennas}
  v2x_fem: {label: V2X 5.9 GHz front end, category: rf, note: DSRC / C-V2X front end or antenna compensator}
  gnss_lna: {label: GNSS LNA / front end, category: rf, companions: [filter_saw_baw], note: L1 / L5}
  active_antenna_amp: {label: Active antenna amplifier (AM/FM), category: radio, companions: [am_fm_tuner], note: In-antenna AM/FM amplifier}
  antenna_tuner: {label: Antenna aperture / impedance tuner, category: rf}
  filter_saw_baw: {label: RF filter (SAW / BAW / LTCC), category: rf}
  diplexer: {label: Diplexer / multiplexer, category: rf}
  circulator_isolator: {label: Circulator / isolator, category: rf}
  beamformer_ic: {label: Analog beamformer IC (mmWave), category: rf}
  mmwave_antenna_module: {label: mmWave antenna module, category: rf, source: external, note: Transceiver + RF front end + array from the platform vendor; usually not an open socket}
  rf_transceiver: {label: RF transceiver (RFIC), category: rf, source: external}
  # from the Skyworks catalogue categories (data/catalog/skyworks_categories.md)
  rf_gain_block: {label: RF gain block / driver / VGA, category: rf}
  rf_attenuator: {label: RF attenuator, category: rf}
  rf_mixer: {label: RF mixer / modulator / demodulator, category: rf}
  rf_synthesizer: {label: RF PLL / synthesizer / VCO, category: rf}
  rf_passive: {label: "RF passive (capacitor, splitter, multiplexer)", category: rf}
  pin_diode: {label: PIN diode, category: rf}
  schottky_diode: {label: Schottky / detector / mixer diode, category: rf}
  varactor_diode: {label: Varactor (tuning) diode, category: rf}
  rf_limiter: {label: RF limiter, category: rf}
  rf_phase_shifter: {label: RF phase shifter, category: rf}
  frequency_multiplier: {label: Frequency multiplier, category: rf}
  tv_tuner: {label: TV / set-top tuner, category: radio}
  tv_demodulator: {label: Digital TV / satellite demodulator, category: radio}
  # broadcast radio
  am_fm_tuner:
    label: AM/FM / digital radio tuner
    category: radio
    source: {broadcast: tuner}
    companions: [digital_radio_demod, antenna_switch, lna, pmic, pol_ldo, crystal_oscillator, clock_buffer, tvs_esd, audio_amp, soc, flash]
    requirements:
      - {id: tuners, label: Tuners per IC, param: tuners, op: eq, choices: [1, 2]}
      - {id: hd, label: HD Radio, param: feature, op: contains, value: HD}
      - {id: dab, label: DAB, param: feature, op: contains, value: DAB}
      - {id: drm, label: DRM, param: feature, op: contains, value: DRM}
      - {id: wb, label: Weather band, param: feature, op: contains, value: WB}
      - {id: pd, label: FM phase diversity, param: feature, op: contains, value: PD}
      - {id: amic, label: AM interference canceller, param: feature, op: contains, value: AMIC}
      - {id: audio, label: On-chip audio, param: feature, op: contains, value: AUDIO}
  digital_radio_demod:
    label: Digital radio demodulator (HD / DAB / DRM)
    category: radio
    source: {broadcast: coprocessor}
    companions: [flash, soc, pol_ldo]
    requirements:
      - {id: std, label: Standard, param: decode, op: contains, choices: [HD, DAB, DRM, CDR]}
      - {id: channels, label: Channels at least, param: channels, op: gte, choices: [2, 3, 4]}
  single_chip_radio: {label: Single-chip radio receiver, category: radio, source: {broadcast: receiver}, companions: [crystal_oscillator, pol_ldo, audio_amp]}
  # sensing
  amplifier: {label: Amplifier, category: sensing, companions: [adc]}
  position_sensor: {label: Rotor position sensor (Hall / inductive / AMR), category: sensing}
  position_interface: {label: Resolver / position sensor interface, category: sensing, note: "Excitation amplifier and signal conditioning for a resolver, inductive or Hall position sensor"}
  temperature_sensor: {label: Temperature sensor, category: sensing, note: e.g. power-module NTC / diode sensing across the isolation barrier}
  adc: {label: ADC, category: sensing}
  motor_controller: {label: Motor controller SoC (MCU + gate drivers + power), category: processing, companions: [can_transceiver, tvs_esd, current_sensor], note: e.g. Qorvo PAC52xx / PAC55xx; up to 160 V or 600 V gate drive}
  modem: {label: Cellular modem (4G / 5G / NTN), category: processing, source: external}
  wifi_soc: {label: Wi-Fi / Bluetooth combo SoC, category: networking, source: external, companions: [wifi_fem, bt_fem, crystal_oscillator]}
  ble_soc: {label: Bluetooth LE / 802.15.4 SoC, category: networking, source: external, companions: [bt_fem, crystal_oscillator]}
  uwb_soc: {label: UWB transceiver IC, category: networking, companions: [uwb_fem, rf_switch], note: Qorvo makes UWB ICs and modules}
  v2x_transceiver: {label: V2X modem / transceiver, category: networking, source: external, companions: [v2x_fem]}
  nfc_frontend: {label: NFC controller / front end, category: interface, source: external}
  radar_transceiver: {label: Radar transceiver / radar SoC, category: sensors, source: external}
  secure_element: {label: Secure element, category: processing, source: external}
  battery_charger: {label: Battery charger, category: power}
  battery_monitor: {label: Battery monitor / fuel gauge, category: power}
  poe_pd: {label: PoE powered-device interface, category: power, companions: [wide_vin_buck]}
  poe_pse: {label: PoE PSE controller, category: power}
  wireless_soc: {label: Wireless connectivity SoC (802.15.4 / BLE / UWB), category: networking, companions: [bt_fem, crystal_oscillator]}
  optical_driver: {label: Optical laser / modulator driver, category: interface}
  optical_tia: {label: Optical TIA, category: interface}
  slic: {label: SLIC / ProSLIC voice interface, category: networking}
  modem_daa: {label: Modem / DAA, category: networking}
  # interface
  voltage_translator: {label: Voltage translator, category: interface}
  io_expander: {label: I/O expander, category: interface}
  serdes: {label: SERDES, category: interface, companions: [tvs_esd]}
  redriver: {label: ReDriver, category: interface}
  pcie_switch: {label: PCIe packet switch, category: interface}
  pcie_buffer: {label: PCIe clock buffer, category: interface}
  # networking
  can_transceiver: {label: CAN transceiver, category: networking, companions: [tvs_esd, digital_isolator]}
  ethernet_phy: {label: Ethernet PHY / switch, category: networking, companions: [tvs_esd]}
  rs485_transceiver: {label: RS-485 transceiver, category: networking, companions: [digital_isolator, isolated_dcdc, tvs_esd]}
  # processing and memory (customer parts)
  mcu: {label: MCU, category: processing, source: external}
  soc: {label: SoC / application processor, category: processing, source: external}
  adas_processor: {label: Autonomous driving processor, category: processing, source: external}
  ddr_flash: {label: Memory DDR / flash, category: memory, source: external}
  flash: {label: Flash, category: memory, source: external}
  # audio
  led_driver: {label: LED driver, category: audio, note: Lights and display backlight}
  wireless_audio_soc: {label: Wireless audio SoC, category: audio}
  audio_amp: {label: Audio amplifier, category: audio}
  audio_codec: {label: Audio codec / DSP, category: audio}
  # sensors (external inputs)
  vehicle_sensors: {label: "Vehicle sensors (wheel speed, steering, brake...)", category: sensors, source: external}
  external_block: {label: External / system block, category: sensors, source: external, note: A part of the system outside the Skyworks / Qorvo scope (label says what)}
  battery_pack: {label: Battery pack, category: sensors, source: external}
  power_fets: {label: MOSFETs / GaN FETs, category: sensors, source: external, note: Inverter switches; not a BizDev part}
  display: {label: Display, category: sensors, source: external}
  hv_battery: {label: HV battery (400 / 800 V), category: sensors, source: external}
  dc_link_cap: {label: DC-link capacitor, category: sensors, source: external}
  power_module: {label: IGBT / SiC power switch, category: sensors, source: external, note: Power module or discrete switches; not a BizDev part}
  motor: {label: Traction motor, category: sensors, source: external}
  camera_radar: {label: Camera / lidar / radar modules, category: sensors, source: external}
  # added by tools/import_diagrams.py from research files
  acdc_controller: {category: power, label: AC/DC controller (PFC / flyback / LLC / SR), note: 'Offline PWM, PFC and synchronous-rectifier controllers for mains-powered supplies (adapters, appliances, chargers, UPS). hv_flyback stays the HV-battery bias fl'}
  efuse_hotswap: {category: protection, label: eFuse / hot-swap controller, note: 'Inrush and over-current protection on an input or output rail, with or without telemetry; power_loss_protection stays the eFuse + hold-up combination'}
  relay_driver: {category: power, label: Relay / solenoid driver (low-side), note: 'Coil drivers for relays, contactors, valves and solenoids (e.g. Darlington arrays, PWM solenoid drivers)'}
  motor_driver_brushed: {category: power, label: Brushed DC / stepper motor driver, note: 'Integrated H-bridge or stepper driver for small motors: locks, valves, levelling, lens focus, pumps, fans'}
  usb_pd_controller: {category: interface, label: USB Type-C / PD controller, note: CC negotiation and power-path control for USB-C sources and sinks}
  battery_protector: {category: power, label: Battery protector (cell OVP / UVP / OCP), note: Protector IC driving charge / discharge FETs; battery_monitor stays the fuel gauge / monitor}
  wireless_power: {category: power, label: Wireless power transmitter / receiver (Qi), note: Inductive charging TX or RX}
  dac: {category: sensing, label: DAC, note: 'Precision or high-speed DAC (bias, control loops, RF DAC)'}
  touch_controller: {category: audio, label: Touch / capacitive / inductive sensing controller, note: 'Touch-screen controllers, capacitive buttons and sliders, inductive (metal) touch'}
  display_driver: {category: audio, label: 'Display driver / bias power (LCD, OLED)', note: 'Display bias PMIC, LCD driver or display interface; led_driver stays the backlight', source: external}
  haptics_driver: {category: audio, label: Haptics / piezo driver, note: ERM / LRA / piezo actuator and buzzer drivers}
  env_sensor: {category: sensors, label: 'Environmental sensor (humidity, light, pressure)', note: 'Humidity, ambient-light and similar environmental sensor ICs (temperature_sensor stays separate)'}
  hall_switch: {category: sensing, label: Hall-effect switch / latch, note: 'Digital Hall switches for lid, tamper, wake-up and BLDC commutation; position_sensor stays the angle / linear sensor'}
  ultrasonic_afe: {category: sensing, label: Ultrasonic sensor AFE (transducer driver + echo receiver), note: 'Single-channel time-of-flight AFE: park assist, level, flow meters'}
  ecg_afe: {category: sensing, label: ECG / biopotential AFE, note: 'Multi-channel biopotential ADC with lead-off, pace and respiration functions'}
  ppg_afe: {category: sensing, label: Optical biosensing AFE (PPG / SpO2), note: LED driver + TIA + ADC for heart-rate and SpO2}
  ultrasound_afe: {category: sensing, label: Medical ultrasound receive AFE, note: Multi-channel LNA + VGA + PGA + ADC (+ CW mixer) for imaging probes}
  hv_pulser: {category: sensing, label: Ultrasound HV transmit pulser / T/R switch, note: Multi-level high-voltage pulsers with integrated transmit / receive switches}
  # added by tools/import_diagrams.py from research files
  lin_transceiver: {category: networking, label: LIN transceiver, note: 'Body / chassis LIN bus physical layer (often also inside a CAN/LIN SBC). Used in zone controller, airbag, HVAC, gateway, cluster, TPMS receiver.'}
  switch_detection_interface: {category: interface, label: Multi-switch detection interface (MSDI), note: 'SPI switch-input monitor with wetting current and AMUX (e.g. 22-channel). Used in zone controller, EPS, HVAC, cluster, PLC inputs.'}
  smartcard_interface: {category: interface, label: Contact smart card interface (ISO 7816), note: 'Contact reader analog interface for EMV cards and SAMs (payment terminals, POS).'}
  # added by tools/import_diagrams.py from research files
  acoustic_transducer: {category: audio, label: Microphone / speaker, note: DMIC / ECM / analog mic and speaker / receiver; external customer part, source: external}
  usb_typec_hub: {category: interface, label: USB hub / Type-C port, note: USB 3.x hub and USB-C ports (alt-mode DP) on development / robotics boards, source: external}
