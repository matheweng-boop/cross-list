# Application block diagrams from public Mini-Circuits pages (component-vendor reference), for the block-diagram generator.
# Format follows data/blocks/research/ti_block_diagrams.yaml (docs + applications with groups / links / features / sources).
#
# How these were read: www.minicircuits.com/WebStore/applications/block-diagrams links ten one-page PDFs
# (/pdfs/<name>.pdf). Each PDF was rendered to PNG locally and read; every PDF has a figure with reference designators
# (AMP1, MIX1, ...) and a table "Schematic Part No. -> Sample Mini-Circuits Model Families". The CATV/DOCSIS, drone and
# quantum application pages embed further figures (images.contentstack.io) that were downloaded and read the same way.
# Groups below use the figure's own designators. mc_families = the sample families from each figure's table
# (vendor reference only, not recommendations).
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   groups[].fn_hint   BizDev function ids (data/blocks/functions.yaml). No equalizer / coupler / balun / splitter ids
#                      exist, so those map to rf_passive (proposal: an rf_equalizer id, see comparison.md).
#   links              [from, to, label] = connections drawn in the figure ("" when unlabelled)
#   links_from         figure  = every link is a line drawn in the figure (direction from amplifier / arrow orientation)
#                      partly_inferred = some links (marked "(inferred)" in the label) are not drawn
#   completeness       full | subsystem | minimal - how complete a signal chain the figure shows
#   features[]         design questions a user would answer for this application; choices are options, not answers
#
# Ten Mini-Circuits PDFs read: Transceiver, Repeater, Ku-Band Block Upconverter, Redundant L-Band Amplifier,
# Eight-Element Phased Array, 2.4 GHz QAM Modulator, 4-6 GHz Amplifier, 1-2 GHz Gain/Slope Equalizer, CATV Return Path,
# X7 Multiplier. Plus: DOCSIS 4.0 line extender (CATV page), drone module RF front end (drone page),
# 4-channel AOM driver VGA (quantum page). Drone detection / counter-drone images were photos (product lists only).

docs:
  MC-BD-TRX: {title: "Transceiver - block diagram + model families", url: "https://www.minicircuits.com/pdfs/Transceiver.pdf"}
  MC-BD-RPT: {title: "Repeater - block diagram + model families", url: "https://www.minicircuits.com/pdfs/Repeater.pdf"}
  MC-BD-KUBUC: {title: "Ku-Band Block Upconverter - block diagram + model families", url: "https://www.minicircuits.com/pdfs/KU-BAND%20BLOCK%20UPCONVERTER.pdf"}
  MC-BD-LBAND: {title: "Redundant L-Band Amplifier - block diagram + model families", url: "https://www.minicircuits.com/pdfs/Redundant%20L-Band%20Amplifier.pdf"}
  MC-BD-PA8: {title: "Eight-Element Phased Array - block diagram with power levels", url: "https://www.minicircuits.com/pdfs/Eight-Element%20Phased%20Array.pdf"}
  MC-BD-QAM: {title: "2.4 GHz QAM Modulator - block diagram + model families", url: "https://www.minicircuits.com/pdfs/2.4%20GHz%20QAM%20modulator.pdf"}
  MC-BD-AMP46: {title: "4-6 GHz Amplifier - block diagram + model families", url: "https://www.minicircuits.com/pdfs/4-6%20GHz%20Ampfifier.pdf"}
  MC-BD-EQ: {title: "1-2 GHz Gain/Slope Equalizer - block diagram + model families", url: "https://www.minicircuits.com/pdfs/1-2%20GHz%20Gain_Slope_Equalizer.pdf"}
  MC-BD-CATVRP: {title: "CATV Return Path - block diagram + model families", url: "https://www.minicircuits.com/pdfs/CATV%20Return%20Path.pdf"}
  MC-BD-X7: {title: "X7 Multiplier - block diagram + model families", url: "https://www.minicircuits.com/pdfs/X7%20Multiplier.pdf"}
  MC-APP-CATV: {title: "CATV & Broadband Access (DOCSIS 3.1/4.0) - 'Typical Line Extender Amplifier Block Diagram' + channel-split figure", url: "https://www.minicircuits.com/WebStore/applications/CATV%20Broadband%20DOCSIS", note: "image CATV-Broadband-DOCSIS-Line-Extender-Amplifier-Block-Diagram.png; legend #1-#5 in page text"}
  MC-APP-DRONE: {title: "RF Applications for Drone Modules & Drone Mitigation - 'Drone Module - RF Front-end' figure", url: "https://www.minicircuits.com/WebStore/applications/RF-Applications-for-Drone-Modules-and-Drone-Mitigation", note: "image Drone-module-rf-front-end-products-v1.png"}
  MC-APP-QUANTUM: {title: "Quantum Computing RF & Microwave Solutions - 4-channel VGA (ZT-414) for AOM/AOD drive", url: "https://www.minicircuits.com/WebStore/applications/rf-microwave-quantum-computing-solutions", note: "image Multi-channel-variable-gain-amplifier-for-driving-AOM-v2.png"}

