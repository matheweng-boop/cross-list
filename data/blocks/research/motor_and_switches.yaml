applications:
  # =========================================================================================================
  # PART 1 - MOTOR DRIVES
  # =========================================================================================================
  - id: lev_motor_drive_48v
    name: Light electric vehicle (e-bike / e-scooter / 2- and 3-wheeler) BLDC traction drive
    voltage: "48 V"
    voltage_note: "SLVA642B p.9: rated 48 VDC Li-ion, 500 W; p.11: 24, 36 or 48 V nominal battery. Fig 4-2 input is labelled 'DC input (<100V)'. TI LEV page diagram itself carries no voltage."
    sources:
      - {doc: TI_LEV_PAGE, url: "https://www.ti.com/solution/e_bike", pages: "block diagram (SVG text labels) + subsystem list"}
      - {doc: SLVA642B, url: "https://www.ti.com/lit/pdf/slva642", pages: "9 (Fig 4-2), 10 (Fig 5-1, sensing table), 11 (6.1 voltage rails), 14-15 (6.5 overcurrent, 6.6 brake), 15 (7 Hall), 18 (Fig 8-1, 8.1 MCU)"}
      - {doc: SSZTDA3, url: "https://www.ti.com/lit/pdf/ssztda3", pages: "1, 2 (Fig 1), 3 (Fig 2), 4 (Fig 3)"}
    groups:
      - id: battery
        label: Battery
        blocks: [battery pack]
        source: "SLVA642B p.10 Fig 5-1 (battery to DC link); SSZTDA3 p.2 Fig 1 (48V Battery)"
        fn_hint: []
      - id: input_protection
        label: Input power protection
        blocks: [e-fuse / load switch, reverse polarity protection, hot-swap controller, ideal diode]
        source: "TI LEV page SVG ('E-Fuse / Reverse polarity protection'); SLVA642B p.10 Fig 5-1 ('E-Fuse / Load Switch'); p.9 Fig 4-2 ('eFuse/hot swap controllers', 'Ideal diode')"
        fn_hint: [reverse_polarity, load_switch, tvs_esd]
      - id: power
        label: Non-isolated DC/DC power supply
        blocks: [DC/DC converter, LDO, sequencer]
        source: "TI LEV page SVG; SLVA642B p.10 Fig 5-1; p.11: rails are battery (FETs), 15 V (gate driver), 5 V (MCU); TPS54360 buck 8.5-60 V in, 5 V out (Fig 6-1); SSZTDA3 p.2 Fig 1: 48 V -> DC/DC -> 12 V -> LDO -> 5 V"
        fn_hint: [wide_vin_buck, pol_ldo, sequencer]
        parts: [TPS54360]
      - id: diagnostics
        label: Self-diagnostics / monitoring
        blocks: [temperature sensor, supervisor, watchdog, humidity sensor]
        source: "TI LEV page SVG; SLVA642B p.10 Fig 5-1"
        fn_hint: [temperature_sensor, supervisor, watchdog]
      - id: wired_interface
        label: Wired interface
        blocks: [CAN transceiver, RS-485 transceiver, isolation, circuit protection]
        source: "TI LEV page SVG ('RS-485', 'Isolation', 'CAN'); SLVA642B p.10 Fig 5-1 ('Circuit protection', 'RS485', 'CAN', 'Isolators'); Fig 4-2 adds USB"
        fn_hint: [can_transceiver, rs485_transceiver, digital_isolator, tvs_esd]
      - id: sensor_input
        label: Sensor input interface (rider inputs)
        blocks: [input protection, amplifier, ADC]
        inputs: [throttle, brake assist, wheel speed, cadence, torque, grip and seat detection, electronic gear shift]
        source: "TI LEV page SVG (input list as drawn); SLVA642B p.10 Fig 5-1 (Pedal Assist, Brake -> Circuit protection, AMP, ADC)"
        fn_hint: [tvs_esd, amplifier, adc]
      - id: output_ui
        label: Output user interface
        blocks: [LED driver, audio amplifier]
        loads: [lights, horn]
        source: "TI LEV page SVG; SLVA642B p.10 Fig 5-1"
        fn_hint: ["led_driver (new)", audio_amp]
      - id: processing
        label: Digital processing
        blocks: [MCU, redundant MCU, logic, level shifter]
        source: "TI LEV page SVG ('Redundant MCU', 'Logic', 'Level shifter', 'MCU'); SLVA642B p.10 Fig 5-1; p.18 8.1 (3 ext. interrupts for Hall, 1 for brake, ADC for battery/handlebar/current, PWM to bridge)"
        fn_hint: [mcu, voltage_translator]
      - id: current_voltage_sense
        label: Current and voltage sense
        blocks: [shunt, current-sense amplifier, comparator, voltage reference, ADC]
        source: "TI LEV page SVG ('Amp', 'ADC', 'REF'); SLVA642B p.10 Fig 5-1 ('ADC', 'Amp', 'Shunt', 'Comp', 'REF'); p.13 (LM358 op amp feedback current); p.14 (external comparator overcurrent)"
        fn_hint: [amplifier, adc, voltage_reference]
      - id: power_stage
        label: Power stage
        blocks: [3-phase gate driver, MOSFETs or GaN FETs]
        source: "TI LEV page SVG ('3-Phase Gate driver', 'GaN/FETs'); SLVA642B p.10 Fig 5-1 ('3 Ph Gate Driver', 'FETs' with shunts); p.9 Fig 4-2 ('Gate drivers w/ optional low-side sense amp'); SSZTDA3 p.2 Fig 1 (motor driver DRV8363-Q1 + 6 FETs + 3 low-side shunts)"
        fn_hint: ["three_phase_gate_driver (new; existing gate_driver is isolated)"]
        parts: [DRV8363-Q1, DRV8320S, DRV8323R, DRV8353R]
      - id: angle_sensor
        label: Angle / position sensor
        blocks: [Hall sensors, or inductive sensor, or AMR sensor]
        source: "TI LEV page SVG ('Angle sensor', 'Hall', 'Inductive', 'or', 'AMR'; note 'Inductive or AMR can be sampled directly by MCU ADC'); SLVA642B p.10 Fig 5-1 ('Hall Angle Sensor')"
        fn_hint: ["position_sensor (new)"]
      - id: angle_interface
        label: Sensor front end / angle feedback interface
        blocks: [circuit protection, buffer / level shifter, Schmitt trigger, load switch (sensor supply)]
        source: "SLVA642B p.10 Fig 5-1 ('Angle Feedback Interface'); p.9 Fig 4-2 ('Hall sensor interface: Level translator, Load switch; optional, not required for sensorless control'); TI LEV page SVG ('Sensor front end': Sensor, Protection, FET)"
        fn_hint: [voltage_translator, load_switch, tvs_esd]
      - id: motor
        label: BLDC motor
        blocks: [3-phase BLDC motor]
        source: "SLVA642B p.10 Fig 5-1; SSZTDA3 p.2 Fig 1"
        fn_hint: []
    links:
      - [battery, input_protection, DC link]
      - [input_protection, power, ""]
      - [battery, power_stage, DC link]
      - [processing, power_stage, PWM]
      - [power_stage, motor, 3 phases]
      - [power_stage, current_voltage_sense, shunt / phase signals]
      - [current_voltage_sense, processing, current and voltage]
      - [sensor_input, processing, rider inputs]
      - [processing, output_ui, ""]
      - [processing, wired_interface, CAN / RS-485]
      - [motor, angle_sensor, ""]
      - [angle_sensor, angle_interface, Hall / angle]
      - [angle_interface, processing, angle feedback]
      - [diagnostics, processing, ""]
    links_source: "SLVA642B p.10 Fig 5-1 (arrows as drawn); SSZTDA3 p.2 Fig 1 (PWM inputs, brake control -> ASCIN, CSA -> MCU)"
    features:
      - id: position_sensing
        question: How is rotor position sensed?
        choices: [Hall sensors, sensorless (back-EMF), inductive / AMR angle sensor]
        block: angle_sensor
        filters: {}
        source: "SLVA642B p.10 table 'Sensing Mechanisms' (Hall vs sensorless back-EMF); p.9 Fig 4-2 (Hall interface optional for sensorless); TI LEV page SVG (Hall or Inductive or AMR)"
      - id: current_sensing
        question: Where is phase current measured?
        choices: [low-side shunts + amplifier inside the gate driver, low-side shunt + discrete op amp / current-sense amplifier, isolated amplifier]
        block: current_voltage_sense
        filters: {}
        source: "SLVA642B p.9 Fig 4-2 ('Gate drivers w/ optional low-side sense amp'), p.13 (LM358 discrete); SSZTDA3 p.2 Fig 1 (CSA from motor driver to MCU); TI LEV page subsystem 'Current & voltage sense' (current-sense amplifiers INA180/INA240..., isolated amplifiers AMC0300D-Q1...)"
      - id: active_short_circuit
        question: Active short circuit (brake mode) on supply over-voltage or fault?
        choices: [none, discrete comparators + MCU, integrated in gate driver (pin / SPI / automatic on over-voltage)]
        block: power_stage
        filters: {}
        source: "SSZTDA3 p.1-4: ASCIN pin, SPI trigger, automatic on over-voltage, high- or low-side braking selectable, HS/LS VDS check to avoid shoot-through; discrete solutions need multiple comparators"
      - id: gate_driver_type
        question: Gate driver architecture?
        choices: [3-phase smart gate driver, 3 x half-bridge drivers, isolated gate drivers]
        block: power_stage
        filters: {}
        source: "SLVA642B p.18 Fig 8-1 (DRV8320S 3-phase); TI LEV page 'Power stage' lists BLDC drivers, half-bridge drivers and isolated gate drivers"
      - id: driver_integrated_regulator
        question: Gate driver with integrated buck regulator (to make one of the low-voltage rails)?
        choices: [yes, no]
        block: power_stage
        filters: {}
        source: "SLVA642B p.11 (DRV8323R / DRV8353R internal buck can generate one of the two lesser rails)"
      - id: wired_bus
        question: Which wired interface to the vehicle / display?
        choices: [CAN, RS-485, USB, none]
        block: wired_interface
        filters: {}
        source: "TI LEV page SVG (RS-485, CAN, Isolation); SLVA642B p.9 Fig 4-2 (USB, CAN, RS485)"
      - id: interface_isolation
        question: Isolate the wired interface?
        choices: [yes, no]
        block: wired_interface
        filters: {}
        source: "TI LEV page SVG ('Isolation' in wired interface); SLVA642B p.10 Fig 5-1 ('Isolators')"
      - id: redundant_mcu
        question: Redundant (second) MCU?
        choices: [yes, no]
        block: processing
        filters: {}
        source: "TI LEV page SVG and SLVA642B p.10 Fig 5-1 ('Redundant MCU'). No functional-safety standard is named in these sources."
      - id: input_protection_type
        question: Input power protection?
        choices: [e-fuse, hot-swap controller, ideal diode, load switch, reverse-polarity diode]
        block: input_protection
        filters: {}
        source: "SLVA642B p.9 Fig 4-2, p.10 Fig 5-1, p.12 (diode D5 reverse polarity); TI LEV page SVG"
      - id: switch_type
        question: Power switch technology?
        choices: [Si MOSFET, GaN FET]
        block: power_stage
        filters: {}
        source: "TI LEV page SVG ('GaN/FETs')"

  # ---------------------------------------------------------------------------------------------------------
  - id: lev_traction_inverter_48v_5kw
    name: Two- and three-wheeler traction inverter, 5 kW (TI TIDM-02017)
    voltage: "48 V"
    voltage_note: "TIDUF56 Table 1-1: 48 V DC bus recommended, 60 V max MOSFET VDS, 105 A DC, 150 A RMS; p.3: 90 V DC bus transient capability of DRV3255"
    sources:
      - {doc: TIDUF56, url: "https://www.ti.com/lit/pdf/tiduf56", pages: "1, 2 (Table 1-1), 3 (Fig 2-1, 2.2), 4-5 (2.3)"}
    groups:
      - id: lv_supply
        label: Isolated bias supply from 12 V LV battery
        blocks: [12 V LV battery, flyback converter (transformer), rectifier, buck to 5 V, LDO to 3.3 V, buck from 48 V battery]
        source: "TIDUF56 p.3 Fig 2-1 (LM25184-Q1, rectifier, +12 V isolated, LMR33620-Q1 5 V, TPS7A21-Q1 3.3 V, LMR38010-Q1 from 48 V battery)"
        fn_hint: [isolated_dcdc, wide_vin_buck, pol_ldo]
        parts: [LM25184-Q1, LMR33620-Q1, TPS7A21-Q1, LMR38010-Q1]
      - id: mcu
        label: Real-time MCU
        blocks: [MCU (SPI, ePWM, eQEP, eCAP, MCAN, ADC)]
        source: "TIDUF56 p.3 Fig 2-1"
        fn_hint: [mcu]
        parts: [TMS320F28P65x-Q1]
      - id: gate_driver
        label: Three-phase gate driver
        blocks: [3-phase gate driver with SPI / fault]
        source: "TIDUF56 p.3 Fig 2-1; p.4 2.3.2 (DRV3255-Q1, 3.5 A source / 4.5 A sink, 90 V transient, integrated ASC)"
        fn_hint: ["three_phase_gate_driver (new)"]
        parts: [DRV3255-Q1]
      - id: inverter
        label: Inverter
        blocks: [six-switch MOSFET inverter, 4 MOSFETs in parallel per switch]
        source: "TIDUF56 p.3 Fig 2-1, 2.2; p.2 (IAUT300N10S5N015 MOSFETs)"
        fn_hint: []
      - id: position
        label: Position sensing
        blocks: [position sensor (ABI / PWM), level translator]
        source: "TIDUF56 p.3 Fig 2-1 ('Pos. Sensing' -> TXB0106-Q1 -> eQEP ABI / eCAP PWM)"
        fn_hint: [voltage_translator, "position_sensor (new)"]
        parts: [TXB0106-Q1]
      - id: signal_conditioning
        label: Signal conditioning
        blocks: [phase currents Ia/b/c, DC bus voltage, throttle voltage]
        source: "TIDUF56 p.3 Fig 2-1; p.2 (phase current sensors ACS772ECB-250B, Hall-effect)"
        fn_hint: [amplifier, adc]
      - id: can
        label: CAN
        blocks: [isolated CAN interface]
        source: "TIDUF56 p.3 Fig 2-1 (ISO6731-Q1 -> CAN); p.1 / p.5 (TCAN1044A-Q1 CAN FD transceiver)"
        fn_hint: [can_transceiver, digital_isolator]
        parts: [ISO6731-Q1, TCAN1044A-Q1]
      - id: battery
        label: 48 V battery
        blocks: [48 V traction battery]
        source: "TIDUF56 p.3 Fig 2-1"
        fn_hint: []
      - id: motor
        label: Motor
        blocks: [PMSM or BLDC motor]
        source: "TIDUF56 p.3 2.2"
        fn_hint: []
    links:
      - [lv_supply, mcu, "+3.3 V"]
      - [lv_supply, gate_driver, "+12 V isolated"]
      - [mcu, gate_driver, PWM / SPI / fault]
      - [gate_driver, inverter, gate drive]
      - [battery, inverter, 48 V]
      - [inverter, motor, 3 phases]
      - [motor, position, ""]
      - [position, mcu, ABI / PWM]
      - [signal_conditioning, mcu, "Ia,b,c / Vbus / Vthrottle"]
      - [mcu, can, MCAN]
    features:
      - id: asc
        question: Active short circuit integrated in gate driver?
        choices: [yes, no]
        block: gate_driver
        filters: {}
        source: "TIDUF56 p.4 2.3.2 (DRV3255-Q1 configurable ASC)"
      - id: phase_current_sensor
        question: Phase current sensing method?
        choices: [in-phase Hall-effect current sensor, shunt]
        block: signal_conditioning
        filters: {}
        source: "TIDUF56 p.2 (ACS772 in-phase current sensors)"
      - id: position_interface
        question: Position sensor output?
        choices: [ABI (quadrature encoder, eQEP), PWM (eCAP)]
        block: position
        filters: {}
        source: "TIDUF56 p.3 Fig 2-1"
      - id: bias_from_lv_battery
        question: Bias supply from the 12 V battery through an isolated flyback?
        choices: [yes, no (from traction battery)]
        block: lv_supply
        filters: {}
        source: "TIDUF56 p.3 Fig 2-1, p.4 2.3.3 (LM25184-Q1 PSR flyback, 4.5-42 V in)"
      - id: isolated_can
        question: Isolated CAN?
        choices: [yes, no]
        block: can
        filters: {}
        source: "TIDUF56 p.3 Fig 2-1 (ISO6731-Q1 digital isolator before CAN)"
      - id: parallel_fets
        question: MOSFETs in parallel per switch?
        choices: [1, 4]
        block: inverter
        filters: {}
        source: "TIDUF56 p.3 2.2 (four in parallel)"
      - id: gate_drive_strength
        question: Gate drive peak current?
        choices: ["3.5 A source / 4.5 A sink"]
        block: gate_driver
        filters: {peak_sink_a: 4.5, qualification: automotive}
        source: "TIDUF56 p.4 2.3.2"

  # ---------------------------------------------------------------------------------------------------------
  - id: forklift_inverter_48v_5kw
    name: Forklift / golf cart AC traction inverter power stage, 5 kW (TI TIDA-00364)
