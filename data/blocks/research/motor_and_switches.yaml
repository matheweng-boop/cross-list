  TIDUBP9: {title: "TIDA-00901 Automotive 12 V 200 W (20 A) BLDC Motor Drive Reference Design", url: "https://www.ti.com/lit/ug/tidubp9/tidubp9.pdf", date: "Jun 2016", note: "12 V design, NOT 48 V; read but not used for the 48/72 V entries"}
  AN5324: {title: "Microchip AN5324 High-Power BLDC Motor Driver Reference Design (18-85 V, up to 20S)", url: "https://ww1.microchip.com/downloads/aemDocuments/documents/APID/ApplicationNotes/ApplicationNotes/High-Power-BLDC-Motor-Driver-Reference-Design-DS00005324.pdf", date: "2024"}
  IFX_LEV_PAGE: {title: "Infineon light electric vehicle solutions", url: "https://www.infineon.com/applications/automotive/light-electric-vehicles", note: "diagram infineon-10561-blockdiagram-en.svg; no voltage on the diagram"}
  IFX_EBIKE_PAGE: {title: "Infineon e-bikes", url: "https://www.infineon.com/applications/automotive/light-electric-vehicles/e-bikes", note: "diagram infineon-8437-blockdiagram-en.svg, blocks labelled 36 V"}
  SKY_MMIMO: {title: "Skyworks Massive MIMO application page", url: "https://www.skyworksinc.com/en/Application-Pages/Massive-MIMO", figure: "/-/media/SkyWorks/Images/BlockDiagrams/Massive-MIMO-202410/M-MIMO-block-diagram-rev32.png"}
  SKY_MACRO: {title: "Skyworks Infrastructure - Macro Radio Unit application page", url: "https://www.skyworksinc.com/en/Application-Pages/Infrastructure-Macro-Radio-Unit", figure: "/-/media/SkyWorks/Images/BlockDiagrams/Macro-202410/MacroCell20241001R31.png"}
  SKY_SMALLCELL: {title: "Skyworks Small Cell application page", url: "https://www.skyworksinc.com/en/Application-Pages/Small-Cell", figure: "/-/media/SkyWorks/Images/BlockDiagrams/infra-small-cell-2023/v1/Small-Cell-20241016.png"}
  SKY_BD_SMALLCELL: {title: "Skyworks block diagram: Small Cell Base Station", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/BlockDiagrams/Small_Cell_Basestation.pdf"}
  SKY_BD_TELEMATICS: {title: "Skyworks block diagram: Telematics and Infotainment", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/BlockDiagrams/Telematics_and_Infotainment.pdf"}
  SKY_BD_V2X: {title: "Skyworks block diagram: Car-to-Car Communications 802.11P", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/BlockDiagrams/Car_to_Car_Communication.pdf"}
  SKY_BD_WIFI_NET: {title: "Skyworks block diagram: 802.11a/b/g/n/ac Single-band WiFi Front-end Components - Networking", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/BlockDiagrams/SB_FEM_Solutions_Networking.pdf"}
  SKY_BD_PHONE_ASM: {title: "Skyworks block diagram: Smartphone Using Discrete Switches or Antenna Switch Modules (ASMs)", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/BlockDiagrams/Smartphone_Using_Discrete_Switches_or_ASMs.pdf"}
