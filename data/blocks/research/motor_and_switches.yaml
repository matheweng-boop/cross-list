# Research extract from public vendor documents, for the block-diagram generator.
# Part 1: 48 V .. ~100 V motor drives (light electric vehicles, forklifts, 48 V automotive).
# Part 2: application block diagrams that show where RF switches sit (Skyworks).
# Every group, link and feature cites the page / figure it comes from. Nothing is a Cross List rule yet;
# see motor_and_switches.md for prose, gaps and discrepancies.
#
# Field notes (extras beyond the requested schema, same conventions as ti_power.yaml):
#   voltage            nominal bus voltage the SOURCE states (not inferred)
#   groups[].source    where the group is drawn
#   groups[].fn_hint   closest existing function ids in data/blocks/functions.yaml (hint only; "(new)" = none fits)
#   groups[].parts     vendor part numbers the document names for that group (reference only, not Skyworks)
#   features[].filters existing Cross List parameter names where one fits (peak_sink_a, qualification,
#                      configuration, control_interface); otherwise a plain-words attribute marked "(new)".
#   links              [from_group, to_group, label] as drawn (arrow direction as drawn where the figure has one)

