# Application block diagrams from public NXP application pages (vendor reference), for the block-diagram generator.
# Complements rf_platforms.yaml (NXP connected radio, V2X, smart car access, Wi-Fi AP, Wi-Fi 6 combo, 5G mMIMO, O-RAN RU,
# small cell, 77 GHz radar, smartphone). Nothing here repeats those entries or the applications in templates.yaml.
# See nxp_more_block_diagrams.md for sources read, method and gaps. Read 2026-10-19.
#
# How these were read: each nxp.com/applications/<APP> page embeds its block diagram(s) as SVG with a text layer, plus an
# interactive "Functional Blocks" panel that lists NXP products per block. The SVG was rendered locally (headless browser,
# no network) and read; groups below are the boxes the figure draws, in the page's own words. "pages" for a source = SVG
# file name + Functional Blocks list. One application (refrigerator compressor) is a JPG with no product list.
# vendor_parts are the NXP products the page's Functional Blocks panel attaches to that block, written exactly as NXP
# lists them (some are family names such as TJA144x, KM3x, MCX-A13X-A14X-A15X). Reference only, not recommendations.
# Blocks NXP draws grey ("Non NXP Technology") have empty vendor_parts; they are often the open sockets.
#
# Field notes (same conventions as ti_block_diagrams.yaml, with vendor_parts instead of ti_parts):
#   category           one of the Cross List application categories
#   groups[].fn_hint   Cross List function ids (data/blocks/functions.yaml); ids not yet there are defined under new_functions
#                      at the end of this file. Empty when no function fits (e.g. squib driver, PSI5 / DSI3 transceiver).
#   links              [from, to, label] = arrows / buses drawn in the figure (label "" when unlabelled). Direction follows
#                      the arrow where the figure has one; most NXP figures draw double-headed arrows (written MCU-first).
#   features[]         high-level design questions a user would answer for this application; choices are options, not answers

