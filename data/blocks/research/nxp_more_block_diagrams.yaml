applications:
  # =========================================================================================================
  # Automotive systems
  # =========================================================================================================
  - id: nxp_zone_controller
    name: "Automotive zone controller (body / zonal I/O, CAN/LIN, Ethernet switch, smart high-side switches)"
    category: Automotive systems
    sources:
      - {doc: NXP_ZONE, url: "https://www.nxp.com/applications/AUTOMOTIVE-ZONE-CONTROLLER", pages: "SVG AUTOMOTIVE-ZONE-CONTROLLER-BD3 ('Zone Controller Solutions'); system view AUTOMOTIVE-ZONE-CONTROLLER-BD-ASP-NEW1; Functional Blocks lists"}
    groups:
      - {id: vbat, label: "VBAT1 / VBAT2 with reverse diodes", blocks: [VBAT1, VBAT2, diode OR-ing to 12 V], source: "ZONE BD3 (VBAT1/VBAT2 grey blocks, diodes, 12V)", fn_hint: [reverse_polarity], vendor_parts: []}
      - {id: pmic, label: "PMIC (x2: MCU/CAN supply, Ethernet supply)", blocks: [PMIC 12 V -> 3.3 V / 5 V (Supply_MCU_CAN), PMIC (VSUP -> Supply_ETH)], source: "ZONE BD3 (two 'PMIC' blocks); Functional Blocks 'PMIC: FS26'", fn_hint: [pmic], vendor_parts: [FS26]}
      - {id: mcu, label: "Zone MCU", blocks: [MCU], source: "ZONE BD3 ('MCU'); Functional Blocks 'MCU: S32K5, S32K3'", fn_hint: [mcu], vendor_parts: [S32K5, S32K3]}
      - {id: can, label: "CAN transceivers (8x)", blocks: [8x CAN (SIG) transceivers], source: "ZONE BD3 ('CAN (8x)', 'CAN Tx/Rx'); Functional Blocks 'CAN: TJA1463'", fn_hint: [can_transceiver], vendor_parts: [TJA1463]}
      - {id: lin, label: "LIN transceivers (2x 4-channel)", blocks: [LIN (UART Tx/Rx), LIN (SPI)], source: "ZONE BD3 (two 'LIN' blocks, 4x LIN each); Functional Blocks 'LIN: TJA1124'", fn_hint: [lin_transceiver], vendor_parts: [TJA1124]}
      - {id: hs_switch, label: "Quad high-side switches (loads)", blocks: [Quad HS-Switch x2 (3.3 V / 5 V / 12 V, SPI)], source: "ZONE BD3 ('Quad HS-Switch' x2); Functional Blocks 'Quad HS-Switch: XS2410'", fn_hint: [load_switch], vendor_parts: [XS2410]}
      - {id: msdi, label: "22-ch multi-switch detection interface", blocks: [22-ch MSDI (SPI + AMUX to MCU)], source: "ZONE BD3 ('22-ch Multi Switch Detection Interface'); Functional Blocks '22Ch MSDI: MC33978'", fn_hint: [switch_detection_interface], vendor_parts: [MC33978]}
      - {id: eth_switch, label: "Ethernet switch", blocks: [Ethernet switch (SGMII to PHYs, 3x 100BASE-T1, RGMII to MCU)], source: "ZONE BD3 ('Ethernet Switch'); Functional Blocks 'Ethernet Switch: SJA1110'", fn_hint: [ethernet_phy], vendor_parts: [SJA1110]}
      - {id: eth_phy, label: "1000BASE-T1 PHYs (x2)", blocks: [1000BASE-T1 PHY x2 (SGMII)], source: "ZONE BD3 ('1000BASE-T1' x2); Functional Blocks '1Giga Ethernet Phy: TJA1121'", fn_hint: [ethernet_phy], vendor_parts: [TJA1121]}
      - {id: qflash, label: "QSPI flash", blocks: [QFLASH], source: "ZONE BD3 ('QFLASH', QSPI to Ethernet switch)", fn_hint: [flash], vendor_parts: []}
      - {id: io, label: "Loads, switch inputs and vehicle I/O", blocks: [I/O (loads and switches)], source: "ZONE BD3 ('I/O' grey block)", fn_hint: [external_block], vendor_parts: []}
      - {id: central, label: "Central computer / ECU nodes (system view)", blocks: [central computer, zone controllers, ECU nodes], source: "ZONE BD-ASP-NEW1; Functional Blocks 'Central Computer: S32G3, S32N5, SJA1110, VR5510'", fn_hint: [soc], vendor_parts: [S32G3, S32N5, VR5510]}
    links:
      - [vbat, pmic, "12 V"]
      - [pmic, mcu, "Supply_MCU_CAN 3.3 V / 5 V"]
      - [pmic, eth_switch, "Supply_ETH"]
      - [can, mcu, "CAN Tx/Rx"]
      - [lin, mcu, "UART Tx/Rx / SPI"]
      - [mcu, hs_switch, "SPI"]
      - [msdi, mcu, "SPI / AMUX"]
      - [hs_switch, io, ""]
      - [io, msdi, "switch inputs"]
      - [mcu, eth_switch, "RGMII / SPI"]
      - [eth_switch, eth_phy, "SGMII"]
      - [qflash, eth_switch, "QSPI"]
      - [eth_switch, central, "100BASE-T1 / 1000BASE-T1 Ethernet"]
    features:
      - {id: zone_role, question: "Zone controller role", choices: ["zone I/O aggregator (MCU)", "zone + local compute (S32G / S32N class)"], source: "ZONE Functional Blocks (Zone Controller lists S32K3/K5 and S32G2/G3, S32Z2, S32E2)"}
      - {id: backbone, question: "Backbone link to the central computer", choices: ["100BASE-T1", "1000BASE-T1", "multi-gig"], source: "ZONE BD3 (100BASE-T1 and 1000BASE-T1 ports)"}
      - {id: can_count, question: "Number of CAN (FD / SIC) channels", choices: ["1-4", "5-8", ">8"], source: "ZONE BD3 ('8x CAN (SIG)')"}
      - {id: load_switching, question: "Load switching", choices: ["smart high-side switches (eFuse)", "relays", "mixed"], source: "ZONE BD3 ('Quad HS-Switch')"}
      - {id: supply_redundancy, question: "Redundant battery feed", choices: ["single VBAT", "dual VBAT (VBAT1/VBAT2)"], source: "ZONE BD3 (VBAT1, VBAT2 with diodes)"}

