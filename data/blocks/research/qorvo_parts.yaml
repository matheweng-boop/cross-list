# Research extract: public Qorvo product data (competitor/companion reference) for the block-diagram generator.
# Nothing here is a BizDev rule yet. See qorvo_access.md for what was reachable / blocked and the options.
#
# Every part below was read on 2026-10-19 from its own public product page on store.qorvo.com (Qorvo's online
# store, operated by RFMW). key_specs are copied verbatim from that page's "Specifications" table (field names
# as shown there); summary is the page's "Product Description"; status is the page's lifecycle status.
# key_specs: {} means the page had a description but no parametric table. features (motor controllers) are the
# page's "Key Features" bullets where present. These are distributor-catalogue values, not datasheet-verified.
#
# Function ids reuse data/blocks/functions.yaml where one fits (pmic, wide_vin_buck, buck_boost, rf_switch).
# New ids, not yet in functions.yaml: motor_controller (PAC: MCU + gate drivers + power manager in one SoC),
# power_loss_protection (eFuse + storage-cap buck/boost for SSDs), cc_regulator, rf_pa_bias.
#
# Known gaps / caveats:
#   - sic_fet: 0 parts. Qorvo sold its SiC JFET business (UnitedSiC: UJ3/UJ4/UF3/UF4/UG4) to onsemi; deal closed
#     Jan 2025 (https://investor.onsemi.com/news-releases/news-release-details/onsemi-completes-acquisition-qorvos-silicon-carbide-jfet).
#     All 67 UnitedSiC store pages tried returned 404 (6 more stayed 403); onsemi.com returned 403 (Akamai). These are onsemi parts now.
#   - gate_driver: 0 standalone parts in the store catalogue. Qorvo's gate drivers are integrated in the PAC
#     motor controllers (see Gate Drivers fields there).
#   - ldo: no standalone Qorvo LDO category exists in the store; LDOs appear only inside PMICs.
#   - "automotive ACT88xxx": none of the PMIC pages read here is marked AEC-Q100; only ACT4529 (buck) and
#     QPC8013Q (switch) mention AEC-Q100 in the store text.
#   - QPC8014Q: description says SP6T but the spec table says SP4T (copied as-is; check datasheet).
#   - ACT88760: rfmw.com page gives "10 GPIOs"; third-party summaries mention 11. Input 2.6-5.5 V per page text.
#   - Only one orderable variant per base part was read (e.g. ACT88760-101 not -104); variants differ in
#     default OTP configuration, not in the parametric table.
#   - 7 pages stayed 403 (Azure Application Gateway rate limit) after one slower retry and are not included:
#     QPC1022 and six UnitedSiC parts.
source_notes: >-
  qorvo.com (www and cn): HTTP 429 "Vercel Security Checkpoint" (JS bot challenge) on every URL incl. robots.txt;
  not bypassed. store.qorvo.com (RFMW-run Qorvo store): HTTP 200 with server-rendered spec tables; sitemap.xml
  (6744 URLs, last updated 2024-11-09) used for discovery since /search is robots-disallowed; ~1 req/s caused
  intermittent Azure App Gateway 403s, retried once at 1 req/3 s. rfmw.com detail pages: 200, same data.
  mouser.com: "Access Denied" (Akamai); digikey.com, everythingrf.com: 403 Cloudflare "Just a moment";
  onsemi.com: 403. 82 Qorvo parts verified (19 PMIC, 3 power-loss-protection, 7 buck, 2 buck-boost, 1 CC
  regulator, 29 motor controller, 1 RF PA bias, 20 RF switch, 0 SiC FET, 0 standalone gate driver).
