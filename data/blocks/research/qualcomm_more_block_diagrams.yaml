# More application block diagrams from public Qualcomm documents (platform vendor reference), for the
# block-diagram generator. Complements rf_platforms.yaml (Qualcomm entries: X80/X85 modem-RF phone, FastConnect 7900,
# NPro A8 Elite AP, FWA CPE, QCC711/QCS6490 IoT, Snapdragon Auto telematics). Nothing here repeats those entries.
# See qualcomm_more_block_diagrams.md for the sources read, what was not reachable, and the gaps.
#
# How these were read (2026-10-19): public PDFs on docs.qualcomm.com (listed in its public sitemap.xml, no login),
# two PDFs linked from public qualcomm.com product pages (content/dam), and qualcomm.com ".md" product pages listed in
# qualcomm.com/en-us/*/llms.txt. Diagrams were rendered locally from the PDFs and read as images; text was taken with
# pdftotext. Where a brief draws a block diagram, groups are the boxes as drawn; where it has only a spec table or a
# parts list, groups are the listed items, and the source string says so ("spec table", "parts list", "text").
# Qualcomm product briefs mostly draw the inside of the chip; external sockets come from the spec tables, the
# "contributing chipsets" / parts lists of the reference designs, and two public reference schematics (QCC730, QCC74x).
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   category           application category (Cross List category names)
#   groups[].side      rf where the group is in the antenna path; omitted otherwise
#   groups[].fn_hint   Cross List function ids (functions.yaml) for the blocks; ids proposed here are under new_functions
#   groups[].vendor_parts  part numbers the Qualcomm document itself names for that group (Qualcomm or third party;
#                      reference only, not recommendations). Empty when the document names none.
#   links              [from, to, label] = arrows / buses drawn in the figure (label "" when unlabelled); for spec-table
#                      applications the links are the interfaces the table names (source string on the application)
#   features[]         high-level design questions a user would answer; choices are options, not answers
#   features[].filters existing Cross List parameter names where one fits; otherwise a plain-words attribute marked "(new)"

new_functions:
  mems_sensor: {label: "Sensor: IMU / pressure / humidity / light / proximity", category: sensors, note: "MEMS and environmental sensors around a processor or sensing hub (accel + gyro, magnetometer, barometer, humidity, ALS, proximity, PPG, bone-conduction voice)"}
  haptic_driver: {label: Haptic (LRA / ERM) driver, category: audio, note: "Vibration motor driver; may be inside a wearable PMIC (Snapdragon W5 PMW5100)"}
  acoustic_transducer: {label: Microphone / speaker, category: audio, note: "DMIC / ECM / analog mic and speaker / receiver; external customer part"}
  usb_typec_hub: {label: USB hub / Type-C port, category: interface, note: "USB 3.x hub and USB-C ports (alt-mode DP) on development / robotics boards"}

