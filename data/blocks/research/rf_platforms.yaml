# Research extract from public platform-vendor documents (MediaTek, Qualcomm, NXP), for the block-diagram generator.
# Goal: show the RF front-end "sockets" around each platform chipset (SoC / modem / Wi-Fi / BT / UWB / V2X / radio)
# that Skyworks or Qorvo parts fill (switches, LNAs, PAs / FEMs, antenna tuners, filters, clocks, PMICs, tuners).
# Every group, link and feature cites the page / figure it comes from. Nothing is a BizDev rule yet;
# see rf_platforms.md for prose, what was blocked or gated, gaps, and the proposed new function ids.
# Read 2026-10-19. Same schema and field conventions as motor_and_switches.yaml, plus:
#
#   groups[].socket      true  = a block that a Skyworks / Qorvo-type part fills (external RF front end, clock,
#                                PMIC, tuner ...). false / absent = the platform chip itself or a non-RF part.
#   groups[].socket_fn   which function(s) fill the socket (existing ids, or "<id> (new)" from rf_platforms.md)
#   groups[].drawn       how the block is known: "drawn" (on the vendor diagram), "text" (stated in vendor text /
#                        spec table, not drawn), "inferred" (NOT stated by the vendor: added because the stated spec
#                        needs it; e.g. a 4x4 Wi-Fi radio needs 4 front-end chains). Omitted = drawn.
#   groups[].parts       part numbers the VENDOR names for that group (reference only; not Skyworks / Qorvo).
#   features[].filters   existing BizDev parameter names where one fits (configuration, control_interface,
#                        qualification, broadcast "feature"); otherwise a plain-words attribute marked "(new)".
#   links                [from_group, to_group, label] as drawn (arrow direction as drawn where the figure has one)
#
# Diagram text was taken from the SVG text layer (NXP application pages) or by viewing the image (JPG/PNG).
# MediaTek and Qualcomm publish no board-level RF front-end diagrams publicly (see rf_platforms.md): their
# applications below are built from public spec tables and product briefs and are marked drawn: text / inferred.

