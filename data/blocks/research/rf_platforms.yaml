applications:
  # =========================================================================================================
  # NXP
  # =========================================================================================================
  - id: nxp_connected_radio
    name: Automotive connected radio / entry infotainment (AM/FM/DAB tuner + Wi-Fi/BT + MPU)
    vendor: NXP
    sources:
      - {doc: NXP_CONNECTED_RADIO, url: "https://www.nxp.com/applications/INFOTAINMENT-CONNECTED-RADIO", figure: "CONNECTED-RADIO-BD-ASP-NEW4 (SVG text) + Functional Blocks product lists"}
      - {doc: NXP_ECOCKPIT, url: "https://www.nxp.com/applications/MID-HIGH-INFOTAINMENT-ECOCKPIT", figure: "ECOCKPIT-BD-ASP-NEW3 / BD2-ASP3: same layout plus 'Celluar' and 'Wi-Fi Bluetooth' blocks"}
      - {doc: NXP_SAF9000_PAGE, url: "https://www.nxp.com/products/SAF9000", figure: "SAF9000-BD-NEW.svg"}
      - {doc: NXP_SAF9800_PAGE, url: "https://www.nxp.com/products/SAF9800", figure: "SAF9800-BD.jpg"}
      - {doc: NXP_TLH501X_PAGE, url: "https://www.nxp.com/products/TLH501x", figure: "TLH501X-BD.jpg"}
    groups:
      - id: antenna
        label: AM/FM/DAB antenna(s)
        blocks: [vehicle antenna(s); SAF9000 diagram draws one antenna input per tuner (Tuner1..Tuner5); SAF9800 two]
        source: "SAF9000-BD-NEW.svg (Tuner1-Tuner5 inputs); SAF9800-BD.jpg (two antenna symbols into Tuner1/Tuner2)"
        fn_hint: [antenna]
        socket: false
      - id: rf_amplifier
        label: RF amplifier (active antenna LNA)
        blocks: [AM LNA + AGC, FM LNA + AGC, attenuators, diagnostic, regulator]
        source: "CONNECTED-RADIO SVG ('RF Amplifier' between antenna and Radio Chipset); Functional Blocks 'RF Amplifier: TLH501x ALNA - Low Noise Active Antenna Amplifier (No Longer Manufactured)'; TLH501X-BD.jpg (TLH5018: FM LNA, AM LNA, FM/AM attenuator + AGC, AM buffer, diagnostic, regulator 5 V)"
        fn_hint: [lna]
        parts: [TLH501x (TLH5018)]
        socket: true
        socket_fn: [lna, "active_antenna_amp (new)"]
        note: "NXP's own part is No Longer Manufactured -> open socket"
      - id: radio_chipset
        label: Radio chipset (tuner + radio/audio processor)
        blocks: [wideband RF front end (1-5 tuners), radio processing DSP (AM/FM, DAB, HD Radio, DRM, CDR), audio DSP, Arm M7]
        source: "CONNECTED-RADIO SVG ('Radio Chipset'); Functional Blocks 'Radio Chipset: SAF9000 One-Chip Solution for Radio and Audio Processing; SAF9800; SAF4000 Multi-Standard SDR Processor With Integrated Audio; TDF8541 4x45 W amplifier'; SAF9000-BD-NEW.svg (Tuner1-5, AM/FM, DAB, HD radio, DRM, CDR)"
        fn_hint: [am_fm_tuner, digital_radio_demod, single_chip_radio]
        parts: [SAF9000, SAF9800, SAF4000, TEF665X]
        socket: true
        socket_fn: [am_fm_tuner, digital_radio_demod]
        note: "a Skyworks broadcast tuner / coprocessor is the alternative here (competitive socket)"
      - id: radio_clock
        label: Crystal for the radio SoC
        blocks: [Xtal]
        source: "SAF9000-BD-NEW.svg ('Xtal'); SAF9800-BD.jpg ('Xtal' outside the SoC, grey = non-NXP)"
        fn_hint: [crystal_oscillator]
        socket: true
        socket_fn: [crystal_oscillator]
      - id: radio_flash
        label: Radio SoC flash (optional)
        blocks: [qSPI / oSPI flash]
        source: "SAF9000 / SAF9800 diagrams ('Flash (optional)')"
        fn_hint: [flash]
        socket: false
      - id: wifi_bt
        label: Wi-Fi / Bluetooth
        blocks: [2x2 Wi-Fi 6 + BT 5.3 automotive combo]
        source: "CONNECTED-RADIO SVG ('WiFi/Bluetooth'); Functional Blocks 'Bluetooth: 88Q9098'"
        fn_hint: ["wifi_soc (new)"]
        parts: [88Q9098]
        socket: false
      - id: wifi_frontend
        label: Wi-Fi front-end modules + diplexer (per antenna)
        blocks: [front-end module (PA + LNA + T/R switch) x2, diplexer x2]
        drawn: "drawn on the 88Q9098 product-page application diagram, not on the radio page"
        source: "88Q9098_BD_EXT_APP1.jpg (two 'Front-End Modules' each fed by Wi-Fi 5 GHz + 2.4 GHz, each into a 'Diplexer' and antenna; Bluetooth Tx/Rx direct to its own antenna)"
        fn_hint: [rf_frontend]
        socket: true
        socket_fn: ["wifi_fem (new)", "diplexer (new)"]
      - id: cellular
        label: Cellular modem (eCockpit variant)
        blocks: [cellular modem]
        source: "ECOCKPIT-BD-ASP-NEW3 SVG ('Celluar' block next to Wi-Fi/Bluetooth); no NXP product listed"
        fn_hint: ["modem (new)"]
        socket: false
        note: "non-NXP block; its RF front end is not drawn"
      - id: mpu
        label: Applications processor
        blocks: [MPU]
        source: "CONNECTED-RADIO SVG ('MPU'); Functional Blocks 'MPU: i.MX6SX, i.MX6UL'; eCockpit: i.MX8X / i.MX8"
        fn_hint: [soc]
        parts: [i.MX6SX, i.MX6UL, i.MX8X, i.MX8]
      - id: memory
        label: Memory
        blocks: [DDR, flash]
        source: "CONNECTED-RADIO SVG ('DDR Memory', 'Flash Memory')"
        fn_hint: [ddr_flash]
      - id: pmic
        label: Power management IC
        blocks: [PMIC / SBC]
        source: "CONNECTED-RADIO SVG ('PowerManagementIC'); Functional Blocks 'PF0300 Multi-Channel (4) PMIC for Automotive Radio Applications - 3 LVBUCK and 1 LDO', PF8101/PF8201, MMPF0100, PF7100, PF5024, PF5020, PF81-PF82, VR5500, VR5510, FS5600; SAF9800-BD.jpg ('Power Supply PF0300')"
        fn_hint: [pmic, pol_buck, pol_ldo]
        parts: [PF0300, PF8101-PF8201, MMPF0100, PF7100, PF5024, PF5020, PF81-PF82, VR5500, VR5510, FS5600]
        socket: true
        socket_fn: [pmic]
      - id: audio_amp
        label: Audio amplifier
        blocks: [class-AB/D car audio amplifier]
        source: "CONNECTED-RADIO SVG ('AudioAmplifier'); Functional Blocks 'Audio Amplifier: MC_55974 Car Audio Amplifiers'; TDF8541 listed under Radio Chipset"
        fn_hint: [audio_amp]
        parts: [TDF8541]
      - id: vehicle_network
        label: Vehicle network
        blocks: [CAN / LIN transceiver, 100 Mbps Ethernet, Gigabit Ethernet switch, 100/1000BASE-T1 PHY]
        source: "CONNECTED-RADIO SVG; Functional Blocks (TJA144x, TJA1044, TJA1043, TJA1463, TJA1128; TJA1104, TJA1102A, TJA1103, TJA1101, TJA1120)"
        fn_hint: [can_transceiver, ethernet_phy]
      - id: nfc
        label: NFC tag
        blocks: [NFC tag with I2C]
        source: "CONNECTED-RADIO SVG ('NFC Tag'); Functional Blocks 'NCx3310'"
        fn_hint: ["nfc_frontend (new)"]
        parts: [NCx3310]
      - id: hmi
        label: Display / keypad / GPIO / camera / USB / SD
        blocks: [color TFT LCD, display/push-button driver, LED indication, GPIO expander, keypad/sensor inputs, camera input, USB, SD card]
        source: "CONNECTED-RADIO SVG; Functional Blocks (PCAL9714, PCAL9722, MC_71502 LED driver)"
        fn_hint: [led_driver, io_expander, tvs_esd]
    links:
      - [antenna, rf_amplifier, RF]
      - [rf_amplifier, radio_chipset, RF]
      - [radio_clock, radio_chipset, Xtal]
      - [radio_chipset, mpu, audio / control]
      - [radio_chipset, audio_amp, audio]
      - [wifi_bt, mpu, ""]
      - [wifi_bt, wifi_frontend, "Wi-Fi 2.4 / 5 GHz"]
      - [mpu, memory, ""]
      - [mpu, vehicle_network, CAN / LIN / Ethernet]
      - [pmic, mpu, rails]
      - [pmic, radio_chipset, rails]
