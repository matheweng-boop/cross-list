      - {id: antenna, label: "Antenna", blocks: [antenna], source: "figure", fn_hint: [antenna]}
      - {id: preselector, label: "BPF (preselector)", blocks: [RF band-select filter], source: "figure", fn_hint: [filter_saw_baw]}
      - {id: lna, label: "LNA (low noise)", blocks: [LNA], source: "figure", fn_hint: [lna]}
      - {id: image_filter, label: "Image reject filter", blocks: [image-reject BPF, 40-60 dB image rejection], source: "figure", fn_hint: [filter_saw_baw]}
      - {id: lo, label: "LO", blocks: [local oscillator], source: "figure", fn_hint: [rf_synthesizer, crystal_oscillator]}
      - {id: mixer, label: "Mixer (downconverter)", blocks: [mixer], source: "figure", fn_hint: [rf_mixer]}
      - {id: if_filter, label: "IF BPF (channel)", blocks: [crystal / ceramic / SAW IF filter], source: "figure + page text", fn_hint: [filter_saw_baw]}
      - {id: if_amp, label: "IF amp (AGC)", blocks: [IF amplifier with AGC, 40-80 dB gain], source: "figure", fn_hint: [rf_gain_block]}
      - {id: demod, label: "Demodulator (AM/FM/PM) -> audio/data out", blocks: [envelope detector / discriminator / IQ demodulator], source: "figure", fn_hint: [rf_mixer, soc]}
    links:
      - [antenna, preselector, "f_RF"]
      - [preselector, lna, "f_RF"]
      - [lna, image_filter, ""]
      - [image_filter, mixer, ""]
      - [lo, mixer, "LO"]
      - [mixer, if_filter, "f_IF"]
      - [if_filter, if_amp, "f_IF"]
      - [if_amp, demod, ""]
    features:
