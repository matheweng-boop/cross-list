# Application / signal-chain block diagrams from RF Essentials (https://rfessentials.com), public pages only.
# Site: RF Essentials, St. Petersburg FL - a US maker of waveguide / mmWave components that also publishes an open RF
# engineering reference (block-diagram library, knowledge base, glossary, calculators, articles). robots.txt allows "/"
# for all agents (disallows only /conductor/, /.gemini/, /content/); nothing here came from those paths.
# See comparison.md for how these compare with the current library and tech_notes.yaml for the technical notes.
#
# How these were read: each /resources/block-diagrams/<slug>/ page embeds ONE inline SVG (no image file). The SVG was
# extracted, rendered locally (Pillow) and viewed, and its <line>/<rect> geometry was dumped to check which box each
# arrow touches. Groups below are the boxes in the figure, labelled in the figure's own words; "blocks" adds the page
# text's description. The figures are generic textbook signal chains (no part numbers, no vendor) - architecture
# references, not reference designs. Spec ranges in features come from each page's "Typical Specifications" table.
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   links_basis      figure            = groups and links read from the rendered figure (arrows / lines drawn)
#                    figure_corrected  = read from the figure, but one or more arrow directions in the figure are
#                                        physically reversed or the layout is garbled; links here give the physical
#                                        signal direction and the note says what was changed
#                    inferred_from_text = the page has no block diagram; groups and links were inferred from the
#                                        article's ordered prose description of the chain (no figure behind them)
#   groups[].fn_hint BizDev function ids (data/blocks/functions.yaml). Waveguide/cavity filters are mapped to
#                    filter_saw_baw (the library's generic RF filter id) - see comparison.md for the caveat.
#   links            [from, to, label] ("" when unlabelled)
#   features[]       design questions a user would answer; choices are options, not answers
# Not included: "Noise Figure Measurement Setup (Y-Factor)" (4 boxes: noise source -> DUT -> power meter -> calc;
# a bench setup, not an application signal chain). It is summarised in tech_notes.yaml instead.
# Article hero images (/images/*.webp) were checked (2 of them): they are decorative photos, not diagrams.

