      - {id: lna_nf, question: "LNA noise figure target", choices: ["0.5-1 dB", "1-2 dB", "2-3 dB"], filters: "nf_db", source: "spec table: 0.5-3.0 dB"}
      - {id: if_filter_tech, question: "IF channel filter technology", choices: [crystal, ceramic, SAW], filters: "filter technology (new)", source: "page text"}

