# TI end-equipment application block diagrams (public ti.com/solution pages), for the block-diagram generator.
# Same format as data/blocks/research/ti_block_diagrams.yaml (docs / applications with groups, links, features) so the
# entries can become library templates. 40 end equipments NOT already covered by data/blocks/research/*.yaml,
# data/blocks/templates.yaml or data/blocks/background_templates.yaml (checked by name; e.g. telecom rectifier skipped as
# the same application as the existing server / telecom 54 V AC/DC PSU).
#
# Collected 2026-10-19 from https://www.ti.com/applications/overview.html -> https://www.ti.com/solution/<app>.
# robots.txt checked (only /bin/ti/, search and myti paths are disallowed; Crawl-delay 1); one request at a time,
# >= 1.5 s apart, browser User-Agent, no log-in, no forms. Public information only.
#
# How these were read: each solution page embeds its block diagram as a Visio SVG and its clickable subsystem list as
# JSON (const VARIANT_LIST in the page source: per variant an SVG and per subsystem a name, description, TI product
# families and reference designs). For the default variant of each page the SVG was rendered locally (cairosvg) and read.
#   groups      = the red dashed subsystem boxes (one per VARIANT_LIST subsystem, id = slug of its name; some pages with
#                 20-44 subsystems are merged into functional groups, the source field lists the merged subsystems).
#                 Groups whose source says "drawn outside the subsystem boxes" are the plain boxes / symbols of the figure
#                 (battery, motor, sensor array, ...), added so the links have endpoints.
#   blocks      = the text of the dark boxes inside each subsystem box (taken from the SVG <text> of the subsystem's group).
#   ti_parts    = the first parts of each TI product family the page attaches to the subsystem (competitor reference only,
#                 not recommendations; empty where the page lists none).
#   links       = arrows / connecting lines drawn in the figure, read from the rendered image ([from, to, label], label ""
#                 when unlabelled). Two pages (wireless EV charging station, cell site gateway router) draw the subsystems
#                 without connectors; their links follow the subsystem descriptions and are marked with a comment.
#   features    = high-level design questions for the application; choices are options, not answers. "source" names the
#                 page variant / subsystem that motivates the question.
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   groups[].side      lv | hv | barrier | field | backplane | rf where the figure draws an isolation barrier / domain;
#                      omitted when not meaningful
#   groups[].fn_hint   BizDev function ids (top-level keys of data/blocks/functions.yaml) derived from the block names and
#                      the TI product families of the subsystem; hints, not a bill of materials
#   features[].filters existing BizDev parameter / function names where one fits; otherwise a plain-words attribute
#                      marked "(new)"
#
# Function ids that would help but do not exist yet in functions.yaml (proposals only, not used above):
#   power_line_comm   - PV / meter power-line-communication modem (solar optimizer, rapid shutdown)
#   laser_driver      - pulsed laser-diode driver for LiDAR / ToF (optical_driver is for telecom lasers)
#   tdc               - time-to-digital converter (LiDAR ToF)
#   analog_mux        - precision analog switch / multiplexer
#   rs232_transceiver - RS-232 line driver / receiver
#   logic_gate        - discrete logic, buffers, level-shifting glue (gate-driver glue logic in power stages)
#   contactor_driver  - HV contactor coil driver with economizer PWM (HV PDB, BDU)
#   pyro_driver       - pyrofuse squib driver (could reuse isolated_switch_driver today)

