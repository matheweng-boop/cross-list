    groups:
      - {id: ac_input, label: "AC/DC EMI filter", side: hv, blocks: [EMI filter, rectifier, X-cap discharge], source: "TI-SOL-OBC SVG (AC power from grid -> AC/DC EMI filter)", fn_hint: [pre_regulator], ti_parts: []}
      - {id: pfc_stage, label: "PFC power stage", side: hv, blocks: [PFC power stage, PFC gate driver (isolated), shunt / magnetic current sensor], source: "TI-SOL-OBC SVG", fn_hint: [gate_driver], ti_parts: [UCC21330-Q1, UCC21550-Q1, UCC21551-Q1, UCC21750-Q1]}
      - {id: pfc_sense, label: "PFC voltage / current / temperature sense", side: hv, blocks: [PFC voltage sense (amplifier), PFC current sense (isolated amplifier), PFC temperature sense (analog/digital temperature sensors)], source: "TI-SOL-OBC SVG", fn_hint: [isolated_amplifier, current_sensor, temperature_sensor], ti_parts: [AMC3301-Q1, AMC3302, AMC0306M05-Q1, TMP235-Q1, LMT01-Q1]}
