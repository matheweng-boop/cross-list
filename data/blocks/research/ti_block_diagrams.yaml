    features:
      - {id: obc_topology, question: "OBC power topology", choices: ["two-stage (PFC + isolated DC/DC)", "single-stage (matrix / bidirectional)"], filters: "number of isolated gate drivers and bias rails (new)", source: "TI-SOL-OBC SVG; STDA010 p.2 Fig 1-1, 1-2"}
