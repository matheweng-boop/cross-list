# Application block diagrams from public TI documents (competitor reference), for the block-diagram generator.
# Complements ti_power.yaml (traction inverter, gate driver subsystem, isolated bias power) and motor_and_switches.yaml
# (LEV / 48 V drives, RF switch placements). Nothing here repeats those entries.
# See ti_block_diagrams.md for prose, sources and gaps.
#
# How these were read: each ti.com/solution/<app> page embeds its block diagram as a Visio SVG and its clickable
# subsystem list as JSON (const VARIANT_LIST in the page source: per subsystem a name, description, TI product families
# and reference designs). The SVG was rendered locally and read; groups below are the red dashed subsystem boxes, in the
# page's own words. "pages" for a TI-SOL source = SVG file name + subsystem list. TI part lists are the first few parts of
# each TI product family the page attaches to that subsystem (competitor reference only, not recommendations).
#
# Field notes (same conventions as ti_power.yaml):
#   groups[].side      lv | hv | barrier | field | backplane | rf (where the figure draws it); omitted when not meaningful
#   groups[].fn_hint   Cross List function ids for the blocks (new ids proposed in ti_block_diagrams.md are marked there)
#   links              [from, to, label] = arrows / buses drawn in the figure (label "" when unlabelled)
#   features[]         high-level design questions a user would answer for this application; choices are options, not answers
#   features[].filters existing Cross List parameter names where one fits; otherwise a plain-words attribute marked "(new)"

