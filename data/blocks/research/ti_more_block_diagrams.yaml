# ---------------------------------------------------------------------------------------------------------------------
# Function ids used in fn_hint above that data/blocks/functions.yaml does not have yet (proposed; category = a key of
# `categories` in functions.yaml). Kept generic so other vendors' parts can fill them too.
new_functions:
  acdc_controller: {label: "AC/DC controller (PFC / flyback / LLC / SR)", category: power, note: "Offline PWM, PFC and synchronous-rectifier controllers for mains-powered supplies (adapters, appliances, chargers, UPS). hv_flyback stays the HV-battery bias flyback"}
  efuse_hotswap: {label: "eFuse / hot-swap controller", category: protection, note: "Inrush and over-current protection on an input or output rail, with or without telemetry; power_loss_protection stays the eFuse + hold-up combination"}
  relay_driver: {label: "Relay / solenoid driver (low-side)", category: power, note: "Coil drivers for relays, contactors, valves and solenoids (e.g. Darlington arrays, PWM solenoid drivers)"}
  motor_driver_brushed: {label: "Brushed DC / stepper motor driver", category: power, note: "Integrated H-bridge or stepper driver for small motors: locks, valves, levelling, lens focus, pumps, fans"}
  usb_pd_controller: {label: "USB Type-C / PD controller", category: interface, note: "CC negotiation and power-path control for USB-C sources and sinks"}
  battery_protector: {label: "Battery protector (cell OVP / UVP / OCP)", category: power, note: "Protector IC driving charge / discharge FETs; battery_monitor stays the fuel gauge / monitor"}
  wireless_power: {label: "Wireless power transmitter / receiver (Qi)", category: power, note: "Inductive charging TX or RX"}
  dac: {label: DAC, category: sensing, note: "Precision or high-speed DAC (bias, control loops, RF DAC)"}
  touch_controller: {label: "Touch / capacitive / inductive sensing controller", category: audio, note: "Touch-screen controllers, capacitive buttons and sliders, inductive (metal) touch"}
  display_driver: {label: "Display driver / bias power (LCD, OLED)", category: audio, note: "Display bias PMIC, LCD driver or display interface; led_driver stays the backlight"}
  haptics_driver: {label: "Haptics / piezo driver", category: audio, note: "ERM / LRA / piezo actuator and buzzer drivers"}
  env_sensor: {label: "Environmental sensor (humidity, light, pressure)", category: sensors, note: "Humidity, ambient-light and similar environmental sensor ICs (temperature_sensor stays separate)"}
  hall_switch: {label: "Hall-effect switch / latch", category: sensing, note: "Digital Hall switches for lid, tamper, wake-up and BLDC commutation; position_sensor stays the angle / linear sensor"}
  ultrasonic_afe: {label: "Ultrasonic sensor AFE (transducer driver + echo receiver)", category: sensing, note: "Single-channel time-of-flight AFE: park assist, level, flow meters"}
  ecg_afe: {label: "ECG / biopotential AFE", category: sensing, note: "Multi-channel biopotential ADC with lead-off, pace and respiration functions"}
  ppg_afe: {label: "Optical biosensing AFE (PPG / SpO2)", category: sensing, note: "LED driver + TIA + ADC for heart-rate and SpO2"}
  ultrasound_afe: {label: "Medical ultrasound receive AFE", category: sensing, note: "Multi-channel LNA + VGA + PGA + ADC (+ CW mixer) for imaging probes"}
  hv_pulser: {label: "Ultrasound HV transmit pulser / T/R switch", category: sensing, note: "Multi-level high-voltage pulsers with integrated transmit / receive switches"}
