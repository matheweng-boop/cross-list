# More application block diagrams from public TI documents (competitor reference), for the block-diagram generator.
# Companion to ti_block_diagrams.yaml (same schema) and ti_power.yaml / motor_and_switches.yaml. Every application
# here is one that data/blocks/templates.yaml does not cover yet. See ti_more_block_diagrams.md for sources and gaps.
#
# How these were read: each ti.com/solution/<app> page embeds its block diagram as a Visio SVG and its clickable
# subsystem list as JSON (const VARIANT_LIST in the page source: per subsystem a name, description, TI product families
# and reference designs). The SVG was rendered locally (headless Chromium) and read; groups below are the red dashed
# subsystem boxes, in the page's own words, with the teal blocks inside each box as `blocks`. Blocks drawn outside any
# subsystem (white boxes, e.g. an RF path or a processor) are kept as their own group and the source says so.
# "pages" for a TI-SOL source = variant name + eeqId (the diagram id) + subsystem count. TI part lists are the first part
# of each TI product family the page attaches to that subsystem (competitor reference only, not recommendations).
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   category           generator heading the application belongs under (one of the template categories)
#   groups[].fn_hint   BizDev function ids (data/blocks/functions.yaml); ids not there yet are proposed under
#                      new_functions at the end of this file. Empty when no function fits (filters, fuses, logic).
#   links              [from, to, label] = arrows / buses drawn in the figure (label "" when unlabelled)
#   features[]         2-5 high-level design questions per application; choices are options, not answers
#   features[].source  where the question comes from; "(not drawn)" = a common design choice the page implies but
#                      does not draw

