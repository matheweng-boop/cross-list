  - id: body_control_module
    name: Automotive body control module (BCM)
    category: Automotive systems
    sources:
      - {doc: TI-SOL-BCM, url: "https://www.ti.com/solution/body-control-module-bcm", pages: "SVG eeqId 14323; 9-subsystem list"}
    groups:
      - {id: power, label: "Power supply (discrete or SBC)", blocks: [reverse battery protection, voltage regulator, tracking LDO (off-board sensor), watchdog, supervisor], source: "TI-SOL-BCM SVG 'Power supply'", fn_hint: [reverse_polarity, wide_vin_buck, pol_ldo, ldo_tracker, watchdog, supervisor], ti_parts: [LM74700D-Q1, LM74502-Q1, LMR43610-Q1, TPS7B4260-Q1, TPS7B85-Q1, TPS3704-Q1]}
      - {id: can, label: "CAN", blocks: [CAN transceiver, CAN ESD], source: "TI-SOL-BCM SVG 'CAN'", fn_hint: [can_transceiver, tvs_esd], ti_parts: [TCAN1044A-Q1, TCAN1057A-Q1, TCAN1145-Q1]}
      - {id: lin, label: "LIN", blocks: [LIN transceiver, LIN ESD], source: "TI-SOL-BCM SVG 'LIN'", fn_hint: [can_transceiver, tvs_esd], ti_parts: [TLIN1022A-Q1, TLIN1024A-Q1, TLIN2021A-Q1]}
      - {id: digital_inputs, label: "Digital inputs (switch detection)", blocks: [MSDI / mux], source: "TI-SOL-BCM SVG 'Digital inputs'", fn_hint: [io_expander], ti_parts: [TIC10024-Q1, TIC12400-Q1, TMUX1308A-Q1]}
      - {id: analog_inputs, label: "Analog inputs", blocks: [MSDI / mux, op amp], source: "TI-SOL-BCM SVG 'Analog inputs'", fn_hint: [io_expander, amplifier], ti_parts: [TIC12400-Q1, TLV9062-Q1, INA181-Q1]}
      - {id: mcu, label: "MCU", blocks: [MCU], source: "TI-SOL-BCM SVG 'MCU'", fn_hint: [mcu], ti_parts: []}
      - {id: load_drivers, label: "Load drivers", blocks: [HS switches, LS switches, relay drivers, motor drivers, current sense], source: "TI-SOL-BCM SVG 'Load drivers'", fn_hint: [load_switch, relay_driver, motor_driver_brushed, amplifier], ti_parts: [TPS1HC04-Q1, TPS2HC08-Q1, ULQ2003A-Q1, DRV8243-Q1, DRV8706-Q1, INA181-Q1]}
      - {id: telltale, label: "Tell-tale indicators", blocks: [LED drivers], source: "TI-SOL-BCM SVG 'Tell tale indicators'", fn_hint: [led_driver], ti_parts: [TLC59116-Q1, TPS92629-Q1, LP8868Z-Q1]}
      - {id: diagnostics, label: "Diagnostic inputs", blocks: [reference, comparator, current sense, temperature sense, logic], source: "TI-SOL-BCM SVG 'Diagnostic inputs'", fn_hint: [voltage_reference, amplifier, temperature_sensor], ti_parts: [TL431-Q1, LM2903B-Q1, INA181-Q1]}
      - {id: loads, label: "Output functions (fused loads, relays)", blocks: [exterior / interior lighting, door lock, window / sunroof, wiper / washer, heater / defroster, fuel pump, horn / alarm], source: "TI-SOL-BCM SVG 'Output functions'", fn_hint: [external_block], ti_parts: []}
    links:
      - [power, mcu, ""]
      - [can, mcu, "CAN bus"]
      - [lin, mcu, "LIN bus"]
      - [digital_inputs, mcu, "discrete inputs (switches)"]
      - [analog_inputs, mcu, "analog inputs (temperature, light, current feedback)"]
      - [diagnostics, mcu, ""]
      - [mcu, load_drivers, ""]
      - [mcu, telltale, ""]
      - [load_drivers, loads, "fused outputs / relays"]
    features:
      - {id: sbc, question: "Power and transceivers as discrete parts or a system basis chip (SBC)?", choices: [discrete, SBC], source: "TI-SOL-BCM SVG 'Discrete implementation or system basis chip (SBC)'"}
      - {id: load_switching, question: "Load switching technology", choices: [relays + relay drivers, smart high-side switches, mixed], source: "TI-SOL-BCM 'Load drivers'"}
