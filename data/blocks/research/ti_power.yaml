    groups:
      - id: lv_source
        label: LV battery source
        side: lv
        blocks: [12 V battery (or 48 V), ideal diode / protection]
        source: "SLUAAS4 p.3-4 Fig 2-1; SLUAAH0 p.9; TIDUF23A p.11-12"
        ti_parts: [LM74202-Q1]
      - id: pre_reg
        label: Pre-regulator
        side: lv
        blocks: [pre-regulator (SEPIC / buck-boost / boost / flyback / push-pull), separate HS and LS pre-regulators]
        source: "SLUAAS4 p.4-5 Fig 2-1, 2-2, Table 2-1; SLUAAH0 p.9, p.27 Fig 13-2; TIDUF23A p.12-13 Table 2-2"
        ti_parts: [LM5155x-Q1, LM5156x-Q1, LM5157x-Q1, LM5158x-Q1, LM5156-Q1, LM5158-Q1, UCC280x-Q1]
      - id: iso_hs
        label: Isolated bias supplies, high side
        side: barrier
        blocks: [isolated DC/DC for HS_1, isolated DC/DC for HS_2, isolated DC/DC for HS_3]
        source: "SLUAAS4 p.6 Fig 3-1, p.7 Fig 4-1; SLUA963B p.31-32; SPRAD58B p.14 Fig 6-1"
        ti_parts: [UCC14240-Q1, UCC14241-Q1, UCC14140-Q1, UCC14141-Q1, UCC14340-Q1, UCC14341-Q1, UCC14130-Q1, UCC14131-Q1, UCC15240-Q1, UCC15241-Q1]
      - id: iso_ls
        label: Isolated bias supply, low side (individual or shared 1:3)
        side: barrier
        blocks: [isolated DC/DC for LS_1..LS_3, or one multi-winding supply for all LS]
        source: "SLUAAS4 p.6-7 Fig 3-1, 4-1, 4-2; SLUAAH0 p.7-8; SPRAD58B p.14"
        ti_parts: [UCC25800-Q1, SN6501-Q1, SN6505-Q1, SN6507-Q1, LM518x-Q1, LM2518x-Q1, LM515x-Q1, LM34xxx-Q1]
      - id: hv_source
        label: HV battery flyback (redundant or pre-regulator)
        side: hv
        blocks: [HV battery (400 V / 800 V), HV flyback converter]
        source: "SLUAAS4 p.3 Table 1-2, p.5 Fig 2-3, p.8-10 Fig 6-1 to 6-4; SPRAD58B p.16 Table 7-1"
        ti_parts: [UCC28C5x-Q1, UCC28700-Q1, UCC28730-Q1, UCC28740-Q1, UCC28781-Q1]
      - id: post_reg
        label: Post-regulation (optional)
        side: hv
        blocks: [LDO post-regulator]
        source: "SLUAAS4 p.8 Fig 6-1 (LDO per LS driver); SLUAAH0 p.10"
        ti_parts: []
      - id: drivers
        label: Gate drivers (secondary side)
        side: hv
        blocks: [gate driver HS_1..HS_3, gate driver LS_1..LS_3]
        source: "SLUAAS4 p.4-10 (all architecture figures); SLUAAH0 p.7 Fig 3-1"
        ti_parts: [UCC5880-Q1, UCC5870-Q1, UCC21732-Q1]
      - id: host
        label: Host / supply monitoring
        side: lv
        blocks: [MCU enable and power-good handshake, supply diagnostics / monitoring, gate-driver primary LDO]
        source: "SLUAAH0 p.24; TIDUF23A p.4 Fig 2-1, p.9, p.12"
        ti_parts: [TPS7B6933-Q1]
      - id: other_iso_rails
        label: Other isolated rails
        side: barrier
        blocks: [isolated 5 V / 3.3 V DC/DC module for isolated CAN and isolated voltage sensing]
        source: "TIDUF23A p.6, p.11-13 Table 2-1"
        ti_parts: [UCC33421-Q1]
