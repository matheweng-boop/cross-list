# Systems and their sub-systems (owner, 23 Oct 2026): the Systems library and the Application library group
# their content by these. Each library diagram (data/blocks/templates.yaml) is listed by its exact name; a
# diagram may sit in more than one sub-system. Diagrams not listed appear under "Other" by their category.
# elements: what the sub-system is made of (shown as chips); topics: Systems library deep dives
# (data/library/topics/<key>.yaml); links: other pages that belong to the sub-system.
systems:
  - key: automotive
    title: "Automotive"
    summary: "Everything electronic in a car: access, radio, connectivity, sensing, powertrain, battery and charging."
    subsystems:
      - key: car-access
        title: "UWB in the car: access and cabin sensing"
        summary: "Digital key, hands-free entry and in-cabin presence detection."
        elements:
          - "Digital key / UWB anchors"
          - "BLE phone-as-a-key"
          - "NFC card key"
          - "Kick sensor (hands-free tailgate)"
          - "Interior radar (child presence)"
        diagrams:
          - "Smart car access (UWB anchors + BLE + NFC, CCC digital key) (NXP)"
          - "Automotive phone-as-a-key (PaaK) module with BLE satellite modules (TI)"
          - "Automotive in-cabin 60 GHz radar module (occupancy / child presence / vital signs) (TI)"
          - "Kick-to-open sensor module (sense element, signal conditioning, MCU, LIN / CAN to the body control module) (after TI)"
          - "Interior radar for child presence detection (60 GHz radar + MCU on CAN, with optional 3D ToF camera and microphone modules) (after Infineon)"
          - "UWB radar in the car - child presence, intrusion and kick / gesture sensing (UWB SoC in radar mode on the interior and rear anchors) (after Infineon AIROC UWB and ST)"
        topics: [auto_uwb]
      - key: car-radio
        title: "Car radio"
        summary: "Broadcast reception in the head unit or a separate tuner box."
        elements:
          - "Tuner (AM / FM)"
          - "Digital-radio demodulator (DAB / HD Radio)"
          - "Antenna amplifier and diversity"
          - "Audio amplifier"
        diagrams:
          - "Car radio tuner system"
          - "Automotive infotainment head unit with radio tuner (AM/FM/HD/DAB) (TI)"
          - "Automotive connected radio / entry infotainment (AM/FM/DAB tuner + Wi-Fi/BT + MPU) (NXP)"
        links:
          - ["Tuners & demodulators", "/broadcast"]
          - ["Radio configurations", "/broadcast/configurations"]
      - key: telematics-v2x
        title: "Telematics and V2X"
        summary: "The car's links to the network, to other cars and to satellites."
        elements:
          - "5G / LTE front end"
          - "V2X 5.9 GHz (C-V2X, 802.11p)"
          - "GNSS"
          - "Car Wi-Fi and Bluetooth"
          - "Satellite NTN and eCall"
          - "Roof antenna module"
        diagrams:
          - "Automotive telematics & infotainment RF (Skyworks)"
          - "Automotive telematics control unit (TCU) / V2X module (TI)"
          - "V2X communications unit (802.11p / DSRC safety modem + cellular + Wi-Fi) (NXP)"
          - "V2X unit with two antenna paths, standalone or companion to the TCU (after Autotalks, Skyworks and 5GAA public material)"
          - "Automotive telematics (Dimensity Auto Connect MT2739: 5G-Advanced + NTN satellite) (MediaTek)"
          - "Automotive telematics / connectivity (Snapdragon Auto 5G Modem-RF Gen 2, QCA6696 Wi-Fi/BT, C-V2X 9150) (Qualcomm)"
        topics: [tcu_rf, v2x_frontend, gnss_frontend, roof_coexistence]
      - key: adas
        title: "ADAS and sensing"
        summary: "Driver assistance: radar, camera and lidar into a domain controller."
        elements:
          - "Front and corner radar (77 GHz)"
          - "Camera"
          - "Lidar"
          - "Domain controller"
        diagrams:
          - "ADAS domain controller"
          - "ADAS domain controller (camera / radar / lidar fusion) (TI)"
          - "Automotive 77 GHz radar (transceiver + radar MCU / one-chip SoC) (NXP)"
          - "Automotive LiDAR module (laser driver, TIA / ADC / TDC receive chain, beam steering, processor + FPGA) (TI)"
      - key: powertrain
        title: "Electric powertrain"
        summary: "Traction inverter and the controls and drives around it."
        elements:
          - "Traction inverter"
          - "Isolated gate drivers"
          - "E-compressor"
          - "Vehicle control unit"
          - "Fuel cell control"
        diagrams:
          - "EV traction inverter"
          - "HEV/EV traction inverter (TI reference)"
          - "Automotive 48 V BLDC drive, 1 kW (TI TIDA-00281)"
          - "Automotive HVAC e-compressor drive (HV battery, isolated CAN/LIN, 3-phase IGBT/MOSFET inverter) (TI)"
          - "HEV/EV vehicle control unit (VCU: application processor + safety MCU, CAN / FlexRay / Ethernet, sensor supplies) (TI)"
          - "Fuel cell control unit (FCCU: FC boost DC/DC control + fuel control system, cell monitoring) (TI)"
          - "Three-level T-type traction inverter (SiC + GaN bidirectional switches, 800 V) (Renesas)"
          - "xEV traction inverter with inductive position sensor (IPS) or resolver (Renesas)"
        topics: [traction_asil_d]
      - key: battery-power
        title: "Battery and power distribution"
        summary: "High- and low-voltage batteries and how power reaches the loads."
        elements:
          - "HV battery management"
          - "12 V / 48 V battery"
          - "HV-to-LV DC/DC"
          - "Power distribution box"
        diagrams:
          - "EV high-voltage battery system (wired cell supervision, BDU, BMU) (TI)"
          - "EV high-voltage battery management system (BMU + cell monitoring unit + battery junction box) (NXP)"
          - "EV battery management system (daisy-chained battery front ends, ASIL-D) (Renesas)"
          - "Automotive low-voltage (12 V / 48 V Li-ion) battery system with BMS, pyrofuse and contactors (TI)"
          - "HEV/EV HV-to-LV DC/DC converter (phase-shifted full bridge, HV battery to 12 V) (TI)"
          - "Automotive 12 V / 48 V power distribution box (smart fuses, load drivers) (TI)"
      - key: charging
        title: "Charging"
        summary: "On-board chargers and the chargers outside the car."
        elements:
          - "On-board charger"
          - "AC wallbox"
          - "DC fast charger"
          - "Wireless charging pad"
        diagrams:
          - "HEV/EV on-board charger (two-stage PFC + isolated DC/DC) (TI)"
          - "6.6 kW single-stage bidirectional on-board charger (GaN, DAB) (Renesas)"
          - "3.3 kW integrated OBC + HV-to-LV DC/DC (shared transformer, GaN) (Renesas)"
          - "AC EV charging station / wallbox (Level 2 residential) (TI)"
          - "AC EV charging station (wallbox, level 1-3; metrology MCU + host controller, ISO 15118 PLC) (NXP)"
          - "Mode 3 AC EV charger wallbox (single/three-phase, metering + PLC) (Renesas)"
          - "DC fast charging station (power module + controller + HMI) (TI)"
          - "DC fast charging station power module (3-phase PFC + isolated DC/DC, 400-800 V out) (Renesas)"
          - "Wireless (inductive) EV charging station, ground assembly (PFC + HF inverter + coil, FOD / LOP / alignment, HMI) (TI)"
      - key: cockpit
        title: "Cockpit and body"
        summary: "Displays and controls in front of the driver, and the powered doors and liftgate."
        elements:
          - "Instrument cluster"
          - "Head-unit display"
          - "Power liftgate and doors"
        diagrams:
          - "Automotive instrument cluster (hybrid 2D: gauges + segment / TFT LCD) (NXP)"
          - "Automotive smart power closure (power liftgate, sliding doors, trunk and frunk motors) (after Infineon)"
  - key: datacenter
    title: "Data center"
    summary: "Power into and through the rack, backup, compute and the network."
    subsystems:
      - key: rack-power
        title: "Rack power"
