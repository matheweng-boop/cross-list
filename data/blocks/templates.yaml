- name: Utility-scale PV string inverter, 1500 V DC (multi-MPPT boost + three-level inverter, 800 V AC to the MV transformer) (after TI, TÜV and Skyworks public material)
  category: Power & isolation
  note: >-
    Drawn in BizDev for the extra-wide-creepage case (hv-extra-wide-isolation) from public material: TI string inverter
    page, TI reference designs TIDA-010210 (three-level ANPC, up to 1000 V DC) and TIDA-01606 (T-type, 800-900 V DC),
    TI SBAA527 (PV moves from 1000 V to 1500 V DC; 15.7 mm isolated amplifiers), a TÜV SÜD IEC 62109-1 report (PD3
    outside, PD2 inside the cabinet) and a TI E2E answer that a TÜV assessor asked for 15 mm creepage for reinforced
    isolation in a 1500 V DC inverter. The reinforced barrier sits between the 1500 V power side and the low-voltage
    control and communication side: digital isolators, isolated amplifiers and, where the controller is earth- or
    user-referenced, the gate drivers. About 12-24 gate-driver channels, 3-6 isolated amplifiers and 2-6 digital
    isolators per inverter (est from the topology: n boost legs + 3 three-level legs).
  sources:
  - {doc: TI-SOL-STRING, title: String inverter - block diagram + subsystems, url: 'https://www.ti.com/solution/string-inverter'}
  - {doc: TIDA-010210, title: '11-kW, bidirectional, three-phase ANPC based on GaN reference design', url: 'https://www.ti.com/tool/TIDA-010210'}
  - {doc: SBAA527, title: "TI's first isolated amplifiers with ultra-wide creepage and clearance (Aug 2021)", url: 'https://www.ti.com/lit/ab/sbaa527/sbaa527.pdf'}
  - {doc: E2E-938435, title: 'ISO7821: 1500 V solar inverter system (TI E2E, Sep 2020)', url: 'https://e2e.ti.com/support/isolation-group/isolation/f/isolation-forum/938435/iso7821-1500v-solar-inverter-system'}
