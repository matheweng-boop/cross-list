- name: Wind turbine converter (back-to-back, 690 V AC, about 1100 V DC link, full-power or doubly-fed) (after TI SBAA527, Skyworks AN1456 and GWEC public material)
  category: Power & isolation
  note: >-
    Drawn in BizDev for the extra-wide-creepage case (hv-extra-wide-isolation). Wind converters run from 690 V AC with a
    DC link around 1000-1100 V (our reading). TI names solar and wind inverters and 690 V drives among the systems that
    need more than 9 mm creepage and clearance (SBAA527), and Skyworks AN1456 shows that 400/690 V systems need 9.1 mm
    reinforced clearance at 3000 m in OVC III, more than an 8 mm wide body gives. Converter cabinets sit in the nacelle
    or tower base, often offshore, so condensation (PD3) is a design case unless the cabinet is sealed (our reading).
    About 12-24 gate-driver channels (machine and grid side, brake chopper), 4-8 isolated amplifiers and 2-4 digital
    isolators per converter (est).
  sources:
  - {doc: SBAA527, title: "TI's first isolated amplifiers with ultra-wide creepage and clearance (Aug 2021)", url: 'https://www.ti.com/lit/ab/sbaa527/sbaa527.pdf'}
  - {doc: AN1456, title: 'Skyworks AN1456, Understanding creepage and clearance requirements for data centers (Sep 2026)', url: 'https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1456-Data-Center-Creepage-Clearance-Requirements.pdf'}
