- name: Railway auxiliary converter (750 V-3 kV DC catenary to 400 V AC and 110 V DC battery charging) (after Skyworks AN1456, Wolfspeed forum and UNIFE public material)
  category: Power & isolation
  note: >-
    Drawn in BizDev for the extra-wide-creepage case (hv-extra-wide-isolation). The auxiliary converter feeds air
    conditioning, compressors, lighting and the train battery from the catenary (600-750 V DC trams and metros, 1500 V
    and 3000 V DC mainline). Railway equipment (EN 50124-1) is designed for PD3 and OV3; a designer on the Wolfspeed forum
    (Dec 2025) computes 18.1 mm (material group I) to 20.1 mm (group II) reinforced creepage for a 600 V DC tram line, so
    even a 15 mm package is not enough alone. Designs use two barriers in series, fiber optics or potting; a wide
    package still helps the second barrier. About 6-12 gate-driver channels, 2-4 isolated amplifiers and 2-4 digital
    isolators per converter (est).
  sources:
  - {doc: Wolfspeed-forum, title: 'HAS310M17BM3 gate driver for railway application (Wolfspeed Power Applications Forum, Dec 2025)', url: 'https://forum.wolfspeed.com/discussion/comment/3417'}
