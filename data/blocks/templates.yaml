    - {id: negative_rail, question: Bipolar gate supply (negative VEE), choices: ["yes", "no"], source: "SLUAAH0 p.10-11; SLYY169 p.16"}
    - {id: ovlo, question: Supply overvoltage lockout, choices: [integrated, external circuit, none], source: "SLUA963B p.11, p.21"}
