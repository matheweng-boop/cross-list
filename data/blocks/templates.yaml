    col: 1
    row: 0
  - id: power
    label: Non-isolated DC/DC power supply
    blocks: [wide_vin_buck, pol_ldo, sequencer]
    col: 2
    row: 0
  - id: diagnostics
    label: Self-diagnostics / monitoring
    blocks: [temperature_sensor, supervisor, watchdog]
    col: 3
    row: 0
  - id: wired_interface
    label: Wired interface
    blocks: [can_transceiver, rs485_transceiver, digital_isolator, tvs_esd]
    col: 0
    row: 1
  - id: sensor_input
    label: Sensor input interface (rider inputs)
    blocks: [tvs_esd, amplifier, adc]
    col: 1
    row: 1
  - id: output_ui
    label: Output user interface
    blocks: [led_driver, audio_amp]
    col: 2
