- name: AI data-center 800 V DC power (grid to 800 V DC, busway with protection, energy storage, 800 V to 6-12 V isolated converters in the rack) (after NVIDIA, TI and Skyworks public material)
  category: Power & isolation
  note: >-
    Drawn in BizDev for the extra-wide-creepage case (hv-extra-wide-isolation). NVIDIA plans 800 V DC for 1 MW racks from
    2027 (Kyber): 13.8 kV AC is converted to 800 V DC at the perimeter (rectifier or solid-state transformer), carried on
    busways and converted to 12 V or 6 V in the rack (NVIDIA technical blog, May 2025). TI showed an 800 V hot-swap
    controller, an 800 V to 6 V isolated GaN bus converter and a 30 kW 800 V AC/DC supply (Mar 2026). The reinforced
    barrier sits in every 800 V to low-voltage converter and in the monitoring of the busway (IEC 62368-1, PD2). Skyworks
    AN1456 - an 8 mm wide body just covers 800 V reinforced creepage, but data centers ask for 3000 m altitude, where a
    600 V OVC III reinforced clearance grows to 9.1 mm; the upcoming ultra-wide SOIC (15.5 mm clearance) covers it.
  sources:
  - {doc: NVIDIA-800VDC, title: 'NVIDIA 800 VDC architecture will power the next generation of AI factories (NVIDIA technical blog, 20 May 2025)', url: 'https://developer.nvidia.com/blog/nvidia-800-v-hvdc-architecture-will-power-the-next-generation-of-ai-factories/'}
  - {doc: TI-800VDC, title: 'TI 800 VDC architecture for AI data centres (eeNews Europe, 19 Mar 2026)', url: 'https://www.eenewseurope.com/en/ti-800-vdc-architecture-ai-data-centres'}
  - {doc: AN1456, title: 'Skyworks AN1456, Understanding creepage and clearance requirements for data centers (Sep 2026)', url: 'https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1456-Data-Center-Creepage-Clearance-Requirements.pdf'}
  groups:
  - id: perimeter
