# Broadcast configurator presets: regions, hardware configurations and software (listening) modes.
#
# Step 1 region, step 2 hardware (what is populated and how pins are wired), step 3 software: one or more
# listening modes that say what every tuner and demod channel does. Software modes are checked against the
# hardware they run on.
#
# Hardware
#   ics:      IC0..IC2 tuner ICs, IC3 the digital demodulator (coprocessor); null = not populated
#   antennas: id, label, bands, splitter (true = band splitter, so one antenna may feed several ICs)
#   rf:       per IC, RF input pin -> antenna id, or "loop:IC0.LTB" (loop-through output of another IC)
#   control:  demod = SoC controls IC3, IC3 controls the tuners over its tuner SPI; soc = SoC controls every IC
#   audio:    direct = IC0 I2S to the SoC (and IC0 I2S 1 into the demod, demod I2S to the SoC);
#             via_demod = every tuner's I2S into the demod, demod I2S to the SoC
#   clock:    crystal on IC0, CLKO of IC0 in a star to every other IC (application guidance)
# Software modes
#   tuners:   per IC, job of T0, T1:
#             off, fm_audio, am_audio, amfm_audio, fm_pd, fm_mrc, fm_scan, am_scan, dab, fm_dab_scan, drm
#   channels: DMOD0.. jobs with source tuner ("IC0.T0"):
#             unused, hd_audio, hd_data, hd_mrc, dab_audio, dab_scanless, dab_mrc, drm_audio, cdr_audio

regions: [North America, Europe, Rest of world]

hardware:
  - name: Superset, 2 antennas, 5 tuners, software-defined demod
    regions: [North America, Europe, Rest of world]
    antennas:
      - {id: ANT1, label: AM/FM/DAB, bands: [AM, FM, DAB], splitter: true}
      - {id: ANT2, label: FM, bands: [FM]}
    ics: {IC0: Si47962, IC1: Si47962, IC2: Si47952, IC3: Si46999A1GE1AM}
    rf:
      IC0: {FMB: ANT1, AMI: ANT1, FMA: ANT2}
      IC1: {B3A/WXI: ANT1, FMB: "loop:IC0.LTB"}
      IC2: {FMB: "loop:IC1.LTB", B3A/WXI: "loop:IC0.LTA"}
    control: demod
    audio: direct
    notes: >-
      ANT1 (AM/FM/DAB) goes through a band splitter to FMB and AMI of IC0 and B3A of IC1; ANT2 (FM only) to FMA
      of IC0. IC0 loops through LTB to FMB of IC1 and on to IC2, and LTA to B3A of IC2. The SoC talks SPI to IC3;
      IC3 controls the tuners over its own tuner SPI. IC0 I2S goes to the SoC; tuner I/Q goes into ZIF0, ZIF1
      (and ZIF2) of IC3. Five tuners, one software-defined demod.

  - name: HD, one antenna, dual tuner + triple HD demod
    regions: [North America]
    antennas:
      - {id: ANT1, label: AM/FM, bands: [AM, FM]}
    ics: {IC0: Si47961, IC1: null, IC2: null, IC3: Si46931A1GE1AM}
    rf:
      IC0: {AMI: ANT1, FMA: ANT1, FMB: ANT1}
    control: demod
    audio: direct
    notes: IC0 dual tuner with one AM/FM antenna, IC1 and IC2 not populated, IC3 HD demod with three channels.

  - name: HD, two antennas, dual tuner + triple HD demod (MRC)
    regions: [North America]
    antennas:
      - {id: ANT1, label: AM/FM, bands: [AM, FM]}
      - {id: ANT2, label: FM, bands: [FM]}
    ics: {IC0: Si47961, IC1: null, IC2: null, IC3: Si46931A1GE1AM}
    rf:
      IC0: {AMI: ANT1, FMA: ANT1, FMB: ANT2}
    control: demod
    audio: direct
    notes: Two antennas on IC0 allow FM HD MRC.

  - name: AM/FM, dual tuner, no demod
    regions: [North America, Rest of world]
    antennas:
      - {id: ANT1, label: AM/FM, bands: [AM, FM]}
    ics: {IC0: Si47961, IC1: null, IC2: null, IC3: null}
    rf:
      IC0: {AMI: ANT1, FMA: ANT1, FMB: ANT1}
    control: soc
    audio: direct
    notes: Analog AM/FM with a background tuner; one antenna, so no phase diversity.

  - name: AM/FM, single tuner, no demod
    regions: [North America, Rest of world]
    antennas:
      - {id: ANT1, label: AM/FM, bands: [AM, FM]}
    ics: {IC0: Si47951, IC1: null, IC2: null, IC3: null}
    rf:
      IC0: {AMI: ANT1, FMB: ANT1}
    control: soc
    audio: direct
    notes: Entry radio; a single tuner has no background scan.

  - name: DAB, two antennas, 2x Si47962 + DAB demod
    regions: [Europe]
    antennas:
      - {id: ANT1, label: AM/FM/DAB, bands: [AM, FM, DAB]}
      - {id: ANT2, label: FM/DAB, bands: [FM, DAB]}
    ics: {IC0: Si47962, IC1: Si47962, IC2: null, IC3: Si46922A1GE1AM}
    rf:
      IC0: {AMI: ANT1, FMA: ANT1, B3A/WXI: ANT1, FMB: ANT2, B3B: ANT2}
      IC1: {B3A/WXI: "loop:IC0.LTA", B3B: "loop:IC0.LTB"}
    control: demod
    audio: direct
    notes: >-
      Both antennas enter IC0 (FM phase diversity on FMA / FMB); IC1 gets Band III through IC0's loop-through
      outputs LTA / LTB and runs DAB with MRC.

  - name: DAB, one antenna, one dual tuner + DAB demod
    regions: [Europe]
    antennas:
      - {id: ANT1, label: AM/FM/DAB, bands: [AM, FM, DAB]}
    ics: {IC0: Si47962, IC1: null, IC2: null, IC3: Si46922A1GE1AM}
    rf:
      IC0: {AMI: ANT1, FMA: ANT1, B3B: ANT1}
    control: demod
    audio: direct
    notes: One dual tuner; seamless linking needs tuner 1 for DAB while tuner 0 plays FM. No phase diversity.

  - name: DRM, single tuner + DRM demod
    regions: [Rest of world]
    antennas:
      - {id: ANT1, label: AM/FM, bands: [AM, FM]}
    ics: {IC0: Si47957, IC1: null, IC2: null, IC3: Si46924A1GE1AM}
    rf:
      IC0: {AMI: ANT1, FMB: ANT1}
    control: demod
    audio: direct
    notes: Si47957 tunes AM (DRM30) or FM (DRM+); one tuner, no background scan.

software:
  # North America
  - name: AM listening, HD
    region: North America
    tuners: {IC0: [am_audio, fm_scan]}
    channels:
      - {job: hd_audio, source: IC0.T0}
      - {job: hd_data, source: IC0.T1}
    notes: >-
      IC0 tuner 0 plays AM audio, tuner 1 does the FM background scan. DMOD0 decodes AM HD audio, DMOD1 the FM HD
      data / station list.
  - name: FM listening, HD
    region: North America
    tuners: {IC0: [fm_audio, fm_scan]}
    channels:
      - {job: hd_audio, source: IC0.T0}
      - {job: hd_data, source: IC0.T1}
    notes: FM audio with HD blending on tuner 0; tuner 1 keeps the FM / HD station list current.
  - name: FM listening, HD MRC
    region: North America
    tuners: {IC0: [fm_audio, fm_mrc]}
    channels:
      - {job: hd_audio, source: IC0.T0}
      - {job: hd_mrc, source: IC0.T1}
    notes: Both tuners on the same HD station from two antennas; costs the background scan and an HD MRC licence.
  - name: AM listening
    region: North America
    tuners: {IC0: [am_audio, fm_scan]}
    notes: AM in the foreground, FM background scan, no HD.
  - name: FM listening
    region: North America
    tuners: {IC0: [fm_audio, fm_scan]}
    notes: FM in the foreground with a background scan, no HD.

  - name: AM/FM listening, HD, single tuner
    region: North America
    tuners: {IC0: [amfm_audio]}
    channels:
      - {job: hd_audio, source: IC0.T0}
      - {job: unused}
    notes: One tuner plays AM or FM with HD blending; no background scan, so the station list is built by a foreground seek.
  - name: AM/FM listening, single tuner
    region: North America
    tuners: {IC0: [amfm_audio]}
    notes: Entry variant, one tuner, analog AM/FM, no HD.

  # Europe
  - name: FM listening, phase diversity, DAB in the background
    region: Europe
    linking: true
    tuners: {IC0: [fm_pd, fm_pd], IC1: [dab, dab]}
    channels:
      - {job: dab_scanless, source: IC1.T0}
      - {job: unused}
    notes: >-
      IC0 plays FM with phase diversity on two antennas; IC1 keeps DAB ready (both tuners on Band III) so seamless
      linking FM <-> DAB can switch without leaving phase diversity.
  - name: DAB listening, MRC
    region: Europe
    linking: true
    tuners: {IC0: [fm_scan, "off"], IC1: [dab, dab]}
    channels:
      - {job: dab_audio, source: IC1.T0}
      - {job: dab_mrc, source: IC1.T1}
    notes: DAB audio with MRC on IC1; IC0 tuner 0 follows the FM equivalent for linking.
  - name: FM listening, one dual tuner
    region: Europe
    linking: true
    tuners: {IC0: [fm_audio, dab]}
    channels:
      - {job: dab_scanless, source: IC0.T1}
      - {job: unused}
    notes: Tuner 0 plays FM, tuner 1 receives DAB for linking. Switching to phase diversity would leave no tuner for linking.
  - name: DAB listening, one dual tuner
    region: Europe
    linking: true
    tuners: {IC0: [fm_scan, dab]}
    channels:
      - {job: dab_audio, source: IC0.T1}
      - {job: unused}
    notes: Tuner 1 plays DAB; tuner 0 follows the FM equivalent for linking.
  - name: AM listening, DAB in the background
    region: Europe
    tuners: {IC0: [am_audio, fm_scan], IC1: [dab, "off"]}
    channels:
      - {job: dab_scanless, source: IC1.T0}
      - {job: unused}
    notes: AM in the foreground on IC0; IC1 keeps the DAB service list current.

  # Rest of world
  - name: AM listening, FM background scan
    region: Rest of world
    tuners: {IC0: [am_audio, fm_scan]}
    notes: AM on tuner 0 while tuner 1 keeps the FM station list current.
  - name: FM listening, FM background scan
    region: Rest of world
    tuners: {IC0: [fm_audio, fm_scan]}
    notes: FM on tuner 0, background scan on tuner 1.
  - name: FM listening, single tuner
    region: Rest of world
    tuners: {IC0: [amfm_audio]}
    notes: One tuner plays AM or FM; no background scan.
  - name: DRM listening
    region: Rest of world
    tuners: {IC0: [drm]}
    channels:
      - {job: drm_audio, source: IC0.T0}
      - {job: unused}
    notes: DRM30 on AM or DRM+ on FM through the DRM demod.
