source:
  title: "Si4614-A10"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si4614-A10-short.pdf"
  revision: "August 22, 2021"    # no revision number printed; footer date only
family: Si4614
description: "Low-Power, High-Performance DAB/DAB+ Baseband Processor"
role: coprocessor
package: {type: QFN, pins: 48, body_mm: "7 x 7 x 0.85", pitch_mm: 0.5, epad: true}   # epad from D2/E2 = 5.30 mm in outline table
aec_q100: true
supplies:
  - {pins: [VA], volts: "1.8", note: "analog; 1.71-2.0 V"}
  - {pins: [VIO], volts: "1.8", note: "interface I/O; 1.62-3.6 V"}
  - {pins: [VCORE], volts: "1.8", note: "core digital; 1.71-2.0 V"}
  - {pins: [VMEM], volts: "1.8", note: "memory; 1.71-2.0 V"}
features:
  - "DAB/DAB+ demodulator"
  - "Transmission Modes I, II, III, IV detection and decoding"
  - "DAB/DAB+ audio decoder (PAD/XPAD outputs available)"
  - "FIC decoder (ensemble info, service list, component info, service linking info)"
  - "Full support for data services (packet mode, packet mode with data groups, enhanced packet mode, MOT, TPEG packet outputs)"
  - "No external RAM required for channel decoding"
  - "Flash memory interface for application program load"
  - "Support for Si479x Zero-IF digital at 2.048 MS/s"
  - "On-chip crystal oscillator (36.864 MHz typ)"
  - "Reference clock input (RCLK 36.864 MHz typ)"
  - "SPI, I2C control interfaces"
  - "7x7 mm 48-pin QFN package"
  - "Pb-free/RoHS compliant"
  - "AEC-Q100 qualified"
parts:
  - mpn: Si4614
    tuners: null
    channels: null             # number of decode channels not stated
    analog: []
    digital_decode: [DAB]      # DAB and DAB+
    digital_iq: []
    options: []
    note: "Works with Si479x tuners (ZIF I/Q input at 2.048 MS/s)"
# No pinout in this document (block diagram and package outline only): pin numbers unknown.
# `signals` lists the signal names drawn on the page-1 block diagram.
signals:
  - {name: IIN, fn: iq_in, bus: "ZIF I/Q"}
  - {name: QIN, fn: iq_in, bus: "ZIF I/Q"}
  - {name: IQFS, fn: iq_in, bus: "ZIF I/Q"}
  - {name: IQCLK, fn: iq_in, bus: "ZIF I/Q"}
  - {name: DIFS1, fn: i2s_in, bus: "I2S in 1"}
  - {name: DICLK, fn: i2s_in, bus: "I2S in 1", note: "label clipped in the figure (index digit cut off)"}
  - {name: DIN1, fn: i2s_in, bus: "I2S in 1"}
  - {name: DIFS2, fn: i2s_in, bus: "I2S in 2"}
  - {name: DICLK, fn: i2s_in, bus: "I2S in 2", note: "label clipped in the figure (index digit cut off)"}
  - {name: DIN2, fn: i2s_in, bus: "I2S in 2"}
  - {name: LOUT, fn: audio_out}
  - {name: ROUT, fn: audio_out}
  - {name: DFS, fn: i2s_out, bus: "I2S out"}
  - {name: DCLK, fn: i2s_out, bus: "I2S out"}
  - {name: DOUT, fn: i2s_out, bus: "I2S out"}
  - {name: SCLK/SCL, fn: host, bus: "Host"}
  - {name: SSB/A1, fn: host, bus: "Host"}
  - {name: MISO/A0, fn: host, bus: "Host"}
  - {name: MOSI/SDA, fn: host, bus: "Host"}
  - {name: INTB, fn: interrupt, bus: "Host"}
  - {name: RSTB, fn: reset, bus: "Host", note: "shown on the I2C/SPI host interface block"}
  - {name: "GPIO 0 - n", fn: gpio, note: "count not stated"}
  - {name: SMODE, fn: mode}
  - {name: RCLK/XTALI, fn: xtal, note: "alternate: reference clock input (36.864 MHz typ)"}
  - {name: XTALO, fn: xtal}
  - {name: NVSCLK, fn: flash, bus: "Flash"}
  - {name: NVSSB, fn: flash, bus: "Flash"}
  - {name: NVMOSI, fn: flash, bus: "Flash"}
  - {name: NVMISO, fn: flash, bus: "Flash"}
  - {name: VIO, fn: power, volts: "1.8", note: "1.62-3.6 V"}
  - {name: VA, fn: power, volts: "1.8", note: "1.71-2.0 V"}
  - {name: VCORE, fn: power, volts: "1.8", note: "1.71-2.0 V"}
  - {name: VMEM, fn: power, volts: "1.8", note: "1.71-2.0 V"}
pins: []
