source:
  title: "Si4624-A10"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si4624-A10-short.pdf"
  revision: "August 9, 2021"     # no revision number printed; footer date only
family: Si4624
description: "High-Performance, Single-Chip FM/DAB/DAB+/RDS/RBDS Data Receiver"
role: receiver                   # single-chip data receiver; block diagram shows no audio outputs
package: {type: QFN, pins: 48, body_mm: "7 x 7 x 0.85", pitch_mm: 0.5, epad: true}   # epad from D2/E2 = 5.30 mm in outline table
aec_q100: true
supplies:
  - {pins: [VA], volts: "1.8", note: "analog; 1.71-2.0 V"}
  - {pins: [VIO], volts: "1.8", note: "interface I/O; 1.62-3.6 V"}
  - {pins: [VCORE], volts: "1.8", note: "core digital; 1.62-2.0 V"}
  - {pins: [VMEM], volts: "1.8", note: "memory; 1.62-2.0 V"}
features:
  - "Worldwide FM band support (76-108 MHz)"
  - "Advanced RDS/RBDS decoder"
  - "DAB/DAB+ Band III support (168-240 MHz)"
  - "Supports WorldDMB Receiver Profiles I, II, III, and IV"
  - "Integrated SRAM supporting time and frequency de-interleaving"
  - "Advanced seek functionality"
  - "Full range of analog and digital signal quality metrics"
  - "Fully-integrated VCO/PLL/synthesizer"
  - "Fully-integrated advanced AGC and alignment"
  - "Flash memory interface for application program load"
  - "SPI, I2C control interfaces"
  - "7x7 mm 48-pin QFN package"
  - "Pb-free/RoHS compliant"
  - "AEC-Q100 qualified"
parts:
  - mpn: Si4624
    tuners: 1                  # single VHF receive path on the block diagram
    channels: null
    analog: [FM, RDS]
    digital_decode: [DAB]      # DAB and DAB+ data
    digital_iq: []
    options: []
    note: "Data receiver: no audio output pins on the block diagram"
# No pinout in this document (block diagram and package outline only): pin numbers unknown.
# `signals` lists the signal names drawn on the page-1 block diagram.
signals:
  - {name: RFREF, fn: other, note: "RF reference input of the VHF LNA (drawn as an LNA input)"}
  - {name: VHFI, fn: rf_in, band: FM/DAB}
  - {name: VHFSW, fn: rf_aux, note: "output from VHF front-end control block"}
  - {name: XTALI, fn: xtal}
  - {name: XTALO, fn: xtal}
  - {name: VIO, fn: power, volts: "1.8", note: "1.62-3.6 V"}
  - {name: VA, fn: power, volts: "1.8", note: "1.71-2.0 V"}
  - {name: VCORE, fn: power, volts: "1.8", note: "1.62-2.0 V"}
  - {name: VMEM, fn: power, volts: "1.8", note: "1.62-2.0 V"}
  - {name: NVSCLK, fn: flash, bus: "Flash"}
  - {name: NVSSB, fn: flash, bus: "Flash"}
  - {name: NVMOSI, fn: flash, bus: "Flash"}
  - {name: NVMISO, fn: flash, bus: "Flash"}
  - {name: SCLK, fn: host, bus: "Host"}
  - {name: SSB, fn: host, bus: "Host"}
  - {name: MISO, fn: host, bus: "Host"}
  - {name: MOSI, fn: host, bus: "Host"}
  - {name: INTB, fn: interrupt, bus: "Host"}
  - {name: RSTB, fn: reset, bus: "Host", note: "shown on the I2C/SPI host interface block"}
  - {name: GPIOx, fn: gpio, note: "count not stated"}
pins: []
