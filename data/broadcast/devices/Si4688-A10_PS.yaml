# Transcribed from Si4688-A10_PS.pdf (206769A, November 30, 2023).
# This product summary has no pin assignment (Figure 2 is only the mechanical QFN-48 outline), so pins
# is empty. 'signals' lists the unnumbered signal names from Figure 1, Functional Block Diagram.
source:
  title: "Si4688-A10 Single-Chip, FM/HD/DAB/DAB+ Radio Receiver"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/product-summaries/Si4688-A10_PS.pdf"
  revision: "206769A, November 30, 2023"
family: Si468x
description: "Single-Chip, FM/HD/DAB/DAB+ Radio Receiver"
role: receiver
package: {type: QFN, pins: 48, body_mm: "7 x 7 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: null
supplies:
  - {pins: [VA], volts: "1.71 to 2.0 (1.8 typ)", note: "analog supply"}
  - {pins: [VIO], volts: "1.62 to 3.6 (1.8 typ)", note: "interface supply"}
  - {pins: [VCORE], volts: "1.62 to 2.0 (1.8 typ)", note: "core digital supply"}
  - {pins: [VMEM], volts: "1.62 to 2.0 (1.8 typ)", note: "memory supply"}
features:
  - "Worldwide FM band support (76 to 108 MHz)"
  - "DAB, DAB+ Band III support (168 to 240 MHz)"
  - "Advanced RDS/RBDS decoder"
  - "FM HD Radio support with on-chip IBOC blend"
  - "Supports WorldDMB Receiver Profiles 1 and 2"
  - "Integrated OFDM channel demodulator"
  - "Integrated de-interleaving SRAM"
  - "I2S digital audio out with ASRC"
  - "Integrated 97 dB stereo audio DAC"
  - "Concurrent I2S/L-R stereo audio out"
  - "Full range of signal quality metrics"
  - "Fully-integrated VCO/PLL/synthesizer"
  - "SPI and I2C host control interfaces"
  - "ETSI EN 300 401 and ETSI TS 102 563 compliant"
  - "Ambient temperature -40 to 85 C"
parts:
  - mpn: Si4688-A10
    tuners: 1
    channels: null
    analog: [FM, RDS]
    digital_decode: [HD, DAB]
    digital_iq: []
    options: []
    note: "HD = FM HD Radio only; DAB = DAB (MPEG Audio Layer 2) and DAB+ (HE-AAC v2), Band III 168 to 240 MHz. No ordering guide / orderable variants in this document."
