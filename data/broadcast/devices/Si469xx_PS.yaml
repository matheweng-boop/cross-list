source:
  title: "Si469xx/xxC Product Summary (Si46999/Si469x1/Si469x2/Si469x3/Si469x4)"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/product-summaries/Si469xx_PS.pdf"
  revision: "206592E, December 10, 2025"
family: Si469xx/xxC
description: "High-Performance Automotive Digital Radio Coprocessor for HD Radio, DAB/DAB+, DRM, and CDR"
role: coprocessor
package: {type: QFN, pins: 88, body_mm: "12 x 12 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: true
note: >-
  Part numbers follow the ordering guide (Si469abccdddAMe): a = channels (2/3/4, 9 = software defined),
  b = standard (1 HD Radio, 2 DAB/DAB+, 3 CDR, 4 DRM, 9 software defined), ddd = GE1 (no customer-programmable MCU)
  or GC1 (with customer-programmable MCU). In this document the "C" (xxC / GC1) designates the customer-programmable
  ARM Cortex-M3 MCU, not seamless blending: every Si469x1..x4 ordering-guide entry, GE1 and GC1 alike, is described
  "with Seamless Blending". Append "R" for tape and reel. Pin VIO1/VIO0/VDIG voltages are not stated in the document.
supplies:
  - {pins: [VIO1], volts: null, note: "I/O supply for tuner interfaces (ZIF, tuner SPI, tuner audio I2S inputs)"}
  - {pins: [VIO0a, VIO0b], volts: null, note: "I/O supply for host interfaces (host SPI/I2C, host I2S, flash, UART, debug)"}
  - {pins: [VDIGa, VDIGb, VDIGc, VDIGd], volts: null, note: "core/digital supply"}
features:
  - "Up to four digital radio channels (2-/3-/4-channel coprocessor)"
  - "HD Radio (Si469x1), DAB/DAB+/DMB (Si469x2), CDR (Si469x3), DRM (Si469x4), multistandard software-defined (Si46999)"
  - "Four digital I/Q (ZIF) inputs from tuners; tuner control via two tuner SPI ports with up to five tuner select/reset lines"
  - "Seamless linking/blending of multiple audio streams"
  - "Digital Data Stream Interface (DDSI) for high-payload non-audio data over I2S"
  - "Three I2S/TDM audio inputs, two I2S/TDM audio outputs"
  - "Integrated customer-programmable ARM Cortex-M3 MCU (C parts only)"
  - "HD Radio, DAB, DRM+ or CDR Maximal Ratio Combining (MRC) for antenna diversity via software package"
  - "No external RAM needed"
  - "Serial flash interface (Quad SPI supported) for application load, OTA updates, autonomous self-boot"
  - "Two SPI/I2C host interfaces"
  - "UART interface allows control of XM/SDARS"
  - "Reference clock input"
  - "Supports 744.1875 kS/s (x1/x1C), 2.048 MS/s (x2/x2C), and 192 kS/s (x4/x4C)"
  - "88-pin 12 x 12 x 0.85 mm QFN, 0.5 mm pitch"
  - "AEC-Q100 qualified"
