source:
  title: "Si4704/05 Enhanced Broadcast FM Radio Receiver for Portable Applications"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si4704-05-short.pdf"
  revision: "September 13, 2021 (no revision number printed)"
family: Si4704/05
description: "Enhanced Broadcast FM Radio Receiver for Portable Applications"
role: receiver
package: {type: QFN, pins: 20, body_mm: "3 x 3 x 0.55", pitch_mm: 0.5, epad: true}
aec_q100: null
supplies:
  - {pins: [VDD], volts: "2.7-5.5", note: "supply voltage VD, VA (electrical spec); block diagram: 2.7-5.5 V VDD"}
  - {pins: [VIO], volts: "1.5-3.6", note: "interface supply voltage VIO"}
features:
  - "Worldwide FM band support (64-108 MHz)"
  - "Supports integrated antenna (tuned-resonance antenna technology)"
  - "Digital low-IF receiver"
  - "Frequency synthesizer with integrated VCO"
  - "Seek tuning, AFC, AGC"
  - "Integrated LDO regulator"
  - "RDS/RBDS decoder (Si4705 only)"
  - "Optional digital audio output (Si4705 only)"
  - "Programmable de-emphasis (50/75 us)"
  - "Programmable reference clock input (RCLK 32.768 kHz typ)"
  - "3 x 3 x 0.55 mm 20-pin Pb-free QFN package"
parts:
  - mpn: Si4704
    tuners: 1
    channels: null
    analog: [FM]
    digital_decode: []
    digital_iq: []
    options: []
    note: "analog audio out (LOUT/ROUT) only; no RDS, no digital audio output"
  - mpn: Si4705
    tuners: 1
    channels: null
    analog: [FM, RDS]
    digital_decode: []
    digital_iq: []
    options: ["Digital audio output (DOUT/DFS/DCLK)"]
    note: "RDS/RBDS decoder and optional digital audio output are Si4705 only"
pins:
  - {n: 1, name: NC, fn: nc}
  - {n: 2, name: FMI, fn: rf_in, band: FM, note: "FM input (headphone-cable antenna in block diagram)"}
  - {n: 3, name: RFGND, fn: ground, note: "RF ground"}
  - {n: 4, name: LPI, fn: rf_in, band: FM, note: "embedded/integrated antenna input per block diagram"}
  - {n: 5, name: RST, fn: reset, note: "printed with overbar (active low)"}
  - {n: 6, name: SEN, fn: host, bus: "Host", note: "printed with overbar (active low); serial enable"}
  - {n: 7, name: SCLK, fn: host, bus: "Host"}
  - {n: 8, name: SDIO, fn: host, bus: "Host"}
  - {n: 9, name: RCLK, fn: refclk, note: "32.768 kHz typ reference clock input"}
  - {n: 10, name: VIO, fn: power, volts: "1.5-3.6"}
  - {n: 11, name: VDD, fn: power, volts: "2.7-5.5"}
  - {n: 12, name: GND, fn: ground}
  - {n: 13, name: ROUT, fn: audio_out}
  - {n: 14, name: LOUT, fn: audio_out}
  - {n: 15, name: DOUT, fn: i2s_out, bus: "I2S out 0", note: "digital audio output, Si4705 only"}
  - {n: 16, name: DFS, fn: i2s_out, bus: "I2S out 0", note: "digital audio frame sync, Si4705 only"}
  - {n: 17, name: GPO3/DCLK, fn: gpio, bus: "I2S out 0", note: "alternate: DCLK digital audio bit clock (Si4705 only)"}
  - {n: 18, name: GPO2/INT, fn: gpio, note: "alternate: INT interrupt output (INT printed with overbar, active low)"}
  - {n: 19, name: GPO1, fn: gpio}
  - {n: 20, name: NC, fn: nc}
  - {n: 21, name: GND PAD, fn: ground, note: "exposed pad"}
