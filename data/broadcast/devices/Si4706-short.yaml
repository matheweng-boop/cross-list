source:
  title: "Si4706 High-Performance FM RDS/RBDS Data Receiver"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si4706-short.pdf"
  revision: "September 13, 2021 (no revision number printed)"
family: Si4706
description: "High-Performance FM RDS/RBDS Data Receiver"
role: receiver
package: {type: QFN, pins: 20, body_mm: "3 x 3 x 0.55", pitch_mm: 0.5, epad: true}
aec_q100: null
supplies:
  - {pins: [VDD], volts: "2.7-5.5", note: "features list and block diagram say 2.7-5.5 V; electrical spec table lists Supply Voltage min 3 V, max 5.5 V"}
  - {pins: [VIO], volts: "1.5-3.6", note: "interface supply voltage"}
features:
  - "Worldwide FM band support (76-108 MHz)"
  - "Advanced RDS/RBDS decoding engine; RDS reception with FM mono broadcast"
  - "Received signal quality indicators"
  - "Supports integrated antenna"
  - "Automatic gain control (AGC); integrated FM LNA; image-rejection mixer"
  - "Frequency synthesizer with integrated VCO"
  - "Low-IF direct conversion with no external ceramic filters"
  - "2.7 to 5.5 V supply voltage"
  - "Programmable reference clock (RCLK 32.768 kHz typ)"
  - "20-pin 3 x 3 mm QFN package, Pb-free/RoHS compliant"
  - "Stereo audio OUT"
  - "I2S digital audio OUT"
parts:
  - mpn: Si4706
    tuners: 1
    channels: null
    analog: [FM, RDS]
    digital_decode: []
    digital_iq: []
    options: ["Digital audio output (I2S)"]
    note: "dedicated RDS/RBDS data receiver (TMC/ODA); also stereo analog audio out"
pins:
  - {n: 1, name: NC, fn: nc}
  - {n: 2, name: FMI, fn: rf_in, band: FM, note: "FM input (headphone-cable antenna in block diagram)"}
  - {n: 3, name: RFGND, fn: ground, note: "RF ground"}
  - {n: 4, name: LPI, fn: rf_in, band: FM, note: "integrated antenna input per block diagram"}
  - {n: 5, name: RST, fn: reset, note: "printed with overbar (active low)"}
  - {n: 6, name: SEN, fn: host, bus: "Host", note: "printed with overbar (active low); serial enable"}
  - {n: 7, name: SCLK, fn: host, bus: "Host"}
  - {n: 8, name: SDIO, fn: host, bus: "Host"}
  - {n: 9, name: RCLK, fn: refclk, note: "32.768 kHz typ reference clock input"}
  - {n: 10, name: VIO, fn: power, volts: "1.5-3.6"}
  - {n: 11, name: VDD, fn: power, volts: "2.7-5.5"}
  - {n: 12, name: GND, fn: ground}
  - {n: 13, name: ROUT, fn: audio_out}
  - {n: 14, name: LOUT, fn: audio_out}
  - {n: 15, name: DOUT, fn: i2s_out, bus: "I2S out 0"}
  - {n: 16, name: DFS, fn: i2s_out, bus: "I2S out 0"}
  - {n: 17, name: GPO3/DCLK, fn: gpio, bus: "I2S out 0", note: "alternate: DCLK digital audio bit clock"}
  - {n: 18, name: GPO2/INT, fn: gpio, note: "alternate: INT interrupt output (INT printed with overbar, active low)"}
  - {n: 19, name: GPO1, fn: gpio}
  - {n: 20, name: NC, fn: nc}
  - {n: 21, name: GND PAD, fn: ground, note: "exposed pad"}
