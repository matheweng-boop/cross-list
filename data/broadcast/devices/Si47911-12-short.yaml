source:
  title: "Si47911/12 Data Short"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si47911-12-short.pdf"
  revision: "August 22, 2021"
family: Si47911/12
description: "High-Performance Automotive AM/FM Radio Receiver and HD Radio/DAB/DAB+/DMB/DRM Tuner with Audio System"
role: receiver
package: {type: QFN, pins: 84, body_mm: "12 x 12 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: true
note: >-
  The document does have a pin assignment figure (page 2); pins below are transcribed from it. CAUTION: that figure
  does not match the feature list/block diagram of this same document: the block diagram shows LBI, LBO, B3I/WXI,
  B3O, AMO, AOUT4, AOUT5 and audio input ports 3/4 (DIN3/DICLK3/DIFS3, DIN4/DICLK4/DIFS4), and the features list
  six analog outputs and seven I2S ports, yet none of these pins appear in the figure (pins 2, 3, 8, 9, 11, 15, 16,
  62-67 are NC). The figure is identical to the Si47920/21 figure except that pins 2/3 are NC instead of AOUT4/AOUT5.
  It probably does not show the Si47912 Band III/L-band inputs; confirm against the full data sheet before routing
  RF or audio port 3/4. No revision number is printed (date only). Feature list says "AEQ-Q100 qualified" (typo for AEC-Q100).
  DRM appears in the title only; no DRM feature or variant is given, so it is not assigned to a part.
supplies:
  - {pins: [VA], volts: "3.3", note: "analog"}
  - {pins: [VD], volts: "1.8", note: "digital"}
  - {pins: [VIO1, VIO2], volts: "1.8 or 3.3", note: "digital I/O"}
features:
  - "Worldwide FM (64-108 MHz), AM (520-1710 kHz), LW (144-288 kHz), SW (2.3-30 MHz), NOAA Weather Band"
  - "DAB/DAB+/DMB support (170-240 MHz, 1452-1492 MHz) (Si47912 only)"
  - "On-chip soft-decision RDS/RDBS demodulator/decoder"
  - "Integrated active AM/FM buffers for background/data tuners"
  - "Analog FM phase diversity with two, three or four tuners"
  - "HD Radio: digital I/Q interface to HD Radio processor, MRC with two, three or four tuners, AM/FM IBOC blend, fast FM HD band scan"
  - "DAB/DAB+/DMB (Si47912 only): digital I/Q interface to DAB processor, MRC with two, three or four tuners, Band III/L-band buffers, AGC for Band III and L-band"
  - "HiFi2-EP Audio DSP with 288 kB program and data memory"
  - "Seven analog audio inputs, six analog audio outputs, seven digital audio ports (I2S) with TDM support"
  - "Up to 24 synchronous or asynchronous sample rate converters"
  - "Integrated clock oscillator; frequency synthesizer with integrated PLL-VCO"
  - "1.8 V or 3.3 V digital I/O supplies; 3.3 V analog and 1.8 V digital supply"
  - "QFN 84-pin, 12 x 12 x 0.85 mm; Pb-free/RoHS compliant"
parts:
  - mpn: Si47911
    tuners: 1
    channels: null
    analog: [AM, FM, LW, SW, WB, RDS]
    digital_decode: []
    digital_iq: [HD]
    options: ["Audio DSP (HiFi2-EP)", "Analog FM phase diversity"]
    note: "No DAB/DAB+/DMB (Si47912 only)"
  - mpn: Si47912
    tuners: 1
    channels: null
    analog: [AM, FM, LW, SW, WB, RDS]
    digital_decode: []
    digital_iq: [HD, DAB, DMB]
    options: ["Audio DSP (HiFi2-EP)", "Analog FM phase diversity"]
    note: "Adds DAB/DAB+/DMB (Band III 170-240 MHz and L-band 1452-1492 MHz) I/Q output"
