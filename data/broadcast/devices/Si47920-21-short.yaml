source:
  title: "Si47920/21 Data Short"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si47920-21-short.pdf"
  revision: "August 22, 2021"
family: Si47920/21
description: "High-Performance Automotive AM/FM Radio Receiver and HD Radio Tuner with Audio System"
role: receiver
package: {type: QFN, pins: 84, body_mm: "12 x 12 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: true
note: >-
  No revision number is printed (date only). The feature list says four analog audio outputs, but the pin
  assignment figure shows six (AOUT0-AOUT5) and the block diagram also shows AOUT0-AOUT5. The power-supply
  bullets read "1.8V or 3.3V digital power supply" and "3.3V analog and 1.8V digital power supplies"; mapping
  1.8/3.3 V to VIO1/VIO2 follows the sibling Si479xx data shorts' wording and is not spelled out per pin here.
  NOAA weather band is not listed for this device.
supplies:
  - {pins: [VA], volts: "3.3", note: "analog"}
  - {pins: [VD], volts: "1.8", note: "digital"}
  - {pins: [VIO1, VIO2], volts: "1.8 or 3.3", note: "digital I/O (document: '1.8V or 3.3V digital power supply')"}
features:
  - "Worldwide FM (64-108 MHz), AM (520-1710 kHz), LW (144-288 kHz), SW (2.3-30 MHz)"
  - "On-chip soft-decision RDS/RDBS demodulator/decoder"
  - "Integrated active FM buffer for background/data tuners"
  - "Analog FM phase diversity with two, three or four tuners (Si47921 only)"
  - "HD Radio (Si47921 only): digital I/Q interface to HD Radio processor, AM/FM IBOC blend, fast FM HD band scan"
  - "HiFi2-EP Audio DSP with 288 kB program and data memory"
  - "Seven analog audio inputs, four analog audio outputs, five digital audio ports (I2S)"
  - "Up to 24 synchronous or asynchronous sample rate converters; multi-channel audio reference design"
  - "Integrated clock oscillator; frequency synthesizer with integrated PLL-VCO"
  - "QFN 84-pin, 12 x 12 x 0.85 mm; Pb-free/RoHS compliant"
  - "AEC-Q100 qualified"
parts:
  - mpn: Si47920
    tuners: 1
    channels: null
    analog: [AM, FM, LW, SW, RDS]
    digital_decode: []
    digital_iq: []
    options: ["Audio DSP (HiFi2-EP)"]
    note: "AM/FM only; no HD Radio I/Q, no FM phase diversity"
  - mpn: Si47921
    tuners: 1
    channels: null
    analog: [AM, FM, LW, SW, RDS]
    digital_decode: []
    digital_iq: [HD]
    options: ["Audio DSP (HiFi2-EP)", "Analog FM phase diversity"]
    note: "HD Radio I/Q to an external HD Radio processor (Si47921 only)"
