  - {n: 2, name: "XTALI", fn: xtal}
  - {n: 3, name: "NC", fn: nc}
  - {n: 4, name: "NC", fn: nc}
  - {n: 5, name: "B3A", fn: rf_in, band: "DAB", note: "Band III input A"}
  - {n: 6, name: "B3B", fn: rf_in, band: "DAB", note: "Band III input B"}
  - {n: 7, name: "NC", fn: nc}
  - {n: 8, name: "NC", fn: nc}
