source:
  title: "Si47942 Data Short"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si47942-short.pdf"
  revision: "Rev. 0.1, December 6, 2021"
family: Si47942
description: "High-Performance Automotive DAB/DAB+/DMB Tuner"
role: tuner
package: {type: QFN, pins: 56, body_mm: "8 x 8 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: true
note: >-
  AEC-Q100 qualification is stated for A-grade devices. The document gives no ordering guide; only Si47942 is listed.
  The exposed pad is drawn in the pinout and package drawing (D2/E2) but its connection is not stated.
  Functions of ICP/ICN, ISFSP/ISFSN, DIFS0/DICLK0 and GP0-GP2 are not described in this data short.
supplies:
  - {pins: [VA1, VA2], volts: "3.3", note: "analog"}
  - {pins: [VD], volts: "1.8", note: "digital"}
  - {pins: [VIO1, VIO2], volts: "1.8 or 3.3", note: "digital I/O"}
features:
  - "Two global radio receivers (dual DAB/DAB+/DMB tuner)"
  - "Dual DAB/DAB+/DMB support (168-240 MHz)"
  - "Digital I/Q interface to DAB/DAB+/DMB processor"
  - "DAB/DAB+/DMB MRC with two tuners"
  - "Integrated active Band III buffers for background/data tuners"
  - "Fast DAB/DAB+/DMB band scan"
  - "Fully integrated AGCs for Band III inputs"
  - "Frequency synthesizers with fully integrated PLL-VCOs"
  - "Integrated clock oscillator"
  - "1.8 V or 3.3 V digital I/O power supplies; 3.3 V analog and 1.8 V digital power supply"
  - "QFN 56-pin, 8 x 8 x 0.85 mm; Pb-free/RoHS compliant"
  - "AEC-Q100 qualified (A-grade devices)"
parts:
  - mpn: Si47942
    tuners: 2
    channels: null
    analog: []
    digital_decode: []
    digital_iq: [DAB, DMB]
    options: []
    note: "DAB/DAB+/DMB only; no AM/FM listed"
pins:
