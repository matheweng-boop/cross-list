source:
  title: "Si47971-72 Data Short"
  url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-shorts/Si47971-72-short.pdf"
  revision: "Rev. 0.1, July 26, 2021"
family: Si4797x
description: "High-Performance Automotive AM/FM Radio Receiver and HD Radio/DAB/DAB+/DMB/DRM Tuner with Audio System"
role: tuner
package: {type: QFN, pins: 88, body_mm: "12 x 12 x 0.85", pitch_mm: 0.5, epad: true}
aec_q100: true   # "AEC-Q100 qualified (A-grade parts)"
supplies:
  - {pins: [VA1, VA2], volts: "3.3", note: "analog power supply"}
  - {pins: [VD], volts: "1.8", note: "digital power supply"}
  - {pins: [VIO1, VIO2], volts: "1.8 or 3.3", note: "digital IO power supplies"}
features:
  - "Dual worldwide FM band support (64-108 MHz)"
  - "Dual worldwide AM band support (520-1710 kHz)"
  - "Dual LW band support (144-288 kHz)"
  - "Dual SW band support (2.3-30 MHz)"
  - "Dual DAB/DAB+/DMB support (Si47972 only) (168-240 MHz)"
  - "NOAA Weather Band support"
  - "On-chip RDS/RDBS"
  - "Integrated active AM/FM buffers; analog FM phase diversity"
  - "HD Radio: digital I/Q interface to HD Radio processor, HD Radio MRC"
  - "DRM30/DRM+: digital I/Q interface to DRM processor"
  - "DAB/DAB+/DMB (Si47972 only): digital I/Q interface to DAB processor, DAB MRC, integrated active Band III buffer"
  - "Audio system: Tensilica HiFi2-EP audio DSP"
  - "S/PDIF digital audio interface"
  - "QFN 88-pin, 12 x 12 x 0.85 mm"
  - "Pb-free/RoHS compliant"
  - "AEC-Q100 qualified (A-grade parts)"
parts:
  - mpn: Si47971
    tuners: 2
    channels: null
    analog: [AM, FM, LW, SW, WB, RDS]
    digital_decode: []
    digital_iq: [HD, DRM]
    options: ["Audio DSP (Tensilica HiFi2-EP audio processing subsystem)"]
    note: null
  - mpn: Si47972
    tuners: 2
    channels: null
    analog: [AM, FM, LW, SW, WB, RDS]
    digital_decode: []
    digital_iq: [HD, DRM, DAB, DMB]
    options: ["Audio DSP (Tensilica HiFi2-EP audio processing subsystem)"]
    note: "DAB/DAB+/DMB (dual, 168-240 MHz, with MRC) is Si47972 only"
pins:
  - {n: 1, name: AOUT5, fn: audio_out}
  - {n: 2, name: ABYP1, fn: bypass}
  - {n: 3, name: VA1, fn: power, volts: "3.3"}
  - {n: 4, name: CLKO, fn: clock_out}
  - {n: 5, name: XTALO, fn: xtal}
  - {n: 6, name: XTALI, fn: xtal}
  - {n: 7, name: DACREF, fn: bypass}
  - {n: 8, name: FMA, fn: rf_in, band: FM}
  - {n: 9, name: B3A, fn: rf_in, band: DAB, note: "Band III input; DAB on Si47972 only"}
  - {n: 10, name: B3B, fn: rf_in, band: DAB, note: "Band III input; DAB on Si47972 only"}
  - {n: 11, name: FMB, fn: rf_in, band: FM}
  - {n: 12, name: AMO, fn: rf_aux, note: "AM-side buffer/output pin per block diagram; exact use not described in this document"}
  - {n: 13, name: AMI, fn: rf_in, band: AM}
  - {n: 14, name: AMVAG, fn: bypass}
  - {n: 15, name: LTB, fn: rf_aux, note: "output of an integrated active RF buffer per block diagram"}
  - {n: 16, name: LTA, fn: rf_aux, note: "output of an integrated active RF buffer per block diagram"}
