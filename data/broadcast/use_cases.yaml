# Use-case presets for the broadcast configurator (Broadcast > Configurations > Use case).
#
# Slots IC0..IC2 are tuner ICs (mpn: null = not populated), IC3 is the demodulator.
# Tuner jobs:  off, fm_audio, am_audio, amfm_audio, fm_pd (FM phase diversity, both tuners of one IC),
#              fm_scan, am_scan, dab, fm_dab_scan, drm
# Feeds:       {antenna: ANT1} or {loop: IC0} (loop-through from the buffer output of another IC)
# Demod jobs:  unused, hd_audio, hd_data, dab_audio, dab_scanless, drm_audio, cdr_audio
# Sources:     "IC0.T0" = tuner 0 of IC0
- name: North America HD
  region: North America
  linking: false
  antennas:
    - {id: ANT1, label: AM/FM, bands: [AM, FM]}
  ics:
    IC0:
      mpn: Si47961
      tuners:
        - {job: amfm_audio, feed: {antenna: ANT1}}
        - {job: fm_scan, feed: {antenna: ANT1}}
    IC1: {mpn: null}
    IC2: {mpn: null}
    IC3:
      mpn: Si46931A1GE1AM
      channels:
        - {job: hd_audio, source: IC0.T0}
        - {job: hd_data, source: IC0.T1}
        - {job: unused}
  notes: >-
    IC0 tuner 0 plays AM or FM audio, tuner 1 builds the FM station list in the background.
    IC3 decodes AM/FM HD audio on DMOD0 and FM HD data / station list on DMOD1; DMOD2 is unused.
    IC1 and IC2 are not populated (lower tuner variant).

- name: North America without HD / rest of world, single tuner
  region: Rest of world
  linking: false
  antennas:
    - {id: ANT1, label: AM/FM, bands: [AM, FM]}
  ics:
    IC0:
      mpn: Si47951
      tuners:
        - {job: amfm_audio, feed: {antenna: ANT1}}
    IC1: {mpn: null}
    IC2: {mpn: null}
    IC3: {mpn: null}
  notes: >-
    Listening mode AM or FM on IC0. With a single tuner there is no background scan.

- name: Rest of world, dual tuner (AM foreground, FM background)
  region: Rest of world
  linking: false
  antennas:
    - {id: ANT1, label: AM/FM, bands: [AM, FM]}
  ics:
    IC0:
      mpn: Si47961
      tuners:
        - {job: am_audio, feed: {antenna: ANT1}}
        - {job: fm_scan, feed: {antenna: ANT1}}
    IC1: {mpn: null}
    IC2: {mpn: null}
    IC3: {mpn: null}
  notes: >-
    AM in the foreground on tuner 0 while tuner 1 keeps the FM station list up to date. With FM in the
    foreground, tuner 1 does the FM background scan instead.

- name: DAB, four tuners with FM phase diversity
  region: Europe
  linking: true
  antennas:
    - {id: ANT1, label: FM 1, bands: [FM]}
    - {id: ANT2, label: FM 2, bands: [FM]}
    - {id: ANT3, label: DAB Band III, bands: [DAB]}
  ics:
    IC0:
      mpn: Si47962
      tuners:
        - {job: fm_pd, feed: {antenna: ANT1}}
        - {job: fm_pd, feed: {antenna: ANT2}}
    IC1:
      mpn: Si47962
      tuners:
        - {job: dab, feed: {antenna: ANT3}}
        - {job: fm_dab_scan, feed: {loop: IC0}}
    IC2: {mpn: null}
    IC3:
      mpn: Si46922A1GE1AM
      channels:
        - {job: dab_audio, source: IC1.T0}
        - {job: dab_scanless, source: IC1.T1}
  notes: >-
    2x Si47962 = four tuners. IC0 tuners 0 and 1 play FM with phase diversity; IC1 tuner 0 receives DAB,
    tuner 1 does the FM / DAB background scan. The demod plays DAB audio or runs DAB scanless.
    Seamless linking FM <-> DAB uses IC1, so phase diversity can keep running.

- name: DAB, one dual tuner (linking vs phase diversity)
  region: Europe
  linking: true
  antennas:
    - {id: ANT1, label: FM, bands: [FM]}
    - {id: ANT2, label: DAB Band III, bands: [DAB]}
  ics:
    IC0:
      mpn: Si47962
      tuners:
        - {job: fm_audio, feed: {antenna: ANT1}}
        - {job: dab, feed: {antenna: ANT2}}
    IC1: {mpn: null}
    IC2: {mpn: null}
    IC3:
      mpn: Si46922A1GE1AM
      channels:
        - {job: dab_audio, source: IC0.T1}
        - {job: unused}
  notes: >-
    With one dual tuner, seamless linking needs tuner 1 for DAB while tuner 0 plays FM. Switching tuner 0
    and 1 to FM phase diversity leaves no tuner for linking: step out of phase diversity first.
