      telematics; a single-transmit PA module with a small diversity receiver fits that tier next to our Sky5 Value set.
    missing: RedCap-optimised single-TX PAMiD and DRx design, AEC-Q104 qualification.
    driver: "EU NG-eCall: new types from 1 Jan 2026, all new vehicles from 1 Jan 2027 (Reg. 2024/1180)"
    demand: high
    confidence: medium
    sources:
