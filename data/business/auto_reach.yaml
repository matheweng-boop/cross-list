    platforms: [gaas_hbt, baw_filter, sip_module_integration]
    why: >-
      In-car Wi-Fi moves to Wi-Fi 7 (5 and 6 GHz together, 320 MHz channels). Wi-Fi sits on both sides of the 5.9 GHz
