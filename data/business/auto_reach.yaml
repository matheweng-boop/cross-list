# Automotive map (Opportunities > Automotive map): how far Skyworks + Qorvo are from an automotive product, per
# automotive application and function.
#
# The ladder (one letter per cell):
#   A  automotive today      we sell a part of this function with an automotive grade (AEC-Q100/Q200)
#   B  qualify it            we sell parts of this function, none automotive: mostly qualification work
#   C  variant               we have the technology and a close product; a new design on the same process
#   D  adjacent technology   related technology we own, further away (new process steps, packaging or partners)
#   gap                      neither company has it
#
# A and B are COMPUTED from the parts (catalogue + cross lists; grade from app/services/autograde.py), never typed.
# This file only adds what the parts cannot say:
#   applications: the automotive applications shown as rows; `templates` are case-insensitive pieces of library
#                 diagram names (data/blocks/templates.yaml); the functions of those diagrams become the row's cells.
#   rows:         C / D / gap calls, next steps and notes. Fields:
#     app          application id, or "*" for every application that uses the function
#     fn           function id (data/blocks/functions.yaml)
#     level        B | C | D | gap. On a cell with no part of ours (or with override) this is the cell's level. On a
#                  cell we already fill (computed A or B) it is the NEXT step (e.g. A today, a C variant next).
#                  Omit it for a note only.
#     override     true: replaces a computed A/B for this application (our parts exist, but not for what this
#                  application needs, e.g. its band); default false
#     title        short name of the step, shown in Top moves (optional; default the function name)
#     parts        MPNs that show the starting point (optional)
#     platforms    ids from data/business/capabilities.yaml (optional)
#     why          one or two sentences: why this level
#     missing      what it takes to get to an automotive product
#     driver       what drives it, with a date: a regulation, an OEM programme or a standard (optional)
#     demand       high | medium | low: how strongly the sources show car makers needing it (optional; ranks moves)
#     confidence   high | medium | low (low or medium where a fact comes from a search snippet or a vendor claim)
#     sources      list of "title, publisher, year, URL"
#     status       proposed (until accepted on the page; reviews are stored in the database, not here)
#
# Seeded 2026-10-20 from the public technology platforms (capabilities.yaml `could_also`), the automotive library
# diagrams and two desk-research notes on automotive connectivity and on sensing / SDV / EV (public sources only).

# the default "RF, radio & timing" view: these function categories plus these functions (radio SoCs and radar)
rf_view:
  categories: [rf, radio]
  functions: [uwb_soc, wireless_soc, radar_transceiver, serdes, clock_generator, clock_buffer, crystal_oscillator,
              jitter_attenuator, pcie_buffer]

applications:
  - {id: telematics, label: "Telematics & 5G TCU", templates: [telematics, tcu]}
  - {id: v2x, label: V2X, templates: [v2x]}
  - {id: satellite, label: "Satellite / NTN link", templates: []}
  - {id: access, label: "Digital key & car access", templates: [phone-as-a-key, smart car access]}
  - {id: infotainment, label: "Infotainment, radio & cluster", templates: [radio, infotainment, instrument cluster]}
  - {id: adas, label: "ADAS, radar & LiDAR", templates: [adas, 77 ghz radar, lidar]}
  - {id: incabin, label: In-cabin radar, templates: [in-cabin]}
  - {id: bms, label: Battery systems, templates: [battery]}
  - {id: traction, label: "Traction inverter & motor drives", templates: [traction inverter, bldc, e-compressor]}
  - {id: onboard, label: "On-board charger & DC/DC", templates: [on-board charger, obc, hv-to-lv]}
  - {id: charging, label: EV charging stations, templates: [wallbox, charging station]}
  - {id: body, label: "Body, power distribution & vehicle control", templates: [power distribution, vehicle control unit, fuel cell]}



rows:
  # ---- telematics, V2X and satellite (connectivity research)
  - app: v2x
    fn: v2x_fem
    level: C
    title: "Two-carrier C-V2X front end with a wide BAW filter"
    parts: [SKY5A2105]
    platforms: [baw_filter, gaas_hbt, sip_module_integration]
    why: >-
      SKY5A2105 is our automotive V2X front end today. The US moves to C-V2X only on two channels that need two radios,
      and Europe wants ITS-G5, LTE-V2X and NR-V2X side by side over 5855–5925 MHz, so the next part has two paths, a
      wider BAW passband and NR-V2X linearity.
    missing: Two-path FEM design, wider BAW filter, NR-V2X PA linearity at back-off.
    driver: "US: DSRC ends 14 Dec 2026 (FCC); EU: 5G-V2X Direct market readiness 2026–2029 (5GAA)"
    demand: high
    confidence: high
    sources:
      - "5.9 GHz Second Report and Order – FAQ, 5GAA, 2025, https://5gaa.org/content/uploads/2025/02/faq-5.9-ghz.pdf"
      - "5.9 GHz band configuration for road-ITS deployment in Europe, 5GAA, 2024, https://5gaa.org/content/uploads/2024/03/5gaa-position-paper-european-road-its-deployment.v3.pdf"
