# Preliminary case: the SKY4680x automotive audio DSP (owner, 10 Nov 2026: "Today Skyworks announced an audio DSP
# processor, SKY48 - make one [research + business case] for that, especially the use cases, where to apply it, and
# where to hunt"). The part Skyworks publishes is the SKY4680x family (SKY46801 / SKY46802 / SKY46803); no part named
# "SKY48" was found. Layout and rules: _template.yaml. Every figure and link: auto-audio-dsp.background.html.
# conf: high = primary document read; med = trade press or advocacy body; low = snippet, general knowledge or analyst
# PR. "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
gist: "SKY4680x is our first standalone car audio DSP; hunt amplifier and head-unit sockets first and sell it with our tuners, clocks and front ends (est)."
abstract:
  - "SKY4680x: one, two or three DSP cores, on-chip SRAM without DRAM, I2S, flash boot, optional MCU, third-party audio IP; for car amplifiers and head units."
  - "TI sells the closest parts (AM2754-Q1, AM62D-Q1, $25–33 at 1k); ADI SHARC with A2B leads premium amplifiers; cockpit SoCs absorb the low end."
  - "Decide to pursue external amplifiers and radio head units first, with a tuner + DSP + clock set; watch sound zones and noise cancellation; drop consumer for now."
title: "SKY4680x automotive audio DSP: where to use it, where to hunt, and what to sell with it"
fn: audio_codec
headline: f-sky4680x
library: []
question: >-
  Skyworks announced the SKY4680x automotive audio DSP (one, two or three cores) for car amplifiers and head units.
  Where does it fit (in-cabin audio, sound zones, noise cancellation, engine sound, voice, consumer and pro audio),
  against ADI SHARC, TI, NXP, Qualcomm and Tensilica-based SoCs, which sockets and companies should we hunt first,
  and which of our other parts sell with it?
updated: 2026-11-10
brief:
  - "SKY4680x is Skyworks' first standalone automotive audio DSP: one, two or three DSP cores with on-chip SRAM (no external DRAM), I2S connectivity, fast boot from flash, an optional customer-programmable MCU, support for third-party audio IP and Skyworks' own edge-AI audio algorithms, and a graphical tuning tool with planned Audio Weaver support; it sits next to our automotive tuners and digital radio coprocessors."
  - "Our weak points: no public figure yet for MIPS, channel count, sample rates, package or AEC-Q100; no wired audio bus of our own (A2B is ADI's) and no audio amplifier or codec; TI's AM2754-Q1 makes the same no-DRAM pitch with 80 GFLOPS, 10.75 MB SRAM and AEC-Q100 at $28–33 (1k list), and cockpit SoCs keep absorbing basic audio processing."
  - "Proposal: pursue external amplifiers and radio head units first with a tuner + SKY4680x + clock set at about $4–11 per DSP by core count (est), watch sound zones and road-noise cancellation until latency and interfaces are public, and drop consumer and pro audio for now."

customer_benefit:
  for: "Car-audio amplifier makers and head-unit Tier-1s (Harman, Alps Alpine, Denso Ten, Pioneer, Bosch type); OEM audio teams"
  summary: "One scalable DSP family with on-chip memory and a graphical tool replaces a DRAM-based audio processor or a fixed-function DSP, so one amplifier design covers entry, mid and premium trims."
  today: "Entry: the tuner's built-in audio DSP (e.g. our Si479xx with HiFi2-EP) or the cockpit SoC's DSP. Mid and premium: a separate amplifier with ADI SHARC-class DSPs (often two or more, with external memory) or a TI AM275x / AM62D-class processor, an A2B or I2S/TDM link from the head unit, 8 to more than 20 channels of class-D amplifiers."
  with_us: "SKY4680x (one, two or three cores, pin choice not stated) in the amplifier or head unit, SRAM on chip so no DRAM, boot from flash, optional on-chip MCU for amplifier control; tuning in Skyworks' graphical tool and Audio Weaver (planned); next to our Si479xx tuners, Si469xx coprocessors and Si5332-AM clocks."
  gains:
    - {id: cb-dram, kind: parts, gain: "No external DRAM for the audio processor", how: "Integrated on-chip SRAM (Skyworks video)", measure: "1 DRAM -> 0 (est), and no DRAM supply risk", conf: high}
    - {id: cb-scale, kind: scaling, gain: "One amplifier design from entry to premium", how: "One-, two- and three-core variants of one family and one tool", measure: "3 core options (Skyworks page); pin compatibility not stated", conf: med}
    - {id: cb-mcu, kind: parts, gain: "Amplifier control without a separate MCU", how: "Optional customer-programmable MCU on chip", measure: "1 MCU -> 0 where it is enough (est)", conf: med}
    - {id: cb-sw, kind: software, gain: "Existing tuning work carries over", how: "Third-party audio IP and own algorithms run on it; Audio Weaver support planned", measure: "not stated", conf: med}
    - {id: cb-source, kind: sourcing, gain: "Radio, audio DSP and clock from one supplier", how: "SKY4680x next to our tuners, coprocessors and automotive clocks", measure: "3 suppliers -> 1 for these blocks (est)", conf: low}
  gives_up:
    - "Code and tuning written for ADI SHARC or TI C7x must be ported; Audio Weaver support is planned, not stated as available"
    - "Interfaces beyond I2S (TDM, A2B, Ethernet AVB, USB) are not stated; an A2B transceiver or a TDM bridge may still be needed"

position:
  advantages:
    - {id: a-nodram, text: "On-chip SRAM, no external DRAM: lower BOM and no DRAM supply risk (Skyworks video); TI AM62D-Q1 needs LPDDR4", vs: "TI AM62D-Q1; DRAM-based SoCs", conf: high}
    - {id: a-scale, text: "One family in one-, two- and three-core versions for entry to premium audio", vs: "ADI SHARC (several part lines); TI AM275x (dual or quad R5F, one or two C7x)", conf: med}
    - {id: a-radio, text: "Sits next to our automotive tuners (Si479xx) and digital radio coprocessors (Si469xx): one supplier for radio and audio processing in the head unit", vs: "NXP (radio + audio SoCs), ST", conf: high}
    - {id: a-open, text: "Open to third-party audio IP and customer algorithms, plus Skyworks' own edge-AI audio algorithms", vs: "Fixed-function audio DSPs", conf: med}
    - {id: a-tool, text: "Graphical configuration tool with a block library; Audio Weaver support planned (the common tool of amplifier makers)", vs: "Proprietary tool flows", conf: med}
  disadvantages:
    - {id: d-specs, text: "No public MIPS, channel count, sample rates, package, power or AEC-Q100 statement yet; amplifier makers compare GFLOPS and memory first", vs: "TI AM2754-Q1 (80 GFLOPS, 10.75 MB SRAM, AEC-Q100, list prices public)", offset: "Publish a product brief with these figures and the grade (feature f-docs)", conf: high}
    - {id: d-a2b, text: "No wired audio bus: A2B (ADI) links microphones, accelerometers and amplifiers in many premium cars; only I2S is stated for SKY4680x", vs: "ADI SHARC + A2B", offset: "Support TDM and an A2B transceiver on I2S/TDM in the reference design (f-tdm)", conf: med}
    - {id: d-soc, text: "Cockpit SoCs (Qualcomm, NXP, MediaTek, TI) and audio-tuner SoCs carry DSPs and absorb entry audio", vs: "Qualcomm, NXP, TI", offset: "Aim at external amplifiers and premium head units, where the SoC's DSP is not enough or not owned by the audio team", conf: med}
    - {id: d-new, text: "New entrant with no automotive audio DSP track record; amplifier makers keep DSP families for many years", vs: "ADI, TI", offset: "Start with the radio head-unit customers we know; long-term supply statement", conf: med}
    - {id: d-amp, text: "No automotive audio amplifier or codec of our own to complete the chain", vs: "TI (TAS6xxx-Q1 amplifiers), ST, NXP", offset: "Partner reference designs; Si824x gate drivers only for high-power pro amplifiers", conf: high}
  diff_good:
    - {id: g-sram, text: "Memory on chip at one, two or three cores: the BOM saving rises with trim level instead of adding a DRAM at the top", conf: med}
    - {id: g-set, text: "Radio + audio DSP + clock + 2.4 GHz front ends from one supplier for a head unit", conf: med}
  diff_bad:
    - {id: b-noband, text: "Public facts are thin: every comparison today rests on Skyworks' page and video only", conf: high}
    - {id: b-old, text: "Our tuners' built-in audio DSP is an older HiFi2-EP; buyers may see SKY4680x as unproven next to it", conf: low}

