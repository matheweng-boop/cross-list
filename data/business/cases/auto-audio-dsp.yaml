thread:
  benefit: "No DRAM and one family from entry to premium is the gain to sell; both rest on Skyworks' own video."
  position: "Radio + audio from one supplier is our edge; missing public figures and no wired audio bus are the gaps."
  market: "About 30–50 M dedicated audio DSP sockets a year (est); TI shows the price level with public figures."
  outlook: "More channels and immersive audio favor separate amplifiers; entry audio moves into the cockpit SoC."
  features: "A product brief and Audio Weaver (distance 1) come before reference designs; TDM or A2B may need a new chip."
  product: "Sell SKY4680x as published with a head-unit set; the amplifier reference design follows."
  asp: "$4–11 per DSP by core count (est), about half of TI's 1k list for larger parts."
  attach: "Tuners and clocks first; 2.4 GHz front ends and later UL2X in the same car."
  questions: "Performance, interfaces and grade (q-bu-specs, q-bu-if) are needed now."
  risks: "If audio moves into the central computer, only premium amplifiers remain, where ADI is strongest."
