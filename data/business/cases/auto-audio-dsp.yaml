risks:
  - "Audio processing moves into the cockpit SoC or central computer faster than expected; the standalone socket shrinks to premium amplifiers."
  - "Performance, channels, latency and grade are not public; if SKY4680x has fewer GFLOPS than TI or ADI, it stays in entry and mid amplifiers."
  - "No A2B or TDM stated: road-noise cancellation and many-channel premium systems may be out of reach without a bridge."
  - "Amplifier makers keep DSP families for years; switching costs (code, tuning, tools) are high."
  - "TI prices aggressively and offers Ethernet TSN and AEC-Q100 with public figures today."
  - "Unknown from public data: SKY4680x price, MIPS, package, power, AEC-Q100 status and the edge-AI algorithms' names."

