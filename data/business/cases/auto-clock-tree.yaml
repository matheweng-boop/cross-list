  name: "ZoneClock ZC-12 / ZC-4 (crystal-free automotive clock tree)"
  spec:
    - ["Outputs", "ZC-12: 12 differential (or 24 LVCMOS) · ZC-4: 4 differential; per-output format LVDS, LP-HCSL, HCSL, LVCMOS; 85/100 Ω"]
    - ["Frequencies", "Any frequency to 333 MHz: PCIe 100 MHz (SSC), Ethernet 25/125/156.25 MHz, SerDes and SoC references"]
    - ["Targets (est)", "PCIe Gen 1–6 common clock, SRNS and SRIS; ≤100 fs rms; Grade 1 (–40 to 125 °C); AEC-Q100"]
    - ["Safety", "SmartClock monitors, fault pins to the safety manager, ISO 26262 safety manual (ASIL-B ready, est)"]
    - ["Reuses", "Si5332 MultiSynth and output drivers, SmartClock, SKY631xx BAW resonator, ClockBuilder Pro"]
    - ["New", "Automotive-qualified BAW resonator package, Grade 1 design, Gen 6 jitter budget"]
    - ["Replaces", "Si5332-AM + crystal + 1–3 XOs + one fan-out buffer per computer or zone"]
    - ["Answers", "TI LMK3H0102-Q1, SiTime Chorus SiT9128x, Renesas 5P49V60"]
    - ["Delivery (est)", "Steps now (references, Gen 6 data, crystal-in-package): 6–12 months · ZoneClock: 24–36 months"]

prices:
  method: "Anchor on public list prices (low confidence) → value of what the part replaces → volume range. Assumption: automotive contract prices are 30–50 % below these 1 k-reel list prices. Crystal and XO values are not public in our sources (not stated); their allowance is our judgement. Enter real ASPs to replace the estimates."
  anchors:
    - {part: "TI LMK3H0102-Q1 (2 outputs, crystal-free, Gen 7)", price: "$3.55", qty: "1 k"}
    - {part: "Skyworks Si5332D-D-AM2R (8 outputs, needs crystal)", price: "$10.08", qty: "1 k (distributor snippet)"}
    - {part: "Skyworks Si5332 variant", price: "$4.13", qty: "1 k+ (distributor snippet)"}
