  - {figure: "Automotive timing SAM (SiTime's view)", value: "$400–500 M (2024)", source: "SiTime Q3 2024 earnings call, via search", conf: low}
  - {figure: "Timing parts per car", value: "up to 60, rising to 100 (SiTime claim)", source: "SiTime, via search", conf: low}
  - {figure: "Renesas timing business", value: "≈$300 M revenue; ~75 % data centre/comms, rest industrial + automotive; sold to SiTime for $1.5 B + 4.13 M shares, close by end 2026", source: "evertiq, 5 Feb 2026", conf: med}
  - {figure: "SiTime", value: "$326.7 M revenue 2025; auto/industrial/aerospace $24.5 M in Q4 2025 (22 %)", source: "SiTime results release, via search", conf: low}
  - {figure: "Radar modules", value: "166 M (2024); ~5 radars per car by 2030", source: "Yole press release, Nov 2025", conf: med}
  - {figure: "ECUs", value: "Halved (Stellantis) to 'dozens into one' (GM); 4 central computers + zones (BMW)", source: "OEM releases 2025–2026", conf: high}
  - {figure: "Public list prices", value: "TI LMK3H0102-Q1 $3.55 (1 k); Si5332-AM 8-output ≈$4.1–10.1 (1 k)", source: "ti.com; distributor snippets", conf: low}

outlook:
  - {id: o-central, text: "Most new platforms from 2027–2028 use a few central computers plus zones; clock content moves from many edge XOs to fewer multi-output, low-jitter trees (est)", basis: "GM 2028, VW/Rivian 2027, Stellantis 2027, BMW Neue Klasse; ECUs cut 2–10×", conf: med}
  - {id: o-crystalfree, text: "Crystal-free (BAW or MEMS) clocks become the default for new automotive PCIe designs by about 2029 (est)", basis: "TI LMK3H0102-Q1 and SiTime Chorus already AEC-Q100; TI claims up to 5 XOs replaced. Against: quartz is cheap and proven", conf: low}
  - {id: o-pcie, text: "ADAS computers move to PCIe Gen 5/6 between SoC, accelerators and storage; Gen 5 alone will not win new sockets after 2028 (est)", basis: "Vendors already list Gen 6 (Microchip, Diodes, SiTime, our buffers) and Gen 7 (TI)", conf: low}
  - {id: o-radar, text: "Satellite and imaging radar add SerDes/Ethernet links and multi-chip reference distribution, but the radar-module clock stays a crystal on the SoC (est)", basis: "ART satellite radar paper (Infineon/JKU); TI cascade note uses a shared 40 MHz clock with a fan-out buffer", conf: med}
  - {id: o-consol, text: "Timing consolidates: SiTime + Renesas becomes the broadest timing supplier from 2027; MEMS resonators may be built into Renesas MCUs/SoCs, making some sockets captive (est)", basis: "Deal and MOU announced Feb 2026; closing pending", conf: med}
  - {id: o-sync, text: "Coherent sensor fusion raises demand for time synchronisation (gPTP/802.1AS) across zones, but most of it may stay inside Ethernet switches and PHYs (est)", basis: "Our inference from central fusion; no public OEM clock specification found", conf: low}

features:
  - {id: f-ref, feature: "Reference clock trees for the main ADAS SoCs (NVIDIA Thor, Qualcomm Ride, Mobileye, R-Car) with Si5332-AM + Si5325x", benefit: "Gets us into the SoC vendor's BoM before the zonal design-ins close", distance: 1, why: "Today's parts; documentation and validation only"}
  - {id: f-gen6, feature: "Characterise and publish PCIe Gen 6 compliance for Si5332-AM / Si5225x-AM", benefit: "Removes the Gen 5 objection where the jitter already meets it", distance: 1, why: "Measurement and datasheet; margin not stated, may fail"}
  - {id: f-safety, feature: "ISO 26262 safety manual and FMEDA for SmartClock", benefit: "Matches SiTime FailSafe in safety reviews", distance: 1, why: "Documentation on existing monitors"}
  - {id: f-radar-an, feature: "Cascaded imaging-radar reference: 40 MHz reference fan-out and sync with Si5335x-AM buffers (0.1 ps additive jitter)", benefit: "First Skyworks part in the empty radar row", distance: 1, why: "Today's buffers; application note and lab data"}
  - {id: f-sip, feature: "Si5332-AM with the crystal inside the package", benefit: "Removes crystal layout and qualification for the customer now", distance: 2, why: "Module from existing die and a bought crystal"}
  - {id: f-ja, feature: "AEC-Q100 version of an existing DSPLL jitter attenuator", benefit: "Answers imaging radar and multi-gigabit SerDes hubs", distance: 2, why: "Requalification of an existing die; becomes 3 if the die needs changes for 105 °C"}
  - {id: f-xo, feature: "Automotive differential XO line (Si5xx-AM)", benefit: "Covers the remaining XO sockets in zones and radar hubs", distance: 2, why: "Existing oscillators, automotive qualification and grading"}
  - {id: f-zc, feature: "ZoneClock: crystal-free automotive clock tree (BAW resonator + MultiSynth), 4–12 outputs, Gen 6", benefit: "Answers TI LMK3H0102-Q1 and SiTime Chorus; one part replaces generator, crystal and XOs", distance: 3, why: "New chip from our BAW timing (SKY631xx) and Si5332 IP; automotive BAW qualification is new"}
  - {id: f-g1, feature: "Grade 1 (–40 to 125 °C) on the new die", benefit: "Opens hot locations and matches SiTime", distance: 3, why: "Design and qualification; need not stated by OEMs"}
  - {id: f-sync, feature: "Automotive network synchroniser (802.1AS/gPTP-aware DSPLL) for zonal sensor time sync", benefit: "Content in coherent-fusion architectures", distance: 3, why: "NetSync IP exists; automotive part is new; demand unproven"}
  - {id: f-mmw, feature: "Radar LO / chirp synthesis outside the radar SoC", benefit: "Would enter the radar module itself", distance: 4, why: "Not recommended: radar RF and PLLs are integrated in CMOS SoCs"}

