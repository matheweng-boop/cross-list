# Preliminary case: automotive clock tree. Layout and rules: _template.yaml. Figures and links: the report's background notes.
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
title: "Automotive clock tree: a crystal-free clock for central compute and zones"
question: >-
  What should Skyworks offer next for clocking central computers, zonal controllers and satellite radar (PCIe,
  automotive Ethernet, SerDes references) in 2–3 years, reusing existing timing technology, given TI, SiTime (buying
  Renesas timing), Microchip and Diodes, and at what price?
updated: 2026-10-20
brief:
  - "Our position: a broad Grade 2 automotive PCIe clock line (Si5332-AM 6/8/12 outputs, Si5225x generators, Si5325x Gen 1–6 buffers) that our own brochure already lists for central compute, gateway and camera. Central computers and satellite radar move clock sockets to exactly these trees."
  - "Our weak points: Grade 2 only, a crystal on every Si5332-AM, no automotive jitter attenuator or oscillator, empty radar/ADAS rows, and radar SoCs keep their own timing. TI ships a crystal-free BAW clock (PCIe Gen 7, $3.55 list) and SiTime a Grade 1 MEMS clock generator, and SiTime is buying Renesas timing."
  - "Proposal: ZoneClock, a crystal-free automotive clock tree (our BAW resonator + Si5332 MultiSynth), Grade 1, PCIe Gen 6, with SmartClock safety monitors: ZC-12 at about $4–6.5 and ZC-4 at about $1.6–2.6 in volume (est), plus reference designs and a qualified jitter attenuator now."

position:
  advantages:
    - {id: a-breadth, text: "Broadest automotive PCIe line from one vendor: Si5332-AM generators (6/8/12 outputs, any frequency, 190 fs), Si52254/58A-AM generators, Si53254/58A-AM Gen 1–6 buffers, Si5335x-AM any-format buffers", vs: "TI, Microchip, Diodes", conf: high}
    - {id: a-anyfreq, text: "One Si5332-AM replaces several XOs and buffers: up to 12 outputs, per-output format (LVDS, LVPECL, HCSL, LVCMOS) and voltage, two spread-spectrum domains", vs: "TI LMK3H0102-Q1 (2 outputs)", conf: high}
    - {id: a-smartclock, text: "SmartClock input monitoring, fault reporting to a safety manager and AlwaysOn (±5 %) on loss of reference", vs: "Diodes, Microchip", conf: high}
    - {id: a-listed, text: "Already in our automotive brochure for IVI, gateway, central compute and camera; factory-programmed custom part numbers free of charge (ClockBuilder Pro)", vs: "—", conf: high}
    - {id: a-baw, text: "We own a BAW-resonator timing platform in production (SKY631xx, about 17 fs) that can remove the crystal, the same route TI took", vs: "SiTime (MEMS), Microchip", conf: high}
  disadvantages:
    - {id: d-crystal, text: "Si5332-AM needs an external 16–50 MHz crystal in free-run; TI LMK3H0102-Q1 is crystal-free (BAW) and claims to replace up to 5 XOs", vs: TI, offset: "Crystal-free ZoneClock from our BAW platform; meanwhile a crystal-in-package option", conf: high}
    - {id: d-grade, text: "Grade 2 (–40 to 105 °C) only; SiTime Chorus and SiT9396 are Grade 1 / 125 °C, Microchip buffers –40 to 125 °C", vs: "SiTime, Microchip", offset: "Grade 1 on the next die; state which sockets truly need 125 °C", conf: med}
    - {id: d-gen, text: "Si5332-AM generators are specified to PCIe Gen 5; TI LMK3H0102-Q1 is Gen 1–7, SiTime Chorus Gen 1–6", vs: "TI, SiTime", offset: "Characterise Gen 6 on today's parts; Gen 6/7 on ZoneClock", conf: high}
    - {id: d-cost, text: "Per output we are not cheapest: TI lists a 2-output crystal-free clock at $3.55 (1 k); our 8-output Si5332-AM lists at about $4–10 plus a crystal", vs: TI, offset: "Sell the whole tree: one ZC-12 replaces generator + crystal + XOs + a buffer", conf: low}
    - {id: d-ja, text: "No automotive jitter attenuator or network synchroniser in the catalogue (all DSPLL jitter attenuators are non-automotive)", vs: "TI, Renesas/SiTime", offset: "Qualify an existing jitter attenuator for imaging radar and SerDes hubs", conf: high}
    - {id: d-radar, text: "Radar timing is captive: TI, NXP and Infineon radar SoCs run from a 40 MHz crystal through on-chip PLLs, and TI pairs its radar with its own PMIC and clocks", vs: "TI, Infineon, NXP", offset: "Target the central computer and cascaded imaging radar fan-out, not the single-chip radar", conf: med}
    - {id: d-scale, text: "SiTime + Renesas timing (about $300 M revenue being acquired, close by end 2026) gives one rival MEMS resonators, clock generators, jitter attenuators and a route into Renesas MCUs/SoCs", vs: "SiTime/Renesas", offset: "Win the SoC reference designs (NVIDIA, Qualcomm, Mobileye) before the merged line is reorganised", conf: med}
  diff_good:
    - {id: g-tree, text: "'Clock tree on a chip': any frequency on any output with 0 ppm synthesis error, so PCIe 100 MHz, Ethernet 25/125/156.25 MHz and SerDes references come from one part", conf: high}
    - {id: g-two-res, text: "We have both resonator routes in house: quartz-based DSPLL and integrated BAW", conf: high}
  diff_bad:
    - {id: b-empty, text: "Our automotive brochure lists no part for radar, ADAS domain controller, autonomous-driving ECU or lidar", conf: high}
    - {id: b-no-osc, text: "No automotive XO or MEMS/BAW oscillator, while SiTime, TI (CDC6C-Q1) and Microchip sell them", conf: med}

architecture:
  columns: [Skyworks, TI, SiTime (+ Renesas timing)]
  rows:
    - ["Built as", "Crystal + MultiSynth generator (Si5332-AM, up to 12 outputs) + PCIe buffers (Si5325x)", "Crystal-free BAW generator (LMK3H0102-Q1), BAW oscillators; radar SoC + PMIC + clocks from one vendor", "MEMS-resonator clock generator (Chorus SiT9128x), MEMS XOs; adds Renesas generators, buffers and jitter attenuators"]
    - ["Grade / PCIe", "Grade 2 · generators Gen 5, buffers Gen 6", "Grade 2 · Gen 7", "Grade 1 · Gen 6"]
    - ["Radar", "Not listed; crystal at the radar SoC", "Captive: 40 MHz crystal into the AWR SoC PLL; fan-out buffer for cascades", "Lists lidar and radar"]
    - ["Zonal fit", "Good in central compute and camera; nothing at the edge", "Good: crystal-free and system bundle", "Good: Grade 1, safety monitors, broadest after the deal"]
  note: "From the BizDev block-diagram library: TI ADAS domain controller (clocking: crystal_oscillator, clock_buffer, clock_generator, pcie_buffer; raw sensor interface: SerDes, Ethernet PHY), NXP 77 GHz radar (crystal → transceiver), TI TCU (clocking). Central compute + zones: GM 2028, VW/Rivian 2027, Stellantis STLA One 2027, BMW Neue Klasse (high)."

