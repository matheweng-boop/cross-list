outlook:
  - {id: o-us, text: "US C-V2X stays small to 2030: about 0.5–2 M cars a year (est), mostly on the 20 MHz channel; two-channel OBUs start in premium and fleet cars", basis: "DOT plan targets 2 OEMs by MY2028 and 5 models by 2031; ~16 M US sales; no OEM-wide commitment found", conf: low}
  - {id: o-eu, text: "EU dual-mode cars (ITS-G5 + LTE/5G-V2X direct) from about 2028 (est); each needs two carriers at once", basis: "5GAA: 5G-V2X Direct market readiness 2026–2029; ITS-G5 stays on 5895–5905 MHz for years; VW Car2X 2.3 M", conf: med}
  - {id: o-china, text: "China reaches 15–25 % C-V2X fitment by 2030 (5–8 M cars, est) only if mandates tighten; otherwise ≈5–10 %", basis: "≈4 % in 2025; TechInsights forecast ≈25 % by 2030; MIIT target cut to 7.5 % for 2026", conf: low}
  - {id: o-total, text: "V2X cars grow from 5.7 M to about 10–15 M a year by 2030 (est); against: network V2N may take the safety use cases instead", basis: "Sum of the regions above; ABI says V2N is more impactful than broadcast V2X", conf: low}
  - {id: o-integrate, text: "Qualcomm may bundle its own V2X front end with the Autotalks/9150 chipset, as it does for Wi-Fi with QXM19xx (judgement)", basis: "QXM19xx automotive Wi-Fi FEM paired with QCA6797AQ; Autotalks owned since Jun 2025", conf: low}
  - {id: o-slu, text: "After 2030 sidelink moves into 5–7 GHz unlicensed (SL-U) and carrier aggregation, so V2X and Wi-Fi front ends converge", basis: "3GPP Rel-18 sidelink evolution (n46, n96, n102)", conf: med}

features:
  - {id: f-dual, feature: "Two TX/RX paths in one package (two antenna ports)", benefit: "US two-channel OBU and EU concurrent ITS-G5 + C-V2X with one part", distance: 2, why: "Two SKY5A2105-class die sets in one module; no new die"}
  - {id: f-wide, feature: "Wide BAW passband 5855–5925 MHz for Europe", benefit: "Covers ITS-G5, LTE-V2X and NR-V2X channels", distance: 0, why: "SKY5A2105's BAW and QPQ2200Q already cover 5855–5925 MHz"}
  - {id: f-guard, feature: "US variant: BAW pass 5895–5925 MHz with rejection of UNII-4 below", benefit: "Protects C-V2X from the car's own and passengers' 5.9 GHz Wi-Fi", distance: 3, why: "New BAW design; needs a ~20 MHz transition vs 40 MHz on SKY5A1005; may not be feasible (check)"}
  - {id: f-nrlin, feature: "PA linear at back-off for NR-V2X and two carriers through one PA", benefit: "One antenna for two carriers; better efficiency at NR MPR", distance: 3, why: "New PA design on our GaAs HBT; two-carrier intermodulation targets not stated"}
  - {id: f-geo, feature: "Geofenced high-power application note (closed-loop power with detector + DSA)", benefit: "Helps OEMs certify higher OBU power in the US", distance: 1, why: "Parts already have the detector and DSA; FCC process not yet defined"}
  - {id: f-11p, feature: "Keep 802.11p mode for EU ITS-G5", benefit: "Serves VW-type dual-mode cars", distance: 0, why: "SKY5A2105 and QPF1003Q already support it"}
  - {id: f-ref, feature: "Reference designs with Qualcomm/Autotalks and Chinese chipsets", benefit: "Design-in without a chipset of our own", distance: 2, why: "Boards and validation with partners; access to Qualcomm not certain"}
  - {id: f-roadmap, feature: "One merged V2X roadmap (SKY5A2105 vs QPF1003Q, SKY5A1005 vs QPQ2230Q)", benefit: "Clear offer to customers, less duplicate qualification", distance: 1, why: "Portfolio decision and documents"}
  - {id: f-g1, feature: "Grade 1 (125 °C) option for roof modules", benefit: "Hot roof and glass-roof antenna modules", distance: 3, why: "No public OEM spec demands it yet; may need redesign"}
  - {id: f-slu, feature: "5–7 GHz sidelink (SL-U) path shared with the Wi-Fi 7 FEM", benefit: "Ready for Rel-18 V2X in unlicensed bands", distance: 3, why: "6 GHz PA/BAW exist in Wi-Fi; standard adoption in cars uncertain"}

