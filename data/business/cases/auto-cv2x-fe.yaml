    - {id: q-bu-qc, text: "Since Qualcomm closed Autotalks (Jun 2025), is SKY5A2105 still on TEKTON3/SECTON3 reference designs, and do we know of a Qualcomm V2X front end?", why: "Our reference partner is now the main competitor's (d-partner, o-integrate)"}
    - {id: q-bu-wins, text: "What design-ins, volumes and contract ASPs do SKY5A2105 (Preview) and QPF1003Q / QPF1002Q have?", why: "No public V2X FEM price; p-dc is anchored on consumer Wi-Fi FEMs"}
    - {id: q-bu-guard, text: "Can our BAW reach a ~20 MHz transition at 5895 MHz with acceptable loss, and is there test data?", why: "The US guard variant (f-guard) may not be feasible"}
    - {id: q-bu-roadmap, text: "Which of SKY5A2105 vs QPF1003Q and SKY5A1005 vs QPQ2230Q survive the merger, and is a dual-path V2X module already planned?", why: "Duplicate, partly Preview lines (d-dup)"}
    - {id: q-bu-2c, text: "What intermodulation and heat result from two carriers through one PA at +26–29 dBm, against two PAs?", why: "Two-carrier targets are not public (f-nrlin, risk)"}
    - {id: q-bu-cost, text: "What would two SKY5A2105 die sets in one package cost, against two FEMs plus filter and switch?", why: "Tests the $7–10 V2X-DC range"}
  customer:
    - {id: q-c-chan, text: "Will you use the US second 10 MHz channel, or concurrent ITS-G5 + C-V2X in Europe, and from which model year?", who: "OEM V2X / connected-safety team", why: "Sets demand for two carriers (d-single, o-us, o-eu)"}
    - {id: q-c-chipset, text: "Which V2X chipset will your 2028–2030 units use, and do you pick the front end or take the chipset vendor's?", who: "Tier-1 telematics team", why: "Qualcomm may bundle its own V2X front end (o-integrate)"}
    - {id: q-c-where, text: "Will V2X RF sit at the roof antenna (compensator) or in the TCU, and what cable and glass-roof losses must it make up?", who: "Tier-1 antenna module team", why: "Decides compensator vs ECU mode and the antenna-maker channel (t-antenna)"}
