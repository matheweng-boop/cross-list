  anchors:
    - {part: "Qorvo QPF4550 (5 GHz Wi-Fi 6 FEM, consumer)", price: "$3.29", qty: "1,000 (LCSC, out of stock)"}
    - {part: "Skyworks SKY85337-11 (RF front end, consumer)", price: "≈ $0.95", qty: "1,000 (LCSC snippet)"}
    - {part: "SKY5A2105 · QPF1003Q · QPF1002Q (V2X FEMs)", price: "not stated", qty: "—"}
  items:
    - {id: p-dc, item: "V2X-DC dual-carrier FEM", entry: 7.0, target: 8.5, premium: 10.0, basis: "Replaces 2 single V2X FEMs (est $3.5–5 each, 1–1.5× a consumer FEM list price) + switch and filter (est $0.5–1)"}
    - {id: p-sc, item: "Single-path successor (SKY5A2105 class, US guard variant)", entry: 3.5, target: 4.25, premium: 5.0, basis: "Est; must stay near today's single FEM; guard filter adds about $0.3–0.5"}
    - {id: p-guard, item: "Standalone US guard BAW filter", entry: 0.35, target: 0.5, premium: 0.7, basis: "No public anchor; est at 10–15 % of a FEM price"}

