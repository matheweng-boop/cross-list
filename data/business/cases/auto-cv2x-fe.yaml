risks:
  - "Qualcomm owns the leading 5G-V2X chipset (Autotalks) and could bundle its own front end."
  - "US guard filter: a ~20 MHz BAW transition at 5.9 GHz may not be achievable with acceptable loss; needs a feasibility study."
  - "Market size depends on policy (FCC certification of geofencing, EU 20 MHz channels, China mandates); V2N could replace direct V2X for safety use cases."
  - "Two carriers through one PA versus two PAs: cost, heat and intermodulation targets are not public."
  - "Unknown from public data: our contract prices, Qualcomm's RF plans, and design-in status of SKY5A2105 (still Preview in the catalogue)."

