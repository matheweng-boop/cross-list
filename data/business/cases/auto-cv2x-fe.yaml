# Preliminary case: 5.9 GHz V2X front end. Layout and rules: _template.yaml. Figures and links: the report's background notes.
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
title: "C-V2X front end: two carriers in one module"
fn: v2x_fem
headline: f-dual
question: >-
  What should Skyworks (with Qorvo) build next for 5.9 GHz V2X in 2–3 years, reusing SKY5A2105, QPF1003Q and our BAW
  filters, now that the US is C-V2X only from 14 Dec 2026 on two channels and Europe runs ITS-G5, LTE-V2X and NR-V2X
  side by side in 5855–5925 MHz, and Qualcomm owns Autotalks, and at what price?
updated: 2026-10-20
brief:
  - "We are the only public source of standalone V2X front ends: SKY5A2105 (AEC-Q104 Grade 2, LTE/NR-V2X and 802.11p, compensator or ECU mode) and Qorvo's QPF1003Q/QPF1002Q, plus V2X BAW filters (QPQ2200Q, QPQ2230Q, SKY5A1005). The wide 5855–5925 MHz BAW passband Europe needs already exists."
  - "Weak points: one path per part, so the US second channel and EU concurrent ITS-G5 + C-V2X need two FEMs; in the US today's filter passes UNII-4 Wi-Fi next door; and our chipset partner Autotalks is Qualcomm's since Jun 2025, in a small market (about 5.7 M V2X cars a year)."
  - "Proposal: a dual-carrier V2X front end (two TX/RX paths, compensator and ECU modes, EU wide-band and US UNII-4-guard filter variants) at about $7–10 (est), replacing two single FEMs plus filter and switch."

customer_benefit:                # what the proposal changes in the customer's system
  for: "Antenna or TCU Tier-1; OEMs selling V2X in the US (two channels) and Europe (ITS-G5 and C-V2X)"
  summary: "Two V2X carriers from one part at the antenna: the US second channel and Europe's ITS-G5 plus C-V2X without a second front end, filter and switch."
  today: "One path per front end: two SKY5A2105 or QPF1003Q, an external filter and a switch per antenna for two carriers; in the US the filter passes the car's own UNII-4 Wi-Fi next door."
  with_us: "One dual-carrier front end per antenna, in compensator mode at the roof or in the ECU; EU wide-band and US guard-filter variants on one footprint."
  gains:
    - {id: cb-parts, kind: parts, gain: "One part instead of four for two carriers", how: "Two paths and the switching in one package", measure: "2 FEMs + filter + switch → 1", conf: med}
    - {id: cb-region, kind: scaling, gain: "One antenna design for the US and Europe", how: "Filter variant, same footprint and control", measure: "2 variants, 1 layout (est)", conf: low}
    - {id: cb-coex, kind: performance, gain: "V2X protected from the car's own Wi-Fi", how: "US guard BAW against UNII-4 next to the 5895–5925 MHz channels", measure: "not stated", conf: med}
    - {id: cb-roof, kind: cabling, gain: "Cable and glass-roof loss made up at the antenna", how: "Compensator mode sets gain to the cable loss", measure: "Glass roof costs about 8 dB (source in case)", conf: med}
  gives_up:
    - "Our chipset partner Autotalks now belongs to Qualcomm; small market (about 5.7 M V2X cars a year)"

position:
  advantages:
    - {id: a-only, text: "Only public standalone V2X FEM line: SKY5A2105 and QPF1003Q/QPF1002Q; competitors sell chipsets or modules, not V2X FEMs", vs: "Qualcomm, NXP, module makers", conf: med}
    - {id: a-modes, text: "One part for roof antenna or TCU: compensator mode (SPI, DSA 0–31.75 dB in 0.25 dB steps) and ECU mode (GPIO)", vs: "NXP (external compensator)", conf: high}
    - {id: a-nr, text: "Already specified for all three waveforms: LTE-V2X +29 dBm, NR-V2X +26.5 dBm (2.5 dB MPR), 802.11p +26 dBm", vs: "NXP SAF5400 (802.11p only)", conf: high}
    - {id: a-baw, text: "Own BAW for the V2X band: band-pass (QPQ2200Q, inside SKY5A2105) and notch (QPQ2230Q, SKY5A1005, 30 dB min)", vs: "Module makers buying filters", conf: high}
    - {id: a-grade, text: "AEC-Q104 Grade 2, IATF 16949 flow, PPAP/IMDS already in place for RF modules", vs: "New entrants", conf: high}
  disadvantages:
    - {id: d-partner, text: "Our reference chipset partner is now the main competitor's: the brochure pairs SKY5A2105 with Autotalks parts, and Qualcomm closed Autotalks on 5 Jun 2025", vs: Qualcomm, offset: "Get onto Qualcomm/Autotalks reference designs; second path through Chinese chipsets (Huawei, Morningcore/CICTCI) and module makers", conf: med}
    - {id: d-single, text: "One TX/RX path per part: the US 10 MHz channel needs a second radio and EU concurrent ITS-G5 + C-V2X needs two FEMs", vs: "NXP (2 × SAF5400 for concurrent dual channel)", offset: "Dual-carrier FEM in one package", conf: high}
    - {id: d-unii4, text: "Today's BAW passes 5855–5925 MHz, so in the US it gives no rejection of UNII-4 Wi-Fi (5850–5895 MHz) right below the C-V2X channels", vs: "—", offset: "US guard-filter variant; car Wi-Fi FEM that stops at 5835 MHz (SKY5A1006)", conf: high}
    - {id: d-dup, text: "Duplicate, partly Preview lines after the merger: SKY5A2105 (Preview) vs QPF1003Q; SKY5A1005 vs QPQ2230Q; QPF4554Q Preview", vs: "—", offset: "One merged V2X roadmap per socket, published to customers", conf: high}
    - {id: d-size, text: "Small, policy-driven market: about 5.7 M V2X cars a year; China ≈4 % fitment in 2025", vs: "—", offset: "Share dies and BAW with Wi-Fi and telematics; sell to module makers", conf: low}
    - {id: d-china, text: "China, the largest LTE-V2X market, is led by domestic chipsets and module makers (our judgement)", vs: "Huawei, CICTCI, Quectel", offset: "Wins at BYD and Geely as entry; compete on qualification and coexistence", conf: low}
  diff_good:
    - {id: g-coex, text: "We sell both sides of the 5.9 GHz edge: V2X FEM + automotive Wi-Fi coexistence filters (SKY5A1005/1006/1008) + Wi-Fi 7 FEMs, so we can guarantee V2X/Wi-Fi coexistence for the whole car", conf: med}
    - {id: g-integr, text: "BAW, DSA, log detector (>25 dB) and temperature sensor in a 3 × 5 mm LGA; claimed >50 % board-space saving", conf: high}
  diff_bad:
    - {id: b-nomodem, text: "No V2X modem of our own: design-ins follow the chipset vendor's reference design", conf: high}
    - {id: b-11p, text: "802.11p-only SKYA21043 loses the US after 14 Dec 2026; only EU ITS-G5 (VW Car2X) keeps it", conf: high}

architecture:
  columns: [Skyworks + Qorvo (front end), Qualcomm (+ Autotalks), NXP, Module makers]
  rows:
    - ["Built as", "V2X FEM (PA, LNA, switch, BAW, DSA) beside any chipset", "C-V2X chipsets (9150, 2150, TEKTON3/SECTON3); RF front end not public", "SAF5400 802.11p modem + external front end/compensator", "Chipset + FEM on a PCB module (LG Innotek LAM-V500, Quectel AG55xQ, CICTCI DMM2x)"]
    - ["Where it sits", "Roof antenna (compensator) or TCU/ECU", "TCU / Snapdragon Auto platform", "Roof antenna unit + V2X ECU", "TCU or smart antenna"]
    - ["Two carriers", "Two FEMs today", "Not stated", "Two SAF5400 (concurrent dual channel, MRC)", "Not stated"]
    - ["5G-V2X direct", "FEM ready (+26.5 dBm NR)", "Only TEKTON3/SECTON3 listed with 5G-V2X PC5", "No (802.11p)", "Follows chipset"]
    - ["Zonal fit", "Good: RF moves to the antenna (glass roof −8 dB, cable loss)", "V2X folds into the central TCU", "Separate V2X box; weak", "Good: one module per smart antenna"]
  note: "From the BizDev block-diagram library (NXP V2X communications unit; TI TCU/V2X module; Qualcomm automotive telematics with C-V2X 9150) and the Skyworks automotive brochure, which shows SKY5A2105 with Autotalks transceiver and SoC. Trend: the TCU, V2X and Wi-Fi merge into one smart antenna or central connectivity unit (zonal platforms 2027–28)."

