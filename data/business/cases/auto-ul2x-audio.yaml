# Preliminary case: Skyworks UL2X low-latency wireless gaming audio in the car.
# Layout and rules: _template.yaml. Figures and links: the case's background notes (auto-ul2x-audio.background.html).
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
gist: "UL2X beats Bluetooth on latency and sync for car headphones, microphones and controllers, but the car volume is small; watch it, probe with accessories (est)."
abstract:
  - "UL2X (SKY76360 hub, SKY76361 client) links up to 8 uncompressed channels at 2.4 GHz in under 8–9 ms, clients in sync to 1 µs."
  - "In cars it fits passenger headphones, karaoke microphones and game controllers; Bluetooth LE Audio (about 30 ms) is the default link, and the parts are 0–70 °C."
  - "Decide whether to test demand with accessory kits and a Tier-1 before paying for AEC-Q100 qualification."
title: "Skyworks UL2X low-latency wireless audio in the car: passenger headphones, karaoke microphones and game controllers"
fn: wireless_audio_soc
headline: f-auto
library: [roof_coexistence]
question: >-
  Should Skyworks take its UL2X wireless gaming audio link (SKY76360-22 arbiter, SKY76361 clients: 2.4 GHz, under
  8–9 ms fixed latency, up to 8 uncompressed channels) into cars for rear-seat headphones, personal audio zones,
  wireless karaoke microphones and game controllers, against Bluetooth LE Audio / Auracast combo chips and Tier-1
  proprietary units, and what would an automotive version need?
updated: 2026-11-10
brief:
  - "Our position: UL2X is a working consumer link that does what car passengers' headphones, microphones and controllers need better than Bluetooth: fixed latency under 8–9 ms against about 30 ms for LE Audio gaming, several clients in sync to 1 µs, and 2.4 GHz front ends, filters and clocks of ours that are automotive today."
  - "Our weak points: it is proprietary (a passenger's own earbuds will not hear it), the parts are 0–70 °C with no automotive version, carmakers follow the phone and Bluetooth, and the car volume we can see is small: about 1–3 M hub sockets a year by 2030 (est)."
  - "Proposal: watch, with two cheap probes: today's consumer parts in OEM accessory kits (karaoke microphones, rear-seat headphones, controllers with a USB receiver) and one rear-seat Tier-1 evaluation; qualify an automotive arbiter (about $3.5–6, est) only when a Tier-1 commits."

customer_benefit:
  for: "Rear-seat entertainment and cabin audio Tier-1; OEM infotainment teams (China karaoke and gaming features)"
  summary: "One low-latency hub in the rear-seat unit or head unit serves several headphones, wireless microphones and game controllers at a fixed latency, instead of a Bluetooth pairing per device or a separate receiver per accessory."
  today: "Rear-seat screens pair Bluetooth Classic headphones one by one (one OEM manual allows two Bluetooth devices at a time) or use infrared headphones; karaoke microphones bring their own 2.4 GHz receiver in the USB port; game controllers pair over Bluetooth or the passengers' phones act as controllers over the network; HARMAN builds its own wireless audio unit for personal zones."
  with_us: "A UL2X arbiter (automotive version, or a consumer USB receiver at first) next to the rear-seat or head-unit SoC, with our 2.4 GHz front end and coexistence filter, serves up to 8 audio channels to headphones in sync, takes microphone and controller data back with about 1 ms for controls, and leaves Bluetooth for the passengers' own phones and earbuds."
  gains:
    - {id: cb-lat, kind: performance, gain: "Fixed audio latency under 8–9 ms instead of about 30 ms (LE Audio gaming) or 100–200 ms (Bluetooth Classic, est)", how: "UL2X fixed-latency link, uncompressed audio", measure: "≈30 ms → <9 ms (Bluetooth SIG GMAP example; Skyworks summary)", conf: med}
    - {id: cb-sync, kind: scaling, gain: "Several headphones and microphones on one hub, in sync", how: "Up to 8 channels; clients synchronized to under 1 µs", measure: "2 Bluetooth devices at a time (one OEM manual, snippet) → several clients per hub (number not stated)", conf: low}
    - {id: cb-one, kind: parts, gain: "One radio for headphones, microphones and controllers", how: "Audio link plus a ~1 ms HID data link on the same system", measure: "2–3 separate receivers or pairings → 1 hub (est)", conf: low}
    - {id: cb-sing, kind: performance, gain: "Karaoke without an audible echo between voice and speakers", how: "Microphone audio reaches the car audio in a few milliseconds", measure: "not stated (no latency published for car karaoke kits)", conf: low}
    - {id: cb-fe, kind: sourcing, gain: "Radio, front end, coexistence filter and clock from one supplier", how: "UL2X with QPF4239Q, QPQ2254Q, switches and Si5332-AM", measure: "4–5 parts from one supplier (est)", conf: low}
  gives_up:
    - "Passengers' own earbuds and phones cannot join the UL2X link; Bluetooth stays for them"
    - "OEM-supplied headphones or microphones carry our client chip, so the OEM must sell or bundle them"

position:
  advantages:
    - {id: a-lat, text: "Fixed latency under 8–9 ms and a ~1 ms control link, against about 30 ms or less for an LE Audio gaming link and 12–28 ms for consumer 2.4 GHz gaming dongles", vs: "Bluetooth LE Audio (Infineon, NXP, Qualcomm), consumer 2.4 GHz chips", conf: med}
    - {id: a-sync, text: "Clients synchronized to under 1 µs, up to 8 uncompressed channels, 40 kHz audio bandwidth, up to 138 dB dynamic range: several headphones and speakers play together", vs: "Bluetooth Classic, LE Audio", conf: high}
    - {id: a-ship, text: "In production for gaming headsets, controllers and earbuds today: firmware, evaluation kits and field experience exist", vs: "Bluetooth HDT (draft; first chips from Actions with Ceva IP)", conf: med}
    - {id: a-fe, text: "Our automotive 2.4 GHz FEM, switch + LNA, coexistence BAW and clocks surround it; the product summary already draws an external switch and PA", vs: "Combo chips with on-chip PA and LNA", conf: high}
  disadvantages:
    - {id: d-prop, text: "Proprietary: phones and passengers' own earbuds speak Bluetooth, so UL2X serves only OEM-supplied headphones, microphones and controllers", vs: "Bluetooth LE Audio / Auracast", offset: "Keep Bluetooth for own devices; position UL2X for the OEM's own accessories and karaoke", conf: high}
    - {id: d-temp, text: "0–70 °C commercial parts; no automotive grade, PPAP or AEC-Q100 data", vs: "Infineon CYW89310 (−40 to 85 °C), NXP AW300 (AEC-Q100 Grade 2/3)", offset: "Start with accessories outside the car's fixed electronics; qualify the arbiter only on a Tier-1 commitment (f-auto)", conf: high}
    - {id: d-demand, text: "No carmaker or Tier-1 uses UL2X in a car (public sources); in-car gaming platforms use phones as controllers", vs: "AirConsole (VW, Porsche, Audi, BMW), Bluetooth controllers", offset: "Karaoke and multi-headphone zones first; gaming as a later add-on", conf: med}
    - {id: d-tier1, text: "Tier-1s build their own: HARMAN's Ready StreamShare uses a proprietary wireless audio unit for up to 5 users with Bluetooth", vs: "HARMAN", offset: "Offer UL2X as the radio inside such units (q-c-wau)", conf: high}
    - {id: d-hdt, text: "Bluetooth is closing the gap: High Data Throughput (about 7.5 Mbps, lossless, lower latency) and LE in the 5/6 GHz bands are in work", vs: "Bluetooth SIG, Ceva, Actions", offset: "Lead on fixed latency and sync, which HDT does not publish; watch the HDT adoption", conf: low}
  diff_good:
    - {id: g-gaming, text: "Built for gaming: fixed latency, synchronized clients and a 1 ms HID link in one system; no Bluetooth chip offers all three (public data)", conf: med}
    - {id: g-portfolio, text: "Link chip plus automotive 2.4 GHz front end, coexistence BAW, antenna switch and clock from one company", conf: med}
  diff_bad:
    - {id: b-nobt, text: "No Bluetooth LE Audio chip of our own to make a dual-mode client, so own earbuds and our link never meet", conf: high}
    - {id: b-security, text: "Link encryption and pairing are not described publicly; cars need ISO/SAE 21434 and UN R155 evidence", conf: low}

