thread:
  benefit: The gain is latency and sync for several OEM-supplied devices; passengers' own earbuds stay on Bluetooth.
  position: Our link is better than Bluetooth for gaming-grade audio but proprietary and not automotive grade.
  market: Demand signals are real (zones, karaoke, gaming) but none uses a dedicated low-latency link yet.
  outlook: Bluetooth stays the default; UL2X can hold a niche for supplied accessories if it moves before HDT matures.
  features: The distance-0 accessory kit tests demand at no cost; the automotive arbiter waits for a commitment.
  product: Lead with accessory kits and a reference design, not with a qualified car part.
  asp: Content of about $8 per car (est) on 0.2–1.5 M hubs is small; it pays only with the front end attached.
  attach: Front end, filter and clock with every hub keep the case alive even if UL2X itself stays small.
  questions: Die temperature, client count and link security are the needed-now questions for the business unit.
  risks: If Tier-1s and OEMs answer Bluetooth only, drop the automotive arbiter and keep the accessory route.
