depth:
  title: "In depth: what UL2X is, what pairs with it, and where it fits in the car"
  date: 2026-11-10
  intro: "The owner asked for a full research and business case on UL2X in cars. Short answer (est): the technology fits passenger headphones, karaoke microphones and game controllers better than Bluetooth, and our automotive front ends, filters and clocks pair with it; but the parts are consumer grade, proprietary, and the car volume we can see is small. Watch, and test demand with accessories and one Tier-1 before any qualification money."
  tables:
    - id: what
      title: "What UL2X is (Skyworks public pages)"
      columns: [Item, "Public figure", "Source", "What it means in a car (est)"]
      rows:
        - ["Parts", "SKY76360-22 arbiter (hub: USB and I2S), SKY76361-32 client (88-pin aQFN 7 × 7 mm) and SKY76361-52 client (67-ball WLCSP 2.775 × 2.775 mm); evaluation boards SKY76360-22REK1, SKY76361-32NEK2", "Product summaries 207282A, 207283A (27 Oct 2025)", "Hub on the car side, clients in headphones, microphones, controllers"]
        - ["Band and rate", "2.4 GHz ISM; 3 / 6 Mbps over the air", "Product summaries", "Shares 2.4 GHz with Bluetooth, Wi-Fi and the phones in the cabin"]
        - ["Latency", "Low, fixed: under 8 ms (Wireless Gaming web page, Nov 2026), under 9 ms (product summaries); HID data link about 1 ms", "skyworksinc.com Wireless Gaming page; product summaries", "Lip sync and game sound without lag; karaoke without echo"]
        - ["Audio quality", "Uncompressed; up to 8 channels; up to 40 kHz audio bandwidth; up to 138 dB dynamic range, link SNR to 140 dB; I2S up to 24-bit / 96 kHz", "Product summaries", "Better than any car needs for headphones (est)"]
        - ["Topology", "One arbiter, several clients; audio 'inherently synchronized' between clients to under 1 µs; number of clients per arbiter not stated ('different numbers of clients')", "Product summaries", "One hub per rear row or per car"]
        - ["Range", "30 m indoor line of sight", "Product summaries", "A cabin is 2–5 m; seats and bodies shadow the signal (est)"]
        - ["Coexistence", "'Robust interference rejection and excellent coexistence with other 2.4 GHz applications (such as Wi-Fi)'; the mechanism ('cognitive') is not described", "Product summaries", "Must be tested with the car's Wi-Fi hotspot, Bluetooth and LTE band 40/41"]
        - ["Client extras", "Configurable audio processing unit (equalization, dynamic range control, feathering, mixing); I2S and PDM microphone inputs; 32-bit RISC; USB, SPI, I2C, UART", "SKY76361 summary", "A headphone or microphone needs few extra parts"]
        - ["External parts", "24 MHz crystal, flash, an RF DPDT switch and PA (drawn as Skyworks products in the summary's diagram)", "Product summaries", "Attach for our FEM and switch"]
        - ["Grade", "Commercial 0 to 70 °C", "Product summaries", "Not for the car's fixed electronics without a new qualification"]
        - ["Uses today", "Gaming headphones, TWS earbuds, speakers, wireless gaming and hand-held controllers, musical instruments", "Wireless Gaming web page", "Consumer volume pays the die (est)"]
        - ["Not found publicly", "Maximum number of clients, microphone back-channel count, encryption and pairing method, power figures, prices, automotive plans; the older SKY76361-31/-51 summary link now returns an error page", "Our search, 10 Nov 2026", "Questions for the business unit"]
      note: "Skyworks pages read 10 Nov 2026 (Wireless Gaming page and SKY76360-22 product page); product summaries read 28 Oct 2026 and reused from the cache. The web page and the summaries differ on latency (8 vs 9 ms); both are quoted."
    - id: adjacent
      title: "Adjacent products and technologies: what of ours pairs with it in the car"
      columns: [Block, "Our part", "Grade", "Why it pairs"]
      rows:
        - ["2.4 GHz front end at the hub", "QPF4239Q 2.4 GHz FEM; SKYA21040 switch + LNA", "AEC-Q", "The arbiter drives an external switch and PA; range through seats and bodies"]
        - ["Coexistence filter", "QPQ2254Q 2.4 GHz BAW", "AEC-Q", "Keeps LTE band 40/41 from the telematics unit out of the 2.4 GHz link"]
        - ["Antenna switch", "SKY5A2108, QPC8019Q", "AEC-Q", "Two antennas (headliner and seatback) for diversity in the cabin (est)"]
        - ["Clock", "Si5332-AM clock generator", "AEC-Q", "Shared reference for the hub and the audio DSP; audio-rate outputs not in our data"]
        - ["Hub power", "ACT4751 wide-input buck", "AEC-Q", "12 V supply for a rear-seat hub module"]
        - ["Client side (headphones, microphones)", "SKY76361-52 client; QM42655 / RF6525 Bluetooth FEMs; SKY76206 class-D amplifier", "Consumer", "Accessories need no automotive grade (est)"]
        - ["5 GHz alternative", "SKY76303-21 (5.15–5.25 and 5.725–5.825 GHz, up to 5 receivers, under 20 ms)", "Consumer", "Avoids a crowded 2.4 GHz cabin; slower than UL2X"]
        - ["Head-unit audio path", "Si479xx automotive tuners with audio processing", "AEC-Q", "The same infotainment customers buy them (radio report)"]
        - ["Cabin radio neighbors", "QPF5100Q UWB (keys, child presence); car Wi-Fi FEMs", "AEC-Q", "Same cabin, same coexistence plan; one supplier for the cabin radios (est)"]
      note: "Grades from the site's AEC-Q rule (catalogue). No Bluetooth LE Audio chip, no automotive headphone amplifier or codec of ours."
    - id: uses
      title: "Car use cases, ranked (est)"
      columns: [Use case, "What it needs", "Today", "UL2X fit", "Evidence and volume", "Rank (est)"]
      rows:
        - ["Rear-seat and passenger headphones for screens and games", "Lip sync, game sound without lag, 2–4 headphones, battery life", "Bluetooth Classic or infrared headphones", "Good: fixed latency, clients in sync; only for OEM-supplied headphones", "Ford, Lincoln, Chrysler and Tesla rear systems use wireless or Bluetooth headphones (snippets); rear screens in a minority of cars", "1"]
        - ["Personal audio zones and shared listening", "Each passenger their own stream, switch to group listening, driver announcements", "HARMAN Ready StreamShare: proprietary wireless audio unit, up to 5 users with Bluetooth", "Good as the radio inside such a unit", "HARMAN page (read): 'ultra-low-latency streaming'; no OEM named", "2"]
        - ["Wireless karaoke microphones", "Voice to the speakers in a few ms, two microphones, charging case", "Accessory microphones with their own receiver (Tesla in China; NIO, BYD, XPeng, Weltmeister)", "Very good: PDM input on the client, low fixed latency; consumer grade is enough", "Tesla's two-mic kit (about $188) sold out in under an hour (2022, The Drive); mostly China", "3"]
        - ["Game controllers and in-car gaming", "Controls in about 1 ms, game sound in sync", "Phones as controllers (AirConsole: VW MY2027, Porsche, Audi, BMW); Bluetooth Classic controllers (Tesla)", "Technically best (1 ms HID); little demand for a dedicated controller", "VW: six MY2027 models, parked only, $149 a year (read); GeForce NOW deals 2023 (snippet)", "4"]
        - ["Wireless rear, headrest or subwoofer speakers", "Many channels in sync; power", "Wired (A2B or analog); headrest speakers in concepts", "Sync fits; but a speaker still needs a power wire", "Concepts only (Dirac, KEF and Lotus, snippets)", "5"]
        - ["Driver and passenger call headsets", "Works with the phone", "Bluetooth hands-free from the phone", "Poor: phones speak Bluetooth", "No evidence of demand", "6 (drop)"]
