  - {label: "AB-RR, 1 interior anchor in 3 M cars", units: 3000000, price: p-abrr}
  - {label: "Anchor FEM, 2 exterior anchors in 3 M cars (6 M)", units: 6000000, price: p-fem}

attach:
  - {id: t-ccc, lever: "CCC DK 4.0 certification and test events (Apple hosted the 4.0 event; NXP already claims 4.0)", effort: low}
  - {id: t-interop, lever: "Published interop with Apple U-series, Samsung and Pixel phones (Qorvo's U1 interop and Pixel 6 Pro history)", effort: med}
  - {id: t-ref, lever: "Anchor reference design with FEM, CAN and a partner BLE/NFC set (NXP and TI publish complete access designs)", effort: med}
  - {id: t-cpd, lever: "Bundle a CPD/kick algorithm partner (Qorvo showed CPD with Algorized at CES 2024)", effort: med}
  - {id: t-china, lever: "ICCE / ICCOA support for Chinese OEMs (ST lists ICCE)", effort: low}
  - {id: t-migrate, lever: "Software-compatible path from QPF5100Q to the AB chip (judgement)", effort: low}

risks:
  - "802.15.4ab is not ratified (RevCom planned Dec 2026); NBA is optional and no phone supports 15.4ab yet, so anchors must stay 15.4z-compatible for years."
  - "Legacy Qorvo may already have a 15.4ab project: public sources show none; check internally before committing."
  - "Bluetooth Channel Sounding could take entry cars and cap UWB at premium segments."
  - "Calterah, Samsung and NXP volume pricing could undercut a late entrant."
  - "Unknown from public data: QPF5100Q design wins and volumes, our die cost and process, real contract prices, NBA radio area and power."

questions:
  bu:
    - {id: q-bu-ab, text: "Does legacy Qorvo UWB already have an 802.15.4ab / NBA chip project, and at what stage (concept, tape-out, samples)?", why: "Public sources show none; avoid proposing what exists or was stopped"}
    - {id: q-bu-mms, text: "Can the QPF5100Q PHY repeat MMS fragments in firmware, and what range gain have we measured?", why: "The 6–12-month bridge (f-mms-fw) depends on it; ST says UWB-only MMS adds little"}
    - {id: q-bu-cost, text: "What are the die cost, process node and contract ASPs of QPF5100Q / DW3300Q, and where do we stand against NXP NCJ29D5 ($4.85–6.33 at 1k)?", why: "Our prices are not stated; the $3.5–5.5 AB-R range rests on a 30–50 % list-to-contract guess"}
    - {id: q-bu-wins, text: "Which OEM / Tier-1 programmes have QPF5100Q design wins, with SOP year and anchors per car?", why: "No public design win (d-proof); sets the base for the 9 M-anchor scenario"}
    - {id: q-bu-sens, text: "What sensitivity and range do QPF5100Q / DW3300Q reach against ST64UWB's +3 dB claim, alone and with QM14068 in front?", why: "Decides whether the anchor FEM (f-fem) is needed to offset ST's process lead"}
    - {id: q-bu-fe, text: "Can QM14068, QPC8019Q, QPF1002Q and SKY5A2108 dies be combined and AEC-Q qualified in one anchor FEM, and which merged Skyworks/Qorvo line would own it?", why: "f-fem / f-nbafem are distance 2 only if the dies qualify; p-fem has no anchor"}
  customer:
    - {id: q-c-ab, text: "From which model year do you require 802.15.4ab (MMS, NBA) in the anchors, and for how long must they stay 15.4z-compatible?", who: "OEM car-access / digital-key team", why: "Tests the 2028–29 SOP estimate (o-sop) and the ratification risk"}
    - {id: q-c-anchors, text: "How many UWB and BLE anchors per car in your next platform, and will NBA let you drop BLE anchors?", who: "OEM E/E architecture team", why: "4–8 anchors and 'fewer BLE, not none' (o-ble) are our estimates"}
    - {id: q-c-radar, text: "Would you run child presence, kick and intrusion on the interior and rear key anchors instead of a 60 GHz module, and at which positions?", who: "Tier-1 body / car-access team", why: "Sizes the AB-RR variant (3 M cars) and its +$1 premium"}
    - {id: q-c-zonal, text: "Where does access logic sit (separate access ECU or zone / central computer), and which link do the anchors need: CAN-FD, SPI or Ethernet?", who: "OEM E/E architecture team", why: "NXP's set wins where the access ECU is a box; decides CAN-FD on the chip (d-can)"}
    - {id: q-c-range, text: "What range and sensitivity must exterior anchors reach, and would you pay for an external UWB/NBA front end?", who: "Tier-1 antenna / RF team", why: "The anchor FEM ($0.6–1.1) has no public price anchor"}
    - {id: q-c-price, text: "What do you pay per anchor today (UWB chip, BLE), and what price would a 15.4ab anchor chip need?", who: "Tier-1 purchasing", why: "Validates the $3.5–5.5 / $4.5–6.5 targets; NXP 1k budgetary is the only anchor"}

