outlook:
  - {id: o-attach, text: "Wi-Fi 7 reaches about 15–25 % of new cars by 2030 (≈15–24 M, est), mainly China and US mid/premium", basis: "Embedded connectivity 91 % by 2030 (Berg); first Wi-Fi 7 modules in production 2027 (LG Innotek); Counterpoint says China and US lead", conf: low}
  - {id: o-ext, text: "About a third to half of those use external FEMs (est); entry designs keep on-chip PAs", basis: "NXP and Synaptics integrate the front end; Qualcomm offers QXM19xx; roof/RSE units need range", conf: low}
  - {id: o-coex, text: "Coexistence filtering becomes a requirement as Wi-Fi and V2X share smart antennas and cockpit units (judgement)", basis: "SKY5A1005/1006/1008 target Wi-Fi + V2X coexistence; Wi-Fi 6E named as a new interferer to C-V2X in a USDOT report (snippet)", conf: low}
  - {id: o-mlo, text: "MLO across 5 and 6 GHz becomes the default for CarPlay/Android Auto and RSE streaming", basis: "RUBY-W2 and LG Innotek both use 5 + 6 GHz; leaving 2.4 GHz", conf: med}
  - {id: o-against, text: "Against: Qualcomm's bundle and on-chip PAs could leave external FEMs a niche of a few M a year (est)", basis: "Every public automotive Wi-Fi 7 module uses Qualcomm", conf: low}

