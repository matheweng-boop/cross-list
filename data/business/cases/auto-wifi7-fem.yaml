# Preliminary case: automotive Wi-Fi 7 front end. Layout and rules: _template.yaml. Figures and links: the report's background notes.
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
title: "Automotive Wi-Fi 7 front end with V2X coexistence built in"
question: >-
  Should Skyworks (with Qorvo) build an AEC-Q104 Wi-Fi 7 front end for cars (5 + 6 GHz MLO) with 5.9 GHz V2X
  coexistence filtering inside, reusing today's Wi-Fi 7 FEMs and automotive BAW filters, given Qualcomm's QCA6797AQ
  with its QXM19xx front end and modules from u-blox, LG Innotek and Murata, and at what price?
updated: 2026-10-20
brief:
  - "We have the pieces but not the part: the broadest Wi-Fi 7 FEM range (consumer grade), automotive BAW coexistence filters (SKY5A1005 V2X notch, SKY5A1006 5 GHz stopping at 5835 MHz, SKY5A1008 6 GHz, all Preview) and Qorvo's automotive QPF4554Q/QPF4550Q, but no AEC-Q104 Wi-Fi 7 FEM."
  - "Weak point: Qualcomm sells the chip in every public automotive Wi-Fi 7 module (u-blox RUBY-W2, LG Innotek) and an integrated automotive FEM with it (QXM19xx); NXP and Synaptics put the PA on the chip."
  - "Proposal: a 2 × 2 MLO set of automotive iFEMs (5 GHz with V2X guard filter, 6 GHz with UNII-1–3 rejection) for module makers, about $2.2–3.6 per FEM and $9–14 per car set (est)."

position:
  advantages:
    - {id: a-range, text: "Broadest Wi-Fi 7/8 FEM range: 5 GHz (SKY85509-11), 6 GHz (SKY85639-11), 5–7 GHz Sky5 (SKY55714-11), 5/6 GHz meshplexer (SKY85929-11)", vs: "Qualcomm QXM19xx, Broadcom", conf: high}
    - {id: a-filters, text: "Automotive BAW coexistence filters already defined: SKY5A1005 V2X notch (30 dB min), SKY5A1006 5.170–5.835 GHz, SKY5A1008 5.945–7.125 GHz (50 dB to cellular, BT, UNII-1–3); Qorvo QPQ2230Q, QPQ2254Q", vs: "Murata XBAR (not automotive)", conf: high}
    - {id: a-v2x, text: "We also make the V2X front end (SKY5A2105, QPF1003Q), so we can specify both sides of the 5.9 GHz edge", vs: "Qualcomm (V2X chipset, front end not public)", conf: med}
    - {id: a-agnostic, text: "Chipset-agnostic: a FEM can serve Qualcomm, Synaptics, NXP and MediaTek designs; QXM19xx is tied to Qualcomm", vs: Qualcomm, conf: med}
    - {id: a-auto, text: "AEC-Q104 Grade 2 SiP flow, PPAP and IMDS in place (SKY5A2105, Sky5 telematics)", vs: "Richwave, Vanchip, Kangxi", conf: high}
  disadvantages:
    - {id: d-nopart, text: "No AEC-Q Wi-Fi 7 FEM today; Qorvo's automotive Wi-Fi parts are Wi-Fi 5/6 class (QPF4554Q switch+LNA, Preview; RFFM5765Q end of life)", vs: "Qualcomm QXM19xx", offset: "Qualify a set from existing Wi-Fi 7 dies with our automotive BAW", conf: med}
    - {id: d-bundle, text: "Qualcomm is in every public automotive Wi-Fi 7 module found and offers its own automotive FEM with the chip", vs: Qualcomm, offset: "Win on coexistence and range where QXM19xx falls short; target non-Qualcomm chipsets and module makers", conf: low}
    - {id: d-onchip, text: "Many automotive Wi-Fi chips have PA, LNA and switch on chip (NXP AW693, Synaptics SYN4383/4384), so an external FEM is optional", vs: "NXP, Synaptics", offset: "Sell the filter alone where the FEM is internal; FEM for range and roof/RSE units", conf: med}
    - {id: d-cost, text: "Consumer Wi-Fi FEMs are cheap and crowded (Richwave, Vanchip, Kangxi); our 5 GHz Wi-Fi FEMs list from about $1–3.3", vs: "Asian FEM suppliers", offset: "Compete on qualification and system coexistence, not price per chip", conf: low}
    - {id: d-preview, text: "All three automotive Wi-Fi BAW filters are Preview (Dec 2025 summaries); no production status", vs: "—", offset: "Move to production with a module partner", conf: high}
  diff_good:
    - {id: g-guard, text: "A 5 GHz path that stops at 5835 MHz keeps the car's own Wi-Fi out of the V2X band; a 6 GHz path with 50 dB to UNII-1–3 lets 5 and 6 GHz run at once (MLO/HBS)", conf: high}
    - {id: g-one, text: "One supplier for Wi-Fi FEMs, V2X FEM and coexistence filters in the same smart antenna or cockpit unit", conf: med}
  diff_bad:
    - {id: b-nochip, text: "No Wi-Fi chipset: design-ins follow Qualcomm's or another SoC vendor's reference design", conf: high}
    - {id: b-ecosys, text: "No automotive Wi-Fi module partner found in public sources (u-blox and LG Innotek name Qualcomm only)", conf: low}

architecture:
  columns: [Skyworks + Qorvo, Qualcomm, NXP / Synaptics, Module makers]
  rows:
    - ["Built as", "External FEM per chain + BAW coexistence filter", "QCA6797AQ chip + QXM19xx integrated automotive FEM", "Combo chip with PA/LNA/switch on chip; external FEM optional", "Chip + FEMs + antennas in one module (RUBY-W2 23 × 23 mm; LG Innotek >150 parts)"]
    - ["5 + 6 GHz at once", "Two FEMs per chain + 5/6 GHz meshplexer", "HBS / MLMR on chip", "AW693: 2 × 2 5–7 GHz + 1 × 1 2.4 GHz (Wi-Fi 6E)", "2 × 2 MLO on 5 and 6 GHz"]
    - ["V2X coexistence", "BAW guard on the Wi-Fi path (SKY5A1006/1008) + V2X BAW", "Not stated", "Not stated", "Not stated"]
    - ["Where it sits", "Module, head unit, TCU or roof", "Head unit / cockpit domain", "Head unit", "AVN, RSE, TCU, cockpit domain unit"]
  note: "From the BizDev block-diagram library (Qualcomm automotive telematics with QCA6696 and C-V2X 9150; NXP Wi-Fi 6/6E combo and connected radio with external FEMs + diplexer; Skyworks telematics and infotainment). Trend: Wi-Fi moves into the cockpit domain controller and smart antenna next to V2X and cellular, where coexistence is decided."

