# Preliminary case: automotive Wi-Fi 7. Layout and rules: _template.yaml. Figures and links: the report's background notes.
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
title: "Automotive Wi-Fi 7: a radio head for the smart antenna, with V2X coexistence built in"
question: >-
  What should Skyworks (with Qorvo) build for Wi-Fi 7 in cars in 2–3 years, reusing existing technology, given
  Qualcomm's chip-plus-front-end bundle, NXP's and Synaptics' on-chip power amplifiers, the in-car 6 GHz power limits
  and the documented Wi-Fi-to-V2X interference, and at what price?
updated: 2026-10-20
brief:
  - "Our advantage is architectural: we are the only supplier with Wi-Fi 7 front ends, V2X front ends, automotive cellular and GNSS front ends and the BAW filters that separate them on one antenna. Wi-Fi sits next to V2X in every automotive diagram with V2X, and US DOT measured in-car Wi-Fi cutting C-V2X range by more than half."
  - "Our disadvantages: no chipset (every public automotive Wi-Fi 7 module uses Qualcomm, which bundles its own front end), no automotive Wi-Fi power amplifier above 802.11ac, and in-car 6 GHz power is capped by regulation, so a high-power 6 GHz PA adds little."
  - "Proposal: RH57, a radio head for the roof telematics unit: V2X 5.9 GHz path as the base, 5 and 6 GHz Wi-Fi paths as an option (no carmaker has confirmed a Wi-Fi radio in the roof yet), BAW filters between them and front-end coexistence control, about $8–11 per antenna with Wi-Fi (est). Enabling step: automotive Wi-Fi 7 FEMs with the guard filter built in (about $1.6–2.8 each)."

position:
  advantages:
    - {id: a-allradio, text: "Only supplier with Wi-Fi 7 FEMs, V2X FEMs (SKY5A2105, QPF1003Q), automotive cellular (Sky5 SKY5A3xxx/5xxx) and GNSS (SKY5A2110) front ends and the BAW filters between them, for the same antenna or unit", vs: "Qualcomm, NXP, module makers", conf: high}
    - {id: a-filters, text: "Automotive coexistence BAW already defined: SKY5A1005 V2X notch (≥30 dB), SKY5A1006 5 GHz stopping at 5835 MHz, SKY5A1008 6 GHz (50 dB to UNII-1–3), QPQ2200Q/QPQ2230Q, QPQ2254Q", vs: "Qualcomm (no public coexistence filter)", conf: high}
    - {id: a-comp, text: "Antenna-side compensator know-how: SKY5A2105 works at the roof antenna or in the ECU at +29 dBm, AEC-Q104 Grade 2", vs: "Qualcomm QXM19xx, module makers", conf: high}
    - {id: a-range, text: "Broad current Wi-Fi 7 FEM range: SKY85509-11, SKY85639-11, SKY55714-11 (5–7 GHz), SKY55208-11 (2.4 GHz + BT), QPF4507/QPF4659, meshplexers SKY85929/931", vs: "Qualcomm, Asian FEM suppliers", conf: high}
    - {id: a-agnostic, text: "Chipset-agnostic: one front end can serve Qualcomm, NXP, Synaptics, MediaTek and Chinese V2X chips", vs: Qualcomm, conf: med}
  disadvantages:
    - {id: d-chip, text: "No chipset: every public automotive Wi-Fi 7 module (u-blox RUBY-W2, LG Innotek) uses Qualcomm, which pairs its own AEC-Q100 FEM QXM19xx", vs: Qualcomm, offset: "Win where coexistence and antenna placement matter; serve NXP, MediaTek and Synaptics designs and module makers", conf: med}
    - {id: d-nopa, text: "No automotive Wi-Fi PA above 802.11ac: our automotive 5 GHz parts are switch + LNA only (SKYA21041, QPF4554Q); Qorvo's RFFM5765Q/3482Q went end of life in 2024", vs: "Qualcomm QXM19xx", offset: "Qualify Wi-Fi 7 PA dies with the guard filter (enabling step)", conf: high}
    - {id: d-onchip, text: "NXP AW693 and Synaptics SYN438x put PA, LNA and switch on chip; in-cabin range is enough for many designs (13–16 dBm)", vs: "NXP, Synaptics", offset: "Sell the coexistence filter alone there; FEM where range, remote antennas or V2X coexistence matter", conf: high}
    - {id: d-6ghz, text: "In-car 6 GHz power is capped: US only very-low-power (14 dBm EIRP), EU low-power indoor banned in road vehicles, China has no 6 GHz Wi-Fi", vs: "—", offset: "6 GHz path is a filter/LNA/linearity part, not a high-power PA", conf: med}
    - {id: d-china, text: "China, the volume leader, is 2.4 + 5 GHz only, with local FEM suppliers (Vanchip, Richwave, Kangxi) and price pressure", vs: "Chinese FEM suppliers", offset: "Lead with coexistence filters and V2X in China's C-V2X programmes", conf: low}
    - {id: d-preview, text: "All automotive Wi-Fi BAW filters and meshplexers are Preview; our own library diagrams still show pre-Wi-Fi 6 parts", vs: "—", offset: "Move filters to production; publish an updated automotive reference architecture", conf: high}
  diff_good:
    - {id: g-coex, text: "A front end that keeps in-car Wi-Fi out-of-band emission at the V2X band edge below −37 dBm/MHz (the NTIA/DOT ask; EU −45) without help from the chipset", conf: med}
    - {id: g-roof, text: "Wi-Fi RF at the antenna (compensator) recovers 2–7 dB coax loss and up to 8 dB glass-roof loss, which only exists for V2X today", conf: low}
    - {id: g-one, text: "One supplier and one module for the 5–7 GHz radios at the antenna, instead of 6–7 parts from several vendors", conf: med}
  diff_bad:
    - {id: b-ref, text: "Design-ins follow the chipset reference design; Qualcomm's includes its own FEM", conf: med}
    - {id: b-unproven, text: "Telematics units and their antennas (Wi-Fi antennas included) are moving into the roof (LG 5G roof unit in production Aug 2026; Harman, Continental), but no carmaker confirms a Wi-Fi radio or front end there; mass-market hotspots keep the antenna in the dashboard", conf: med}

architecture:
  columns: [Skyworks + Qorvo, Qualcomm, NXP / Synaptics, Module makers]
  rows:
    - ["Built as", "Front end per chain + BAW filters + V2X FEM + cellular/GNSS FEMs", "Wi-Fi, C-V2X and modem chips + own FEM QXM19xx", "Combo chip with PA on chip; external FEM optional", "Chip + FEMs + antennas in one module (RUBY-W2: eFEM, 21 dBm)"]
    - ["Where Wi-Fi sits", "Head unit, TCU, or at the antenna (proposed)", "Head unit / cockpit", "Head unit; NXP V2X unit feeds Wi-Fi from the roof antenna unit", "AVN, RSE, TCU, cockpit unit"]
    - ["V2X coexistence at RF", "Own BAW (notch, 5 GHz guard, 6 GHz band)", "Not stated (chip-level arbitration)", "Not stated (WCI-2/PTA signalling)", "Optional coexistence filters listed (RUBY-W2)"]
    - ["Fit with the architecture trend", "Good: Wi-Fi, V2X, cellular and GNSS converge on the smart antenna and TCU", "Good: owns all chips", "Weak for range and coexistence", "Neutral: buys parts"]
  note: "From the BizDev block-diagram library: Qualcomm automotive telematics (QCA6696 + C-V2X 9150, separate FEMs), NXP V2X unit (Wi-Fi from the roof antenna unit), NXP connected radio and combo-chip diagrams (external FEM + diplexer as an option), TI TCU (Wi-Fi + V2X + GNSS + remote antenna power). No library diagram draws an RF coexistence filter between Wi-Fi and V2X."

