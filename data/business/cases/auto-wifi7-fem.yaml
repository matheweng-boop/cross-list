    - {id: q-bu-perf, text: "What output power, EVM and insertion loss do our Wi-Fi 7 FEMs reach against Qualcomm QXM19xx and on-chip PAs (NXP AW693, Synaptics)?", why: "Not public; decides whether an external FEM is worth it over 13–16 dBm on-chip"}
    - {id: q-bu-filters, text: "When do SKY5A1005/1006/1008 leave Preview, and what out-of-band emission at 5.925 GHz do we measure with a Wi-Fi 7 FEM against −37 dBm/MHz?", why: "All automotive coexistence BAW is Preview (d-preview); the test report (t-test) needs the data"}
    - {id: q-bu-comp, text: "Can the SKY5A2105 compensator loop handle Wi-Fi 7 320 MHz channels and fast T/R turnaround, or does it need a new detector and switch?", why: "f-comp is distance 3, possibly 4"}
    - {id: q-bu-merge, text: "Which merged Skyworks/Qorvo Wi-Fi 7 and V2X dies go into RH57, shared with the dual-carrier V2X FEM, and what longevity can we commit after Qorvo's 2024 automotive Wi-Fi EOL?", why: "One roadmap with auto-cv2x-fe; OEMs ask 10–15 years (t-supply)"}
    - {id: q-bu-cost, text: "What are the contract ASPs and costs of our consumer Wi-Fi 7 FEMs and SKYA21043, and does a 1.5–2.25× automotive premium hold?", why: "p-a56 and p-rh57 rest on list prices and an assumed premium"}
