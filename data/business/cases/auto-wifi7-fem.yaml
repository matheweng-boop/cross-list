risks:
  - "Qualcomm's reference design keeps its own FEM; the external socket may not open in Qualcomm designs."
  - "Wi-Fi at the roof is unproven: no public OEM programme; the case's headline depends on it (o-antenna)."
  - "Regulation: in-car 6 GHz power limits remove PA value; the EU review of very-low-power devices in road vehicles is unconfirmed."
  - "Compensator mode at Wi-Fi 7 bandwidths and shared-antenna isolation are unproven (distance 3, possibly 4)."
  - "China volume goes to local FEM suppliers at low prices."
  - "Unknown from public data: output power, EVM and insertion loss of our Wi-Fi parts; QXM19xx performance and price; external-FEM share; contract prices."

