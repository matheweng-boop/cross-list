  - {id: w-5g, feature: "Automotive 5 GHz Wi-Fi 7 iFEM with V2X guard BAW (pass to 5835 MHz)", benefit: "Wi-Fi never transmits into the V2X band; no separate filter", distance: 2, why: "SKY85509-11-class die + SKY5A1006 BAW in one AEC-Q104 module"}
  - {id: w-6g, feature: "Automotive 6 GHz Wi-Fi 7 iFEM with UNII-1–3 rejection", benefit: "5 and 6 GHz at once (MLO/HBS) on nearby antennas", distance: 2, why: "SKY85639-11-class die + SKY5A1008 BAW"}
  - {id: w-set, feature: "2 × 2 MLO reference set: 4 iFEMs + 5/6 GHz meshplexer + V2X notch", benefit: "Complete validated front end for module makers", distance: 2, why: "Reference design from existing parts (SKY85929-11, SKY5A1005)"}
  - {id: w-filters, feature: "Move SKY5A1005/1006/1008 from Preview to production", benefit: "Sells today where the PA is on chip (NXP, Synaptics)", distance: 1, why: "Qualification and documents"}
  - {id: w-guide, feature: "Coexistence application note with V2X FEM (isolation, filter plan, antenna spacing)", benefit: "Makes coexistence part of the sale", distance: 1, why: "Documents and lab data from existing parts"}
  - {id: w-one, feature: "One 5–7 GHz automotive FEM with switchable 5/6 GHz BAW", benefit: "Smaller than two FEMs per chain", distance: 3, why: "New die/switch arrangement; SKY55714-11 exists but MLO needs both bands at once"}
  - {id: w-g1, feature: "Grade 1 (125 °C) option", benefit: "Roof and hot cockpit units", distance: 3, why: "Requirement not stated by OEMs; may need redesign"}
  - {id: w-24, feature: "Automotive 2.4 GHz FEM refresh (Wi-Fi 7 + BT)", benefit: "Completes the tri-band set", distance: 2, why: "SKY55208-11 / QPF4239Q exist; qualify one"}
  - {id: w-v2x, feature: "Wi-Fi + V2X combined front end in one module", benefit: "Smart antenna with one RF part for 5–6 GHz", distance: 3, why: "Combines Wi-Fi and V2X dies; QPF1003Q already mixes C-V2X, DSRC and Wi-Fi in one FEM"}

