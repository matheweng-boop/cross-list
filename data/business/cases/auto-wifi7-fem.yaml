outlook:
  - {id: o-wifi7, text: "Wi-Fi 7 reaches about 10–20 % of automotive Wi-Fi devices by 2030 (est); production starts 2027", basis: "Wi-Fi 6 needed about 4 years to reach 11 % (Counterpoint); first Wi-Fi 7 SOP 2027 (LG Innotek)", conf: low}
  - {id: o-6ghz, text: "6 GHz-capable share rises from 21 % (2026) to about 35–45 % by 2030, led by the US and Korea; China stays 2.4 + 5 GHz (est)", basis: "IDC 2026 share; regional 6 GHz rules", conf: low}
  - {id: o-efem, text: "External FEMs stay in about a third to half of Wi-Fi 7 designs, tied to Qualcomm premium platforms (est)", basis: "Every RUBY-W2 variant uses eFEM; NXP/Synaptics on-chip", conf: low}
  - {id: o-coex, text: "Coexistence limits tighten (−37 dBm/MHz or lower at the V2X edge) as C-V2X spreads; filtering moves into the front end (est)", basis: "NTIA/DOT ask; EU −45; Japan −37; Korea −34", conf: med}
  - {id: o-antenna, text: "Smart antennas absorb V2X, cellular and GNSS first; Wi-Fi at the antenna follows only for exterior uses (garage OTA, charging data, hotspot) — the open question for this case (est)", basis: "LG roof telematics unit in production (Aug 2026) and LG patent EP 4 478 536 with Wi-Fi antennas in the roof module; Harman/Continental roof units list Wi-Fi (snippets); against: dashboard hotspot antennas (GM, Ford), Tesla mirror antennas, antenna-only fins", conf: low}
  - {id: o-china, text: "China's volume moves to Wi-Fi 6/7 at 5 GHz with local FEMs; our share there depends on V2X and filters, not Wi-Fi PAs (est)", basis: "Counterpoint; local FEM suppliers", conf: low}

features:
  - {id: f-filters, feature: "Automotive coexistence filters to production (SKY5A1005/1006/1008)", benefit: "Meets the V2X band-edge limits in any design, even with on-chip PAs", distance: 1, why: "Defined and Preview today; qualification and documents"}
  - {id: f-a5a6, feature: "Automotive Wi-Fi 7 FEMs with the guard filter built in (A5 5 GHz, A6 6 GHz)", benefit: "Entry ticket: our first automotive Wi-Fi PA above 802.11ac", distance: 2, why: "Existing Wi-Fi 7 dies + existing BAW in a qualified module; 3 if the die needs redesign for 105 °C"}
  - {id: f-cm3, feature: "Cabin tri-band module CM3 (2.4 + 5 + 6 GHz, BT, notch) per antenna", benefit: "Parity with Qualcomm QXM19xx for non-Qualcomm chips and module makers", distance: 2, why: "Existing dies and triplexer; consumer-grade today"}
  - {id: f-rh57, feature: "RH57 radio head: Wi-Fi 5 GHz + V2X 5.9 GHz + Wi-Fi 6 GHz paths with filters, per antenna", benefit: "One module for all 5–7 GHz radios at the smart antenna; replaces 6–7 parts", distance: 2, why: "Reuses Wi-Fi 7 dies, SKY5A2105 V2X die set and filters; separate antenna ports"}
  - {id: f-comp, feature: "Compensator mode for Wi-Fi (gain set to cable loss, fast T/R)", benefit: "Wi-Fi RF at the roof; recovers coax and glass-roof loss", distance: 3, why: "Exists for V2X; Wi-Fi 7's 320 MHz channels and fast turnaround need new detector and switch timing"}
  - {id: f-arbiter, feature: "Front-end coexistence control (V2X transmit protects the Wi-Fi receiver)", benefit: "Coexistence without chipset help; chipset-agnostic", distance: 3, why: "New control logic in the module controller"}
  - {id: f-mux, feature: "Three-way 5–7 GHz BAW multiplexer for a single shared antenna port", benefit: "One antenna for Wi-Fi 5/6 and V2X", distance: 3, why: "Needs 20 MHz guard bands where today's notch needs 40 MHz; isolation from +29 dBm V2X not stated (could be 4)"}
  - {id: f-ref, feature: "Updated automotive reference architecture and coexistence test report (vs −37 dBm/MHz)", benefit: "Our library diagrams still show pre-Wi-Fi 6 parts; evidence sells the filter", distance: 1, why: "Documentation and measurements"}
  - {id: f-grade1, feature: "Grade 1 (125 °C) for roof mounting", benefit: "Opens hotter antenna positions", distance: 3, why: "No public OEM requirement; may need design changes"}
  - {id: f-6pa, feature: "High-power 6 GHz PA for cars", benefit: "None in most regions", distance: 2, why: "Not recommended: in-car 6 GHz is capped at 14 dBm EIRP (US), banned for LPI (EU), absent (China)"}

