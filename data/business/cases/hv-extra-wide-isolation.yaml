risks:
  - "Timing: TI, Novosense and Broadcom already hold the 1500 V sockets; a late ultra-wide family wins only redesigns and new platforms."
  - "No price premium on extra-wide isolators (TI DWW = DW reel price); margin depends on the package costing no more than the wide body."
  - "The working-voltage rating, not only creepage, must reach about 2000 Vrms for 1500 V DC; not yet shown for our dies in the wider package."
  - "Many designs avoid the need: coating or potting (PD1), basic insulation with a protective earth, a grounded DC midpoint, or fiber optics (AN1456 section 6)."
  - "China holds over half of solar and storage volume, with Novosense as a local 15 mm supplier."
  - "Unknown from public data: units per design, the share of designs that put the reinforced barrier on an isolator rather than an optocoupler or fiber, contract prices, and the release date of our ultra-wide SOIC."

# One line per section on what it means for the decision (Bottom line in reports.yaml)
thread:
  benefit: Saving a second barrier, potting or fiber is the argument to test in the first customer call.
  position: The dies exist and AN1456 announces the package; the gap is release and rating, so the BU question comes first.
  market: 1500 V solar and storage are large and growing; volume is not the open question, timing against TI and Novosense
    is.
  outlook: The car stays at 8 mm, so the first customers are solar, storage and data-center power.
  features: Isolators and isolated amplifiers (distance 2) go first; the gate driver and AEC-Q100 parts follow.
  product: 'Define the 2–4-channel isolator first: the simplest die to move, with the most sockets.'
  asp: No premium on extra-wide isolators, so the package must cost about the same as the wide body (est); isolated amplifiers
    can carry a premium.
  attach: Selling the whole barrier (isolators, amplifiers, drivers, bias) is how a late entry still wins designs.
  questions: The release date and rating (first BU question) and the assessor's creepage (first customer question) are
    the needed-now items.
  risks: If the release slips well past 2027 the 1500 V sockets are taken; the answer then narrows to data centers (est).
