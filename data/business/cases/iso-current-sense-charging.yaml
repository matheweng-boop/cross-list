outlook:
  - {id: o-points, text: "800 V SiC chargers add sense points (bidirectional PFC phases, DAB primary and secondary, DC output, insulation path), so isolated amplifiers per charger rise (est)", basis: "TIDA-01606 / 010210 / 010054 parts lists; library diagrams", conf: med}
  - {id: o-integr, text: "Integrated isolated power becomes the default for sense points away from the gate drivers (DC link, output, battery side) (est)", basis: "TI uses it in 2 of 3 current 800 V charger references", conf: med}
  - {id: o-hall, text: "Below about 80 A integrated Hall sensors keep gaining (no shunt, no supply, ±1–1.5 %); above 100 A shunts and modules stay (est)", basis: "TMCS1123 page (80 A rms, ±1.4 %); shunt heat at high current", conf: med}
  - {id: o-meter, text: "DC fast chargers need billing-grade DC metering (calibration law in several countries), a separate, module-based niche (est)", basis: "Our reading; not researched in this run", conf: low}

