# Preliminary case: a fully integrated isolated current-sense amplifier for EV charging (isolated amplifier + built-in
# isolated power, and an optional built-in shunt). Layout and rules: _template.yaml. Figures and links:
# iso-current-sense-charging.background.html. Asked by the owner in the 23 Oct 2026 review ("Current sensing is big and
# more important in charging applications ... is there a market for shunt + DC-DC built in, or others?").
# conf: high = primary document read; med = trade press, forum or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
gist: "Put our Si89xx current-sense die and Si86Px isolated power into one reinforced car part for EV chargers; a built-in shunt is not worth it yet."
abstract:
  - "TI already sells isolated amplifiers with built-in power and uses them in its 800 V charger designs."
  - "Our die beats TI on noise, bandwidth and gain drift, but needs a separate supply and has a third of TI's newest CMTI (50 vs 150 kV/µs)."
  - "Decide whether to ask the BU for an Si89xx part with built-in power and 150 kV/µs, aimed at chargers and DC-DC (it depends on Si86Px reaching a reinforced car rating)."
title: "Fully integrated isolated current sensing for EV charging: our Si89xx shunt amplifier with built-in isolated power, and a built-in shunt for small currents"
fn: isolated_amplifier
headline: f-dcdc
library: [traction_asil_d]
question: >-
  Is there a market for an isolated current-sense amplifier that carries its own isolated power supply (one supply on
  the low-voltage side, like TI's AMC3301 / AMC3302) and, for small currents, its own shunt, in on-board chargers, DC
  fast chargers and wallboxes? Can Skyworks build it from the Si89xx amplifier and modulator dies and the integrated
  isolated power of Si86Px, how accurate must it be, and at what price against TI, ADI, Allegro, Infineon, Melexis and LEM?
updated: 2026-11-02
brief:
  - "Yes for built-in isolated power: TI already sells a whole family of isolated amplifiers and modulators with a built-in isolated DC-DC (AMC3301, AMC3302-Q1, AMC3306M05-Q1 and others) and uses them in two of its three 800 V charger reference designs; the AMC3301 reel lists at only $1.65 (1k). For a built-in shunt the answer is 'only for small currents': up to about 80 A the market is already served by isolated Hall sensors with the conductor in the package (TI TMCS1123, ±1.4 % over temperature and lifetime, $1.96–2.15 at 1k; Allegro, Melexis, Infineon); above that the shunt stays on the board or the customer buys a LEM-type module. We found no isolated amplifier with a built-in shunt."
  - "Our position: the Si8921BD / Si8941BD dies match TI's accuracy (0.2 % gain error, 150–180 µV offset) and beat it on noise (82 vs 71 dB SNR) and bandwidth (600 vs 334 kHz), with 5 kVrms reinforced isolation and automotive versions; AN1270 puts the total static error of the amplifier at about ±0.5 % (RSS, –40 to 125 °C). But each one needs a separate isolated 5 V supply on the high-voltage side, and the CMTI is 50 kV/µs against 85–95 kV/µs for TI's integrated parts and 150 kV/µs for its newest automotive amplifiers and modulators (AMC0x00 / 0x02 / 0x06-Q1). Over temperature TI's best offset drift is lower (0.5–0.9 µV/°C max on its ±50 mV parts vs our 3 µV/°C max), ours has less gain drift (24 vs 35–45 ppm/°C max). Our Si86Px (samples, Mar 2026) already puts an isolated DC-DC and a miniature transformer in the package (up to 0.5 W)."
  - "Proposal: an 'Si89xx-P' family: the Si892x / Si894x die plus the Si86Px power stage in one wide-body package, reinforced, AEC-Q100, CMTI raised to ≥150 kV/µs (TI's new level) for SiC chargers; about $1.5 (target, est) against AMC3301's $1.65 list. Aim it at on-board chargers, the HV-to-LV DC-DC and fast-charger modules: in the battery, pack monitors now measure the pack current themselves, and wallboxes need few isolated amplifiers (In depth, 2 Nov). A built-in-shunt version for ≤50 A (wallbox, OBC auxiliary rails) is a later, out-of-the-box step. Sold with our gate drivers and isolators in the same charger."

customer_benefit:
  for: "On-board charger and DC fast-charger power-module makers (Tier-1s and charger OEMs), wallbox makers; also battery-junction-box and BMS teams"
  summary: "Each current-measurement point across the high-voltage barrier becomes one part with one low-voltage supply, instead of an amplifier plus its own isolated supply on the high-voltage side, and the error budget comes from one datasheet."
  today: "A shunt on the high-voltage rail, an isolated amplifier or modulator (Si892x / Si894x, AMC1301 / AMC1302 class) and, for each sense point, a floating 5 V supply: taken from the gate-driver bias with a Zener and LDO (AN1270 figure 1), or from an isolated DC-DC (Si88xx with an external transformer, or a module). Where the current is under about 80 A, many designs use a Hall sensor with the conductor in the package instead (TI's 800 V reference designs use both)."
  with_us: "Si89xx-P: the shunt amplifier or modulator with its isolated power inside, reinforced and automotive, supplied only from 3.3 V or 5 V on the low-voltage side; the shunt stays external for 50–500 A. For small currents a version with the shunt inside."
  gains:
    - {id: cb-supply, kind: parts, gain: "No high-side supply per sense point", how: "The isolated DC-DC and transformer are in the package (Si86Px technology, up to 0.5 W; the amplifier side needs about 30 mW)", measure: "1 isolated amplifier + Zener/LDO or isolated DC-DC + transformer → 1 part per sense point (est)", conf: med}
    - {id: cb-place, kind: placement, gain: "Sense point anywhere on the high-voltage side", how: "No need to sit next to a gate-driver supply to borrow its bias; the part can sit at the shunt (DC link, output, battery side)", measure: "not stated", conf: low}
    - {id: cb-error, kind: performance, gain: "Low and predictable error", how: "Gain error 0.2 %, offset 150 µV, nonlinearity 0.02 % (Si8921BD); total static error about ±0.5 % RSS over –40 to 125 °C before the shunt (AN1270)", measure: "±0.5 % RSS (IC) vs ±1.4 % max for an integrated Hall sensor without calibration (TMCS1123)", conf: high}
    - {id: cb-noise, kind: performance, gain: "Less noise and more bandwidth than the integrated competitor", how: "Our analog die: 82 dB SNR and 600 kHz vs AMC3301's 71 dB and 334 kHz (BizDev parts data); faster over-current detection in SiC chargers", measure: "SNR +11 dB, bandwidth ×1.8 (datasheet values)", conf: high}
    - {id: cb-safe, kind: safety, gain: "One reinforced barrier for sensing and its supply", how: "5 kVrms reinforced (SSO-8 class) instead of a basic-rated external DC-DC (Si88xx 3.75 kVrms basic)", measure: "basic → reinforced across the power path of the sense point", conf: med}
  gives_up:
    - "A slightly larger package than an 8-pin amplifier (TI uses a 16-pin wide SOIC for the integrated parts)"
    - "Emissions from the in-package DC-DC must be handled (TI publishes low-emission layouts); not yet shown for our part"
    - "Above about 80–100 A the shunt (and its heat) stays on the board; the built-in shunt only fits small currents"

position:
  advantages:
    - {id: a-perf, text: "Si8921BD analog die: 82 dB SNR and 600 kHz bandwidth vs AMC3301 71 dB / 334 kHz and AMC3302-Q1 70 dB / 340 kHz, at equal gain error (0.2 %) and offset (150 µV)", vs: "TI AMC3301, AMC3302-Q1", conf: high}
    - {id: a-iso, text: "5 kVrms reinforced in SSO-8 (8–8.5 mm) vs 4.25 kVrms for TI's integrated-DC/DC parts", vs: "TI AMC3301 family", conf: high}
    - {id: a-power, text: "The isolated power stage exists: Si86Px puts a DC-DC and a miniature transformer in the package (0.5 W, 43 % peak efficiency); about 15 times the 30 mW one amplifier draws on its high side (est)", vs: TI, conf: high}
    - {id: a-set, text: "Same charger, same supplier: isolated gate drivers (Si828x / Si823x), isolators (Si86xx), isolated bias (Si88xx) and sensing", vs: "Allegro, Melexis, LEM (sensing only)", conf: med}
    - {id: a-gdrift, text: "Less gain drift: Si8921 at most 24 ppm/°C (–9 typical) and Si894x at most 25, against 35–45 ppm/°C on TI's AMC0300D-Q1, AMC3301-Q1 and AMC0302D-Q1, so one calibration holds better from –40 to 125 °C", vs: "TI AMC0x00 / 0x02-Q1, AMC3301-Q1", conf: high}
  disadvantages:
    - {id: d-cmti, text: "CMTI 50 kV/µs on Si892x / Si894x vs 85–95 kV/µs on TI's integrated parts (AMC3301-Q1, AMC3302-Q1) and 150 kV/µs on its newest automotive amplifiers and modulators (AMC0300D, AMC0302D, AMC0306-Q1); a SiC charger switches at 50–100 V/ns", vs: "TI AMC0x00 / 0x02 / 0x06-Q1, AMC3301 / AMC3302-Q1", offset: "Raise CMTI to ≥150 kV/µs in the new version (our Si86 isolators and gate drivers already reach 100 kV/µs and more)", conf: high}
    - {id: d-drift, text: "Higher worst-case offset drift: Si8921 at most 3 µV/°C (0.5 typical) and Si894x at most 2, against 0.5–0.9 µV/°C max on TI's ±50 mV parts (AMC3302-Q1, AMC1302-Q1, AMC0302D-Q1); it shows at light load and in coulomb counting", vs: "TI AMC0302D-Q1, AMC1302-Q1, AMC3302-Q1", offset: "Specify a maximum drift near the 0.5 µV/°C typical in the new version, or calibrate offset in the customer's software", conf: high}
    - {id: d-bms, text: "In the battery the pack current moves into pack monitors on the high-voltage side: TI BQ79631-Q1 measures shunt current, pack voltages and insulation resistance with ASIL D and talks over an isolated daisy chain", vs: "TI BQ79631-Q1 (pack monitors)", offset: "Aim at the on-board charger, the HV-to-LV DC-DC and fast-charger modules; in the battery keep to high-voltage and insulation sensing", conf: high}
    - {id: d-late, text: "TI has sold integrated-DC/DC isolated amplifiers since 2019 (AMC3301) and designs them into its own 800 V charger references", vs: TI, offset: "Lead with noise, bandwidth and 5 kVrms; offer a pin-compatible footprint where possible (open)", conf: high}
    - {id: d-price, text: "TI's list price is low: AMC3301DWER $1.65 at 1k (reel), below its own AMC1306M25 modulator ($2.38)", vs: TI, offset: "Target the automotive (-Q1) sockets and the set price with our drivers", conf: high}
    - {id: d-hall, text: "Below about 80 A integrated Hall sensors need no shunt and no isolated supply at all, at about $2 (TMCS1123) and ±1.4 % uncalibrated", vs: "TI TMCS1123, Allegro, Melexis, Infineon", offset: "Win where accuracy, bandwidth or current above 80 A matter: DC fast chargers, OBC DC link, battery current", conf: high}
  diff_good:
    - {id: g-noise, text: "Lowest noise and widest bandwidth of the integrated parts compared (from BizDev datasheet values)", conf: high}
    - {id: g-budget, text: "A published error-budget method (AN1270) that the customer can reuse for the whole chain", conf: high}
  diff_bad:
    - {id: b-none, text: "No integrated-power isolated amplifier today; the Si86Px power stage is samples-only and basic-rated (3.75 kVrms)", conf: high}
    - {id: b-auto, text: "Si86Px is industrial; the automotive qualification of the in-package transformer is open", conf: med}
    - {id: b-docs, text: "TI states CISPR 25 emissions on AMC0x00 / 0x02-Q1 and AMC3301-Q1 and offers functional-safety documents (AMC1302-Q1); the Si89xx front pages state neither", conf: med}

