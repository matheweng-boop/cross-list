product:
  name: "Si89xx-P: reinforced isolated shunt amplifier and modulator with built-in isolated power (optional built-in shunt)"
  spec:
    - ["Reuses", "Si8921/22 analog amplifier and Si8941/46/47 modulator dies (±62.5 / ±250 mV inputs); Si86Px integrated DC-DC and miniature transformer; Skyworks capacitive isolation"]
    - ["New", "Multi-die wide-body package with the power stage; reinforced rating for the power path; CMTI ≥150 kV/µs; maximum offset drift near 1 µV/°C; AEC-Q100 Grade 1; CISPR 25 data; fault output when the internal supply is lost"]
    - ["Outputs", "Differential analog (amplifier) or 1-bit stream with internal or external clock (modulator), like the Si892x / Si894x today"]
    - ["Accuracy (target, est)", "Gain error ≤0.2 %, offset ≤150 µV, nonlinearity ≤0.02 %: today's die values; total static error about ±0.5 % RSS over –40 to 125 °C before the shunt (AN1270 method); with a ±0.5 % 50 ppm/K shunt about ±1 % RSS uncalibrated and ±0.5 % after one gain calibration (est)"]
    - ["Replaces", "Amplifier + Zener/LDO bias or + isolated DC-DC; TI AMC3301 / AMC3302-Q1 / AMC3306M05-Q1; Hall sensors where accuracy or current above 80 A matter"]
    - ["Answers", "OBC (PFC phase and output currents, DC link), DC fast-charger modules (PFC, DAB, output), HV-to-LV DC/DC; in the battery junction box high-voltage and insulation sensing (pack current moves into pack monitors)"]
    - ["Delivery (est)", "Reference design and today's parts now; Si89xx-P 18–24 months (est); built-in shunt later, only if the integrated Hall market leaves room"]

