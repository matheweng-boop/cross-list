# In depth (owner's comment "Look more into it", 27 Oct 2026; added 2 Nov 2026): shown after section 1
# (business/_case_depth.html). Every figure is in the background notes, section 6; "est" marks our estimates.
depth:
  title: "In depth: where isolated current sensing sits, how it is done and what it must meet"
  date: 2026-11-02
  intro: "The owner asked us to look more into this case. Short answer (est): the case holds, with two changes. The sockets are in the on-board charger, the HV-to-LV DC-DC and fast-charger modules; in the battery the pack monitor now measures the pack current itself, and an AC wallbox needs few isolated amplifiers. And TI's newest automotive parts reach 150 kV/µs CMTI, so Si89xx-P must aim there, not at 100."
  tables:
    - id: where
      title: "Where isolated current sensing sits"
      columns: [System, "Sense points (our library diagrams)", "How it is done", "Socket for an isolated amplifier (est)"]
      rows:
        - ["On-board charger (11–22 kW, 400 / 800 V)", "PFC phase currents and voltages, DC-link voltage, DC-DC primary current, output current and voltage (TI and Renesas OBC diagrams)", "Shunt with an isolated amplifier or modulator; Hall sensors below about 80 A (TI's 800 V designs use both)", "Good: 3–5 a charger, automotive grade"]
        - ["HV-to-LV DC-DC (400 / 800 V to 12 / 48 V)", "Primary current and voltage across the barrier; secondary current on the low-voltage side (TI diagram)", "Isolated amplifier on the primary; a plain shunt amplifier on the secondary", "1–2 a car, automotive grade"]
        - ["DC fast charger (30–60 kW power modules)", "Three-phase input currents and voltages, DC bus, output current and voltage; an insulation monitor at the charger (TI and Renesas diagrams)", "Shunt with an isolated amplifier or modulator; billing-grade DC metering sits in a separate meter module", "Good: 4–6 a module plus the insulation monitor; industrial grade is enough"]
        - ["AC wallbox (7–22 kW)", "Input and output current and voltage, metering per phase, a 6 mA DC residual-current monitor (IEC 62752 / 62955), relay weld check (TI, NXP and Renesas diagrams)", "TI's diagram uses isolated amplifiers and current sensors on the input and output; NXP and Renesas meter with a metrology MCU and shunts or current transformers; a fluxgate residual-current monitor; Renesas uses an isolation amplifier for the weld check", "Small: 0–2, industrial grade; our digital isolators fit the metering side"]
        - ["Battery (BMS, battery disconnect unit)", "Pack current, pack and link voltages, insulation resistance, pre-charge (TI, NXP and Renesas battery diagrams)", "The pack monitor on the high-voltage side measures the shunt current and talks over an isolated daisy chain (TI BQ79631-Q1, ASIL D); TI's diagram keeps isolated amplifiers for high-voltage and insulation sensing", "Shrinking: 1–2 for voltage and insulation; the pack current goes to pack monitors"]
      note: "Library diagrams: HEV/EV on-board charger and HV-to-LV DC-DC (TI), 6.6 kW bidirectional OBC (Renesas), DC fast charging station (TI) and power module (Renesas), AC wallbox (TI, NXP, Renesas), EV high-voltage battery system (TI, NXP, Renesas). Socket counts are our reading of those diagrams (est)."
    - id: how
      title: "Shunt with an isolated amplifier or modulator, Hall, or other magnetic sensors"
      columns: [Method, "Current range", "Accuracy (public figures)", "Speed", "Isolation and supply", "For / against", "Who sells it"]
      rows:
        - ["Shunt + isolated amplifier (analog out)", "Any: the shunt sets it; its heat limits it at several hundred amps (est)", "Gain error 0.2–0.25 %, offset 50–200 µV max (Si8921, TI AMC0x00 / 0x02)", "280–600 kHz; 0.8 µs delay (Si8921)", "In the chip (5 kVrms reinforced); needs a floating 3–5 V supply on the high side unless it is built in (TI AMC33xx)", "For: the most accurate, DC and AC, no stray-field effects. Against: shunt loss, the high-side supply, careful layout", "Skyworks Si8921 / 22; TI AMC0x00 / 0x02, AMC1300B / 1302, AMC3301 / 3302; ADI ADuM3195 / ADuM4195"]
        - ["Shunt + isolated delta-sigma modulator (bit stream)", "Same as above", "14-bit ENOB typical, SNR 84–90 dB; offset drift 1–2 µV/°C max (Si894x, TI AMC1306-Q1)", "Set by the digital filter in the MCU or FPGA; a fast and a slow filter run side by side for over-current and control", "Same as above", "For: highest resolution, a digital link the switching noise does not disturb. Against: needs a clock and a digital filter", "Skyworks Si8941 / 46 / 47; TI AMC1306, AMC0306, AMC3306; ADI isolated modulators (not read)"]
        - ["Hall sensor with the conductor in the package", "Up to about 60–80 A continuous (TI TMCS1123 80 A; Infineon 70 A in TISON-8, 60 A in DSO-16)", "±1.4 % over temperature and lifetime without calibration, offset 40–60 mA max (TMCS1123); no calibration needed (Infineon)", "250 kHz, 130 ns delay (TMCS1123)", "No high-side supply; reinforced (8 mm in DSO-16, up to 1050 V)", "For: no shunt, no supply, one part. Against: a current limit, offset in milliamps", "TI TMCS1123; Infineon XENSIV TLx497x; Allegro, Melexis (not read)"]
        - ["Coreless Hall or TMR sensor on a busbar or PCB track", "100 A to several kA", "High after a one-time end-of-line calibration (Infineon)", "TMR: very high bandwidth and fast response (Infineon)", "No contact with the conductor, so isolated by design; no current limit", "For: no loss, no shunt, ISO 26262 (ASIL) parts. Against: calibration, placement, stray fields (gradient sensing helps)", "Infineon XENSIV TLx497x (Hall) and TLx557x (TMR, sold as a shunt replacement)"]
        - ["Modules with a core (open- or closed-loop Hall, fluxgate)", "50 A to kA", "Closed-loop and fluxgate are the most accurate; used for billing-grade DC metering and 6 mA DC residual current (est)", "Tens to hundreds of kHz (est)", "Inside the module", "For: accuracy and isolation off the board. Against: size and price", "LEM and others (not read)"]
