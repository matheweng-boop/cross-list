risks:
  - "TI already owns the integrated-power socket with low list prices ($1.65 at 1k) and its own 800 V reference designs."
  - "Integrated Hall sensors cover most currents under 80 A without a shunt or supply; the built-in-shunt idea may find little room."
  - "The in-package power stage (Si86Px) is samples-only, industrial and basic-rated; reinforced and automotive ratings are not yet shown."
  - "EMI from an in-package DC-DC near a precision amplifier needs care (TI publishes low-emission layouts)."
  - "Unknown from public data: sense points per charger, contract prices, the share of designs that calibrate at end of line, and Skyworks' plans for Si86Px."

# One line per section on what it means for the decision (Bottom line in reports.yaml)
thread:
  benefit: One part and one supply per sense point is the saving Si89xx-P must be priced against (AMC3301 at $1.65).
  position: Accuracy and noise are already ours; built-in power and CMTI are the two gaps that decide the case.
  market: TI's own 800 V charger designs already use built-in power, so demand is not the open question; feasibility is.
  outlook: More sense points per 800 V charger raise the stakes; below 80 A Hall sensors win, so aim Si89xx-P at the DC
    link, the output and the PFC.
  features: Distance 2 (die plus Si86Px in one package) is the step to decide; CMTI (3) and the built-in shunt (4) can
    follow.
  product: 'Define the automotive version first: reinforced, AEC-Q100, CMTI of at least 100 kV/µs.'
  asp: The $1.9 automotive target (est) works only if the package adds little to today's die cost; ask the BU before quoting.
  attach: Selling it with our gate drivers and the hot-swap pre-charge set is what makes a late entry worth it.
  questions: The first two business-unit questions are the needed-now items; the customer questions confirm accuracy and
    price.
  risks: If Si86Px stays basic-rated and industrial, the answer becomes no.
