# Preliminary case: car radio. Layout and rules: _template.yaml. Figures and links: the report's background notes.
# conf: high = primary document read; med = trade press or advocacy body; low = search snippet or analyst PR.
# "est" = our estimate. distance: see DISTANCE in app/services/prelim.py (0 today ... 4 new technology).
gist: "A radio node at the antenna, built from our tuner and decoder circuits, fits zonal cars, but public volumes are missing."
abstract:
  - "Our split tuner + decoder design suits radios that move next to the antenna in zonal cars."
  - "We are behind ST on cost per chip and behind NXP on chip count."
  - "Not enough data yet: ask carmakers whether the radio moves to the antenna before deciding."
title: "Car radio: a radio node for the antenna"
fn: am_fm_tuner
headline: f-node
library: [roof_coexistence]
question: >-
  What should Skyworks develop next for car radio in 2–3 years, reusing existing technology, given NXP and ST,
  software radio, remote tuner modules and HD Radio, and at what price?
updated: 2026-10-20
brief:
  - "Our advantage is the architecture: chainable tuners plus a separate multi-standard decoder can sit at the antenna, in the head unit, or feed a central computer. Zonal cars favour that split."
  - "Our disadvantages: higher cost per chip than ST's mature reused designs, and more chips than NXP's one-chip radio. At the antenna a module built from our parts needs 5–7 parts."
  - "Proposal: a radio node, 2 or 4 tuners + decoder + car-network output (decoded audio or raw samples), at about $10–12 (2 tuners) and $16–19 (4 tuners) in volume (est)."

customer_benefit:                # what the proposal changes in the customer's system
  for: "OEM E/E architecture team; Tier-1 building the antenna module or head unit"
  summary: "Move the radio out of the head unit to the antenna and send digital audio over the car network instead of RF over coax, with one part that scales from 2 to 4 tuners."
  today: "Antenna amplifiers at the roof and glass, coax runs to the head unit, tuners and decoding in the head unit (NXP one-chip radio) or tuners feeding the main processor (ST). A remote tuner module built from our parts today needs 2 dual tuners, a decoder, a bridge MCU, a clock and flash (5–7 parts)."
  with_us: "RN2 or RN4 at the antenna: tuners, decoder and network output in one package; one A²B or Ethernet link carries decoded audio and data (or raw samples) to the head unit or central computer; the head unit carries no radio silicon."
  gains:
    - {id: cb-cable, kind: cabling, gain: "RF coax to the head unit replaced by a digital link the car already has", how: "Tuning and decoding happen at the antenna; only audio and data travel", measure: "Radio coax runs to the head unit → 0 (est; 2–4 today depending on antennas)", conf: low}
    - {id: cb-parts, kind: parts, gain: "One part at the antenna instead of 5–7", how: "Tuners, decoder, clock and boot in one package (step 1), one die (step 2)", measure: "5–7 → 1 (est, from our own module bill of materials)", conf: med}
    - {id: cb-place, kind: placement, gain: "The OEM chooses where the radio sits per platform without redesign", how: "Same part at the antenna, in the head unit or feeding a central computer (decoded audio or raw samples)", measure: "3 split points, 1 design", conf: med}
    - {id: cb-scale, kind: scaling, gain: "One board and one software stack from entry to premium", how: "RN2 and RN4 share package, pinout and API", measure: "2 or 4 tuners on the same footprint (est)", conf: med}
    - {id: cb-sw, kind: software, gain: "A path to software radio without losing broadcast quality", how: "Raw-sample output lets a central computer add features later; OTA updates on the node", measure: "not stated", conf: low}
  gives_up:
    - "A network link and power supply at the antenna, and a module that survives roof temperatures"
    - "Head-unit makers lose the radio from their box; the Tier-1 relationship may shift to the antenna supplier"

position:
  advantages:
    - {id: a-split, text: "Split architecture: the radio can sit at the antenna, in the head unit or hand samples to a central computer", vs: "NXP, ST", conf: high}
    - {id: a-scale, text: "One compatible family scales from 1 to 4+ tuners on the same board design (pin, package and API compatible)", vs: "NXP, ST", conf: high}
    - {id: a-standards, text: "Broadest digital standards in one decoder family: HD, DAB/DAB+, DRM/DRM+, CDR; region by licence", vs: ST, conf: high}
    - {id: a-reception, text: "Reception features on chip: analog phase diversity, MRC, DAB noise canceller, digital AGC, fast band scan", vs: ST, conf: high}
    - {id: a-ecosystem, text: "Radio middleware supports us (OpenSynergy: Skyworks and NXP, not ST); R-Car software-radio reference since 2017", vs: ST, conf: high}
  disadvantages:
    - {id: d-cost, text: "Higher cost per chip: ST reuses mature designs; its tuners list at $4.60–6.10 vs ≈$8.40 for our Si47901", vs: ST, offset: "Compete on system cost: one node replaces 5–7 parts; one die for all variants", conf: low}
    - {id: d-chips, text: "More chips for the same radio: 3 parts for 4 tuners vs one NXP chip (SAF4000: 4 tuners since 2017; SAF9000: 5)", vs: NXP, offset: "RN4: 4 tuners + decoder in one part", conf: low}
    - {id: d-output, text: "Our own sample-output format (ZIF) vs ST's I2S, LVDS and JESD204B", vs: ST, offset: "Standard I2S/TDM mode now; samples over Ethernet on the node", conf: med}
    - {id: d-partners, text: "Weaker software-radio partnerships: Inntot (Visteon) is in ST's partner programme", vs: "ST, NXP", offset: "Partner listings and tested ports with Inntot, OpenSynergy, M's STYLE", conf: low}
    - {id: d-access, text: "Automotive kit and documents only under NDA through sales", vs: ST, offset: "Fast standard NDA / partner programme", conf: high}
    - {id: d-cdr, text: "China CDR decoders still Preview; no tuner lists CDR I/Q", vs: "NXP, Chinese SDR", offset: "Release CDR, confirm tuner support", conf: high}
    - {id: d-supply, text: "No public long-term supply statement; two ownership changes since 2021 (our judgement)", vs: "—", offset: "Publish a longevity commitment; roadmap briefings", conf: low}
  diff_good:
    - {id: g-amic, text: "AMIC: AM noise cancelling for EVs (SINAD 5 → 20 dB in lab tests); NXP only answered in Jul 2026, nothing found for ST", conf: high}
    - {id: g-pd, text: "Phase diversity in the tuner, so it works without software on the main processor", conf: high}
    - {id: g-flex, text: "Same parts serve decoded-audio and raw-sample designs: buyers don't have to choose an architecture early", conf: med}
  diff_bad:
    - {id: b-audio, text: "No audio or AI processing in the radio (NXP SAF9800 has HiFi 5 + neural processing); a deliberate gap for zonal cars, but a loss in head-unit-only designs", conf: high}
    - {id: b-tuners, text: "At most 2 tuners per die", conf: high}
    - {id: b-old-dsp, text: "Older HiFi2-EP audio DSP on our audio tuners", conf: med}

architecture:
  columns: [Skyworks (split), NXP (all-in-one), ST (host-centric)]
  rows:
    - ["Built as", "Chained tuners + separate decoder", "Tuners, decoder, audio and MCU in one chip", "Tuners → main processor does decoding, PD, MRC"]
    - ["Where it sits", "Antenna, head unit or central computer", "Head unit (RF by coax)", "Tuner anywhere; decoding on the main processor"]
    - ["Scaling", "Add compatible tuner chips", "Fixed by the chip (4–5)", "Add tuners; processor load grows"]
    - ["Zonal fit", "Good: either split point", "Weak: duplicate audio DSP, RF must reach head unit", "Good for software radio only"]
  note: "From the BizDev block-diagram library (car radio tuner system; NXP connected radio; TI head unit with radio) and ST's public tuner material. Zonal platforms: GM 2028, VW/Rivian 2027, Stellantis 2027, BMW Neue Klasse (high)."

market_now:
  - {figure: "Light-vehicle production", value: "92.1 M (2026); radio systems sold 90–92 M a year, without much growth", source: "S&P Global Mobility, Mar 2026; owner, 25 Oct 2026", conf: high}
  - {figure: "By region (2025)", value: "China 34.5 M · Europe 17.2 M · US 10.2 M · India 6.5 M", source: "OICA 2026", conf: high}
  - {figure: "Radio content (tuners + digital radio demodulators), analyst reports", value: "$0.9–2.3 B (2024); growth as reported: 5.2 % a year (MRFR), 5.7 % (DataHorizzon), not used to project", source: "Analyst PRs (MRFR, DataHorizzon)", conf: low}
  - {figure: "Total radio market at current BOM content (tuner, radio and adjacent content)", value: "Bottom-up from our price estimates, today's mix, no growth: see below (Not Enough Data until the needed prices are entered)", source: "BizDev price model; owner (vehicles)", conf: low, live: total}
  - {figure: "Open discrepancy", value: "MarketIntelo: digital radio tuners alone $1.8 B (2025), above the owner's whole tuner-content cross-check ($0.45–0.92 B a year); likely a different definition (modules, aftermarket or non-automotive); not used", source: "MarketIntelo (snippet); owner, 25 Oct 2026", conf: low}
  - {figure: "Driver: standardization", value: "EU: car radios in new cars must receive digital radio (EECC, from Dec 2020); DAB+ in almost all new EU cars (95 % in 2021). HD Radio in >60 % of new US cars (voluntary). DRM in 1 in 3 Indian cars. China's CDR / DRM mandate drafted, not adopted", source: "WorldDAB 2018, 2026; Radio World, Sep 2026; DRM Consortium, Oct 2025; Radio World, Sep 2024", conf: med}
  - {figure: "Driver: electrification", value: "EV motors and chargers swamp AM: Ford dropped AM, then reversed; Tesla 2026 Standard trims have no AM / FM. The US AM for Every Vehicle Act passed the House on 16 Sep 2026 (a bill, not law). AM noise cancelling (our AMIC, NXP EVAM-lite) keeps AM usable", source: "PBS NewsHour / AP, 16 Sep 2026; TechCrunch, KTVU (snippets); NXP, Jul 2026", conf: med}
  - {figure: "Driver: integration", value: "Tuners and demodulator on one chip (NXP SAF4000: 4 tuners since 2017; SAF9000: 5); remote tuner modules at the antenna; software radio (tuner + processor only) >2 M deployed (Inntot / Visteon, Jun 2026); cockpit computers 23 M = 26 % of 2025 cars", source: "NXP; The Machine Maker; WorldDAB; Berg Insight (analyst PR); owner, 23 Oct 2026", conf: med}
  - {figure: "Public list prices", value: "Tuners $4.60–10; decoders $16–19", source: "Distributor snippets", conf: low}

outlook:
  - {id: o-volume, text: "Radios per year stay about flat at 90–92 M (owner, 25 Oct 2026), so growth comes from content per car, not volume", basis: "Owner, 25 Oct 2026; S&P forecasts 97.2 M light vehicles in 2030", conf: med}
  - {id: o-content, text: "Content per car grows as the mix moves to digital radio (EU rule today; China's mandate and India's choice by 2030); one content-driven growth rate projects the market (est)", basis: "Bottom-up from our price estimates in the market section; vehicles flat at 90–92 M a year (owner)", conf: low}
  - {id: o-hd, text: "HD Radio reaches about 65–70 % of new US cars by 2030 (est)", basis: "35 % (2014) → >60 % (2026), about +2 points a year", conf: low}
  - {id: o-sdr, text: "Software radio reaches about 3–5 M new cars a year by 2030, 3–5 % of production (est)", basis: "0.5 M → 2 M cumulative in 2 years + 5 M in implementation; cockpit computers to 49.5 M", conf: low}
  - {id: o-rtm, text: "Remote tuner modules stay a premium/multi-region niche of about 2–5 M a year by 2030 (est)", basis: "Zonal platforms from 2027–28; no public module volumes", conf: low}
  - {id: o-china, text: "If China's mandate is adopted (from about 2028), DRM/CDR receivers could reach most of its ~32 M cars a year (est)", basis: "Mandatory standard drafted since Sep 2024; Greater China 32.6 M (2026)", conf: low}
  - {id: o-decoder, text: "Decoder chips stay common to 2030, but their share declines as software radio and sample-mode modules grow (est)", basis: "Teardowns still show radio chips; Visteon: most radios still use decoders", conf: med}

features:
  - {id: f-node, feature: "Radio node: 4 tuners + decoder in one part", benefit: "Answers NXP's one-chip radio at the antenna; 1 part instead of 5–7", distance: 2, why: "Step 1 puts existing dies in one package; step 2 (one die) is distance 3"}
  - {id: f-net, feature: "Car-network output (A²B-ready audio/data, Ethernet MAC)", benefit: "Removes the bridge MCU in modules; fits zonal wiring", distance: 3, why: "Ethernet MAC is standard IP but new to our radio line"}
  - {id: f-samples, feature: "Raw-sample mode over the network for central software radio", benefit: "Same part wins software-radio designs", distance: 3, why: "Firmware plus the network output"}
  - {id: f-i2s, feature: "Standard I2S/TDM framing of today's sample output", benefit: "Easier connection to cockpit processors now", distance: 1, why: "Firmware/framing on existing pins"}
  - {id: f-amic, feature: "AMIC on every single tuner", benefit: "EV AM noise answer across the whole family", distance: 1, why: "Already runs on single tuners Si4798x/Si47992; DSP headroom on Si4790x not stated"}
  - {id: f-amic-sw, feature: "AMIC as software for central radios", benefit: "Earns on platforms that use other tuners", distance: 2, why: "Port to a new processor and validation"}
  - {id: f-cdr, feature: "CDR in production, with tuner support confirmed", benefit: "Ready for China's mandate", distance: 1, why: "Release and qualification; tuner CDR support to confirm"}
  - {id: f-ref, feature: "Remote tuner module reference design (today's parts)", benefit: "Wins module design-ins before the node", distance: 2, why: "Board, firmware, partner link chip"}
  - {id: f-grade, feature: "Higher temperature grade for roof mounting", benefit: "Opens antenna-module placement", distance: 3, why: "Requirement unknown; may need design changes"}
  - {id: f-lband, feature: "L-band on a dual tuner", benefit: "Matches ST STA710", distance: 3, why: "Port Si47912's L-band block; little-used band"}
  - {id: f-jesd, feature: "JESD204B output", benefit: "Matches ST", distance: 4, why: "High-speed SerDes never used in our radio line; no evidence customers need it"}
  - {id: f-audio, feature: "Audio DSP / AI in the radio", benefit: "Matches NXP SAF9800", distance: 4, why: "New DSP/NPU; not recommended (moves to central computer)"}

product:
  name: "Radio node RN4 / RN2"
  spec:
    - ["Tuners / decode channels", "RN4: 4 / 4 · RN2: 2 / 2"]
    - ["Bands", "AM, FM, LW, SW, weather band, DAB Band III (L-band optional)"]
    - ["Standards", "HD Radio, DAB/DAB+/DMB, DRM30/DRM+, CDR; region by licence"]
    - ["Features", "Phase diversity, MRC, AMIC, DAB noise canceller, seamless linking (broadcast/IP), OTA updates"]
    - ["Outputs", "Decoded audio + data (I2S/TDM, A²B-ready) and Ethernet MAC; or raw samples over Ethernet"]
    - ["Reuses", "Si4796x tuner cores, Si469xx decoder, one 36.864 MHz clock and one boot flash"]
    - ["Replaces", "2 × Si4796x + Si469xx + bridge MCU + clock + flash at the antenna"]
    - ["Delivery (est)", "Step 1 one package: 12–18 months · Step 2 one die: 2–3 years"]

prices:
  method: "Anchor on public list prices (low confidence) → value of what the part replaces → volume range. Assumption: automotive contract prices are 30–50 % below these reel-quantity list prices. Enter real ASPs to replace the estimates."
  anchors:
    - {part: "ST STA709 (single digital-output tuner)", price: "$4.62–4.93", qty: "1,560–3,000"}
    - {part: "ST TDA7707 (dual tuner)", price: "$6.14", qty: "3,000 reel"}
    - {part: "Skyworks Si47901 (single tuner)", price: "≈ $8.40", qty: "2,500 reel"}
    - {part: "NXP TEF6686 (single tuner)", price: "$8.03–10.15", qty: "10 k / 1 (broker)"}
    - {part: "ST STA680 · Skyworks Si4699 (decoders)", price: "$18.70 · $18.06", qty: "500 · n/s"}
  items:
    - {id: p-rn4, item: "RN4 (4 tuners + 4 channels)", entry: 16.0, target: 17.5, premium: 19.0, basis: "Replaces ≈$22–29 of today's parts (2 duals + 4-channel decoder + bridge, clock, flash)"}
    - {id: p-rn2, item: "RN2 (2 tuners + 2 channels)", entry: 10.0, target: 11.0, premium: 12.0, basis: "Replaces ≈$14–18; must stay near an ST tuner + decoder pair"}
    - {id: p-amic, item: "AMIC licence", entry: 0.25, target: 0.5, premium: 0.75, basis: "No public anchor: 5–10 % of a single-tuner price"}

volumes:
  - {label: "RN4, 2 M a year (premium modules)", units: 2000000, price: p-rn4}
  - {label: "RN4, 5 M a year (module niche grows)", units: 5000000, price: p-rn4}
  - {label: "RN2, 5 M a year (mainstream modules)", units: 5000000, price: p-rn2}

attach:
  - {id: t-ref, lever: "Module reference design with antenna makers, pre-validated and homologated", effort: med}
  - {id: t-partners, lever: "Partner listings and tested ports: Inntot/Visteon, OpenSynergy, M's STYLE", effort: low}
  - {id: t-access, lever: "Fast standard NDA / partner programme with documents, drivers and kits", effort: low}
  - {id: t-cert, lever: "Pre-tested HD Radio, DAB, DRM and EV-noise results in the reference design", effort: med}
  - {id: t-api, lever: "Keep the common Si479xx/Si46xx programming interface on the node", effort: low}
  - {id: t-licence, lever: "One licence price list (HD per channel, MRC, AMIC) and a longevity commitment", effort: low}
  - {id: t-bundle, lever: "Bundle our clocks, power and antenna RF parts into the reference design", effort: low}

risks:
  - "Can tuner and decoder circuits share one die? Step 1 (one package) avoids the question."
  - "Network output: A²B, Ethernet or both, and which Ethernet speed."
  - "No public remote-tuner-module volumes; if radio stays in the head unit, NXP's one-chip radio wins there."
  - "Cannibalises today's tuner + decoder sets in modules."
  - "Unknown from public data: RF performance, power and die cost versus ST and NXP; contract prices."

questions:
  bu:
    - {id: q-bu-process, text: "Can the Si479xx tuner and Si469xx decoder circuits share one process and die, or is step 1 (one package) the only near-term route?", why: "Decides step 2 timing and die cost"}
    - {id: q-bu-cost, text: "What are today's die costs and contract ASPs for Si4796x and Si469xx, and where do we stand against ST's TDA7707 / STA709?", why: "The node competes on system cost; we need our real cost position"}
    - {id: q-bu-cdr, text: "Which tuners are qualified for CDR I/Q, and when do Si46933/Si46943 leave Preview?", why: "China mandate; our data lists no CDR tuner"}
    - {id: q-bu-perf, text: "How do our tuners compare with NXP and ST on sensitivity, selectivity, strong-signal handling and power?", why: "Not in public data; decides whether reception quality is a selling point"}
    - {id: q-bu-roadmap, text: "Is anything like a radio node, an Ethernet output or a quad tuner already on the internal roadmap?", why: "Avoid proposing what exists or was rejected"}
  customer:
    - {id: q-c-rtm, text: "Will your next platform move the radio out of the head unit into a remote tuner or roof module, and from which model year?", who: "OEM E/E architecture team", why: "Sets the volume of the radio node"}
    - {id: q-c-link, text: "Which link do you want from the antenna module: A²B, automotive Ethernet (which speed), or coax?", who: "OEM / Tier-1 antenna module team", why: "Decides the node's network output"}
    - {id: q-c-sdr, text: "Will decoding run in your cockpit processor (software radio) or stay in a decoder chip?", who: "Tier-1 infotainment team", why: "Decoded mode vs sample mode"}
    - {id: q-c-grade, text: "What temperature grade do you need at the roof or rear-window position?", who: "Tier-1 antenna module team", why: "Grade 2 vs Grade 1 changes the design"}
    - {id: q-c-price, text: "What do you pay today for tuners + decoder + bridge in a remote module, and what price would make one part worth a redesign?", who: "Tier-1 purchasing", why: "Validates the $16–19 target"}

