# One line per section on what it means for the decision (Bottom line in reports.yaml)
thread:
  benefit: Digital audio instead of coax pays only if the radio leaves the head unit; confirm that first.
  position: The split architecture is our advantage; cost per chip against ST and chip count against NXP are what the
    node must fix.
  market: Radios are flat at 90–92 M a year (owner), so only content per car grows (digital-radio rules, AM in EVs,
    integration); the total at current BOM content needs our prices entered first.
  outlook: Remote modules stay a niche of about 2–5 M a year (est), so start with one package, not a new die.
  features: AMIC on every tuner and CDR in production (distance 1) help today's sales; the node itself is distance 2–3.
  product: RN2 and RN4 are defined; the network output (A²B or Ethernet) is the spec to settle with customers.
  asp: The $10–12 and $16–19 targets (est) need our real die cost; until then the price is a guess.
  attach: A reference module and tested software-radio ports make the node easier to design in than NXP's one chip.
  questions: The carmaker question on remote modules and the BU die-cost question are the needed-now items.
  risks: If the radio stays in the head unit, NXP's one-chip radio wins and the answer becomes no.
