load_switch:
  crowding: high
  vendors: [Texas Instruments, Infineon Technologies, STMicroelectronics, onsemi, Diodes Incorporated, Vishay, Toshiba, Rohm, Analog Devices, NXP Semiconductors, Monolithic Power Systems]
