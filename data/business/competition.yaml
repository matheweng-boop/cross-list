led_driver:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, onsemi, STMicroelectronics, NXP Semiconductors, Monolithic Power Systems, Diodes Incorporated, Microchip Technology, Rohm, Melexis, Elmos Semiconductor]
