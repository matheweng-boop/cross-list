# Indicative competitive landscape per function: established suppliers from public catalogues (not market share).
# crowding: low (<= 3 established suppliers), medium (4-7), high (8+). Skyworks and Qorvo are not listed.
active_antenna_amp:
  crowding: low
  vendors: [NXP Semiconductors, Infineon Technologies, Nexperia]
  note: >-
    Automotive niche, often built from discrete RF transistors; few dedicated IC suppliers.
adc:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, Renesas Electronics, Asahi Kasei Microdevices, Cirrus Logic, Teledyne e2v]
  note: >-
    Broad-line analog leaders dominate; precision and high-speed segments have high design-in barriers.
am_fm_tuner:
  crowding: low
  vendors: [NXP Semiconductors, STMicroelectronics]
  note: >-
    Concentrated automotive market with very few remaining tuner suppliers.
amplifier:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, STMicroelectronics, onsemi, Microchip Technology, Renesas Electronics, Rohm, Diodes Incorporated, Nisshinbo Micro Devices, 3PEAK]
  note: >-
    Mature catalogue category with many pin-compatible second sources; largely price-driven.
antenna_switch:
  crowding: high
  vendors: [Murata (pSemi), Infineon Technologies, NXP Semiconductors, Qualcomm, Maxscend, Analog Devices, MACOM, Renesas Electronics]
  note: >-
    Many SOI switch suppliers; handset volumes are price-driven, with growing Chinese competition.
antenna_tuner:
  crowding: medium
  vendors: [Qualcomm, Murata (pSemi), Infineon Technologies, Maxscend]
  note: >-
    Handset-focused specialists; tied to platform reference designs.
audio_amp:
  crowding: high
  vendors: [Texas Instruments, Infineon Technologies, NXP Semiconductors, STMicroelectronics, Cirrus Logic, Analog Devices, Rohm, Diodes Incorporated, onsemi, Awinic]
  note: >-
    Crowded market spanning consumer and automotive; many second sources.
audio_codec:
  crowding: high
  vendors: [Cirrus Logic, Texas Instruments, Analog Devices, Asahi Kasei Microdevices, Realtek, Nuvoton, Renesas Electronics, Everest Semiconductor]
  note: >-
    Established specialists plus PC/consumer volume players; differentiation on performance and DSP features.
battery_charger:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, STMicroelectronics, Renesas Electronics, onsemi, Monolithic Power Systems, Richtek, Southchip, NXP Semiconductors]
  note: >-
    Crowded, price-driven consumer segment with many Asian entrants.
beamformer_ic:
  crowding: low
  vendors: [Analog Devices, Renesas Electronics, Sivers Semiconductors]
  note: >-
    Few specialists after consolidation; high design barrier at mmWave.
bt_fem:
  crowding: low
  vendors: [Nordic Semiconductor, Texas Instruments]
  note: >-
    Small niche; range-extender front ends mostly offered alongside SoC vendors' platforms.
buck_boost:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Renesas Electronics, Microchip Technology, Monolithic Power Systems, STMicroelectronics, onsemi, Richtek]
  note: >-
    Well-served power category; many alternatives with differing feature sets.
can_transceiver:
  crowding: high
  vendors: [NXP Semiconductors, Texas Instruments, Infineon Technologies, Microchip Technology, onsemi, STMicroelectronics, Analog Devices, Novosense]
  note: >-
    Commodity automotive interface with many pin-compatible second sources.
cc_regulator:
  crowding: medium
  vendors: [onsemi, Diodes Incorporated, Infineon Technologies, Nexperia]
  note: >-
    Simple low-cost devices; discrete-style suppliers compete on price.
circulator_isolator:
  crowding: medium
  vendors: [Smiths Interconnect, JQL Technologies, UIY Technology, Ditom Microwave]
  note: >-
    Fragmented market of specialist ferrite houses; often custom per band.
clock_buffer:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Analog Devices, Microchip Technology, onsemi, Diodes Incorporated]
  note: >-
    Established timing suppliers; fanout buffers have multiple pin-compatible sources.
clock_generator:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Analog Devices, Microchip Technology, SiTime, onsemi, Diodes Incorporated]
  note: >-
    Moderately concentrated; programmability and jitter performance drive selection.
crystal_oscillator:
  crowding: high
  vendors: [Seiko Epson, Nihon Dempa Kogyo (NDK), Kyocera, TXC, SiTime, Murata, Daishinku (KDS), Microchip Technology, Rakon, Abracon, CTS]
  note: >-
    Highly crowded, commodity frequency-control market with many second sources.
current_sensor:
  crowding: high
  vendors: [Allegro MicroSystems, Melexis, Infineon Technologies, Texas Instruments, LEM, Asahi Kasei Microdevices, Novosense, Monolithic Power Systems]
  note: >-
    Many Hall-based suppliers; competition on accuracy, isolation rating and price.
digital_isolator:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, STMicroelectronics, onsemi, Novosense, Chipanalog, 2Pai Semiconductor]
  note: >-
    Established leaders plus fast-growing Chinese suppliers; increasingly price-competitive.
digital_radio_demod:
  crowding: low
  vendors: [NXP Semiconductors, STMicroelectronics, Frontier Silicon]
  note: >-
    Very few suppliers; tied to broadcast-standard licensing and automotive qualification.
diplexer:
  crowding: medium
  vendors: [Murata, TDK, Kyocera AVX, Taiyo Yuden, Johanson Technology, Mini-Circuits, Walsin Technology]
  note: >-
    Passive LTCC/ceramic suppliers; standard parts widely available, custom designs common.
diversity_rx_module:
  crowding: low
  vendors: [Qualcomm, Murata, Maxscend]
  note: >-
    Concentrated handset module market; high integration and platform barriers.
ethernet_phy:
  crowding: high
  vendors: [Marvell, Broadcom, Realtek, Texas Instruments, Microchip Technology, Analog Devices, NXP Semiconductors, Motorcomm, MaxLinear, Infineon Technologies]
  note: >-
    Crowded market; automotive Ethernet adds qualification barriers but several suppliers compete.
filter_saw_baw:
  crowding: high
  vendors: [Murata, Broadcom, Qualcomm, TDK, Taiyo Yuden, Kyocera, WISOL, Shoulder Electronics]
  note: >-
    SAW is crowded and price-driven; BAW at higher bands is held by few players.
gate_driver:
  crowding: high
  vendors: [Infineon Technologies, Texas Instruments, Analog Devices, STMicroelectronics, onsemi, Broadcom, Rohm, Power Integrations, NXP Semiconductors, Toshiba, Novosense]
  note: >-
    Crowded, driven by EV and industrial power; differentiation on isolation and protection features.
gnss_lna:
  crowding: medium
  vendors: [Infineon Technologies, NXP Semiconductors, Analog Devices, Maxscend]
  note: >-
    Small, mature category with a handful of RF suppliers.
half_bridge_driver:
  crowding: high
  vendors: [Infineon Technologies, Texas Instruments, STMicroelectronics, onsemi, Analog Devices, Microchip Technology, Diodes Incorporated, Monolithic Power Systems, Rohm, Renesas Electronics]
  note: >-
    Commodity driver category with many second sources.
hv_flyback:
  crowding: high
  vendors: [Power Integrations, Infineon Technologies, onsemi, STMicroelectronics, Texas Instruments, Analog Devices, Navitas Semiconductor, Rohm]
  note: >-
    Crowded offline power market; strong price pressure in adapters and auxiliary supplies.
io_expander:
  crowding: medium
  vendors: [Texas Instruments, NXP Semiconductors, Microchip Technology, Diodes Incorporated, Analog Devices, Semtech]
  note: >-
    Mature, low-cost logic category; industry-standard pinouts aid second sourcing.
isolated_amplifier:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Broadcom, Novosense]
  note: >-
    Few established suppliers; accuracy and isolation certification create barriers.
isolated_can:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Novosense, Chipanalog]
  note: >-
    Niche industrial/automotive interface; small supplier base growing with Chinese entrants.
isolated_dcdc:
  crowding: high
  vendors: [Murata Power Solutions, RECOM, TRACO Power, XP Power, Mornsun, Texas Instruments, Analog Devices, Vicor, Delta Electronics]
  note: >-
    Crowded module market with many interchangeable footprints; price-driven.
isolated_switch_driver:
  crowding: medium
  vendors: [Texas Instruments, Infineon Technologies, Toshiba, Vishay]
  note: >-
    Small set of suppliers; mix of integrated isolators and photovoltaic drivers.
jitter_attenuator:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Analog Devices, Microchip Technology, SiTime]
  note: >-
    Few high-performance timing specialists; high barrier on jitter performance.
ldo_tracker:
  crowding: medium
  vendors: [Infineon Technologies, Texas Instruments, STMicroelectronics, onsemi]
  note: >-
    Automotive sensor-supply niche with a handful of qualified suppliers.
led_driver:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, onsemi, STMicroelectronics, NXP Semiconductors, Monolithic Power Systems, Diodes Incorporated, Microchip Technology, Rohm, Melexis, Elmos Semiconductor]
  note: >-
    Highly crowded across lighting, display and automotive; strong price competition.
lna:
  crowding: high
  vendors: [Infineon Technologies, NXP Semiconductors, Analog Devices, MACOM, Mini-Circuits, Maxscend, Renesas Electronics, Qualcomm]
  note: >-
    Many RF suppliers; catalogue LNAs widely second-sourced, handset LNAs integrated into modules.
load_switch:
  crowding: high
  vendors: [Texas Instruments, Infineon Technologies, STMicroelectronics, onsemi, Diodes Incorporated, Vishay, Toshiba, Rohm, Analog Devices, NXP Semiconductors, Monolithic Power Systems]
  note: >-
    Commodity power category with many pin-compatible alternatives.
motor_controller:
  crowding: medium
  vendors: [Infineon Technologies, Elmos Semiconductor, Melexis, Microchip Technology, NXP Semiconductors, Analog Devices]
  note: >-
    Integrated automotive motor SoCs from a handful of suppliers; software ecosystem creates lock-in.
multiphase:
  crowding: high
  vendors: [Infineon Technologies, Renesas Electronics, Monolithic Power Systems, Texas Instruments, Analog Devices, onsemi, Richtek, uPI Semiconductor]
  note: >-
    Competitive server/compute segment; tied to processor vendor qualification.
pa_module:
  crowding: medium
  vendors: [Qualcomm, Broadcom, Murata, Vanchip, Maxscend, Smarter Micro, Lansus Technologies]
  note: >-
    Concentrated among a few large module makers, with Chinese entrants in mid/low tiers.
pcie_buffer:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Diodes Incorporated, Microchip Technology, onsemi]
  note: >-
    Standards-based timing parts with several pin-compatible sources.
pcie_switch:
  crowding: medium
  vendors: [Broadcom, Microchip Technology, ASMedia Technology, Diodes Incorporated]
  note: >-
    Concentrated, high-barrier market led by two incumbents at high lane counts.
pmic:
  crowding: high
  vendors: [Qualcomm, Texas Instruments, Analog Devices, NXP Semiconductors, Renesas Electronics, STMicroelectronics, Infineon Technologies, MediaTek, Rohm, Richtek, Monolithic Power Systems]
  note: >-
    Crowded, but many PMICs are processor-specific, limiting drop-in substitution.
pol_buck:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, Monolithic Power Systems, Renesas Electronics, STMicroelectronics, onsemi, Vishay, Richtek, Alpha and Omega Semiconductor, Diodes Incorporated, Rohm]
  note: >-
    Highly crowded, price-driven power category with many second sources.
pol_ldo:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, onsemi, STMicroelectronics, Microchip Technology, Diodes Incorporated, Rohm, Torex, Nisshinbo Micro Devices, Infineon Technologies, Renesas Electronics, Toshiba]
  note: >-
    Commodity, price-driven category with many pin-compatible second sources.
position_interface:
  crowding: medium
  vendors: [Analog Devices, Texas Instruments, Tamagawa Seiki, Renesas Electronics]
  note: >-
    Niche resolver and inductive interface market with few specialist suppliers.
position_sensor:
  crowding: high
  vendors: [Allegro MicroSystems, Melexis, Infineon Technologies, TDK (Micronas), ams OSRAM, Renesas Electronics, Monolithic Power Systems, Asahi Kasei Microdevices, iC-Haus]
  note: >-
    Many magnetic and inductive sensor suppliers; automotive qualification is the main barrier.
power_amplifier:
  crowding: high
  vendors: [NXP Semiconductors, Ampleon, MACOM, Analog Devices, Mitsubishi Electric, Sumitomo Electric Device Innovations, Mini-Circuits, Guerrilla RF]
  note: >-
    Broad market split by frequency and power; LDMOS/GaN infrastructure held by fewer players.
power_loss_protection:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, STMicroelectronics, onsemi, Toshiba, Monolithic Power Systems, Diodes Incorporated, Alpha and Omega Semiconductor]
  note: >-
    eFuse category is crowded; integrated hold-up controllers come from fewer suppliers.
pre_regulator:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, STMicroelectronics, onsemi, Microchip Technology, Renesas Electronics, Monolithic Power Systems, Diodes Incorporated]
  note: >-
    Well-served power category; many controllers with similar topologies.
redriver:
  crowding: medium
  vendors: [Texas Instruments, Diodes Incorporated, Parade Technologies, NXP Semiconductors, Montage Technology]
  note: >-
    Standards-driven high-speed niche; a handful of established suppliers.
reverse_polarity:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, STMicroelectronics, onsemi, Diodes Incorporated]
  note: >-
    Established analog suppliers; automotive ideal-diode controllers have several alternatives.
rf_frontend:
  crowding: medium
  vendors: [Qualcomm, Murata, Broadcom, Maxscend, Vanchip, NXP Semiconductors, Infineon Technologies]
  note: >-
    Concentrated module market; integration and platform partnerships raise barriers.
rf_pa_bias:
  crowding: low
  vendors: [Analog Devices, MACOM]
  note: >-
    Small specialist niche; often implemented with discrete or custom circuits.
rf_predriver:
  crowding: medium
  vendors: [NXP Semiconductors, Analog Devices, MACOM, Mini-Circuits, Guerrilla RF, Renesas Electronics, Infineon Technologies]
  note: >-
    Several RF catalogue suppliers; gain blocks are fairly interchangeable.
rf_switch:
  crowding: high
  vendors: [Analog Devices, Murata (pSemi), MACOM, Infineon Technologies, NXP Semiconductors, Renesas Electronics, Mini-Circuits, Maxscend]
  note: >-
    Many SOI and GaAs switch suppliers; good second-source availability.
rs485_transceiver:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Renesas Electronics, MaxLinear, STMicroelectronics, Novosense, 3PEAK, Chipanalog]
  note: >-
    Commodity industrial interface with many pin-compatible second sources.
rtc:
  crowding: high
  vendors: [NXP Semiconductors, Microchip Technology, Analog Devices, STMicroelectronics, Seiko Epson, Micro Crystal, Renesas Electronics, Texas Instruments, Abracon]
  note: >-
    Mature, price-driven category with many suppliers.
sequencer:
  crowding: low
  vendors: [Analog Devices, Texas Instruments, Renesas Electronics]
  note: >-
    Few dedicated suppliers; often replaced by PMIC or FPGA-based sequencing.
serdes:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, THine Electronics, Rohm, Inova Semiconductors, Valens Semiconductor]
  note: >-
    Proprietary link ecosystems create lock-in; few interoperable alternatives.
single_chip_radio:
  crowding: low
  vendors: [UNISOC (RDA), Beken, KT Micro]
  note: >-
    Low-cost consumer niche served mainly by Asian suppliers.
supervisor:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, onsemi, STMicroelectronics, Renesas Electronics, Rohm, Torex, Diodes Incorporated, Nisshinbo Micro Devices]
  note: >-
    Commodity category with many industry-standard pin-compatible parts.
temperature_sensor:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, NXP Semiconductors, onsemi, STMicroelectronics, Sensirion, Renesas Electronics, Diodes Incorporated, Rohm]
  note: >-
    Crowded, price-driven market with many second sources.
termination_ldo:
  crowding: medium
  vendors: [Texas Instruments, Richtek, Diodes Incorporated, uPI Semiconductor, Anpec Electronics]
  note: >-
    Standard DDR termination function; several low-cost alternatives.
three_phase_gate_driver:
  crowding: high
  vendors: [Texas Instruments, Infineon Technologies, Analog Devices, STMicroelectronics, onsemi, Allegro MicroSystems, NXP Semiconductors, Microchip Technology]
  note: >-
    Well-served motor-drive category; automotive variants require qualification.
tvs_esd:
  crowding: high
  vendors: [Littelfuse, Nexperia, onsemi, STMicroelectronics, Vishay, Diodes Incorporated, Infineon Technologies, Bourns, Semtech, Texas Instruments, Rohm, Toshiba]
  note: >-
    Highly crowded, commodity protection market; price-driven.
uwb_fem:
  crowding: low
  vendors: []
  note: >-
    No established standalone supplier besides the reference companies; front ends are mostly integrated into UWB SoCs.
uwb_soc:
  crowding: medium
  vendors: [NXP Semiconductors, STMicroelectronics, Samsung Electronics, Spark Microsystems]
  note: >-
    Emerging market with few suppliers; ecosystem certification is a barrier.
v2x_fem:
  crowding: low
  vendors: []
  note: >-
    Small automotive niche with no well-known standalone supplier besides the reference companies.
voltage_reference:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, Renesas Electronics, STMicroelectronics, onsemi, Diodes Incorporated, Nisshinbo Micro Devices]
  note: >-
    Shunt references are commodity; precision series references from fewer specialists.
voltage_translator:
  crowding: high
  vendors: [Texas Instruments, Nexperia, NXP Semiconductors, Diodes Incorporated, onsemi, Analog Devices, Toshiba, STMicroelectronics]
  note: >-
    Commodity logic category with many pin-compatible second sources.
watchdog:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, Renesas Electronics, STMicroelectronics, Rohm, onsemi, Torex]
  note: >-
    Mature category, often combined with supervisors; many alternatives.
wide_vin_buck:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, Monolithic Power Systems, STMicroelectronics, onsemi, Microchip Technology, Renesas Electronics, Diodes Incorporated, Rohm, Richtek]
  note: >-
    Crowded industrial and automotive power category with many second sources.
wifi_fem:
  crowding: medium
  vendors: [Qualcomm, Broadcom, Murata, Richwave Technology, Maxscend, Vanchip, Kangxi Communication]
  note: >-
    Concentrated at the high end; Asian suppliers compete in cost-sensitive tiers.
