soc:
  crowding: high
  vendors: [Qualcomm, MediaTek, NXP Semiconductors, Texas Instruments, Samsung, Nvidia, Renesas Electronics, Unisoc, Rockchip, Ambarella, Allwinner Technology]
  note: >-
    Application processors from mobile, automotive and embedded leaders; software and leading-edge process access are barriers.
wifi_soc:
  crowding: high
  vendors: [Qualcomm, Broadcom, MediaTek, Espressif Systems, Infineon Technologies, Realtek, NXP Semiconductors, Silicon Labs, Texas Instruments, Synaptics]
  note: >-
    Leading-edge combo SoCs are concentrated; IoT Wi-Fi is crowded with low-cost Asian suppliers.
modem:
  crowding: medium
  vendors: [Qualcomm, MediaTek, Samsung, Unisoc, Sequans Communications, Nordic Semiconductor, Sony (Altair)]
  note: >-
    Smartphone modems concentrated in very few suppliers; cellular IoT adds a handful of specialists.
v2x_transceiver:
  crowding: low
  vendors: [Qualcomm, NXP Semiconductors]
  note: >-
    Concentrated automotive niche after consolidation; few chipset suppliers across C-V2X and 802.11p.
secure_element:
  crowding: medium
  vendors: [NXP Semiconductors, Infineon Technologies, STMicroelectronics, Microchip Technology, Samsung]
  note: >-
    Security certification and provisioning infrastructure create multi-year barriers; a few suppliers lead.
power_fets:
  crowding: high
  vendors: [Infineon Technologies, onsemi, STMicroelectronics, Vishay, Toshiba, Rohm, Nexperia, Alpha and Omega Semiconductor, Diodes Incorporated, Renesas Electronics, Wolfspeed, Microchip Technology]
  note: >-
    Volume power-discrete market with many suppliers; SiC and GaN segments are more concentrated.
ddr_flash:
  crowding: low
  vendors: [Samsung, SK hynix, Micron]
  note: >-
    Highly concentrated memory market led by a few vertically integrated manufacturers.
flash:
  crowding: high
  vendors: [Winbond, Macronix, Micron, GigaDevice, Infineon Technologies, Samsung, Kioxia, Sandisk, ISSI, Puya Semiconductor]
  note: >-
    Serial NOR is crowded with Asian suppliers; high-density NAND is concentrated among a few manufacturers.
vehicle_sensors:
  crowding: high
  vendors: [Infineon Technologies, Allegro MicroSystems, Bosch, NXP Semiconductors, Melexis, STMicroelectronics, TDK, Murata, Analog Devices, Texas Instruments]
  note: >-
    Spans inertial, pressure and magnetic sensing; long automotive qualification favours incumbents.
