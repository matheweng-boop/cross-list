# Indicative competitive landscape per function: established suppliers from public catalogues (not market share).
# crowding: low (<= 3 established suppliers), medium (4-7), high (8+). Skyworks and Qorvo are not listed.
active_antenna_amp:
  crowding: low
  vendors: [NXP Semiconductors, Infineon Technologies, Nexperia]
  note: >-
    Automotive niche, often built from discrete RF transistors; few dedicated IC suppliers.
adc:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, Renesas Electronics, Asahi Kasei Microdevices, Cirrus Logic, Teledyne e2v]
  note: >-
    Broad-line analog leaders dominate; precision and high-speed segments have high design-in barriers.
am_fm_tuner:
  crowding: low
  vendors: [NXP Semiconductors, STMicroelectronics]
  note: >-
    Concentrated automotive market with very few remaining tuner suppliers.
amplifier:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, STMicroelectronics, onsemi, Microchip Technology, Renesas Electronics, Rohm, Diodes Incorporated, Nisshinbo Micro Devices, 3PEAK]
  note: >-
    Mature catalogue category with many pin-compatible second sources; largely price-driven.
antenna_switch:
  crowding: high
  vendors: [Murata (pSemi), Infineon Technologies, NXP Semiconductors, Qualcomm, Maxscend, Analog Devices, MACOM, Renesas Electronics]
  note: >-
    Many SOI switch suppliers; handset volumes are price-driven, with growing Chinese competition.
antenna_tuner:
  crowding: medium
  vendors: [Qualcomm, Murata (pSemi), Infineon Technologies, Maxscend]
  note: >-
    Handset-focused specialists; tied to platform reference designs.
audio_amp:
  crowding: high
  vendors: [Texas Instruments, Infineon Technologies, NXP Semiconductors, STMicroelectronics, Cirrus Logic, Analog Devices, Rohm, Diodes Incorporated, onsemi, Awinic]
  note: >-
    Crowded market spanning consumer and automotive; many second sources.
audio_codec:
  crowding: high
  vendors: [Cirrus Logic, Texas Instruments, Analog Devices, Asahi Kasei Microdevices, Realtek, Nuvoton, Renesas Electronics, Everest Semiconductor]
  note: >-
    Established specialists plus PC/consumer volume players; differentiation on performance and DSP features.
battery_charger:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Microchip Technology, STMicroelectronics, Renesas Electronics, onsemi, Monolithic Power Systems, Richtek, Southchip, NXP Semiconductors]
  note: >-
    Crowded, price-driven consumer segment with many Asian entrants.
beamformer_ic:
  crowding: low
  vendors: [Analog Devices, Renesas Electronics, Sivers Semiconductors]
  note: >-
    Few specialists after consolidation; high design barrier at mmWave.
bt_fem:
  crowding: low
  vendors: [Nordic Semiconductor, Texas Instruments]
  note: >-
    Small niche; range-extender front ends mostly offered alongside SoC vendors' platforms.
buck_boost:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Renesas Electronics, Microchip Technology, Monolithic Power Systems, STMicroelectronics, onsemi, Richtek]
  note: >-
    Well-served power category; many alternatives with differing feature sets.
can_transceiver:
  crowding: high
  vendors: [NXP Semiconductors, Texas Instruments, Infineon Technologies, Microchip Technology, onsemi, STMicroelectronics, Analog Devices, Novosense]
  note: >-
    Commodity automotive interface with many pin-compatible second sources.
cc_regulator:
  crowding: medium
  vendors: [onsemi, Diodes Incorporated, Infineon Technologies, Nexperia]
  note: >-
    Simple low-cost devices; discrete-style suppliers compete on price.
circulator_isolator:
  crowding: medium
  vendors: [Smiths Interconnect, JQL Technologies, UIY Technology, Ditom Microwave]
  note: >-
    Fragmented market of specialist ferrite houses; often custom per band.
clock_buffer:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Analog Devices, Microchip Technology, onsemi, Diodes Incorporated]
  note: >-
    Established timing suppliers; fanout buffers have multiple pin-compatible sources.
clock_generator:
  crowding: medium
  vendors: [Renesas Electronics, Texas Instruments, Analog Devices, Microchip Technology, SiTime, onsemi, Diodes Incorporated]
  note: >-
    Moderately concentrated; programmability and jitter performance drive selection.
crystal_oscillator:
  crowding: high
  vendors: [Seiko Epson, Nihon Dempa Kogyo (NDK), Kyocera, TXC, SiTime, Murata, Daishinku (KDS), Microchip Technology, Rakon, Abracon, CTS]
  note: >-
    Highly crowded, commodity frequency-control market with many second sources.
current_sensor:
  crowding: high
  vendors: [Allegro MicroSystems, Melexis, Infineon Technologies, Texas Instruments, LEM, Asahi Kasei Microdevices, Novosense, Monolithic Power Systems]
  note: >-
    Many Hall-based suppliers; competition on accuracy, isolation rating and price.
digital_isolator:
  crowding: high
  vendors: [Texas Instruments, Analog Devices, Infineon Technologies, STMicroelectronics, onsemi, Novosense, Chipanalog, 2Pai Semiconductor]
  note: >-
    Established leaders plus fast-growing Chinese suppliers; increasingly price-competitive.
digital_radio_demod:
  crowding: low
  vendors: [NXP Semiconductors, STMicroelectronics, Frontier Silicon]
  note: >-
    Very few suppliers; tied to broadcast-standard licensing and automotive qualification.
diplexer:
  crowding: medium
  vendors: [Murata, TDK, Kyocera AVX, Taiyo Yuden, Johanson Technology, Mini-Circuits, Walsin Technology]
  note: >-
    Passive LTCC/ceramic suppliers; standard parts widely available, custom designs common.
diversity_rx_module:
  crowding: low
  vendors: [Qualcomm, Murata, Maxscend]
  note: >-
    Concentrated handset module market; high integration and platform barriers.
ethernet_phy:
  crowding: high
  vendors: [Marvell, Broadcom, Realtek, Texas Instruments, Microchip Technology, Analog Devices, NXP Semiconductors, Motorcomm, MaxLinear, Infineon Technologies]
  note: >-
    Crowded market; automotive Ethernet adds qualification barriers but several suppliers compete.
filter_saw_baw:
  crowding: high
  vendors: [Murata, Broadcom, Qualcomm, TDK, Taiyo Yuden, Kyocera, WISOL, Shoulder Electronics]
  note: >-
    SAW is crowded and price-driven; BAW at higher bands is held by few players.
gate_driver:
  crowding: high
  vendors: [Infineon Technologies, Texas Instruments, Analog Devices, STMicroelectronics, onsemi, Broadcom, Rohm, Power Integrations, NXP Semiconductors, Toshiba, Novosense]
  note: >-
    Crowded, driven by EV and industrial power; differentiation on isolation and protection features.
gnss_lna:
  crowding: medium
  vendors: [Infineon Technologies, NXP Semiconductors, Analog Devices, Maxscend]
  note: >-
    Small, mature category with a handful of RF suppliers.
half_bridge_driver:
  crowding: high
  vendors: [Infineon Technologies, Texas Instruments, STMicroelectronics, onsemi, Analog Devices, Microchip Technology, Diodes Incorporated, Monolithic Power Systems, Rohm, Renesas Electronics]
  note: >-
    Commodity driver category with many second sources.
hv_flyback:
  crowding: high
  vendors: [Power Integrations, Infineon Technologies, onsemi, STMicroelectronics, Texas Instruments, Analog Devices, Navitas Semiconductor, Rohm]
  note: >-
    Crowded offline power market; strong price pressure in adapters and auxiliary supplies.
io_expander:
  crowding: medium
  vendors: [Texas Instruments, NXP Semiconductors, Microchip Technology, Diodes Incorporated, Analog Devices, Semtech]
  note: >-
    Mature, low-cost logic category; industry-standard pinouts aid second sourcing.
isolated_amplifier:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Broadcom, Novosense]
  note: >-
    Few established suppliers; accuracy and isolation certification create barriers.
isolated_can:
  crowding: medium
  vendors: [Texas Instruments, Analog Devices, Novosense, Chipanalog]
