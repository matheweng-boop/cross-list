# One competitor profile per file: data/business/competitors/<slug>.yaml (files starting with "_" are skipped).
# Public sources only (annual reports, results releases, investor pages, the company's own website); every figure
# carries its source and date; "approx." where sources disagree. Nothing internal or confidential.
#
# name: Company name                       (required)
# ticker: "NASDAQ: XXXX"                    (optional)
# hq: City, country
# updated: YYYY-MM-DD                       (date the profile was last checked)
# summary: What the company does, in two or three plain sentences.        (required)
# model: Fabless / own fabs / mixed, and who makes what
# figures:                                  (required: at least revenue)
#   - {label: Revenue FY2025, value: "$326.7 M (+61 %)", source: "...", date: YYYY-MM-DD, conf: high|med|low}
# products:                                 main product lines
#   - {name: ..., what: ...}
# markets:                                  end markets as the company reports them
#   - {name: ..., share: "57 % (Q4 2025)", note: ...}
# strengths: [plain sentences]
# weaknesses: [plain sentences]
# overlap:                                  where they meet Skyworks and Qorvo
#   - {area: ..., skyworks: "...", qorvo: "...", level: direct|partial|none, link: /path (optional)}
# moves: [recent acquisitions, launches, partnerships; with the date]
# for_bizdev: [what this means for us, plain sentences]
# sources: ["https://... - what it is"]
