moves:
  - "8 Dec 2025: second listing in Hong Kong (HKEX: 2676) at HK$116 a share, raising about HK$2.2 B for R&D, new products, overseas growth and acquisitions."
  - "2024: bought Shanghai Maxic Microelectronics (magnetic sensors) outright."
  - "2026: new-generation digital isolators in volume; SiC isolated drivers shipping for on-board chargers, chargers and solar; second-generation functional-safety drivers won designs."
  - "Mar 2026: board asks for a mandate to buy back up to 10 % of its Hong Kong shares."
for_bizdev:
  - "Novosense is a true competitor for our whole isolation line, not a niche player: same capacitive technology, comparable data sheets, lower prices and home advantage in China's EV and solar market."
  - "We will not win on price against Novosense, TI and Diodes. Win on what they lack: decades of automotive and industrial field record, global support, supply outside China (a second source for Western and Japanese customers who want one), and data sheet points where we are ahead."
  - "Every Novosense part is crossed on this site: use the crosses to show customers a drop-in Skyworks part, and check the owner's verification notes (UVLO options, typical vs maximum values) before quoting."
  - "Watch its moves outside China (Europe, Japan, Korea), its automotive functional-safety drivers and its cash burn: fast growth on negative cash flow means price pressure now, but also a company that depends on capital markets (see the financial section)."
  - "See the Risks page: low-cost capacitive isolation is the first isolation risk."
