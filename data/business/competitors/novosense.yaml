    value: "Listed in Shanghai (STAR Market, since Apr 2022) and Hong Kong (since Dec 2025). Private, not state-owned: the founders Wang Shengyang, Sheng Yun and Wang Yifan act together and hold about 31 % of the votes as the largest shareholder group. Before listing, investment funds of Huawei and Xiaomi bought in (strategic investors)."
    source: "36Kr on the Hong Kong listing documents and on the 2022 STAR Market IPO"
    date: 2025-12-08
  supplier_verdict:
    longevity: solid
    supply: watch
    text:
      - "Likely to stay: fast-growing (revenue up about 70 % a year), backed by two stock markets, by Huawei and Xiaomi funds and by China's push to buy local chips; it returned to profit in 2026."
      - "R&D is high and rising (about RMB 795 M, 24 % of revenue in 2025), so the product line will keep widening and catching up."
      - "The weak point is cash: operating cash flow has been strongly negative and bank loans rose in 2026, so growth is funded by the listing money and loans. A long price war or a closed capital market would hurt (est.)."
      - "As a supplier: fabless with outside wafer and assembly partners, paying deposits to secure capacity, which helps supply in a tight market. For customers outside China, export controls, tariffs and 'China for China' sourcing rules are the main supply risks (est.)."
      - "For us: expect Novosense to keep cutting prices to fill capacity; customers who need a non-Chinese second source are our best opening."
