name: Novosense
ticker: "SSE STAR Market: 688052 · HKEX: 2676"
hq: Suzhou, China
updated: 2026-10-23
summary: >-
  Suzhou Novosense Microelectronics designs analog and mixed-signal chips: digital isolators, isolated gate drivers,
  isolated amplifiers and interfaces, sensors (magnetic, pressure, temperature) and automotive power and driver
  chips. Founded in 2013, it is one of China's leading isolation suppliers and grows fast in electric cars, solar and
  storage, and industrial power, with more than 3,900 parts on sale.
model: >-
  Fabless. Wafers and almost all packaging and test are made by outside suppliers; a small share of packaging and
  test is done by its own subsidiary. Isolation uses capacitive (silicon-dioxide) barriers, the same principle as TI
  and our own Si86 isolators.
figures:
  - {label: Revenue 2025, value: "RMB 3,367.8 M (approx. $470 M at 7.2 RMB/$) (+71.8 %)", source: "Novosense 2025 annual report summary, Shanghai Securities News, 31 Mar 2026", date: 2026-03-31, conf: high}
  - {label: Revenue first half 2026, value: "RMB 2,540 M (+66.7 %); net profit RMB 67.6 M, the first profitable half-year since 2022", source: "Novosense 2026 half-year report as reported by Gasgoo (28 Aug 2026) and Tencent News", date: 2026-08-28, conf: high}
  - {label: Revenue by product (H1 2026), value: "Signal chain (isolation, interface, amplifiers) RMB 1,011 M; power (gate drivers, supplies, motor and LED drivers) RMB 879 M; sensors RMB 643 M", source: "Gasgoo, 28 Aug 2026, from the half-year report", date: 2026-08-28, conf: high}
  - {label: Employees, value: "1,228 at 30 Jun 2025, of whom 588 (48 %) in R&D", source: "Yicai / Cailian reports on the 2025 half-year report", date: 2025-08-19, conf: med}
