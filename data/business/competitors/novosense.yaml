  - {label: Product count, value: "More than 3,900 parts on sale", source: "Novosense 2025 annual report summary", date: 2026-03-31, conf: high}
products:
  - {name: Digital isolators, what: "NSi8xxx families (e.g. NSi812x, NSi821x), 1 to 6 channels, basic and reinforced, up to about 150 kV/µs CMTI; isolated CAN, RS-485, I²C and SPI"}
  - {name: Isolated gate drivers, what: "NSi66xx single and half-bridge drivers for IGBT, SiC and GaN, including smart drivers with desaturation protection and functional-safety (SafeNovo) drivers for traction inverters"}
  - {name: Isolated amplifiers and ADCs, what: "Isolated voltage and current sensing for inverters, chargers and battery systems"}
  - {name: Sensors, what: "Magnetic current and position sensors (strengthened by buying Maxic), pressure, temperature and humidity sensors, many automotive-qualified"}
  - {name: Automotive analog and interface, what: "CAN/LIN transceivers, system basis chips, PMICs, motor and LED drivers, Class-D audio amplifiers; new in 2026: an automotive audio bus chip, a real-time M7 MCU and SerDes in development"}
markets:
  - {name: "Pan-energy (solar, storage, digital power, industrial)", share: "58 % (H1 2026)", note: "Grew 84 % in H1 2026"}
  - {name: "Automotive electronics", share: "32 % (H1 2026)", note: "EV inverters, on-board chargers, battery management, body; grew 59 %"}
  - {name: "Consumer electronics", share: "10 % (H1 2026)", note: "Grew 20 %"}
strengths:
  - "Price: Chinese cost base and an aggressive price strategy; the owner's verification sees Novosense, TI and Diodes as the true isolation competitors for that reason."
  - "Close to China's EV, solar and storage makers, the biggest and fastest-growing users of isolation; local-supplier preference helps it win sockets."
  - "Broad isolation line that matches ours part for part (isolators, drivers, amplifiers, isolated interfaces) plus sensors, so it can sell a whole inverter or charger bill of materials."
  - "Strong data sheet numbers where they matter: high CMTI (150 kV/µs typical on its newer drivers), automotive grades, functional-safety drivers."
  - "Fresh money from the December 2025 Hong Kong listing and revenue up about 70 % a year."
weaknesses:
  - "Loss-making from 2023 to 2025 (net loss RMB 229 M in 2025); only back in profit in 2026."
  - "Operating cash flow is strongly negative (about −RMB 627 M in 2025, −RMB 710 M in H1 2026) as it builds stock and pays suppliers deposits for capacity."
  - "Most revenue is in China; outside China its brand, field support and long-term automotive record are still being built."
  - "Exposed to China's EV and solar price wars and to trade restrictions in both directions."
