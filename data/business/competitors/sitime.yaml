name: SiTime
ticker: "NASDAQ: SITM"
hq: Santa Clara, California, USA
updated: 2026-10-22
summary: >-
  SiTime makes timing parts: the oscillators, resonators and clock chips that give every electronic system its
  heartbeat. It built its name replacing quartz crystals with silicon MEMS resonators and, since buying Renesas'
  timing business in July 2026, also sells a full line of clock generators, buffers and jitter attenuators.
model: >-
  Fabless. MEMS resonator and CMOS wafers come from outside foundries (TSMC is named in public profiles); packaging
  and test are subcontracted. Its MEMS process came from Bosch, under a patent licence that expires 2025–2029.
figures:
  - {label: Revenue FY2025, value: "$326.7 M (+61 % on $202.7 M in FY2024)", source: "SiTime results release, 4 Feb 2026", date: 2026-02-04, conf: high}
  - {label: Revenue Q4 2025, value: "$113.3 M (+66 % year on year)", source: "SiTime results release, 4 Feb 2026", date: 2026-02-04, conf: high}
  - {label: Net result FY2025, value: "GAAP loss $42.9 M; non-GAAP profit $82.6 M", source: "SiTime results release, 4 Feb 2026", date: 2026-02-04, conf: high}
  - {label: Gross margin Q4 2025, value: "61.2 % (non-GAAP)", source: "SiTime results release, 4 Feb 2026", date: 2026-02-04, conf: high}
  - {label: Employees, value: "approx. 400–470 (before the Renesas timing team joined); 239 in R&D at end 2025", source: "R&D count from the FY2025 10-K; totals from employee trackers (395, 441, 471) disagree", date: 2026-03-01, conf: low}
  - {label: Renesas timing business, value: "≥ $300 M revenue expected in the first 12 months, about 70 % gross margin", source: "SiTime 8-K/A and announcement, closed 1 Jul 2026", date: 2026-07-01, conf: med}
  - {label: Combined size (est.), value: "approx. $650–750 M yearly revenue from 2027", source: "BizDev estimate: FY2025 run rate plus the acquired business", date: 2026-10-22, conf: low}
products:
  - {name: MEMS oscillators (XO, VCXO, TCXO, Super-TCXO, OCXO), what: "Drop-in replacements for quartz oscillators; Elite and Epoch lines for low jitter and high stability"}
  - {name: MEMS resonators, what: "The bare resonator for chipmakers who build the oscillator circuit into their own chip"}
  - {name: Clock ICs, what: "Chorus clock generators with built-in MEMS resonator (no crystal), plus network synchronisers"}
  - {name: Renesas clocks and timing (acquired), what: "Clock generators, buffers, jitter attenuators, crystal oscillators (VersaClock, FemtoClock and similar lines)"}
  - {name: Endura ruggedised timing, what: "Aerospace and defence: GNSS, tactical radio, drones; shock and vibration resistant"}
markets:
  - {name: "Communications, enterprise and datacentre", share: "57 % (Q4 2025)", note: "AI servers, switches, optical modules; over 100 % growth for seven quarters"}
  - {name: "Automotive, industrial and aerospace", share: "22 % (Q4 2025)", note: "$24.5 M in Q4 2025; ADAS computers, cameras, networking, Grade 1 parts"}
  - {name: "Mobile, IoT and consumer", share: "21 % (Q4 2025)", note: "$24.2 M in Q4 2025; wearables, phones, IoT"}
strengths:
  - "The only large MEMS timing supplier: smaller, more shock- and temperature-robust than quartz, and programmable, so short lead times."
  - "Riding AI datacentre demand: datacentre timing grew over 100 % a year for seven quarters."
  - "Since July 2026 a full timing line from one supplier: resonator, oscillator, clock generator, jitter attenuator."
  - "Automotive Grade 1 (–40 to 125 °C) clock generators and oscillators already on sale."
  - "Strong margins (about 61 %) leave room to fund new products."
weaknesses:
  - "Still small next to its rivals (about $330 M in 2025) and loss-making under GAAP after deal costs."
  - "Heavy reliance on one end market (datacentre) whose spending can swing."
  - "Integration risk: a business about the same size as itself to absorb, while Renesas helps under a transition agreement."
  - "Depends on outside foundries for the MEMS process; the Bosch patent licence that started it ends 2025–2029."
  - "Quartz is still cheaper for simple, non-critical clocks."
overlap:
  - {area: "Clock generators and buffers", skyworks: "Direct: Si5332, Si5341 and similar; SiTime lists Skyworks as a main competitor", qorvo: "None", level: direct, link: "/parts?q=Si5332"}
  - {area: "Jitter attenuators and network synchronisers", skyworks: "Direct: Skyworks DSPLL jitter attenuators vs the Renesas lines SiTime bought", qorvo: "None", level: direct}
  - {area: "Oscillators (XO / VCXO)", skyworks: "Direct: Skyworks Si5xx oscillators vs MEMS oscillators", qorvo: "None", level: direct}
  - {area: "Crystal-free clocks (resonator built in)", skyworks: "Direct: Skyworks BAW-resonator timing (SKY631xx) vs SiTime MEMS (Chorus)", qorvo: "Partial: Qorvo makes BAW resonators, but for RF filters, not for timing", level: direct}
  - {area: "Automotive clock tree (ADAS, PCIe, SerDes)", skyworks: "Direct: our Si5332-AM is Grade 2 and needs a crystal; SiTime offers Grade 1 crystal-free", qorvo: "None", level: direct, link: "/business/reports/auto-clock-tree"}
  - {area: "Mobile and IoT customers", skyworks: "Indirect: same phone, wearable and IoT makers, different sockets", qorvo: "Indirect: same customers (RF front ends, UWB, Wi-Fi), different sockets", level: partial}
moves:
  - "1 Jul 2026: closed the purchase of Renesas' timing business for about $1.5 B cash plus 3.56 M shares (about $3 B in total, as press reported)."
  - "Feb 2026: deal announced together with a plan to work with Renesas on putting MEMS timing next to Renesas chips."
  - "2025: AI datacentre timing became more than half of revenue."
for_bizdev:
  - "Timing is now a two-horse race at the high end in many sockets: Skyworks vs SiTime + Renesas (with TI in crystal-free BAW). Expect sharper pricing and bundling with Renesas MCUs and SoCs."
  - "While SiTime integrates Renesas (2026–2027), customers of the acquired lines may look for a second source: a window for our clock generators and jitter attenuators."
  - "Our BAW timing answers SiTime's 'no crystal' story; the automotive gaps (Grade 1, no automotive jitter attenuator) are where SiTime is ahead (see the automotive clock tree case)."
  - "Qorvo has no timing products, so the combined company gains nothing here from Qorvo; the overlap is all on the Skyworks side."
