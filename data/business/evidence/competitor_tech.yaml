# Competitor technology per function (public product information; indicative).
# Leaders = suppliers whose public product pages show the strongest technical position; not market share.
# Supplier names follow data/business/competition.yaml where an entry exists; notes say when a function has no entry there.
# entry_position is for Skyworks / Qorvo given their current technology (see data/business/technology.yaml).
# Verified 2026-10-19 against public pages: each entry has a check block (status/date/evidence/note); evidence lists only pages actually opened.
