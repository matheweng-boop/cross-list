pol_ldo:
  leaders: [Texas Instruments, Analog Devices]
  lead_tech: "Ultra-low-noise (sub-1 uV rms) and high-PSRR LDOs (e.g. TI TPS7A9x, ADI LT304x) on mature bipolar/BiCMOS processes, plus very broad catalogue breadth"
  differentiators: ["RF-optimised PSRR at 1-6 GHz for PA/LNA/PLL rails", "tiny WLCSP LDOs co-packaged or paired with RF front ends", "multi-output LDOs tuned for RF reference designs"]
  entry_position: fast_follower
  note: "Commodity category where Qorvo PMIC LDO blocks give a base; only an RF-rail niche offers a reason to choose."
  confidence: high
  sources: ["public product pages of Texas Instruments (ti.com linear regulators) and Analog Devices (analog.com LDO linear regulators)"]
