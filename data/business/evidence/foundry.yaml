# Foundry route per function (public foundry offerings; indicative).
# Compiled 2026-10-19 from public foundry technology pages, press releases and trade press. No logins.
# foundry_route: yes = mature commercial process exists; partial = exists but niche/limited; no = needs own fab / special process.
# in_house refers to platforms in data/business/capabilities.yaml. Foundry lists are examples, not exhaustive.
# Note: TSMC announced it will wind down GaN foundry services by 2027-07-31; GlobalFoundries and VIS licensed its GaN processes.
