# Foundry route per function (public foundry offerings; indicative).
# Compiled 2026-10-19 from public foundry technology pages, press releases and trade press. No logins.
# foundry_route: yes = mature commercial process exists; partial = exists but niche/limited; no = needs own fab / special process.
# in_house refers to platforms in data/business/capabilities.yaml. Foundry lists are examples, not exhaustive.
# Note: TSMC announced it will wind down GaN foundry services by 2027-07-31; GlobalFoundries and VIS licensed its GaN processes.
pol_ldo:
  typical_process: "0.18 um / 130 nm BCD or analog CMOS (5-40 V LDMOS options)"
  foundry_route: "yes"
  foundries: ["TSMC BCD (0.6 um to 22 nm)", "GlobalFoundries 130/55 nm BCD / BCDLite", "Tower 180 nm / 65 nm BCD", "X-FAB XT018 / XT011 BCD-on-SOI", "TSMC analog CMOS"]
  in_house: "Qorvo configurable PMIC / motor-control SoC line (Active-Semi heritage) and Skyworks power management (LED drivers, RF PMICs); process nodes not public"
  note: "LDOs are a standard foundry BCD/analog-CMOS product; no special process needed."
  confidence: high
  sources: ["https://www.tsmc.com/english/dedicatedFoundry/technology/specialty/bcd", "https://www.tipranks.com/news/press-releases/globalfoundries-enhances-technology-platforms-to-enable-critical-applications-for-next-generation-electric-and-autonomous-vehicles", "https://ir.towerjazz.com/news-releases/news-release-details/tower-semiconductor-expands-its-leading-edge-power-management", "https://www.xfab.com/technology/bcd", "https://www.tsmc.com/english/dedicatedFoundry/technology/specialty/analog"]
