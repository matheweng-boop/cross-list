# New-market ideas: existing technologies applied to new markets (public demand signals; indicative, for discussion).
#
# Compiled 2026-10-19 from public web pages only (no log-in, no posting). Starting point: platforms and `could_also`
# notes in data/business/capabilities.yaml and real product families in data/catalog/skyworks_parts.yaml and
# qorvo_parts.yaml. Each technology lists 2-5 ideas, most promising first.
# signals: only pages that were actually fetched and read for this file are cited. Many vendor, forum and news pages
#   could not be read (reddit.com is off-limits to the search tool; gearspace.com, avsforum.com, qorvo.com,
#   skyworksinc.com, fcc.gov, everythingrf.com and several others refused or timed out), so ideas that rest only on
#   those pages have signals: [] and confidence: low. Forum posts are summarised, with no usernames or quotes.
# fit: how closely the existing product already matches the need. confidence: how strong the public evidence is.
# Many signals are vendor press releases or competitor products. They show that someone is targeting the market,
#   not how big it is.

wireless_audio:
  technology: "Low-latency wireless audio SoCs (proprietary 2.4 / 5 GHz digital audio links)"
  owner: [Skyworks]
  products: ["SKY76303-21", "SKY76360-22", "SKY76361-32", "SKY76361-52"]
  platform: null
  ideas:
    - market: "Musician and live-performance gear"
      application: "5 GHz wireless instrument (guitar/bass) links and personal in-ear monitor packs"
      why_fit: "SKY76303 already provides a complete 5 GHz point-to-multipoint digital audio node, and SKY7636x already gives fixed latency under 10 ms. Instrument and in-ear monitor (IEM) links need exactly this low, fixed latency."
      needed: ["latency budget nearer 4-5 ms end-to-end", "instrument-level analog front end / ADC in a reference design", "rugged beltpack reference design", "multi-unit channel coordination for stages"]
      signals:
        - "Retail 5.8 GHz guitar wireless systems are sold on <5 ms latency, 24-bit audio and ~30 m range, so latency is the selling point - https://www.lamusic.com/products/nux-5-8-ghz-wireless-guitar-system-c-5rc"
        - "Fender sells its own 5.8 GHz 'Telepath' guitar wireless system marketed on low latency - https://shop.theartsmusicstore.com/products/fender-telepath-guitar-wireless-system-5-8ghz-mystic-ice-blue-receiver-black-transmitter-0239780001"
        - "Budget 2.4 GHz in-ear monitor sets with one transmitter and two receivers (Xvive U4) are now a retail category - https://www.boullard.ch/en/product/sound/in-ear-systems/complete-in-ear-systems/203229-xvive-u4-in-ear-monitor-wireless-system-set-r2/"
        - "UHF TV-band spectrum for wireless microphones and IEMs keeps shrinking (US 700 MHz and 600 MHz auctions, UK 800 MHz), which pushes users to other bands and to digital systems - https://en.wikipedia.org/wiki/Wireless_microphone_licensing"
      incumbents: ["Shure", "Sennheiser", "Xvive", "NUX", "Fender", "Line 6 (Yamaha)", "Boss (Roland)"]
      fit: high
      confidence: medium
    - market: "Assistive listening in venues (churches, lecture halls, theatres, transport)"
      application: "Low-latency broadcast audio from the venue mixer to hearing aids, earbuds and loaner receivers"
      why_fit: "The SoCs already stream synchronised audio from one source to many receivers at low latency, which venue assistive listening needs so that lips and the room sound stay in sync."
      needed: ["Bluetooth LE Audio / Auracast interoperability (hearing aids will not receive a proprietary link)", "transmitter-side product (mixer input, many listeners)", "accessibility-standard compliance"]
      signals:
        - "On a hearing-loss forum, churches swapping telecoil loops for Auracast transmitters report about 30 ms latency and some transmitters dropping back to about 250 ms until patched. Low-budget multi-site rollouts and mixed hearing-aid brands are the pain points - https://forum.hearingtracker.com/t/auracast-church-broadcast-setup/111342?page=2"
        - "Forum staff note that Auracast latency must be low enough for use in public venues and link a measured write-up - https://forum.hearingtracker.com/t/auracast-latency/95224"
        - "Auracast (Bluetooth LE Audio broadcast) is aimed at hearing aids and public spaces such as airports and lecture halls, and Frankfurt Airport trialled it in 2026 - https://en.wikipedia.org/wiki/Auracast"
      incumbents: ["Listen Technologies", "Williams AV", "Sennheiser (MobileConnect)", "Avantree", "loop installers (Ampetronic, Contacta)"]
      fit: medium
      confidence: medium
    - market: "Conference and simultaneous-interpretation systems"
      application: "Delegate/interpreter wireless receivers replacing IR and analog FM tour-guide sets"
      why_fit: "Multi-channel, synchronised, low-latency point-to-multipoint digital audio is what interpretation receivers need, both indoors and outdoors."
      needed: ["many selectable language channels", "encryption for confidential meetings", "long battery life in a pocket receiver", "ISO 20109-related system design with partners"]
      signals:
        - "An interpretation-service provider describes the setup as a closed wireless system of special microphones, headsets and transmitters, and says it rents such equipment for each event - https://www.trustedtranslations.com/services/onsite-interpretation/equipment"
      incumbents: ["Bosch (Dicentis/Integrus)", "Shure", "Sennheiser", "Williams AV", "Taiden"]
      fit: medium
      confidence: low
    - market: "Automotive rear-seat / multi-zone audio"
      application: "Low-latency wireless headphones for rear-seat screens (replacing IR analog headphones)"
      why_fit: "Fixed low latency keeps lip-sync on rear-seat video, and multipoint links serve several passengers at once."
      needed: ["AEC-Q100 qualification", "in-cabin coexistence with car Wi-Fi/BT", "OEM infotainment integration"]
      signals: []
      incumbents: ["OEM IR headphone suppliers", "Bluetooth headphone makers", "Harman", "Bose"]
      fit: medium
      confidence: low
    - market: "XR / VR headsets"
