      confidence: medium
      answer: "Your view (26 Oct 2026): this looks like a low-volume market. Agreed as a working view: venue systems are counted per room, not per listener, and hearing aids will need Auracast rather than our link (est, no public unit count found), so this idea moves to the end of the list (lower priority)."

