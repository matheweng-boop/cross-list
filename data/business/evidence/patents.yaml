# Indicative patent depth of Skyworks / Qorvo per function's technology area (public patent searches; not legal advice).
# depth: strong (many families, active filing) | some | little | none_found
# Source: USPTO Patent Public Search (ppubs.uspto.gov, anonymous, BRS syntax), US grants + published applications, searched 2026-10-19.
# count = US patent families matching the query (keywords in title/abstract/claims; Qorvo includes RFMD, TriQuint, Active-Semi,
# Decawave, GreenPeak, UnitedSiC). Keyword hits include circuits embedded in RF products, so depth was judged from the titles too.
# Skyworks' ex-Silicon Labs I&A (isolation, timing) patents only count where already assigned to Skyworks. US only; no EP/CN families.

pol_ldo:
  depth: strong
  query: "(skyworks OR qorvo OR \"rf micro devices\" OR triquint OR \"active-semi\" OR decawave OR greenpeak OR \"united silicon carbide\").as. AND (\"low dropout\" OR \"low-dropout\" OR LDO).ti,ab,clm."
  count: 76
  examples: ["US12597890B2 Over temperature protection of LDO controlling the RF power amplifier collector voltage", "US12525924B2 Envelope tracking radio frequency front-end circuit", "US12487619B2 LDO output power-on glitch removal circuit"]
  note: "LDO circuits mostly inside RF PA / FEM supply paths (e.g. LDO glitch removal, programmable LDOs) (Skyworks 24 / Qorvo group 52 families)"
  confidence: medium
