# Indicative patent depth of Skyworks / Qorvo per function's technology area (public patent searches; not legal advice).
# depth: strong (many families, active filing) | some | little | none_found
# Source: USPTO Patent Public Search (ppubs.uspto.gov, anonymous, BRS syntax), US grants + published applications, searched 2026-10-19.
# count = US patent families matching the query (keywords in title/abstract/claims; Qorvo includes RFMD, TriQuint, Active-Semi,
# Decawave, GreenPeak, UnitedSiC). Keyword hits include circuits embedded in RF products, so depth was judged from the titles too.
# Skyworks' ex-Silicon Labs I&A (isolation, timing) patents only count where already assigned to Skyworks. US only; no EP/CN families.
# EU coverage (2026-10-19): not added. Public no-login routes tried and blocked for automated, read-only access:
#   EPO Espacenet web UI (worldwide.espacenet.com) - Cloudflare bot-verification page (HTTP 403);
#   Lens.org public patent search - CAPTCHA ("Verifying you are a valid user"), search API returned 403;
#   WIPO PATENTSCOPE advanced search - image CAPTCHA before results; Google Patents (extra) - "automated queries" 503.
#   EPO OPS needs registration, so it was not used. No eu_count / eu_query fields were added.
# check: US example patents spot-checked 2026-10-19 (USPTO full-text PDF fetched + ppubs record title/assignee matched).
# 2026-10-25: every gap / new-technology function in the evidence files has an entry here; functions without one (the RF
# band gaps: RF filter, power amplifier, RF synthesizer, limiter) take the depth of their technology platform in
# patents_platforms.yaml. depth feeds the priority score's likeliness bonus (priority.yaml patent_bonus).

