# US patent families of the strongest competitors per technology platform, next to ours, for the patent barrier of the
# priority score (owner, 6 Nov 2026: similarity to our technology, distance to it, difficulty of recreating it; weights in
# data/business/priority.yaml patents). Keyword counts of public data: est, not legal advice.
# Source: USPTO Patent Public Search (ppubs.uspto.gov, anonymous BRS), US grants + published applications, searched
#   2026-11-06, one request at a time, >= 11 s apart; no block or bot check. Espacenet, Lens, WIPO and Google Patents block
#   automated access (see patents.yaml), so US only.
# Method: one query per platform with the platform's own terms (patents_platforms.yaml) and the chosen competitors' names
#   OR-ed in the assignee and applicant fields, documents filed from 2020 on; each family is counted once per competitor
#   whose name it carries, by its earliest US filing (the application or a parent / provisional it claims).
#   last5 = first filed 2021-2026, last3 = 2024-2026, prior3 = 2021-2023 (the last two years are under-counted: 18-month
#   publication lag, for us and them alike). ours = the platform's own query (Skyworks + Qorvo group), same windows.
#   At most 4 competitors per area, the most relevant (est). Names: TI; ADI incl. Maxim, Linear, Hittite; NXP incl.
#   Freescale; Murata incl. pSemi / Peregrine; Broadcom incl. Avago; Qualcomm incl. RF360; Microchip incl. Microsemi;
#   onsemi = Semiconductor Components Industries; Renesas incl. IDT, Intersil.
# Limits: keyword hits, not a legal or technical review; generic terms (e.g. "5G") would swamp a platform, so platforms
#   without a function (GaAs pHEMT, Wi-Fi filters, 5G NR, GNSS) have no competitor search.
