# US patent landscape of Skyworks and the Qorvo group per technology platform, plus an automotive cut and where the two
# overlap or complement each other. Indicative, not legal advice. Owner, 25 Oct 2026: background only (no page of its
# own); shown on the per-function evidence pages, used as a small bonus in the priority score's likeliness
# (data/business/priority.yaml patent_bonus) and summarised for the synergies report (app/services/patents.py
# patent_summary).
# Source: USPTO Patent Public Search (ppubs.uspto.gov, anonymous, BRS syntax), US grants + published applications,
# searched 2026-10-25, one request at a time, >= 10 s apart per host: 36 searches, 2 batched record look-ups and 4 sessions on
# ppubs.uspto.gov, 19 full-text PDFs on image-ppubs.uspto.gov, robots.txt of both (none published); no block or bot check.
# Espacenet, Lens, PATENTSCOPE and Google Patents block automated access and EPO OPS needs registration
# (see patents.yaml), so US only; no EP / CN families.
# Method: count = US patent families (one per family id) whose title, abstract or claims match the platform terms and
#   whose assignee is Skyworks (Skyworks Solutions, Skyworks Global, its Japan filter unit; ex-Silicon Labs I&A only where
#   recorded under Skyworks) or the Qorvo group (Qorvo, RF Micro Devices, TriQuint, Active-Semi, Decawave, GreenPeak,
#   United Silicon Carbide, Anokiwave). skyworks / qorvo split the families by assignee name.
#   trend = families by earliest US filing in the family (the application or a parent / provisional it claims; a
#   priority proxy): [up to 2019, 2020-2022, 2023-2026]. trend_dir (est): share first filed 2020 or later >= 40 %
#   rising, 20-40 % steady, below 20 % falling; under 5 families thin.
#   depth (est, by count): strong >= 100 families, some 20-99, little 1-19, none_found 0.
#   leader: both when the smaller holds at least half of the larger count, else the larger; overridden from the titles
#   where keyword noise is large (said in the note).
#   examples: the 3 most recently published families per company (grant preferred), linked to the USPTO full-text PDF.
#   automotive: the same platform terms AND automotive terms (vehicle, automotive, V2X, telematics, car, AEC, AEC-Q100) in
#   title / abstract / claims (count); broad_count puts the automotive terms in the default search fields instead.
# Limits: keyword hits, not a legal or technical review; a family may count in several platforms; patents that never name
#   the platform term in title, abstract or claims are missed (e.g. most PA patents do not say HBT); recent filings are
#   under-counted (18-month publication lag); many Silicon Labs I&A patents are still recorded under Silicon Laboratories.
# check: 3 examples per platform (2 per automotive entry) spot-checked 2026-10-25: the Patent Public Search record resolves
#   with the same title and an assignee of the group; one example per platform also by the USPTO full-text PDF
#   (image-ppubs.uspto.gov; image-only PDFs, so "served as application/pdf" is checked, not their text).
