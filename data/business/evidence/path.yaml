#       technology or team needed: partner, license or acquire) | not_pursue (unrelated; customer's own chip)
#
# Compiled 2026-10-19 from data/catalog/skyworks_parts.yaml, data/catalog/qorvo_parts.yaml (keyword search over mpn,
# description, category, base) and public knowledge of both companies. No new web requests. existing_parts are part
# numbers exactly as written in the catalogue (max 8). Effort and route are indicative judgements, not plans.

