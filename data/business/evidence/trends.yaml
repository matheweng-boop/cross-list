# Demand trend per function over 3-5 years (public sources; indicative).
# outlook: growing | stable | declining
# Outlooks are qualitative judgements from public standards, regulation and industry press; no growth figures are given.
# "stable" means unit demand holds or grows with the general semiconductor market, without a specific new driver.

# ---------------------------------------------------------------- power
pol_ldo:
  outlook: stable
  drivers: ["more low-noise rails per SoC, RF and sensor", "integration into PMICs and SoCs"]
  note: "Each new SoC, radio and camera still needs clean low-noise rails, but many rails move inside PMICs; discrete demand roughly tracks unit volumes."
  confidence: medium
  sources: ["Texas Instruments, 'LDO basics' e-book / application notes (public)", "Yole Group, power management IC market overviews (public summaries)"]
ldo_tracker:
  outlook: growing
  drivers: ["more remote sensors and cameras in ADAS/zonal cars", "off-board sensor supply with short-circuit protection"]
  note: "Tracking LDOs feed off-board automotive sensors; the count of remote sensors per car rises with ADAS (EU GSR2) and zonal wiring."
  confidence: medium
  sources: ["Regulation (EU) 2019/2144 General Safety Regulation, eur-lex.europa.eu", "Euro NCAP 2026 protocols roadmap, euroncap.com"]
termination_ldo:
  outlook: stable
  drivers: ["DDR4/DDR5/LPDDR5 memory in servers, cars and networking", "on-DIMM PMIC takes over termination in DDR5 modules"]
  note: "Memory content per system grows, but DDR5 moves power management onto the DIMM (PMIC), so discrete VTT LDOs stay flat."
  confidence: medium
  sources: ["JEDEC JESD79-5 DDR5 SDRAM standard and JESD301 DDR5 PMIC standard, jedec.org"]
multiphase:
  outlook: growing
  drivers: ["AI accelerators and GPUs with kilo-amp core rails", "48 V rack power (OCP ORv3) and vertical power delivery", "ADAS central computers"]
  note: "AI servers drive sharply higher current per processor and more phases per board; the shift to 48 V rack distribution adds new conversion stages."
  confidence: high
  sources: ["Open Compute Project, Open Rack V3 (ORv3) 48 V specification, opencompute.org", "NVIDIA GB200 NVL72 product page, nvidia.com", "Infineon / Vicor / MPS AI-server power press releases 2024-2025"]
supervisor:
  outlook: stable
  drivers: ["functional safety (ISO 26262) voltage monitoring", "integration into PMICs and MCUs"]
  note: "Safety-rated window supervisors grow in automotive and industrial, offset by integration of basic reset into PMICs and MCUs."
  confidence: medium
  sources: ["ISO 26262:2018 Road vehicles - Functional safety, iso.org"]
sequencer:
  outlook: stable
  drivers: ["multi-rail FPGAs/SoCs/AI boards", "integration into PMICs and digital controllers"]
  note: "Complex boards need more rails sequenced, but PMICs and PMBus controllers absorb much of the function."
  confidence: low
  sources: ["PMBus specification, pmbus.org"]
voltage_reference:
  outlook: stable
  drivers: ["precision measurement in BMS, test and industrial", "integration into ADCs"]
  note: "Demand follows precision data acquisition and battery monitoring; most low-end references are integrated into converters."
  confidence: low
  sources: ["Analog Devices / TI voltage reference selection guides (public)"]
isolated_dcdc:
  outlook: growing
  drivers: ["800 V EV traction inverters and on-board chargers (gate-driver bias)", "solar inverters and battery storage", "industrial isolated interfaces"]
  note: "Every isolated gate driver and isolated interface in EV, solar and storage needs an isolated bias supply; 800 V platforms and SiC raise isolation requirements."
  confidence: high
  sources: ["IEA Global EV Outlook 2025, iea.org", "IEA Renewables 2024, iea.org", "Hyundai E-GMP / Porsche Taycan 800 V architecture press releases"]
pre_regulator:
  outlook: growing
  drivers: ["isolated bias supplies in EV inverters/OBC/BMS", "battery-voltage stabilisation for 12 V/48 V low-voltage nets"]
  note: "Follows isolated gate-driver bias in EV power electronics; 48 V low-voltage networks add wider input-range needs."
  confidence: medium
  sources: ["IEA Global EV Outlook 2025, iea.org", "Tesla Cybertruck 48 V low-voltage architecture coverage, 2023-2024 industry press"]
hv_flyback:
  outlook: growing
  drivers: ["800 V EV platforms needing supply from the HV battery", "redundant bias for functional safety", "solar and storage"]
  note: "HV-input flyback supplies for inverters, OBC and BMS grow with EV volumes and the shift toward 800 V platforms."
  confidence: medium
  sources: ["IEA Global EV Outlook 2025, iea.org", "Hyundai E-GMP / Kia EV6 800 V press materials, hyundai.com"]
acdc_controller:
  outlook: growing
  drivers: ["GaN fast chargers (USB PD 3.1 EPR up to 240 W)", "EU common charger directive (USB-C)", "AI server PSUs with higher power density"]
  note: "GaN-based high-density chargers and server PSUs need new controllers; the EU common-charger rule unbundles chargers, shifting volume rather than raising it."
  confidence: medium
  sources: ["USB-IF USB Power Delivery 3.1 specification, usb.org", "Directive (EU) 2022/2380 common charger, eur-lex.europa.eu", "Open Compute Project ORv3 power shelf specification, opencompute.org"]
efuse_hotswap:
  outlook: growing
  drivers: ["AI servers and 48 V hot-swap backplanes", "zonal architectures replacing fuses and relays with eFuses", "smart power distribution in cars"]
  note: "Zonal controllers replace melting fuses with semiconductor eFuses, and AI server boards need high-current hot-swap protection."
  confidence: high
  sources: ["Open Compute Project ORv3, opencompute.org", "Infineon PROFET / zonal architecture white papers, infineon.com", "TI 'Smart fuse' automotive power distribution application notes, ti.com"]
power_fets:
  outlook: growing
  drivers: ["48 V server and automotive power", "eFuse/zonal power distribution", "GaN in chargers and data-centre PSUs"]
  note: "Low-voltage power MOSFET and GaN demand rises with AI server power and vehicle electrification; SiC for traction is outside this low-voltage scope."
  confidence: medium
  sources: ["Yole Group, Power Electronics / GaN market monitor public summaries, yolegroup.com", "Open Compute Project ORv3, opencompute.org"]
battery_protector:
  outlook: stable
  drivers: ["Li-ion packs in phones, wearables, tools, e-bikes", "EU Battery Regulation (EU) 2023/1542 safety and removability"]
  note: "Follows Li-ion pack unit volumes; mature function with steady demand, more cells per pack in tools and e-mobility."
  confidence: medium
  sources: ["Regulation (EU) 2023/1542 on batteries, eur-lex.europa.eu"]
wireless_power:
  outlook: growing
  drivers: ["Qi2 / Qi2.2 magnetic charging adoption in Android and accessories", "in-car wireless charging pads", "industrial wireless power"]
  note: "Qi2 brings magnetic alignment to Android phones and accessories, renewing transmitter and receiver designs."
  confidence: medium
  sources: ["Wireless Power Consortium, Qi2 / Qi2.2 announcements, wirelesspowerconsortium.com"]
usb_pd_controller:
  outlook: growing
  drivers: ["EU common charger directive mandating USB-C", "USB PD 3.1 EPR up to 240 W (laptops, tools)", "USB-C in cars"]
  note: "USB-C becomes mandatory on many devices in the EU from 2024 (laptops 2026), and EPR extends PD into higher-power products."
  confidence: high
  sources: ["Directive (EU) 2022/2380 common charger, eur-lex.europa.eu", "USB-IF USB Power Delivery 3.1 specification, usb.org"]

