# Demand trend per function over 3-5 years (public sources; indicative).
# outlook: growing | stable | declining
# Outlooks are qualitative judgements from public standards, regulation and industry press; no growth figures are given.
# "stable" means unit demand holds or grows with the general semiconductor market, without a specific new driver.
# check: web verification of the sources (2026-10-19). evidence lists only pages actually opened and read.
#   Many primary hosts refused automated reads (eur-lex, iso.org, jedec.org, iea.org, gsma.com, ericsson.com, unece.org,
#   yolegroup.com, congress.gov, federalregister.gov, analog.com, tesla.com); where possible an official mirror or press coverage was used.

# ---------------------------------------------------------------- power
pol_ldo:
  outlook: stable
  drivers: ["more low-noise rails per SoC, RF and sensor", "integration into PMICs and SoCs", "board space is tight (owner, 25 Oct 2026): LDOs with lower power dissipation win - very low dropout, low quiescent current and small packages that shed heat well", "board space is tight (owner, 25 Oct 2026): higher output accuracy wins, so fewer trim and margin parts are needed around the rail"]
  note: "Each new SoC, radio and camera still needs clean low-noise rails, but many rails move inside PMICs; discrete demand roughly tracks unit volumes. Owner's view (25 Oct 2026, outlook confirmed): because space constraints are strong, lower power dissipation and higher accuracy will be the prevalent trends. In a small package every watt lost raises the chip temperature, so a lower dropout and a lower quiescent current let the LDO stay in a smaller package; tighter accuracy lets the rail run closer to the load's limit. Support in BizDev data: the Qorvo ACT88321 PMIC review shows the arithmetic (37 C/W, 1.5 W lost = about 55 C rise) and quotes LDO dropout up to 400 mV at 400 mA and accuracy of +/-1 % at 25 C; no public demand figure was found."
  confidence: low
  sources: ["Texas Instruments, LDO application-note topical index SBVA026, ti.com/lit/SBVA026", "Owner review, 25 Oct 2026 (space constraints: lower power dissipation and higher accuracy)", "BizDev review qorvo-act88321-pmic (thermal resistance, LDO dropout and accuracy from the Qorvo ACT88321 datasheet)"]
  check:
    status: unconfirmed
    date: 2026-10-19
    evidence: ["https://www.ti.com/lit/SBVA026 - TI index of LDO application notes (technical background only, no demand data)"]
    note: "No public source found for the discrete-LDO demand outlook. TI 'LDO basics' e-book not found under that title (replaced by SBVA026); Yole PMIC pages blocked automated access and were removed. Confidence lowered to low."
