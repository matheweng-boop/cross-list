# Explanations for the Business opportunity pages: terms (tooltips + the How it works page) and one "About this page"
# panel per page. Plain words; every number on the pages should be explainable from here.

terms:
  application:
    term: Application
    short: One end system drawn as a block diagram (e.g. an EV on-board charger, a Wi-Fi access point).
    long: >-
      One end system drawn as a block diagram from public reference material (TI, NXP, Qualcomm, MediaTek, Skyworks and
      others). Each diagram lists the chips (functions) the system needs. Library applications are shown in Block
      diagrams; background applications are used only for statistics.
  background:
    term: Background diagram
    short: A diagram used only for statistics; not shown in the library because it fits the portfolio poorly.
    long: >-
      A block diagram that does not fit the Skyworks / Qorvo portfolio well enough to show in the library (fewer than 3
      functions with our parts, or under 30% of its positions covered). It still counts in occurrence, attach and
      Technology fit, so new-product ideas see the whole market, not only systems we already sell into.
  function:
    term: Function
    short: A normalized chip type, e.g. "PoL LDO" or "Wi-Fi front-end module", regardless of vendor or part number.
    long: >-
      A normalized chip type such as "PoL LDO", "Digital isolator" or "Wi-Fi front-end module". Different vendors'
      diagrams use different words; each block is mapped to one function so applications can be compared.
  socket:
    term: Socket (design-in position)
    short: One place on the board a function fills. A diagram with two LDOs has two LDO sockets.
    long: >-
      One place on the board that a function fills. Quantities count: a diagram with two LDOs has two LDO sockets. Two
      alternative parts for the same place count once (we count positions, never part numbers).
  status:
    term: Status of a socket
    short: Portfolio, Gap, Competitor only, or Not our product type.
    long: >-
      Portfolio = a Skyworks or Qorvo part exists for the function in BizDev (a candidate, not yet checked against
      the application's specs). Gap = needed, but no company in BizDev has a part. Competitor only = only other
      companies have parts in BizDev. Not our product type = processors, MCUs, memory, sensors, antennas and other
      chips Skyworks / Qorvo do not make; left out of coverage.
  coverage:
    term: Candidate coverage
    short: Sockets where a Skyworks / Qorvo candidate exists ÷ in-scope sockets. A candidate is not checked against the application's electrical requirements.
    long: >-
      Sockets with a Skyworks / Qorvo candidate part divided by the in-scope sockets (Portfolio + Gap + Competitor
      only). "Not our product type" is excluded so that processors and memory do not pull the number down. A candidate
      means a part exists for the function; whether it meets the application's voltage, current, band or qualification
      is not validated, so this is not a suitability figure.
  door_opener:
    term: Door opener (portfolio anchor)
    short: An application that already contains at least one of our parts, so we already talk to its designers.
    long: >-
      For a missing function: of the applications that need it, how many already contain at least one Skyworks / Qorvo
      part elsewhere in the diagram. There we already have a design-in conversation, so a new product is easier to
      place. 29/29 means every application that needs it already has one of our parts.
  attach:
    term: Attach
    short: Which other functions sit in the same applications as a product we sell.
    long: >-
      Starting from one of our products, the other functions that appear in the same applications, and how often.
      Modeled from the diagrams: it says "appears together", not "was bought together" (no sales data is used).
  competition:
    term: Competition
    short: Number of established suppliers from public catalogues (indicative, not market share).
    long: >-
      Established suppliers of the function, from general public knowledge of vendor catalogues; Skyworks and Qorvo are
      not counted. Few suppliers = up to 3, Several = 4-7, Crowded = 8 or more. Indicative only: not market share, and
      it does not say how big each supplier is.
  proximity:
    term: Technology proximity
    short: How close a function is to technology Skyworks / Qorvo already have (Same, Adjacent, Distant, Unrelated).
    long: >-
      Same technology (3) = a new variant of a product line already in production. Adjacent (2) = shared process or
      design know-how, new blocks needed. Distant (1) = some shared capability, mostly new. Unrelated (0) = a different
      core technology (leading-edge digital, memory, image sensors). An indicative reading of the public portfolios,
      for discussion, not a roadmap.
  tech_score:
    term: Opportunity score
    short: 0–100 weighted sum of demand 30 %, portfolio distance 25 %, architecture fit 15 %, competition 15 % and market trend 15 %.
    long: >-
      One additive score per function, with a confidence: demand (sockets in the block diagrams, background diagrams
      half, or TAM once ASP and volume are entered), portfolio distance (0 available today ... 4 new technology),
      architecture fit (door openers and our parts in the same or a connected block), competition (few suppliers 100,
      several 60, crowded 30) and market trend (growing 100, stable 60, declining 20). Missing data counts as 50 with
      low confidence. Bands are absolute: High 70+, Medium 45-69, Low below 45. Details on the Methodology page.
  market:
    term: Market
    short: The end market of an application. Automotive = vehicle systems, whatever their library category.
    long: >-
      The library category of an application, except that vehicle systems (on-board charger, traction inverter,
      telematics, radar…) count as Automotive. Used by the Markets page.
  requalify:
    term: Qualify for automotive
    short: Automotive applications need it, no part of ours is stated AEC-Q100, and at least one is stated industrial / commercial.
    long: >-
      A function automotive applications need, where none of our parts is stated automotive (AEC-Q100) and at least one
      is stated industrial / commercial: that part might be qualified instead of designing a new one. Parts whose grade
      is not stated (common on Qorvo's site) are counted separately as "grade not stated" and are not treated as
      non-automotive.
  path:
    term: Path to product
    short: How we would get a product - exists already, spec variant, new design on our technology, or new technology (partner / acquire).
    long: >-
      For a gap: Exists = we already sell parts that fill it; only the catalogue mapping is missing (confirm them on the
      evidence page). Spec variant = an existing product line with new specifications, short development. New design =
      a new product on technology we have, with new IP blocks. New technology = a process, technology or team we do not
      have: partner, license or acquire. Not ours = the customer's own chip. In the Opportunity score the path sets the
      portfolio distance (Exists 0, Spec variant 1, New design 3, New technology 4; Not ours is not scored); without a
      path the technology rating does.
  trend:
    term: Market trend
    short: Demand outlook over 3-5 years from public sources; growing 100, stable 60, declining 20 in the score (15 %).
    long: >-
      The public demand trend for the function (new standards, architectures, regulation). In the Opportunity score
      (weight 15 %): growing 100, stable 60, declining 20; a dated regulation counts as growing; no trend data = 50
      with low confidence.
  review:
    term: Review state
    short: unverified (nobody checked it yet), verified (people marked it correct), disputed (marked wrong at least as often as correct).
    long: >-
      Every rating and evidence item can be marked correct, wrong or unsure by anyone using the site. Verified = only
      correct marks; disputed = as many or more wrong marks than correct ones; unverified = not checked yet (the source
      confidence of the research, high / medium / low, is shown next to it). Disputed and unsure items with their
      comments go into the data to-do. A latest "wrong" on the data behind a score factor lowers that factor's
      confidence one step; the score itself changes only when the data is corrected.
  gap_type:
    term: Gap type
    short: True gap, probably sold already (mapping missing), competitor only, no evidence yet, or not our product type.
    long: >-
      True portfolio gap = no part of ours, and the path to product says a new variant, design or technology is
      needed. Probably sold already = the path evidence names catalogue parts that may fill it; confirm or reject them
      on the evidence page. Competitor only = only other companies have parts in BizDev. No evidence yet = a gap
      nobody has assessed. Not our product type = processors, memory and other chips we do not make. A candidate
      (one of our parts exists) is a separate state: its electrical fit to the application is not validated.
  customer_type:
    term: Customer type
    short: OEM (brand owner), Tier-1 (system supplier), module maker, ODM/EMS (contract designer / manufacturer), operator.
    long: >-
      OEM = the brand owner (a carmaker, a phone brand); Tier-1 = the system supplier that designs the electronics for
      OEMs (e.g. an on-board charger supplier); module maker = builds sub-modules (Wi-Fi modules, power modules); ODM/EMS
      = designs and / or manufactures for brands; operator / infrastructure = network or utility buyers. The design-in
      decision usually sits with whoever designs the board.
  asp_tam:
    term: ASP and TAM
    short: Entered by you; never estimated. TAM = volume × sockets × ASP.
    long: >-
      ASP (average selling price per device) and annual volume per application are the values entered earlier (the input
      page was replaced by TAM estimates per product, with sources, on Data management > TAM estimates). Nothing
      is estimated: revenue figures use only priced sockets and always show how complete the pricing is.

  euro_ncap:
    term: Euro NCAP
    short: >-
      European New Car Assessment Programme: an independent group that crash-tests new cars and gives them 0 to 5 safety
      stars. Car makers want the stars, so they add the features its tests reward, such as child presence detection.
    long: >-
      Euro NCAP (European New Car Assessment Programme) is an independent body, backed by European governments, motoring
      clubs and insurers, that tests new cars and publishes a safety rating of 0 to 5 stars. It is not a law, but a good
      rating sells cars, so car makers build in what its test protocols award points for. Its occupant-monitoring
      protocol gives points for detecting a child left alone in a locked car; it counts only direct sensing (breathing,
      heartbeat or movement), which is why car makers look for an in-cabin radar such as 60 GHz or UWB.
    href: https://www.euroncap.com/
    href_label: euroncap.com

pages:
  overview:
    question: Where do we stand across all applications, and which missing functions matter most?
    read:
      - Tiles are totals over all applications (library + background) for the portfolio chosen above.
      - The pipeline shows which analysis steps are done and which still need data.
      - Top gaps = missing functions needed by the most applications; open Gaps & new technology for all of them and the evidence behind each number.
    data:
      - Applications and sockets come from the block-diagram files (public reference designs).
      - Our parts come from BizDev (catalogue of Skyworks / Qorvo public product pages + parts with full parameters).
    limits:
      - A "Portfolio" socket means a candidate part exists, not that it meets the application's specs.
      - Without a public TAM estimate every socket weighs the same; a cheap commodity looks as big as a high-value part.
  applications:
    question: How much of each application can we fill today?
    read:
      - Coverage bar = sockets with our part ÷ in-scope sockets of that application.
      - Click an application for its blocks, statuses and a simulator to try other statuses, quantities and ASPs.
    data:
      - Library applications only (background diagrams are not listed here).
    limits:
      - Coverage counts sockets, not money. Use ASPs on the application page to see content per system.
  markets:
    question: Which functions are needed in several end markets, and which industrial parts could move to automotive?
    read:
      - A number in a market column = applications in that market that need the function; click it to list them.
      - '"Our parts / of them automotive" = our parts for the function and how many are automotive grade.'
      - '"Industrial part → qualify for automotive" = automotive needs it, we have parts, none is automotive grade.'
    data:
      - Automotive grade from the public catalogue (Skyworks states it for most parts; Qorvo rarely does).
    limits:
      - Qorvo parts shown without automotive grade may still be qualified.
  attach:
    question: When we sell product X, what else is needed in the same systems?
    read:
      - Pick one of our products; the table lists the other functions in the same applications.
      - '"How often" = in how many of those applications the function also appears.'
      - Blue (Portfolio) = cross-sell an existing part; amber (Gap / Competitor only) = a new product would be needed.
    data:
      - All diagrams, library and background.
    limits:
      - Modeled co-occurrence from diagrams, not observed sales attach rates.
  cases:
    question: Is a specific new part worth designing?
    read:
      - One case per product idea. Fill in the inputs, copy the brief into an AI assistant, paste its answer back and discuss.
    data:
      - The brief adds what BizDev knows about the function (occurrence, door openers, competition, technology fit).
    limits:
      - BizDev sends nothing to outside services; the AI's answer is only as good as its cited sources.
  explorer:
    question: Which missing functions are worth pursuing, ranked the way you choose?
    read:
      - Highest priority first (0–100): technology relation to our RF and power strengths, likeliness and diagrams; "How the score works" has the formula and tables.
      - One row per missing function; in the detailed table, a column title sorts another way.
      - Scope switches between library architectures only and all architectures including background references.
      - Gap type separates true gaps from missing catalogue mappings and from functions nobody has assessed.
      - Open a function for its evidence page (scoring factors, path, sources, reviews).
    data:
      - Reference architectures (block diagrams) for reach, door openers and sockets; evidence files for path, competition, trend; your inputs for TAM.
    limits:
      - Counts are reference architectures as drawn; related variants are not merged, so they are not unique applications or market volume.
      - The Opportunity score is the same on every page; its bands are absolute, so filters and new functions do not relabel rows.
  customers:
    question: Which companies design the systems that need a function, i.e. where should sales go hunt?
    read:
      - Pick a function to list the companies that build systems needing it, ranked by how many of those applications they cover.
      - Below, every application segment with its companies; colours show the type (OEM, Tier-1, module maker, ODM/EMS, operator).
    data:
      - BizDev's customer list, from public company pages and press releases (company names only). Segments are matched to application names by keywords.
    limits:
      - Indicative, not a customer list or account plan; who designs in-house versus buys modules varies by project.
      - An application without a matching segment shows no companies (listed at the bottom).
  capabilities:
    question: Which technologies do Skyworks and Qorvo have that a new product could build on?
    read:
      - One card per public technology platform, grouped by kind (process, filter, packaging, design IP, manufacturing).
      - '"Serves" links to the functions it supports today; "Could also" names adjacent products it could serve.'
      - Use the feedback form for a missing technology, a correction or an idea; open items become a to-do.
    data:
      - BizDev's technology list, from public company and press pages (sources on each card).
    limits:
      - Only what is public; process nodes and capacities are often not disclosed and are marked so.
  evidence:
    question: What is the full picture behind one function's rating, and is it right?
    read:
      - '"How it is scored" lists every factor in the score with its weight and reason.'
      - Path to product says how we would get there and what is still missing.
      - '"Do we already sell it?" lists catalogue parts that may fill the function; confirming one makes it count as portfolio everywhere.'
      - Background evidence (foundry route, competitor technology) informs judgement but is not in the score; patents add a small bonus to the priority score's likeliness (strong +0.10, some +0.05).
    data:
      - BizDev research from public sources (each item with a confidence), the technology ratings and the competition assessment.
    limits:
      - Research entries are indicative; several were written from public knowledge without fetching every source. Review before relying on them.
  explore:
    question: Where else could technology we already sell find a market?
    read:
      - One section per technology or product line we have; each card is one idea (market and application).
      - '"Fit" = how much of the need the existing product already covers; the grey chip is the confidence of the research.'
      - Open "public signals" for the forum threads, news, standards and products behind an idea.
    data:
      - BizDev's new-market research, from public forums, news, standards and product pages (summarised, no usernames).
    limits:
      - Exploratory and for discussion; signals show interest, not market size. Not in any score.
  quality:
    question: How far can the business data be trusted, and what should be checked next?
    read:
      - The questions are unchecked items behind the top-ranked functions and the TAM estimates, most influential first; answer Yes or No.
      - Review status per data set is on Data management > Overview.
      - Automated checks flag missing entries, inconsistent ratings, unknown ids and unsourced items.
    data:
      - Reviews and part-mapping decisions are stored in the BizDev database; the to-do export collects disputed and unsure items.
    limits:
      - A review flags an item; the data file still has to be corrected (that is what the to-do is for).
  tam:
    question: How big is the market for a product or technology, and can the figure be trusted?
    read:
      - One card per estimate, with its source and a note on how far the source can be trusted.
      - Agree or disagree with each figure; add a comment on why.
    data:
      - Examples copied from the research notes of the preliminary cases (data/business/tam.yaml), and estimates added on this page.
      - Public sources only; reviews are stored in the BizDev database.
    limits:
      - Analyst figures for the same market often differ by 2× or more; compare what each one counts.
      - These figures are not used in any score yet.
