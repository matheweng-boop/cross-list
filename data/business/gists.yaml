# Gists for research items that are HTML only (no YAML entry of their own): background notes, idea expansions,
# open questions. key: <type>:<id>; gist = one plain sentence, at most 25 words; abstract = at most 3 short
# bullets (what it says, why it matters to us, what decision it asks for). Items in YAML keep gist / abstract
# in their own entry. Owner, 25 Oct 2026: boil each research item down so it can be confirmed or ignored.
gists:
  background:auto-charging-power:
    abstract:
    - Lists each part grade, reference-design count and competitor feature of the car charging report with its source and confidence.
    - It shows how our parts were checked block by block, the effort marks per gap and the requests per host.
    - Nothing to decide here; confirm if the sources look sound, or comment on one that does not.
    gist: 'The sources behind the car charging report: every part grade, competitor feature and count with its link and
      a confidence level.'
  background:auto-clock-tree:
    abstract:
    - Lists each figure, where it came from and how sure we are (high, med, low).
    - It is how a number in the main text can be checked or challenged.
