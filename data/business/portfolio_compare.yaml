technologies:
  - id: gan_on_sic
    label: GaN-on-SiC HEMT
    owner: Qorvo
    advantage: "Highest power density and efficiency at 28-48 V up to Ka-band; DoD Trusted fab. No GaN at Skyworks."
    best_for: [infra_pa, defense_xband, rf_switch_high_power, catv]
  - id: gaas_hbt
    label: GaAs HBT (InGaP)
    owner: both
    advantage: "Linear, efficient PAs at 3-5 V; Skyworks runs it at handset/Wi-Fi/small-cell volume, Qorvo in gain blocks and CATV."
    best_for: [wifi_fem, cellular_handset_fe, infra_pa, gain_blocks]
  - id: gaas_phemt
    label: GaAs pHEMT
    owner: both
    advantage: "Low NF and broadband: Qorvo 90-150 nm for LNAs, switches, DSAs and phase shifters to 40+ GHz; Skyworks for switches and LNAs below 6 GHz."
    best_for: [lna_sub6_gnss, rf_switch_broadband, attenuators, defense_xband]
  - id: baw_filter
    label: BAW filters
    owner: both
    advantage: "Qorvo SMR BAW in production for 2-7 GHz coexistence and n77/n79; Skyworks BAW from Osaka is in Wi-Fi filters (Preview) and its timing resonators."
    best_for: [filters, wifi_fem, smallcell_receive]
  - id: tc_saw_filter
    label: SAW / TC-SAW
    owner: both
    advantage: "Low-cost sub-3 GHz filtering; Skyworks integrates it in Sky5 modules and GNSS LNA FEMs, Qorvo sells standalone SAW/IF filters."
    best_for: [cellular_handset_fe, lna_sub6_gnss]
  - id: rf_soi
    label: RF SOI
    owner: both
    advantage: "Small, low-cost switches, tuners and LNAs; Skyworks leads antenna switch/tuning, Qorvo high-isolation SOI switches."
    best_for: [antenna_switch, rf_switch_high_power, automotive_rf]
  - id: sip_module_integration
    label: SiP / front-end module integration
    owner: both
    advantage: "Skyworks Sky5 double-sided shielded modules are the volume reference; Qorvo integrates GaN/GaAs FEMs for X-band and switch-LNA modules."
    best_for: [cellular_handset_fe, wifi_fem, smallcell_receive, defense_xband]
  - id: digital_isolation_capacitive
    label: Capacitive digital isolation
    owner: Skyworks
    advantage: "Fast (13-14 ns, 150 Mbps) CMOS isolation; new generations at 6 kVrms and 100-200 kV/us CMTI."
    best_for: [isolation]
  - id: timing_baw_resonator
    label: BAW-resonator / DSPLL timing
    owner: Skyworks
    advantage: "Femtosecond-class jitter without an external crystal; one clock tree for radios, BBUs and optics."
    best_for: [timing, infra_pa, defense_xband]
  - id: uwb_soc
    label: UWB SoCs (IEEE 802.15.4z)
    owner: Qorvo
    advantage: "Market-leading UWB heritage (Decawave) with automotive and Apple-interoperable parts."
    best_for: [uwb, automotive_rf]
  - id: mmwave_beamformer
    label: Silicon beamformers (Anokiwave)
    owner: Qorvo
    advantage: "Multi-channel beamformer ICs for X-band to 43.5 GHz arrays, pairing with Qorvo GaN/GaAs FEMs."
    best_for: [beamformers_mmwave, defense_xband]
  - id: pmic_configurable_power
    label: Configurable PMICs and motor-control SoCs
    owner: Qorvo
    advantage: "Programmable power and motor-control SoCs / drivers up to 160 V; low-noise point-of-load bucks for radio boards."
    best_for: [power_management]

