# Possible customers per sub-system and region (owner, 9 Nov 2026: "Include possible customers for each region
# (Americas, EMEA and Asia). If customers overlap between regions, add them for all regions.")
#
# Companies that publicly BUILD the systems of a sub-system (OEMs, Tier-1s, ODMs, module makers): possible
# customers, never a customer list, and never a claim that they buy from Skyworks or Qorvo. Names only from public
# sources the site's runs pulled themselves, each with its link and the date it was read; no private list, nothing
# from memory (owner, 26 Oct 2026).
#
# Built from two places (app/services/possible_customers.py):
# - data/business/customers.yaml (Markets & customers): the segments listed under `subsystems` below; only the
#   companies there with a checked public source (`evidence`, read on the segment's check date) are used;
# - `extra` below: companies from the public sources under `sources`, read in the run of 9 Nov 2026 or earlier runs.
# Region: Americas, EMEA (Europe, Middle East, Africa) or Asia (incl. Asia-Pacific). A company sits in the region
# of its headquarters (customers.yaml `region`); `presence` adds the regions where its own public pages (or the
# entity names it uses in a public association list) show significant operations, design or manufacturing, so it
# appears in each of them. Companies listed as "Global" with no checked headquarters stay under "Region not checked".
note: "Companies that publicly build these systems (possible customers); not a customer list."
max_per_region: 8

# where each region comes from
hq_region:
  US: Americas
  Canada: Americas
  Brazil: Americas
  Europe: EMEA
  Israel: EMEA
  China: Asia
  Japan: Asia
  Korea: Asia
  India: Asia
  Taiwan: Asia
  Thailand: Asia
  Australia: Asia

# source types: company page | public annual report | press release | trade publication | association list |
# industry specification
sources:
  ccc_members: {title: "Car Connectivity Consortium: member list", url: "https://carconnectivity.org/our-members/member-list/", date: 2026-11-09, type: association list}
  gaa_members: {title: "5GAA: members", url: "https://5gaa.org/members/", date: 2026-11-09, type: association list}
  gaa_devices: {title: "5GAA: List of C-V2X devices (technical report, April 2024)", url: "https://5gaa.org/content/uploads/2024/12/5gaa-list-of-c-v2x-devices.pdf", date: 2026-10-20, type: trade publication}
  fira_members: {title: "FiRa Consortium: members", url: "https://www.firaconsortium.org/about/members", date: 2026-11-09, type: association list}
  ocp_bbu: {title: "Open Compute Project: Open Rack V3 BBU module specification 1.4", url: "https://www.opencompute.org/documents/open-rack-v3-bbu-module-spec-1-4-pdf/", date: 2026-11-09, type: industry specification}
  ocp_deschutes: {title: "Open Compute Project: Project Deschutes (coolant distribution unit) specification 1.0", url: "https://www.opencompute.org/documents/ocp-specification-deschutes-v1-0-pdf/", date: 2026-11-02, type: industry specification}
  ocp_cooling: {title: "Open Compute Project: Cooling Environments project", url: "https://www.opencompute.org/projects/cooling-environments/", date: 2026-11-02, type: industry specification}
  bosch_research: {title: "Bosch: research locations", url: "https://www.bosch.com/research/about-bosch-research/research-locations/", date: 2026-11-09, type: company page}
  mobis_intro: {title: "Hyundai Mobis: company introduction 2026", url: "https://www.mobis.com/resources/pdf/2026_MOBIS_EN.pdf", date: 2026-11-09, type: company page}
  delta_innovation: {title: "Delta Electronics: innovation (R&D hubs)", url: "https://www.deltaww.com/en-US/company/innovation", date: 2026-11-09, type: company page}
  delta_emea: {title: "Delta Electronics: business in EMEA", url: "https://www.deltaww.com/en-GB/company/operations-in-emea/business-in-emea", date: 2026-11-09, type: company page}
  valeo_korea: {title: "Valeo: presence and activities in South Korea", url: "https://www.valeo.com/en/south-korea/", date: 2026-11-09, type: company page}
  valeo_mcallen: {title: "Valeo: new plant in McAllen, Texas (25 Mar 2026)", url: "https://www.valeo.com/en/valeo-breaks-ground-on-225-million-high-tech-plant-in-mcallen-texas-for-software-defined-vehicle-technology/", date: 2026-11-09, type: press release}
  zf_usa: {title: "ZF in the USA and Canada", url: "https://www.zf.com/usa_canada/en/home/home.html", date: 2026-11-09, type: company page}
  magna_history: {title: "Magna: our history", url: "https://www.magna.com/company/company-information/facts-history/our-history", date: 2026-11-09, type: company page}

# regions beyond the headquarters, from the company's own pages or the entities it lists in an association
presence:
  "Bosch": {regions: [EMEA, Americas, Asia], where: "HQ Germany; research sites in the US, Mexico, Brazil, China, India and Japan", sources: [bosch_research]}
  "Hyundai Mobis": {regions: [Asia, Americas, EMEA], where: "HQ Korea; R&D in Plymouth MI (US), Frankfurt (Germany), Shanghai and Hyderabad", sources: [mobis_intro]}
  "Delta Electronics": {regions: [Asia, Americas, EMEA], where: "HQ Taiwan; power-electronics lab in North Carolina (US); 15 R&D centers and 4 plants in EMEA", sources: [delta_innovation, delta_emea]}
  "Valeo": {regions: [EMEA, Asia, Americas], where: "HQ Europe; R&D center and plants in South Korea; new plant in McAllen, Texas (US)", sources: [valeo_korea, valeo_mcallen]}
  "ZF": {regions: [EMEA, Americas], where: "HQ Europe; major supplier with sites in the US and Canada", sources: [zf_usa]}
  "Magna": {regions: [Americas, EMEA, Asia], where: "HQ Aurora, Ontario (Canada); European operations, joint ventures in China, manufacturing in India", sources: [magna_history]}
  "Denso": {regions: [Asia, EMEA], where: "HQ Japan; Denso Automotive Deutschland GmbH is a 5GAA member", sources: [gaa_members]}
  "Huawei": {regions: [Asia, EMEA], where: "HQ China; Huawei Technologies Duesseldorf GmbH is a 5GAA member", sources: [gaa_members]}
  "Forvia Hella": {regions: [EMEA, Asia], where: "Hella GmbH & Co. KGaA (Germany) and Hella Shanghai Electronics are CCC members", sources: [ccc_members]}
  "Kostal": {regions: [EMEA, Asia], where: "KOSTAL Automobil Elektrik GmbH & Co KG and Kostal (Shanghai) are CCC members", sources: [ccc_members]}
  "Tokai Rika": {regions: [Asia, EMEA], where: "Tokai Rika (Jiangsu) and Tokai Rika Belgium are CCC members", sources: [ccc_members]}
  "Marquardt": {regions: [EMEA, Asia], where: "Marquardt GmbH, Marquardt India and Marquardt Switches (Shanghai) are CCC members", sources: [ccc_members]}
  "Huf": {regions: [EMEA, Americas], where: "Huf Hülsbeck & Fürst GmbH & Co. KG and HUF North America Automotive are CCC members", sources: [ccc_members]}

