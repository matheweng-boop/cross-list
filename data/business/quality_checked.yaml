# Data quality comments the daily run has checked (Data management > Data quality).
#
# The owner answers the Data quality questions with a comment and Submit (owner, 25 Oct 2026: no yes / no there).
# The item then shows "Comment received – being checked" and the comment is listed in the inbox section
# "Data quality comments (being checked)". The daily run checks it, applies it (fixes the data) or finds out why the
# value stands, and adds the item here: the site then asks the owner again (second round) as
# "Checked: <note> – OK now?", with the comment box again and one "Looks right now" button.
#
# Who writes it: the daily run (it cannot write the live database). A new comment after the check (second round)
# shows "being checked" again until the entry is updated with the new comment_at, date and note.
#
# Fields
#   dataset     the item's data set as in the inbox line (tam, technology, path, competition, trends, ...)
#   key         the item's key as in the inbox line (estimate id or function id)
#   date        when it was checked (YYYY-MM-DD)
#   comment_at  the time of the newest comment this check covers, as printed in the inbox ("YYYY-MM-DD HH:MM", UTC)
#   note        what was done or found, in one or two plain sentences (shown to the owner)
checked:
  - dataset: competition
    key: pol_ldo
    date: 2026-10-26
    note: "You answered Yes: all 12 listed companies sell LDO regulators. List kept as it is; Analog Devices, Microchip, Diodes and Torex stay listed though their sites could not be read automatically."
  - dataset: competition
    key: efuse_hotswap
    date: 2026-10-26
    note: "You answered Yes: all 11 listed companies sell eFuses or hot-swap controllers. List kept as it is; Analog Devices, MPS and Diodes stay listed though their sites could not be read automatically."
