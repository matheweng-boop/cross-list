  - slug: iso7821dww-isolation
    gist: "TI sells 14.5 mm extra-wide isolators; ours stop at 8 mm: enough in the car, not for 1500 V solar or storage."
    abstract:
      - "TI and Novosense offer 14.5–15 mm creepage; none of our digital isolators passes 8 mm."
      - "Outside the car (1500 V solar, storage, 1000 V chargers, 800 V DC data centers) we lose sockets without a wider package."
      - "Decide whether the extra-wide isolation business case should go ahead (it is carried on in hv-extra-wide-isolation)."
    title: 'Reinforced digital isolators for power, charging and cars: TI ISO7821DWW and our 8 mm limit'
    kind: report
    area: Power & isolation
    app_type: Power and charging
    date: 2026-10-21
    status: draft
    see_also: [hv-extra-wide-isolation]
    question: TI's ISO7821DWW is a reinforced dual-channel digital isolator in a 16-pin extra-wide SOIC (DWW). Which Skyworks
      solutions apply in power conversion, charging (on-board chargers, DC fast chargers) and automotive, and is there a business
      case for an extra-wide-package isolator?
    summary: 'Research idea for a business case. ISO7821DWW: 2 channels (1/1), reinforced, 5.7 kVrms, 14.5 mm creepage, 100
      Mbps, 85 kV/µs, industrial grade. Our closest crosses (Si86S621/622, SSO-8) are reinforced 6 kVrms, 100 kV/µs, 150 Mbps,
      with automotive versions, but none of our 672 digital isolators passes 8 mm creepage, while TI (20 parts) and Novosense
      (6) offer 14.5–15 mm. What 800 V needs (IEC 60664-1, sealed housing = pollution degree 2, group I mould compound):
      reinforced 8.0 mm at 800 V and 10 mm at 1000 V, so 8 mm is just enough at 800 V but not for a fully charged 800 V
      battery or a 1000 V system; where condensation or conductive dust is expected (pollution degree 3) only 14.5 mm works.
      TI prices DWW reels like DW reels ($2.60 vs $2.64 at 1k). Adjacent: our isolated gate drivers, isolated DC-DC and
      isolated amplifiers in the same charger and inverter designs. Ranked applications (21 Oct): 1500 V solar and storage
      need about 15 mm, 800 V DC data centers at 3000 m and 1000 V chargers and wind converters 9–11 mm, rail 18–20 mm;
      inside the car (PD2) 8 mm covers 800 V. Our AN1456 announces an ultra-wide SOIC (>15 mm): business case
      hv-extra-wide-isolation.'
    tags:
    - ISO7821DWW
    - digital isolator
    - reinforced isolation
    - creepage
    - on-board charger
    - DC fast charger
    - EV charging
    - power conversion
    - Si86S621
    - automotive
    - pollution degree
    - 800 V
    - 1500 V
    - solar inverter
    - BESS
    - data center
    sources: BizDev parts database (TI, Skyworks, Novosense digital isolators) and cross results; block-diagram library (71
      of 224 diagrams); TI reference designs TIDA-00785, TIDA-010054, TIDA-01606, TIDA-010210; library topic on
      traction-inverter isolation; public creepage notes (TI SLUP419/SLUP421, SLUAAR5, SLLA469, SSZTAI4, SBAA527; MINMAX;
      Vishay; Skyworks AN583 and AN1456; CONEC; EV Engineering; a TÜV IEC 62109-1 report; TI E2E; Wolfspeed forum), market
      pages (SolarPower Europe, Wood Mackenzie, GWEC, NVIDIA, UNIFE) and the TI ISO7821 product page (prices), 21 Oct 2026.
    decision: Should we answer TI's extra-wide isolators (ISO7821DWW, 14.5 mm) by putting our isolator dies into the ultra-wide
      SOIC (>15 mm) that AN1456 announces?
    answer:
      text: 'Yes, worth a business case, but only outside the car: 1500 V solar and storage, 1000 V chargers and 800 V DC
        data-center power. Inside the car 8 mm covers 800 V. The case hv-extra-wide-isolation carries the decision on.'
      conf: med
    needed_now:
    - 'Isolation BU: release date, first dies and working-voltage rating of the ultra-wide SOIC'
    - 'Sales: which customers asked for ISO7821DWW or 15 mm parts, and at what volume'
    say_externally: Reinforced isolation at 1000 to 1500 V needs about 15 mm creepage, more than standard wide-body packages
      give. Skyworks' application note AN1456 explains creepage and clearance for these systems. We would like to hear which
      creepage and working voltage your safety assessor asks for.
    next_steps:
    - what: Take the decision to the extra-wide isolation case
      who: Daily run
      why: The case prices an ultra-wide family and lists the BU and customer questions; this report only shows where more
        than 8 mm matters.
      case: hv-extra-wide-isolation
    - what: Ask when the ultra-wide SOIC is released, which dies go in first and at what working voltage
      who: Isolation BU
      why: Without a date and a rating of about 2000 Vrms the 1500 V sockets cannot be quoted.
    - what: Ask which customers asked for ISO7821DWW or 15 mm parts, in which product
      who: Our FAE / sales
      why: Real requests show which market comes first and at what volume.
    bu_opener:
      question: TI sells ISO7821DWW, a 2-channel reinforced isolator in an extra-wide package (14.5 mm creepage) for high-voltage
        power and charging, at the same reel price as its 8 mm version. Our nearest parts (Si86S621/622) stop at 8 mm, which
        is just enough for a reinforced barrier at 800 V in a sealed box (so inside the car), but not for 1500 V solar and
        storage (about 15 mm), 1000 V chargers or where condensation is expected. Our AN1456 already announces an ultra-wide
        SOIC (>15 mm). Which dies should go into it first?
      pros:
      - Si86S621/622 beat it on CMTI (100 vs 85 kV/µs), isolation rating (6 vs 5.7 kVrms) and data rate (150 vs 100 Mbps)
      - Automotive (AEC-Q100) versions exist (-AS4); ISO7821DWW is industrial grade
      - 'Large isolator line (672 parts in BizDev) and the neighbours in the same designs: isolated gate drivers, isolated DC-DC,
        isolated amplifiers'
      - Our announced ultra-wide SOIC (>15.0 mm creepage) clears the 15 mm a TÜV assessor asked for at 1500 V; TI's 14.5 mm does not
      cons:
      - No Skyworks isolator above 8 mm creepage; TI (20 parts) and Novosense (6) offer 14.5–15 mm. A reinforced barrier
        needs 10 mm at 1000 V (pollution degree 2) and 20 mm at 800 V (pollution degree 3)
      - TI charges no premium for the extra-wide reel (ISO7821DWWR $2.60 vs DWR $2.64 at 1k), so a wider package wins
        sockets, not price
      - Lower working voltage (2121 vs 2828 Vpk) and narrower temperature range (–40 vs –55 °C at the low end)
      - 'Different package and pinout (8 vs 16 pins): no drop-in; Novosense NSI8321W1 is closer (15 mm, 7.5 kVrms); crowded,
        price-driven market'
      vs: TI ISO7821DWW; Novosense NSI8321W1 / NSI8322W1; ADI, Infineon, ST, onsemi, Toshiba, Rohm and Chinese suppliers
    learn:
    - age: 5
      text: 'Some parts of a machine carry dangerous high voltage, others carry tiny safe signals. A digital isolator is a wall
        with a window: the message gets through, the danger does not.'
    - age: 10
      text: Electric cars, chargers and solar inverters work with hundreds of volts. The small computer that controls them must
        talk to the high-voltage side without getting hurt, and so must the people who touch the car or the charger.
    - age: 15
      text: A digital isolator passes on/off signals across an insulating barrier. It is judged by the voltage the barrier withstands
        (kVrms for one minute, working voltage for its lifetime), the distance between the pins on the outside of the package
        (creepage), how fast the voltage may jump without errors (CMTI), speed and temperature grade.
    - age: 20
      text: The request comes from a TI part, ISO7821DWW, seen in power, charging and automotive designs. Its extra-wide package
        gives 14.5 mm creepage, which allows higher working voltages and dirtier environments (a higher pollution degree,
        from a sealed box, PD2, to a place with condensation or conductive dust, PD3). In BizDev, digital isolators
        sit in 71 of 224 application diagrams, among them on-board chargers, DC fast chargers, wallboxes and traction inverters.
        The places where more than 8 mm is really needed are 1500 V solar inverters and battery storage (about 15 mm), 800 V DC
        data-center power at high altitude, 1000 V chargers and wind converters; rail needs even more. Inside a car the
        high-voltage boxes are sealed (pollution degree 2), so 8 mm covers 800 V there.
    - age: 25
      text: 'TI leads with wide and extra-wide packages; Novosense offers 15 mm parts; ADI, Infineon, ST, onsemi and Chinese
        suppliers crowd the market. Our capacitive isolators (Si86xx, Si88xx) match or beat ISO7821 on CMTI and kVrms and come
        in automotive grade, but our widest package gives 8 mm. Per IEC 60664-1 (as reproduced by TI and MINMAX), a reinforced
        barrier with group I mould compound needs 8 mm at 800 V and 10 mm at 1000 V in a sealed box (pollution degree 2),
        and 20–25 mm where condensation is expected (pollution degree 3), which coating, potting or sealing avoids. TI sells
        the 14.5 mm reel at the 8 mm price, but asks about 60 % more for its 15.7 mm isolated amplifier. A TÜV assessor asked
        for 15 mm at 1500 V and refused 14.5 mm. Our AN1456 announces an ultra-wide SOIC with more than 15 mm creepage; the
        business case (hv-extra-wide-isolation) proposes isolators, isolated amplifiers and gate drivers in it. Open: release
        date, working-voltage rating and cost of that package.'
    learn_links:
    - label: Creepage
      href: /engineering/creepage_mm
    - label: Basic vs reinforced isolation
      href: /engineering/isolation_class
    - label: Isolation rating
      href: /engineering/isolation_rating_kvrms
