  - slug: iso-current-sense-charging
    title: 'Fully integrated isolated current sensing for EV charging: our Si89xx shunt amplifier with built-in isolated power, and a built-in shunt for small currents'
    kind: idea
    area: Power & isolation
    app_type: Power and charging
    feasibility: 2
    feasibility_why: "Existing Si89xx amplifier die and the Si86Px in-package isolated power stage in one package; needs a reinforced rating and AEC-Q100. The built-in shunt is further away (new technology)"
    date: 2026-10-23
    status: draft
    see_also: [auto-hv-hot-swap, iso7821dww-isolation]
    question: Is there a market for an isolated current-sense amplifier with built-in isolated power (and, for small currents, a
      built-in shunt) in on-board chargers, DC fast chargers and wallboxes, how accurate must it be, and can Skyworks build it
      from the Si89xx dies and the Si86Px integrated power against TI, ADI, Allegro, Infineon, Melexis and LEM?
    summary: >-
      Business-case draft on the owner's 23 Oct question. Built-in isolated power: yes, TI sells a family (AMC3301, AMC3302-Q1,
      AMC3306M05-Q1) and uses it in two of its three 800 V charger reference designs; AMC3301 reel lists at $1.65 (1k).
      Built-in shunt: only for small currents, where integrated Hall sensors already serve (TI TMCS1123, 80 A, ±1.4 %
      uncalibrated, about $2); no isolated amplifier with a built-in shunt found. Our Si8921BD die matches TI's accuracy and
      beats it on noise (82 vs 71 dB) and bandwidth (600 vs 334 kHz), total static error about ±0.5 % RSS (AN1270), but
      needs a separate high-side supply and has 50 kV/µs CMTI. Proposal: Si89xx die + Si86Px power stage in one reinforced
      automotive package, about $1.5–1.9 (est). Market: current sensors $3.35 B in 2026 to $6.39 B by 2032 (analyst PR).
    tags: [isolated amplifier, current sensing, shunt, integrated DC-DC, isolated power, EV charging, on-board charger, DC fast charger, wallbox, AMC3301, AMC3302, TMCS1123, Si8921, Si8941, Si86Px, error budget, pricing]
    sources: "BizDev parts database (Skyworks and TI isolated amplifiers), Skyworks AN1270 and the Si86Px datasheet (cache); TI product pages AMC3301 and TMCS1123 and a MarketsandMarkets press release (read 23 Oct 2026); TI reference designs and IEA figures recorded for the extra-wide isolation case; every figure in the background notes"
    decision: Should we combine an Si89xx sensing die with the Si86Px isolated power stage into one reinforced automotive
      part (Si89xx-P) for EV chargers, and is a built-in shunt worth it?
    answer:
      text: 'Yes for built-in power: TI proves the demand and our die is as accurate and quieter. Not yet for the built-in
        shunt, since Hall sensors already serve small currents. It hinges on Si86Px reaching a reinforced, automotive rating
        (est).'
      conf: med
    needed_now:
    - 'Isolation BU: can the Si86Px power stage share a package with the Si892x / Si894x die and reach reinforced and AEC-Q100?'
    - 'Isolation BU: what it takes to raise CMTI from 50 to at least 100 kV/µs'
    - 'One charger customer: the current error needed per sense point, and how they power the high side today'
    say_externally: In 800 V chargers every current measurement across the barrier needs an isolated amplifier and its own
      floating supply. Skyworks sells reinforced, automotive isolated amplifiers (Si89xx) and isolated bias supplies today.
      We would like to understand how you power the high side of each sense point and what accuracy you need over temperature
      and lifetime.
    next_steps:
    - what: Ask whether the Si86Px power stage and the Si892x / Si894x die fit one reinforced, AEC-Q100 package
      who: Isolation BU
      why: Decides whether Si89xx-P is feasibility 2 or needs a new power stage.
    - what: Ask about the error budget per sense point and how the high side is powered
      who: OBC / DC-charger hardware lead, through our FAE
      why: Gives the accuracy target and what one part with built-in power saves them.
    - what: Offer Si8921BD / Si8941BD-AS4 with Si88xx bias and the AN1270 error budget in current charger designs
      who: Our FAE
      why: Wins sockets today and shows how often customers ask for built-in power.
    bu_opener:
      question: In EV chargers every current measurement across the high-voltage barrier needs an isolated amplifier and its own
        floating supply. TI sells amplifiers with the isolated supply built in (AMC3301 at $1.65, AMC3302-Q1) and uses them in its
        800 V charger designs. Our Si89xx dies are as accurate and quieter, and Si86Px already has an in-package isolated power
        stage. Should we combine the two into one reinforced automotive part, and is a built-in shunt worth it?
      pros:
      - 'Our analog die beats AMC3301 on noise (82 vs 71 dB SNR) and bandwidth (600 vs 334 kHz) at the same 0.2 % gain error,
        and isolates 5 kVrms vs 4.25 kVrms'
      - The in-package isolated power stage exists (Si86Px, 0.5 W); an amplifier needs about 30 mW
      - Sold with our gate drivers, isolators and isolated bias in the same charger
      cons:
      - TI has sold integrated-power isolated amplifiers since 2019, at a low list price ($1.65 at 1k)
      - 'CMTI 50 kV/µs on our die vs 85 kV/µs (TI) and 100+ for SiC: needs a die change'
      - Below about 80 A integrated Hall sensors (TMCS1123, Allegro, Melexis, Infineon) need no shunt and no supply at all
      vs: TI AMC3301 / AMC3302-Q1 / AMC3306M05-Q1 and TMCS1123; ADI; Allegro; Infineon; Melexis; LEM modules
    learn:
    - age: 5
      text: A charger has to know how much electricity flows, but the strong electricity must stay away from its small brain.
        A special chip measures it through a safe wall.
    - age: 10
      text: The chip measures a tiny voltage across a small resistor (a shunt) that the current flows through, and sends the
        answer across an insulating wall. The measuring side sits on the dangerous side, so it needs its own little power supply.
    - age: 15
      text: 'An isolated amplifier is judged by its error (gain error, offset, nonlinearity, and how they drift with temperature),
        its isolation rating, its speed and how well it ignores fast voltage jumps (CMTI). The shunt adds its own error. Building
        the power supply into the chip saves parts and space.'
    - age: 20
      text: The owner asked in the 23 Oct review whether there is a market for a shunt amplifier with a built-in DC-DC (and shunt).
        There is, as TI sells several and uses them in its own 800 V charger designs. Built-in shunts exist only as Hall sensors with
        the conductor in the package, up to about 80 A. On-board chargers, DC fast chargers, wallboxes and battery boxes are the
        targets.
    - age: 25
      text: 'TI AMC3301 / AMC3302-Q1 (built-in DC/DC, 4.25 kVrms, $1.65 at 1k) and TMCS1123 (Hall, 80 A, ±1.4 %, about $2) set the
        bar; Allegro, Melexis, Infineon and LEM cover Hall and modules. Our Si8921BD / Si8941BD match TI on accuracy (about ±0.5 %
        total static error, AN1270) and beat it on noise and bandwidth, but need a separate supply and have lower CMTI. Proposal:
        Si89xx die + Si86Px power in one reinforced automotive package; a built-in shunt only later.'
