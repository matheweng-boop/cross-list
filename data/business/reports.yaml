      href: /visuals#dbm
  - slug: auto-redcap-ecall
    title: "NG-eCall and RedCap: a one-transmitter front end for value TCUs"
    kind: idea
    area: Automotive telematics
    app_type: Automotive
    feasibility: 1
    feasibility_why: "One-transmitter module from existing SKY5A2206 dies and duplexers"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (now with Qorvo) offer for the low-cost LTE Cat-1bis / 5G RedCap telematics unit that every new EU car needs for NG-eCall from 2026–2027, against Qualcomm's modem with its own RF front end, Murata, and MediaTek / Quectel modules, and at what price?"
    summary: >-
      Business-case draft. EU NG-eCall (new types from 1 Jan 2026, all new vehicles from 1 Jan 2027) and 2G/3G
      switch-offs put an LTE or 5G TCU in about 12 M EU cars and vans a year; RedCap SOPs start about 2028. We have a
      qualified automotive cellular set and low-cost IoT front ends that work with any modem, but the set is sized for
      4×4 MIMO, Qualcomm's A10 RedCap modem comes with its own front end and Chinese vendors set Cat-1bis prices.
      Proposal: one regional single-transmit module (PA + duplexers + switch) for Cat-1bis, Cat-4 and RedCap plus an
      optional second receiver, about $2.2–3.4 and $0.6–1.0 in volume (est), with a satellite-port option.
    tags: [automotive, telematics, NG-eCall, RedCap, eRedCap, LTE Cat-1bis, 2G/3G sunset, Qualcomm A10, MediaTek, Quectel, US connected-vehicle rule, pricing]
    sources: "BizDev block-diagram library and catalogue; 5GAA eCall position paper; Skyworks product summaries; Marelli release; search snippets (EUR-Lex/LawPlayer, ACEA, ABI, Qualcomm, BIS, Counterpoint, ResearchAndMarkets); about 8 new public web requests (background notes)"
    bu_opener:
      question: Every new EU car needs an LTE or 5G emergency-call unit from 2027 (NG-eCall), about 12 M cars and vans a year.
        Should we offer one single-transmit front-end module for Cat-1bis, Cat-4 and RedCap at about $2.2–3.4 (est), when Qualcomm's
        A10 comes with its own front end and Chinese vendors set Cat-1bis prices?
      pros:
      - Qualified automotive cellular set today (SKY5A2206, SKY5A2205, SKY5A2203, SKY5A5010)
      - 'Works with any modem: fits RedCap and Cat-1bis modems without their own front end (MediaTek, UNISOC, Sequans)'
      - With Qorvo, BAW/SAW filters and automotive antenna switches in house
      cons:
      - Qualcomm's A10 RedCap modem comes with Qualcomm's own front end
      - Cat-1bis is a Chinese-led, price-driven market
      - Our set is sized for 4×4 MIMO 5G (up to 7 parts); RedCap needs 1 transmitter and 1–2 receivers
      vs: Qualcomm, Murata, MediaTek / Quectel modules, Chinese PA vendors
    learn:
    - age: 5
      text: If a car has an accident, it can call for help by itself, even if nobody inside can speak.
    - age: 10
      text: In Europe every new car must have this automatic emergency call (eCall). The old 2G and 3G networks are switching
        off, so new cars need a 4G or 5G phone inside, at least for this.
    - age: 15
      text: The emergency-call unit needs one transmitter, one or two receivers and the regional bands, and it must survive
        a crash (backup antenna). It must be very cheap, because many cars have it only because the law asks for it.
    - age: 20
      text: 'The request comes from EU NG-eCall: new types from 1 Jan 2026, all new vehicles from 1 Jan 2027, about 12 M EU
        cars and vans a year; 5G RedCap units start about 2028. Low-cost modems without their own front end need an external
        one.'
    - age: 25
      text: 'Qualcomm''s A10 RedCap modem bundles its front end; Murata and MediaTek/Quectel modules compete; Chinese PA vendors
        set Cat-1bis prices. Our automotive set is qualified but sized for premium 4×4 MIMO. The proposal: one regional single-transmit
        module (PA + duplexers + switch) with an optional second receiver and a satellite-port option.'
