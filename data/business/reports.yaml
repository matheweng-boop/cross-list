      barrier at 1000–1500 V (1500 V solar and storage need about 15 mm; a TÜV assessor refused TI's 14.5 mm), in 800 V DC
      data-center power rated for 3000 m (9.1 mm clearance) and at pollution degree 3. Inside a car (sealed, PD2) 8 mm
