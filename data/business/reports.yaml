# Research & ideas (Future growth > Research & ideas): research reports and preliminary product ideas and cases.
# One entry per report; the body is app/web/templates/business/reports/<slug>.html (HTML, the site's .rpt styles).
# kind: report (market / technology survey) | idea (a preliminary product idea)
# status: draft (not reviewed) | reviewed | archived
#
# How a report is laid out (the owner's priorities, most interesting first):
#   1. Adjacent products and technologies: what sits next to the topic that we already have or could build
#      (neighbouring parts, IP, processes, acquisitions), and how it combines into a product.
#   2. Where else we see opportunities or devices: other applications, markets and customer systems that need it.
#   3. Market research: the overall trend and development (size, growth, technology shifts, competitors).
# Open with a short summary box and the portfolio position; close with risks and sources.
#
# Business cases for a product idea (kind: idea) use this order, so cases can be compared side by side:
#   In brief · 1. Architecture position (where our blocks sit in the library diagrams vs each competitor, and fit
#   with where the architecture is going) · 2. Our disadvantages and how we make up for them · 3. Reasoning chain
#   (trend -> evidence -> meaning for us) · 4. Market data (value, source, confidence) · 5. Scenarios (for / against)
#   · 6. Product definition (reuses, new, outputs, replaces, answers, delivery) · 7. Pricing (anchor, value,
#   entry / target / premium, assumptions) · 8. Raising the attach rate · 9. Risks and open questions · Sources,
#   with every figure and link in <slug>.background.html. Confidence: high / med / low; "est" marks our estimates.
#   Preliminary cases are structured data: data/business/cases/<slug>.yaml (template: _template.yaml; method page
#   /business/reports/method), and the body template only includes business/_prelim.html.
#
# Grouping fields (Research & ideas groups by these):
#   app_type         application type, e.g. Automotive | Car radio | RF filters (the page groups by it; default Other)
#   feasibility      product ideas only: 1 very close to today's portfolio (firmware, packaging, existing dies) |
#                    2 in between (a new chip from technology we already have) | 3 furthest away (new technology or a
#                    market nobody plays in yet: out-of-the-box thinking, still worth a look)
#   feasibility_why  one line: why this score
#
# Conversation and learning fields (every report and case; Research & ideas renders them):
#   bu_opener        the FIRST question to the business unit: the background question and idea, short, as a
#                    conversation starter, with pros (for us) and cons (against us) versus the competition and vs (who)
#   learn            "Learn about this" tab: one short paragraph each for age 5, 10, 15, 20 and 25 (what it is, why it
#                    matters, what it needs, where the request comes from, competitors and where we stand)
#   learn_links      knowledge-base pages to read next: {label, href} on /library, /rf-notes, /engineering, /visuals
#   see_also         slugs of related reports or cases (a research report and the business case built on it), shown
#                    as "See also" links under the report's header
#   expanded         date the "Applications in depth" section was added for the owner's "Expand this idea" request
#                    (section <section id="applications-in-depth"> in the body; docs/daily_update.md); marks the
#                    request done, so the page shows "Expanded" with a link to the section
#
# Gist fields (owner, 25 Oct 2026: shown first on the page, on the cards and in Data management > To confirm):
#   gist             one plain sentence, at most 25 words: the single idea of the report ("est" marks our estimates)
#   abstract         at most 3 short bullets: what it says, why it matters to us, what decision it asks for
#                    (a business case, kind: idea, keeps both in data/business/cases/<slug>.yaml instead)
#
# Storyline fields (owner, 24 Oct 2026: one theme through every report; shown as the "Bottom line" under the title, as
# "Next steps" at the end and as one line per card on Research & ideas; checked by reports.story_problems):
#   decision         the one question the report answers, phrased as a decision for Skyworks ("Should we ...?")
#   answer           {text, conf}: the short answer today in one or two sentences; conf high | med | low. If the content
#                    does not support an answer, start with "Not enough data yet" and say what would settle it; "est"
#                    marks our estimates
#   needed_now       one to three things that decide or unblock it now (data, a BU answer, a customer check)
#   say_externally   two or three sentences the owner can say to a customer, partner or colleague outside the team:
#                    public facts and our public portfolio only, phrased as an interest or a question, never a
#                    commitment; no internal plans, prices or estimates, nothing confidential, never where parts are made
#                    (words like internal, roadmap, margin, fab, est are refused)
#   next_steps       exactly three {what, who, why} (who: a BU, a customer type, our FAE, a standard or the daily run);
#                    optional case: <slug> when the step hands over to a business case (see_also pairs share or hand over
#                    the decision)
# Thread lines: every main section of a report body ends with <p class="rpt-thread"><b>For the decision:</b> ...</p>;
# a preliminary case has the same lines as thread: {section: text} in its case YAML (sections: reports.CASE_THREADS).
reports:
  - slug: radio-auto-fit
    gist: "Around our automotive tuners, 11 part groups are car-ready, 6 need work, 6 only lack AEC-Q; audio, interfaces and protection stay gaps."
    abstract:
      - "Tuners, decoders, two low-band switches, a satellite-radio LNA, clock buffers and a 2 MHz buck are AEC-Q today."
      - "Si468x receivers, wide-band SPDTs, the Si510/511 oscillator and a PMIC only lack qualification; consumer tuners and audio need redesign."
      - "Decide which of the six to qualify first, and to leave audio, CAN/Ethernet and protection to partners."
    title: "Car radio: which of our parts fit each block for automotive, which need work and which only lack qualification"
    kind: report
    area: Broadcast radio
    app_type: Car radio
    feasibility: 1
    feasibility_why: "Most moves qualify parts we already sell (AEC-Q100 runs, PPAP); only the audio and power blocks would need new designs"
    date: 2026-10-26
    status: draft
    see_also: [radio-tuner-next, auto-wifi-antenna, auto-gnss-l1l5, auto-clock-tree]
    question: "For the Car radio tuner system diagram: which existing Skyworks and Qorvo parts fit each block for automotive and
      why, which would need improvements, and which only lack qualification?"
    summary: >-
      Preliminary analysis from the owner's comment of 26 Oct 2026 on the library diagram Car radio tuner system (antenna &
      RF, tuners, digital radio, head unit, audio, power rail, timing). Group A, automotive today (11 part groups): the
      Si479xx tuners, Si469xx / Si461x coprocessors and Si462x receivers, SKYA21001 and QPC8010Q switches that reach the FM
      band, QPL62xxQ satellite-radio LNAs, Si5335x-AM clock buffers, the ACT4751 2 MHz buck and the SKY5A2110 GNSS LNA.
      Group B, needs improvement (6): Si473x / Si470x consumer tuners (−20 °C), QPL7433/7442 wideband LNAs (no automotive
      amplifier design), SKY76206 audio amplifier, SKY8700x bucks (WLCSP, last time buy) and the 125 kHz ACT4529 buck.
      Group C, only lacks qualification (6): Si468x receivers, Si47992, AS169/AS183 and SKY13374 switches, Si510/511 XOs,
      ACT8832x PMIC. Gaps: protection, reverse polarity, LDO, supervisor, audio codec, CAN, Ethernet, A²B, active antenna
      amplifier.
    tags: [car radio, AEC-Q100, qualification, PPAP, tuner, DAB, HD Radio, antenna switch, SDARS, clock buffer, buck, PMIC,
      audio amplifier, gaps]
    sources: "BizDev catalogue with the AEC-Q rule, Automotive map (data/business/auto_reach.yaml), broadcast device data,
      cached Skyworks data shorts, Cross-sell pairs; 4 public requests to www.skyworksinc.com"
    decision: Should we qualify the radio-block parts that only lack AEC-Q, so that we sell more of the car radio diagram
      than the tuner and the decoder?
    answer:
      text: 'Yes for a short list (est): the antenna switches, the Si510/511 oscillator and the Si468x receivers fit the specs
        and need only AEC-Q100 and PPAP. The tuners, decoders and five other part groups are automotive today. Audio, CAN/Ethernet
        and protection stay gaps; leave them to partners.'
      conf: med
    needed_now:
    - 'Radio BU: is the Si468x die the same as the AEC-Q100 Si462x, and is Si47992 already automotive grade?'
    - 'Switch and timing BUs: cost and time of an AEC-Q100 run for AS183/SKY13374 and Si510/511 (Grade 3 or 2)'
    - 'One head-unit or antenna Tier-1: would they take our switch and oscillator with the tuner?'
    say_externally: Skyworks sells automotive AM/FM, HD Radio, DAB and DRM tuners and decoders, and with Qorvo also automotive
      RF switches, satellite-radio amplifiers, clock buffers and power converters. We would like to learn which other parts
      around the tuner you would like to buy from the same supplier.
    next_steps:
    - what: Ask whether Si468x shares the die of the AEC-Q100 Si462x, and the grade and status of Si47992
      who: Radio BU
      why: If the die is shared, the whole Si468x line is a paperwork step, not a qualification run.
    - what: Ask for the cost and time of AEC-Q100 Grade 3 runs for AS183-92LF, SKY13374-397LF and Si510/511
      who: Switch BU and timing BU
      why: These three only lack qualification and would add a switch and the reference clock to every tuner sale.
    - what: Offer the tuner with switch, oscillator and 2 MHz buck as one radio kit to a remote tuner module maker
      who: Our FAE with a Tier-1 antenna module team
      why: Tests the attach rate before any qualification money is spent, and feeds the radio node case.
      case: radio-tuner-next
    bu_opener:
      question: Around our automotive tuners and decoders sit about 15 other blocks. Should we qualify the switches, the
        oscillator and the Si468x receivers that already fit the specs (AEC-Q100 and PPAP only), so we sell more of the car
        radio than the tuner, against NXP and ST who sell a one-chip radio and their own power parts?
      pros:
      - Tuners, decoders and receivers are all AEC-Q100 today; we start from the radio's main chips
      - Switches, oscillator and Si468x already meet the specs; qualification, not invention
      - Qorvo adds automotive 12 V bucks, SDARS LNAs and switches to the same kit
      cons:
      - No automotive audio, CAN/Ethernet, protection or LDO; a full radio still needs partners
      - NXP and ST sell their own power and interface parts next to the tuner
      - A switch or an oscillator is a small socket next to the tuner (low value per car, est)
      vs: NXP, ST, TI, ADI
    learn:
    - age: 5
      text: A car radio has many small chips around the main one, and each must survive heat, cold and shaking.
    - age: 10
      text: The main radio chips (tuners) are already made for cars. The chips around them, like switches, clocks and power
        chips, must also pass a car test before a car maker can use them.
    - age: 15
      text: Car parts follow AEC-Q100, a test list for chips (temperature grades, long life, ESD), and the maker sends a PPAP
        file showing the production process is stable. A part can meet every spec and still not be sold for cars because it
        never went through these tests.
    - age: 20
      text: The owner asked how to fill the car radio diagram with our parts. We sort each part into automotive today, needs
        a better design, or only needs qualification. The last group is the cheapest win, because the chip does not change.
    - age: 25
      text: Our tuners and decoders are AEC-Q100. Around them, Qorvo brings automotive bucks, switches and SDARS LNAs; Skyworks
        brings clock buffers and switches. Si468x, wideband switches, the Si510/511 oscillator and a PMIC only lack
        qualification. Audio, CAN/Ethernet, protection and LDOs are gaps where NXP, ST, TI and ADI sell the whole set.
    learn_links:
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
    - label: Receiver architectures
      href: /rf-notes#receiver_architectures
    - label: Sensitivity and noise floor
      href: /rf-notes#sensitivity_noise_floor
    - label: 'Library: what an IC costs'
      href: /library/semiconductor_cost
  - slug: auto-wifi-antenna
    gist: "Cars move to Wi-Fi 6E/7 next to V2X; with Qorvo we cover the antenna module, but lack an automotive 5/6 GHz Wi-Fi FEM."
    abstract:
      - "About 99 M car Wi-Fi devices ship in 2026, 21 % 6 GHz-capable; first Wi-Fi 7 car starts production 2027."
      - "We have automotive switches, V2X, GNSS and coexistence filters; gaps: Wi-Fi 7 FEM, filters still Preview, a 5/6 GHz splitter."
      - "Decide whether to ask the Wi-Fi BU for an automotive 5/6 GHz FEM and to move the filters to production."
    title: "Wi-Fi 6, 6E and 7 in cars, Wi-Fi and antenna synergies, and the gaps we could fill"
    kind: report
    area: Automotive connectivity
    app_type: Automotive
    feasibility: 2
    feasibility_why: "The first gaps reuse consumer Wi-Fi 7 dies and BAW filters we already make, qualified for cars: new parts from technology we have"
    date: 2026-10-26
    status: draft
    see_also: [auto-wifi7-fem, auto-cv2x-fe, auto-uwb-15-4ab, filters-1-11ghz]
    question: "Where do Wi-Fi 6, 6E and 7 sit in cars, which Skyworks and Qorvo parts fit today, where do Wi-Fi and the antenna
      module give us synergies, which gaps or new technologies could we fill, and what are the next growth topics?"
    summary: >-
      Research topic from the owner's comments of 26 Oct 2026. Wi-Fi sits in the head unit, the TCU, rear-seat screens and
      the roof antenna module, right next to V2X; about 99 M automotive Wi-Fi devices ship in 2026, 21 % of them 6 GHz-capable,
      and the first Wi-Fi 7 car starts production in 2027. With Qorvo we cover almost every block of a roof antenna module
      (automotive switches, V2X, GNSS, cellular, UWB, coexistence BAW), but only 3 of 89 Wi-Fi FEMs are AEC-Q and none is a
      Wi-Fi 6/7 power amplifier at 5 or 6 GHz. Five gaps: an automotive Wi-Fi 7 FEM at 5/6 GHz (AEC-Q100 Grade 2), the 5–7 GHz
      coexistence filters out of Preview, an automotive 5/6 GHz multiplexer for multi-link, UWB channel 5 inside the 6 GHz
      Wi-Fi band, and an automotive antenna tuner (weak evidence). Next wave: Wi-Fi 8 (2028), Wi-Fi sensing and positioning.
      Builds on the business case auto-wifi7-fem.
    tags: [Wi-Fi 6, Wi-Fi 6E, Wi-Fi 7, Wi-Fi 8, smart antenna, roof module, coexistence, MLO, Wi-Fi sensing, antenna tuner,
      UWB, V2X, AEC-Q100, automotive]
    sources: "BizDev catalogue with the AEC-Q rule, Systems library, Cross-sell pairs and 4,186 public reference designs; 8 public
      web requests (IEEE 802.11 timelines, Murata, MediaTek, Skyworks) and 6 web searches; sources of the auto-wifi7-fem case"
    decision: Should we fill the automotive Wi-Fi gaps, an AEC-Q100 Wi-Fi 7 FEM at 5/6 GHz and the coexistence filters in
      production, and sell them with our antenna-module parts as one set?
    answer:
      text: 'Probably yes for the filters and the 5/6 GHz FEM (est): both reuse dies and filters we have, and the filters fit every
        car with Wi-Fi, even with an on-chip amplifier. The FEM pays only where Qualcomm''s bundle leaves room; the roof radio head
        stays with the business case until a carmaker confirms Wi-Fi at the roof.'
      conf: low
    needed_now:
    - 'Wi-Fi BU: can SKY85639-11 / SKY85509-11 (or QPF4659 / QPF4507) dies pass AEC-Q100 Grade 2 at 105 °C without a redesign?'
    - 'Filter BU: production dates for SKY5A1005/1006/1008, and how steep a 5.925 GHz edge BAW can make'
    - 'One module maker (u-blox, LG Innotek or Murata type): would they place a non-Qualcomm FEM or our coexistence filter?'
    say_externally: Cars are moving to Wi-Fi 6E and Wi-Fi 7, often in the same roof module as 5G, GNSS and V2X. Skyworks, with
      Qorvo, sells automotive front ends, switches and filters for most of the radios in that module. We would like to learn how
      you plan the Wi-Fi front end and the filtering between Wi-Fi and V2X in your next design.
    next_steps:
    - what: Ask whether our consumer Wi-Fi 7 FEM dies at 5 and 6 GHz pass AEC-Q100 Grade 2 without a redesign, and at what cost
      who: Wi-Fi BU
      why: Decides whether gap 1 is a qualification step or a new chip, and so the timing of the whole set.
      case: auto-wifi7-fem
    - what: Ask for production dates of SKY5A1005/1006/1008 and a coexistence test report against −37 dBm/MHz at the V2X edge
      who: Filter BU
      why: The filters sell into every car with Wi-Fi and V2X, even where the chip has its own amplifier.
    - what: Ask one Wi-Fi module maker and one roof-antenna maker which front end and filters they use for Wi-Fi 7 multi-link
      who: Module maker and antenna Tier-1, through our FAE
      why: Confirms gaps 3 to 5 (multi-link splitter, UWB next to 6 GHz Wi-Fi, antenna tuner) before any product work.
    bu_opener:
      question: Cars are getting Wi-Fi 6E and 7 right next to V2X, often in one roof module. Should we fill our two automotive
        Wi-Fi gaps, an AEC-Q100 Wi-Fi 7 FEM at 5/6 GHz and the coexistence filters in production, and sell them with the
        switches, V2X, GNSS and UWB parts we already have for that module?
      pros:
      - With Qorvo we sell almost every block of a roof antenna module, all automotive grade
      - Consumer Wi-Fi 7 FEMs and automotive coexistence BAW already exist; qualification, not invention
      - Coexistence filters fit every design, even with an on-chip amplifier
      cons:
      - Only 3 of 89 Wi-Fi FEMs are AEC-Q, none a Wi-Fi 6/7 amplifier at 5 or 6 GHz
      - Qualcomm bundles its own automotive FEM; NXP and Synaptics put the amplifier on chip
      - In-car 6 GHz power is capped, so a 6 GHz amplifier adds less than in a router
      vs: Qualcomm, NXP, Synaptics, Murata, Chinese FEM suppliers
    learn:
    - age: 5
      text: Cars have Wi-Fi like a house, so phones and screens inside can go online and the car can update itself.
    - age: 10
      text: The car's Wi-Fi shows the phone's map on the car screen without a cable, streams films to the back seats and
        downloads new software. Newer Wi-Fi (6E and 7) uses a new band, 6 GHz, that is faster but sits right next to the radio
        cars use to warn each other (V2X).
    - age: 15
      text: Each Wi-Fi antenna needs a front end, an amplifier, a receive amplifier and a switch, plus filters so Wi-Fi does not
        disturb V2X, GNSS or UWB. In a car all of it must be automotive grade (AEC-Q), work from −40 to 105 °C and be made for
        10–15 years.
    - age: 20
      text: The request comes from the owner's comments on Wi-Fi 6 and 7 for cars and Wi-Fi with antennas. Carmakers move
        radios and antennas into one roof module, where antennas are close together and filters do most of the separation.
        That favours a supplier with every front end and filter in that module.
    - age: 25
      text: 'With Qorvo we have automotive switches, V2X front ends, GNSS, cellular, UWB and coexistence BAW, but no automotive
        Wi-Fi 6/7 amplifier at 5 or 6 GHz, and the filters are Preview. Qualcomm bundles its own AEC-Q100 FEM; NXP and
        Synaptics put the amplifier on chip. Gaps: an automotive Wi-Fi 7 FEM, filters in production, a 5/6 GHz splitter for
        multi-link, UWB next to 6 GHz Wi-Fi, and possibly an antenna tuner. Wi-Fi 8 is expected in 2028, sensing is published.'
    learn_links:
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
    - label: 'Library: 5.9 GHz V2X front ends'
      href: /library/v2x_frontend
    - label: Wi-Fi FEMs and tri-band APs
      href: /rf-notes#wifi_fem_and_triband_ap
    - label: Acoustic filters and duplexers
      href: /rf-notes#acoustic_filters_duplexers
  - slug: auto-hv-hot-swap
    gist: "Cars never hot-plug at 800 V; pre-charge and disconnect switches do the job, and a reinforced Si875x successor could win those sockets."
    abstract:
      - "Contactors, pre-charge and insulation monitors make 400–800 V safe; isolated drivers and SiC switches do the work above 80 V."
      - "TI leads with TPSI3050-Q1; our Si875x does the same job but only with basic isolation."
      - "Decide whether to ask the BU for a reinforced Si875x successor sold as a pre-charge and disconnect set."
    title: 'Hot-swap at 400 V and 800 V in the car: pre-charge, DC arcs, solid-state switches and where our isolation fits'
    kind: report
    area: Power & isolation
    app_type: Automotive
    feasibility: 2
    feasibility_why: "The next step is a reinforced successor of our Si875x isolated FET driver: a new chip from isolation and driver technology we already have"
    date: 2026-10-23
    status: draft
    see_also: [iso-current-sense-charging, hv-extra-wide-isolation]
    question: Are there known pain points in getting near 800 V in a car and being able to plug something in or out safely, who
      makes the parts that solve them (hot-swap controllers, eFuses, contactors, solid-state switches, insulation monitors), and
      where do Skyworks' isolated drivers, isolators and isolated sensing fit?
    summary: 'Research topic for the owner. The car never really hot-plugs at 400–800 V: contactors switch the system off first,
      an interlock loop (HVIL) makes sure no connector opens under load, capacitors are pre-charged at switch-on and discharged
      after switch-off, and an insulation monitor checks the chassis. Pain points: inrush (about 16 kA without pre-charge, est),
      DC arcs that do not go out by themselves, contactor welding, size and cost, insulation faults and discharge time.
      Hot-swap controllers and eFuses stop at about 80 V; above that the job is done by SiC switches with isolated drivers and
      sensing. TI leads with TPSI3050-Q1 (reinforced isolated switch driver, $2.30 at 1k, active pre-charge design TIDA-050063)
      and TPSI2140-Q1 (1200 V relay for insulation monitoring, $2.90). Our Si875x does the same job but only at 2.5 kVrms. Data
      centers face the same problem in 800 V DC racks (NVIDIA 2027; TI shows an 800 V hot-swap controller). Next step: a
      reinforced Si875x successor and a solid-state pre-charge set with our gate drivers and Si89xx sensing.'
    tags:
    - hot-swap
    - eFuse
    - pre-charge
    - contactor
    - solid-state relay
    - isolated switch driver
    - Si8751
    - Si8752
    - TPSI3050-Q1
    - TPSI2140-Q1
    - insulation monitoring
    - battery junction box
    - HVIL
    - ISO 6469-3
    - ISO 21498
    - 800 V
    - 800 V DC
    - data center
    sources: BizDev parts database, Skyworks catalogue, block-diagram library and library topic on traction-inverter isolation;
      Skyworks AN1052 and AN1456; TI product pages TPSI3050-Q1 and TPSI2140-Q1 (read 23 Oct 2026); NVIDIA and eeNews Europe pages
      recorded for the extra-wide isolation case; standards summarised, not read
    decision: Should we build a reinforced successor to Si875x and sell it as an 800 V solid-state pre-charge and disconnect
      set with our gate drivers and Si89xx sensing?
    answer:
      text: Probably yes, aimed at pre-charge, active discharge and insulation monitoring first, not at replacing the main
        contactors. TI is there first, so it pays only if the BU can make the Si875x barrier reinforced at a cost that lets
        us price near TI's $2.30 (est).
      conf: low
    needed_now:
    - 'Isolation BU: can the Si875x power transfer cross a reinforced 5 kVrms barrier with 10–15 V gate drive, and at what
      cost?'
    - 'One or two battery-junction-box or charger teams: do they plan solid-state pre-charge on 800 V platforms, and from
      which year?'
    - 'Sales or FAE: do customers already ask us for a TPSI3050-Q1 cross?'
    say_externally: We see solid-state pre-charge and insulation monitoring starting to replace resistors and relays in 800
      V cars and in 800 V DC racks. Skyworks already sells isolated FET drivers (Si875x), isolated gate drivers and isolated
      current and voltage sensing for these circuits. We would like to learn how you plan pre-charge and disconnect on your
      next 800 V platform, and what isolation rating you need.
    next_steps:
    - what: Ask whether Si875x can be made reinforced (5 kVrms, SSO-8 or wide SOIC) with 10–15 V gate drive and fault feedback
      who: Isolation BU
      why: Tells us whether feasibility 2 holds and what the part could cost against TPSI3050-Q1 at $2.30 (1k).
    - what: Ask two battery-junction-box or on-board-charger teams how they pre-charge and monitor insulation on their next
        800 V platform
      who: Tier-1 BDU / OBC hardware lead, through our FAE
      why: Shows whether solid-state pre-charge is planned, from which year, and which isolation and gate voltage they need.
    - what: Size the isolated current sensing of the same set in the current-sensing case
      who: Daily run
      why: Hands the sensing half of the set to its own case, so the set can be priced as one.
      case: iso-current-sense-charging
    bu_opener:
      question: In 800 V cars, chargers and the new 800 V DC data-center racks, solid-state switches are starting to replace the
        pre-charge resistor, insulation-monitor relays and later the contactors. Each one needs an isolated driver with its own
        floating supply. TI sells a reinforced automotive one (TPSI3050-Q1, 5 kVrms, $2.30 at 1k); our Si875x does the same job
        at 2.5 kVrms only. Should we make a reinforced Si875x successor and sell it as a pre-charge and disconnect set?
      pros:
      - Si875x already builds solid-state relays without a floating supply (AN1052); the technology and the customers exist
      - 'The rest of the set is ours today: Si828x / Si829x gate drivers with fast short-circuit detection, Si89xx current and
        voltage sensing (5 kVrms, automotive), Si86xx isolators, Si88xx isolated bias'
      - The same set serves 800 V DC data-center racks, battery storage racks and DC fast chargers
      cons:
      - TI is there first with a reinforced driver (TPSI3050-Q1), a 1200 V relay (TPSI2140-Q1) and reference designs
      - Our Si875x is basic 2.5 kVrms in a narrow SOIC-8, not enough for a reinforced 800 V barrier
      - Contactors stay in the main path for a long time (losses, cost, galvanic separation); hot-swap and eFuse chips up to
        80 V are not isolated, so not our technology
      vs: TI TPSI3050-Q1, TPSI3100-Q1, TPSI2140-Q1; Infineon; ADI; contactor and fuse makers (TE, Sensata, Littelfuse, Eaton)
    learn:
    - age: 5
      text: 'An electric car has a big battery with very strong electricity. Before anyone plugs something in or out, the car
        switches the strong electricity off, like turning off a tap before changing a hose.'
    - age: 10
      text: When the car switches its battery back on, the parts behind it fill up with electricity all at once, like water
        rushing into an empty pipe. The car fills them slowly first (pre-charge), so nothing sparks or breaks.
    - age: 15
      text: 'At 400 or 800 volts DC, a spark (an arc) does not stop by itself as it does with AC, so plugs must never open under
        load. Cars use big switches (contactors), a slow-charge resistor, a safety loop through every plug (HVIL) and an
        insulation monitor that checks nothing leaks to the car body. Standards: ISO 6469-3 for electrical safety, ISO 21498
        (formerly LV 123) for the components.'
    - age: 20
      text: The owner asked whether hot-swap controllers exist for 800 V in cars. They do not as single chips (they stop at about
        80 V); instead, carmakers start to use silicon-carbide switches for pre-charge, discharge and insulation monitoring.
        Each needs an isolated driver with its own floating supply and isolated current sensing. The same appears in 800 V DC
        data-center racks, where boards are really plugged in live.
