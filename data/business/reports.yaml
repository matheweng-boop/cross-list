    question: "What could Skyworks suggest for standalone filters, especially wide bandwidth between 1 and 11 GHz, and in which applications?"
    summary: >-
      Best bets combine a filter with parts we already sell: a Wi-Fi 7/8 BAW multiplexer family, a filtered switch-LNA
      module for 5G small cells and a protected switched filter bank for defense. Wideband filtering (over ~25 %, or
      switched over octaves) is needed in Wi-Fi 6E/7, full n77, UWB, satellite terminals, anti-jam GNSS, SDR, test and
      defense EW. Acoustic filters cannot reach it and we have no LTCC, ceramic or thin-film line since Trans-Tech was
      sold, so our entry is a switched filter bank of our switches and BAW with partner filters (est).
    tags: [filters, wideband, Wi-Fi 7, 5G n77, UWB, SDR, X-band, defense]
    sources: "BizDev catalogue, competitor and demand data; ~106 public web sources (background notes)"
    decision: Should we cover wideband filters with a switched filter bank of our switches and BAW plus a partner's LTCC
      or thin-film filters, after a Wi-Fi 7/8 BAW multiplexer family as the first combined product?
    answer:
      text: 'Yes, in two steps (est): first the Wi-Fi 7/8 BAW multiplexer family, which we can sell today; then a wideband
        switched filter bank for SDR, test and defense with partner LTCC or thin-film channels. Our own LTCC line is not
        worth it for commodity parts, and a BAW + IPD hybrid could cover the 6 GHz Wi-Fi band and full n77. Partner prices
        and the widest BAW passband the BU can make would settle it.'
      conf: low
    needed_now:
    - 'Filter BU: the widest BAW and BAW + IPD passband we can make at 3–7 GHz (full n77, the 1.2 GHz Wi-Fi 6 GHz band),
      and the release plan for SKY85929/31/32 and QPQ4701 as one family'
    - Two or three LTCC or thin-film filter partners, with prices and parts we could place inside a module
    - Whether the post-merger plan keeps low-volume standalone filters
    say_externally: Skyworks sells BAW filters, multiplexers and switched filter banks together with the switches, limiters
      and LNAs around them, from 1 to about 7 GHz. We would like to learn where you need wide passbands, such as the full
      6 GHz Wi-Fi band, full n77, UWB channels or multi-octave receivers, and whether a switched filter bank with our
      switches would fit your design.
    next_steps:
    - what: Ask for the widest BAW and BAW + IPD passband we can make at 3–7 GHz, and the release plan of SKY85929/31/32
        and QPQ4701 as one family
      who: Filter BU
      why: Tells us how much of the wideband need our own filters can cover, and whether idea 1 can be offered within a year.
    - what: Shortlist two or three LTCC or thin-film filter partners and ask for prices and parts we could place in a module
      who: Daily run, then sourcing
      why: Settles build, buy or partner for the wideband channels of a switched filter bank.
    - what: Ask a defense EW or test-equipment maker which band split, channel count and size they buy in a switched filter
        bank today
      who: Defense or test hardware lead, through our FAE
      why: Confirms demand and gives the first specification for the wideband switched preselector.
    bu_opener:
      question: Our filters sit next to LNAs, switches and FEMs we already sell. Should we turn that into a few combined filter
        products (a Wi-Fi 7/8 BAW multiplexer family, a filtered switch-LNA for 5G small cells, a protected filter bank for
        defense), and cover wideband filters with a switched filter bank of our switches and BAW plus a partner's LTCC or
        thin-film filters, now that Trans-Tech and Lark are sold?
      pros:
      - 'We sell every other block of a 1–11 GHz receive chain: LNAs, switches, limiters, PAs, multiplexers'
      - 'We already make switched filter banks (QPB1029/1033/1034/1036, QPB1055) and ~131 active switches: the frame of a
        wideband bank'
      - BAW beats LTCC diplexers (Murata, Johanson, Yageo) on 5/6 GHz rejection
      - 'Fewer acoustic rivals: Akoustis exited in 2025'
      cons:
      - Our filters stop at about 7 GHz and about 20 % width; acoustic only
      - No ceramic, LTCC, IPD, thin-film or cavity filters since Trans-Tech (with Lark) was sold; they now compete with us
      - 'Wideband catalogue filters are commodity: LTCC at about $4 or less; Mini-Circuits lists ~52 band-pass filters wider
        than 25 % at 1–11 GHz'
      vs: Mini-Circuits, Knowles, Anatech (wideband catalogue and custom); Murata, Johanson, Yageo (LTCC); Trans-Tech and
        Lark (ceramic, cavity); ADI, MACOM, Mercury (tunable filters and filter banks)
    learn:
    - age: 5
      text: 'A radio hears many stations at once. A filter is like a sieve: it lets the one station you want through and keeps
        the others out.'
    - age: 10
      text: 'Phones, Wi-Fi routers, cars and radars all send and receive at the same time on nearby frequencies. Without good
        filters they disturb each other: calls drop and Wi-Fi slows down.'
    - age: 15
      text: A filter is judged on how little it loses (insertion loss), how strongly it blocks the neighbours (rejection) and
        how wide its window is (bandwidth). Small acoustic filters (BAW, SAW) are sharp but narrow; windows wider than about
        25 % of the frequency need ceramic, LTCC, IPD or cavity filters.
    - age: 20
      text: 'The question covers 1–11 GHz: Wi-Fi 7/8, 5G n77 small cells, UWB channels 5–9, satellite and S/C/X-band defense
        radios all need filters. Many need wide ones: 1.2 GHz for Wi-Fi 6 GHz, 24 % for full n77, octaves for SDR, test and
        EW receivers. Most filter value now sits inside front-end modules, so a standalone filter sells best combined with
        parts we already make.'
    - age: 25
      text: 'BAW is about 91 % Broadcom plus Qorvo; Murata''s XBAR is the main new wideband acoustic technology. For wideband
        we have nothing since Trans-Tech (with Lark) was sold in 2023: build, buy or partner. The best bets reuse our BAW: a
        Wi-Fi 7/8 multiplexer family, a filtered switch-LNA module (QPQ3509/QPQ4900 with QPB9850) and a protected switched filter
        bank (QPB1033, QPB1055).'
    learn_links:
    - label: Filter basics
      href: /rf-notes#filter_fundamentals
    - label: Acoustic filters and duplexers
      href: /rf-notes#acoustic_filters_duplexers
    - label: LTCC technology
      href: /rf-notes#ltcc_technology_power
    - label: Reflectionless filters
      href: /rf-notes#reflectionless_filters
    - label: 'Interactive: band-pass filter'
      href: /visuals#filter
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
  - slug: radio-tuner-next
    title: "Car radio: a radio node for the antenna (2–3 years, reuse only)"
    kind: idea
    area: Broadcast radio
    app_type: Car radio
    feasibility: 2
    feasibility_why: "The radio node is a new chip built from our tuner and decoder circuits; step 1 packages existing dies"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks develop next for car radio, given NXP and ST, software radio, remote tuner modules and HD Radio, with a 2–3-year turnaround and reuse of existing technology, and at what price?"
    summary: >-
      Business-case draft. Our advantage is the split architecture (chainable tuners + separate multi-standard
      decoder), which fits zonal cars; our disadvantages are cost per chip versus ST and chip count versus NXP. Proposal:
      a radio node (2 or 4 tuners + decoder + car-network output, decoded audio or raw samples) for antenna modules,
      about $16–19 (4 tuners) and $10–12 (2 tuners) in volume (est), plus AMIC on all tuners, a module reference
      design from today's parts and CDR to production.
    tags: [car radio, radio node, remote tuner module, SDR, HD Radio, DAB+, DRM, CDR, AMIC, pricing, architecture]
    sources: "BizDev block-diagram library and broadcast data; ~140 public web requests (S&P, OICA, WorldDAB, DRM Consortium, Radio World, Hirschmann, OpenSynergy, distributor snippets)"
    decision: Should we build a radio node (2 or 4 tuners, decoder and car-network output) from our existing tuner and decoder
      circuits within 2–3 years?
    answer:
      text: Not enough data yet. The node fits zonal cars, but there are no public remote-tuner volumes. It becomes a yes
        if carmakers confirm the radio moves to the antenna and one package (step 1) can reach about $10–12 for 2 tuners (est).
      conf: low
    needed_now:
    - 'Carmakers: will the next platform move the radio into a remote tuner or roof module, and from which model year?'
    - 'Radio BU: die costs and contract ASPs of Si4796x and Si469xx'
    - 'Customers: which link they want from the antenna module (A²B, Ethernet or coax)'
    say_externally: Car radio is moving towards the antenna and towards central computers. Skyworks sells chainable automotive
      tuners and multi-standard digital radio decoders (AM/FM, HD Radio, DAB, DRM) today. We would like to learn whether your
      next platform moves the radio out of the head unit, and which link you would want from the antenna module.
    next_steps:
    - what: Ask whether the radio moves to a remote tuner or roof module, and from which model year
      who: OEM E/E architecture team
      why: Decides whether the node has a market at all.
    - what: Ask for die costs and contract ASPs of Si4796x and Si469xx, and whether tuner and decoder can share a die
      who: Radio BU
      why: Shows whether RN2 / RN4 can reach their target prices and whether one package is the only near-term route.
    - what: Build a remote tuner module reference design from today's parts with an antenna maker
      who: Our FAE with a Tier-1 antenna module team
      why: Tests the architecture with customers before any new chip.
    bu_opener:
      question: Car radio is moving to the antenna and to central computers. Should we build a radio node (2 or 4 tuners + decoder
        + car-network output) from our existing tuner and decoder circuits in 2–3 years, at about $10–12 (2 tuners) and $16–19
        (4 tuners), against NXP's one-chip radio and ST's cheaper tuners?
      pros:
      - 'Split architecture (chainable tuners + separate decoder) fits zonal cars: at the antenna, in the head unit or feeding
        a central computer'
      - 'Broadest digital standards in one decoder family: HD Radio, DAB/DAB+, DRM/DRM+, CDR'
      - One family scales from 1 to 4+ tuners on the same board design
      cons:
      - 'Higher cost per chip: ST tuners list at $4.60–6.10 vs about $8.40 for our Si47901'
      - 'More chips: 3 parts for 4 tuners vs one NXP chip (SAF4000, SAF9000)'
      - 'Weaker software-radio partners: Inntot (Visteon) is in ST''s partner programme'
      vs: NXP, ST
    learn:
    - age: 5
      text: The car radio catches music and news from the air and plays it in the car.
    - age: 10
      text: 'Cars still need radio: it is free, works without a phone and carries traffic and emergency news. New cars receive
        AM, FM and digital radio (DAB+, HD Radio, DRM).'
    - age: 15
      text: A radio needs tuners (to pick the station) and a decoder (to turn digital radio into sound). Several tuners together
        give better reception while driving (phase diversity) and a background tuner scans for stations. One design must cover
        regions with different standards.
    - age: 20
      text: The request comes from car makers moving electronics into zones and central computers. The radio can sit next to
        the antenna (a remote tuner module), in the head unit, or send raw samples to a central computer for software radio.
        We want a product in 2–3 years that reuses circuits we already have.
    - age: 25
      text: NXP sells a one-chip radio with 4–5 tuners; ST reuses mature, cheaper designs and has software-radio partners. Our
        advantage is the split architecture and the widest digital standard coverage; our weak points are cost per chip and
        chip count (a module at the antenna needs 5–7 of our parts). The radio node answers both.
    learn_links:
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
    - label: Receiver architectures
      href: /rf-notes#receiver_architectures
    - label: Software radio and the ADC chain
      href: /rf-notes#sdr_adc_chain
    - label: Sensitivity and noise floor
      href: /rf-notes#sensitivity_noise_floor
    - label: 'Library: what an IC costs'
      href: /library/semiconductor_cost
  - slug: auto-uwb-15-4ab
    title: "Automotive UWB: an 802.15.4ab anchor chip for digital key (2–3 years, reuse first)"
    kind: idea
    area: Automotive UWB
    app_type: Automotive
    feasibility: 2
    feasibility_why: "New 802.15.4ab chip from the existing Qorvo UWB radio and radar; firmware steps come first"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (with legacy Qorvo UWB) develop next for car access in 2–3 years, reusing the DW3000 / QPF5100Q technology, now that ST and Calterah sample 802.15.4ab chips, NXP sells a complete access set and CCC Digital Key 4.0 is in testing, and at what price?"
    summary: >-
      Business-case draft. Our advantage is an automotive-qualified UWB chip with ranging and radar on one die plus
      our own automotive RF front ends; our disadvantages are no public 802.15.4ab / narrowband-assist part (ST and
      Calterah sampling since 2026) and no BLE, NFC or secure element against NXP's full set. Proposal: an 802.15.4ab
      anchor SoC with on-chip NBA radio, in ranging and ranging + radar variants, about $3.5–5.5 and $4.5–6.5 in
      volume (est), an optional anchor FEM (≈$0.6–1.1), and firmware MMS and DK 4.0 on today's QPF5100Q as the bridge.
    tags: [UWB, 802.15.4ab, narrowband assist, digital key, CCC, car access, QPF5100Q, anchor FEM, pricing, architecture]
    sources: "BizDev block-diagram library and catalogue; ~20 public web requests and searches (IEEE 802.15, ST blog, CNX Software, Rohde & Schwarz, ABI Research, TI, search snippets)"
    decision: Should we build an 802.15.4ab anchor chip with narrowband assist from the Qorvo UWB radio and radar, with firmware
      on today's QPF5100Q as the bridge?
    answer:
      text: Probably yes, but first check whether legacy Qorvo already has a 15.4ab project. ST and Calterah already sample,
        so the firmware bridge on QPF5100Q matters now; the new chip targets programmes from about 2028–2029 (est).
      conf: low
    needed_now:
    - 'UWB BU: is there an 802.15.4ab / NBA chip project, and at what stage?'
    - 'UWB BU: which programmes have QPF5100Q design wins, with start of production'
    - 'Carmakers: from which model year they require 802.15.4ab in the anchors'
    say_externally: Digital car keys are moving to the new UWB standard IEEE 802.15.4ab with narrowband assist, and CCC Digital
      Key 4.0 is in testing. Skyworks, with the former Qorvo UWB line, sells automotive UWB chips (QPF5100Q) with ranging
      and radar, and automotive RF front ends. We would like to learn from which model year you need 802.15.4ab in your anchors,
      and how many anchors you plan per car.
    next_steps:
    - what: Ask whether an 802.15.4ab / NBA chip project exists and at what stage
      who: UWB BU
      why: If it exists, the case becomes how to position it, not whether to build it.
    - what: Ask from which model year 15.4ab is required and how long anchors must stay 15.4z-compatible
      who: OEM car-access / digital-key team
      why: Sets the timing of the chip and how long the firmware bridge must last.
    - what: Check that QPF5100Q can run MMS ranging and Digital Key 4.0 in firmware, and plan certification
      who: UWB BU with our FAE
      why: Keeps today's part in designs while the new chip is built.
    bu_opener:
      question: Digital car keys move to the new UWB standard 802.15.4ab with narrowband assist. Should we build a 15.4ab anchor
        chip from the Qorvo UWB radio and radar (about $3.5–5.5 ranging, $4.5–6.5 with radar, est), with firmware on today's
        QPF5100Q as the bridge, while ST and Calterah already sample?
      pros:
      - Ranging and radar on one automotive-qualified chip today (QPF5100Q); ST's entry part has no radar
      - Our own automotive RF front ends in the band; UWB chip rivals sell none
      - Decawave heritage, interoperable with the phone side (Apple U1, Google Pixel)
      cons:
      - No public 802.15.4ab / narrowband-assist part; ST samples since Mar 2026, Calterah showed one in Jan 2026
      - No BLE, NFC, secure element or access MCU, which NXP sells as one set
      - 'Price pressure: NXP NCJ29D5 at $4.85–6.33 (1k budgetary)'
      vs: NXP, ST, Calterah, Samsung
    learn:
    - age: 5
      text: A digital car key lets the car know you are close, so the door opens without you pressing a button.
    - age: 10
      text: Your phone or key fob talks to small radios (anchors) around the car. Ultra-wideband (UWB) measures the distance
        very precisely, so thieves cannot fool the car by relaying the signal from far away.
    - age: 15
      text: A UWB anchor needs exact time-of-flight ranging, low power, automotive grade and it must work with every phone.
        The same radio can also act as a small radar, to sense a kick under the bumper or a child left in the car.
    - age: 20
      text: The request comes from the car industry's key standard (CCC Digital Key 4.0, in testing) and the new IEEE 802.15.4ab,
        which adds narrowband assist (NBA) for longer range and lower power. Car makers will ask for 15.4ab anchors in their
        next platforms; we want a product in 2–3 years that reuses our UWB technology.
    - age: 25
      text: 'We have automotive-qualified 802.15.4z chips with ranging and radar (QPF5100Q, DW3300Q) plus automotive front ends.
        ST (ST64UWB, 18 nm FD-SOI) and Calterah already sample 15.4ab chips, and NXP sells UWB + NFC + secure element + MCU
        as one set. The proposal: a 15.4ab anchor SoC with on-chip NBA, ranging and radar variants, with firmware MMS and DK
        4.0 on QPF5100Q as the bridge.'
    learn_links:
    - label: 'Library: automotive UWB'
      href: /library/auto_uwb
    - label: UWB and low-power links
      href: /rf-notes#lpwan_uwb_iot_links
    - label: 'Interactive: link budget and range'
      href: /visuals#link
    - label: 'Library: what an IC costs'
      href: /library/semiconductor_cost
  - slug: auto-uwb-cpd
    title: "Automotive UWB: child presence and kick sensing from the key anchors (1–3 years, reuse)"
    kind: idea
    area: Automotive UWB
    app_type: Automotive
    feasibility: 1
    feasibility_why: "Firmware and a reference design on today's QPF5100Q"
    date: 2026-10-20
    status: draft
    question: "Should Skyworks (with legacy Qorvo UWB) sell UWB radar for Euro NCAP 2026 child-presence detection and kick sensing, reusing digital-key anchors, against 60 GHz radar (TI, Infineon, Calterah) and capacitive or ultrasonic sensors, within 1–3 years and reusing today's parts, and at what price?"
    summary: >-
      Business-case draft. Our advantage is reuse: in cars with a UWB key the QPF5100Q anchors can sense breathing and
      kicks without a separate 60 GHz module; our disadvantages are coarser resolution than 60 GHz (6–30 cm vs
      3–7.5 cm), no production CPD algorithm or Euro NCAP dossier, and rivals (NXP, ST, Calterah) bundling the same.
      Proposal: a cabin-sense package on today's QPF5100Q (CPD and kick firmware with a partner, Euro NCAP test
      pack, standalone module reference), about $0.75–1.5 per car as a licence or $4–6 per standalone CPD chip (est).
    terms: [euro_ncap]  # owner, 25 Oct 2026: "What is Euro NCAP" (explained under the question)
    tags: [UWB, child presence detection, Euro NCAP, in-cabin radar, 60 GHz radar, kick sensor, QPF5100Q, pricing, architecture]
    sources: "BizDev block-diagram library and catalogue; Euro NCAP OM protocol v1.2; ~20 public web requests and searches (TI, IEEE MTT-S, Rohde & Schwarz, ABI Research, search snippets)"
    decision: Should we sell child-presence and kick-sensing firmware on today's QPF5100Q key anchors, so cars with a UWB
      key need no separate 60 GHz radar?
    answer:
      text: Yes as a low-cost add-on in cars that already have UWB anchors, if the radar covers every seat and footwell in
        a real cabin; not as a standalone chip against 60 GHz. Measured cabin results are the missing piece.
      conf: low
    needed_now:
    - 'UWB BU: measured breathing range, seat and footwell separation and false alarms of QPF5100Q radar in a cabin'
    - 'UWB BU: who owns the CPD and kick algorithm from the CES 2024 demo, and on what licence terms'
    - 'Carmakers: which sensor they plan for child presence on platforms with a UWB key'
    say_externally: Euro NCAP rewards child-presence detection from 2026, and UWB key anchors can also sense breathing and
      kicks. Skyworks, with the former Qorvo UWB line, sells the QPF5100Q automotive UWB chip, which lists child presence
      and kick sensing among its uses. We would like to know which sensor you plan for child presence on platforms with a
      UWB key.
    next_steps:
    - what: Ask for measured QPF5100Q radar results in a real cabin
      who: UWB BU
      why: Shows whether UWB can pass Euro NCAP for every seat and footwell or only some.
    - what: Find out who owns the CPD and kick algorithm and on what licence terms
      who: UWB BU and the algorithm partner
      why: Without production code there is nothing to sell.
    - what: Ask which child-presence sensor is planned on UWB-key platforms, and from which model year
      who: OEM occupant-safety team
      why: Confirms the socket and what a per-car licence could earn.
    bu_opener:
      question: Euro NCAP rewards child-presence detection from 2026. Should we sell 'cabin sense' firmware on today's QPF5100Q
        key anchors (about $0.75–1.5 per car as a licence, or a $4–6 dedicated chip, est), so cars with a UWB key need no extra
        60 GHz radar?
      pros:
      - 'Reuses digital-key anchors: no extra cabin module in cars that already have a UWB key'
      - 'Available now: QPF5100Q is automotive qualified and lists child presence, kick and occupancy'
      - Below 10 GHz passes blankets and seats better (supplier claim); no FCC waiver question as with 60 GHz in-cabin radar
      cons:
      - 'Coarser resolution: UWB 6–30 cm vs 60 GHz radar 3–7.5 cm'
      - No production CPD algorithm or Euro NCAP dossier of our own; TI ships a reference design with test data
      - NXP, ST and Calterah bundle the same radar idea with their key chips
      vs: TI, Infineon, Calterah (60 GHz radar); NXP, ST, Calterah (UWB)
    learn:
    - age: 5
      text: Sometimes a child or a pet is left in a hot car by mistake. A sensor can notice them breathing and call for help.
    - age: 10
      text: Euro NCAP (European New Car Assessment Programme), the independent group that gives new cars safety stars, rewards cars that detect a child left inside (from 2026). Car
        makers look for a sensor that sees a small sleeping child, even under a blanket.
    - age: 15
      text: Child-presence detection needs a radar that sees tiny movements like breathing, tells seats and footwell apart,
        gives few false alarms and uses little power while the car is parked. The same idea can sense a foot kick under the
        bumper to open the tailgate.
    - age: 20
      text: 'The request comes from the Euro NCAP occupant-monitoring protocol and from cars that already have UWB key anchors:
        if the anchors can also sense the cabin, the car maker saves a separate radar module.'
    - age: 25
      text: Rivals are 60 GHz radar chips (TI AWRL6432, Infineon, Calterah) with finer resolution and ready reference designs,
        plus UWB key sets that bundle radar (NXP NCJ29D6A, ST64UWB-A500, Calterah Dubhe). Our QPF5100Q already lists CPD and
        kick; the gap is a production algorithm (with a partner) and a Euro NCAP test pack.
    learn_links:
    - label: 'Library: automotive UWB'
      href: /library/auto_uwb
    - label: Radar basics
      href: /rf-notes#radar_fundamentals
    - label: UWB and low-power links
      href: /rf-notes#lpwan_uwb_iot_links
    - label: 'Interactive: wavelength and antenna size'
      href: /visuals#wave
  - slug: auto-clock-tree
    title: "Automotive clock tree: a crystal-free clock for central compute and zones (2–3 years, reuse only)"
    kind: idea
    area: Automotive RF
    app_type: Automotive
    feasibility: 2
    feasibility_why: "Crystal-free clock is a new chip from our BAW resonator and Si5332 core; bridge parts are packaging work"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks offer next for clocking central computers, zonal controllers and satellite radar (PCIe, automotive Ethernet, SerDes references), given TI, SiTime (buying Renesas timing), Microchip and Diodes, with a 2–3-year turnaround and reuse of existing timing technology, and at what price?"
    summary: >-
      Business-case draft. Our advantage is the broadest Grade 2 automotive PCIe clock line (Si5332-AM 6/8/12 outputs,
      Si5225x generators, Si5325x Gen 1–6 buffers), already listed for central compute; our disadvantages are a crystal on
      every Si5332-AM, Grade 2 only, Gen 5 generators, no automotive jitter attenuator or oscillator, and captive radar
      timing, while TI (crystal-free BAW, Gen 7, $3.55 list) and SiTime (Grade 1 MEMS, plus Renesas timing) move ahead.
      Proposal: ZoneClock, a crystal-free automotive clock tree from our BAW resonator and MultiSynth IP, Grade 1, PCIe
      Gen 6, about $4–6.5 (12 outputs) and $1.6–2.6 (4 outputs) in volume (est), plus SoC reference designs, Gen 6 data
      and a qualified jitter attenuator now.
    tags: [automotive, timing, clock generator, PCIe, jitter attenuator, BAW, central compute, zonal, radar, pricing, architecture]
    sources: "BizDev catalogue and block-diagram library; Si5332-AM data sheet; ~20 public web requests and searches (TI, SiTime, evertiq, Skyworks, Yole, OEM releases, distributor snippets)"
    decision: Should we build ZoneClock, a crystal-free Grade 1 automotive clock tree from our BAW resonator and MultiSynth,
      and qualify a jitter attenuator now?
    answer:
      text: Not enough data yet. The line and the need exist, but the case hinges on our BAW resonator meeting Grade 1 drift
        and ageing, which is not public. PCIe Gen 6 data and SoC reference designs are low-cost steps worth doing now.
      conf: low
    needed_now:
    - 'Timing BU: Grade 1 drift, ageing and vibration results of the SKY631xx BAW resonator'
    - 'Timing BU: jitter margin of Si5332-AM and Si5225x-AM against PCIe Gen 6'
    - 'A Tier-1: clock outputs and domains per central computer and zone'
    say_externally: Central computers and zone controllers in new cars need many low-jitter PCIe and Ethernet clocks. Skyworks
      sells automotive PCIe clock generators and buffers (Si5332-AM, Si5225x, Si5325x) for these designs. We would like to
      learn how many clock outputs your next computer needs, which PCIe generation and which temperature grade.
    next_steps:
    - what: Ask for Grade 1 drift, ageing and vibration results of the SKY631xx BAW resonator
      who: Timing BU
      why: Decides whether ZoneClock is a new chip from our technology (distance 3) or new technology.
    - what: Characterise and publish PCIe Gen 6 compliance for Si5332-AM and Si5225x-AM
      who: Timing BU
      why: Keeps today's parts in 2028–2030 designs while the new chip is decided.
    - what: Ask how many clock outputs and domains each computer and zone needs
      who: Tier-1 central-compute hardware team
      why: Sizes ZC-12 against ZC-4 and the volume per car.
    bu_opener:
      question: Central computers and zones need many clean clocks. Should we build ZoneClock, a crystal-free Grade 1 automotive
        clock tree from our BAW resonator and Si5332 MultiSynth (about $4–6.5 for 12 outputs, est), and qualify a jitter attenuator
        now, while TI ships crystal-free BAW clocks and SiTime buys Renesas timing?
      pros:
      - Broadest Grade 2 automotive PCIe clock line from one vendor (Si5332-AM, Si5225x, Si5325x)
      - One Si5332-AM replaces several oscillators and buffers (up to 12 outputs, any format)
      - SmartClock monitoring and fault reporting to the safety manager
      cons:
      - Every Si5332-AM needs a crystal; TI's LMK3H0102-Q1 is crystal-free (BAW)
      - Grade 2 only and PCIe Gen 5; SiTime offers Grade 1, TI goes to Gen 7
      - 'Not the cheapest per output: TI lists a 2-output crystal-free clock at $3.55 (1k)'
      vs: TI, SiTime (with Renesas timing), Microchip, Diodes
    learn:
    - age: 5
      text: Inside a car computer every chip needs a steady beat, like a drummer keeping time in a band. A clock chip is that
        drummer.
    - age: 10
      text: New cars have big central computers and zone boxes that move huge amounts of data (PCIe, automotive Ethernet). If
        the beat wobbles, the data gets errors, so these computers need many very clean clocks.
    - age: 15
      text: 'A clock tree makes many outputs from one reference: different frequencies and formats, low jitter (wobble), spread
        spectrum against interference, automotive temperature grade and safety monitoring that reports when a clock fails.'
    - age: 20
      text: The request comes from central compute, zonal controllers and satellite radar, which move clock sockets to exactly
        these trees. Car makers want fewer parts (no separate crystals), Grade 1 (125 °C) and the newest PCIe.
    - age: 25
      text: TI ships a crystal-free BAW clock (PCIe Gen 7, $3.55 list), SiTime a Grade 1 MEMS clock generator and it is buying
        Renesas timing; Microchip and Diodes sell buffers. Our line is broad but needs a crystal, is Grade 2 and Gen 5. ZoneClock
        would combine our BAW resonator with Si5332 MultiSynth to close these gaps.
    learn_links:
    - label: Phase noise and oscillators
      href: /rf-notes#phase_noise_oscillators
    - label: PLL synthesis
      href: /rf-notes#pll_synthesis
    - label: Phase noise and PLLs
      href: /rf-notes#phase_noise_and_pll
