      href: /library/semiconductor_cost
  - slug: auto-gnss-l1l5
    title: "Automotive GNSS: an all-band front end for the roof antenna (2–3 years, reuse only)"
    kind: idea
    area: Automotive RF
    app_type: Automotive
    feasibility: 1
    feasibility_why: "Builds on the existing SKY5A2110 L1+L5 module; adding L2 is packaging work"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (with Qorvo filters) offer next for multi-band GNSS in the shark fin and roof antenna for lane-level ADAS, given TI, Infineon and NXP LNAs, Murata/Taoglas modules and all-band receivers from u-blox, ST and Qualcomm, with a 2–3-year turnaround and reuse of existing technology, and at what price?"
    summary: >-
      Business-case draft. Our advantage is SKY5A2110, an automotive L1 + L5 LNA module with filters, B13 notch and a
      diplexed output (AEC-Q104 Grade 2), and the rest of the roof-module RF set; our disadvantages are L1 + L5 only while
      receivers are all-band (u-blox ZED-X20K, ST STA8135GA), Grade 2, two RF inputs, and TI's Grade 1 wideband LNA at
      $0.45 list. Proposal: an all-band automotive GNSS front end (L1 + L2/E6 + L5/E5, one input, one output) from our LNAs
      and Qorvo SAW/BAW filters, Grade 1, about $1.6–2.6 in volume (est), plus a single-input L1 + L5 variant at about
      $0.9–1.4 and a roof-module reference design.
    tags: [automotive, GNSS, L1, L5, L2, E6, LNA, SAW, BAW, shark fin, ADAS, pricing, architecture]
    sources: "BizDev catalogue and block-diagram library; SKY5A2110 data sheet; ~15 public web requests and searches (TI, u-blox, ST, ABI public summaries, Infineon, distributor snippets)"
    decision: Should we build an all-band automotive GNSS front end (L1 + L2/E6 + L5, one input, Grade 1) from our LNAs and
      Qorvo SAW/BAW filters?
    answer:
      text: 'Not enough data yet on demand: receivers are all-band, but no public figure shows carmakers paying for triple
        band. The single-input L1 + L5 variant and design-in of SKY5A2110 are the safer steps now.'
      conf: low
    needed_now:
    - 'Carmakers: which GNSS bands their 2028–2030 platforms use'
    - 'Filter BU: can E6/L6 and L-band filters be made at the size and loss needed?'
    - 'GNSS BU: design wins and volumes of SKY5A2110'
    say_externally: Lane-level driver assistance is moving car GNSS receivers to several bands, and the roof antenna must
      also keep out the car's own V2X, cellular and Wi-Fi signals. Skyworks sells an automotive L1 + L5 GNSS front-end module
      with filters (SKY5A2110) and the other RF parts of the roof module. We would like to learn which GNSS bands your next
      platforms use, and whether your antennas are single-feed or dual-feed.
    next_steps:
    - what: Ask which GNSS bands the 2028–2030 platforms use, and in which segments
      who: OEM ADAS / positioning team
      why: Decides between an all-band part and L1 + L5 only.
    - what: Ask whether E6/L6 and L-band filters can be made at the size and loss needed
      who: Filter BU
      why: Without these filters the all-band part cannot be built from existing technology.
    - what: Push SKY5A2110 into current shark-fin designs with co-location data next to our V2X and cellular FEMs
      who: Our FAE with Tier-1 antenna module teams
      why: Wins sockets now and shows whether a single input matters.
    bu_opener:
      question: Lane-level ADAS needs all-band GNSS in the shark fin. Should we build an all-band automotive GNSS front end
        (L1 + L2/E6 + L5, one input, Grade 1) from our LNAs and Qorvo SAW/BAW filters at about $1.6–2.6 (est), when TI sells
        a Grade 1 wideband LNA at $0.45?
      pros:
      - SKY5A2110 is already an automotive L1 + L5 module with filters and a diplexed output
      - Strong rejection of cellular, n77/n79 and Wi-Fi in the same roof module
      - With Qorvo we own the GNSS acoustic filters and sell the neighbours in the shark fin
      cons:
      - L1 + L5 only, while receivers (u-blox ZED-X20K, ST STA8135GA) are all-band
      - Grade 2 only and two RF inputs; TI offers Grade 1
      - 'A bare automotive LNA is cheap: TI TRF3302-Q1 at $0.45 (1k)'
      vs: TI, Infineon, NXP (LNAs); Murata, Taoglas (modules); u-blox, ST, Qualcomm (receivers)
    learn:
    - age: 5
      text: Satellites high in the sky send signals that tell the car where it is, like a map that knows where your dot is.
    - age: 10
      text: Cars that steer and keep their lane by themselves need to know their position within a lane, not just the street.
        Using several satellite frequencies at once makes the position much more exact.
    - age: 15
      text: The GNSS front end sits in the roof antenna. It needs a very quiet amplifier (low noise figure), filters that block
        the strong cellular, Wi-Fi and V2X signals in the same shark fin, all wanted bands (L1, L2/E6, L5) and automotive grade.
    - age: 20
      text: The request comes from lane-level ADAS and from receivers that went all-band (u-blox ZED-X20K, ST STA8135GA). Antenna
        makers now want one front end for all bands, with one input and one output.
    - age: 25
      text: TI, Infineon and NXP sell bare LNAs (TI at $0.45, Grade 1); Murata and Taoglas sell modules. Our SKY5A2110 is a
        complete L1 + L5 module but Grade 2 with two inputs. The proposal adds L2/E6, one input and Grade 1 using our LNAs and
        Qorvo filters, plus a cheaper single-input L1 + L5 variant.
