# Research & ideas (Future growth > Research & ideas): research reports and preliminary product ideas and cases.
# One entry per report; the body is app/web/templates/business/reports/<slug>.html (HTML, the site's .rpt styles).
# kind: report (market / technology survey) | idea (a preliminary product idea)
# status: draft (not reviewed) | reviewed | archived
#
# How a report is laid out (the owner's priorities, most interesting first):
#   1. Adjacent products and technologies: what sits next to the topic that we already have or could build
#      (neighbouring parts, IP, processes, acquisitions), and how it combines into a product.
#   2. Where else we see opportunities or devices: other applications, markets and customer systems that need it.
#   3. Market research: the overall trend and development (size, growth, technology shifts, competitors).
# Open with a short summary box and the portfolio position; close with risks and sources.
#
# Business cases for a product idea (kind: idea) use this order, so cases can be compared side by side:
#   In brief · 1. Architecture position (where our blocks sit in the library diagrams vs each competitor, and fit
#   with where the architecture is going) · 2. Our disadvantages and how we make up for them · 3. Reasoning chain
#   (trend -> evidence -> meaning for us) · 4. Market data (value, source, confidence) · 5. Scenarios (for / against)
#   · 6. Product definition (reuses, new, outputs, replaces, answers, delivery) · 7. Pricing (anchor, value,
#   entry / target / premium, assumptions) · 8. Raising the attach rate · 9. Risks and open questions · Sources,
#   with every figure and link in <slug>.background.html. Confidence: high / med / low; "est" marks our estimates.
#   Preliminary cases are structured data: data/business/cases/<slug>.yaml (template: _template.yaml; method page
#   /business/reports/method), and the body template only includes business/_prelim.html.
#
# Grouping fields (Research & ideas groups by these):
#   app_type         application type, e.g. Automotive | Car radio | RF filters (the page groups by it; default Other)
#   feasibility      product ideas only: 1 very close to today's portfolio (firmware, packaging, existing dies) |
#                    2 in between (a new chip from technology we already have) | 3 furthest away (new technology or a
#                    market nobody plays in yet: out-of-the-box thinking, still worth a look)
#   feasibility_why  one line: why this score
#
# Conversation and learning fields (every report and case; Research & ideas renders them):
#   bu_opener        the FIRST question to the business unit: the background question and idea, short, as a
#                    conversation starter, with pros (for us) and cons (against us) versus the competition and vs (who)
#   learn            "Learn about this" tab: one short paragraph each for age 5, 10, 15, 20 and 25 (what it is, why it
#                    matters, what it needs, where the request comes from, competitors and where we stand)
#   learn_links      knowledge-base pages to read next: {label, href} on /library, /rf-notes, /engineering, /visuals
reports:
  - slug: iso7821dww-isolation
    title: 'Reinforced digital isolators for power, charging and cars: TI ISO7821DWW and our 8 mm limit'
    kind: report
    area: Power & isolation
    app_type: Power and charging
    date: 2026-10-21
    status: draft
    question: TI's ISO7821DWW is a reinforced dual-channel digital isolator in a 16-pin extra-wide SOIC (DWW). Which Skyworks
      solutions apply in power conversion, charging (on-board chargers, DC fast chargers) and automotive, and is there a business
      case for an extra-wide-package isolator?
    summary: 'Research idea for a business case. ISO7821DWW: 2 channels (1/1), reinforced, 5.7 kVrms, 14.5 mm creepage, 100
      Mbps, 85 kV/µs, industrial grade. Our closest crosses (Si86S621/622, SSO-8) are reinforced 6 kVrms, 100 kV/µs, 150 Mbps,
      with automotive versions, but none of our 672 digital isolators passes 8 mm creepage, while TI (20 parts) and Novosense
      (6) offer 14.5–15 mm. What 800 V needs (IEC 60664-1, sealed housing = pollution degree 2, group I mould compound):
      reinforced 8.0 mm at 800 V and 10 mm at 1000 V, so 8 mm is just enough at 800 V but not for a fully charged 800 V
      battery or a 1000 V system; where condensation or conductive dust is expected (pollution degree 3) only 14.5 mm works.
      TI prices DWW reels like DW reels ($2.60 vs $2.64 at 1k). Adjacent: our isolated gate drivers, isolated DC-DC and
      isolated amplifiers in the same charger and inverter designs.'
    tags:
    - ISO7821DWW
    - digital isolator
    - reinforced isolation
    - creepage
    - on-board charger
    - DC fast charger
    - EV charging
    - power conversion
    - Si86S621
    - automotive
    - pollution degree
    - 800 V
    sources: BizDev parts database (TI, Skyworks, Novosense digital isolators) and cross results; block-diagram library (66
      of 219 diagrams); TI reference design TIDA-00785; library topic on traction-inverter isolation; public creepage notes
      (TI SLUP419/SLUP421, SLUAAR5, SLLA469, SSZTAI4; MINMAX; Vishay; Skyworks AN583; CONEC; EV Engineering; a TÜV
      IEC 62109-1 report) and the TI ISO7821 product page (prices), 21 Oct 2026.
    bu_opener:
      question: TI sells ISO7821DWW, a 2-channel reinforced isolator in an extra-wide package (14.5 mm creepage) for high-voltage
        power and charging, at the same reel price as its 8 mm version. Our nearest parts (Si86S621/622) stop at 8 mm, which
        is just enough for a reinforced barrier at 800 V in a sealed box, but not at 900–1000 V or where condensation is
        expected. Would an extra-wide package for our existing isolator die be worth it?
      pros:
      - Si86S621/622 beat it on CMTI (100 vs 85 kV/µs), isolation rating (6 vs 5.7 kVrms) and data rate (150 vs 100 Mbps)
      - Automotive (AEC-Q100) versions exist (-AS4); ISO7821DWW is industrial grade
      - 'Large isolator line (672 parts in BizDev) and the neighbours in the same designs: isolated gate drivers, isolated DC-DC,
        isolated amplifiers'
      cons:
      - No Skyworks isolator above 8 mm creepage; TI (20 parts) and Novosense (6) offer 14.5–15 mm. A reinforced barrier
        needs 10 mm at 1000 V (pollution degree 2) and 20 mm at 800 V (pollution degree 3)
      - TI charges no premium for the extra-wide reel (ISO7821DWWR $2.60 vs DWR $2.64 at 1k), so a wider package wins
        sockets, not price
      - Lower working voltage (2121 vs 2828 Vpk) and narrower temperature range (–40 vs –55 °C at the low end)
      - 'Different package and pinout (8 vs 16 pins): no drop-in; Novosense NSI8321W1 is closer (15 mm, 7.5 kVrms); crowded,
        price-driven market'
      vs: TI ISO7821DWW; Novosense NSI8321W1 / NSI8322W1; ADI, Infineon, ST, onsemi, Toshiba, Rohm and Chinese suppliers
    learn:
    - age: 5
      text: 'Some parts of a machine carry dangerous high voltage, others carry tiny safe signals. A digital isolator is a wall
        with a window: the message gets through, the danger does not.'
    - age: 10
      text: Electric cars, chargers and solar inverters work with hundreds of volts. The small computer that controls them must
        talk to the high-voltage side without getting hurt, and so must the people who touch the car or the charger.
    - age: 15
      text: A digital isolator passes on/off signals across an insulating barrier. It is judged by the voltage the barrier withstands
        (kVrms for one minute, working voltage for its lifetime), the distance between the pins on the outside of the package
        (creepage), how fast the voltage may jump without errors (CMTI), speed and temperature grade.
    - age: 20
      text: The request comes from a TI part, ISO7821DWW, seen in power, charging and automotive designs. Its extra-wide package
        gives 14.5 mm creepage, which allows higher working voltages and dirtier environments (a higher pollution degree,
        from a sealed box, PD2, to a place with condensation or conductive dust, PD3). In BizDev, digital isolators
        sit in 66 of 219 application diagrams, among them on-board chargers, DC fast chargers, wallboxes and traction inverters.
    - age: 25
      text: 'TI leads with wide and extra-wide packages; Novosense offers 15 mm parts; ADI, Infineon, ST, onsemi and Chinese
        suppliers crowd the market. Our capacitive isolators (Si86xx, Si88xx) match or beat ISO7821 on CMTI and kVrms and come
        in automotive grade, but our widest package gives 8 mm. Per IEC 60664-1 (as reproduced by TI and MINMAX), a reinforced
        barrier with group I mould compound needs 8 mm at 800 V and 10 mm at 1000 V in a sealed box (pollution degree 2),
        and 20–25 mm where condensation is expected (pollution degree 3), which coating, potting or sealing avoids. TI sells
        the 14.5 mm reel at the 8 mm price. Open: which OEMs design to 900–1000 V, and can our die go into a wider package?'
    learn_links:
    - label: Creepage
      href: /engineering/creepage_mm
    - label: Basic vs reinforced isolation
      href: /engineering/isolation_class
    - label: Isolation rating
      href: /engineering/isolation_rating_kvrms
    - label: Working voltage
      href: /engineering/viorm_vpk
    - label: CMTI
      href: /engineering/cmti_kv_us
    - label: Automotive grade
      href: /engineering/qualification
    - label: 'Interactive: creepage vs working voltage'
      href: /visuals#creep
    - label: 'Interactive: CMTI vs the switching edge'
      href: /visuals#cmti
    - label: 'Library: isolation in the traction inverter'
      href: /library/traction_asil_d
  - slug: filters-1-11ghz
    title: "Standalone filter opportunities, 1–11 GHz"
    kind: report
    area: RF filters
    app_type: RF filters
    date: 2026-10-20
    status: draft
    question: "What could Skyworks suggest for standalone filters, especially wide bandwidth between 1 and 11 GHz, and in which applications?"
    summary: >-
      Best bets combine a filter with parts we already sell: a Wi-Fi 7/8 BAW multiplexer family, a filtered switch-LNA
      module for 5G small cells, and a protected switched filter bank for defense. Wideband (over ~25 %) needs ceramic,
      LTCC or IPD, which we don't have since Trans-Tech (with Lark) was sold; build, buy or partner.
    tags: [filters, Wi-Fi 7, 5G n77, UWB, X-band, defense]
    sources: "BizDev catalogue, competitor and demand data; ~106 public web sources (background notes)"
    bu_opener:
      question: Our filters sit next to LNAs, switches and FEMs we already sell. Should we turn that into a few combined filter
        products (a Wi-Fi 7/8 BAW multiplexer family, a filtered switch-LNA for 5G small cells, a protected filter bank for
        defense), and how do we cover wideband filters now that Trans-Tech and Lark are sold?
      pros:
      - 'We sell every other block of a 1–11 GHz receive chain: LNAs, switches, limiters, PAs, multiplexers'
      - BAW beats LTCC diplexers (Murata, Johanson, Yageo) on 5/6 GHz rejection
      - 'Fewer acoustic rivals: Akoustis exited in 2025'
      cons:
      - Our filters stop at about 7 GHz and are narrowband acoustic only
      - No ceramic, LTCC, IPD or cavity filters since Trans-Tech (with Lark) was sold; they now compete with us
      - 'Wideband catalogue filters are commodity: LTCC at about $4 or less, ~110 Mini-Circuits filters at 4–11 GHz'
      vs: Murata, Johanson, Yageo (LTCC); Trans-Tech and Lark (ceramic, cavity); Mini-Circuits; ADI, MACOM, Mercury (defense)
    learn:
    - age: 5
      text: 'A radio hears many stations at once. A filter is like a sieve: it lets the one station you want through and keeps
        the others out.'
    - age: 10
      text: 'Phones, Wi-Fi routers, cars and radars all send and receive at the same time on nearby frequencies. Without good
        filters they disturb each other: calls drop and Wi-Fi slows down.'
    - age: 15
      text: A filter is judged on how little it loses (insertion loss), how strongly it blocks the neighbours (rejection) and
        how wide its window is (bandwidth). Small acoustic filters (BAW, SAW) are sharp but narrow; windows wider than about
        25 % of the frequency need ceramic, LTCC, IPD or cavity filters.
    - age: 20
      text: 'The question covers 1–11 GHz: Wi-Fi 7/8, 5G n77 small cells, UWB channels 5–9, satellite and S/C/X-band defense
        radios all need filters. Most filter value now sits inside front-end modules, so a standalone filter sells best combined
        with parts we already make.'
    - age: 25
      text: 'BAW is about 91 % Broadcom plus Qorvo; Murata''s XBAR is the main new wideband acoustic technology. For wideband
        we have nothing since Trans-Tech (with Lark) was sold in 2023: build, buy or partner. The best bets reuse our BAW: a
        Wi-Fi 7/8 multiplexer family, a filtered switch-LNA module (QPQ3509/QPQ4900 with QPB9850) and a protected switched filter
        bank (QPB1033, QPB1055).'
    learn_links:
    - label: Filter basics
      href: /rf-notes#filter_fundamentals
    - label: Acoustic filters and duplexers
      href: /rf-notes#acoustic_filters_duplexers
    - label: LTCC technology
      href: /rf-notes#ltcc_technology_power
    - label: Reflectionless filters
      href: /rf-notes#reflectionless_filters
