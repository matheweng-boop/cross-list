      href: /rf-notes#acoustic_filters_duplexers
  - slug: auto-cv2x-fe
    title: "C-V2X front end: two carriers in one module (2–3 years, reuse)"
    kind: idea
    area: Automotive connectivity
    app_type: Automotive
    feasibility: 2
    feasibility_why: "Dual-path module from existing dies, plus a new US guard BAW filter"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (with Qorvo) build next for 5.9 GHz V2X, now that the US is C-V2X only from 14 Dec 2026 on two channels, Europe runs ITS-G5, LTE-V2X and NR-V2X side by side in 5855–5925 MHz and Qualcomm owns Autotalks, reusing SKY5A2105, QPF1003Q and our BAW filters, and at what price?"
    summary: >-
      Business-case draft. We are the only public source of standalone V2X front ends (SKY5A2105, QPF1003Q) and own
      the V2X BAW filters; the wide 5855–5925 MHz passband already exists. Weak points: one path per part, no UNII-4
      rejection in the US, our chipset partner Autotalks now belongs to Qualcomm, and a small market (≈5.7 M V2X cars).
      Proposal: a dual-carrier V2X front end (two TX/RX paths, compensator and ECU modes, EU wide-band and US guard
      filter variants) at about $7–10 (est), replacing two single FEMs plus filter and switch.
    tags: [V2X, C-V2X, NR-V2X, ITS-G5, front-end module, BAW, coexistence, UNII-4, automotive, pricing, architecture]
    sources: "BizDev catalogue and block-diagram library; ~20 public web requests plus earlier connectivity research (5GAA, Skyworks product summaries, ABI, LG Innotek, LCSC, search snippets)"
    decision: Should we build a dual-carrier V2X front end (two paths, EU and US filter variants) for a market of about 5.7
      M V2X cars a year?
    answer:
      text: Not enough data yet. EU dual-mode cars will need two carriers from about 2028 (est), but Qualcomm owning Autotalks
        may close the socket. A yes needs our status on Qualcomm reference designs and a feasible US guard filter.
      conf: low
    needed_now:
    - 'V2X BU: is SKY5A2105 still on Qualcomm / Autotalks reference designs?'
    - 'Filter BU: can our BAW reach a ~20 MHz transition at 5895 MHz with acceptable loss?'
    - 'Carmakers: will they use the US second channel or concurrent ITS-G5 + C-V2X, and when?'
    say_externally: 'V2X is changing: the US moves to C-V2X on two channels and Europe runs ITS-G5, LTE-V2X and NR-V2X side
      by side. Skyworks, with Qorvo, sells automotive V2X front ends (SKY5A2105, QPF1003Q) and V2X BAW filters. We would like
      to learn whether your next units need two V2X carriers at once, and where the V2X RF will sit.'
    next_steps:
    - what: Ask whether SKY5A2105 is still on Qualcomm / Autotalks reference designs, and whether a Qualcomm V2X front end
        is known
      who: V2X BU
      why: If Qualcomm bundles its own front end, most sockets close.
    - what: Ask for test data on a ~20 MHz BAW transition at 5895 MHz
      who: Filter BU
      why: Decides whether the US guard variant can exist.
    - what: Ask whether the US second channel or concurrent ITS-G5 + C-V2X will be used, and from which model year
      who: OEM V2X / connected-safety team
      why: Confirms the need for two carriers and its timing.
    bu_opener:
      question: 'V2X is changing: the US goes C-V2X only on two channels and Europe runs three systems side by side, but Qualcomm
        now owns our chipset partner Autotalks. Should we build a dual-carrier V2X front end (two paths, EU and US filter variants)
        at about $7–10 (est), in a market of about 5.7 M V2X cars a year?'
      pros:
      - Only public source of standalone V2X front ends (SKY5A2105, QPF1003Q)
      - Own V2X BAW filters; the wide 5855–5925 MHz passband Europe needs already exists
      - 'Compensator mode: one part works at the roof antenna or in the ECU'
      cons:
      - 'One path per part: the US second channel and EU concurrent systems need two FEMs'
      - Today's filter does not reject the UNII-4 Wi-Fi next to the US channels
      - Our chipset partner Autotalks is Qualcomm's since Jun 2025; small market
      vs: Qualcomm (with Autotalks), NXP, module makers
    learn:
    - age: 5
      text: 'Cars can talk to each other and to traffic lights by radio, to warn each other: careful, I am braking!'
    - age: 10
      text: This is called V2X (vehicle-to-everything). It warns about a crash ahead or a car hidden around a corner, which
        makes roads safer.
    - age: 15
      text: A V2X front end amplifies the transmit signal (+26 to +29 dBm), receives with low noise and filters out the car's
        own Wi-Fi and cellular radios. It works at 5.9 GHz with each region's channel plan, often at the roof antenna to make
        up for cable loss.
    - age: 20
      text: 'The request comes from rule changes: the US is C-V2X only from 14 Dec 2026 on two channels; Europe runs ITS-G5,
        LTE-V2X and NR-V2X side by side in 5855–5925 MHz. Car makers then need two paths, and in the US a filter against UNII-4
        Wi-Fi right next door.'
    - age: 25
      text: Qualcomm closed Autotalks (Jun 2025), our reference chipset partner; NXP uses two SAF5400 for dual channel. We have
        the only standalone V2X FEMs and the V2X BAW filters. The proposal is a dual-carrier front end with compensator and
        ECU modes and EU wide-band or US guard-filter variants, replacing two single FEMs plus filter and switch.
    learn_links:
    - label: 'Library: 5.9 GHz V2X front ends'
      href: /library/v2x_frontend
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
    - label: Acoustic filters and duplexers
      href: /rf-notes#acoustic_filters_duplexers
    - label: TX/RX isolation options
      href: /rf-notes#txrx_isolation_options
    - label: 'Interactive: link budget and range'
      href: /visuals#link
  - slug: auto-wifi7-fem
    title: "Automotive Wi-Fi 7: a radio head for the smart antenna, with V2X coexistence built in"
    kind: idea
    area: Automotive connectivity
    app_type: Automotive
    feasibility: 2
    feasibility_why: "Headline RH57 needs a compensator mode and coexistence control (new chip work from our technology); the enabling Wi-Fi 7 FEMs and filters reuse existing dies"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (with Qorvo) build for Wi-Fi 7 in cars in 2–3 years, reusing existing technology, given Qualcomm's chip-plus-front-end bundle, on-chip power amplifiers at NXP and Synaptics, the in-car 6 GHz power limits and the documented Wi-Fi-to-V2X interference, and at what price?"
    summary: >-
      Business-case draft, reworked to the depth of the car-radio case. Our advantage is architectural: the only
      supplier with Wi-Fi 7, V2X, cellular and GNSS front ends and the BAW filters between them on one antenna, where
      US DOT measured in-car Wi-Fi cutting C-V2X range by more than half. Proposal: RH57, a radio head per smart
      antenna (Wi-Fi 5 GHz + V2X + Wi-Fi 6 GHz, compensator mode, front-end coexistence control), about $8–11 per
      antenna (est); enabling step: automotive Wi-Fi 7 FEMs with the guard filter (≈$1.6–2.8) and the filters alone.
    tags: [Wi-Fi 7, smart antenna, coexistence, V2X, BAW, front-end module, AEC-Q104, automotive, pricing, architecture]
    sources: "BizDev block-diagram library and catalogue; ~45 public web requests (u-blox product summaries, NTIA/US DOT, Wi-Fi Alliance/IDC, LG Innotek, LCSC, FCC and Counterpoint snippets)"
    decision: Should we build RH57, a radio head per roof antenna with V2X as the base and Wi-Fi 5/6 GHz as an option, with
      BAW filtering between them?
    answer:
      text: 'Not enough data yet for the Wi-Fi part: no carmaker has confirmed a Wi-Fi radio at the roof. The V2X base, automotive
        Wi-Fi 7 FEMs with the guard filter, and the coexistence filters alone are the safe steps now.'
      conf: low
    needed_now:
    - 'Antenna and roof-TCU makers: does the Wi-Fi radio sit on the roof board or in the cockpit?'
    - 'Wi-Fi BU: do our Wi-Fi 7 FEM dies pass AEC-Q104 Grade 2 without a redesign?'
    - 'Filter BU: when do SKY5A1005/1006/1008 leave preview?'
    say_externally: In-car Wi-Fi sits right next to V2X, and US DOT measurements showed in-car Wi-Fi cutting C-V2X range by
      more than half. Skyworks, with Qorvo, sells Wi-Fi 7 front ends, V2X front ends and the BAW filters that separate them.
      We would like to learn where the Wi-Fi radio sits in your roof or smart-antenna design, and how you meet the limits
      at the V2X band edge.
    next_steps:
    - what: Ask whether the Wi-Fi radio sits on the roof board or in the cockpit, and how the cabin is fed
      who: OEM / Tier-1 antenna team
      why: The RH57 headline depends on Wi-Fi at the roof.
    - what: Ask whether our Wi-Fi 7 FEM dies pass AEC-Q104 Grade 2 at 105 °C without a redesign
      who: Wi-Fi BU
      why: Decides whether the enabling automotive FEMs are a package step (distance 2).
    - what: Bring SKY5A1005/1006/1008 out of preview with a coexistence test report against −37 dBm/MHz
      who: Filter BU
      why: Sells today and proves the coexistence argument with data.
    bu_opener:
      question: Wi-Fi 7 is coming to the car's smart antenna, right next to V2X. Should we build RH57, a radio head per antenna
        (V2X base, Wi-Fi 5/6 GHz optional, BAW filters and coexistence control between them) at about $8–11 (est), when Qualcomm
        bundles its own Wi-Fi front end and NXP puts the amplifier on chip?
      pros:
      - Only supplier with Wi-Fi 7, V2X, cellular and GNSS front ends plus the BAW filters between them
      - Automotive coexistence BAW already defined (SKY5A1005/1006/1008, QPQ2200Q/2230Q)
      - 'US DOT measured in-car Wi-Fi cutting C-V2X range by more than half: a problem we can solve'
      cons:
      - 'No chipset: every public automotive Wi-Fi 7 module uses Qualcomm, with its own FEM'
      - No automotive Wi-Fi power amplifier above 802.11ac today
      - In-car 6 GHz power is capped by regulation; NXP and Synaptics put the PA on chip
      vs: Qualcomm, NXP, Synaptics, module makers
    learn:
    - age: 5
      text: The car can have its own Wi-Fi, like at home, so phones and screens inside can go online.
    - age: 10
      text: Wi-Fi 7 is the newest and fastest Wi-Fi. In cars it connects phones to the screens, updates the car's software and
        talks to chargers. But it sits right next to the radio cars use to warn each other (V2X).
    - age: 15
      text: A Wi-Fi front end amplifies and filters the signal at 2.4, 5 and 6 GHz. In a car it must be automotive grade, and
        filters must stop Wi-Fi from blinding V2X at 5.9 GHz, only a few MHz away.
    - age: 20
      text: The request comes from smart-antenna modules on the roof that combine many radios, and from US DOT tests that showed
        in-car Wi-Fi cutting C-V2X range by more than half. Car makers need the two to work side by side.
    - age: 25
      text: 'Qualcomm sells chip plus front end; NXP AW693 and Synaptics put PA, LNA and switch on chip; in-car 6 GHz power
        is capped (US very low power, EU low-power indoor banned in road vehicles). Our edge is architectural: all front ends
        and the BAW filters between them. The proposal is RH57, a radio head per smart antenna, with automotive Wi-Fi 7 FEMs
        with a guard filter as the first step.'
    learn_links:
    - label: 'Library: roof and smart-antenna coexistence'
      href: /library/roof_coexistence
    - label: 'Library: 5.9 GHz V2X front ends'
      href: /library/v2x_frontend
    - label: Wi-Fi FEMs and tri-band APs
      href: /rf-notes#wifi_fem_and_triband_ap
    - label: Acoustic filters and duplexers
      href: /rf-notes#acoustic_filters_duplexers
  - slug: auto-ntn-pa
    title: "Satellite in the car: an NTN front end for the telematics unit (n255/n256)"
    kind: idea
    area: Automotive telematics
    app_type: Automotive
    feasibility: 2
    feasibility_why: "First version from the existing SKY68040-11 die; the 26 dBm version needs a new die"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (now with Qorvo) offer so the car's telematics unit can reach satellites in the L/S-band NTN bands n255/n256 (narrowband from 2027, wideband from 2029), given Qualcomm's modem + RF front end, MediaTek's satellite-ready modem, Murata and module makers, and at what price?"
    summary: >-
      Business-case draft. We already sell an NTN amplifier covering n255 and n256 (SKY68040-11, not automotive) and a
      full AEC-Q104 cellular, GNSS and V2X set that works with any modem; MediaTek's MT2739 needs an external NTN RF
      path. Weak points: no automotive NTN part, nothing at the 26 dBm 5GAA asks for, Qualcomm's bundled front end, and
      narrowband NTN may need no new hardware. Proposal: an automotive NTN add-on module (n255 + n256 PA, GNSS-protecting
      duplexers, receive path), first at 23 dBm from today's die, then 26 dBm for wideband NTN, about $1.5–2.5 and
      $2.5–3.5 in volume (est), plus an antenna-side compensator variant.
    tags: [automotive, telematics, NTN, satellite, n255, n256, power class 2, Skylo, Iridium, Starlink, MediaTek MT2739, Qualcomm, pricing, architecture]
    sources: "BizDev block-diagram library and catalogue; 5GAA NTN technical report; Skyworks product summaries; MediaTek, CCS Insight, Marelli; search snippets (ABI, Counterpoint, Qualcomm, DCD, RCR); about 10 new public web requests (background notes)"
    decision: Should we build an automotive NTN add-on module for n255/n256, first at 23 dBm from today's SKY68040-11 die,
      then at 26 dBm?
    answer:
      text: 'Not for 2027: narrowband satellite can run on today''s front ends. Worth preparing for wideband NTN from 2029,
        if 3GPP adopts a higher vehicle power class and SKY68040-11 passes automotive stress (est).'
      conf: low
    needed_now:
    - 'Cellular BU: SKY68040-11 output power at n255/n256, and can the die pass AEC-Q104?'
    - 'Carmakers: from which model year satellite, and narrowband by firmware or wideband with new RF?'
    - 'Filter BU: can n255/n256 duplexers keep deep GNSS L1 rejection?'
    say_externally: Cars will reach satellites in the n255 and n256 bands, narrowband from about 2027 and wideband later.
      Skyworks sells a power amplifier that covers both bands (SKY68040-11) and automotive cellular, GNSS and V2X front ends
      that work with any modem. We would like to learn from which model year you plan satellite connectivity, and whether
      by firmware only or with new RF.
    next_steps:
    - what: Ask for SKY68040-11 output power and linearity at n255/n256, and whether the die can pass AEC-Q104
      who: Cellular BU
      why: Decides whether NTN-23 can be built from today's die.
    - what: Ask from which model year and in which regions satellite is planned, narrowband or wideband
      who: OEM connected-car team
      why: Tells us whether there is a hardware socket before 2029.
    - what: Follow 3GPP Rel-19/20 vehicle power-class work and 5GAA reports on 26 dBm
      who: Daily run (public standards)
      why: Without a vehicle power class above 23 dBm, the 26 dBm module is a proprietary option.
    bu_opener:
      question: From 2027 cars will reach satellites in the n255/n256 bands. Should we build an automotive NTN add-on module
        (23 dBm from today's SKY68040-11 die, then 26 dBm) at about $1.5–2.5 and $2.5–3.5 (est), when Qualcomm sells modem plus
        front end and narrowband satellite messaging may need no new hardware at all?
      pros:
      - We already ship an NTN amplifier for n255 and n256 (SKY68040-11)
      - Full AEC-Q104 cellular, GNSS and V2X set that works with any modem; MediaTek's MT2739 needs an external NTN path
      - 'We make both sides of the hardest problem: the NTN transmitter and the GNSS front end it can blind'
      cons:
      - SKY68040-11 is not automotive-qualified, and nothing we sell reaches 26 dBm
      - Qualcomm bundles modem and automotive front end
      - 'Narrowband NTN can come by firmware on existing TCUs: maybe no new socket in 2027'
      vs: Qualcomm, MediaTek, Murata, Quectel
    learn:
    - age: 5
      text: Where there are no phone towers, a car can still call for help by talking to a satellite in space.
    - age: 10
      text: Cars already have a phone inside (the telematics unit) for emergency calls and updates. Adding satellite means it
        keeps working in mountains, deserts and on empty roads.
    - age: 15
      text: Satellites are far away, so the car must send with more power (23 to 26 dBm), listen very carefully (low noise)
        and use new bands, n255 and n256. The satellite uplink sits only about 50 MHz above GPS, so strong filters are needed
        to keep the car's own navigation working.
    - age: 20
      text: 'The request comes from the 5GAA roadmap: narrowband satellite messaging from 2027, wideband from 2029, and a 26
        dBm vehicle class asked from 3GPP. Modem makers (MediaTek MT2739) already have satellite inside but need an external
        RF path.'
    - age: 25
      text: 'Qualcomm sells modem plus its own front end; Murata and Quectel sell certified NTN modules. We have SKY68040-11
        for n255/n256 (not automotive) and the full automotive TCU set. The proposal: an automotive NTN add-on module, 23 dBm
        first from today''s die, 26 dBm later, with GNSS-protecting duplexers and an antenna-side variant.'
    learn_links:
    - label: 'Library: telematics unit RF front end'
      href: /library/tcu_rf
    - label: 'Library: automotive GNSS front ends'
      href: /library/gnss_frontend
    - label: Satellite communication basics
      href: /rf-notes#satcom_ground_segment
    - label: 'Interactive: link budget and range'
      href: /visuals#link
    - label: 'Interactive: dBm, the power ladder'
      href: /visuals#dbm
  - slug: auto-redcap-ecall
    title: "NG-eCall and RedCap: a one-transmitter front end for value TCUs"
    kind: idea
    area: Automotive telematics
    app_type: Automotive
    feasibility: 1
    feasibility_why: "One-transmitter module from existing SKY5A2206 dies and duplexers"
    date: 2026-10-20
    status: draft
    question: "What should Skyworks (now with Qorvo) offer for the low-cost LTE Cat-1bis / 5G RedCap telematics unit that every new EU car needs for NG-eCall from 2026–2027, against Qualcomm's modem with its own RF front end, Murata, and MediaTek / Quectel modules, and at what price?"
    summary: >-
      Business-case draft. EU NG-eCall (new types from 1 Jan 2026, all new vehicles from 1 Jan 2027) and 2G/3G
      switch-offs put an LTE or 5G TCU in about 12 M EU cars and vans a year; RedCap SOPs start about 2028. We have a
      qualified automotive cellular set and low-cost IoT front ends that work with any modem, but the set is sized for
      4×4 MIMO, Qualcomm's A10 RedCap modem comes with its own front end and Chinese vendors set Cat-1bis prices.
      Proposal: one regional single-transmit module (PA + duplexers + switch) for Cat-1bis, Cat-4 and RedCap plus an
      optional second receiver, about $2.2–3.4 and $0.6–1.0 in volume (est), with a satellite-port option.
    tags: [automotive, telematics, NG-eCall, RedCap, eRedCap, LTE Cat-1bis, 2G/3G sunset, Qualcomm A10, MediaTek, Quectel, US connected-vehicle rule, pricing]
    sources: "BizDev block-diagram library and catalogue; 5GAA eCall position paper; Skyworks product summaries; Marelli release; search snippets (EUR-Lex/LawPlayer, ACEA, ABI, Qualcomm, BIS, Counterpoint, ResearchAndMarkets); about 8 new public web requests (background notes)"
    decision: Should we offer one single-transmit front-end module (VT1) for Cat-1bis, Cat-4 and RedCap NG-eCall telematics
      units?
    answer:
      text: Yes, a near-term module from existing dies is worth it for non-Qualcomm modems. Price against Chinese Cat-1bis
        vendors is the main doubt, so start with the RedCap kit from today's parts.
      conf: med
    needed_now:
    - 'Cellular BU: can SKY5A2206, SKY5A2205 and the duplexers combine into one AEC-Q104 module, and at what cost?'
    - 'Tier-1s: which radio their 2027–2030 eCall units use (Cat-1bis, Cat-4 or RedCap)'
    - 'Sales: how far we are above Chinese Cat-1bis prices, from lost quotes'
    say_externally: Every new EU car needs an LTE or 5G emergency-call unit from 2027, and many will use low-cost Cat-1bis
      or 5G RedCap modems. Skyworks sells automotive-qualified cellular front ends and low-cost IoT front ends that work with
      any modem. We would like to learn which radio your next eCall units use, and who chooses the RF front end.
    next_steps:
    - what: Ask whether SKY5A2206, SKY5A2205 and the duplexers combine into one AEC-Q104 module, and what VT1 would cost
      who: Cellular BU
      why: Sets the price floor for the $2.2–3.4 range (est).
    - what: Offer the RedCap kit from today's parts to module makers on non-Qualcomm modems
      who: Our FAE with module makers (Quectel, Fibocom type)
      why: Wins early sockets and shows which bands one module must cover.
    - what: Ask whether 2027–2030 eCall programmes use Cat-1bis, Cat-4 or RedCap
      who: Tier-1 telematics team
      why: Decides whether VT1 leads with LTE or RedCap.
    bu_opener:
      question: Every new EU car needs an LTE or 5G emergency-call unit from 2027 (NG-eCall), about 12 M cars and vans a year.
        Should we offer one single-transmit front-end module for Cat-1bis, Cat-4 and RedCap at about $2.2–3.4 (est), when Qualcomm's
        A10 comes with its own front end and Chinese vendors set Cat-1bis prices?
      pros:
      - Qualified automotive cellular set today (SKY5A2206, SKY5A2205, SKY5A2203, SKY5A5010)
      - 'Works with any modem: fits RedCap and Cat-1bis modems without their own front end (MediaTek, UNISOC, Sequans)'
      - With Qorvo, BAW/SAW filters and automotive antenna switches in house
      cons:
      - Qualcomm's A10 RedCap modem comes with Qualcomm's own front end
      - Cat-1bis is a Chinese-led, price-driven market
      - Our set is sized for 4×4 MIMO 5G (up to 7 parts); RedCap needs 1 transmitter and 1–2 receivers
      vs: Qualcomm, Murata, MediaTek / Quectel modules, Chinese PA vendors
    learn:
    - age: 5
      text: If a car has an accident, it can call for help by itself, even if nobody inside can speak.
    - age: 10
      text: In Europe every new car must have this automatic emergency call (eCall). The old 2G and 3G networks are switching
        off, so new cars need a 4G or 5G phone inside, at least for this.
    - age: 15
      text: The emergency-call unit needs one transmitter, one or two receivers and the regional bands, and it must survive
        a crash (backup antenna). It must be very cheap, because many cars have it only because the law asks for it.
    - age: 20
      text: 'The request comes from EU NG-eCall: new types from 1 Jan 2026, all new vehicles from 1 Jan 2027, about 12 M EU
        cars and vans a year; 5G RedCap units start about 2028. Low-cost modems without their own front end need an external
        one.'
    - age: 25
      text: 'Qualcomm''s A10 RedCap modem bundles its front end; Murata and MediaTek/Quectel modules compete; Chinese PA vendors
        set Cat-1bis prices. Our automotive set is qualified but sized for premium 4×4 MIMO. The proposal: one regional single-transmit
        module (PA + duplexers + switch) with an optional second receiver and a satellite-port option.'
