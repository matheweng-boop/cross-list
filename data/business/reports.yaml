        and TPSI2140-Q1 (1200 V integrated relay, $2.90) for insulation monitoring. Our Si875x isolated FET driver does the same job
        at 2.5 kVrms only; our gate drivers, Si89xx sensing, isolators and isolated bias complete the set. Proposal: a reinforced
        Si875x successor (feasibility 2) and a 1200 V integrated relay later (feasibility 3).'
