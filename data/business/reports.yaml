      question: Utility solar and battery storage have moved to 1500 V DC, where the safety barrier between power and control needs about
        15 mm creepage; data centers move to 800 V DC at up to 3000 m. Our AN1456 already announces an ultra-wide SOIC (>15 mm). Should we
        put our isolator, isolated-amplifier and gate-driver dies into it and sell a 1500 V barrier set at about $2.0–2.6 a part (est)?
