# Frequency band (and, for power amplifiers, output-power class) needed by each RF block in the application
# block-diagram templates (data/blocks/templates.yaml and background_templates.yaml). Step 3 of the RF coverage
# method in data/business/rf_bands.yaml: the RF coverage page can count demand per block from this file instead of
# guessing bands from application names.
#
# Scope: every template with at least one function from rf_bands.yaml `functions`; one entry per group x function
# occurrence (a function listed twice in one group is one entry).
#   bands  band ids from rf_bands.yaml (sub1 < 1 GHz, L, S, C, X, Ku, K/Ka = "Ka", > 40 GHz = "mmw").
#   power  power_amplifier / rf_predriver only, class ids from rf_bands.yaml (low <= 30 dBm, mid 30-40, high > 40),
#          given only when a source states the power or the system class is well established; otherwise omitted.
#   basis  why: the source (research ids in data/blocks/research/) or the standard allocation used.
#
# How values were decided, in order: (1) frequencies or parts stated by the template's own sources (vendor pages,
# data sheets, research files); (2) the standard allocation of the named system (cellular FR1 0.6-5 GHz, Wi-Fi
# 2.4 / 5 / 6 GHz, GNSS L1 / L5, UWB ch5 / ch9, V2X 5.9 GHz, NTN n255 / n256, SDARS 2.3 GHz, AM/FM/DAB, DOCSIS);
# (3) for generic architecture diagrams (superheterodyne, zero-IF, radar, EW, spectrum / network analyzer) the bands
# the architecture is typically used for, marked "band not stated" / "typical" in basis.
# IF, LO and baseband stages carry the band of the frequency at that stage (an IF strip or COHO is sub1, a
# microwave LO is in the RF band); basis says so. Undeterminable blocks have bands: [] and basis "not stated".
# Updated 2026-10-20.

