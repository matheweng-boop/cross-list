  - id: radio
    name: Broadcast radio and TV tuners
    ours: "Skyworks automotive AM/FM tuners, digital radio coprocessors (DAB, HD Radio), consumer single-chip radios, TV tuners and demodulators"
    risks:
      - id: radio-sdr-soc
        gist: "Head-unit SoCs that demodulate every radio standard in software may remove our digital radio coprocessors, later the tuners."
        abstract:
          - "Simple tuners or direct-sampling ADCs feed software radio in the SoC."
          - "DAB and HD coprocessors first, tuners later."
          - "Confirm the risk; it bears on the radio tuner case."
        threat: "Software-defined radio: one processor or the head-unit SoC demodulates every standard in software, fed by simple RF tuners or direct-sampling ADCs."
        kind: technology
        who: [NXP, head-unit SoC makers]
        likelihood: high
        when: 1-2 years
        impact: "Digital radio coprocessors (DAB / HD) first; later the tuners if the SoC maker supplies its own front end."
        signs:
          - "Car makers' new head units using an SDR processor with a third-party tuner."
          - "Cockpit SoCs advertising radio demodulation in software."
        links:
          - {label: Car radio, href: /broadcast}
          - {label: "Case: next radio tuner", href: /business/reports/radio-tuner-next}
        sources:
          - "NXP public product pages - SAF4000 software-defined car radio processor"
      - id: radio-broadcast-decline
        gist: "Tuners per car may fall to save cost, but digital radio and AM mandates raise radio content per car, so the market still grows."
        abstract:
          - "Carmakers cut phase-diversity tuners and some drop AM, so tuner count per car falls."
          - "Mandates (EU digital radio, US AM bill, possibly China) add content per car: the TAM goes up."
          - "Confirm the risk, or ignore."
        threat: "Less broadcast radio in the car: streaming and connected radio, and some electric cars dropping AM."
        kind: market
        who: [Car makers, streaming services]
        likelihood: medium
        when: now
        impact: "Tuner count per car may go down for cost reasons (fewer phase-diversity tuners, single-tuner radios, some cars without AM), so AM/FM tuner units fall. The radio market (TAM) still goes up: mandates add content per car (a DAB+ demodulator in every new EU car since Dec 2020, AM kept by the US bill, a possible China CDR / DRM mandate), and the number of cars stays flat at about 90–92 M a year."
        answer: "Your comment (26 Oct 2026): 'Tuner count possibly going down for cost reasons, but TAM going up due to mandates.' Added to the impact above. The tuner layer and the radio layer are shown separately on the TAM page (radio topic), so a falling tuner count and a rising radio TAM can both be seen."
        signs:
          - "Car models launched without AM or with a single tuner."
          - "Outcome of the US 'AM Radio for Every Vehicle' bill and EU DAB+ mandates (DAB+ is required in new cars in the EU since 2020, which supports our digital radio parts)."
        links:
          - {label: Radio configurations, href: /broadcast/configurations}
        sources:
          - "EU Electronic Communications Code (Directive 2018/1972), Annex XI - digital radio in new cars"
          - "US Congress, 'AM Radio for Every Vehicle Act' (public bill text)"
      - id: radio-low-cost-consumer
        gist: "Low-cost Chinese single-chip FM/DAB radios take price-driven consumer sockets from our Si47xx."
        abstract:
          - "Chinese radio chip makers price aggressively."
          - "Si47xx loses consumer sockets now."
          - "Confirm the risk, or ignore."
        threat: "Low-cost Chinese single-chip FM/DAB radios for consumer products."
        kind: competitor
        who: [Chinese radio chip makers]
        likelihood: medium
        when: now
        impact: "Consumer single-chip radios (Si47xx) lose price-driven sockets."
        answer: "Numbers (your question, 26 Oct 2026): only the market size is public. WorldDAB counts nearly 150 million DAB / DAB+ receivers sold to Feb 2025 in the markets it tracks, including radios fitted in new cars (UK, Germany, France, Australia and others). Not Enough Data for the risk itself: no public figures were found for Chinese chip makers' share, their chip prices, or our Si47xx consumer units. Needed: consumer radio units sold a year by region, the chip inside (public teardowns), and Chinese FM / DAB chip prices from a public price list."
