        kind: competitor
        who: [TI, Microchip, ADI]
        likelihood: medium
        when: 1-2 years
        impact: "Our PoE PSE controllers and PD interfaces."
        signs:
          - "Switch reference designs with PSE built in."
        links:
          - {label: Browse PoE parts, href: "/parts?q=Si34"}
        sources:
          - "TI, Microchip and ADI public PoE product pages"
