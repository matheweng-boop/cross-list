# Questions to ask per segment (owner, 9 Nov 2026): "Ideally we should start including questions to customers and to
# the Business Unit on all of the segments, to understand what the applications are about, and what forward-thinking
# topics one should ask the customers and the developers."
#
# One set per system and per sub-system of data/blocks/systems.yaml (key "<system>" or "<system>/<sub-system>"),
# shown in the Systems library under "Questions to ask" with an answer box per question
# (app/services/segment_questions.py, app/services/answers.py; answers stored under slug "seg:<key>").
#   customer:    to the customer, understanding the application (what it does, where, volume range and lifecycle,
#                sourcing approach in general terms, pain points, what drives the choice)
#   developers:  to the customer's design engineers, forward-looking (next architecture, the specs they will need,
#                technology shifts, what they wish existed)
#   bu:          to our business unit (what we sell into it, roadmap fit, qualification, competitors met, what wins or
#                loses sockets)
#   reports:     research reports or cases whose own Questions to ask cover the segment (linked, not repeated here)
# Each question: {id, text, why}. Ids are unique per set and never change or get reused (answers are stored by id);
# the text may be edited. Neutral, public wording (guests see the questions): ask for ranges and approaches, never
# for confidential figures, prices, customer programmes or roadmaps in detail. A system's own set holds the
# cross-cutting questions; its sub-systems hold the specific ones.
segments:
  # ---- Automotive ---------------------------------------------------------------------------------------------------
  automotive:
    customer:
      - {id: c-arch, text: "How far has your vehicle architecture moved from domain ECUs to zonal controllers and a central computer, and which functions move first?", why: "Zonal and central architectures decide which boxes keep their own RF, power and isolation, and which disappear."}
      - {id: c-grade, text: "Which temperature grade and qualification level do you ask for by location (cabin, roof, under hood, battery pack)?", why: "AEC-Q100 grade and AEC-Q104 for modules decide which of our consumer and industrial dies can follow."}
      - {id: c-sourcing, text: "Do you choose key semiconductors yourself (directed buy) or leave them to the Tier-1, and has that changed since the 2021–2023 shortage?", why: "Tells us whether to sell to the OEM, the Tier-1 or both."}
    developers:
      - {id: d-voltage, text: "Which voltage levels will your next platform carry (12 V, 48 V, 400 V, 800 V), and where does 48 V replace 12 V?", why: "48 V and 800 V reshape every power, isolation and protection socket in the car."}
      - {id: d-sdv, text: "What does the software-defined vehicle change for your hardware: over-the-air updates, diagnostics, more sensors per ECU?", why: "Shows where self-test, telemetry and configurable parts gain value."}
      - {id: d-ntn-radio, text: "Which radios do you expect in every car by about 2030 (5G RedCap, NTN satellite, Wi-Fi 7, UWB, V2X), and which stay options?", why: "Separates standard sockets from premium-only ones for our RF roadmap."}
    bu:
      - {id: b-aec, text: "Which of our RF, timing, isolation and power families are AEC-Q100 qualified today, and which could be qualified on existing dies?", why: "Qualification is the gate for almost every car socket on this map."}
      - {id: b-tier1, text: "Which Tier-1s already buy from us in automotive, and in which functions?", why: "An existing supplier relationship is the shortest path to a new socket."}
      - {id: b-lost, text: "Where have we lost car sockets recently, and was it price, qualification, supply security or a missing feature?", why: "Lost sockets show what to fix before we chase new ones."}
  automotive/car-access:
    reports: [auto-uwb-15-4ab, auto-uwb-cpd]
    customer:
      - {id: c-fitment, text: "In which vehicle lines do you fit a UWB digital key today, and is it standard or an option?", why: "Fitment rate drives anchor volume: a standard key means 4 to 8 anchors per car."}
      - {id: c-anchors, text: "How many UWB anchors per car do you plan, and where do they sit (roof, pillars, bumpers, interior)?", why: "Anchor count and location set the front-end and the temperature grade."}
      - {id: c-cpd, text: "How do you plan to meet the Euro NCAP child presence detection rules: 60 GHz radar, UWB radar from the key anchors, or both?", why: "Re-using key anchors as radar is the case for our UWB front end in the cabin."}
      - {id: c-pain, text: "What causes the most trouble today in keyless entry: relay attacks, phone compatibility, wake-up current or range near the car?", why: "Pain points tell us which feature sells (secure ranging, low quiescent current, better link budget)."}
    developers:
      - {id: d-4ab, text: "When do you expect to move from 802.15.4z to 802.15.4ab, and will you use the narrowband assist radio?", why: "4ab with narrowband assist adds a second radio near 5.9–6.5 GHz next to V2X; that is a new filter and switch need."}
      - {id: d-ch9, text: "How exposed is your design to losing UWB channel 9 if 7.125–8.4 GHz goes to mobile networks at WRC-27?", why: "A channel plan change would force new filters and possibly new chips."}
      - {id: d-sense, text: "Would you use the same UWB anchors for intrusion, kick and gesture sensing, and what update rate and range do you need?", why: "Sensing modes raise duty cycle, power and linearity needs on the anchor."}
      - {id: d-ble, text: "Do you want BLE, UWB and NFC in one module, or separate chips that you place freely?", why: "Decides whether a combo front end or discrete parts win."}
      - {id: d-wish, text: "What would you change in today's UWB anchor chips if you could: power, size, cost, transmit power or safety support?", why: "A direct line into a next-generation anchor spec."}
    bu:
      - {id: b-uwb-auto, text: "Which of our UWB chips (ex-Qorvo) or 6–8.5 GHz front-end parts could go automotive, and what qualification work is missing?", why: "Measures the distance from today's consumer UWB parts to a car anchor."}
      - {id: b-ble-fem, text: "Do we sell BLE front ends or switches into phone-as-a-key modules today?", why: "Shows a foothold we can extend to UWB in the same module."}
      - {id: b-comp, text: "Which competitors do we meet in car access (NXP, Infineon, ST), and what wins there: chipset bundle or RF performance?", why: "A chipset-led socket is hard to win with a stand-alone part."}
      - {id: b-ref, text: "Is there a reference design with a UWB SoC vendor that we could extend to automotive?", why: "Car anchors are designed around the SoC vendor's reference design."}
  automotive/car-radio:
    reports: [radio-auto-fit, radio-tuner-next, auto-wireless-audio]
    customer:
      - {id: c-standards, text: "Which broadcast standards does each of your markets need (AM, FM, DAB+, HD Radio, DRM), and are you dropping AM anywhere?", why: "The standard mix decides the tuner and demodulator line-up per region."}
      - {id: c-box, text: "Is the tuner in the head unit, in a separate tuner box or moving to the antenna?", why: "A radio node at the antenna is our report's case; the location decides the form factor."}
      - {id: c-diversity, text: "How many tuners do you use per car (background scan, phase diversity), and in which trim levels?", why: "Tuner count per car drives volume more than car count."}
      - {id: c-pain, text: "What do drivers complain about most: FM reception in cities, AM noise from the EV powertrain, DAB dropouts?", why: "EV noise on AM and long-wave is a growing pain that filters and layout can address."}
    developers:
      - {id: d-sdr, text: "Do you plan a software-defined radio that digitises the whole band, or stay with dedicated tuner chips?", why: "A wideband digitiser changes what front end, clock and filter are needed."}
      - {id: d-ethernet, text: "Would you send the radio as digital audio over automotive Ethernet from the antenna?", why: "Ethernet from the roof removes coax and favours a radio node near the antenna."}
      - {id: d-hybrid, text: "How much do you rely on hybrid radio (switching between broadcast and IP streams)?", why: "Hybrid radio changes how much broadcast performance still matters."}
      - {id: d-clock, text: "Which clock and crystal set-up do your tuners use today, and would you share one clock with other radios?", why: "A shared clock is a timing socket for us next to the tuner."}
    bu:
      - {id: b-auto-dies, text: "Which of our radio tuner and demodulator dies are already automotive-qualified, and which only lack qualification?", why: "Qualification gaps are cheaper to close than new designs."}
      - {id: b-lifecycle, text: "What is the expected remaining life of our current car radio families, and is a successor planned?", why: "Car programmes need 10–15 years of supply."}
      - {id: b-comp, text: "Which competitors win car radio sockets today (NXP, ST, Infineon), and on what: integration, price or software?", why: "Shows whether a reuse-only product can compete."}
      - {id: b-hd, text: "Do we hold the licences and software stacks needed for HD Radio and DAB+ demodulation?", why: "Licences and software are often the hidden cost of a radio socket."}
  automotive/telematics-v2x:
    reports: [auto-ntn-pa, auto-redcap-ecall, auto-cv2x-fe, auto-gnss-l1l5, auto-wifi7-fem, auto-wifi-antenna]
    customer:
      - {id: c-tcu-where, text: "Is your telematics unit moving into the roof module, and which radios go with it?", why: "A roof TCU shortens coax and changes coexistence and temperature needs."}
      - {id: c-regions, text: "Which regions need V2X in your plans (China, US, Europe), and which technology per region?", why: "C-V2X, 802.11p and their mix decide the 5.9 GHz front end."}
      - {id: c-ecall, text: "How will you meet NG-eCall in Europe and the 2G/3G shutdowns: a full 5G module or a RedCap one?", why: "Value TCUs on RedCap are a one-transmitter front-end opportunity."}
      - {id: c-lifecycle, text: "How long must the telematics hardware stay supported, and how do you handle network changes during the car's life?", why: "A 15-year life favours parts with long supply and wide band support."}
    developers:
      - {id: d-ntn, text: "Do you plan satellite (NTN) messaging or data in the TCU, at which power class, and on which bands (n255/n256, others)?", why: "NTN at 26 dBm on L/S bands needs a new PA and GNSS coexistence filtering."}
      - {id: d-coex, text: "What isolation do you reach today between cellular, V2X, Wi-Fi and GNSS antennas in one module, and which pair is hardest?", why: "Coexistence filters are where our BAW parts add value."}
      - {id: d-gnss, text: "Are you moving GNSS to L1 plus L5 (and L2/E6) for lane-level positioning, and with which correction service?", why: "Multi-band GNSS needs a new LNA and filter chain in the fin."}
      - {id: d-wifi7, text: "Will the car get Wi-Fi 7 in the 6 GHz band, and how will you protect V2X at 5.9 GHz next to it?", why: "Wi-Fi 6/7 next to V2X needs notch and band-pass filters on both paths."}
      - {id: d-wish, text: "Which part do you wish existed for the roof module: a combined front end, a better GNSS LNA, a 5.9 GHz notch?", why: "A direct pointer to a module spec."}
    bu:
      - {id: b-tcu, text: "Which of our cellular front-end modules are in automotive TCUs today, and with which modem platforms?", why: "Modem reference designs decide most TCU front-end sockets."}
      - {id: b-ntn, text: "Is an automotive NTN power amplifier on the roadmap, and can existing dies reach AEC-Q100?", why: "NTN in cars is a new socket with few suppliers."}
      - {id: b-comp, text: "Which competitors do we meet in the TCU (Qualcomm RFFE, Murata, Broadcom), and what wins: modem bundle or module size?", why: "Shows where a stand-alone module can still win."}
      - {id: b-baw, text: "Do we have automotive-grade BAW filters for 5.9 GHz V2X and for the Wi-Fi bands next to it?", why: "Coexistence filters are the most direct car socket for our filter line."}
  automotive/adas:
    customer:
      - {id: c-sensors, text: "Which sensor set do your next vehicles carry (number of radars, cameras, lidar), and which assistance level do you target?", why: "Sensor count per car drives demand for power, clocks and links."}
      - {id: c-central, text: "Is sensor data processed in each sensor, in a zonal controller or in a central computer?", why: "Central processing moves clocks, SerDes and power into one box."}
      - {id: c-ncap, text: "Which Euro NCAP or local test protocols drive your sensor choices in the next three years?", why: "Regulation sets timing and fitment rates."}
      - {id: c-pain, text: "What is hardest in your ADAS hardware today: heat, power, EMC, functional safety or cost?", why: "Points to the part that would help most."}
    developers:
      - {id: d-radar, text: "Are you moving to 4D imaging radar, and how many transmit and receive channels do you plan?", why: "Imaging radar multiplies clock, power and supervision needs per radar."}
      - {id: d-links, text: "Which camera and radar links will you use (GMSL, FPD-Link, ASA, automotive Ethernet), and at what data rates?", why: "Link choice decides SerDes clocks and power over coax."}
      - {id: d-clock, text: "Do you need a crystal-free or shared clock tree across the central computer and zones?", why: "Our automotive clock-tree case targets exactly this."}
      - {id: d-power, text: "What power does the central ADAS computer draw, and does it move to 48 V input?", why: "48 V input changes the front-end protection and the converter chain."}
    bu:
      - {id: b-timing, text: "Which of our clocks and oscillators are in ADAS computers or radars today?", why: "Timing is our most likely ADAS foothold."}
      - {id: b-asil, text: "Do we offer ASIL documentation (safety manual, FMEDA) for the parts we would place in ADAS?", why: "Without safety documents ADAS sockets are closed."}
      - {id: b-comp, text: "Which competitors hold ADAS clock and power sockets (TI, Renesas, Analog Devices), and how do they win?", why: "Sets the bar for a clock or power entry."}
      - {id: b-isolation, text: "Is there any isolation or RF need in ADAS that our families meet without new silicon?", why: "Finds low-effort fits."}
  automotive/powertrain:
    reports: [auto-48v-motor-control, hv-extra-wide-isolation]
    customer:
      - {id: c-voltage, text: "What share of your next platforms is 800 V, and do you keep 400 V lines in parallel?", why: "800 V sets the creepage, CMTI and reinforced isolation needed in the inverter."}
      - {id: c-make-buy, text: "Do you design the traction inverter in-house or buy it from a Tier-1 or e-drive maker?", why: "Tells us who chooses the gate drivers and isolated sensing."}
      - {id: c-semis, text: "Which power switches do you use (SiC, IGBT, mixed), and how do you source them in general terms?", why: "SiC drives faster switching and stricter isolation needs."}
      - {id: c-pain, text: "What fails or limits you most in the inverter today: short-circuit detection, EMC, thermal, cost or safety certification?", why: "Guides the gate-driver and sensing features that win."}
    developers:
      - {id: d-scp, text: "How fast must short-circuit protection react with your next SiC modules, and which method will you use (DESAT, sense-FET, current mirror)?", why: "SiC withstand times under 3 µs push driver protection features."}
      - {id: d-active-gate, text: "Are you considering active or programmable gate driving that changes drive strength by temperature and load?", why: "A trend that changes the gate-driver interface and silicon."}
      - {id: d-creepage, text: "Do you size isolation for 800 V nominal or for the full-charge / 1000 V level, and do you accept conformal coating?", why: "Decides between 8 mm and wider packages."}
      - {id: d-health, text: "Which health data do you want from the driver (temperature, Vth, switching times) and over which interface?", why: "Gate drivers are absorbing sensing and diagnostics."}
      - {id: d-asil, text: "Do you need certified SEooC gate drivers with built-in self-test, or is ASIL-D capable enough?", why: "Certification is becoming a selection criterion."}
    bu:
      - {id: b-drivers, text: "Which of our isolated gate drivers and isolated amplifiers are in traction inverters today, and at which voltage class?", why: "Our current footprint in the inverter."}
      - {id: b-asil, text: "What is the certification status of our ASIL-D-pending driver families?", why: "Certification status decides new 800 V sockets."}
      - {id: b-bias, text: "Do we have, or plan, a reinforced isolated bias supply to pair with the gate drivers?", why: "A missing companion part can lose the whole socket."}
      - {id: b-comp, text: "Which competitors do we meet in traction (Infineon, TI, ST, NXP), and what decides: CMTI, protection features, price or bundle?", why: "Shows what to stress or fix."}
  automotive/battery-power:
    reports: [auto-hv-hot-swap, iso7821dww-isolation]
    customer:
      - {id: c-bms, text: "How is your battery management built: centralised, modular with a daisy chain, or wireless BMS?", why: "Wireless BMS removes isolated links but adds a radio per module."}
      - {id: c-48v, text: "Do your next platforms add a 48 V board net, and which loads move to it first?", why: "48 V distribution needs new protection and DC/DC parts."}
      - {id: c-pdb, text: "Are you replacing fuses and relays with eFuses and smart switches in the power distribution?", why: "Smart distribution is a growing socket for protection and sensing."}
      - {id: c-pain, text: "What is hardest in the battery and distribution system today: pre-charge, isolation monitoring, wiring weight or diagnostics?", why: "Points to the function to sell."}
    developers:
      - {id: d-precharge, text: "How will you do pre-charge and disconnect at 800 V: mechanical contactors, solid-state switches or both?", why: "Solid-state switching needs isolated drivers and fast sensing."}
      - {id: d-isolation, text: "Which isolated communication and sensing do you need between the HV battery and the 12 V side, and at what isolation class?", why: "Reinforced isolators and isolated amplifiers are our core fit."}
      - {id: d-dcdc, text: "What power and topology do you plan for the HV-to-LV DC/DC, and will it be bidirectional?", why: "Bidirectional converters need more isolated drivers and sensing."}
      - {id: d-wbms, text: "If you use wireless BMS, which radio band and protocol, and what reliability target?", why: "A wireless BMS is an RF front-end socket in the pack."}
    bu:
      - {id: b-isolators, text: "Which of our isolators are in BMS and junction boxes today, and do we cover 8 mm creepage at automotive grade?", why: "Creepage and grade decide which 800 V sockets are open."}
      - {id: b-efuse, text: "Do we have automotive eFuse or smart high-side switch parts, or a path to them?", why: "Smart distribution is a fast-growing socket where we may have no part."}
      - {id: b-comp, text: "Which competitors hold BMS and distribution sockets (ADI, TI, Infineon, NXP), and what decides?", why: "Shows how open these sockets are."}
      - {id: b-sense, text: "Can our isolated current-sense amplifiers meet battery shunt accuracy and temperature drift needs?", why: "Shunt sensing is a direct fit for the isolated amplifier line."}
  automotive/charging:
    reports: [auto-charging-power, iso-current-sense-charging, iso7821dww-isolation, hv-extra-wide-isolation]
    customer:
      - {id: c-what, text: "Which chargers do you build or buy: on-board chargers, AC wallboxes, DC fast chargers or wireless pads, and at which power levels?", why: "Each charger type has a different isolation, sensing and power chain."}
      - {id: c-bidir, text: "Is bidirectional charging (vehicle-to-grid, vehicle-to-home) in your plans, and in which markets first?", why: "Bidirectional chargers need more isolated drivers and grid-side metering."}
      - {id: c-volume, text: "Roughly what volume range do your charger lines run at (thousands, tens of thousands, more), and how long is a platform in production?", why: "Volume class and lifecycle tell us whether a socket is worth a design-in."}
      - {id: c-pain, text: "What causes the most field issues in your chargers: residual-current detection, metering accuracy, thermal stress or communication with the car?", why: "Pain points point to sensing or isolation parts to offer."}
    developers:
      - {id: d-800v, text: "Will your next chargers serve 800 V and 1000 V battery systems, and what isolation class (basic, reinforced) and creepage do you design for?", why: "800–1000 V batteries push isolators to 8 mm and wider packages."}
      - {id: d-gan-sic, text: "Which switches do you plan in the next generation (SiC, GaN, silicon), and at what switching frequency?", why: "Faster switches raise the CMTI needed on isolators and gate drivers."}
      - {id: d-sense, text: "How do you measure current today (shunt with isolated amplifier, Hall sensor, current transformer), and would a fully integrated isolated sensor help?", why: "Our case for an integrated isolated current sensor answers this directly."}
      - {id: d-comms, text: "Which charging communication do you implement (ISO 15118-20, plug and charge, PLC over the control pilot), and on which chip?", why: "PLC and secure communication add parts next to the power stage."}
      - {id: d-wish, text: "What part would make your next charger simpler: an isolated driver with built-in bias, an integrated shunt, a smaller isolated DC/DC?", why: "A direct line to features for our isolation roadmap."}
    bu:
      - {id: b-sold, text: "Which of our isolators, gate drivers and isolated amplifiers sell into chargers today, and into which charger types?", why: "Tells us the base to build on."}
      - {id: b-pd, text: "Is there a plan for a USB-C power delivery controller or buck-boost for in-car charging ports?", why: "In-car USB-C ports are a fast-growing socket close to our power line."}
      - {id: b-comp, text: "Which competitors do we meet in chargers (TI, ADI, Infineon, ST), and what wins: integration, creepage, price?", why: "Shows the angle to compete on."}
      - {id: b-qual, text: "Which of our charger-relevant parts are AEC-Q100 for on-board chargers, and which only industrial grade for wallboxes?", why: "On-board chargers need automotive grade; wallboxes do not."}
  automotive/cockpit:
    reports: [auto-wireless-audio, auto-wifi-antenna]
    customer:
      - {id: c-displays, text: "How many displays does your next cockpit carry, and are they driven from one cockpit computer?", why: "A cockpit domain controller concentrates clocks, links and power."}
      - {id: c-audio, text: "Which audio features are standard (wireless headphones, zones, AVAS), and which are options?", why: "Wireless audio and zones are our report's fit."}
      - {id: c-body, text: "Which body functions are moving into zonal controllers (lighting, doors, liftgate)?", why: "Zonal moves change where motor drivers and protection sit."}
      - {id: c-pain, text: "What is hardest in the cockpit today: EMC from displays, heat, wiring, or connectivity for passengers?", why: "Points to the part that helps most."}
    developers:
      - {id: d-links, text: "Which display and camera links will you use, at what data rate, and do you plan a shared clock?", why: "Display links need SerDes clocks; a shared clock is a timing socket."}
      - {id: d-wireless, text: "Will rear-seat entertainment and headphones move to Wi-Fi 6/7 or Bluetooth LE Audio, and how many links at once?", why: "More concurrent links mean more front ends and coexistence work."}
      - {id: d-48v-motors, text: "Do power doors, liftgates and seats move to 48 V motors with integrated controllers?", why: "48 V motor control is our report's opportunity."}
      - {id: d-led, text: "How do you plan to drive headlights and ambient lighting (matrix LED, pixel lighting), and which drivers?", why: "Lighting drivers are a large, growing power socket."}
    bu:
      - {id: b-wifi, text: "Which of our Wi-Fi and Bluetooth front ends are qualified for cockpit modules today?", why: "The cockpit is the easiest car socket for our connectivity parts."}
      - {id: b-motor, text: "Can our motor-control ICs meet AEC-Q100 for doors, seats and liftgates?", why: "Opens a body-electronics socket."}
      - {id: b-comp, text: "Which competitors do we meet in cockpit connectivity (Murata modules, Qualcomm, Infineon), and what decides?", why: "Modules often win cockpit sockets over discrete parts."}
      - {id: b-clock, text: "Do we sell clocks into cockpit domain controllers today?", why: "Timing is a likely foothold."}
  # ---- Data center --------------------------------------------------------------------------------------------------
  datacenter:
    reports: [hv-extra-wide-isolation]
    customer:
      - {id: c-ai-share, text: "What share of your new capacity is AI racks, and what rack power range do you build for now and in two to three years?", why: "Rack power (tens of kW now, hundreds of kW next) drives every power, cooling and timing socket."}
      - {id: c-ocp, text: "Do you follow Open Compute Project specifications (ORv3, Mt Diablo, Deschutes), or your own designs?", why: "OCP specs are public and tell us the sockets; own designs need direct contact."}
      - {id: c-sourcing, text: "Who chooses the power, timing and isolation parts: you, the ODM, or the power-shelf and server makers?", why: "Tells us whom to call for each socket."}
    developers:
      - {id: d-800v, text: "When do you expect 800 V DC (or ±400 V) distribution in your halls, and what changes first: the power shelf, the sidecar or the busway?", why: "800 V DC moves isolation, protection and conversion into the rack."}
      - {id: d-liquid, text: "How fast is liquid cooling replacing air in your halls, and what does that do to fans, pumps and sensing?", why: "Cooling electronics follow the move to liquid."}
      - {id: d-sync, text: "Do your AI fabrics need precise time (PTP, SyncE) across the cluster, and to what accuracy?", why: "Precise time across the cluster is a new timing socket."}
    bu:
      - {id: b-today, text: "What do we sell into data centers today, by function (timing, isolation, power, Wi-Fi), and through which kinds of customers?", why: "Our base in the segment."}
      - {id: b-roadmap, text: "Which of our roadmaps target AI data centers explicitly (224G clocks, 800 V isolation, eFuses)?", why: "Shows where the roadmap already points."}
      - {id: b-comp, text: "Which competitors do we meet most in data centers (TI, ADI, Infineon, Renesas, SiTime), and where do we win?", why: "Sets the priorities across sub-systems."}
  datacenter/rack-power:
    reports: [hv-extra-wide-isolation, auto-hv-hot-swap]
    customer:
      - {id: c-chain, text: "Walk us through your power chain from the grid to the processor: which conversion steps sit in the hall, in the rack and on the board?", why: "Shows which steps exist in your design and who builds each."}
      - {id: c-shelf, text: "Do you buy power shelves and power supplies as finished units, or specify them to a power-supply maker?", why: "Tells us whether the PSU maker or the operator chooses the isolators and drivers."}
      - {id: c-density, text: "What rack power range do you design for today and for the next generation (for example 30–50 kW, 100–150 kW, toward 1 MW)?", why: "Power level decides 54 V vs 800 V and the number of conversion stages."}
      - {id: c-pain, text: "What limits you most in rack power today: efficiency, space, hot-swap and inrush, transient loads from GPUs, or serviceability?", why: "Pain points point to protection, sensing or isolation parts."}
    developers:
      - {id: d-800v, text: "If you move to 800 V DC, which isolation class and creepage do you design for, and do you expect solid-state circuit breakers?", why: "800 V DC needs reinforced isolation and fast protection in the rack."}
      - {id: d-gan-sic, text: "Which switches do you plan in the PSU and the intermediate bus converter (GaN, SiC, silicon), and at what frequency?", why: "Faster switches raise CMTI needs on isolators and gate drivers."}
      - {id: d-ibc, text: "Will the 48–54 V to 12 V (or direct to core) intermediate bus converter stay, or move to a direct 800 V to 48 V step?", why: "A changed conversion chain moves or removes isolated sockets."}
      - {id: d-ai-load, text: "How do you handle the fast load steps of AI training on the power chain (energy storage in the shelf, capacitors, power smoothing)?", why: "Load transients drive new sensing and storage functions."}
      - {id: d-telemetry, text: "Which telemetry do you want from each power stage (current, voltage, temperature), and over which bus (PMBus, I3C)?", why: "Isolated sensing with digital output is a growing need."}
    bu:
      - {id: b-sold, text: "Which of our isolators, gate drivers and isolated amplifiers are in server PSUs and power shelves today?", why: "Our base in rack power."}
      - {id: b-wide, text: "Does the extra-wide SOIC isolation family cover 800 V DC creepage, and when is it qualified?", why: "800 V DC racks need wider creepage than today's 54 V shelves."}
      - {id: b-efuse, text: "Do we have, or plan, a 48–54 V eFuse or hot-swap controller for the rack?", why: "Every replaceable shelf and tray needs inrush and fault protection."}
      - {id: b-comp, text: "Which competitors win rack power sockets (TI, ADI, Infineon, Navitas, MPS), and on what: integration with GaN, price, reference designs?", why: "Shows the angle to compete on."}
  datacenter/backup:
    customer:
      - {id: c-where, text: "Where does your backup sit today: a central UPS, battery backup units in the rack, or both?", why: "In-rack BBUs bring battery monitoring and isolated sensing into every rack."}
      - {id: c-runtime, text: "What hold-up or runtime do you need (seconds for ride-through, minutes for shutdown, hours for storage)?", why: "Runtime sets battery size and the power conversion around it."}
      - {id: c-chem, text: "Which battery chemistry do you use (lithium iron phosphate, NMC, sodium-ion), and how do you handle fire safety?", why: "Chemistry decides the monitoring and protection needs."}
      - {id: c-grid, text: "Do you use on-site storage to support the grid or smooth AI load swings?", why: "Grid support turns the backup into a bidirectional converter."}
    developers:
      - {id: d-bbu, text: "What power and voltage will the next BBU run at (54 V, 800 V), and is it hot-swappable?", why: "BBU voltage and hot-swap set the isolation and protection parts."}
      - {id: d-bms, text: "Which BMS architecture do you use in the BBU, and which isolation between the cells and the controller?", why: "Isolated cell monitoring is a direct fit."}
      - {id: d-smoothing, text: "Will storage in the rack also absorb AI load steps, and how fast must it react?", why: "Fast response needs fast current sensing and control."}
      - {id: d-wish, text: "What would you change in your BBU design if you could: size, monitoring, fault detection, communication?", why: "A direct line to features."}
    bu:
      - {id: b-sold, text: "Do we sell isolators or isolated amplifiers into UPS and BBU makers today?", why: "Our base in backup."}
      - {id: b-bms, text: "Is there a BMS front end or isolated cell-monitor link we could offer, or only the isolation around it?", why: "Decides whether we sell the core or the periphery."}
      - {id: b-comp, text: "Which competitors hold BBU sockets (TI, ADI, Infineon, ST)?", why: "Shows how open the socket is."}
      - {id: b-reuse, text: "Can parts qualified for automotive BMS be offered to BBU makers with no extra work?", why: "Finds a quick reuse."}
  datacenter/servers:
    customer:
      - {id: c-platform, text: "Which server platforms do you build (general compute, AI training, AI inference), and how often does a new generation start?", why: "Platform cadence sets the design-in window."}
      - {id: c-odm, text: "Who designs the boards: you, an ODM, or the processor vendor's reference design?", why: "Most board sockets follow the reference design."}
      - {id: c-bmc, text: "What does your board management controller watch and control, and what would you like it to see that it cannot?", why: "Management needs drive telemetry and sensing parts."}
      - {id: c-pain, text: "What is hardest on the board today: power density, heat, signal integrity at PCIe Gen 6 or reliability?", why: "Points to the part that helps."}
    developers:
      - {id: d-vr, text: "How much current will the next processor or accelerator draw, and will power move to vertical delivery under the chip?", why: "Vertical power delivery changes the regulator and sensing sockets."}
      - {id: d-pcie7, text: "When do you move to PCIe Gen 7 and CXL, and what does that change for clocks and retimers?", why: "Gen 7 tightens clock jitter and adds retimers."}
      - {id: d-48v, text: "Will 48 V reach the board directly, and which converters will you use to the core?", why: "48 V on the board changes protection and conversion."}
      - {id: d-security, text: "Which hardware security and monitoring (root of trust, tamper detection) will be required on the board?", why: "New board functions mean new sockets."}
    bu:
      - {id: b-clock, text: "Which of our PCIe clocks and buffers are in server reference designs, and for which processor vendors?", why: "Reference designs decide clock sockets."}
      - {id: b-gen7, text: "Are our clocks and buffers specified for PCIe Gen 7 jitter limits?", why: "Gen 7 readiness keeps the socket."}
      - {id: b-comp, text: "Which competitors hold server clock and power sockets (Renesas, TI, SiTime, MPS, Infineon)?", why: "Shows where we stand."}
      - {id: b-isol, text: "Is there any isolation need on the server board (48 V input, sensors) that our parts meet?", why: "Finds a second socket next to timing."}
  datacenter/network:
    customer:
      - {id: c-ap, text: "Which Wi-Fi standard and roughly what access-point density do you deploy in offices and campuses?", why: "Enterprise AP volumes and standard choose the front end."}
      - {id: c-poe, text: "Which PoE power class do your access points and devices need, and is it rising?", why: "Higher PoE classes change the powered-device design."}
      - {id: c-refresh, text: "How often do you refresh access points and switches, and what triggers a refresh?", why: "Refresh cycle drives volume timing."}
      - {id: c-pain, text: "What causes the most trouble in your wireless network: coverage, interference, power budget or management?", why: "Points to front-end or power features."}
    developers:
      - {id: d-wifi7, text: "When do you move to Wi-Fi 7 with 320 MHz channels and multi-link operation, and to Wi-Fi 8 after that?", why: "Each step needs new front ends and filters."}
      - {id: d-6ghz, text: "How will you use 6 GHz: indoor only, standard power with AFC, or outdoor?", why: "Standard power with AFC needs higher output and linearity."}
      - {id: d-coex, text: "How many radios share one access point (2.4, 5, 6 GHz, BLE, IoT), and what filtering do you need between them?", why: "Tri-band APs depend on sharp 5/6 GHz filters."}
      - {id: d-poe, text: "Will access points need more than 60 W PoE, and how do you design the powered-device side?", why: "PoE powered-device design is a power and isolation socket."}
    bu:
      - {id: b-fem, text: "Which of our Wi-Fi front ends and filters are in enterprise access points today?", why: "Our base."}
      - {id: b-wifi8, text: "Is our Wi-Fi 7 and Wi-Fi 8 front-end roadmap aligned with the enterprise chipset vendors' timing?", why: "Front ends follow the chipset reference designs."}
      - {id: b-comp, text: "Which competitors do we meet in enterprise Wi-Fi (Qualcomm RFFE, Broadcom integrated, Murata)?", why: "Shows how open the sockets are."}
      - {id: b-filter, text: "Do our 5/6 GHz coexistence filters win in tri-band APs, and what decides?", why: "Filters are often where we differentiate."}
  datacenter/timing:
    customer:
      - {id: c-sockets, text: "Which equipment do you design that needs reference clocks (servers, switches, NICs, optical modules, time cards)?", why: "Each type has its own clock socket and jitter limit."}
      - {id: c-time, text: "Do you run PTP or SyncE in your back-end AI fabric, and why (telemetry, congestion control, scheduling)?", why: "The reason for precise time decides the accuracy needed."}
      - {id: c-sourcing, text: "Do you select clocks yourself or follow the switch and NIC vendors' reference designs?", why: "Tells us whom to approach."}
      - {id: c-pain, text: "What causes clock trouble today: jitter margin at 112G/224G, supply, board space or field failures?", why: "Points to the product to offer."}
    developers:
      - {id: d-224g, text: "What reference-clock jitter will your 224G and 448G SerDes need, and with which filter mask?", why: "Limits below 35 fs set the next oscillator spec."}
      - {id: d-pcie7, text: "When do you need PCIe Gen 7 clocks and buffers, and how many outputs per board?", why: "Gen 7 tightens jitter and adds outputs."}
      - {id: d-cpo, text: "Does co-packaged optics change your clocking (one reference for the switch package instead of one per module)?", why: "Could remove or reshape the optical-module clock socket."}
      - {id: d-holdover, text: "What holdover and accuracy do you need when GNSS is lost in a time card or grandmaster?", why: "Sets oscillator class (TCXO, OCXO) and synchronizer features."}
    bu:
      - {id: b-ref, text: "In which switch, NIC and optical-module reference designs are our clocks recommended today?", why: "Reference designs decide most of these sockets."}
      - {id: b-roadmap, text: "Is our oscillator roadmap ahead of the 224G/448G jitter limits, and when?", why: "Being first on the next limit wins the socket."}
      - {id: b-comp, text: "Which competitors do we meet in data-center timing (Renesas, SiTime, TI, Microchip), and what decides?", why: "Shows where we lead or lag."}
      - {id: b-ptp, text: "Do we offer PTP / SyncE synchronizers for AI back-end fabrics, and is any customer asking?", why: "A new socket in AI clusters."}
  datacenter/cooling:
    customer:
      - {id: c-mix, text: "What is your mix of air and liquid cooling today, and what will it be for new AI halls?", why: "The mix decides which drives and sensors grow."}
      - {id: c-cdu, text: "Do you buy CDUs, chillers and fan walls as finished units, and from how many suppliers?", why: "Tells us whether to target equipment makers or operators."}
      - {id: c-reliability, text: "What redundancy and service model do you need for pumps and fans (hot-swap, N+1)?", why: "Hot-swap drives protection and monitoring parts."}
      - {id: c-pain, text: "What causes the most trouble in cooling: leaks, pump failures, control, energy use?", why: "Points to sensing or drive features."}
    developers:
      - {id: d-pumps, text: "What power and voltage do your pump and fan drives run at, and are they moving to EC motors or VFDs?", why: "Drive power sets the gate drivers and isolation."}
      - {id: d-sensing, text: "Which leak, flow, pressure and temperature sensing do you plan, and how is it isolated and networked?", why: "Sensing networks are a socket for isolators and interfaces."}
      - {id: d-warm, text: "Will you move to warmer coolant and heat reuse, and what does that change in the electronics?", why: "Shifts load from compressors to pumps and fans."}
      - {id: d-immersion, text: "Are you considering immersion or two-phase cooling, and which electronics remain?", why: "Immersion removes fans but keeps pumps and sensing."}
    bu:
      - {id: b-motor, text: "Are our motor-control ICs used in EC fans or pump drives today, and at what power?", why: "A direct fit for the motor-control line."}
      - {id: b-isol, text: "Which of our isolated gate drivers fit 1–40 kW pump and compressor drives?", why: "CDU and chiller drives need isolated drivers."}
      - {id: b-comp, text: "Which competitors hold cooling drive sockets (Infineon, TI, ST, onsemi)?", why: "Shows how open the socket is."}
      - {id: b-efuse, text: "Would a hot-swap or eFuse part help us in replaceable fans and pumps?", why: "A gap noted in the cooling deep dive."}
  # ---- Drones -------------------------------------------------------------------------------------------------------
  drones:
    customer:
      - {id: c-mission, text: "Which missions do your drones fly (camera, mapping, spraying, delivery, inspection, public safety, defence), and which is growing fastest?", why: "Mission decides payload, range, links and the regulations that apply."}
      - {id: c-rules, text: "Which rules shape your design most (Remote ID, BVLOS approvals, EU drone classes, origin rules for components)?", why: "Regulation and origin rules change which suppliers a drone maker can use."}
      - {id: c-build, text: "Do you design the flight controller, ESCs and radios yourself, or buy modules and reference designs?", why: "Tells us whether to sell chips or work through module makers."}
    developers:
      - {id: d-autonomy, text: "How much autonomy will your next drone have (waypoints, detect-and-avoid, swarms), and what does that need from navigation and links?", why: "Autonomy raises demands on GNSS, sensing and resilient links."}
      - {id: d-resilience, text: "How do you design for GNSS jamming and spoofing and for lost control links?", why: "Resilience is the fastest-moving requirement in drones."}
      - {id: d-bvlos, text: "Which link will carry beyond-line-of-sight flights: cellular, satellite or a long-range private radio?", why: "Decides between cellular, NTN and sub-GHz front ends."}
    bu:
      - {id: b-today, text: "Which of our parts sell into drones today (GNSS LNAs, Wi-Fi front ends, motor control), and through which channels?", why: "Our base in drones."}
      - {id: b-defence, text: "Which drone customers fall under defence or export rules, and how do we handle them?", why: "Defence drones need a different sales and compliance path."}
      - {id: b-comp, text: "Which competitors do we meet in drones, and do module makers decide most sockets?", why: "Shows where to focus."}
  drones/flight:
    customer:
      - {id: c-size, text: "Which drone classes do you build by weight and pack voltage (for example under 250 g, 2–6S, 12–14S, higher)?", why: "Pack voltage sets the ESC and power parts."}
      - {id: c-esc, text: "Do you design your own ESCs or buy them, and how many motors per drone?", why: "ESC count multiplies motor-control sockets."}
      - {id: c-endurance, text: "What limits flight time and reliability most: battery, motor efficiency, heat or failures in the ESC?", why: "Points to efficiency or protection features."}
      - {id: c-volume, text: "Roughly what volume range does each drone line reach per year, and how long does a design stay in production?", why: "Volume and lifecycle tell us whether a design-in pays off."}
    developers:
      - {id: d-foc, text: "Are your ESCs moving to sinusoidal sensorless FOC and higher PWM (45–60 kHz and above)?", why: "Higher PWM needs stronger MCUs and better gate drive."}
      - {id: d-gan, text: "Would you use GaN FETs in the ESC, and at which voltage class?", why: "GaN in 48 V drives is a trend that changes the gate driver."}
      - {id: d-pack, text: "Will heavy-lift drones move to higher pack voltages (18S and up) and smart batteries with cell monitoring?", why: "Higher voltage needs new protection and BMS parts."}
      - {id: d-antispark, text: "How do you handle inrush and anti-spark when the battery is connected, and would an eFuse or ideal-diode part help?", why: "A gap noted in the drone power deep dive."}
      - {id: d-remoteid, text: "Is Remote ID built into the flight controller, and does it act as a take-off interlock?", why: "Remote ID makes a radio flight-critical."}
    bu:
      - {id: b-pac, text: "Do our PAC55xx motor-control ICs meet drone ESC needs at 45–60 kHz PWM with six external FETs?", why: "A direct fit if the specs hold."}
      - {id: b-design, text: "Is there a drone ESC reference design with our parts, or a partner who would build one?", why: "Drone makers design from reference designs."}
      - {id: b-comp, text: "Which competitors hold drone ESC sockets (TI, ST, Infineon, Chinese MCU vendors)?", why: "Shows the price level to meet."}
      - {id: b-efuse, text: "Is an eFuse or anti-spark controller for 12S+ packs worth adding?", why: "A gap in our portfolio."}
  drones/radio-links:
    customer:
      - {id: c-links, text: "Which radios does your drone carry (control link, video, GNSS, Remote ID, ADS-B In), and on which bands?", why: "Four to five radios per drone means several front ends."}
      - {id: c-range, text: "What range and latency do you need for control and video, and in which regions?", why: "Range sets output power and LNA needs; regions set bands."}
      - {id: c-modules, text: "Do you buy radio modules or design the radios on your own board?", why: "Tells us whether to sell to module makers."}
      - {id: c-pain, text: "What fails most in the field: video drop-outs, control-link loss, GNSS loss near the video transmitter?", why: "Self-interference is a common pain that filters fix."}
    developers:
      - {id: d-digital-video, text: "Are you moving from analog to digital HD video, and at which bands and output power?", why: "Digital video at 5.8 GHz drives PA and filter needs."}
      - {id: d-isolation, text: "What isolation do you reach between the 5.8 GHz video antenna and the GNSS patch, and is it enough?", why: "A GNSS LNA with rejection at 5.8 GHz could solve it."}
      - {id: d-control, text: "Will your long-range control link use LoRa-type chirp, narrow-band hopping, or a cellular backup?", why: "Sets the sub-GHz front-end need."}
      - {id: d-wish, text: "Which part would make your radio design simpler: a combined front end, a better GNSS LNA, a higher-power sub-GHz PA?", why: "A direct line to a product idea."}
    bu:
      - {id: b-fem, text: "Which of our Wi-Fi and sub-GHz front ends are in drone links today?", why: "Our base."}
      - {id: b-gnss, text: "What rejection does our GNSS LNA have at 5725–5850 MHz, and is a drone-specific variant worth defining?", why: "An open question from the drone deep dives."}
      - {id: b-comp, text: "Which competitors do we meet in drone radios (Murata, Maxscend, other Chinese vendors)?", why: "Shows the price and integration bar."}
      - {id: b-channel, text: "Do we reach drone makers through distributors or directly?", why: "Many drone makers are small; the channel matters."}
  drones/cellular-link:
    customer:
      - {id: c-use, text: "Which flights use 4G/5G today (delivery, inspection, public safety), and in which countries?", why: "Cellular BVLOS adoption differs by country."}
      - {id: c-plan, text: "Do you use operator drone subscriptions, and what do operators require from the device?", why: "Operator rules may limit power or require certified modules."}
      - {id: c-module, text: "Which cellular module class do you use (LTE Cat 4, Cat 1, 5G RedCap), and who supplies it?", why: "Module makers choose the front end."}
      - {id: c-pain, text: "What causes trouble on the cellular link at height: interference to many cells, handovers, uplink rate?", why: "Points to front-end or antenna improvements."}
    developers:
      - {id: d-redcap, text: "Will you move to 5G RedCap, and do you need more uplink rate for video?", why: "RedCap reduces the front end; video needs uplink."}
      - {id: d-ntn, text: "Do you want a satellite (NTN) fallback in the same modem?", why: "NTN fallback adds L/S-band front-end needs."}
      - {id: d-esim, text: "Do you plan eSIM or integrated SIM, and do you need a secure element?", why: "Open question from the drone cellular deep dive."}
      - {id: d-power, text: "What output power and power control do you expect for aerial devices?", why: "Height-dependent power control changes PA needs."}
    bu:
      - {id: b-modules, text: "Which of our cellular front ends are in IoT modules that drone makers use?", why: "Our base."}
      - {id: b-redcap, text: "Is our RedCap front-end offer ready for module makers?", why: "Sets timing for the next drone modems."}
      - {id: b-comp, text: "Which competitors hold IoT module front-end sockets (Qualcomm, Murata, Chinese vendors)?", why: "Shows how open the sockets are."}
      - {id: b-ntn, text: "Can our NTN front-end work serve drones as well as cars and trackers?", why: "A shared product across segments."}
  drones/satellite-link:
    customer:
      - {id: c-where, text: "Where do your drones fly without cell coverage (sea, mountains, borders), and what must reach them there?", why: "Use case decides data rate and the satellite system."}
      - {id: c-system, text: "Which satellite system do you use or consider (3GPP NTN, direct-to-cell, Iridium or other L-band services)?", why: "Each needs a different front end."}
      - {id: c-size, text: "What size, weight and power can a satellite link take on your drone?", why: "Sets antenna and PA constraints."}
      - {id: c-pain, text: "What stops you from adding satellite today: cost, antenna size, service plans, certification?", why: "Shows the main barrier."}
    developers:
      - {id: d-power, text: "Which power class do you need on NTN bands (23, 26 or 31 dBm), and on which bands?", why: "Higher classes need a stronger PA."}
      - {id: d-gnss-coex, text: "How will you protect GNSS from the NTN transmitter next to it (1559–1610 MHz vs uplink near 1626 MHz)?", why: "A coexistence filter and LNA need."}
      - {id: d-rel19, text: "Do you plan RedCap over NTN or store-and-forward from Release 19?", why: "Shows the next modem and front-end step."}
      - {id: d-antenna, text: "Would you use a patch, a helix or a small phased array for the satellite link?", why: "Antenna choice changes front-end needs."}
    bu:
      - {id: b-pa, text: "Does our L/S-band PA support NTN power class 2 (26 dBm), and how much noise does it put into the GNSS band?", why: "An open question from the deep dive."}
      - {id: b-reuse, text: "Can our automotive NTN front-end work be reused for drones?", why: "Cross-segment reuse."}
      - {id: b-comp, text: "Which competitors offer NTN front ends today?", why: "Few suppliers so far."}
      - {id: b-partners, text: "Which NTN modem makers would partner with us on a reference design?", why: "Reference designs decide sockets."}
  drones/navigation:
    customer:
      - {id: c-accuracy, text: "What position accuracy do your missions need (metres, decimetres, centimetres), and where?", why: "Accuracy decides single-band, multi-band or RTK."}
      - {id: c-corrections, text: "Which correction service do you use (RTK base, network RTK, PPP-RTK over satellite)?", why: "Corrections drive the receiver and band choice."}
      - {id: c-module, text: "Do you buy GNSS modules or active antennas, or design the front end yourself?", why: "Tells us whether the LNA socket is ours to win."}
      - {id: c-pain, text: "When do you lose position today: near structures, under jamming, near your own transmitters?", why: "Points to rejection or redundancy features."}
    developers:
      - {id: d-bands, text: "Are you moving to L1 + L5 (and L2/E6) through one RF input?", why: "All-band front ends need new LNAs and filters."}
      - {id: d-fusion, text: "Which sensors do you fuse with GNSS (IMU, visual odometry, UWB for docking)?", why: "Sensor fusion sets UWB and IMU sockets."}
      - {id: d-tcxo, text: "Which reference oscillator do your GNSS and NTN receivers use?", why: "A TCXO gap noted in the deep dive."}
      - {id: d-wish, text: "What would you want from a GNSS front end: higher compression point, rejection at 5.8 GHz, lower noise?", why: "A direct line to a product spec."}
    bu:
      - {id: b-lna, text: "Which of our GNSS LNAs and front-end modules sell into drones, and do they cover L5?", why: "Our base."}
      - {id: b-tcxo, text: "Should we offer a TCXO for GNSS and NTN modems?", why: "None is in our catalogue."}
      - {id: b-comp, text: "Which competitors hold drone GNSS front-end sockets (Infineon, Maxscend, module makers' own)?", why: "Shows how open the sockets are."}
      - {id: b-uwb, text: "Could our UWB chips serve drone docking and indoor flight?", why: "A cross-segment fit."}
  drones/anti-jamming:
    customer:
      - {id: c-threat, text: "How often do your drones meet GNSS interference or spoofing, and where?", why: "Frequency of the problem sets the budget for a fix."}
      - {id: c-level, text: "Which protection do customers ask for: detection only, multi-band, CRPA arrays, inertial fallback?", why: "Decides the product level."}
      - {id: c-export, text: "Which export or defence rules apply to the protection you can fit?", why: "CRPA and military GNSS are export-controlled."}
      - {id: c-buy, text: "Do you buy anti-jam modules or build the protection yourself?", why: "Module or chip sale."}
    developers:
      - {id: d-crpa, text: "Would a 2–4 element CRPA fit your drone, and what size and power can it take?", why: "Small CRPAs need multichannel front ends."}
      - {id: d-linearity, text: "What out-of-band signal level must your GNSS front end survive without losing the fix?", why: "Sets LNA compression and filter rejection."}
      - {id: d-osnma, text: "Will you use Galileo OSNMA or other authentication against spoofing?", why: "Authentication changes receiver choice."}
      - {id: d-link, text: "How will the control link resist jamming (frequency hopping, mesh, cellular fallback)?", why: "Shows front-end needs on the control link."}
    bu:
      - {id: b-test, text: "Do we have test data showing how much a high-IIP3 LNA plus pre-filter helps under a strong out-of-band signal?", why: "Evidence a drone maker would ask for."}
      - {id: b-multi, text: "Could we offer a multichannel GNSS front end for small CRPA arrays?", why: "A new product idea from the deep dive."}
      - {id: b-defence, text: "Which defence rules would apply to such a product, and do we want that market?", why: "A business decision before a product."}
      - {id: b-comp, text: "Which competitors sell anti-jam GNSS front ends or modules?", why: "Shows how open the market is."}
  # ---- Cellular -----------------------------------------------------------------------------------------------------
  cellular:
    customer:
      - {id: c-cycle, text: "Where are you in the 5G cycle: still rolling out, upgrading to 5G-Advanced, or planning 6G trials?", why: "The cycle sets which radios and bands are bought next."}
      - {id: c-bands, text: "Which new bands matter most to you in the next three years (FR3 7–24 GHz, n77/n79 upgrades, satellite bands)?", why: "New bands mean new front ends and filters."}
      - {id: c-sourcing, text: "How do you choose RF suppliers: modem vendor reference designs, own modules, or an open choice?", why: "Tells us where the decision sits."}
    developers:
      - {id: d-6g, text: "Which 6G features do you expect to need first (FR3, AI-native air interface, sensing, NTN)?", why: "Early 6G needs set long-term RF roadmaps."}
      - {id: d-power, text: "How important is energy efficiency in the radio now, and which part of the chain wastes most?", why: "PA efficiency is where we can help most."}
      - {id: d-integration, text: "Do you want more integration (front-end modules, PA plus filter) or discrete parts you can tune?", why: "Sets the product format."}
    bu:
      - {id: b-today, text: "What share of our cellular business is phones, infrastructure and IoT, and where is it growing?", why: "Our base by sub-segment."}
      - {id: b-fr3, text: "What is our FR3 (7–24 GHz) front-end plan?", why: "FR3 is the next band battle."}
      - {id: b-comp, text: "Which competitors do we meet most (Qualcomm RFFE, Murata, Broadcom, Chinese vendors), and where are we losing?", why: "Sets the priorities."}
  cellular/radio-unit:
    customer:
