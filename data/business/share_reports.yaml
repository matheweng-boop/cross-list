# Shareable reports for management (owner, 25 Oct 2026: "2 different reports that are more applicable to a management
# level"): Skyworks + Qorvo synergies (/shareable/synergies) and its extension, Automotive: technologies and
# applications (/shareable/automotive). Each is about 3 A4 pages, public and positive.
#
# Only the plain-language words live here; every count comes from the site's data when the page is built
# (app/services/share_reports.py) and is shown rounded ("4,500+"). The owner edits the pages on the site (Edit, owner
# only); edits are stored in the database over these defaults, the same way as the Technology overview.
#
# Rules: public facts only (10-K filings, public catalogues); no comparisons with other companies, plans, prices or
# market sizes. Manufacturing is described at capability level only: which processes each company runs in-house,
# assembly and test, module integration, silicon from foundry partners. Never a site, a city, a named partner, or
# which product is made where (tests/test_share_reports.py checks the rendered pages against the word list).
updated: 2026-10-25

synergies:
  title: "Skyworks + Qorvo synergies"
  header: {title: "Skyworks + Qorvo · Synergies", subtitle: ""}
  sections:
    glance:
      heading: "Combined at a glance"
      # optional: the short text of this section's PowerPoint slide (the owner edits it on the site, next to the
      # paragraphs); without it the slide shows the first sentence of the paragraphs
      slide: "Two complementary portfolios; the key combined strength is front-end module (FEM) integration."
      paragraphs:
        - id: syn-glance-1
          text: >-
            Skyworks and Qorvo, combined since October 2026, join two complementary portfolios. The key combined
            strength is front-end module (FEM) integration: amplifiers, acoustic filters and switches from both in one
            module. Qorvo adds GaN and microwave; Skyworks adds isolation, timing and radio.
    manufacturing:
      heading: "Manufacturing capabilities"
      paragraphs:
        - id: syn-mfg-1
          text: >-
            Both make their key RF technologies in-house and integrate them in front-end modules; silicon comes from
            foundry partners. Capability level, from the public annual reports (Form 10-K).
    technologies:
      heading: "Key technologies per company"
      paragraphs:
        - id: syn-tech-1
          text: "Who brings which technology platform."
    overlap:
      heading: "Product overlap"
      paragraphs:
        - id: syn-overlap-1
          text: >-
            Product families in the public catalogues, by who offers them, and what each group is useful for.
    combine:
      heading: "Where the two combine"
      paragraphs:
        - id: syn-combine-1
          text: >-
            Skyworks and Qorvo products used together in reference designs, and what each pair is useful for. Cost
            savings are assumed, not measured.
  facts:
    parts: {label: "active parts"}
    families: {label: "product families"}
    shared: {label: "families both offer"}
    platforms: {label: "technology platforms"}
  # capability rows: who runs it (In-house / Foundry partners / In-house and partners / "–" for not offered)
  manufacturing:
    - {label: "GaAs HBT (power amplifiers)", skyworks: "In-house", qorvo: "In-house"}
    - {label: "GaAs pHEMT (switches, low-noise amplifiers)", skyworks: "In-house", qorvo: "In-house"}
    - {label: "BAW filters", skyworks: "In-house", qorvo: "In-house"}
    - {label: "SAW and TC-SAW filters", skyworks: "In-house", qorvo: "In-house"}
    - {label: "GaN on SiC (high power)", skyworks: "–", qorvo: "In-house"}
    - {label: "Silicon: RF SOI, SiGe, CMOS mixed-signal", skyworks: "Foundry partners", qorvo: "Foundry partners"}
    - {label: "Module and system-in-package integration", skyworks: "In-house", qorvo: "In-house"}
    - {label: "Assembly and test", skyworks: "In-house and partners", qorvo: "In-house and partners"}
  # one plain line per pair ("<Skyworks function> + <Qorvo function>"): what the pair is useful for. Pairs without a
  # line use the automotive reasons in synergies_auto.yaml, else a generic line
  pairs:
    "rf_synthesizer + rf_mixer": "Synthesizer and mixer from one company: a matched radio chain and a step toward one integrated part."
    "rf_synthesizer + rf_gain_block": "A complete local-oscillator chain from one company: synthesizer plus gain block."
    "diversity_rx_module + pa_module": "FEM integration: receive and transmit for one cellular front end from one company."
    "diversity_rx_module + filter_saw_baw": "Qorvo acoustic filters inside Skyworks receive modules: fewer bought-in filters."
    "antenna_switch + lna": "Switch and LNA can merge into one front-end module (FEM integration)."
    "antenna_switch + filter_saw_baw": "Switches and acoustic filters of both companies in one front-end module."
    "schottky_diode + filter_saw_baw": "Detector diodes and filters for the same receive and sensing chains."
    "pin_diode + rf_switch": "Diodes and switches both route RF signals: shared switching know-how."
    "pin_diode + rf_limiter": "Diodes and limiters both protect receivers: shared protection know-how."
    "poe_pd + wide_vin_buck": "A complete Power over Ethernet power path from one supplier."
    "poe_pse + wide_vin_buck": "Power over Ethernet sourcing plus its converter from one supplier."
    "poe_pse + wifi_fem": "Power over Ethernet and the Wi-Fi front end: one supplier for access points."
    "am_fm_tuner + lna": "Active antenna to tuner: the whole car-radio front end from one supplier."
    "am_fm_tuner + pmic": "Radio tuner and its power from one supplier."
    "single_chip_radio + pmic": "Radio chip and its power from one supplier."
    "antenna_switch + pa_module": "Switch and PA module of one cellular front end: a step toward one FEM."
    "gnss_lna + filter_saw_baw": "GNSS LNA and acoustic filter can merge into one GNSS front-end module."
    "load_switch + wide_vin_buck": "Off-battery power from one supplier: converter plus load switches."
  # owner, 25 Oct 2026 ("how are these synergies useful?"): one benefit type per synergy, from this fixed set. Cost
  # savings are always marked "assumed" (no public source measures them).
  benefit_types:
    manufacturing: "Better manufacturing"
    shared_tech: "Shared technology"
    new_tech: "New technology"
    cost: "Cost savings (assumed)"
    market: "Market access"
  benefit_default: shared_tech  # a pair not listed below
  benefits:
    "rf_synthesizer + rf_mixer": new_tech
    "rf_synthesizer + rf_gain_block": new_tech
    "diversity_rx_module + pa_module": new_tech
    "diversity_rx_module + filter_saw_baw": cost
    "antenna_switch + lna": new_tech
    "antenna_switch + filter_saw_baw": manufacturing
    "antenna_switch + pa_module": new_tech
    "gnss_lna + filter_saw_baw": new_tech
    "schottky_diode + filter_saw_baw": shared_tech
    "pin_diode + rf_switch": shared_tech
    "pin_diode + rf_limiter": shared_tech
    "poe_pd + wide_vin_buck": market
    "poe_pse + wide_vin_buck": market
    "poe_pse + wifi_fem": market
    "am_fm_tuner + lna": market
    "am_fm_tuner + pmic": market
    "single_chip_radio + pmic": market
    "load_switch + wide_vin_buck": market
  # the overlap view: one benefit type and one line per column
  overlap_benefits:
    Skyworks: {type: market, line: "Adds families Qorvo did not offer."}
    Both: {type: cost, line: "A second source within one company; scale on shared lines."}
    Qorvo: {type: market, line: "Adds families Skyworks did not offer."}
  sources:
    - "Parts and families: the public Skyworks and Qorvo product catalogues, active parts only; counts rounded down."
    - "Manufacturing and technology platforms: Skyworks and Qorvo Form 10-K filings (FY2025)."
    - "Pairs: public reference designs and application diagrams."

automotive:
  title: "Automotive: technologies and applications"
  header: {title: "Skyworks + Qorvo · Automotive", subtitle: ""}
  sections:
    offer:
      heading: "The combined automotive offer"
      paragraphs:
        - id: auto-offer-1
          text: >-
            In the car we connect, sense and power: UWB digital keys, radio, telematics and V2X front-end modules,
            clocks, and isolated gate drivers and sensing for the electric powertrain and charging.
    technologies:
      heading: "Key technologies in the car"
      paragraphs:
        - id: auto-tech-1
          text: "Our technology platforms and what each does in the car."
    applications:
      heading: "Applications by sub-system"
      paragraphs:
        - id: auto-apps-1
          text: "Where the parts go in the car. Series listed are AEC-Q qualified."
    pairs:
      heading: "Skyworks + Qorvo in the car"
      paragraphs:
        - id: auto-pairs-1
          text: >-
            Pairs used together in automotive reference designs, and what each is useful for. Examples are AEC-Q
            qualified.
  facts:
    platforms: {label: "technology platforms in the car"}
    subsystems: {label: "sub-systems in the car"}
    families: {label: "product families with automotive parts"}
  # platform keys of data/business/tech_overview.yaml with what each does in the car
  technologies:
    isolation: "Isolated gate drivers, isolators and isolated sensing for inverters, battery and chargers."
    broadcast: "AM/FM, DAB and HD Radio tuners for the head unit."
    wireless: "UWB ranging for digital keys and in-cabin presence."
    gaas_hbt: "Power amplifiers in cellular, V2X and Wi-Fi front ends."
    soi: "RF switches and antenna routing in telematics units."
    modules: "Complete front-end modules for cellular, V2X and GNSS."
    timing: "PCIe clocks and buffers for domain controllers."
  # sub-systems of data/blocks/systems.yaml (automotive): one line and 2-3 candidate series (trailing x's stand for
  # any characters); only series with AEC-Q-qualified active parts are shown
  subsystems:
    car-access: {line: "UWB ranging for digital keys, hands-free entry and in-cabin presence.", series: [DW3300Q, QPF5100Q]}
    car-radio: {line: "AM/FM, DAB and HD Radio tuners and digital radio coprocessors.", series: [Si479xx, Si469xx]}
    telematics-v2x: {line: "Automotive cellular, V2X and GNSS front-end modules.", series: [SKY5Axxxx, QPF4554Q, QPF1003Q]}
    adas: {line: "Automotive PCIe clock generators and buffers for domain controllers.", series: [Si5332x, Si522xx]}
    powertrain: {line: "Isolated gate drivers and isolated sensing for traction inverters.", series: [Si823x, Si82Fx, Si89xx]}
    battery-power: {line: "Digital isolators for battery management; wide-input converters off the battery.", series: [Si86xx, ACT4751xx]}
    charging: {line: "Isolated gate drivers and isolators with power for on-board and DC chargers.", series: [Si82Ex, Si88xx]}
    cockpit: {line: "Wi-Fi diplexers and RF switches for the head unit and connected cockpit.", series: [TQM2M9xxx, QPC80xx]}
  standards: [AEC-Q100, AEC-Q200, ISO 26262, IEC 60747-17, IEEE 802.15.4z, CCC Digital Key, 3GPP C-V2X, PCI Express]
  sources:
    - "AEC-Q qualification: as marked in the public Skyworks and Qorvo catalogues."
    - "Sub-systems and pairs: public reference designs and application diagrams."
    - "Standards: named for orientation only."
