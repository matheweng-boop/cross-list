# Shareable system documents (owner, 27 Oct 2026): "For the shareables, create a portion for UWB and for V2X and GNSS
# and for Automotive Radio (AM/FM/DAB) with Block Diagrams and listing some parts from both Skyworks and Qorvo that's
# 4 different Docs." Built by app/services/share_systems.py; listed on Shareable through share_reports.REGISTRY.
#
# Rules (owner): only content already on the site, no new research. The words below come from the site's research
# reports and cases (data/business/reports.yaml: learn, say_externally; data/library/topics/*.yaml: summary, trends);
# talking points are the reports' say_externally lines. No reference to the site, no prices, estimates or plans,
# nothing on where parts are made (the word check and site_guard run on every save and download).
#
# diagram: the library diagram it is drawn from (from: "template:<name in data/blocks/templates.yaml>" or
#   "topic:<data/library/topics key>"), a title, the groups to leave out (drop), new places (place: gid: [col, row]),
#   shorter group labels (labels), shorter block labels by function (short) and the links to keep (links: [a, b]).
# parts: core (the parts that define the system; every one must be AEC-Q qualified in the catalogue data) and
#   peripherals (around the core: switches, LNAs, filters, clocks, power; automotive or not, as bundle options).
#   at: "<group id>.<function>" - the diagram block the part sits in (core: solid highlight; peripheral: outline).
#   spec: one or two key specs as the public catalogue / data sheet states them; grade: as the data states it
#   (empty: "Automotive (AEC-Q)" or "Not automotive" from app/services/autograde.py).
# Every part must be active in the catalogue (not NRND, last time buy or obsolete); others are left out.
#
# Depth rule (owner, 27 Oct 2026: "this is the sort of depth I expect when you put together these documents"): every
# block of a shareable system brief is checked for both companies, including acquired brands (Qorvo: Active-Semi ACT…,
# Decawave DW…, UnitedSiC, RFMD, TriQuint, GreenPeak; Skyworks: the ex-Silicon Labs I&A Si… parts), with automotive /
# bundle option / nothing-that-fits and the reason. Search data/catalog/*_parts.yaml, data/real/*.yaml and
# data/broadcast by function id, category and description keywords; check band, frequency and voltage against the
# system. The findings go under coverage: (one entry per diagram block, "gid.function"), so the next run starts there.
#   coverage: {block: {skyworks: "...", qorvo: "...", note: "..."}}; each company value starts with
#   "auto: MPN[, MPN] - why" (best active AEC-Q part), "bundle: MPN[, MPN] - why" (best active non-automotive part,
#   with why it is still relevant) or "none: why" (all discontinued, wrong band, not in our catalogue (store crawl
#   2026-10-19), ...). Parts named under auto/bundle need not all be in parts: (the page and slide limits decide);
#   tests/test_share_systems.py checks every diagram block has both entries and every named part is active.
#   The shareable page shows only one line from this: the blocks without a Skyworks or Qorvo part.

defaults:
  sections:
    intro: {heading: "What it is and why it matters"}
    diagram: {heading: "Block diagram"}
    core: {heading: "Core solution: Skyworks and Qorvo parts"}
    peripherals: {heading: "Peripherals: Skyworks and Qorvo parts"}
    talk: {heading: "Talking points"}
  core_note: "Core solution: every part is AEC-Q qualified as stated in the public catalogue."
  peripheral_note: >-
    Peripherals marked not automotive are shown as bundle options; they would need qualification for the vehicle.
  sources:
    - "Parts, grades and specifications: public Skyworks and Qorvo catalogues and data sheets."
    - "Block diagram: simplified from public reference designs and application diagrams."

uwb:
  label: "UWB in the car"
  line: "Digital key, child presence and anchors: block diagram and parts."
  title: "Automotive UWB: digital key, child presence and anchors"
  header: {title: "Skyworks + Qorvo · Automotive UWB", subtitle: ""}
  kicker: "System brief · Automotive UWB"
  sections:
    intro:
      paragraphs:
        - id: uwb-intro-1
          text: >-
            A car with a phone-as-key carries several UWB anchors that measure secure time of flight to the phone or
            key fob. UWB measures the distance very precisely, so the doors open as the driver comes close and a
            relayed signal cannot fool the car.
        - id: uwb-intro-2
          text: >-
            The same anchors can act as a small radar: the interior anchor senses a child left in the car, an
            exterior one a kick under the bumper. Euro NCAP rewards child-presence detection from 2026. Next is IEEE
            802.15.4ab with narrowband assist and a standard sensing mode.
    diagram:
      paragraphs:
        - id: uwb-diag-1
          text: >-
            Exterior anchors range to the phone or fob on UWB channel 9; the interior anchor also runs radar for
            child presence. Bluetooth LE wakes the anchors, which report to the access controller over CAN or LIN.
    core:
      paragraphs:
        - id: uwb-core-1
          text: "The UWB ICs at the heart of every anchor."
    peripherals:
      paragraphs:
        - id: uwb-peri-1
          text: >-
            Around the UWB IC: the antenna switch, front ends that make up losses, the Bluetooth LE wake-up radio,
            and filters that keep V2X and Wi-Fi out of the UWB and narrowband-assist receivers.
    talk:
      paragraphs:
        - id: uwb-talk-1
          text: >-
            Digital car keys are moving to the new UWB standard IEEE 802.15.4ab with narrowband assist, and CCC
            Digital Key 4.0 is in testing.
        - id: uwb-talk-2
          text: >-
            Euro NCAP rewards child-presence detection from 2026, and UWB key anchors can also sense breathing and
            kicks; the QPF5100Q lists child presence and kick sensing among its uses.
        - id: uwb-talk-3
          text: >-
            We would like to learn from which model year you need 802.15.4ab in your anchors, and which sensor you
            plan for child presence on platforms with a UWB key.
  diagram:
    from: "topic:auto_uwb"
    title: "Phone-as-key car access with UWB anchors"
    labels:
      g1: "Phone or key fob"
      g2: "Exterior UWB anchor (several)"
      g3: "Interior anchor: ranging + radar"
      g4: "Wake-up and control"
      g5: "Access controller"
      g6: "Other radios in the car"
    short:
      g1.external_block: "Phone or fob: UWB + BLE + NFC"
      g2.antenna: "Antennas (2 for angle)"
      g2.rf_switch: "Antenna switch"
      g2.uwb_fem: "Bypass LNA / PA"
      g2.uwb_soc: "UWB IC"
      g2.crystal_oscillator: "Crystal"
      g2.pol_ldo: "LDO"
      g2.tvs_esd: "ESD protection"
      g3.antenna: "Cabin antennas"
      g3.uwb_soc: "UWB IC in radar mode"
      g3.crystal_oscillator: "Crystal"
      g4.ble_soc: "Bluetooth LE"
      g4.bt_fem: "BLE front end"
      g4.nfc_frontend: "Door-handle NFC"
      g4.filter_saw_baw: "Narrowband-assist filter"
      g5.mcu: "MCU"
      g5.secure_element: "Secure element"
      g5.can_transceiver: "CAN"
      g5.lin_transceiver: "LIN"
      g6.wifi_soc: "Wi-Fi 6E/7"
      g6.wifi_fem: "Wi-Fi front end"
      g6.filter_saw_baw: "6 GHz Wi-Fi / V2X filters"
      g6.v2x_transceiver: "5.9 GHz V2X"
      g6.v2x_fem: "V2X front end"
    place: {g1: [0, 0], g2: [1, 0], g5: [2, 0], g4: [0, 1], g3: [1, 1], g6: [2, 1]}
    links: [[g1, g2], [g1, g3], [g1, g4], [g4, g2], [g2, g5], [g3, g5]]
  parts:
    core:
      - {mpn: QPF5100Q, at: g2.uwb_soc, spec: "UWB SoC with integrated Tx filtering, 2 MB flash; digital key, child presence, kick sensing", grade: "Automotive qualified (AEC-Q)"}
      - {mpn: DW3300Q, at: g3.uwb_soc, spec: "UWB transceiver, 6.5 to 8.0 GHz (channels 5 and 9)", grade: "Automotive (AEC-Q), -40 to 105 °C"}
    peripherals:
      - {mpn: SKY5A2108, at: g2.rf_switch, spec: "SPDT, 2.4 to 8.3 GHz, lists UWB and Wi-Fi 6E; IL 0.5 to 0.9 dB", grade: "AEC-Q100 Grade 2"}
      - {mpn: QPC8019Q, at: g2.rf_switch, spec: "SPDT, 0.617 to 8.0 GHz, IL 0.60 dB, 1.8 V"}
      - {mpn: QM14068, at: g2.uwb_fem, spec: "UWB bypass switch and LNA, 6.2 to 8.3 GHz (channels 5 and 9)"}
      - {mpn: SKY5A1005, at: g4.filter_saw_baw, spec: "C-V2X notch, 5855 to 5925 MHz: keeps V2X out of the narrowband-assist bands either side"}
      - {mpn: QPF4239Q, at: g4.bt_fem, spec: "2.4 GHz front end, 2.402 to 2.481 GHz (the Bluetooth LE band), 30 dB gain"}
      - {mpn: SKY5A1008, at: g6.filter_saw_baw, spec: "6 GHz Wi-Fi filter, 5.945 to 7.125 GHz"}
  coverage:  # checked 27 Oct 2026 against the catalogues (Qorvo store crawl 2026-10-19), data/real and data/broadcast
    g1.external_block: {skyworks: "none: the phone or key fob is the user's device, not part of the car system", qorvo: "none: as Skyworks"}
    g2.antenna: {skyworks: "none: no antennas in the catalogue", qorvo: "none: no antennas in the catalogue"}
    g2.rf_switch:
      skyworks: "auto: SKY5A2108 - SPDT 2.4 to 8.3 GHz covers UWB channels 5 and 9 (6.5 / 8.0 GHz), AEC-Q100 Grade 2"
      qorvo: "auto: QPC8019Q - SPDT 0.617 to 8.0 GHz, 0.60 dB IL: covers channel 5 and reaches 8.0 GHz, the centre of channel 9 (est: the top of channel 9 is outside the stated range)"
      note: "Qorvo's other automotive switches (QPC8010Q, QPC8013Q, QPC8020Q) stop at 6 GHz; QPC6122 (50 MHz to 10 GHz) covers all of UWB but is not automotive. Skyworks SKY13298 (UWB 3-8 GHz) is last time buy."
    g2.uwb_fem:
      skyworks: "none: no UWB front end; SKY13298-360LF (UWB switch) is last time buy"
      qorvo: "bundle: QM14068, QM14070 - bypass LNA 6.2 to 8.3 GHz and PA 6 to 9 GHz; no automotive UWB front end in our data; QM14070 not shown (6 rows per slide)"
    g2.uwb_soc:
      skyworks: "none: no UWB transceiver"
      qorvo: "auto: QPF5100Q, DW3300Q - automotive UWB SoC and transceiver (Decawave line)"
      note: "Qorvo QM35825, DW3110, DW3210 and the DWM modules are active but not automotive."
    g2.crystal_oscillator:
      skyworks: "bundle: Si511 - general-purpose XO that could clock the UWB IC instead of a crystal (est); not automotive, not shown"
      qorvo: "none: no crystals or oscillators in the Qorvo catalogue"
    g2.pol_ldo:
      skyworks: "none: no LDO regulators (Skyworks PMICs are phone PA supplies)"
      qorvo: "bundle: ACT88321VU101 - PMIC with 3 bucks and 2 LDOs (Active-Semi line); not automotive, not shown"
    g2.tvs_esd: {skyworks: "none: no ESD / TVS parts (Skyworks diodes are RF PIN, Schottky and varactor)", qorvo: "none: no ESD / TVS parts"}
    g3.antenna: {skyworks: "none: no antennas in the catalogue", qorvo: "none: no antennas in the catalogue"}
    g3.uwb_soc: {skyworks: "none: no UWB transceiver", qorvo: "auto: DW3300Q - automotive UWB transceiver, channels 5 and 9, radar mode for child presence"}
    g3.crystal_oscillator: {skyworks: "bundle: Si511 - as the exterior anchor; not shown", qorvo: "none: no crystals or oscillators"}
    g4.ble_soc:
      skyworks: "none: no Bluetooth SoC (the wireless SoC line is not part of Skyworks)"
      qorvo: "bundle: QPG6200L - Bluetooth LE / Thread / Zigbee SoC (GreenPeak line); smart-home grade, not automotive; not shown (6 rows per slide)"
    g4.bt_fem:
      skyworks: "bundle: SKY66114-11 - Bluetooth LE / 802.15.4 front end, 2400-2483 MHz; not automotive, not shown (Qorvo has an automotive one)"
      qorvo: "auto: QPF4239Q - automotive 2.402-2.481 GHz front end, listed for Wi-Fi; the band is the Bluetooth LE band (est fit)"
      note: "Skyworks SKYA21040 is an automotive 2.4 GHz switch / LNA, but for Wi-Fi; no Bluetooth port is stated. Qorvo QM42655 (2402-2481 MHz) is not automotive."
    g4.nfc_frontend: {skyworks: "none: no NFC parts", qorvo: "none: no NFC parts"}
    g4.filter_saw_baw:
