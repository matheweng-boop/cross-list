    g6.filter_saw_baw: {skyworks: "auto: SKY5A1008 - 6 GHz Wi-Fi filter 5.945-7.125 GHz", qorvo: "bundle: QPQ5610 - BAW 5945-7245 MHz, 1.7 dB IL; not automotive, not shown"}
