gnss:
  label: "GNSS"
  line: "Satellite positioning in the roof antenna: block diagram and parts."
  title: "Automotive GNSS: multi-band front ends for lane-level positioning"
  header: {title: "Skyworks + Qorvo · GNSS", subtitle: ""}
  kicker: "System brief · Automotive GNSS"
  sections:
    intro:
      paragraphs:
        - id: gnss-intro-1
          text: >-
            Satellites send signals that tell the car where it is. Cars that steer and keep their lane by themselves
            need their position within a lane, and several satellite frequencies at once make it much more exact.
        - id: gnss-intro-2
          text: >-
            The GNSS front end sits in the roof antenna: a very quiet amplifier and filters that keep out the strong
            cellular, Wi-Fi and V2X signals in the same shark fin. Receivers are moving from L1 only to dual- and
            triple-frequency (L1/E1, L2, L5/E5, E6).
    diagram:
      paragraphs:
        - id: gnss-diag-1
          text: >-
            The active antenna in the shark fin filters, amplifies and splits the bands and feeds one coax (RF up, DC
            down) to the receiver, which takes corrections and feeds positioning for driver assistance.
    core:
      paragraphs:
        - id: gnss-core-1
          text: "The GNSS LNA front end of the active antenna."
    peripherals:
      paragraphs:
        - id: gnss-peri-1
          text: >-
            Around it: diplexers and band filters, and the V2X front ends and notch filters of the radios that share
            the fin.
    talk:
      paragraphs:
        - id: gnss-talk-1
          text: >-
            Lane-level driver assistance is moving car GNSS receivers to several bands, and the roof antenna must
            also keep out the car's own V2X, cellular and Wi-Fi signals.
        - id: gnss-talk-2
          text: >-
            Skyworks sells an automotive L1 + L5 GNSS front-end module with filters (SKY5A2110) and the other RF parts
            of the roof module.
        - id: gnss-talk-3
          text: >-
            We would like to learn which GNSS bands your next platforms use, and whether your antennas are
            single-feed or dual-feed.
  diagram:
    from: "topic:gnss_frontend"
    title: "Automotive multi-band GNSS active antenna to receiver"
    labels:
      g1: "Antenna element"
      g2: "Active antenna front end (shark fin)"
      g3: "Other radios in the fin"
      g4: "Receiver side"
      g5: "Corrections"
      g6: "Positioning"
    short:
      g1.antenna: "Multi-band patch"
      g2.filter_saw_baw: "Pre- and post-filters"
      g2.gnss_lna: "L1 and L5 LNAs"
      g2.diplexer: "Band split / diplexer"
      g2.tvs_esd: "ESD protection"
      g3.modem: "LTE / 5G"
      g3.v2x_fem: "V2X 5.9 GHz"
      g3.wifi_fem: "Wi-Fi 2.4 / 5 / 6 GHz"
      g4.rf_passive: "Bias-T"
      g4.load_switch: "Antenna supply switch"
      g4.soc: "Multi-band GNSS receiver"
      g5.modem: "Cellular corrections"
      g5.soc: "L-band corrections"
      g6.adas_processor: "Positioning + IMU fusion"
    links: [[g1, g2], [g3, g1], [g2, g4], [g5, g4], [g4, g6]]
  parts:
    core:
      - {mpn: SKY5A2110, at: g2.gnss_lna, spec: "GNSS L1 + L5 LNA front end with pre- and post-filters, B13 notch and diplexed output", grade: "AEC-Q104 Grade 2"}
    peripherals:
      - {mpn: TQM2M9016, at: g2.diplexer, spec: "Diplexer module splitting SDARS and GPS from one antenna"}
      - {mpn: QPQ1028, at: g2.diplexer, spec: "GPS L1 / L2 SAW diplexer, 1575.42 / 1227.6 MHz"}
      - {mpn: "880273", at: g2.filter_saw_baw, spec: "BAW GPS L1 filter, 1575 MHz, 2.35 dB IL"}
      - {mpn: "880060", at: g2.filter_saw_baw, spec: "GPS L2 filter, 1227 MHz, 1.8 dB IL"}
      - {mpn: SKY5A2105, at: g3.v2x_fem, spec: "C-V2X and 802.11p front end in the same fin (preview)"}
      - {mpn: QPF1004Q, at: g3.v2x_fem, spec: "C-V2X / DSRC integrated front end in the same fin"}

radio:
  label: "Car radio (AM/FM/DAB)"
  line: "Broadcast radio in the car: block diagram and parts."
  title: "Car radio: AM, FM and digital radio (DAB, HD Radio, DRM)"
  header: {title: "Skyworks + Qorvo · Car radio", subtitle: ""}
  kicker: "System brief · Car radio"
  sections:
    intro:
      paragraphs:
        - id: radio-intro-1
          text: >-
            Cars still need radio: it is free, works without a phone and carries traffic and emergency news. New cars
            receive AM, FM and digital radio (DAB+, HD Radio, DRM).
        - id: radio-intro-2
          text: >-
            A radio needs tuners to pick the station and a decoder to turn digital radio into sound; several tuners
            give better reception while driving. Car radio is moving towards the antenna and towards central
            computers.
    diagram:
      paragraphs:
        - id: radio-diag-1
          text: >-
            Antenna to audio: the antenna and RF stage feed the tuners, the digital radio decoder turns DAB, HD Radio
            or DRM into audio, and the head unit plays it.
    core:
      paragraphs:
        - id: radio-core-1
          text: "Tuners and digital radio decoders: the parts that make the radio."
    peripherals:
      paragraphs:
        - id: radio-peri-1
          text: "Around the tuner: antenna switches and LNA, clock, power and audio."
    talk:
      paragraphs:
        - id: radio-talk-1
          text: >-
            Skyworks sells automotive AM/FM, HD Radio, DAB and DRM tuners and decoders, and with Qorvo also
            automotive RF switches, clock buffers and power converters.
        - id: radio-talk-2
          text: >-
            Car radio is moving towards the antenna and towards central computers; we would like to learn whether
            your next platform moves the radio out of the head unit.
        - id: radio-talk-3
          text: "We would like to learn which other parts around the tuner you would like to buy from the same supplier."
  diagram:
