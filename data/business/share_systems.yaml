radio:
  label: "Car radio (AM/FM/DAB)"
  line: "Broadcast radio in the car: block diagram and parts."
  title: "Car radio: AM, FM and digital radio (DAB, HD Radio, DRM)"
  header: {title: "Skyworks + Qorvo · Car radio", subtitle: ""}
  kicker: "System brief · Car radio"
  sections:
    intro:
      paragraphs:
        - id: radio-intro-1
          text: >-
            Cars still need radio: it is free, works without a phone and carries traffic and emergency news. New cars
            receive AM, FM and digital radio (DAB+, HD Radio, DRM).
        - id: radio-intro-2
          text: >-
            A radio needs tuners to pick the station and a decoder to turn digital radio into sound; several tuners
            give better reception while driving. Car radio is moving towards the antenna and towards central
            computers.
    diagram:
      paragraphs:
        - id: radio-diag-1
          text: >-
            Antenna to audio: the antenna and RF stage feed the tuners, the digital radio decoder turns DAB, HD Radio
            or DRM into audio, and the head unit plays it.
    core:
      paragraphs:
        - id: radio-core-1
          text: "Tuners and digital radio decoders: the parts that make the radio. The Si47972 tuner also has the audio DAC on chip."
    peripherals:
      paragraphs:
        - id: radio-peri-1
          text: "Around the tuner: antenna switches and LNA, clock, power and audio."
    talk:
      paragraphs:
        - id: radio-talk-1
          text: >-
            Skyworks sells automotive AM/FM, HD Radio, DAB and DRM tuners and decoders, and with Qorvo also
            automotive RF switches, clock buffers and power converters.
        - id: radio-talk-2
          text: >-
            Car radio is moving towards the antenna and towards central computers; we would like to learn whether
            your next platform moves the radio out of the head unit.
        - id: radio-talk-3
          text: "We would like to learn which other parts around the tuner you would like to buy from the same supplier."
  diagram:
    from: "template:Car radio tuner system"
    title: "Car radio tuner system"
