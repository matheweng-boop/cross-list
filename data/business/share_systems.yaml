v2x:
  label: "V2X"
  line: "Vehicle-to-everything at 5.9 GHz: block diagram and parts."
  title: "V2X: vehicle-to-everything at 5.9 GHz"
  header: {title: "Skyworks + Qorvo · V2X", subtitle: ""}
  kicker: "System brief · V2X"
  sections:
    intro:
      paragraphs:
        - id: v2x-intro-1
          text: >-
            V2X (vehicle-to-everything) lets cars warn each other and the road around them by radio, for example
            about a crash ahead or a car hidden around a corner, which makes roads safer.
        - id: v2x-intro-2
          text: >-
            The V2X front end amplifies the transmit signal (+26 to +29 dBm), receives with low noise and filters out
            the car's own Wi-Fi and cellular radios at 5.9 GHz. The US moves to C-V2X on two channels and Europe runs
            ITS-G5, LTE-V2X and NR-V2X side by side, so cars need two V2X paths.
    diagram:
      paragraphs:
        - id: v2x-diag-1
          text: >-
            Two antenna paths, each with its own 5.9 GHz front end, feed the V2X chipset. GNSS gives position and time
            for every message, and a security element signs and checks each one.
    core:
      paragraphs:
        - id: v2x-core-1
          text: "The 5.9 GHz front ends: one per antenna path."
    peripherals:
      paragraphs:
        - id: v2x-peri-1
          text: "Around the front ends: the V2X band filter, the GNSS front end for timing, and power."
    talk:
      paragraphs:
        - id: v2x-talk-1
          text: >-
            V2X is changing: the US moves to C-V2X on two channels and Europe runs ITS-G5, LTE-V2X and NR-V2X side by
            side.
        - id: v2x-talk-2
          text: "Skyworks, with Qorvo, sells automotive V2X front ends and V2X BAW filters."
        - id: v2x-talk-3
          text: >-
            We would like to learn whether your next units need two V2X carriers at once, and where the V2X RF will
            sit.
  diagram:
    from: "template:V2X unit with two antenna paths, standalone or companion to the TCU (after Autotalks, Skyworks and 5GAA public material)"
    title: "V2X unit with two antenna paths"
    labels:
      ant: "V2X antennas"
      fe1: "5.9 GHz front end, path 1"
      fe2: "5.9 GHz front end, path 2"
      chip: "V2X chipset"
      host: "Processor with the V2X stack"
      hsm: "Security"
      gnss: "GNSS (position and time)"
      pwr: "Power"
      net: "Vehicle network"
    short:
      ant.antenna: "Antennas ×2"
      fe1.v2x_fem: "5.9 GHz front end (PA, LNA, switch)"
      fe1.filter_saw_baw: "5.9 GHz filter"
      fe2.v2x_fem: "5.9 GHz front end (PA, LNA, switch)"
      fe2.filter_saw_baw: "5.9 GHz filter"
      chip.v2x_transceiver: "Transceiver + modem"
      chip.crystal_oscillator: "Crystal"
      host.soc: "Processor"
      hsm.secure_element: "Secure element"
      gnss.gnss_lna: "GNSS LNA"
      gnss.filter_saw_baw: "GNSS filter"
      pwr.pmic: "Regulator"
      pwr.pol_ldo: "LDO"
      net.can_transceiver: "CAN"
      net.ethernet_phy: "Ethernet"
    drop: [net]
    place: {ant: [0, 0], fe1: [1, 0], chip: [2, 0], host: [3, 0], pwr: [0, 1], fe2: [1, 1], gnss: [2, 1], hsm: [3, 1]}
    links: [[ant, fe1], [ant, fe2], [fe1, chip], [fe2, chip], [chip, host], [gnss, chip], [host, hsm]]
  parts:
    core:
      - {mpn: SKY5A2105, at: fe1.v2x_fem, spec: "C-V2X and 802.11p front end, 5.855 to 5.925 GHz, high power (preview)"}
      - {mpn: SKYA21043, at: fe1.v2x_fem, spec: "802.11p front end, 5.85 to 5.925 GHz, high power"}
      - {mpn: QPF1004Q, at: fe2.v2x_fem, spec: "C-V2X / DSRC integrated front end"}
      - {mpn: QPF1005Q, at: fe2.v2x_fem, spec: "V2X RF front end"}
    peripherals:
      - {mpn: QPQ2200Q, at: fe1.filter_saw_baw, spec: "BAW band-pass, 5.855 to 5.925 GHz, 1.3 dB IL; one per antenna path"}
      - {mpn: SKY5A2110, at: gnss.gnss_lna, spec: "GNSS L1 + L5 LNA front end with pre- and post-filters", grade: "AEC-Q104 Grade 2"}
      - {mpn: QPQ1060, at: gnss.filter_saw_baw, spec: "SAW band-pass, 1559.92 to 1590.92 MHz (GPS L1, Galileo E1, BeiDou B1), 1.3 dB IL"}
      - {mpn: ACT4751MQI101, at: pwr.pmic, spec: "Step-down regulator, 4.5 to 40 V in, 4 A", grade: "Automotive grade"}
      - {mpn: ACT88321VU101, at: pwr.pol_ldo, spec: "PMIC: 3 bucks, 2 LDOs (390 mA each), load bypass switches, I2C"}
  coverage:  # checked 27 Oct 2026 against the catalogues (Qorvo store crawl 2026-10-19), data/real and data/broadcast
    ant.antenna: {skyworks: "none: no antennas in the catalogue", qorvo: "none: no antennas in the catalogue"}
    fe1.v2x_fem:
      skyworks: "auto: SKY5A2105, SKYA21043 - 5.9 GHz C-V2X / 802.11p high-power front ends (SKY5A2105 preview)"
      qorvo: "auto: QPF1004Q, QPF1005Q - C-V2X / DSRC front ends"
      note: "Qorvo QPF1002Q (automotive, 5.770-5.925 GHz, 28 dBm) also spans the V2X band but is listed as Wi-Fi. QPF1003Q (multi-standard V2X + Wi-Fi, AEC-Q100 as target) and QPF4554Q (Wi-Fi / C-V2X, preview) are known only from qorvo.com snippets, status not confirmed; not shown."
    fe1.filter_saw_baw:
      skyworks: "none: no 5.9 GHz band-pass; SKY5A1005 is a V2X notch (protects the other radios), SKY5A1006 stops at 5.835 GHz"
      qorvo: "auto: QPQ2200Q - BAW band-pass 5.855-5.925 GHz, 1.3 dB IL"
    fe2.v2x_fem: {skyworks: "auto: SKY5A2105, SKYA21043 - as path 1", qorvo: "auto: QPF1004Q, QPF1005Q - as path 1"}
    fe2.filter_saw_baw:
      skyworks: "none: as path 1"
      qorvo: "auto: QPQ2200Q - as path 1 (listed once)"
      note: "QPQ2230Q, shown here before, is a V2X notch for the Wi-Fi path, not a V2X band-pass, so it was removed from this block."
    chip.v2x_transceiver: {skyworks: "none: no V2X chipsets", qorvo: "none: no V2X chipsets"}
    chip.crystal_oscillator:
      skyworks: "bundle: Si511 - general-purpose XO (est fit as the chipset reference); not automotive, not shown"
      qorvo: "none: no crystals or oscillators"
      note: "Skyworks automotive timing is clock generators and buffers (Si5332-AM, Si5335x-01AM), not reference crystals."
    host.soc: {skyworks: "none: no processors", qorvo: "none: no processors"}
    hsm.secure_element: {skyworks: "none: no secure elements", qorvo: "none: no secure elements"}
    gnss.gnss_lna:
      skyworks: "auto: SKY5A2110 - L1 + L5 LNA front end with filters, AEC-Q104 Grade 2"
      qorvo: "none: no GNSS LNA in the catalogue; Qorvo's automotive LNAs (QPL6202Q, QPL6220Q) are SDARS 2.32-2.345 GHz"
    gnss.filter_saw_baw:
      skyworks: "none: no standalone GNSS filter (the filters sit inside SKY5A2110)"
      qorvo: "bundle: QPQ1060 - SAW L1 / E1 / B1, 1.3 dB IL; not automotive"
      note: "QPQ1060 replaces 880273 (BAW L1, 10 MHz wide, 2.35 dB IL): lower loss and also covers Galileo E1 and BeiDou B1."
    pwr.pmic:
      skyworks: "none: no automotive regulators; Skyworks PMICs (SKY87020, SKY51001) are phone PA supplies"
      qorvo: "auto: ACT4751MQI101 - 4.5-40 V in, 4 A step-down (Active-Semi line)"
      note: "ACT4529M (40 V, 3 A, automotive) is an alternative; it is a USB charging converter."
    pwr.pol_ldo:
      skyworks: "none: no LDO regulators"
      qorvo: "bundle: ACT88321VU101 - PMIC with 2 x 390 mA LDOs and 3 bucks; not automotive"

gnss:
  label: "GNSS"
  line: "Satellite positioning in the roof antenna: block diagram and parts."
  title: "Automotive GNSS: multi-band front ends for lane-level positioning"
  header: {title: "Skyworks + Qorvo · GNSS", subtitle: ""}
  kicker: "System brief · Automotive GNSS"
  sections:
    intro:
      paragraphs:
        - id: gnss-intro-1
          text: >-
            Satellites send signals that tell the car where it is. Cars that steer and keep their lane by themselves
            need their position within a lane, and several satellite frequencies at once make it much more exact.
        - id: gnss-intro-2
          text: >-
            The GNSS front end sits in the roof antenna: a very quiet amplifier and filters that keep out the strong
            cellular, Wi-Fi and V2X signals in the same shark fin. Receivers are moving from L1 only to dual- and
            triple-frequency (L1/E1, L2, L5/E5, E6).
    diagram:
      paragraphs:
        - id: gnss-diag-1
          text: >-
            The active antenna in the shark fin filters, amplifies and splits the bands and feeds one coax (RF up, DC
            down) to the receiver, which takes corrections and feeds positioning for driver assistance.
    core:
      paragraphs:
        - id: gnss-core-1
          text: "The GNSS LNA front end of the active antenna."
    peripherals:
      paragraphs:
        - id: gnss-peri-1
          text: >-
            Around it: diplexers and L1 and L5 band filters, and the front ends of the V2X, cellular and Wi-Fi radios
            that share the fin.
    talk:
      paragraphs:
        - id: gnss-talk-1
          text: >-
            Lane-level driver assistance is moving car GNSS receivers to several bands, and the roof antenna must
            also keep out the car's own V2X, cellular and Wi-Fi signals.
        - id: gnss-talk-2
          text: >-
            Skyworks sells an automotive L1 + L5 GNSS front-end module with filters (SKY5A2110) and the other RF parts
            of the roof module.
        - id: gnss-talk-3
          text: >-
