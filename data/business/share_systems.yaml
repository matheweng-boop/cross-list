      - {mpn: QPF5100Q, at: g2.uwb_soc, spec: "UWB SoC with integrated Tx filtering, 2 MB flash; digital key, child presence, kick sensing", grade: "Automotive qualified (AEC-Q)"}
      - {mpn: DW3300Q, at: g3.uwb_soc, spec: "UWB transceiver, 6.5 to 8.0 GHz (channels 5 and 9)", grade: "Automotive (AEC-Q), -40 to 105 °C"}
