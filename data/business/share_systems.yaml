v2x:
  label: "V2X"
  line: "Vehicle-to-everything at 5.9 GHz: block diagram and parts."
  title: "V2X: vehicle-to-everything at 5.9 GHz"
  header: {title: "Skyworks + Qorvo · V2X", subtitle: ""}
  kicker: "System brief · V2X"
  sections:
    intro:
      paragraphs:
        - id: v2x-intro-1
          text: >-
            V2X (vehicle-to-everything) lets cars warn each other and the road around them by radio, for example
            about a crash ahead or a car hidden around a corner, which makes roads safer.
        - id: v2x-intro-2
          text: >-
            The V2X front end amplifies the transmit signal (+26 to +29 dBm), receives with low noise and filters out
            the car's own Wi-Fi and cellular radios at 5.9 GHz. The US moves to C-V2X on two channels and Europe runs
            ITS-G5, LTE-V2X and NR-V2X side by side, so cars need two V2X paths.
    diagram:
      paragraphs:
        - id: v2x-diag-1
          text: >-
            Two antenna paths, each with its own 5.9 GHz front end, feed the V2X chipset. GNSS gives position and time
            for every message, and a security element signs and checks each one.
    core:
      paragraphs:
        - id: v2x-core-1
          text: "The 5.9 GHz front ends: one per antenna path."
    peripherals:
      paragraphs:
        - id: v2x-peri-1
          text: "Around the front ends: the V2X band filter, the GNSS front end for timing, and power."
    talk:
      paragraphs:
        - id: v2x-talk-1
          text: >-
            V2X is changing: the US moves to C-V2X on two channels and Europe runs ITS-G5, LTE-V2X and NR-V2X side by
            side.
        - id: v2x-talk-2
          text: "Skyworks, with Qorvo, sells automotive V2X front ends and V2X BAW filters."
        - id: v2x-talk-3
          text: >-
            We would like to learn whether your next units need two V2X carriers at once, and where the V2X RF will
            sit.
  diagram:
    from: "template:V2X unit with two antenna paths, standalone or companion to the TCU (after Autotalks, Skyworks and 5GAA public material)"
    title: "V2X unit with two antenna paths"
    labels:
      ant: "V2X antennas"
      fe1: "5.9 GHz front end, path 1"
      fe2: "5.9 GHz front end, path 2"
      chip: "V2X chipset"
      host: "Processor with the V2X stack"
      hsm: "Security"
      gnss: "GNSS (position and time)"
      pwr: "Power"
      net: "Vehicle network"
    short:
      ant.antenna: "Antennas ×2"
      fe1.v2x_fem: "5.9 GHz front end (PA, LNA, switch)"
      fe1.filter_saw_baw: "5.9 GHz filter"
      fe2.v2x_fem: "5.9 GHz front end (PA, LNA, switch)"
      fe2.filter_saw_baw: "5.9 GHz filter"
      chip.v2x_transceiver: "Transceiver + modem"
      chip.crystal_oscillator: "Crystal"
      host.soc: "Processor"
      hsm.secure_element: "Secure element"
      gnss.gnss_lna: "GNSS LNA"
      gnss.filter_saw_baw: "GNSS filter"
      pwr.pmic: "Regulator"
      pwr.pol_ldo: "LDO"
      net.can_transceiver: "CAN"
      net.ethernet_phy: "Ethernet"
    drop: [net]
    place: {ant: [0, 0], fe1: [1, 0], chip: [2, 0], host: [3, 0], pwr: [0, 1], fe2: [1, 1], gnss: [2, 1], hsm: [3, 1]}
    links: [[ant, fe1], [ant, fe2], [fe1, chip], [fe2, chip], [chip, host], [gnss, chip], [host, hsm]]
  parts:
    core:
      - {mpn: SKY5A2105, at: fe1.v2x_fem, spec: "C-V2X and 802.11p front end, 5.855 to 5.925 GHz, high power (preview)"}
      - {mpn: SKYA21043, at: fe1.v2x_fem, spec: "802.11p front end, 5.85 to 5.925 GHz, high power"}
      - {mpn: QPF1004Q, at: fe2.v2x_fem, spec: "C-V2X / DSRC integrated front end"}
      - {mpn: QPF1005Q, at: fe2.v2x_fem, spec: "V2X RF front end"}
    peripherals:
      - {mpn: QPQ2200Q, at: fe1.filter_saw_baw, spec: "BAW band-pass, 5.855 to 5.925 GHz, 1.3 dB IL"}
      - {mpn: QPQ2230Q, at: fe2.filter_saw_baw, spec: "BAW V2X notch filter (for the Wi-Fi path)"}
