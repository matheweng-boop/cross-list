# Shareable system documents (owner, 27 Oct 2026): "For the shareables, create a portion for UWB and for V2X and GNSS
# and for Automotive Radio (AM/FM/DAB) with Block Diagrams and listing some parts from both Skyworks and Qorvo that's
# 4 different Docs." Built by app/services/share_systems.py; listed on Shareable through share_reports.REGISTRY.
#
# Rules (owner): only content already on the site, no new research. The words below come from the site's research
# reports and cases (data/business/reports.yaml: learn, say_externally; data/library/topics/*.yaml: summary, trends);
# talking points are the reports' say_externally lines. No reference to the site, no prices, estimates or plans,
# nothing on where parts are made (the word check and site_guard run on every save and download).
#
# diagram: the library diagram it is drawn from (from: "template:<name in data/blocks/templates.yaml>" or
#   "topic:<data/library/topics key>"), a title, the groups to leave out (drop), new places (place: gid: [col, row]),
#   shorter group labels (labels), shorter block labels by function (short) and the links to keep (links: [a, b]).
# parts: core (the parts that define the system; every one must be AEC-Q qualified in the catalogue data) and
#   peripherals (around the core: switches, LNAs, filters, clocks, power; automotive or not, as bundle options).
#   at: "<group id>.<function>" - the diagram block the part sits in (core: solid highlight; peripheral: outline).
#   spec: one or two key specs as the public catalogue / data sheet states them; grade: as the data states it
#   (empty: "Automotive (AEC-Q)" or "Not automotive" from app/services/autograde.py).
# Every part must be active in the catalogue (not NRND, last time buy or obsolete); others are left out.

defaults:
  sections:
    intro: {heading: "What it is and why it matters"}
    diagram: {heading: "Block diagram"}
    core: {heading: "Core solution: Skyworks and Qorvo parts"}
    peripherals: {heading: "Peripherals: Skyworks and Qorvo parts"}
    talk: {heading: "Talking points"}
  core_note: "Core solution: every part is AEC-Q qualified as stated in the public catalogue."
  peripheral_note: >-
    Peripherals marked not automotive are shown as bundle options; they would need qualification for the vehicle.
  sources:
    - "Parts, grades and specifications: public Skyworks and Qorvo catalogues and data sheets."
    - "Block diagram: simplified from public reference designs and application diagrams."

uwb:
  label: "UWB in the car"
  line: "Digital key, child presence and anchors: block diagram and parts."
  title: "Automotive UWB: digital key, child presence and anchors"
  header: {title: "Skyworks + Qorvo · Automotive UWB", subtitle: ""}
  kicker: "System brief · Automotive UWB"
  sections:
    intro:
      paragraphs:
        - id: uwb-intro-1
          text: >-
            A car with a phone-as-key carries several UWB anchors that measure secure time of flight to the phone or
            key fob. UWB measures the distance very precisely, so the doors open as the driver comes close and a
            relayed signal cannot fool the car.
        - id: uwb-intro-2
          text: >-
            The same anchors can act as a small radar: the interior anchor senses a child left in the car, an
            exterior one a kick under the bumper. Euro NCAP rewards child-presence detection from 2026. Next is IEEE
            802.15.4ab with narrowband assist and a standard sensing mode.
    diagram:
      paragraphs:
        - id: uwb-diag-1
          text: >-
            Exterior anchors range to the phone or fob on UWB channel 9; the interior anchor also runs radar for
            child presence. Bluetooth LE wakes the anchors, which report to the access controller over CAN or LIN.
    core:
      paragraphs:
        - id: uwb-core-1
          text: "The UWB ICs at the heart of every anchor."
    peripherals:
      paragraphs:
        - id: uwb-peri-1
          text: >-
            Around the UWB IC: the antenna switch, front ends that make up losses, and filters on the Wi-Fi and V2X
            radios that share the car.
    talk:
      paragraphs:
        - id: uwb-talk-1
          text: >-
            Digital car keys are moving to the new UWB standard IEEE 802.15.4ab with narrowband assist, and CCC
            Digital Key 4.0 is in testing.
        - id: uwb-talk-2
          text: >-
            Euro NCAP rewards child-presence detection from 2026, and UWB key anchors can also sense breathing and
            kicks; the QPF5100Q lists child presence and kick sensing among its uses.
        - id: uwb-talk-3
          text: >-
            We would like to learn from which model year you need 802.15.4ab in your anchors, and which sensor you
            plan for child presence on platforms with a UWB key.
  diagram:
    from: "topic:auto_uwb"
    title: "Phone-as-key car access with UWB anchors"
    labels:
      g1: "Phone or key fob"
      g2: "Exterior UWB anchor (several)"
      g3: "Interior anchor: ranging + radar"
      g4: "Wake-up and control"
      g5: "Access controller"
      g6: "Other radios in the car"
    short:
      g1.external_block: "Phone or fob: UWB + BLE + NFC"
      g2.antenna: "Antennas (2 for angle)"
      g2.rf_switch: "Antenna switch"
      g2.uwb_fem: "Bypass LNA / PA"
      g2.uwb_soc: "UWB IC"
      g2.crystal_oscillator: "Crystal"
      g2.pol_ldo: "LDO"
      g2.tvs_esd: "ESD protection"
      g3.antenna: "Cabin antennas"
      g3.uwb_soc: "UWB IC in radar mode"
      g3.crystal_oscillator: "Crystal"
      g4.ble_soc: "Bluetooth LE"
      g4.bt_fem: "BLE front end"
      g4.nfc_frontend: "Door-handle NFC"
      g4.filter_saw_baw: "Narrowband-assist filter"
      g5.mcu: "MCU"
      g5.secure_element: "Secure element"
      g5.can_transceiver: "CAN"
      g5.lin_transceiver: "LIN"
      g6.wifi_soc: "Wi-Fi 6E/7"
      g6.wifi_fem: "Wi-Fi front end"
      g6.filter_saw_baw: "6 GHz Wi-Fi / V2X filters"
      g6.v2x_transceiver: "5.9 GHz V2X"
      g6.v2x_fem: "V2X front end"
    place: {g1: [0, 0], g2: [1, 0], g5: [2, 0], g4: [0, 1], g3: [1, 1], g6: [2, 1]}
    links: [[g1, g2], [g1, g3], [g1, g4], [g4, g2], [g2, g5], [g3, g5]]
  parts:
