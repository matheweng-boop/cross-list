      qorvo: "auto: QPQ2230Q - BAW V2X notch filter; not shown (6 rows per slide; SKY5A1005 does the same job)"
    g5.mcu: {skyworks: "none: no MCUs", qorvo: "none: no MCUs"}
    g5.secure_element: {skyworks: "none: no secure elements", qorvo: "none: no secure elements"}
    g5.can_transceiver: {skyworks: "none: no CAN transceivers (Skyworks isolators are not CAN PHYs)", qorvo: "none: no CAN transceivers"}
    g5.lin_transceiver: {skyworks: "none: no LIN transceivers", qorvo: "none: no LIN transceivers"}
    g6.wifi_soc: {skyworks: "none: no Wi-Fi SoCs", qorvo: "none: no Wi-Fi SoCs"}
    g6.wifi_fem:
