    usd: 3350000000
    year: 2026
    region: Global
    scope: "Current sensors by sensing method, loop type, offering (isolated / non-isolated), technology and application; $6.39 B by 2032 (11.4 % a year). Includes Hall sensors and modules, so isolated amplifiers are only a part of it. What the press release says it counts: the report splits the market by current sensing method (contact-based and contactless), loop type (open and closed loop), offering (isolated and non-isolated), technology, mounting type, measurement range, output type, application and region. Segments named: contact-based sensing holds the largest share over the forecast; isolated current sensors hold the largest share by offering (EV powertrains, battery management, charging infrastructure, industrial motor drives, renewable-energy inverters); industrial has the second-highest growth rate (automation, robotics, drives, inverters, IIoT, energy storage). Applications listed: automotive, industrial, consumer electronics, energy & power. Growth drivers named: electric vehicles, battery-powered systems, renewable energy, industrial automation, electrification and high-performance power electronics. The automotive and industrial shares are not given in the press release (paid report only)."
    source:
      title: "Current Sensor Industry worth $6.39 billion by 2032 (press release)"
      publisher: MarketsandMarkets
      url: "https://www.marketsandmarkets.com/PressReleases/current-sensor.asp"
      date: "2026-09-29 (report code SE 6985, as printed on the page)"
    quality: "Analyst press release read on 23 Oct 2026 and confirmed by the biweekly check (25 Oct); the paid report (300 pages, 180 tables) was not read. Names the segments with the largest share or fastest growth, the drivers and the players (Asahi Kasei, Infineon, Allegro, LEM, Melexis, TDK, Honeywell, TI, Tamura, Omron, ST, Yageo, ADI, Broadcom, Aceinna), but no dollar split by application or region, so the automotive or charging share cannot be read from it. One analyst house only; a second public figure would turn it into a low-high band. Scope is wider than our parts: Hall sensors, modules and shunt-based sensing are all in, so the share open to isolated amplifiers and integrated isolated sensors is a part of it (est)."
    origin: "Integrated isolated current-sensing case (iso-current-sense-charging), background notes 3.1"
