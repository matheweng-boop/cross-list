    gist: "Analysts put current sensors of every kind at $3.35 B in 2026, growing to $6.39 B by 2032; isolated sensors are the largest share."
    abstract:
      - "MarketsandMarkets press release, checked on 25 Oct; includes Hall sensors and modules."
