# Market size (TAM) estimates for specific products or technologies (Data management > TAM estimates).
#
# Every figure is copied, as recorded, from the research notes of the preliminary cases
# (app/web/templates/business/reports/<case>.background.html and data/business/cases/<case>.yaml). Nothing is
# estimated here and nothing was fetched again. They are EXAMPLES to review: the owner marks each one agree or
# disagree, with a comment, on the TAM estimates page; new estimates added on that page are stored in the database.
#
# Fields
#   id        short, unique and stable: reviews are stored against it
#   product   the product or technology the market is about
#   fn        function id (data/blocks/functions.yaml), when one fits; optional
#   value     the figure as the source states it (text); usd = the same in US dollars (the low end of a range)
#   year      the year the figure is for; region = geography / scope of the market
#   scope     what is counted, as far as the source says
#   source    title, publisher, url ("" when no link was recorded), date ("not stated" when unknown)
#   quality   source-quality note: what kind of source it is and how far it can be trusted
#   origin    where in BizDev the figure was found
