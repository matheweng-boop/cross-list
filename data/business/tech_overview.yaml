# Header band on every page (owner, 24 Oct 2026): title line and an optional subtitle ("Prepared for ..."). A logo can
# be added on the site (edit mode) only with permission from its owner; default none.
header:
  title: "Skyworks + Qorvo · Technology overview"
  subtitle: ""

# Market focus: an optional page 5 for one system of data/blocks/systems.yaml (owner, 24 Oct 2026). Selectable: the
# systems listed here plus any system whose sub-systems have deep dives (topics), so a new system appears by itself
# (with its own summaries until words are written here). Per sub-system: one line on what we bring and 2-3 series
# (trailing x's stand for any characters; each must match an active catalogue part). platforms: keys above.
# standards: public standards by name only. Public and positive: no opportunities, gaps, competitors, prices or ideas.
# automotive_grade: only series with AEC-Q parts (app/services/autograde) are named, each with its AEC-Q count; a
# sub-system without one is left off (owner, 24 Oct 2026: "check AEC-Q qual"; cockpit LED drivers state none).
focus:
  automotive:
    paragraph: >-
      In the car, the combined portfolio connects, senses and powers: UWB digital keys, broadcast radio, telematics and
      V2X front ends, clocks for compute, and isolated gate drivers and sensing for the electric powertrain, battery and
      charging.
    automotive_grade: true
    subsystems:
      car-access: {line: "UWB ranging for digital keys, hands-free entry and in-cabin presence.", series: [DW33xx, QPF51xx]}
      car-radio: {line: "AM/FM, DAB and HD Radio tuners and digital radio coprocessors.", series: [Si479xx, Si469xx]}
      telematics-v2x: {line: "Automotive-grade cellular, V2X, GNSS and Wi-Fi front ends and switches.", series: [SKY5Axxxx, QPF10xx, QPC12xx]}
      adas: {line: "Automotive PCIe clock generators and clock buffers for domain controllers.", series: [Si5332x, Si5335x, Si5225x]}
      powertrain: {line: "Isolated gate drivers and isolated sensing for traction inverters.", series: [Si823x, Si82Fx, Si89xx]}
      battery-power: {line: "Digital isolators and isolated amplifiers for battery management.", series: [Si86xx, Si89xx]}
      charging: {line: "Isolated gate drivers and isolators with power for on-board and DC chargers.", series: [Si82Ex, Si88xx]}
    platforms: [isolation, broadcast, wireless, gaas_hbt, soi, modules, timing]
    standards: [AEC-Q100, ISO 26262, IEC 60747-17, IEEE 802.15.4z, CCC Digital Key, 3GPP C-V2X]
    learn_more: "Automotive products: skyworksinc.com and qorvo.com, automotive sections."
  datacenter:
    paragraph: >-
      In the data center, the portfolio covers power, timing and connectivity: isolation from the AC/DC supply to 800 V
      DC distribution and battery backup, low-jitter clocks for processors and optical links, and Wi-Fi and PoE for the
      network edge.
    subsystems:
      rack-power: {line: "Isolated gate drivers, digital isolators and isolated converters for rack power.", series: [Si823x, Si86xx, Si88xx]}
      backup: {line: "Isolation and isolated current sensing for battery backup and energy storage.", series: [Si89xx, Si86xx]}
      servers: {line: "Clock generators, buffers and jitter attenuators for processors, PCIe and optics.", series: [Si53xx, SKY63xxx, Si522xx]}
      network: {line: "Wi-Fi 7 front-end modules for access points and PoE controllers.", series: [SKY85xxx, QPF4xxx, Si34xx]}
    platforms: [isolation, timing, power, gaas_hbt, modules]
    standards: [IEC 60747-17, PCI Express, IEEE 1588, IEEE 802.3bt (PoE), IEEE 802.11be (Wi-Fi 7)]
    learn_more: "Data center and infrastructure products: skyworksinc.com and qorvo.com."
  drones:
    paragraph: >-
      In drones, the portfolio drives the motors and carries the radio links: motor-control SoCs and power management
      for flight, front ends for the control link, video downlink and GNSS, and cellular modules for flights beyond
      visual line of sight.
    subsystems:
      flight: {line: "Motor-control SoCs for the ESCs and configurable power management.", series: [PAC55xx, ACT88xx]}
      radio-links: {line: "Front ends, switches and LNAs for control, video and GNSS links.", series: [SKY85xxx, SKY13xxx, QPL9xxx]}
      cellular-link: {line: "4G/5G front-end and diversity receive modules for the cellular link.", series: [SKY58xxx, SKY53xxx]}
    platforms: [power, gaas_hbt, soi, modules, saw]
    standards: [FAA Remote ID, ASTM F3411, 3GPP 5G RedCap, IEEE 802.11]
    learn_more: "Products for drones and robotics: skyworksinc.com and qorvo.com."
