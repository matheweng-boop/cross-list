# Technology proximity of each function to the combined Skyworks + Qorvo portfolio (public knowledge, indicative).
# proximity: 3 = same technology already in production (a new variant / new spec), 2 = adjacent (shared process or
# design know-how, new IP blocks needed), 1 = distant (some shared capability, mostly new), 0 = unrelated (different
# core technology, e.g. leading-edge digital, memory, image sensors).
# Qorvo's SiC (UnitedSiC) business was sold to onsemi (closed Jan 2025) and is not counted as current technology.
active_antenna_amp:
  proximity: 2
  tech: [GaAs pHEMT, SiGe]
  reasoning: >-
    Existing LNAs and gain blocks cover the RF part; AM/FM in-antenna amplifiers need low-frequency, high-linearity automotive specs not in current lines.
