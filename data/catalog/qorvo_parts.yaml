# Qorvo product catalogue for BizDev (Skyworks + Qorvo combined). Built 2026-10-19.
#
# METHOD (public pages only, robots.txt read first for every host; nothing bypassed):
#   - www.qorvo.com: HTTP 429 "Vercel Security Checkpoint" (JS challenge) again on robots.txt (checked once,
#     2026-10-19). Not used, not worked around. Datasheet links below point to qorvo.com and were NOT fetched.
#   - store.qorvo.com (Qorvo's online store, run by RFMW): robots.txt allows /products/ and /manufacturer/,
#     disallows /search/ and '/*?*att_' (filter) URLs; neither was requested.
#     1. sitemap.xml (6,744 URLs, last updated 2024-11-09) -> category URLs + 6,608 product-detail URLs (1,785 unique ids).
#     2. Every live category listing at 250 rows per request (?mpp=250&pg=N). Each row's "More Info" block carries
#        the description, Status, the category's parametric fields and the datasheet link, so no per-part request
#        was needed for listed parts. Sitemap categories that 404 were retried once at /manufacturer/qorvo/<slug>;
#        categories found only through product-page breadcrumbs (variable-attenuator, phase-shifter,
#        temperature-variable-attenuator) were listed the same way.
#     3. Sitemap product ids missing from every live listing (265, excluding 121 UnitedSiC ids and 81 boards/kits)
#        were read one product page each.
#     4. Eleven removed category URLs (DTC, duplexer, PLL, power divider, fixed attenuator, VCO, transistor, 4x SiC) now
#        return keyword-search results (25 rows, page size ignored). Only the first,
#        already-fetched page was used, for parts not found otherwise; they were not paged further.
#   - Pacing: one request at a time, >= 4 s after the previous response ended, exponential backoff (30/60/120 s)
#     on Azure Application Gateway 403s. 373 requests in 68 min (306 x 200, 51 x 403 transient, 16 x 404).
#     Raw pages are cached in the session scratchpad (not in the repo), so the crawl is resumable.
#   - rfmw.com: same robots.txt as the store; not needed. Mouser / DigiKey / onsemi not used (blocked earlier).
#
# COUNTS: 1636 parts. Sources: {'category listing': 1373, 'keyword-fallback': 86, 'product page': 177}.
#   Status: {'Discontinued': 512, 'Standard': 997, 'Featured': 35, 'Non standard': 23, 'No new designs': 69}.
#   automotive: true 7, null 1629 (true only where the store text says AEC-Q / automotive; null = not stated).
#   function counts: {'power_amplifier': 219, 'rf_gain_block': 190, 'filter_saw_baw': 175, 'catv_amplifier': 145, 'rf_switch': 139, 'lna': 114, 'wifi_fem': 85, 'rf_power_transistor': 81, 'pmic': 62, 'rf_attenuator': 56, 'rf_synthesizer': 54, 'rf_mixer': 51, 'motor_controller': 40, 'pa_module': 36, 'rf_frontend': 32, 'wide_vin_buck': 18, 'rf_phase_shifter': 18, 'rf_limiter': 18, 'uwb_soc': 14, 'battery_charger': 13, 'rf_transceiver': 13, 'power_loss_protection': 11, 'frequency_multiplier': 8, 'antenna_tuner': 8, 'optical_driver': 5, 'wireless_soc': 5, 'rf_passive': 4, 'battery_monitor': 3, 'diplexer': 3, 'buck_boost': 2, 'uwb_fem': 2, 'bt_fem': 2, 'v2x_fem': 2, 'optical_tia': 2, 'antenna_switch': 2, 'rf_pa_bias': 1, 'pol_buck': 1, 'cc_regulator': 1, 'beamformer_ic': 1}.
#
# COVERAGE vs sitemap (1,785 unique product ids): 1,318 in live category listings; 255 read from product pages
#   (177 new parts, 59 already present under another id, 19 boards/kits); 9 now 404 (removed), 1 kit page stayed 403;
#   121 UnitedSiC SiC ids not requested (business sold to onsemi, Jan 2025; their store category is gone);
#   81 eval-board / kit ids not requested. Live listings also hold 1,056 ids newer than the sitemap.
#   => every non-SiC, non-board sitemap product is accounted for. Not covered: parts that are in no live listing
#   and not in the 2024 sitemap (e.g. pages 2+ of the duplexer / power-divider keyword pages: ~8 + ~9 rows),
#   and anything published only on qorvo.com. Eval boards (944), design kits (33) and development kits (86) are
#   counted in qorvo_categories.md but not listed as parts.
#
# FIELDS: category = store category path (top group from the URL > category title); description = store
#   "Product Description" (trimmed to ~260 chars); status as shown by the store; key_specs = the row's
#   parametric fields with the store's field names (Part Number / Manufacturer / Status / Package fields moved
#   out), max 14; datasheet_url = the store's datasheet link (qorvo.com, not fetched). These are distributor
#   catalogue values, not datasheet-verified. verified: true marks the 82 parts checked in
#   data/blocks/research/qorvo_parts.yaml; their function ids are kept, and variants sharing their base inherit it.
#   source: present only when the part did not come from a live category listing.
#   function = BizDev function id; ids not yet in data/blocks/functions.yaml are proposed in qorvo_categories.md.
#   Function assignment for non-verified parts is rule-based (store category + description keywords), see the .md.
