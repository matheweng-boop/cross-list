# Infineon RF parts for BizDev competitor coverage (public infineon.com pages only; see source.method).
source:
  vendor: Infineon
  pages:
  - https://www.infineon.com/products/rf/low-noise-amplifier-lnas/gnss-lnas
  - https://www.infineon.com/products/rf/low-noise-amplifier-lnas/4g-5g-lna
  - https://www.infineon.com/products/rf/low-noise-amplifier-lnas/multi-purpose-lnas
  - https://www.infineon.com/products/rf/rf-switches-spxt-dpxt
  - https://www.infineon.com/products/rf/antenna-cross-switches
  - https://www.infineon.com/products/rf/antenna-tuners
  - https://www.infineon.com/products/rf/driver-amplifiers
  - https://www.infineon.com/products/rf/rf-transistors/low-noise-rf-transistors
  - https://www.infineon.com/products/rf/rf-transistors/high-linearity-rf-transistors
  - https://www.infineon.com/dataApi/en/product-table/<family>.product-table.en.json?collectionName=&familyIds=<id>
  - https://www.infineon.com/en.sitemap.part-row-sitemap.xml
  - https://www.infineon.com/part/<MPN>
  collected: '2026-10-20'
  method: 'robots.txt read first (allows *.json and /part/; disallows */search* and *filter=*, not used). Family pages fetched to find
    each public product-table JSON (GET, the same URL the page script loads). Tables for GNSS LNAs, driver amplifiers, antenna cross
    switches and low-noise RF transistors returned data; the tables for 4G/5G LNAs, multi-purpose LNAs, RF switches (SPxT/DPxT) and
    antenna tuners returned an empty body (HTTP 200, content-length 0, served from CloudFront cache, also on retry), so those families
    were filled from the public part pages: every BG* part in the public part sitemap not already covered, read from the page JSON-LD
    (category, frequency, product status per orderable code) and meta description. curl with a browser User-Agent, one request at a
    time, >=1.6 s apart.'
  requests: 103
  notes: 'Functions mapped from the Infineon family: GNSS / 4G-5G / multi-purpose LNAs and LNA banks -> lna; low-noise RF transistors
    -> lna (discrete transistors, no frequency range published, fT and NFmin in the description); driver amplifiers -> rf_predriver
    with pout_dbm = published OP1dB; RF switches, antenna cross switches and antenna-tuner switches (BGSA*) -> rf_switch. BGA420/BGA427/BGA614/BGA616
    are listed by Infineon under multi-purpose LNAs but are broadband cascadable Si MMIC amplifiers (DC-3/6 GHz) and are mapped to rf_gain_block.
    Descriptions are the page meta description (trailing "Find data sheet..." dropped) or, for table parts, built from the published
    table values. Switch Pmax (power handling) is not given as pout. Status: Active = "active"/"active and preferred" for any orderable
    code; NRND = "not for new design"; Discontinued. One unitless frequency ("2300 - 2700", BGA9H1BN6) read as MHz. Skipped: high-linearity
    RF transistors (19, all discontinued; not LNAs), BGSC* tunable-capacitor/switch combos, coupler, bias/control IC, diodes, radar
    transceivers (BGT*). The infineon.com /products/rf menu has no PA, mixer, synthesizer, attenuator, phase shifter, limiter, multiplier,
    filter or beamformer family. Skipped by category: {"Coupler": ["BGC100GN6"], "Bias and Control IC": ["BGMC1210"], "Antenna tuners":
    ["BGSC2341ML10", "BGSC4331MN10"], "General Purpose Diodes": ["BGX50A"]}'
