source:
  vendor: Lark
  collected: '2026-10-20'
  ownership: Trans-Tech was sold by Skyworks to Pacific Industrial Development (PIDC) in April 2023 (PitchBook; confirmed
    by the BizDev owner 2026-10-20) and bought Lark Engineering in 2025.
  method: Public website pages and datasheets only; robots.txt checked (404 on all hosts); GET only, one request at a time,
    at least 12 s apart per host; each URL once; no forms, logins or selector tools.
  notes: Most Lark items and the Trans-Tech resonator/filter lines are built to order, so they are listed as series with their
    published range, not as every orderable variant. Ceramic materials, powders and cables are left out. Status is not published.
