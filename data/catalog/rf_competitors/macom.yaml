  collected: 2026-10-20
  method: 'robots.txt checked (Crawl-delay 60 honored: one GET every ~61 s; disallowed paths not touched). Each public RF category listing page embeds its full parametric product-finder table as JSON in data-part attributes (part number, published description, min/max frequency, power specs, isDiscontinued flag); parsed offline. curl with browser User-Agent, sequential requests; no product-detail crawling except one page used to discover the category navigation.'
  requests: 58
  notes: 'All requests returned 200; no blocking. Frequencies converted from the table''s MHz (or GHz) values; mixers use the RF/LO range, frequency multipliers use the OUTPUT frequency range; 5 parts whose table range was missing/inconsistent (CMPA851A100F, MAAM-011004/011007/011041, ENGSD00083 whose MHz values are tagged GHz) use the range stated in the published description. pout_dbm priority: PSAT dBm > PSAT/Psat W > P3dB W > peak output W > rated Pout W > Output P1dB dBm > wattage in the published description; watt values converted with 10*log10(W*1000) and the published W kept in power_basis. Where the table''s PSAT dBm disagreed with its PSAT W by >1 dB (e.g. MAPC-P1078 lists -2 dBm vs 1400 W) the W value was used. GaN ''Front End Modules'' and T/R modules mapped to power_amplifier (FEM noted in description) with Tx Psat or the published W rating; their table P1dB (receive side) was not used. Status: only ''Discontinued'' (MACOM''s isDiscontinued flag) is published on listings; otherwise
    omitted. Mapping: ''Driver'' amplifiers -> rf_predriver; gain blocks, cascadable hybrids, distributed/wideband, buffer and low-phase-noise amplifiers -> rf_gain_block; items in MACOM''s hybrid-LNA category without ''low noise'' in the description -> rf_gain_block; switch-LNA modules -> lna; radar ''core chips'' (phase shifter+attenuator+amps multifunction MMICs) -> beamformer_ic; RF power transistors/pallets/SSPAs -> power_amplifier; switch+limiter parts -> rf_switch; filters/diplexers (incl. CATV/MoCA LC diplexers) -> filter_saw_baw. Very short published descriptions are suffixed with the MACOM category name. SSPA category has no parametric table: 3 modules taken from its page text. Skipped: MACOM BAW page (custom filters only, no part list), limiting amplifiers, thru lines, terminations, PIN linearizers, PIN diode quad, comb generators, down/up-converters, receivers/transceivers, variable-gain and transimpedance amplifiers, CATV/FTTx amplifiers, true time delay, detectors, couplers,
    dividers, diodes, passives and optical. Not visited for scale: 8,806 product-detail pages in the sitemap (60 s crawl-delay).'
