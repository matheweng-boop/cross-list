  - https://www.minicircuits.com/WebStore/Amplifiers.html?subcategories=Dual%20Matched%20Amplifier
  - https://www.minicircuits.com/WebStore/Amplifiers.html?subcategories=RF%20Transistors
  - https://www.minicircuits.com/WebStore/Switches.html
  - https://www.minicircuits.com/WebStore/PhaseShifters.html
  - https://www.minicircuits.com/WebStore/Limiters.html
  - https://www.minicircuits.com/WebStore/Oscillators.html
  - https://www.minicircuits.com/WebStore/Synthesizers.html
  - https://www.minicircuits.com/WebStore/Mixers.html
  - https://www.minicircuits.com/WebStore/Multipliers.html
  - https://www.minicircuits.com/WebStore/RF-Filters.html
  - https://www.minicircuits.com/WebStore/dashboard.html?model=<MPN> (103 attenuator pages, DAT-/ZX76-/EVA-/RVA-/ZX73-/ZVVA-/ZFAT-
    models from sitemap.xml)
  collected: '2026-10-20'
  method: robots.txt read first, then sitemap.xml. Parametric tables parsed from public category pages (one GET each). Amplifier
    sub-lists from the subcategory links published on Amplifiers.html. Active attenuators read from individual dashboard.html?model=
    pages, with the page title as the published description. curl with a browser User-Agent; one request at a time, at least
    2.5 s apart; no log-in, forms or POST.
  requests: 127
  notes: 'robots.txt disallows /WebStore/modelSearch.html and ''?subcategories=G*'' (so the ''Gain Block'' amplifier list
    was not fetched) and ''?conn_1=''; none were requested. blog.minicircuits.com not used. Mini-Circuits publishes no lifecycle
    field: status ''Active'' means the part is on a current catalog listing (or, for attenuators, its page shows no non-catalog
    notice); ''Non-catalog model'' is the wording on the part page (''This is a non-catalog model''); those legacy titles
    state no frequency, so it is omitted. Amplifier function: Mini-Circuits ''Low Noise Amplifiers (NF < 3 dB)'' list -> lna,
    ''High Power Amplifiers (>2W)'' list -> power_amplifier (pout = Psat if listed, else P1dB). All other amplifiers (gain-block
    list blocked by robots; linear, CATV, dual matched, pulse and unlisted) were mapped by rule: typ. P1dB (else Psat) >=
    27 dBm -> rf_predriver with pout, else rf_gain_block. Descriptions of table-sourced parts are built from the published
    table columns and section headings; the listings carry no free-text description. Limits: Mixers.html serves only its first
    30 rows, and the rest load via POST (not used), so most mixers are missing. RF-Filters.html serves only the band-pass
    table; low/high-pass, band-stop and diplexers are behind a POST form (not used). Attenuators.html rows are POST lazy-loaded,
    so only DSA/VVA families found in the sitemap were read; fixed attenuators were skipped as passives. Synthesizers.html
    listed 1 model; VCOs from Oscillators.html are mapped to rf_synthesizer. ''Connectorized'' is stated from the listing''s
    connector column (amplifiers) or section heading (switches, limiters, phase shifters), and for other parts from Mini-Circuits''
    Z-prefix coaxial naming (every Z-prefixed amplifier in the listing has a connector); some non-Z filters or mixers may
    also be connectorized. One request got a connection reset (ZX73-123+); it was retried once after 60 s and succeeded. No
    403/429/captcha was seen. Skipped: variable gain amplifier (no matching BizDev function): 20; RF transistor (not an amplifier
    IC/module): 17; test/instrument system (Mechanical Switches): 60; test/instrument system (TTL Solid State Switches): 21;
    dashboard page returned an empty 82-byte stub (likely retired model); not retried: 6; programmable attenuator instrument
    (test equipment): 1; attenuator accessory or fixed attenuator (control cable / passive): 4.'
