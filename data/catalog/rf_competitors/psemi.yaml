source:
  vendor: pSemi
  pages: ['https://psemi.com/products-sitemap.xml', 'https://psemi.com/products/rf-switches/rf-switches-all/', 'https://psemi.com/products/rf-switches/broadband-rf-switches/', 'https://psemi.com/products/rf-attenuators/75%cf%89-wired-broadband-rf-digital-step-attenuators/', 'https://psemi.com/products/rf-attenuators/general-purpose-rf-digital-step-attenuators/', 'https://psemi.com/products/rf-attenuators/glitchless-rf-digital-step-attenuators/', 'https://psemi.com/products/rf-mixers-limiters/mixers/', 'https://psemi.com/products/rf-mixers-limiters/power-limiters/', 'https://psemi.com/products/rf-phase-amplitude-control/monolithic-phase-amplitude-controllers-mpacs/', 'https://psemi.com/products/rf-phase-amplitude-control/phase-shifters/', 'https://psemi.com/products/front-end-modules/', 'https://psemi.com/products/front-end-modules/2-4-ghz-iot-fems/', 'https://psemi.com/products/integrated-products/switch-lna/']
  collected: 2026-10-20
  method: robots.txt checked (allows all; Crawl-delay 10 honored, ~10.5 s between requests). Parametric TablePress tables on the public product-family listing pages (GET), plus each product page (from the tables and products-sitemap.xml) for the published 'Lifecycle' label and title. curl with browser User-Agent, sequential requests.
  requests: 118
  notes: 'All pages returned 200, no blocking. Lifecycle values as published (''In Production'', ''Last Time Buy'', ''Pre Release''); omitted where the product page shows none. Frequencies: ''DC'' recorded as 0 GHz; kHz/MHz converted to GHz. Switch descriptions keep pSemi''s ''(A)'' absorptive / ''(R)'' reflective tags. FEMs (PA+LNA+switch) mapped to power_amplifier: PE562212 pout is the tabled P1dB; PE565211/PE561221 pout is the published linear Pout at the stated EVM (not Psat/P1dB); PE566212/PE566213 publish no output power. PE53231 switch-LNA module mapped to lna. MPAC-Doherty phase/amplitude controllers and the phase shifter + DSA mapped to rf_phase_shifter. PE188100 (8-channel 24.25-27.5 GHz beamforming front end) mapped to beamformer_ic. PE4140/PE4141 are quad MOSFET mixer cores listed under Mixers. Skipped (not BizDev functions): power management, GaN FET drivers, digital tunable capacitors (DTCs), prescaler PE35400. pSemi publishes no LNAs/gain blocks/PAs standalone, no synthesizers
    or filters in these listings.'
