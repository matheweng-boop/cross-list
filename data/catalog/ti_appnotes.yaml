# TI (ti.com) application notes, white papers and application briefs relevant to Skyworks/Qorvo product areas.
# Competitor reference material for the Cross List app (Skyworks is the reference manufacturer; Skyworks + Qorvo combined).
# Source of the list: the "Top documentation" tables and per-subsystem techDocs embedded in public ti.com/solution/<app>
# pages, and the technical-documentation tables of public ti.com/product/<part> pages (fetched Oct 2026, <=1 req/s).
# Titles, types and dates are as TI lists them; summaries are ours (from title, TOC and, where opened, the PDF).
#
# Fields:
#   doc        TI literature number incl. revision letter as listed (url uses the revision-less number; TI redirects to latest)
#   area       one of: digital_isolators, isolated_gate_drivers, isolated_amplifiers_current_sensing,
#              isolated_dcdc_bias_power, clocks_timing, pmic_dcdc, motor_drivers, rf_switches_antenna_tuning, lna,
#              rf_front_ends, audio, broadcast_radio, automotive, industrial, infrastructure
#              (rf_switches_antenna_tuning and lna have no dedicated entries: TI publishes no such notes; the relevant
#               notes are filed under rf_front_ends with lna / rf_switch / antenna_switch function ids)
#   skyworks_qorvo_functions  Cross List function ids the note informs (see data/blocks/research/ti_block_diagrams.md for new ids)
#   block_diagram.present  true = system/application block diagram found (where = figure/page); false = PDF opened, none found;
#                          null = PDF not opened (we did not download every PDF on purpose)
#   found_on   which ti.com solution page (#subsystem) or product page lists the document

