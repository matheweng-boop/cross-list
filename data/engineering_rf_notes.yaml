- id: phys_resonance_q
  title: Resonance and Q factor - why some filters are sharper than others
  category: physics
  from: BizDev (textbook physics)
  summary: Anything that can store energy in two forms and swap it back and forth has a natural frequency at which it
    rings - a swing, a guitar string, a coil with a capacitor, a vibrating crystal. At that resonance a small push builds a
    big response. The quality factor Q says how little energy is lost each cycle; a high-Q resonator rings for a long time
    and responds only to a narrow band of frequencies. Every RF filter, oscillator and clock is built from resonators, so Q
    decides how close a filter can cut next to the wanted band and how clean an oscillator is.
  equations:
  - f0 = 1 / (2 pi sqrt(L C))
  - Q = f0 / bandwidth(3 dB) = 2 pi x energy stored / energy lost per cycle
  - Filter insertion loss rises roughly as 1 / Q of its resonators
  why:
  - kind: robust
    text: High-Q resonators let a filter reject a neighbouring band only a few MHz away (e.g. Band 41 next to Wi-Fi), so the
      radio keeps working when both are on.
  - kind: cost
    text: Lower filter loss means the PA needs less output power for the same antenna power - longer battery life and less
      heat.
  - kind: design
    text: Chip inductors reach a Q of about 30-80 at GHz, ceramic resonators a few hundred, acoustic (SAW/BAW) resonators
      1,000 or more, quartz 10,000 or more. The technology choice follows from the Q needed.
