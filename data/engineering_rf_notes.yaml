- id: phys_isolation_coupling
  title: Crossing an isolation barrier - capacitive and magnetic coupling, and CMTI
  category: physics
  from: BizDev (textbook physics)
  summary: An isolator passes a signal between two circuits that share no wire and may sit hundreds of volts apart. Two
    physical routes exist. Capacitive coupling sends the signal through a thin insulating layer (silicon dioxide) as a
    changing electric field - current flows only while the voltage changes. Magnetic (transformer) coupling sends it as a
    changing magnetic field between two coils. Both are blind to a steady voltage difference, which is the point. The same
    physics also lets a fast common-mode jump of the whole floating side (dV/dt from a switching SiC or GaN transistor) push
    current through the barrier; CMTI is how fast that jump can be before the output glitches.
  equations:
  - 'Capacitor current: i = C dV/dt;  C = eps0 eps_r A / d'
  - "Faraday's law (transformer): v = M di/dt"
  - 'Common-mode current through the barrier: i_cm = C_barrier x dV/dt (e.g. 1 pF x 100 V/ns = 100 mA)'
  why:
  - kind: robust
    text: High CMTI means no false switching or corrupted data next to a fast SiC switch - no shoot-through, no false
      faults.
  - kind: cost
    text: With enough CMTI the customer keeps fast switching edges, which cuts switching loss and heatsink size.
  - kind: design
    text: Capacitive (oxide) barriers are small and fast with long life; transformer barriers can also carry power. The
      application decides.
  families: [digital_isolators, isolators_dcdc, gate_drivers, isolated_analog]
  parts:
  - {label: Skyworks digital isolators (Si86xx), q: Si86}
  - {label: Skyworks isolated gate drivers (Si827x), q: Si827}
  - {label: Skyworks isolated analog (Si89xx), q: Si89}
