- id: phys_dielectric_breakdown
  title: Dielectric breakdown, working voltage and lifetime of an insulation barrier
  category: physics
  from: BizDev (textbook physics)
  summary: An insulator holds back voltage until the electric field inside it - volts per metre of thickness - pulls
    electrons loose and a conducting path forms. Silicon dioxide withstands several hundred volts per micrometre, which is why
    a barrier only tens of micrometres thick can hold thousands of volts for a minute. Over years, a lower continuous
    voltage can still wear the insulator through tiny partial discharges and slow damage, so isolators carry two kinds of
    rating - a short withstand test (kV rms for 60 s) and a lifetime working voltage (VIORM). Reinforced isolation means
    one barrier is good enough to protect a person on its own.
  equations:
  - 'Electric field E = V / d'
  - 'Withstand: barrier thickness >= V / E_breakdown, plus a safety margin'
  - 'Lifetime models: time to failure falls steeply (exponentially) with field strength'
  why:
  - kind: robust
    text: A barrier rated for the real working voltage over 20+ years keeps the product safe for its whole life, not only in
      the factory test.
  - kind: cost
    text: Reinforced isolation in one package avoids a second barrier (two isolators or an extra transformer).
  - kind: design
    text: The withstand rating is a test, not an operating point - size the part on VIORM and the end-product standard.
  families: [digital_isolators, isolators_dcdc, gate_drivers, isolated_analog]
