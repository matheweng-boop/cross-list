- id: phys_piezo_acoustic
  title: Piezoelectricity and acoustic resonators - how SAW and BAW filters work
  category: physics
  from: BizDev (textbook physics)
  summary: Some crystals (quartz, lithium tantalate, aluminium nitride) bend when a voltage is applied and produce a voltage
    when bent - the piezoelectric effect. A thin piece of such a material between electrodes vibrates mechanically at a
    frequency set by its size and the speed of sound in it. Sound travels about 100,000 times slower than radio waves, so a
    resonator for 2 GHz is only micrometres in size. SAW filters send a wave along the surface between comb-shaped
    electrodes (good up to about 2.5-3 GHz); BAW filters let the wave bounce through the thickness of a thin film (good to
    about 7 GHz and for steep, temperature-stable edges). Each resonator has two nearby frequencies - series resonance
    (low impedance) and parallel resonance (high impedance); their spacing, set by the material's coupling factor k2,
    limits how wide a filter can be.
  equations:
  - 'BAW: f = v / (2 t)   (t = film thickness, v = acoustic velocity, about 11,000 m/s in AlN)'
  - 'SAW: f = v / lambda = v / (electrode period)   (v about 3,000-4,000 m/s)'
  - 'Coupling: k2eff ~ (pi^2 / 4) x (fp - fs) / fp; maximum filter bandwidth grows with k2eff'
  why:
  - kind: bom
    text: Acoustic filters are tiny and are stacked into duplexers and multiplexers inside one module, which removes discrete
      filters from the customer's board.
  - kind: robust
    text: Temperature-compensated SAW and BAW drift only a few ppm per degree, so the band edge stays put from -40 to +85 C
      and the guard band to the neighbour can be narrow.
  - kind: design
    text: Coupling (k2) sets the widest band a filter can pass, Q sets the loss and edge steepness. Wide 5G bands (n77, n79)
      need high-coupling materials such as scandium-doped AlN.
  families: [filters, timing, uwb]
  parts:
  - {label: Qorvo SAW / BAW filters (QPQ), q: QPQ}
  notes: [acoustic_filters_duplexers]
  visuals: [bvd, filter]
