- id: phys_antennas_wavelength
  title: Antennas, wavelength and path loss
  category: physics
  from: BizDev (textbook physics)
  summary: An antenna turns current on a wire into a radio wave and back. It works best when it is about half a wavelength
    long, and the wavelength shrinks as the frequency rises (12.5 cm at 2.4 GHz, 1 cm at 28 GHz). That is why mmWave phones
    carry several tiny antenna arrays, while an AM radio uses a small coil on a ferrite rod far shorter than its 300 m
    wavelength. Between two antennas the signal spreads out over a growing sphere, so it drops by 6 dB every time the
    distance doubles - and more at higher frequency for antennas of the same gain.
  equations:
  - lambda = c / f   (c = 3 x 10^8 m/s)
  - Half-wave dipole length ~ lambda / 2
  - 'Free-space path loss FSPL (dB) = 20 log10(4 pi d / lambda)'
  why:
  - kind: design
    text: The band decides the antenna size and how many antennas fit; that drives the front-end architecture (switches,
      tuners, beamformers).
  - kind: robust
    text: A small antenna is detuned easily by a hand or the car body; antenna tuners keep it matched, so the link holds.
  - kind: cost
    text: Each 6 dB saved in the link budget (better LNA, lower loss) doubles the range or halves the number of base stations
      needed.
    est: true
