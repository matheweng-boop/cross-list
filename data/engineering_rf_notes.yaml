- id: phys_matching_vswr
  title: Impedance matching, reflections, VSWR and the Smith chart
  category: physics
  from: BizDev (textbook physics)
  summary: A radio wave travelling down a cable or a board trace sees a characteristic impedance, usually 50 ohm. If the
    load at the end (an antenna, a filter, an amplifier input) has a different impedance, part of the wave bounces back.
    The forward and reflected waves add into a standing wave, whose peak-to-valley ratio is the VSWR. Matching networks of
    inductors and capacitors transform the load to 50 ohm; the Smith chart is the engineer's map for picking them - every
    point is an impedance, and adding a series or shunt part moves the point along a circle.
  equations:
  - 'Reflection coefficient Gamma = (ZL - Z0) / (ZL + Z0)'
  - VSWR = (1 + |Gamma|) / (1 - |Gamma|)
  - Return loss = -20 log10 |Gamma|;  mismatch loss = -10 log10(1 - |Gamma|^2)
  why:
  - kind: cost
    text: 'A VSWR of 2:1 reflects 11 % of the power (0.5 dB) - power the PA must make and the battery must supply.'
  - kind: robust
    text: Parts specified for rugged operation (e.g. 10:1 VSWR) survive a broken or detuned antenna without damage.
  - kind: bom
    text: Antenna tuners and well-matched modules remove external matching parts and the board re-spins to tune them.
    est: true
  families: [rf_switches, front_ends, uwb]
