- id: phys_timing_resonators
  title: Timing resonators - quartz crystal, MEMS and BAW references
  category: physics
  from: BizDev (textbook physics)
  summary: Every clock starts with a resonator. A quartz crystal is a thin slice that vibrates through its thickness; its
    frequency is set by the thickness and is very stable because quartz is piezoelectric with very low loss (Q of 10,000 to
    over 1,000,000). An AT-cut crystal's frequency changes with temperature along an S-shaped curve of a few tens of ppm.
    MEMS oscillators use a tiny silicon resonator with electronic temperature compensation. BAW resonators vibrate at GHz
    directly, so the oscillator needs less frequency multiplication. Higher Q and less multiplication both mean lower phase
    noise.
  equations:
  - 'AT-cut quartz: f (MHz) ~ 1.66 / t (mm)   (fundamental mode)'
  - 'Stability: delta_f / f in ppm; 1 ppm at 100 MHz = 100 Hz'
  - 'Multiplying a clock by N raises its phase noise by 20 log10(N) dB'
  why:
  - kind: bom
    text: A programmable oscillator or a clock generator with integrated reference replaces several fixed crystals and their
      load capacitors.
  - kind: robust
    text: Better stability over temperature and ageing keeps networks in sync (5G, SyncE, IEEE 1588) through the product's
      life.
  - kind: cost
    text: Any-frequency oscillators shorten lead times - one part number covers many frequencies, so the customer stocks
      fewer.
    est: true
  families: [timing, filters]
