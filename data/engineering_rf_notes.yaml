- id: phys_linearity
  title: Linearity - why strong signals create new, unwanted frequencies
  category: physics
  from: BizDev (textbook physics)
  summary: A perfect amplifier would multiply the input by a constant. Real transistors bend the curve a little at large
    signals, and that bending can be written as extra squared and cubed terms. When two signals pass through, the cubed term
    makes new tones at 2f1 - f2 and 2f2 - f1, right next to the wanted ones, where no filter can remove them. These
    products grow three times faster (in dB) than the signal, so a little more drive makes them much worse. IP3 is the
    level where the two lines would meet; the higher it is, the more strong signals the part tolerates.
  equations:
  - y = a1 x + a2 x^2 + a3 x^3 + ...
  - Third-order products at 2 f1 - f2 and 2 f2 - f1; they rise 3 dB per 1 dB of input
  - OIP3 = Pout + (Pout - PIM3) / 2   (dBm, per tone)
  why:
  - kind: robust
    text: High IP3 keeps a receiver working next to a strong transmitter (a cell tower, the phone's own Wi-Fi), so the
      customer sees fewer blocked or dropped links.
  - kind: cost
    text: A more linear PA can run closer to its maximum power before predistortion is needed, which saves DC power and
      heat.
  - kind: design
    text: Switches and filters have IP3 too - in a carrier-aggregation phone their intermodulation can land in a receive
      band, so switch linearity is a selling point.
  families: [front_ends, rf_switches, filters]
  parts:
  - {label: Qorvo PAs (QPA), q: QPA}
  - {label: Skyworks switches (SKY13xxx), q: SKY13}
