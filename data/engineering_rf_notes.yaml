- id: phys_semiconductors
  title: Semiconductor physics - GaN, GaAs, SiGe and SOI compared
  category: physics
  from: BizDev (textbook physics)
  summary: In a semiconductor, electrons need a certain energy (the band gap) to break free and conduct. A wider band gap
    means the material withstands a stronger electric field before it breaks down, so it can work at higher voltage and
    power and higher temperature. How fast electrons move (mobility and saturation velocity) decides how high in frequency
    a transistor works. GaN combines a wide gap with fast electrons - high power at high frequency. GaAs has very fast
    electrons and suits low-noise and handset PAs. SiGe adds speed to cheap silicon and integrates with digital logic. SOI
    puts silicon on an insulating layer, which makes stacked, low-loss switches possible.
  equations:
  - 'Band gap (eV): Si 1.12, GaAs 1.42, SiC 3.2, GaN 3.4'
  - 'Critical field (MV/cm, approx.): Si 0.3, GaAs 0.4, SiC 2.5-3, GaN 3.3'
  - 'Drift velocity v = mu E (low field); max power ~ breakdown voltage x max current'
  - 'Johnson limit: fT x breakdown voltage is roughly constant for a material'
  why:
  - kind: cost
    text: GaN delivers the same RF power from a smaller die at higher voltage - fewer devices to combine in base stations
      and radar.
  - kind: robust
    text: Wide-gap devices tolerate higher junction temperatures and mismatch, so they survive harsh antenna conditions.
  - kind: design
    text: The process explains the part - a GaAs LNA for lowest noise, SOI for switches and tuners, SiGe for integrated
      front ends, GaN for high power.
  families: [front_ends, rf_switches, power_motor]
  parts:
