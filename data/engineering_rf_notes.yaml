- id: phys_switch_loss_isolation
  title: RF switches - insertion loss, isolation and power handling from Ron and Coff
  category: physics
  from: BizDev (textbook physics)
  summary: A semiconductor RF switch is a transistor used as a valve. When on, it behaves like a small resistor (Ron), which
    costs a little signal - the insertion loss. When off, it behaves like a small capacitor (Coff), which still leaks some
    signal across - limited isolation, and the leak grows with frequency because a capacitor passes high frequencies more
    easily. Making the transistor bigger lowers Ron but raises Coff, so the product Ron x Coff is the technology's figure of
    merit. To handle high power, several transistors are stacked in series so each sees only part of the RF voltage
    (silicon-on-insulator makes this easy).
  equations:
  - 'Insertion loss ~ 20 log10(1 + Ron / (2 Z0))   (Z0 = 50 ohm)'
  - Off-state reactance Xoff = 1 / (2 pi f Coff); isolation falls about 6 dB per doubling of frequency
  - 'Peak RF voltage on 50 ohm: Vpk = sqrt(2 P Z0); 1 W gives 10 V, 10 W about 32 V'
  - 'Figure of merit: Ron x Coff (fs); cut-off frequency fc = 1 / (2 pi Ron Coff)'
  why:
  - kind: cost
    text: Every 0.1 dB of switch loss in the transmit path is PA power turned into heat; low-loss switches save battery and
      let the customer use a smaller PA.
  - kind: robust
    text: Enough stacked transistors stop the switch from compressing or breaking under antenna mismatch, when the RF
      voltage can double.
  - kind: bom
    text: High-isolation switches can replace a second filter or a separate antenna path in multi-radio designs.
    est: true
  families: [rf_switches, front_ends]
  parts:
  - {label: Skyworks switches (SKY13xxx), q: SKY13}
  notes: [rf_switches, txrx_isolation_options]
  visuals: [vswr]
  key_points: []
