- id: phys_lc_energy
  title: Energy in inductors and capacitors - the heart of every power converter
  category: physics
  from: BizDev (textbook physics)
  summary: A capacitor stores energy in an electric field, an inductor in a magnetic field. A switching power supply moves
    energy in small packets, many thousands of times per second - charge the inductor, then release it into the output
    capacitor. The faster it switches, the smaller each packet, so the inductor and capacitor can be smaller. The voltage
    across an inductor and the current into a capacitor can only change gradually, which is what smooths the output (and
    what causes the ripple).
  equations:
  - 'Capacitor energy E = 1/2 C V^2;  inductor energy E = 1/2 L I^2'
  - 'Inductor ripple (buck): delta_I = V_out (1 - D) / (L f_sw)'
  - 'Capacitor ripple: delta_V ~ delta_I / (8 C f_sw)'
  why:
  - kind: bom
    text: Higher switching frequency shrinks the inductor and capacitors - a smaller, cheaper board.
  - kind: cost
    text: The trade-off is switching loss (next topic); the best design is where the two meet.
  - kind: robust
    text: Saturating an inductor (too much current for its size) lets the current spike; sizing on peak current protects
      the switches.
  families: [power_motor, gate_drivers]
  parts:
  - {label: Qorvo PMICs (ACT8xxxx), q: ACT8}
  - {label: Qorvo motor controllers (PAC5xxx), q: PAC5}
