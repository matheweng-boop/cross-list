- id: phys_creepage_clearance
  title: Creepage and clearance - distance through air and along the surface
  category: physics
  from: BizDev (textbook physics)
  summary: Two conductors at different voltages can fail in two ways outside the chip. Through the air, a spark jumps when the
    field exceeds air's breakdown strength (about 3 kV per mm in a uniform field at sea level, less at altitude) - the
    minimum air gap is the clearance, set by peak and surge voltages. Along a surface, moisture and dirt slowly form a
    conductive track at the steady working voltage - the minimum surface path is the creepage, set by the rms working
    voltage, the pollution degree and the material's tracking resistance (CTI).
  equations:
  - 'Clearance: gap >= V_peak / E_air (about 3 kV/mm uniform field, plus margin and altitude correction)'
  - 'Creepage: from the IEC 60664-1 table (working voltage, pollution degree, material group); x2 for reinforced'
  why:
  - kind: bom
    text: A wide-body package with enough creepage on its own saves board slots, potting or coating.
  - kind: cost
    text: Mould compound with CTI >= 600 (material group I) halves the creepage needed, keeping the package small.
  - kind: robust
    text: Enough creepage prevents slow surface tracking in damp, dirty environments over the product's life.
  families: [digital_isolators, isolators_dcdc, gate_drivers, isolated_analog]
  parts:
