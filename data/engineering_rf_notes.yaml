- id: phys_noise_gain
  title: Gain and noise - thermal noise, noise figure and the first amplifier
  category: physics
  from: BizDev (textbook physics)
  summary: Every resistor and every transistor adds random noise because its electrons jiggle with heat. At room temperature
    this sets a floor of -174 dBm in each hertz of bandwidth that no receiver can get below. An amplifier raises signal and
    noise alike and adds a little noise of its own; the noise figure (NF) says how much the signal-to-noise ratio gets worse
    on the way through. Because later stages are divided by the gain in front of them, the first amplifier (the LNA)
    decides almost all of the receiver's noise.
  equations:
  - Noise power N = k T B   (k = 1.38e-23 J/K; -174 dBm/Hz at 290 K)
  - F = SNRin / SNRout;  NF = 10 log10(F)
  - 'Friis: F_total = F1 + (F2 - 1) / G1 + (F3 - 1) / (G1 G2) + ...'
  why:
  - kind: robust
    text: Each dB of noise figure saved is about 1 dB of extra link margin - longer range, fewer dropped calls, faster GNSS
      fix.
  - kind: cost
    text: A low-NF LNA can be cheaper than a bigger antenna or a higher-power transmitter at the other end.
  - kind: design
    text: Loss in front of the LNA (cables, switches, filters) adds to the noise figure dB for dB, which is why low-loss
      switches and filters matter.
  families: [front_ends, tuners, uwb]
  parts:
  - {label: Qorvo LNAs (QPL), q: QPL}
  - {label: Skyworks front ends and LNAs (SKY6xxxx), q: SKY6}
