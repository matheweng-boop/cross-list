- id: phys_switching_losses
  title: Switching and conduction losses - where the heat in a converter comes from
  category: physics
  from: BizDev (textbook physics)
  summary: A power transistor loses energy in two ways. While on, current through its small resistance heats it (conduction
    loss), independent of how often it switches. During each turn-on and turn-off, voltage and current overlap for a few
    nanoseconds and the transistor's own capacitance is charged and dumped (switching loss) - and this happens every cycle,
    so it grows with frequency. Fast edges cut switching loss, which is why SiC and GaN switch in a few nanoseconds - and why
    the gate driver must deliver high peak current and tolerate the resulting fast dV/dt (CMTI).
  equations:
  - 'Conduction: P_cond = I_rms^2 x R_on'
  - 'Switching (overlap): P_sw ~ 1/2 x V x I x (t_r + t_f) x f_sw'
  - 'Output capacitance: P_oss ~ 1/2 x C_oss x V^2 x f_sw'
  - 'Gate drive: P_gate = Q_g x V_g x f_sw'
  why:
  - kind: cost
    text: Lower switching loss means a smaller heatsink, fewer paralleled transistors or a higher switching frequency with
      smaller magnetics.
  - kind: robust
    text: Less heat means a cooler junction and longer life (each 10 C cooler roughly doubles many wear-out lifetimes).
    est: true
  - kind: design
    text: Faster edges need a gate driver with high peak current and high CMTI - the link between our power and isolation
      products.
  families: [gate_drivers, power_motor]
