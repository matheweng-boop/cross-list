- id: phys_pll
  title: Phase-locked loops - making many frequencies from one clean reference
  category: physics
  from: BizDev (textbook physics)
  summary: A PLL is a feedback loop that steers a voltage-controlled oscillator (VCO) until a divided-down copy of its output
    lines up in phase with a reference. The output is then exactly N times the reference, and N can be changed to tune.
    Inside the loop bandwidth the output follows the reference (multiplied up), outside it follows the free-running VCO.
    The loop bandwidth is therefore a trade-off - wide enough to clean up the VCO, narrow enough to filter the reference.
    Jitter attenuators use a very narrow loop to clean a noisy recovered clock.
  equations:
  - f_out = N x f_ref   (fractional-N allows non-integer N)
  - 'In-band phase noise ~ reference noise + 20 log10(N)'
  - Outside the loop bandwidth, VCO phase noise falls about 20 dB per decade
  why:
  - kind: bom
    text: One clock IC with several PLLs generates all the frequencies a board needs (CPU, SerDes, Ethernet), replacing a
      handful of oscillators.
  - kind: robust
    text: A narrow-loop jitter attenuator keeps the system clean when the incoming network clock is noisy or switches over.
  - kind: design
    text: Loop bandwidth, N and the reference quality decide the jitter; ask the customer for the integration band and the
      data rate first.
  families: [timing, front_ends, tuners]
  parts:
  - {label: Skyworks clocks and jitter attenuators (Si53xx), q: Si53}
