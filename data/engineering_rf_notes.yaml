- id: phys_am_fm
  title: AM and FM modulation - how broadcast radio carries sound
  category: physics
  from: BizDev (textbook physics)
  summary: A radio carrier is a steady sine wave; modulation writes the sound onto it. AM varies the carrier's strength
    (amplitude) with the sound; it needs little bandwidth and simple receivers, but any noise or interference that changes
    the amplitude is heard. FM varies the carrier's frequency instead; it needs much more bandwidth but the receiver can
    ignore amplitude noise, so FM sounds cleaner and the stronger of two stations wins cleanly (the capture effect).
    Digital radio (DAB, HD Radio, DRM) puts digital symbols onto many carriers, with the same physics underneath.
  equations:
  - 'AM: s(t) = A [1 + m cos(2 pi fm t)] cos(2 pi fc t); bandwidth = 2 fm'
  - 'AM sidebands carry m^2 / (2 + m^2) of the power (at most one third)'
  - 'FM: s(t) = A cos(2 pi fc t + beta sin(2 pi fm t)), beta = delta_f / fm'
  - "Carson's rule: FM bandwidth ~ 2 (delta_f + fm); broadcast FM 2 (75 + 15) = 180 kHz"
  why:
  - kind: robust
    text: Tuner sensitivity, selectivity and FM capture decide whether a car radio holds a station between cities and
      under power lines.
  - kind: bom
    text: Tuners that cover AM, FM and digital radio in one chip replace separate receivers per standard and region.
  - kind: design
    text: AM's long wavelength and weak signals need high-impedance antenna inputs and good noise figure; FM needs
      adjacent-channel rejection.
