- id: phys_phase_noise_jitter
  title: Phase noise and jitter - two views of an imperfect clock
  category: physics
  from: BizDev (textbook physics)
  summary: A perfect oscillator would tick at exactly the same interval forever. A real one wobbles a little in timing. Seen
    in time, the wobble is jitter (femtoseconds to picoseconds); seen in frequency, it is phase noise - a skirt of noise
    either side of the carrier, given in dBc per hertz at an offset. Integrating the phase noise over the offsets that
    matter gives the jitter. Jitter limits how fast and clean a data link, an ADC or a 5G radio can be; phase noise on a
    radio's LO also mixes strong neighbours into the wanted channel (reciprocal mixing).
  equations:
  - 'Integrated phase noise: sigma_phi (rad rms) = sqrt(2 x integral of 10^(L(f)/10) df)'
  - 'RMS jitter: sigma_t = sigma_phi / (2 pi f0)'
  - 'Jitter-limited ADC SNR = -20 log10(2 pi f_in sigma_t)'
  - EVM floor (%) ~ 100 x sigma_phi (rad)
  why:
  - kind: robust
    text: Low-jitter clocks keep 56G/112G SerDes links, 5G radios and high-speed ADCs within their error budgets - fewer
      bit errors and retransmissions.
  - kind: cost
    text: A cleaner clock lets the customer use a slower, cheaper ADC or skip a separate jitter cleaner.
    est: true
  - kind: design
    text: Compare jitter only over the same integration band (e.g. 12 kHz-20 MHz); a number without its band is
      meaningless.
