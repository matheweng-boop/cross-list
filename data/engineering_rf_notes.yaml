- id: phys_mixing_superhet
  title: Mixing, frequency conversion and the superheterodyne radio
  category: physics
  from: BizDev (textbook physics)
  summary: Multiplying two sine waves produces two new ones - at the difference and at the sum of the two frequencies. A
    mixer does exactly that, so a receiver can shift any wanted station down to one fixed intermediate frequency (IF), where
    a single, very good filter and amplifier do the work. This is the superheterodyne principle, used in almost every radio
    since the 1930s. The catch is the image - a second input frequency, on the other side of the local oscillator, that
    lands on the same IF and must be filtered out before the mixer. Zero-IF and low-IF receivers move the work into
    digital I/Q processing instead.
  equations:
  - cos(a) x cos(b) = 1/2 [cos(a - b) + cos(a + b)]
  - f_IF = |f_RF - f_LO|
  - Image frequency f_image = f_LO +- f_IF, i.e. 2 x f_IF away from the wanted signal
  why:
  - kind: robust
    text: Good image rejection and a clean LO keep a strong station on the image or next channel from drowning the wanted
      one - fewer listener complaints in dense cities.
  - kind: bom
    text: Single-chip tuners that do the IF filtering digitally remove external IF filters (ceramic, SAW) and their
      tuning.
  - kind: design
    text: The choice of IF trades image rejection (high IF) against selectivity (low IF); dual-conversion and digital IF
      get both.
  families: [tuners, front_ends, timing]
  parts:
  - {label: Skyworks broadcast tuners (Si47xx), q: Si47}
  notes: [mixer_fundamentals, receiver_architectures, iq_imbalance, frequency_planning_pitfalls]
