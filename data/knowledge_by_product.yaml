# General knowledge by product (owner, 22 Oct 2026: "If I want to sell the product, I need all information on hand at
# a glance ... the primary question should always be 'why does it matter to the customer?'").
#
# why_it_matters: per specification guide key (app/services/engineering.py NOTES), the points a customer gains from
#   the spec. kind: cost | bom | robust | design. est: true marks a point BizDev reasoned out itself (not stated in the
#   guide or a source); the page shows it as "est".
# products: per product family, the guides, interactive visuals (app/services/library.py VISUALS), RF notes
#   (data/engineering_rf_notes.yaml ids) and systems library topics that belong to it. why_notes: RF notes whose own
#   "why it matters" points (data/engineering_rf_notes.yaml why) also go on the card, for families without spec guides. Technology reviews are found by
#   review_words in the review's title, family and application area, so new reviews appear without editing this file.

why_it_matters:
  cmti_kv_us:
    - kind: robust
      text: Enough CMTI margin at the real switch-node slew rate means no output glitches, corrupted data or false faults, and in gate drivers no risk of shoot-through.
    - kind: cost
      text: A part with too little CMTI forces slower edges (gate resistors, softer turn-on), which adds switching loss and heat. High CMTI lets the customer keep fast SiC or GaN edges.
    - kind: bom
      text: Fast edges with enough CMTI can mean a smaller heatsink or fewer paralleled power devices than a slowed-down design.
      est: true
    - kind: design
      text: Above the margin the application needs, a higher rating brings no functional gain. Sell the margin at the customer's dv/dt, not the bigger number.
  creepage_mm:
    - kind: robust
      text: Creepage protects against slow surface tracking at the steady working voltage, for the whole life of the product, including damp and dirty conditions (pollution degree).
    - kind: bom
      text: A wide-body (about 8 mm) or extra-wide (14.5–15 mm) package can meet reinforced creepage on its own. Without it the customer needs board slots, potting or a coating.
    - kind: cost
      text: Mould compound of material group I (CTI ≥ 600, all our isolator packages) halves the distance needed against group III at the same voltage, so the package stays smaller.
    - kind: cost
      text: Potting or a conformal coating to reach a lower pollution degree costs process time and rework; a package with enough creepage avoids that step.
      est: true
  cti:
    - kind: cost
      text: "CTI (comparative tracking index) sets the material group: group I (CTI ≥ 600) needs half the creepage of group III. At 800 V and PD2 that is 4 mm against 8 mm (basic)."
    - kind: design
      text: The FR4 board under the part is usually group IIIa, so the board needs the larger distance or a slot even when the package is group I.
  isolation_rating_kvrms:
    - kind: robust
      text: The one-minute withstand rating (UL 1577) shows how robust the barrier is against high-voltage tests and faults.
    - kind: cost
      text: A part below the test voltage the end-product standard requires cannot be used at all; a part above it passes the system's hipot test first time.
    - kind: design
      text: A higher rating than the standard asks for gives margin, not function. It does not raise the continuous working voltage.
  isolation_class:
    - kind: bom
      text: A reinforced isolator can be the only barrier between hazardous voltage and something a person can touch. A basic one needs a second insulation layer.
    - kind: cost
      text: One reinforced part instead of a basic part plus extra insulation (a second isolator, a transformer or more spacing) saves parts and assembly.
      est: true
    - kind: robust
      text: Reinforced parts are certified to stricter surge, test and lifetime requirements (IEC 60747-17).
  viorm_vpk:
    - kind: robust
      text: The working voltage (VIORM / VIOWM) is what the barrier may see for its rated lifetime. Margin here is lifetime margin on a 400 V or 800 V DC link.
    - kind: design
      text: If the continuous barrier stress exceeds it, the part is not qualified for that use, whatever its one-minute rating.
    - kind: cost
      text: One part family with an 800 V-class working voltage covers both 400 V and 800 V platforms, so the customer qualifies one part.
      est: true
  default_output:
    - kind: robust
      text: The right default state keeps power switches off and resets held while the controller side is unpowered, at power-up and brown-out.
    - kind: bom
      text: With the right default the customer needs no extra pull resistors or gating logic to force a safe state.
      est: true
    - kind: design
      text: The wrong variant looks like a pin-to-pin drop-in but is not. Check what each receiving circuit must see while the sending side is off.
  prop_delay_ns:
    - kind: design
      text: A shorter delay allows a faster SPI clock through the isolator and shortens control-loop and fault-reaction delays.
    - kind: robust
      text: For gate drivers the spread of the delay matters more than its size; a tight spread allows a shorter dead time.
    - kind: cost
      text: Faster isolated SPI can mean one isolated link serves several ADC channels instead of adding a second isolator.
      est: true
  pwd_ns:
    - kind: design
      text: Tighter pulse-width distortion and skew allow a shorter dead time in a half bridge, with less dead-time distortion and less diode conduction.
    - kind: cost
      text: Less diode conduction lowers loss a little; at 20 kHz going from 300 ns to 200 ns dead time is a timing gain of 0.2 % of the period, not a 0.2 % efficiency gain.
  uvlo_v:
    - kind: robust
      text: The UVLO threshold that suits the power device keeps a SiC MOSFET or IGBT from running on too little gate voltage (high on-resistance, overheating).
    - kind: design
      text: UVLO variants are not interchangeable. A higher threshold than intended can shut down a correctly supplied gate drive.
    - kind: bom
      text: A built-in UVLO matched to SiC removes the need for an external supply supervisor on the gate-drive rail.
      est: true
  peak_source_a:
    - kind: cost
      text: Enough peak current moves the gate charge quickly, so the power device switches fast with less switching loss and heat.
    - kind: bom
      text: A strong driver can drive large or paralleled devices directly, without an external booster buffer.
      est: true
    - kind: design
      text: A strong driver can be slowed with a gate resistor; a weak one cannot be made faster.
  integrated_power:
    - kind: bom
      text: Integrated isolated power removes the separate isolated supply (transformer, controller, rectifier) from the isolated side.
    - kind: cost
      text: Efficiency sets the heat. At 3 W, 70 % efficiency dissipates about 1.29 W and 85 % about 0.53 W.
    - kind: design
      text: The board around it is different (no isolated supply, other pins), so it defines the function; it is never a simple swap.
  certifications:
    - kind: cost
      text: Component certifications (UL 1577, VDE / IEC 60747-17, CSA, CQC) save end-product testing and open markets such as China.
    - kind: design
      text: A missing certification does not change how the part works, but can delay a launch or block a market.
  qualification:
    - kind: robust
      text: AEC-Q100 parts are qualified for automotive stress, temperature and production control; an industrial part cannot replace them.
    - kind: cost
      text: A qualified part avoids the customer's own extended qualification, which takes months.
      est: true
  data_rate_mbps:
    - kind: design
      text: Headroom between the signal and the part's maximum rate keeps edges clean and timing margins intact.
    - kind: cost
      text: A faster channel can carry several signals multiplexed, so fewer isolator channels are needed.
      est: true
  temp_range_c:
    - kind: robust
      text: A range that covers the hottest spot in the enclosure keeps the datasheet guarantees valid in the field.
    - kind: bom
      text: A wider range (e.g. to 125 °C) can let the part sit near hot power stages without extra cooling or spacing.
      est: true
  vdd_range_v:
    - kind: bom
      text: A wide supply range runs directly from the existing 3.3 V or 5 V rail, with no level shifter or extra regulator.
      est: true
  channel_config:
    - kind: bom
      text: The right number and direction of channels in one package replaces two smaller isolators, saving board area and placement cost.
      est: true
  emc_eft_cispr:
    - kind: cost
      text: Passing EFT and CISPR first time saves a re-spin and a second test-house slot. Knowing which setup details change the result keeps a "pass" from turning into a fail at the customer's own lab.
      est: true
    - kind: bom
      text: The right fix is often one part, not many. In Skyworks AN1131 a single 1000 pF Y capacitor near the transformer let a 2-layer Si88241 board pass CISPR 25 class 1 and 2 conducted limits.
    - kind: robust
      text: The isolator's CMTI (Si88x2x 40 kV/µs minimum) must hold against the slope that reaches the barrier in the burst test. A local return path keeps that slope, and the secondary rail droop, down.
      est: true
    - kind: design
      text: A Y capacitor adds mains-frequency leakage current and must be safety-rated; a common-mode choke only works if it covers every path. Choose the lever that fits the product's safety standard.
  deadtime:
    - kind: robust
      text: Dead time in the driver stops both switches of a half bridge conducting at once (shoot-through), even if the controller's PWM has a glitch, so the power stage survives a software or noise fault.
    - kind: bom
      text: When the controller cannot guarantee dead time itself (a simple analog PWM IC), a driver with a DT pin replaces the RC delay or logic the customer would otherwise add.
      est: true
    - kind: design
      text: Most motor-control timers already generate dead time; then the driver's version is a second line of defence, not a reason to reject a cross that lacks it.
  uwb_signal_path:
    - kind: robust
      text: A phase-linear, uncompressed front end lets the receiver find the weak first path, so the car key measures the true distance and a pre-echo cannot fake an early, too-short one (the relay-attack protection depends on it).
      est: true
    - kind: cost
      text: Flat group delay over channel and temperature means one antenna-delay calibration instead of per-channel or per-temperature tables, and fewer re-tests at certification.
      est: true
    - kind: bom
      text: An LNA with a bypass mode (QM14068) handles near keys without compression, so no extra attenuator or limiter is needed in front of the UWB chip.
      est: true
    - kind: design
      text: Ask for S-parameters early and check group delay and gain flatness inside the 499.2 MHz channel, not only insertion loss at the centre; filters near their skirts are the usual problem.
  error_budget:
    - kind: design
      text: A published error-budget method (AN1270) lets the customer state the measurement accuracy of the whole chain with numbers the safety and control engineers can check.
    - kind: cost
      text: An honest RSS budget instead of a straight worst-case sum can avoid an over-specified, more expensive part or an extra calibration step.
      est: true
    - kind: robust
      text: Timing budgets across the isolator (delay, distortion, skew) show the real SPI clock or dead-time margin, so the design does not fail only on some parts or at temperature extremes.
  gnss_how_it_works:
    - kind: design
      text: Knowing which bands each constellation uses and why dual-frequency removes the ionospheric error explains why customers move from L1-only to L1 + L5 front ends.
    - kind: robust
      text: The receiver can only be as good as the C/N0 the front end delivers; low NF and enough rejection against the car's own transmitters keep the fix in towns and under jamming.
      est: true
    - kind: cost
      text: Good geometry and dual-frequency corrections can replace an expensive survey antenna in many lane-level designs.
      est: true

