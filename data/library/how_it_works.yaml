  - id: currentsense
    title: "Isolated current sensing"
    link: "How isolated current sensing works"
    gist: "How an isolated amplifier or delta-sigma modulator measures shunt current across a barrier, and how offset, gain and nonlinearity add up (AN1270); our Skyworks parts."
    date: 2026-10-28
    subs: [isolated_analog, isolated_current_sensor]
    families: [isolated_amplifier, current_sensor]
    table_subs: []
    role: "Isolated amplifier / modulator"
    columns:
      - {label: "Input range", keys: ["param:input_range", "Specified Input Range"]}
      - {label: "Output", keys: ["Output Mode"]}
      - {label: "Offset (µV, max 25 °C)", keys: ["param:offset_uv"]}
      - {label: "Gain error (%, max 25 °C)", keys: ["param:gain_error_pct"]}
      - {label: "Bandwidth (kHz)", keys: ["param:bandwidth_khz"]}
      - {label: "CMTI (kV/µs)", keys: ["param:cmti_kv_us"]}
    parts: []
    exclude: []
    series:
      - {id: Si8921, label: "Si8921 isolated amplifier, current shunt, differential output", match: "^SI8921", sub: isolated_analog, q: Si8921, role: "Isolated amplifier (current)"}
      - {id: Si8922, label: "Si8922 isolated amplifier, current shunt, single-ended output", match: "^SI8922", sub: isolated_analog, q: Si8922, role: "Isolated amplifier (current)"}
      - {id: Si8941, label: "Si8941 delta-sigma modulator, current shunt, external clock", match: "^SI8941", sub: isolated_analog, q: Si8941, role: "Isolated modulator (current)"}
      - {id: Si8946-47, label: "Si8946 / Si8947 delta-sigma modulators, current shunt, internal clock", match: "^SI894[67]", sub: isolated_analog, q: Si894, role: "Isolated modulator (current)"}
      - {id: Si8931-32, label: "Si8931 / Si8932 isolated amplifiers, voltage", match: "^SI893[12]", sub: isolated_analog, q: Si893, role: "Isolated amplifier (voltage)"}
      - {id: Si8935-37, label: "Si8935 / 36 / 37 delta-sigma modulators, voltage", match: "^SI893[5-7]", sub: isolated_analog, q: Si893, role: "Isolated modulator (voltage)"}
    what: >-
      An isolated current-sense part measures the small voltage across a shunt resistor that sits on a high-voltage
      rail (a motor phase, a battery line, a charger output) and hands the result to a controller on the safe,
      low-voltage side. It does three things: amplifies or digitises a signal of a few tens of millivolts very
      accurately, carries it across an isolation barrier, and survives the fast voltage jumps of the switching power
      stage. The isolated amplifier gives an analog output for the controller's ADC; the delta-sigma modulator gives a
      1-bit stream that the controller filters into a number.
    how:
      diagram: _currentsense_svg.html
      steps:
        - title: "1. Shunt: current becomes a small voltage"
          text: >-
            Current through a low-value resistor makes a voltage the part can read; the full current should fill the
            specified linear input range (for example 30 to 250 mV on the Si8922B). A smaller shunt wastes less power but
            uses less of the range, so offset matters more. The shunt's own tolerance and drift add to the gain error
            (est).
          cite: "AN1270 p. 6, Table 1"
        - title: "2. Input filter"
          text: >-
            The data sheet circuit puts 20 Ω in each input line and 10 nF across the inputs: a low-pass filter (corner
            about 400 kHz, est) that keeps switching spikes out of the input. Larger resistors would turn the input current
            into extra offset and gain error (est).
          cite: "AN1270 p. 2, Figure 1"
        - title: "3. Amplifier or modulator, across the barrier"
          text: >-
            The amplifier (Si8921 / 22) gives an analog output on the far side for the controller's ADC; the modulator
            (Si8941 / 46 / 47) sends a second-order delta-sigma bit stream that an MCU or FPGA filters, for example with a
            SINC3 filter. The high-voltage side needs its own 3 to 5.5 V supply, here taken from the floating gate-driver
            supply with a 5.6 V Zener.
          cite: "AN1270 p. 2-3, Figures 1-2"
        - title: "4. Offset: the error at zero"
          text: >-
            Offset is the input that gives zero output, given at 25 °C plus a drift per °C. AN1270 draws four lines (min
            and max offset, each with min and max drift) and takes the outer ones as the band: for the Si8922B ±0.35 mV
            at 25 °C becomes -0.545 to +0.650 mV over -40 to 125 °C, or -0.218 % to +0.260 % of the 250 mV full scale.
          cite: "AN1270 p. 7-9, Tables 2-3"
        - title: "5. Gain error: the error in slope"
          text: >-
            Gain error scales with the reading: ±0.2 % at 25 °C with a drift of -24 to 0 ppm/°C gives -0.440 % to
            +0.356 % over temperature.
          cite: "AN1270 p. 9-10, Table 4"
        - title: "6. Nonlinearity"
          text: >-
            The bend of the transfer curve away from a straight line: ±0.04 % at 25 °C, with ±16 ppm/°C drift, becomes
            ±0.200 % over temperature.
          cite: "AN1270 p. 11, Table 5"
        - title: "7. Adding the errors"
          text: >-
            Straight addition (worst case) gives -0.858 % to +0.816 %; root-sum-of-squares, valid when the errors are
            independent, gives -0.530 % to +0.484 %. AN1270 recommends RSS as the best estimate of total static error.
            The shunt's tolerance and the output ADC add on top. CMTI is not a static error: a too-fast switching edge
            can disturb the output briefly, so the controller samples away from the edges (est).
          cite: "AN1270 p. 12-13, Table 6"
    specs:
      - {name: "Specified linear input range", typical: "±62.5 mV (Si8921A) to 250 mV (Si8922B)", why: "Sets the shunt value and the power it burns; the errors are only specified inside it.", note: "/engineering/error_budget"}
      - {name: "Offset and offset drift", typical: "±0.35 mV max, -0.3 to 3 µV/°C (Si8922B)", why: "Dominates at small currents; converts to % of full scale.", note: "/engineering/error_budget"}
      - {name: "Gain error and drift", typical: "±0.2 % max, -24 to 0 ppm/°C (Si8922B)", why: "Dominates at large currents; scales with the reading.", note: "/engineering/error_budget"}
      - {name: "Nonlinearity", typical: "±0.04 % at 25 °C (Si8922B)", why: "Cannot be removed by a two-point calibration.", note: "/engineering/error_budget"}
      - {name: "Bandwidth", typical: "about 600 kHz (Si8921, typ)", why: "Over-current must be seen within a switching cycle; control loops need phase margin.", note: ""}
      - {name: "CMTI", typical: "50 kV/µs min (Si8921)", why: "Fast switch-node edges must not disturb the output.", note: "engineering:cmti_kv_us"}
      - {name: "Isolation", typical: "basic or reinforced", why: "Battery and inverter voltages up to 800 V need reinforced parts.", note: "engineering:isolation_class"}
      - {name: "AEC-Q grade", typical: "-A suffix parts AEC-Q100", why: "Required in EV chargers, inverters and battery systems.", note: "engineering:qualification"}
    choosing:
      - "Shunt or Hall: a shunt with an isolated amplifier is more accurate and drifts less; a Hall sensor with the conductor in the package needs no high-side supply and no shunt loss, but is less accurate without calibration (est)."
      - "Amplifier or modulator: analog output for an MCU ADC; a bit stream for an FPGA or MCU with a digital filter, more robust on a long trace, with resolution set by the filter (est)."
      - "Input range against the shunt: a higher range means a larger shunt and more power, a smaller range more relative offset."
      - "Error budget: offset matters at low current, gain at high current; a calibration at 25 °C removes most of the initial error, the drift remains."
      - "High-side supply: each sense point needs a floating 3-5.5 V supply (from the gate-driver bias or an isolated DC-DC)."
      - "Bandwidth and CMTI for fast over-current detection in SiC inverters."
    appnotes:
      - {text: "Static error has three parts: offset, gain error and nonlinearity; each is specified at 25 °C plus a drift, and the drift is multiplied by the distance from 25 °C (keep the sign: -40 °C is -65 °C away).", ref: AN1270, page: "6-8", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Four-line method: min and max offset each with min and max drift give the offset band over temperature; for the Si8922B -0.545 to +0.650 mV from -40 to 125 °C.", ref: AN1270, page: "7-9", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Convert offset to % of full scale (divide by the 250 mV range of the Si8922B) so it can be added to gain error and nonlinearity, which are % values.", ref: AN1270, page: 9, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Total static error of the Si8922B over -40 to 125 °C: straight sum -0.858 / +0.816 %, root-sum-of-squares -0.530 / +0.484 %; RSS is the realistic estimate when the error sources are uncorrelated.", ref: AN1270, page: 12, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Data sheet circuit: 20 Ω in each input and 10 nF across them; the high-side supply from the floating gate-driver supply through a resistor and a 5.6 V Zener, with 0.1 µF at each supply pin.", ref: AN1270, page: 2, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Single-ended-output parts (Si8922) cannot show negative currents: their linear range starts at 30 mV, so offset is tested at 30 mV in; differential-output parts are tested at 0 V.", ref: AN1270, page: 6, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
      - {text: "Modulator output: a second-order delta-sigma bit stream, clocked externally (Si8941) or internally (Si8946 / 47), filtered in the MCU or FPGA, typically with a SINC3 filter.", ref: AN1270, page: 3, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf"}
    see_also:
      - {label: "Engineering knowledge: error propagation and uncertainty bands", href: "/engineering/error_budget"}
      - {label: "Part knowledge: isolated gate drivers", href: "/reviews/how/gatedriver"}
    gaps:
      - "Si8540 (high-side DC current sensor) has no active status in our data."
      - "No Hall-effect current sensor and no Qorvo isolated amplifier in our catalogue."
      - "AN1270 covers static error only; noise, bandwidth and CMTI effects come from the data sheets and our reading (est)."
    used_in:
      - {label: "EV traction inverter", app: "EV traction inverter"}
      - {label: "Industrial servo drive", app: "Industrial servo drive"}
      - {label: "6.6 kW bidirectional on-board charger", app: "6.6 kW single-stage bidirectional on-board charger"}
      - {label: "Traction inverter isolation (ASIL-D)", topic: traction_asil_d}
    reviews: []
    sources:
      - {title: "AN1270: Estimating Total Static Error for Si89xx Isolated Amplifiers and Delta-Sigma Modulators", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1270-si89xx-estimating-total-static-error.pdf", kind: cached}
      - {title: "Si8921 / Si8922 data sheet (parameters in our part data, p. 8-10)", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si8921-22-datasheet.pdf", kind: ours}
      - {title: "Skyworks catalogue and BizDev parameters: isolated amplifiers and modulators", publisher: "BizDev", url: "/parts?sub=isolated_analog", kind: ours}

  - id: gnss
    title: "GNSS front-end parts: LNAs, filters and diplexers"
    link: "How GNSS front ends work"
    gist: "How a GNSS front end keeps a signal below the noise usable: pre-filter, LNA, post-filter, Friis noise, rejection of nearby transmitters; our parts."
    date: 2026-10-28
    subs: []
    families: []
    table_subs: []
    role: "GNSS front end"
    columns:
      - {label: "Band (MHz)", keys: ["Frequency (MHz)", "Center Frequency", "Centre Frequency 1"]}
      - {label: "Gain (dB)", keys: ["Gain (dB)"]}
      - {label: "NF (dB)", keys: ["NF (dB)"]}
      - {label: "IP1dB (dBm)", keys: ["IP1 dB (dBm)", "I P1 dB (dBm)"]}
      - {label: "Insertion loss (dB)", keys: ["Insertion Loss TYP (dB)", "Insertion Loss Typ 1"]}
    parts:
      - {mpn: SKY5A2110, role: "L1 + L5 LNA module (pre- and post-filters)", specs: {"Band (MHz)": "1559-1606 (L1) + 1164-1189 (L5)", "Gain (dB)": "18.8 typ (L1)", "NF (dB)": "1.2 typ, 1.7 max (L1, 25 °C)", "IP1dB (dBm)": "IIP3 -8 typ", "Insertion loss (dB)": "-"}}
      - {mpn: SKY55951-11, role: "L1 + L5 LNA module", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY55950-11, role: "L1 LNA module (pre- and post-filters)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65943-11, role: "L1 LNA module (pre- and post-filters)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65723-11, role: "L1 LNA module (pre-filter)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65723-81, role: "L1 LNA module (pre-filter)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65724-11, role: "L1 LNA module (pre-filter)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65725-11, role: "L1 LNA module (pre-filter, shielded)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65728-11, role: "L5 LNA module (pre-filter, shielded)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65730-13, role: "L5 / E5a LNA module", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: SKY65624-682LF, role: "L1 LNA (bare)", specs: {"Insertion loss (dB)": "-"}}
      - {mpn: QPQ1060, role: "L1 SAW filter", specs: {"Band (MHz)": "1559.92-1590.92", "Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-"}}
      - {mpn: QPQ1062, role: "L5 SAW filter", specs: {"Band (MHz)": "1160.95-1191.95", "Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-"}}
      - {mpn: QPQ1063, role: "L1 / L2 SAW diplexer", specs: {"Band (MHz)": "1575.42 / 1227.6", "Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-", "Insertion loss (dB)": "1.6 / 1.3"}}
      - {mpn: "880273", role: "L1 BAW filter", specs: {"Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-"}}
      - {mpn: "880094", role: "L1 BAW filter (wide band)", specs: {"Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-"}}
      - {mpn: "880060", role: "L2 filter (wide band)", specs: {"Gain (dB)": "-", "NF (dB)": "-", "IP1dB (dBm)": "-"}}
      - {mpn: TQM2M9016, role: "SDARS / GPS diplexer module (automotive)"}
      - {mpn: QPQ1028, role: "L1 / L2 SAW diplexer"}
    exclude: []
    series: []
    what: >-
      The GNSS signal arrives at about -130 dBm, below the thermal noise of the receiver's own bandwidth; the receiver
      digs it out by correlation. The front-end parts make sure there is still something to dig out. A band-pass
      pre-filter keeps strong nearby transmitters out, a low-noise amplifier (LNA) adds gain while adding as little
      noise as possible, and a post-filter cleans up before the cable or the receiver. Single-band modules cover L1 (GPS
      L1, Galileo E1, BeiDou B1, GLONASS G1); dual-band modules add L5 / E5a. Diplexers split or combine two bands on one
      line. In a car the module sits in the active antenna (shark fin) and is powered over the coax.
    how:
      diagram: _gnss_svg.html
      steps:
        - title: "Pre-filter → LNA → post-filter"
          text: >-
            The pre-filter blocks out-of-band power before it can overload the LNA; the LNA sets the noise figure of the
            whole receiver; the post-filter removes what the LNA let through or created (harmonics, intermodulation)
            before the cable and the receiver. SKY5A2110 puts all three, for L1 and L5, in one 2.2 x 2.7 mm module with a
            diplexed output.
          cite: "SKY5A2110 data sheet p. 1"
        - title: "Why the first stage decides the noise (Friis)"
          text: >-
            Total noise factor F = F1 + (F2 - 1)/G1 + (F3 - 1)/(G1 G2) + …: the first stage's noise counts in full, every
            later stage is divided by the gain before it. A lossy filter in front of the LNA adds its loss dB for dB to
            the noise figure; an LNA with 18 dB gain makes the cable and receiver behind it almost irrelevant.
          cite: "library topic gnss_frontend d3"
        - title: "Rejecting nearby transmitters"
          text: >-
            The car's own LTE / 5G uplink (+23 dBm and more), V2X at 5.9 GHz and Wi-Fi share the antenna fin, often with
            only 15-20 dB isolation. The front end must keep them below the receiver's immunity limit: required rejection
            = coupled power - immunity limit, usually one or two SAW filters; gain in the path reduces the effective
            rejection.
          cite: "u-blox ZED-X20P integration manual p. 83"
        - title: "Linearity: blockers, harmonics and intermodulation"
          text: >-
            A strong blocker can compress the LNA and collapse C/N0 on every band. A non-linear stage also makes
            harmonics: the second harmonic of LTE Band 13 / 14 uplink (777-798 MHz) lands on 1554-1596 MHz, right on L1,
            so a notch must stop the fundamental before the first active stage.
          cite: "u-blox p. 83; SKY5A2110 p. 5"
        - title: "Active antenna: DC over the coax (bias-T)"
          text: >-
            The receiver feeds DC to the antenna LNA through the same coax that carries RF back. An inductor (above
            500 Ω at 1-1.8 GHz) passes DC and blocks RF; a resistor or current limiter protects against a shorted cable
            and lets the receiver detect an open or shorted antenna.
          cite: "u-blox ZED-X20P integration manual p. 85-86"
        - title: "Gain and current budget"
          text: >-
            After cable, connector and filter losses, the net gain into the receiver must fall inside its window (17 to
            40 dB in the u-blox example): too little and the cable noise counts, too much and the receiver's own gain
            stage runs out of range. Active antennas draw 5-20 mA; SKY5A2110 takes about 5 mA per band at 1.8 V, with a
            low-current mode around 1.2 mA.
          cite: "u-blox p. 81, 86; SKY5A2110 p. 5-6"
    specs:
      - {name: "Noise figure (NF)", typical: "1.2-1.9 dB for our L1 modules (25 °C); max at temperature higher", why: "Sets C/N0 and so sensitivity, time to first fix and accuracy; check the max at the hot corner.", note: "rf:cascaded_noise_figure"}
      - {name: "Gain", typical: "16-19 dB per module", why: "Must overcome the cable and fit the receiver's gain window.", note: "rf:noise_figure_cascade"}
      - {name: "IIP3 / input P1dB", typical: "IIP3 about -8 dBm (SKY5A2110); IP1dB -13 to -19 dBm (modules)", why: "How much blocker power the LNA takes before it compresses or makes intermodulation.", note: "rf:linearity_p1db_ip3"}
      - {name: "Out-of-band rejection at named interferers", typical: "-42 to -79 dB by band (SKY5A2110, max to typ)", why: "Check each aggressor at the maximum line, not the typical.", note: "rf:filter_fundamentals"}
      - {name: "Filter insertion loss", typical: "1.2-2.35 dB (our SAW / BAW filters)", why: "Loss in front of the LNA adds directly to NF.", note: "rf:acoustic_filters_duplexers"}
      - {name: "Supply current", typical: "about 5 mA per band at 1.8 V (SKY5A2110)", why: "Comes over the coax; matters for battery and telematics budgets.", note: ""}
      - {name: "ESD", typical: "2 kV HBM, 1 kV CDM (SKY5A2110)", why: "The antenna port is exposed; the system usually adds protection.", note: ""}
      - {name: "AEC grade", typical: "SKY5A2110 AEC-Q104 Grade 2 (-40 to +105 °C)", why: "Roof modules get hot; Grade 2 is the usual minimum for the fin.", note: "engineering:qualification"}
    choosing:
      - "Single-band (L1) or dual-band (L1 + L5): dual-band removes most of the ionospheric error and helps in multipath, at the cost of a second path, more current and a diplexer."
      - "Module or bare LNA: compare cascaded NF including the filter a bare LNA still needs in front."
      - "Filter before the LNA: more rejection and linearity, but every 0.1 dB of loss adds to NF; a post-filter alone protects the cable and receiver but not the LNA."
      - "Rejection at the maximum, per aggressor in the same fin (LTE / 5G, V2X, Wi-Fi), and a B13 / B14 notch if those bands are used."
      - "Gain inside the receiver's window after cable loss; low-current mode for battery products."
      - "Grade and temperature: NF at +105 °C, not only at 25 °C."
    appnotes:
      - {text: "SKY5A2110 keeps 17-21 dB gain with a +15 dBm blocker at 600-960 MHz and a +10 dBm blocker at 1.7-8 GHz; absolute maximum RF input is +10 dBm.", ref: "SKY5A2110 data sheet", page: "3, 7", url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Data-Sheet/SKY5A2110_206174G.pdf"}
      - {text: "Design to the maximum rejection, not the typical: on L1 the 1710-1980 MHz band is -66.2 dB typical but -47 dB maximum, 2.4 GHz Wi-Fi -63.3 typical but -42 maximum.", ref: "SKY5A2110 data sheet", page: 5, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Data-Sheet/SKY5A2110_206174G.pdf"}
      - {text: "The Band 13 second harmonic at the output is -111.6 dBm typical, -104 dBm maximum at room temperature but up to -91 dBm at the automotive extreme: budget it hot.", ref: "SKY5A2110 data sheet", page: 5, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Data-Sheet/SKY5A2110_206174G.pdf"}
      - {text: "Required out-of-band rejection = maximum power coupled into the antenna input - receiver immunity limit; antenna isolation is 15-20 dB, down to 6-10 dB in very small modules; one or two SAW filters usually close the gap.", ref: "u-blox ZED-X20P integration manual", page: 83, url: "https://content.u-blox.com/sites/default/files/documents/ZED-X20P_IntegrationManual_UBXDOC-963802114-12901.pdf"}
      - {text: "If LTE Band 13 / 14 is near, add a 777-798 MHz notch before the external LNA so the second harmonic is not created in-band.", ref: "u-blox ZED-X20P integration manual", page: 83, url: "https://content.u-blox.com/sites/default/files/documents/ZED-X20P_IntegrationManual_UBXDOC-963802114-12901.pdf"}
      - {text: "Active antenna for an all-band receiver: 17-50 dB gain, out-of-band rejection 40 dB typical, in-band group-delay variation under 10 ns, 15 kV ESD (air).", ref: "u-blox ZED-X20P integration manual", page: 84, url: "https://content.u-blox.com/sites/default/files/documents/ZED-X20P_IntegrationManual_UBXDOC-963802114-12901.pdf"}
      - {text: "Bias-T: inductor above 500 Ω across 1-1.8 GHz, rated 300 mA or more; a 10 Ω current-limit resistor and a 60 mA short-circuit threshold, with a ferrite bead recommended.", ref: "u-blox ZED-X20P integration manual", page: "85-86", url: "https://content.u-blox.com/sites/default/files/documents/ZED-X20P_IntegrationManual_UBXDOC-963802114-12901.pdf"}
    see_also:
      - {label: "Engineering knowledge: GNSS, how positioning works", href: "/engineering/gnss_how_it_works"}
      - {label: "Interactive visuals: GNSS bands, pseudoranges, DOP, ionosphere", href: "/visuals#gnssbands"}
    gaps:
      - "No L2 / E6 or L-band LNA module of ours; no single-input all-band module."
      - "TQM2M9016 and QPQ1028 have no lifecycle status in our data, so they are left out of the table."
      - "Automotive grade is stated only for SKY5A2110 and TQM2M9016; the Qorvo GNSS filters have no grade in our catalogue."
      - "Several older Skyworks GNSS modules are last-time-buy or obsolete (left out)."
      - "No catalogued part for the NTN / L-band uplink next to L1 (1626.5-1660.5 MHz)."
    used_in:
