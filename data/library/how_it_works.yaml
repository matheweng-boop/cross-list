# Part knowledge › How it works: one page per product group (owner, 28 Oct 2026).
#
# Each group explains the PART, not the application (owner, 28 Oct 2026: "differentiate between how the part works and
# how the application works"). Applications are only linked under "Used in", to the Systems & applications pages that
# already exist. Shown at /reviews/how/<id> (Products › Part knowledge), linked from the browse page of the group's
# subfamilies, from the part pages of its parts and from its part reviews and library topics. To add a group, copy one
# entry and keep every key (docs/daily_update.md).
#
# STANDING RULE (owner, 28 Oct 2026): every Part knowledge group includes concrete design details from the application
# notes (layout, bypassing, creepage, shunt sizing, gate resistors, bootstrap sizing, error budgets, test conditions),
# each with its app-note number and page and a link: the "appnotes" block, 4-8 bullets. Use the app notes in the repo
# first (data/appnotes.jsonl, the /technical search, var/appnotes), then skyworksinc.com (polite), then third-party
# app notes (TI, ADI, Infineon) for general principles.
#
# Keys per group:
#   id, title, link (the short link text on other pages), gist (<= 25 words, the To confirm card), date
#   subs:       taxonomy subfamilies (data/taxonomy.yaml) whose browse page shows the card
#   families:   BizDev families whose part pages show the link (parts listed by name or series show it too)
#   table_subs: subfamilies whose active Skyworks / Qorvo parts fill the parts table, one row each
#   role:       role shown for those rows
#   columns:    parts-table columns: {label, keys: catalogue key_specs names or param:<BizDev parameter>, tried in
#               order}; package and automotive are always added
#   parts:      parts listed by hand (mpn, role, specs: {column label: value}); also used to override a row
#   exclude:    part numbers left out of the table, with the reason
#   series:     parts shown one row per series (many orderable variants): {id, label, match (regex on the part
#               number), sub (optional), q (browse search), role, note}; counts the active and automotive variants
#   what:       what the part does inside the system (one paragraph)
#   how:        {diagram (template include in reviews/how/), steps: [{title, text, cite (optional)}]}
#   specs:      key values: {name, typical, why, note: engineering:<key> | rf:<id> | /path | ""}
#   choosing:   key aspects and trade-offs when choosing between parts
#   appnotes:   from the application notes: [{text, ref (AN number or document), page, url}]
#   gaps:       what our data does not say yet (honest gaps)
#   used_in:    [{label, app: application name (start of it) | topic: library topic key}]
#   reviews:    part review slugs (data/reviews)
#   see_also:   [{label, href}] other Part knowledge or Engineering knowledge pages
#   sources:    [{title, publisher, url, kind: ours | cached | fetched}]
# Our own reasoning is marked "est". Qorvo facts come from our catalogue, cached datasheet copies or third-party pages;
# qorvo.com is never requested.
#
# knowledge_pages: Engineering knowledge pages written with these groups (To confirm items of type "guide").

groups:
  - id: motor
    title: "Motor drivers and motor controllers"
    link: "How motor drivers work"
    gist: "How motor controller chips and gate drivers spin a brushless motor: commutation, FOC, bootstrap gate drive, current sensing, protection; our Qorvo and Skyworks parts."
    date: 2026-10-28
    subs: [motor_controller]
    families: []
    table_subs: [motor_controller]
    role: "Motor controller SoC"
    columns:
      - {label: "Supply (V)", keys: ["Power Supply Input Voltage (V)", "Input Supply (V)"]}
      - {label: "Gate drive", keys: ["Gate Drivers (High-Side)", "Peak Output Current (A)"]}
      - {label: "MCU", keys: ["Microcontroller"]}
      - {label: "Interfaces", keys: ["Serial Interfaces"]}
    parts: []
    exclude: []
    series:
      - {id: Si823x, label: "Si823x isolated half-bridge drivers (two outputs, dead time)", match: "^SI823[0-8]", sub: isolated_gate_driver, q: Si823, role: "Isolated gate driver (see Isolated gate drivers)", specs: {"Supply (V)": "floating driver supply", "MCU": "-", "Interfaces": "-"}}
      - {id: Si828x, label: "Si828x isolated gate drivers (DESAT, Miller clamp, soft shutdown)", match: "^SI828[1-6]", sub: isolated_gate_driver, q: Si828, role: "Isolated gate driver (see Isolated gate drivers)", specs: {"Supply (V)": "floating driver supply", "MCU": "-", "Interfaces": "-"}}
    what: >-
      A brushless motor has three windings and no brushes, so electronics must switch the current from winding to
      winding at the right moment. A motor driver chip does this switching. Three kinds sit in this group. A motor
      controller SoC (Qorvo PAC52xx / PAC55xx, ACT72350) holds the whole drive except the power transistors: power
      supply, microcontroller, current-sense amplifiers and six gate drivers. A gate driver (non-isolated or isolated,
      such as Skyworks Si823x / Si828x) only turns the controller's logic signals into strong gate pulses for the
      transistors. A brushed / stepper driver has small transistors inside and drives a small motor directly.
    how:
      diagram: _motor_svg.html
      steps:
        - title: "Commutation: which winding gets current"
          text: >-
            Six power transistors form three half-bridges, one per winding. At any moment one high-side and one
            low-side transistor are on, so current flows in through one winding and out through another. The
            controller must know where the rotor is: from Hall sensors, from an encoder, or sensorless, from the
            voltage the spinning magnet induces in the free winding (back-EMF).
        - title: "6-step (trapezoidal) or field-oriented control (FOC)"
          text: >-
            6-step control switches between six fixed current patterns per electrical turn. It needs little computing
            and one current measurement, but the torque ripples and the motor is louder. FOC measures two or three phase
            currents, converts them into a frame that turns with the rotor (Clarke and Park transforms), regulates
            torque and flux there and sends sine-shaped voltages back (space-vector PWM). It is smooth, quiet and
            efficient at all speeds, but it needs a fast MCU with floating point, which is why the PAC55xx parts use a
            150 MHz Cortex-M4F.
        - title: "The gate drive chain, with bootstrap"
          text: >-
            The MCU's PWM timers make the switching pattern; the gate driver lifts each signal to 10-12 V and pushes a
            peak current of 0.1-4 A into the transistor gate, so it switches in tens of nanoseconds. The high-side gate
            sits on the moving switch node, so it needs a supply that floats with it: a bootstrap capacitor is charged
            through a diode while the low-side transistor is on and then powers the high-side driver. A charge pump
            (PAC5527) keeps the high side on indefinitely (100% duty). Dead time between the two transistors of a
            half-bridge stops both from conducting at once (shoot-through).
        - title: "Current sensing"
          text: >-
            A small shunt resistor in each low-side leg (or one in the DC return) turns current into a few tens of
            millivolts. A current-sense amplifier inside the chip amplifies it and the ADC samples it at a moment set by
            the PWM timer. One shunt is enough for 6-step and protection; FOC and sensorless control need two or three.
        - title: "Protection"
          text: >-
            Comparators switch the drivers off within the same PWM cycle on over-current, before software reacts.
            Undervoltage lockout (UVLO) stops the transistors being driven with too little gate voltage, where they would
            overheat. Over-temperature and over-voltage shut-downs and a watchdog complete it. Isolated drivers add
            desaturation (DESAT) detection, soft shutdown and an active Miller clamp for IGBTs and SiC.
        - title: "Isolated gate drivers for high-voltage drives"
          text: >-
            Above about 100 V, or where a person can touch the control side, the gate signal crosses an isolation
            barrier. Skyworks Si823x / Si828x carry it across an on-chip capacitive barrier and drive each transistor
            from its own floating supply.
    specs:
      - {name: "Supply / bus voltage range", typical: "PAC52xx/55xx: 5.2-44, 70, 160 or 600 V; ACT72350: 5.2-160 V", why: "Sets the battery or bus the part can run from. The operating range is narrower than the absolute maximum, and a full battery sits above its nominal voltage.", note: "engineering:vdd_range_v"}
      - {name: "Gate drive current (source / sink)", typical: "0.06-2 A in the PAC parts; 0.5-4 A in Si823x / Si828x", why: "How fast the gate charge moves: sets switching loss, EMI and the largest transistor the driver can handle at a given PWM frequency.", note: "engineering:peak_source_a"}
      - {name: "Integrated MCU and peripherals", typical: "50 MHz Cortex-M0 or 150 MHz Cortex-M4F; PWM timers, 12-bit ADC, CAN / I2C / UART", why: "Decides whether FOC and sensorless control fit, and how many extra chips the board needs.", note: ""}
      - {name: "Current-sense amplifiers", typical: "1-3 differential amplifiers, programmable gain; offset a few mV", why: "Number of phases measured (one for 6-step, two or three for FOC) and offset decide low-speed and low-current accuracy.", note: ""}
      - {name: "Protection: UVLO, over-current, dead time, DESAT", typical: "cycle-by-cycle current limit; programmable dead time; DESAT on isolated drivers", why: "Saves the transistors and the battery in hardware when the motor stalls or the software hangs.", note: "engineering:deadtime"}
      - {name: "UVLO threshold", typical: "about 5-12 V on the gate supply", why: "Must suit the transistor: a MOSFET, IGBT and SiC need different minimum gate voltages, so UVLO variants are not interchangeable.", note: "engineering:uvlo_v"}
      - {name: "AEC-Q grade", typical: "PAC parts not stated in our data; many Si823x / Si827x / Si828x listed AEC-Q100", why: "A part used in a car must be AEC-Q100 qualified; an industrial part cannot replace it.", note: "engineering:qualification"}
      - {name: "Package and temperature", typical: "QFN 6 x 6 to 9 x 9 mm (PAC); SOIC-8 to SOIC-24 (isolated drivers)", why: "Board space and heat: the controller sits next to hot transistors; wide-body packages give the creepage an isolated driver needs.", note: "engineering:temp_range_c"}
    choosing:
      - "Integrated controller or separate gate driver + MCU: one chip saves board space and parts, but fixes the MCU and the gate-drive strength (est)."
      - "Bus voltage first: pick the PAC branch (44, 70, 160 or 600 V) that covers the full battery voltage with margin, not the nominal voltage."
      - "Gate-drive current against the transistors: large or parallel MOSFETs at high PWM frequency need more peak current than 1 A."
      - "6-step or FOC: FOC needs the Cortex-M4F parts and two or three current-sense channels."
      - "Charge pump or bootstrap: a charge pump allows 100% duty (stall torque, slow running); bootstrap alone needs the low side to switch regularly."
      - "Isolated or not: above about 100 V, or with a touchable control side, an isolated driver (Si823x / Si828x) and its safety ratings are needed."
    appnotes:
      - {text: "Size the gate resistor from the gate charge: the gate current is Ig = Qg / t (rise or fall time wanted), and RH = VDD / Ig_on minus the driver's own pull-up resistance; RL the same with the pull-down.", ref: AN1009, page: 9, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
      - {text: "In a half bridge, turn on slowly and turn off quickly (larger RH than RL, possible with separate VH / VL outputs): one transistor is nearly off before the other turns on, which cuts shoot-through current.", ref: AN1009, page: 5, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
      - {text: "Bootstrap capacitor: at least 10 times the transistor's gate capacitance (Qg / VGS), so it droops less than about 10 % per switching cycle; the driver's VDD bypass capacitor at least 10 times the bootstrap capacitor.", ref: "TI SLUA887A", page: "3-4", url: "https://www.ti.com/lit/an/slua887a/slua887a.pdf"}
      - {text: "Use low-ESR ceramic (MLCC) capacitors for the bootstrap and bypass, placed next to the driver pins, and a fast or Schottky bootstrap diode; a small bootstrap resistor (a few ohms) limits the inrush and the ringing on the switch node.", ref: "TI SLUA887A", page: "4-7", url: "https://www.ti.com/lit/an/slua887a/slua887a.pdf"}
      - {text: "One current-sense amplifier is enough for protection and for 6-step current regulation; FOC needs two or three (with two, the MCU calculates the third phase), and sensorless control needs accurate phase currents to estimate the rotor position.", ref: "TI SLVA999A", page: 1, url: "https://www.ti.com/lit/an/slva999a/slva999a.pdf"}
      - {text: "A classic BLDC drive needs six PWM signals (one per transistor) and three Hall sensors for position; putting the 6-step commutation table in the driver cuts the MCU's work to a direction and a PWM command, as simple as a brushed motor. Hall elements (analog) need extra comparators.", ref: "TI SLVA980C", page: "1-2", url: "https://www.ti.com/lit/ab/slva980c/slva980c.pdf"}
      - {text: "Desaturation (DESAT) protection on isolated drivers: a comparator trips at 7 V on the DSAT pin; a blanking capacitor CBL = t_blank x I_chg / 7 V (about 390 pF for 3 µs on the Si828x) stops false trips during turn-on.", ref: AN1009, page: 16, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
    see_also:
      - {label: "Part knowledge: isolated gate drivers", href: "/reviews/how/gatedriver"}
      - {label: "Part knowledge: isolated current sensing", href: "/reviews/how/currentsense"}
    gaps:
      - "Automotive grade of the PAC and ACT72350 parts: not stated in our catalogue (none listed as AEC-Q)."
      - "The catalogue has no supply, gate-drive or package data for some newer PAC numbers (PAC5523AQM, PAC5532BQX, PAC5556AQX)."
      - "No non-isolated 3-phase / half-bridge gate driver or brushed / stepper driver of ours is in the catalogue: the functions three_phase_gate_driver, half_bridge_driver and motor_driver_brushed have no Skyworks or Qorvo part."
      - "Qorvo's own PAC datasheets are not used (qorvo.com is not requested); the PAC5527 figures come from a public distributor copy (see the review)."
    used_in:
      - {label: "Cordless power tool", app: "Cordless power tool"}
      - {label: "Automotive electric pump / fan drive", app: "Automotive electric pump / fan drive"}
      - {label: "Robot joint motor drive (48 V)", app: "Humanoid / collaborative robot joint motor drive"}
      - {label: "Drone ESC (sensorless FOC)", app: "Drone ESC with sensorless FOC motor drive"}
      - {label: "HVAC motor control", app: "HVAC motor control"}
      - {label: "Industrial servo drive", app: "Industrial servo drive"}
      - {label: "Drone flight control and motor drives", topic: drone_flight_power}
      - {label: "Traction inverter isolation (isolated gate drivers)", topic: traction_asil_d}
    reviews: [qorvo-pac5527-motor-driver]
    sources:
      - {title: "Part review: Qorvo PAC5527 and the PAC family (PAC5527 datasheet Rev 1.2, public distributor copy)", publisher: "BizDev", url: "/reviews/qorvo-pac5527-motor-driver", kind: ours}
      - {title: "Qorvo catalogue rows: motor_controller (PAC52xx, PAC55xx, ACT72350)", publisher: "BizDev catalogue (store crawl, Oct 2026)", url: "/parts?sub=motor_controller", kind: ours}
      - {title: "Skyworks catalogue rows: isolated gate drivers", publisher: "BizDev catalogue", url: "/parts?sub=isolated_gate_driver", kind: ours}
      - {title: "AN1009: Driving MOSFET and IGBT Switches Using the Si828x", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf", kind: cached}
      - {title: "Architecture for Brushless-DC Gate Drive Systems (SLVA999A)", publisher: "Texas Instruments", url: "https://www.ti.com/lit/an/slva999a/slva999a.pdf", kind: fetched}
      - {title: "Brushless-DC Made Simple: Sensored Motor Control (SLVA980C)", publisher: "Texas Instruments", url: "https://www.ti.com/lit/ab/slva980c/slva980c.pdf", kind: fetched}
      - {title: "Sensorless Field Oriented Control of 3-Phase PMSM (SPRABQ3)", publisher: "Texas Instruments", url: "https://www.ti.com/lit/an/sprabq3/sprabq3.pdf", kind: fetched}
      - {title: "Bootstrap Circuitry Selection for Half-Bridge Configurations (SLUA887A)", publisher: "Texas Instruments", url: "https://www.ti.com/lit/an/slua887a/slua887a.pdf", kind: fetched}

