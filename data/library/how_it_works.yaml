    series: []
    what: >-
      A UWB transceiver sends and receives very short radio pulses and timestamps them precisely, so two devices can
      measure the distance between them to about 10 cm, and with two antennas the direction too. It also carries a
      small amount of data. Around it, front-end parts help the weak signal: an antenna switch picks the antenna (or
      switches between two for angle), an LNA adds receive gain, a PA with bypass makes up board losses, and filters keep
      strong nearby transmitters out. Qorvo makes the transceivers, SoCs and modules (DW3xxx, QM33xxx, QM35xxx, DWMxxxx)
      and UWB front ends (QM14068, QM14070); Skyworks and Qorvo make the switches and filters.
    how:
      diagram: _uwb_svg.html
      steps:
        - title: "Impulse radio"
          text: >-
            Instead of a steady carrier, the transmitter sends pulses about 2 ns long, spread over a 500 MHz wide channel.
            A short pulse has a sharp arrival time. Light travels 30 cm in a nanosecond, so timestamping to a fraction of
            a nanosecond gives centimetre distance. The power is spread so thin (-41.3 dBm/MHz mean) that it sits under
            other radios' noise.
        - title: "Finding the first path"
          text: >-
            Indoors and in a car the pulse arrives many times (echoes). The receiver builds the channel impulse response
            and takes the timestamp from the first, often weaker, path: that one is the true distance.
        - title: "Two-way ranging (time of flight)"
          text: >-
            Device A sends a poll, B answers after a known delay, A sends a final message. Each side notes its send and
            receive times; the round-trip times minus the reply delays give the flight time. Using three messages
            (double-sided ranging) cancels most of the clock error between the two crystals. In TDoA mode a tag only
            transmits and synchronised anchors compare arrival times.
        - title: "Angle of arrival with two or more antennas"
          text: >-
            A part with two antenna ports measures the phase difference of the same pulse at two antennas about half a
            wavelength apart (about 2 cm at 8 GHz). The phase difference gives the angle (PDoA); distance plus angle from
            one device gives a position. Three antennas give angle in two planes.
        - title: "Channels 5 and 9"
          text: >-
            Channel 5 is centred at 6489.6 MHz and channel 9 at 7987.2 MHz, each 499.2 MHz wide. Channel 9 is the one
            accepted almost worldwide and mandatory in FiRa-certified devices; channel 5 is losing ground to 6 GHz Wi-Fi.
            Every switch, filter and LNA in the path must cover the channel used, up to about 8.25 GHz for channel 9.
        - title: "Secure ranging: IEEE 802.15.4z, STS"
          text: >-
            IEEE 802.15.4z (2020) added the scrambled timestamp sequence (STS): a pseudo-random pulse pattern made with
            AES from a shared key. The receiver timestamps on the STS, so an attacker who does not know the key cannot
            make a signal arrive earlier (closer). A relay can only add delay.
        - title: "Profiles and the next step: FiRa, CCC, 802.15.4ab"
          text: >-
            FiRa (devices, phones, tags) and the Car Connectivity Consortium (CCC Digital Key) define how parts from
            different makers range with each other on top of 802.15.4z. IEEE 802.15.4ab, in ballot, adds a narrowband
            assist radio in the 5.7-6.4 GHz range, multi-millisecond ranging and a radar-style sensing mode.
    specs:
      - {name: "Channels supported", typical: "5 (6.5 GHz) and 9 (8.0 GHz)", why: "Channel 9 is the globally accepted one; a part or front end that stops at 8.0 GHz does not cover all of it.", note: "rf:lpwan_uwb_iot_links"}
      - {name: "TX power", typical: "up to about -31 dBm/MHz from the chip; legal limit -41.3 dBm/MHz mean e.i.r.p.", why: "Power is capped by regulation, so the extra headroom only makes up antenna and board losses; range comes from the receiver.", note: "rf:lpwan_uwb_iot_links"}
      - {name: "RX sensitivity", typical: "about -94 to -100 dBm (channel 5, at the stated data rate and preamble)", why: "Sets the range. Compare at the same data rate, preamble, STS setting and packet error rate; every dB of switch or filter loss in front comes off it.", note: "rf:sensitivity_noise_floor"}
      - {name: "Ranging accuracy", typical: "±6 cm after calibration, ±15 cm without (DW3110, line of sight)", why: "What the product can promise; crystal error and board delay need calibration per board.", note: ""}
      - {name: "AoA support", typical: "1 port (distance only) or 2 ports (PDoA, about ±5° angle)", why: "Angle needs two or more antenna ports, or an external antenna switch; PDoA versions lose about 1.2-1.4 dB in their internal switch.", note: ""}
      - {name: "Power consumption", typical: "receive 72-88 mA; sleep 260 nA (DW3110)", why: "The receiver dominates; a coin-cell tag lives on its duty cycle, so check sleep current and wake time as well as the peak.", note: ""}
      - {name: "Security (STS, AES)", typical: "802.15.4z STS with AES-128; older 802.15.4-2011 parts have none", why: "Without STS the distance can be faked; car keys and door locks need it.", note: ""}
      - {name: "Front-end loss, isolation and pulse fidelity", typical: "switch 0.5-0.9 dB loss; flat group delay across 500 MHz", why: "Loss before the first gain stage costs sensitivity; group-delay ripple can create a false early path.", note: "engineering:uwb_signal_path"}
      - {name: "AEC-Q grade", typical: "DW3300Q and SKY5A2108 listed automotive; most others not stated", why: "Car parts must be AEC-Q100 qualified (Grade 2, -40 to +105 °C, for most mounting positions).", note: "engineering:qualification"}
    choosing:
      - "Transceiver, SoC or module: a transceiver (DW3110) needs a host MCU running the ranging stack; an SoC (QM35825) runs it on the chip; a module adds antenna and certification but costs more (est)."
      - "One or two antenna ports: two for angle of arrival, or one port plus an external switch."
      - "802.15.4z with STS for anything secure; the DW1000 generation has no STS."
      - "Channel 9 coverage of every part in the RF path, to 8.25 GHz."
      - "Front end only where the link budget needs it: an LNA ahead of a lossy switch at weak positions; a PA with bypass only makes up losses under the power cap."
      - "Automotive grade and the absolute-maximum RF input when other transmitters sit close."
    appnotes:
      - {text: "Terminate the unused antenna path in 50 Ω (an absorptive switch, or a DPDT with an external termination) when a ranging radio switches between antennas: it steadies the measurement and cuts reflections. Shown for Bluetooth Channel Sounding; the same holds for a UWB AoA switch (est).", ref: AN1451, page: 1, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Application-Notes/AN1451_Enabling_High_Performance_Bluetooth_207463A.pdf"}
      - {text: "Matching networks and antenna switches typically cost 1 to 1.5 dB of insertion loss, taken straight from the link margin of a ranging radio.", ref: AN1451, page: 3, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Application-Notes/AN1451_Enabling_High_Performance_Bluetooth_207463A.pdf"}
      - {text: "Angle of arrival with two antennas is the basic set-up; four antennas (SP4T / DP4T switches) improve angular resolution and robustness against device orientation and multipath.", ref: AN1451, page: 3, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Application-Notes/AN1451_Enabling_High_Performance_Bluetooth_207463A.pdf"}
      - {text: "A front-end module sits between the radio chip and the antenna switch; prefer a single-antenna FEM plus an absorptive switch, because diversity FEMs do not terminate the idle antenna in 50 Ω.", ref: AN1451, page: 4, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Application-Notes/AN1451_Enabling_High_Performance_Bluetooth_207463A.pdf"}
      - {text: "Link budget table: 85-91 dB of path loss for data frames and up to 97-98 dB for ranging-only frames at the legal power with 0 dBi antennas; every dB lost between antenna and pin comes off it.", ref: "DW3000 datasheet v1.3 (public copy)", page: "Table 12", url: "https://raw.githubusercontent.com/SendingA/Some-UWB-Papers/main/DW3000_Data_Sheet.pdf"}
      - {text: "Clock error becomes distance error: the 38.4 MHz crystal (±20 ppm, trimmable on chip) should be trimmed per board in production, or a TCXO used for anchors; ranging is ±6 cm after calibration and about ±15 cm without.", ref: "DW3000 datasheet v1.3 (public copy)", page: "Tables 10 and 14", url: "https://raw.githubusercontent.com/SendingA/Some-UWB-Papers/main/DW3000_Data_Sheet.pdf"}
