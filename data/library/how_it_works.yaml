    title: "Ultra-wideband (UWB) transceivers and front ends"
    link: "How UWB works"
    gist: "How a UWB chip measures distance and angle: 2 ns pulses, two-way ranging, phase-difference angle, channels 5/9, STS security; our Qorvo and Skyworks parts."
    date: 2026-10-28
    subs: [uwb]
    families: []
    table_subs: [uwb]
    role: "UWB transceiver / module"
    columns:
