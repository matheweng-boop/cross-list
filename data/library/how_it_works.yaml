  - id: isolator
    title: "Capacitive digital isolators"
    link: "How digital isolators work"
    gist: "How a capacitive digital isolator carries logic across a SiO2 barrier: on-off keyed carrier, CMTI, default output, insulation ratings, creepage and timing; our Skyworks parts."
    date: 2026-10-28
    subs: [digital_isolator]
    families: [digital_isolator]
    table_subs: []
    role: "Digital isolator"
    columns:
      - {label: "Data rate (Mbps)", keys: ["Max Data Rate (Mbps)", "param:data_rate_mbps"]}
      - {label: "Isolation (kVrms)", keys: ["Isolation Rating (kVrms)", "param:isolation_rating_kvrms"]}
      - {label: "Default output", keys: ["Default Output State", "param:default_output"]}
      - {label: "Max prop. delay (ns)", keys: ["Max Propagation Delay", "param:prop_delay_ns"]}
    parts: []
    exclude: []
    series:
      - {id: Si86Sx, label: "Si86Sx (newest generation: >100 kV/µs CMTI, deglitch options)", match: "^SI86S", sub: digital_isolator, q: Si86S, role: "Digital isolator"}
      - {id: Si86xx, label: "Si86xx (1-6 channels, up to 150 Mbps)", match: "^SI86[0-6]\\d", sub: digital_isolator, q: Si86, role: "Digital isolator"}
      - {id: Si84xx, label: "Si84xx (first generation)", match: "^SI84\\d", sub: digital_isolator, q: Si84, role: "Digital isolator"}
      - {id: Si80xx, label: "Si80xx (1 kV, small QSOP)", match: "^SI80\\d", sub: digital_isolator, q: Si80, role: "Digital isolator"}
      - {id: Si87xx, label: "Si87xx (LED-emulator input: optocoupler replacement)", match: "^SI87\\d", sub: digital_isolator, q: Si87, role: "Digital isolator"}
      - {id: Si88xx, label: "Si88xx (isolator + isolated DC-DC controller)", match: "^SI88\\d", sub: digital_isolator, q: Si88, role: "Digital isolator with power"}
    what: >-
      A digital isolator passes logic signals (PWM, SPI, I2C, UART, enable lines) from one circuit to another that sits
      at a different, possibly lethal, voltage, with no electrical connection between them. It replaces the
      optocoupler: faster, smaller, with timing that does not drift with LED ageing. Inside the package are two (or more)
      silicon dies, one per side, joined only through tiny capacitors whose insulation is silicon dioxide (SiO2). Each
      side has its own supply and ground; nothing but the signal crosses.
    how:
      diagram: _isolator_svg.html
      steps:
        - title: "An RF carrier switched on and off (on-off keying)"
          text: >-
            The transmitter die has an RF oscillator. A logic high on the input switches the carrier on, a low switches it
            off. The carrier crosses the barrier through the capacitors; the receiver die detects RF energy and sets its
            output high or low. Skyworks says this on-off keying gives better noise immunity, lower power and better
            immunity to magnetic fields than pulse-coded schemes.
          cite: "Si823x data sheet p. 7 (the same channel as the digital isolators)"
        - title: "Two capacitors in series, differential signal"
          text: >-
            The barrier is two SiO2 capacitors in series, one on each die, joined by bond wires. The carrier is sent
            differentially, so a voltage jump between the two grounds (common mode) reaches both lines equally and is
            rejected (est for the differential detail). If one capacitor is damaged, the other still isolates.
          cite: "AN1167 p. 16"
        - title: "Common-mode transient immunity (CMTI)"
          text: >-
            When a power switch turns on, the ground of one side can jump hundreds of volts in nanoseconds. That edge
            pushes current through the barrier capacitance. CMTI is the steepest edge (kV/µs) the part tolerates without a
            wrong output. Si86xx parts are rated above 35 kV/µs; the newer Si86Sx above 100 kV/µs (150 kV/µs with the
            deglitch option).
          cite: "AN1359 p. 17"
        - title: "Default output state"
          text: >-
            With the input side unpowered or the input floating, the receiver sees no carrier, so the output goes to a
            set state, low or high depending on the part number option. Pick the default that keeps the load safe, for
            example a gate-driver enable held low.
        - title: "Insulation ratings"
          text: >-
            Basic insulation is one level of protection, reinforced is two (needed when the low-voltage side can be
            touched). The data sheet gives the 1-minute withstand voltage (VISO, e.g. 2.5, 3.75 or 5 kVrms), the
            continuous working voltage (VIORM / VIOWM) from lifetime (TDDB) tests, the transient overvoltage (VIOTM) and
            the surge rating (10 kV on surge-rated parts). SiO2 withstands about 500 V/µm, which lets a thin barrier
            carry high voltage.
          cite: "AN583 p. 2-3, AN1167 p. 17"
        - title: "Creepage and clearance belong to the package"
          text: >-
            The barrier inside is not the limit outside: the distance along the package surface (creepage) and through air
            (clearance) between the two pin rows must meet the safety standard, so the package choice (narrow or wide
            body) follows from the working voltage.
          cite: "AN583 p. 4-7"
        - title: "Timing: propagation delay, pulse-width distortion, skew"
          text: >-
            Each channel adds a delay, a small difference between rising and falling edges (pulse-width distortion) and
            channel-to-channel or part-to-part differences (skew). These, not the maximum data rate, usually set the
            fastest SPI clock or the PWM dead time. Deglitch versions filter out pulses under 30 ns at the cost of more
            delay.
          cite: "AN1359 p. 4-5, 13"
        - title: "Separate power domains"
          text: >-
            Each die runs from its own supply and ground, so the input and output side can use different logic levels and
            the isolator also level-shifts. Where the far side has no supply, an isolated DC-DC brings one across: the
            Si884xx / Si886xx add a DC-DC controller for an external transformer.
          cite: "AN901 p. 1"
    specs:
      - {name: "Isolation rating (VISO)", typical: "1, 2.5, 3.75 or 5 kVrms for 1 minute", why: "The headline safety number; the standard and the working voltage decide which one is needed.", note: "engineering:isolation_rating_kvrms"}
      - {name: "Basic vs reinforced", typical: "reinforced needs about twice the creepage and test voltage", why: "Reinforced is required when a person can touch the low-voltage side.", note: "engineering:isolation_class"}
      - {name: "Working voltage (VIORM / VIOWM)", typical: "hundreds of V to above 1 kV peak", why: "What the barrier may see for its whole life; set by TDDB lifetime tests.", note: "engineering:viorm_vpk"}
      - {name: "Creepage / clearance", typical: "set by the package (narrow or wide body)", why: "Must meet the end standard; set by the package, not the die.", note: "engineering:creepage_mm"}
      - {name: "CMTI", typical: ">35 kV/µs (Si86xx), >100 kV/µs (Si86Sx)", why: "Margin against fast switch-node edges, especially with SiC and GaN.", note: "engineering:cmti_kv_us"}
      - {name: "Default output state", typical: "low or high", why: "Decides what the load sees while one side is unpowered.", note: "engineering:default_output"}
      - {name: "Data rate and propagation delay", typical: "up to 150 Mbps; about 10-40 ns delay", why: "Delay, distortion and skew set the timing budget of SPI and PWM paths.", note: "engineering:prop_delay_ns"}
      - {name: "Pulse-width distortion and skew", typical: "a few ns", why: "Eat into SPI setup / hold time and PWM dead time.", note: "engineering:pwd_ns"}
      - {name: "Channel configuration", typical: "1-6 channels, forward / reverse mix", why: "Must match the signals; never a deviation in a cross.", note: "engineering:channel_config"}
      - {name: "AEC-Q grade", typical: "-A / -AS suffix parts listed AEC-Q100", why: "Required in cars.", note: "engineering:qualification"}
    choosing:
      - "Insulation first: basic or reinforced, the working voltage, then the package that gives the creepage."
      - "Timing budget, not data rate: check delay, distortion and skew against the SPI clock or the PWM dead time."
      - "CMTI margin at the real dv/dt of the switch node (SiC and GaN need the newer parts)."
      - "Default output that keeps the load safe."
      - "Channel count and direction, and whether a deglitch filter is worth its extra delay in a noisy system."
      - "Whether the far side needs power too: an isolator with a DC-DC controller (Si88xx) saves a module."
    appnotes:
      - {text: "Rule of thumb for most standards: basic insulation needs about 3.2 mm creepage / clearance and a 2500 Vrms 1-minute test; reinforced about 6.4 mm and 5000 Vrms (6000 Vrms for 1 s in production).", ref: AN583, page: 3, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN583.pdf"}
      - {text: "Skyworks isolator packages are rated Material Group I (CTI): in many standards that halves the creepage needed (for example 4 mm to 2 mm at 400 Vrms); PCB grooves can lengthen creepage, but not clearance.", ref: AN583, page: 5, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN583.pdf"}
      - {text: "Layout: four-layer board with a solid ground plane next to the signal layer; 0.1 µF and 1 µF bypass capacitors right at the supply pins; in noisy systems add 100 Ω in series with inputs and outputs.", ref: AN583, page: 8, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN583.pdf"}
      - {text: "The two series SiO2 capacitors sit on separate dice: if an overstress destroys one side, a 5 kVrms isolator still withstands about 2500 Vrms.", ref: AN1167, page: 18, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1167.pdf"}
      - {text: "Lifetime: the Si86xx TDDB curve predicts 100 years at 1000 Vrms working voltage for a 10 ppm failure rate; SiO2 withstands 500 V/µm against 50-200 V/µm for other dielectrics.", ref: AN1167, page: 17, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1167.pdf"}
      - {text: "Isolated SPI budget with Si86SS51 (<3 ns PWD, <3 ns skew, 9 ns delay): a write loses 6 ns of setup / hold, a read 24 ns (two extra delays), so 10 MHz with a normal clock, 20 MHz with an asymmetric clock, 40 MHz with a looped-back clock.", ref: AN1359, page: "5-8", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1359-si86Sx_design_considerations.pdf"}
      - {text: "Deglitch versions (Si86SxxxHx / Fx) block pulses under 30 ns; the total delay rises to about 36 ns typical, close to the competitor parts they may replace.", ref: AN1359, page: 13, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1359-si86Sx_design_considerations.pdf"}
      - {text: "Si86SW options tune the internal on-off-keying carrier away from 2.4 / 5 GHz Wi-Fi and 1.9 GHz DECT.", ref: AN1359, page: 14, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1359-si86Sx_design_considerations.pdf"}
    see_also:
      - {label: "Engineering knowledge: error propagation and timing budgets", href: "/engineering/error_budget"}
      - {label: "Part knowledge: isolated gate drivers", href: "/reviews/how/gatedriver"}
    gaps:
      - "Most Si84xx part numbers are not active in our data (only some Si841x / Si842x); the Si86Px samples are not active yet."
      - "No Qorvo digital isolator in our catalogue."
      - "CMTI and surge ratings per orderable part are only in the BizDev data for the parts loaded with full parameters."
    used_in:
      - {label: "Industrial isolated I/O", app: "Industrial isolated I/O"}
      - {label: "PLC analog input module", app: "PLC analog input module"}
      - {label: "EV high-voltage battery system", app: "EV high-voltage battery system (wired"}
      - {label: "Traction inverter isolation", topic: traction_asil_d}
    reviews: []
    sources:
      - {title: "AN583: Safety Considerations and Layout Recommendations for Digital Isolators", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN583.pdf", kind: cached}
      - {title: "AN1167: Safety Considerations for Capacitive Isolators", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1167.pdf", kind: cached}
      - {title: "AN1359: Design Considerations for the Si86Sx family", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1359-si86Sx_design_considerations.pdf", kind: cached}
      - {title: "AN901: Design Guide for Isolated DC/DC Using the Si884xx, Si886xx, or Si8282/84", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an901-Si884xx-Si886xx-design-guide.pdf", kind: cached}
      - {title: "Si823x data sheet (channel description, on-off keying)", publisher: "Skyworks", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si823x-datasheet.pdf", kind: cached}
      - {title: "Skyworks catalogue and BizDev parameters: digital isolators", publisher: "BizDev", url: "/parts?sub=digital_isolator", kind: ours}

  - id: gatedriver
    title: "Isolated gate drivers"
    link: "How isolated gate drivers work"
    gist: "How an isolated gate driver switches IGBT, SiC and GaN: peak current, CMTI, UVLO, Miller clamp, DESAT, soft shutdown; our Skyworks parts."
    date: 2026-10-28
    subs: [isolated_gate_driver]
    families: [gate_driver]
    table_subs: []
    role: "Isolated gate driver"
    columns:
      - {label: "Peak current (A)", keys: ["Peak Output Current (A)", "param:peak_source_a"]}
      - {label: "UVLO (V)", keys: ["UVLO Voltage (V)", "UVLO", "param:uvlo_v"]}
      - {label: "Isolation (kVrms)", keys: ["Isolation Rating (kVrms)", "param:isolation_rating_kvrms"]}
      - {label: "Outputs / input", keys: ["Output Configuration", "Input Type"]}
    parts: []
    exclude: []
    series:
      - {id: Si823x, label: "Si823x dual drivers (high side / low side, programmable dead time)", match: "^SI823[0-8]", sub: isolated_gate_driver, q: Si823, role: "Dual isolated driver"}
      - {id: Si8239x, label: "Si8239x dual drivers, automotive", match: "^SI8239", sub: isolated_gate_driver, q: Si8239, role: "Dual isolated driver"}
      - {id: Si82Ax-Fx, label: "Si82Ax-Fx performance drivers (deglitch options)", match: "^SI82[A-F]\\d", sub: isolated_gate_driver, q: Si82, role: "Dual isolated driver"}
      - {id: Si8252x, label: "Si8252x dual drivers (DFN)", match: "^SI8252", sub: isolated_gate_driver, q: Si8252, role: "Dual isolated driver"}
      - {id: Si827x, label: "Si827x single drivers (split pull-up / pull-down)", match: "^SI827", sub: isolated_gate_driver, q: Si827, role: "Single isolated driver"}
      - {id: Si826x, label: "Si826x opto-compatible single drivers (LED-emulator input)", match: "^SI826", sub: isolated_gate_driver, q: Si826, role: "Single isolated driver"}
      - {id: Si822x, label: "Si822x opto-compatible drivers", match: "^SI822", sub: isolated_gate_driver, q: Si822, role: "Single isolated driver"}
      - {id: Si828x, label: "Si828x drivers with DESAT, Miller clamp, soft shutdown (Si8281 / 83: DC-DC)", match: "^SI828[1-6]", sub: isolated_gate_driver, q: Si828, role: "Single isolated driver with protection"}
    what: >-
      An isolated gate driver takes the logic PWM signal from a controller and turns it into a strong, fast gate pulse for
      a power transistor (IGBT, silicon MOSFET, SiC or GaN) that sits at a high, moving voltage. It does three jobs in one
      package: it carries the signal across an isolation barrier, it shifts the level to the transistor's own floating
      supply, and it delivers amperes of peak current to charge and discharge the gate quickly. Protection features
      (UVLO, desaturation detection, Miller clamp, soft shutdown) keep the transistor safe.
    how:
      diagram: _gatedriver_svg.html
      steps:
        - title: "Signal across the barrier"
          text: >-
            The input die encodes the PWM on an RF carrier (on-off keying) and sends it through the SiO2 capacitor
            barrier; the output die decodes it, as in a digital isolator. On the Si823x the delay is 30 ns typical, 45 ns
            maximum, with pulse-width distortion under 5.6 ns.
          cite: "Si823x data sheet p. 7, 23"
        - title: "Output stage: source and sink"
          text: >-
            A strong pull-up and pull-down push amperes of peak current into the gate (more with an external booster).
            Separate pull-up and pull-down pins (VH / VL) let the designer set turn-on and turn-off speed with two
            resistors.
          cite: "AN1009 p. 1, 9"
        - title: "Floating supply: bootstrap or isolated bias"
          text: >-
            The output die needs its own supply referenced to the transistor's source (or emitter). A bootstrap
            capacitor and diode do it cheaply for the high side of a half bridge. A separate isolated supply is needed for
            a negative turn-off voltage, 100 % duty cycle or high power; the Si8282 / Si8284 integrate a DC-DC controller.
          cite: "AN901 p. 1"
        - title: "UVLO"
          text: >-
            Under-voltage lockout keeps the outputs low until the driver supply is high enough to switch the transistor
            fully on; the threshold option (5, 8, 10 or 12.5 V on the Si823x) must suit the transistor type.
          cite: "Si823x data sheet p. 15, 23"
        - title: "Miller clamp"
          text: >-
            When the other transistor of a half bridge switches, the fast voltage edge couples through the gate-drain
            (Miller) capacitance and can lift the off-gate enough to turn it on. A clamp pin holds the gate low with a
            low-impedance path once it is below about 2 V.
          cite: "AN1009 p. 1, 13"
        - title: "Desaturation (DESAT) and soft shutdown"
          text: >-
            In a short circuit the transistor leaves saturation and its collector voltage rises while it is on. The driver
            watches it through a diode on the DSAT pin; above 7 V it turns the transistor off slowly through a 60 Ω path,
            so the large current does not cause a voltage spike in the wiring inductance, and reports a fault.
          cite: "AN1009 p. 12-13"
        - title: "Dead time and overlap protection"
          text: >-
            Dual drivers add a programmable delay between one output going low and the other going high, set by one
            resistor, and keep both outputs from being high together.
          cite: "Si823x data sheet p. 17"
        - title: "SiC, GaN and IGBT needs"
          text: >-
            SiC has low transconductance: it needs a high on-voltage, often a negative off-voltage and may need a lower
            DESAT threshold; its hard-switched edges can exceed 100 kV/µs, so CMTI matters. GaN needs tight gate-voltage
            limits and very small delay mismatch (est).
          cite: "AN1306 p. 4-5"
    specs:
      - {name: "Peak source / sink current", typical: "0.5-4 A; above 20 A with an external booster", why: "Sets how fast the gate charge moves: switching loss against EMI.", note: "engineering:peak_source_a"}
      - {name: "CMTI", typical: "20 kV/µs min, 45 typ (Si823x); higher in newer families", why: "The switch node of a SiC half bridge can exceed 100 kV/µs.", note: "engineering:cmti_kv_us"}
      - {name: "UVLO threshold", typical: "5, 8, 10 or 12.5 V", why: "Must suit MOSFET, IGBT or SiC gate voltage; variants are not interchangeable.", note: "engineering:uvlo_v"}
      - {name: "Propagation delay and matching", typical: "30 ns typ, 45 ns max; PWD below 5.6 ns (Si823x)", why: "Delay mismatch between high and low side must be covered by dead time.", note: "engineering:prop_delay_ns"}
      - {name: "Dead time / overlap protection", typical: "set by one resistor (Si823x)", why: "Stops shoot-through when the controller cannot guarantee it.", note: "engineering:deadtime"}
      - {name: "Protection: DESAT, Miller clamp, soft shutdown", typical: "Si828x", why: "Short-circuit survival of IGBT and SiC modules.", note: ""}
      - {name: "Isolation and certifications", typical: "2.5-5 kVrms; UL 1577, VDE", why: "Basic or reinforced, by the voltage and whether the controller side can be touched.", note: "engineering:certifications"}
      - {name: "AEC-Q grade", typical: "many Si823x / Si827x / Si828x listed AEC-Q100", why: "Traction inverters, chargers and pumps in cars.", note: "engineering:qualification"}
    choosing:
      - "Single or dual: a dual driver (Si823x) fits a half bridge with a bootstrap; single drivers (Si827x, Si828x) give each transistor its own isolated supply."
      - "Protection: IGBT and SiC modules want DESAT, soft shutdown and Miller clamp (Si828x); low-voltage MOSFET bridges may not."
      - "Drive current against the transistor's gate charge; split outputs to set turn-on and turn-off speed separately."
      - "UVLO matched to the transistor; negative off-voltage for SiC."
      - "CMTI at the real dv/dt; delay matching covered by dead time."
      - "Bias supply: bootstrap (cheap, limited duty cycle) or an isolated DC-DC (Si8282 / 84 integrate the controller)."
    appnotes:
      - {text: "Gate resistors: Ig = Qg / t for the wanted rise or fall time; RH = VDDB / Ig_on minus the driver's pull-up resistance, RL the same with the pull-down.", ref: AN1009, page: 9, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
      - {text: "Soft shutdown: the internal 60 Ω path with RH = 20 Ω gives about 2 µs for 250 nC of gate charge; a steering diode allows a larger external resistor for longer.", ref: AN1009, page: 13, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
      - {text: "DESAT blanking: CBL = t_blank x I_chg / 7 V; a 3 µs blanking needs about 390 pF (1 mA charge current) or 100 pF on the Si8286 (250 µA).", ref: AN1009, page: 16, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1009-driving-mosfet-and-igbt-switches-using-the-si828x.pdf"}
      - {text: "SiC: hard switching can put more than 100 kV/µs on the barrier; check CMTI and, if needed, slow the edges with the gate resistors. Working voltage (VIOWM) and creepage must match the bus.", ref: AN1306, page: 5, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1306-si828x-driving-sic-mosftets.pdf"}
      - {text: "Protect a SiC gate with Schottky diodes from VSSB to the gate and from the gate to VDDB, against current injected through the drain-gate capacitance.", ref: AN1306, page: 11, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1306-si828x-driving-sic-mosftets.pdf"}
      - {text: "Si828x standard drive is about 3 A source and 6 A sink; a low-cost external booster lifts it above 20 A for large modules, with DESAT response under 1 µs and an adjustable threshold.", ref: AN1288, page: "1-3", url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1288-si828x-ext-enhan-circs.pdf"}
      - {text: "Layout: 0.1 µF plus 10 µF bypass at the supply pins; for very high CMTI add 10 nF from each logic input (and NC pins) to the input ground; gate traces at least 20 mil; keep about 1 mm per kV between high-voltage traces and logic.", ref: "Si823x data sheet", page: 21, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si823x-datasheet.pdf"}
      - {text: "Deglitch filters on the logic inputs reject noise pulses but add delay and, if rise and fall filters differ, pulse-width distortion; choose the option with the timing budget in mind.", ref: AN1462, page: 1, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1462_Si82Ax-Fx_Isolated_Gate_Driver_Deglitch_Filter.pdf"}
    see_also:
      - {label: "Part knowledge: motor drivers and controllers", href: "/reviews/how/motor"}
      - {label: "Part knowledge: capacitive digital isolators", href: "/reviews/how/isolator"}
      - {label: "Engineering knowledge: error propagation and timing budgets", href: "/engineering/error_budget"}
    gaps:
