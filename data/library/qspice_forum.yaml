# QSPICE library: design threads from the QSPICE section of the Qorvo Tech Forum, summarised in our own words.
#
# SOURCE  https://forum.qorvo.com/c/qspice/9 (Discourse; QSPICE category id 9). qspice.com forwards to a www.qorvo.com
#         page, which we never request, so the forum section is the only source used.
# EXCEPTION (owner, 27 Oct 2026). The standing rule is "never any qorvo.com host". The owner asked "Use the Qspice forum
#         for design discussions and things. Also, if you can draw useful conclusions to block diagrams." and, told the
#         forum sits on forum.qorvo.com, answered "Remove user names. If the data is public, then the customer names can
#         be used." The exception covers only forum.qorvo.com paths for the QSPICE category and the topics in it
#         (/c/qspice/9..., /t/<id>.json of topics in that category). Nothing else on any qorvo.com host. Recorded in
#         data/library/sources.yaml (id qspice_forum).
# RULES   robots.txt first (read 27 Oct 2026: allows /c/ and /t/ for all agents; disallows /search, /admin, /auth,
#         /session, /my, /badges, /g, RSS feeds); GET only, one request at a time, >= 10 s apart, each URL once, stop at
#         the first 403 / 429 / bot check (tools/research/fetch.sh). About 80 requests per full run; the weekly check about 20.
# DATA PROTECTION  No user names, handles, avatars, signatures or e-mails, ever (tests/test_qspice.py checks for
#         @handles and name fields). Company names only where the thread shows them publicly (vendors of models, a
#         book's publisher). Our own words, 1-3 sentences; no long quotes. Part numbers may be stored.
# CHECKED 2026-10-27: 73 forum requests (robots.txt, 8 listings, 52 design topics, 12 guide topics); 0 blocks.
#
# topics:   id, title, url, date (thread start), fns (function ids, data/blocks/functions.yaml), circuit, problem, fix,
#           parts (MPNs named in the thread), gist (<= 25 words, for To confirm)
# practice: "Seen in practice (QSPICE forum)" notes per function: id, fn, title, text (1-2 sentences), topics (>= 2 ids),
#           gist. Shown in the block editor and on the function's evidence page.
# fixes:    common fixes, each from >= 2 threads: id, title, text, topics
# help:     how-tos, commands and model syntax from the section's guide threads: id, title, kind, text, commands, links
# models:   which Skyworks / Qorvo parts have a public SPICE model in our data: parts, vendor, model, source, url
# answers:  answer notes the daily run adds for the owner's unanswered Ask questions: id, question, date, text, links
source:
  section: https://forum.qorvo.com/c/qspice/9
