    - {id: g6, label: "ADAS domain controller / central computer", col: 2, row: 0, w: 2, blocks: [{fn: serdes, label: "Deserializers + power over coax"}, {fn: load_switch, label: "PoC high-side switches"}, {fn: soc, label: "Sensor-processing SoC"}, {fn: adas_processor, label: "Fusion / driving SoC"}, {fn: mcu, label: "Safety MCU"}, {fn: ddr_flash}, {fn: pcie_switch, label: "PCIe between SoCs, accelerator, SSD"}, {fn: ethernet_phy, label: "Ethernet switch + T1 PHYs"}, {fn: can_transceiver}, {fn: multiphase, label: "SoC core supply"}, {fn: pmic}, {fn: supervisor}]}
