block_diagram:
  name: "ADAS sensing and domain controller: radar (single-chip and 4D cascade), cameras, lidar, ultrasonic, cabin sensing"
  note: >-
    Drawn by us from r1-r6 (not copied). Cameras and raw-data (satellite) radar reach the computer over SerDes with
    power over coax; smart radar, lidar and ultrasonic modules send object lists over Ethernet or CAN. In the 4D radar
    the master chip drives the LO, 40 MHz reference and frame sync of the slave chips; the 40 MHz and sync go through a
    low-jitter fan-out buffer. The domain controller has a sensor-processing SoC, a fusion SoC, a safety MCU and its own
    clock tree with fault pins into the safety MCU. Isolation is not drawn: everything here sits in the 12 V domain (est).
  groups:
    - {id: g1, label: "Front / corner radar (single-chip, 76-81 GHz)", col: 0, row: 0, blocks: [{fn: antenna, label: "Patch array (3 TX / 4 RX)"}, {fn: radar_transceiver, label: "Radar SoC: VCO, PA, LNA, ADC, DSP"}, {fn: crystal_oscillator, label: "40 MHz crystal"}, {fn: pmic, label: "Radar PMIC / bucks"}, {fn: can_transceiver, label: "CAN-FD (object list)"}, {fn: ethernet_phy, label: "100/1000BASE-T1 (object list)"}]}
    - {id: g2, label: "4D imaging radar (2-4 chip cascade)", col: 0, row: 1, blocks: [{fn: antenna, label: "12 TX / 16 RX, 86-element virtual array"}, {fn: radar_transceiver, label: "Master + slave radar chips"}, {fn: rf_passive, label: "20 GHz LO Wilkinson dividers (delay matched)"}, {fn: crystal_oscillator, label: "40 MHz reference at the master"}, {fn: clock_buffer, label: "40 MHz + frame-sync fan-out"}, {fn: pmic, label: "2 quad bucks, 5 V / 8 A in"}, {fn: temperature_sensor}, {fn: serdes, label: "Raw data out (CSI-2 bridge / serializer)"}]}
    - {id: g3, label: "Cameras (front, surround, mirror)", col: 1, row: 0, blocks: [{fn: camera_radar, label: "Image sensor + lens"}, {fn: serdes, label: "Serializer (FPD-Link / GMSL / A-PHY)"}, {fn: pol_buck, label: "Camera rails from power over coax"}, {fn: crystal_oscillator}]}
    - {id: g4, label: "Lidar", col: 1, row: 1, blocks: [{fn: optical_driver, label: "Pulsed laser driver"}, {fn: optical_tia, label: "APD / SPAD receiver + TIA"}, {fn: adc, label: "ADC / TDC"}, {fn: soc, label: "Lidar processor / FPGA"}, {fn: clock_generator, label: "Lidar timing"}, {fn: ethernet_phy, label: "Multi-gig Ethernet out"}]}
