design_rules:
  - {id: d1, area: "Regulatory (EU, 77-81 GHz)", rule: "Short-range radar in 77-81 GHz: mean e.i.r.p. density at most -3 dBm/MHz from the sensor and at most -9 dBm/MHz outside the vehicle, peak at most 55 dBm; the sensor must be mounted at a fixed position.", why: "Harmonised limits; the difference between sensor and outside-the-car limits is what the bumper or fascia must absorb, so bumper loss is part of the design.", refs: [r3], conf: high, kind: rule}
  - {id: d2, area: "Regulatory (EU, 77-81 GHz)", rule: "Keep out-of-band emissions at or below -30 dBm/MHz next to the operating range, and spurious emissions above 1 GHz at or below -30 dBm e.i.r.p.; spurious tests go up to 162 GHz (the 2nd harmonic).", why: "The LO and multiplier chain inside the radar SoC sets these; a clean, low-spur reference into the SoC helps (est).", refs: [r3], conf: high, kind: rule}
  - {id: d3, area: "Receiver robustness", rule: "The radar must keep its wanted performance with an unwanted CW signal of 10 dBm e.i.r.p. at 10 m in band and 20 dBm e.i.r.p. at fc +/- 4 GHz and fc +/- 12 GHz; receiver sensitivity itself is not specified.", why: "Other cars' radars are the main interferer in band; sensitivity is left to the maker because a long-range and a parking radar need very different levels.", refs: [r3], conf: high, kind: rule}
  - {id: d4, area: "4D radar: coherence", rule: "In a cascade, let one master chip feed the 20 GHz LO (passive, delay-matched Wilkinson network, no amplifiers with about 6 dBm LO outputs), the 40 MHz reference and the frame sync to every chip, including itself.", why: "All chips must chirp coherently for MIMO and beamforming; feeding the master's own LO back through the same network makes package and routing delays common. TI distributes the 40 MHz and sync with a low-jitter fan-out buffer.", refs: [r2], conf: high, kind: rule}
  - {id: d5, area: "4D radar: resolution", rule: "Size the array for the angular resolution the function needs: about 5 degrees (one chip, 3 TX / 4 RX) separates objects 8.5 m apart at 100 m; 12 TX / 16 RX (four chips, 86 virtual azimuth elements) gives about 1.4 degrees, and the 4-element elevation array about 18 degrees.", why: "Angular resolution grows with the number of virtual antennas; static objects at the same range and speed (a stopped car next to a lamp post) need imaging resolution.", refs: [r2, r4], conf: high, kind: rule}
  - {id: d6, area: "4D radar: calibration", rule: "Match the LO and clock path lengths on the board, then calibrate phase and gain per board with a corner reflector (1-2 square metres RCS) at 5 m or more on boresight; plan an extrinsic (radar-to-camera / lidar) calibration step as well.", why: "Chip-to-chip variation, path mismatch and antenna coupling spoil the virtual array; robust online extrinsic calibration is still an open research problem.", refs: [r2, r4], conf: high, kind: rule}
  - {id: d7, area: "Data links", rule: "Budget the raw-data link per radar: each cascaded chip sends up to 2.4 Gb/s (4-lane CSI-2 at 600 Mb/s per lane), so a four-chip radar moves up to about 10 Gb/s; a full 4D radar tensor can be about 200 MB per frame.", why: "Raw-data (satellite) radar moves processing to the central computer and needs SerDes or multi-gig Ethernet and PCIe bandwidth there; object-list radars need only CAN-FD or 100/1000 Mb/s Ethernet.", refs: [r2, r4], conf: high, kind: rule}
  - {id: d8, area: "Domain controller partition", rule: "Bring raw-data sensors (cameras, raw radar / lidar) in over SerDes with power over the signal coax, and object-data sensors (radar, lidar, ultrasonic modules) over Ethernet, CAN or LIN; give the computer a sensor-processing SoC, a fusion SoC and a separate safety MCU with its own supply.", why: "The public reference partition; power over coax needs per-channel switches and protection at the computer.", refs: [r1], conf: high, kind: rule}
  - {id: d9, area: "Clock tree", rule: "Feed the computer's PCIe, Ethernet and SerDes references from one any-frequency generator plus fan-out buffers; use spread spectrum (0.1-2.5 %, down or center) on PCIe domains where both ends share it, never on Ethernet / SerDes references or the radar reference.", why: "One generator replaces several XOs and buffers and spread spectrum lowers EMI; links with separate references and the radar's chirp synthesis need a clean fixed reference (our reading of the standards' rule, est).", refs: [r5, r1], conf: med, kind: rule}
  - {id: d10, area: "Clock safety", rule: "Route the clock generator's loss-of-signal and out-of-frequency fault outputs to the safety MCU, provide a redundant reference with switch-over, and know the fallback: in AlwaysOn mode the outputs stay within +/-5 % if both references fail.", why: "A clock fault in a driving computer must reach the safety manager; the data sheet describes the monitors and points to AN1292 for the fault handling.", refs: [r5, r1], conf: high, kind: rule}
  - {id: d11, area: "Temperature grade", rule: "Check the grade per location: AEC-Q100 Grade 2 (-40 to +105 C) suits a computer in the cabin; sensor heads behind the windshield or bumper and boards next to hot SoCs may ask for Grade 1 (125 C).", why: "Si5332-AM is Grade 2; the clock-tree case found Grade 1 competing clocks (est for where Grade 1 is required).", refs: [r5], conf: med, kind: consideration}
  - {id: d12, area: "Power", rule: "Plan the radar sensor's power as its own design: a four-chip cascade board takes 5 V at up to 8 A from the host and makes its rails with two quad-channel bucks; the computer's fusion SoC needs a multiphase core supply.", why: "Power grows with chip count; the reference splits system, processor, core and safety power.", refs: [r2, r1], conf: high, kind: rule}
  - {id: d13, area: "Sensor choice", rule: "Use radar where weather, darkness and glare matter and speed must be measured directly; lidar for the finest range and angle at higher cost and lower weather robustness; cameras for texture and colour; fuse them.", why: "The survey's comparison: 4D radar is high on range, velocity, lighting and weather robustness at moderate cost; lidar cannot measure velocity directly; cameras are weak in poor light and weather.", refs: [r4], conf: high, kind: consideration}
  - {id: d14, area: "In-cabin sensing", rule: "A cabin radar module is small: a 60 GHz radar SoC with its oscillator, flash and antennas, a PMIC from the battery, CAN with ESD protection, and a supervisor; one module covers child presence, occupancy, intrusion and vital signs.", why: "The public reference; the interior UWB key anchors are the alternative without an extra module (see the UWB topic and the child-presence case).", refs: [r6], conf: high, kind: consideration}
trends:
  - {id: t1, text: "Imaging (4D) radar: elevation and sub-degree azimuth from cascaded radar chips, more antennas per chip or metamaterial antennas, so radar can become a primary sensor rather than the camera's second opinion.", horizon: now, refs: [r2, r4], conf: high, for_us: "Cascades add a 40 MHz reference and sync fan-out per sensor: a socket for Si5335x-AM any-format buffers (case f-radar-an); single-chip 4D radars with more channels would remove it again (est)."}
  - {id: t2, text: "Satellite (raw-data) radar: the radar head only digitises and the central computer does the processing; data volumes reach several Gb/s per sensor and about 200 MB per 4D frame.", horizon: 2-3y, refs: [r4, r2, r1], conf: med, for_us: "Moves radar timing and bandwidth into the computer: more SerDes / Ethernet reference clocks and PCIe buffers there."}
  - {id: t3, text: "Centralised compute and zonal architecture: separate ADAS, parking and cockpit ECUs merge into a domain controller or central computer with several SoCs, a safety MCU and PCIe between processors, accelerators and storage.", horizon: 2-3y, refs: [r1, r5], conf: med, for_us: "The main socket for Si5332-AM, Si5225x-AM and Si5325x-AM; PCIe Gen 6 support and Grade 1 decide new wins (see the automotive clock-tree case)."}
  - {id: t4, text: "Learning-based radar processing: networks replace CFAR and beamforming steps and work on the radar tensor directly; linear-complexity models are favoured for real-time use.", horizon: 2-3y, refs: [r4], conf: med, for_us: "More processing and memory per radar in the computer; indirect for us (clocks and power of a larger computer)."}
  - {id: t5, text: "In-cabin sensing: 60 GHz radar modules for child presence, occupancy, intrusion and driver vital signs, with interior UWB anchors as a second route.", horizon: now, refs: [r6], conf: high, for_us: "QPF5100Q / DW3300Q in the key anchors can take this role without a radar module (case auto-uwb-cpd)."}
