order: 3
topic: auto_adas
title: "ADAS and sensing: 77 GHz and 4D imaging radar, cameras, lidar and the clock tree of the domain controller"
summary: >-
  A driver-assistance car carries radar (76-81 GHz, front and corners), cameras, sometimes lidar and ultrasonic corner
  sensors, all feeding a domain controller or central computer. Raw-data sensors (cameras, satellite radar) send their
  data over SerDes links with power over the same coax; object-data sensors (smart radar, lidar, ultrasonic modules)
  over Ethernet or CAN. The radar itself is a CMOS radar SoC with its own crystal: imaging (4D) radar cascades two to
  four chips, with one master chip handing a 20 GHz LO, a 40 MHz reference and a frame sync to the others, and sends
  several Gb/s of raw data to the host. The computer needs a clock tree (oscillator, generator, PCIe and fan-out
  buffers) with safety monitoring. That clock tree, the radar reference fan-out, the GNSS front end for lane-level
  positioning and UWB cabin sensing are where our catalogue parts sit; we have no radar MMIC today, and isolation is not
  a usual socket in this 12 V domain (est).
why_customer:
  - "Radar is still mostly the second opinion: a typical front radar resolves about 5 degrees (two objects 8.5 m apart at 100 m look like one), so the car brakes only when the camera agrees. Imaging radar at about 1.4 degrees aims to become a primary sensor in all weather (TI cascade design guide)."
  - "Each step to imaging radar and central compute adds links, clocks and power per car: four radar chips per sensor, several Gb/s per radar to the computer, PCIe between the computer's processors."
  - "In-cabin sensing (child presence, occupancy, driver vital signs) is driven by Euro NCAP points (see the UWB topic); a 60 GHz radar module or the interior UWB key anchors can do it."
