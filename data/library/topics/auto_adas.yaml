market:
  - {segment: "Radar modules", text: "About 166 M automotive radar modules in 2024 and about five radars per car by 2030 (Yole press release, Nov 2025, as quoted in the automotive clock-tree case; not one of the six references).", refs: [], conf: med}
  - {segment: "Clock content per ADAS computer (est)", text: "One generator, one or two PCIe buffers and one or two any-format buffers per domain controller or central computer, about $5-12 of timing at our prices (est); a cascaded imaging radar adds one buffer (about $1-2, est).", refs: [r1, r5], conf: low}
  - {segment: "Where the money is (est)", text: "The computer, not the radar head: radar timing is captive (crystal on the radar SoC), while central computers grow in clock outputs and PCIe generation. Figures are our reading, not a published number.", refs: [r2, r1], conf: low}
open_questions:
  - "Which PCIe generation (5, 6 or 7) and how many clock outputs do 2028-2030 ADAS computers use? (same question as the clock-tree case)"
  - "Does a 4D radar still use an external 40 MHz fan-out buffer when one chip has 12 TX / 16 RX or more, or does the need disappear?"
  - "Which temperature grade do radar and lidar heads need for their clocks: Grade 2 or Grade 1?"
  - "Lidar timing (laser pulse timing, TDC reference) was not read in a public source; is there a clock socket in the lidar head?"
  - "Camera SerDes (GMSL, A-PHY) reference-clock requirements were not read: ADI and the A-PHY specification were not requested."
  - "Is there any isolation socket in ADAS (e.g. a computer bridging to an HV domain)? We found none (est)."
