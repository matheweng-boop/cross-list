order: 2
topic: auto_uwb
title: "Automotive UWB: digital-key anchors, 802.15.4ab, cabin sensing and coexistence"
summary: >-
  A car with a phone-as-key carries several UWB anchors (802.15.4z HRP, channel 9 at about 8 GHz) that measure secure
  time of flight to the phone or fob; BLE or NFC wakes them, because European rules let a vehicle anchor transmit only
  after a trigger. Emissions are capped at -41.3 dBm/MHz mean and 0 dBm peak per 50 MHz, so range comes from receiver
  sensitivity, antenna placement and anchor count, not from transmit power. The next step, IEEE 802.15.4ab, adds a
  narrowband assist (NBA) radio in 5.725-5.850 and 5.925-6.425 GHz, multi-millisecond (MMS) ranging and a sensing mode,
  so the interior anchors can also detect a child left in the car. The main RF risks are collocated 6 GHz Wi-Fi 6E/7
  (now also IMT) and 5.9 GHz V2X: these are the points where filters, switches and LNAs make a difference.
# owner, 28 Oct 2026, on the child-presence page: "Driven by regulations - important." Short and factual; the sources
# are in the application knowledge item cpd_regulation (data/library/app_knowledge.yaml).
why_customer:
  - "Why it matters: regulation. Euro NCAP has rewarded child presence detection since 2023 and, from 2025, only direct sensing (the system senses the child's movement or breathing); in the 2026 protocol it is worth up to 5 points, with detection within 15 s of locking."
  - "ANCAP (Australia, New Zealand) has assessed CPD since 2023 (up to 4 points). In the US there is no direct-sensing mandate: the 2021 Infrastructure Act asks NHTSA for a rear-seat reminder, still not proposed in mid-2025."
  - "So every new European model that aims at five stars needs a direct sensor, and the interior UWB anchors of a digital-key car can be that sensor without an extra radar module (est)."
# application knowledge explainers shown on this page (owner, 28 Oct 2026, comments b-e)
knowledge: [cpd_regulation, anchors_tags, cpd_vs_ranging, qpf5100q_pairing]
