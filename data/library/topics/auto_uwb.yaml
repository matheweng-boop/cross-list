design_rules:
  - {id: d1, area: "Regulatory (EU)", rule: "Vehicle UWB access transmitters: mean e.i.r.p. spectral density at most -41.3 dBm/MHz and peak e.i.r.p. at most 0 dBm in 50 MHz, in 3.8-4.2 GHz and 6.0-8.5 GHz.", why: "Hard limit of the harmonised standard; range must come from the receiver, antennas and anchor count, not TX power (a UWB PA only makes up losses up to this cap).", refs: [r1, r3], conf: high, kind: rule}
  - {id: d2, area: "Regulatory (EU)", rule: "A vehicle anchor may transmit only after a trigger: as responder after receiving a UWB packet from the companion device (category 1A), or as initiator on a command from the vehicle (1B), after a BLE/NFC handshake or door-handle event.", why: "Trigger-before-transmit (Decision (EU) 2019/785, 2024/1467) is required for car anchors; it is why a BLE or NBA wake-up radio sits next to every UWB system.", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "Regulatory (EU)", rule: "In 3.8-4.2 GHz, fixed anchors and fobs must meet low duty cycle: Ton max 5 ms, mean Toff at least 38 ms per 1 s, sum of Ton below 18 s per hour (0.5 %); fobs in 6-8.5 GHz (category 2B) have no duty-cycle limit.", why: "Makes the high band (channels 5/9) the practical choice for keys; the 4 GHz band stays a constrained fallback.", refs: [r1], conf: high, kind: rule}
  - {id: d4, area: "Receiver sensitivity", rule: "Receiver baseline sensitivity: P at the EUT (including RX antenna gain) at most -111.3 dBm/MHz, i.e. 70 dB below the -41.3 dBm/MHz emission limit, for anchors and fobs.", why: "ETSI requires it so OEMs do not trade poor sensitivity for more anchors and more air traffic; body blockage of the phone is the design case. Front-end loss before the LNA eats directly into this.", refs: [r1], conf: high, kind: rule}
  - {id: d5, area: "Blocking / linearity", rule: "Anchors (Type 1) must keep full performance with a -85 dBm CW interferer and keep working (criterion 2) with -50 dBm, both inside the operating band and at fc +/-1 and +/-2 times the band width; fobs: -75 / -50 dBm.", why: "Sets the in-band and adjacent blocking a UWB front end (switch, LNA, filter) must survive; relevant interferers listed include 6-8.5 GHz radiodetermination and fixed links.", refs: [r1], conf: high, kind: rule}
  - {id: d6, area: "Channel plan", rule: "Design new car-access radios for UWB channel 9 (about 7.7-8.3 GHz) as the primary channel; treat channel 5 (6.2-6.8 GHz) as optional because Wi-Fi 6E/7 and IMT now share it.", why: "CCC says channel 9 is the only globally usable UWB channel left; WRC-27 agenda item 1.7 (7.125-8.4 GHz) could also put IMT next to or on it.", refs: [r3, r2], conf: med, kind: rule}
  - {id: d7, area: "Coexistence with Wi-Fi 6E/7", rule: "Do not rely on distance alone between a car's 6 GHz Wi-Fi and UWB anchors: combine frequency offset (UWB channel away from the Wi-Fi channel), frequency diversity, listen-before-talk (SSBD) and filtering of the Wi-Fi transmitter's out-of-band emissions.", why: "Studies in the 4ab coexistence document show severe impact from collocated 802.11, with in-band effects reported out to 946 m; Wi-Fi out-of-band emissions also hurt UWB.", refs: [r2], conf: high, kind: rule}
  - {id: d8, area: "Coexistence with Wi-Fi 6E/7", rule: "Expect an asymmetric link: UWB at 1 m is below -80 to -90 dBm/MHz, under Wi-Fi energy-detect thresholds, so Wi-Fi will not defer to UWB; the UWB side must sense and avoid.", why: "In lab tests, only 12 UWB devices transmitting continuously within 0.33 m of an 802.11ax AP reduced its throughput; realistic duty cycles below 5 % showed no impact.", refs: [r2], conf: high, kind: consideration}
  - {id: d9, area: "NBA radio (802.15.4ab)", rule: "An NBA front end must pass 5.725-5.850 GHz (UNII-3) and 5.925-6.425 GHz (UNII-5) with 2.5 MHz O-QPSK channels (up to 250, hopping), and must reject the 5.855-5.925 GHz V2X band that sits between them.", why: "The NB channel plan is defined in r2; the V2X gap and its high-power neighbour in the same car is our inference, so filter and switch linearity matter.", refs: [r2], conf: med, kind: consideration}
  - {id: d10, area: "Airtime", rule: "Budget NB and UWB ranging airtime at about 1.5-5 %; MMS uses fixed slots with no retries, so the MAC configuration gives a fixed upper bound on duty cycle.", why: "Keeps within regulatory duty limits and leaves at least 95 % of airtime to Wi-Fi and others; the 4ab compact PSDU and 500k/1M NB rates cut NB airtime by up to 38 %.", refs: [r2], conf: high, kind: rule}
  - {id: d11, area: "Security (STS receiver)", rule: "Do not take the first path from a simple CIR threshold; validate the first-path candidate against the STS with a false-acceptance target (FiRa: 1e-6 medium, 2^-48 high security) and do not correct the local clock from the received waveform.", why: "Thresholding receivers can be pushed to an early fake peak (distance-reduction / relay-style attacks); the reference receiver still finds the first path more than 99 % of the time at first-path SNR of -20 dB or better at 2^-48.", refs: [r4], conf: high, kind: rule}
  - {id: d12, area: "Front end and waveform", rule: "Preserve the TX and RX pulse across the full 500 MHz so the UWB pulse shape is kept (minimal precursor, as IEEE recommends): keep the switch, filter, LNA and PA chain phase-linear (flat group delay, low group-delay ripple) and its amplifiers well out of compression, so they add no echoes or interference.", why: "Secure ranging relies on detecting a weak first path below stronger taps, and a weak first tap is the most exposed to echoes, noise and interference; group-delay ripple creates pre-echoes that can fake an early path, and compression on the strong taps smears them over it. Owner confirmed (23 Oct 2026); the paper assumes a precursor-free pulse. See the engineering note UWB signal path.", refs: [r4], conf: med, kind: rule}
  - {id: d13, area: "In-cabin sensing (CPD)", rule: "For radar child presence detection on the interior anchor, detect slow-time changes of the channel impulse response (breathing) in about 10 s windows after removing the static mean; design for detection near -20 dB SNR, with margin for infants' smaller radar return.", why: "Measured: AUC 0.91 (ResNet) vs 0.87 (model-based) at -20 dB SNR for a still, breathing adult; removing the static part avoids false alarms from luggage.", refs: [r5], conf: high, kind: rule}
  - {id: d14, area: "In-cabin sensing (CPD)", rule: "Place cabin radar antennas under the roof near the A- and B-pillars, with antenna nulls facing each other to limit coupling; a small classifier (under 1e7 FLOPs) can run on the car's ECU.", why: "Arrangement used in the UWBCarGraz measurements in a hatchback and a minivan; the compact 1D ResNet variants stayed close to the best result.", refs: [r5], conf: med, kind: consideration}
  - {id: d15, area: "Antenna switch loss", rule: "Count switch insertion loss in the sensitivity budget: SKY5A2108 is 0.9 dB typical / 1.4 dB max in 7.125-8.3 GHz, with 17 dB minimum isolation; where a switch sits before the LNA, use a bypass LNA ahead of it at weak exterior positions.", why: "Every dB before the first gain stage adds to noise figure and reduces margin against the ETSI baseline sensitivity (d4); isolation limits AoA port-to-port leakage.", refs: [r6, r1], conf: med, kind: rule}
  - {id: d16, area: "Qualification", rule: "Anchor RF parts: AEC-Q100 Grade 2 (-40 to +105 C) or better, small packages (SKY5A2108 is 1.1 x 0.7 mm); handle up to +32 dBm input without damage near collocated transmitters.", why: "Anchors sit in mirrors, pillars, bumpers and the roof; the absolute-max input matters next to V2X and Wi-Fi antennas.", refs: [r6], conf: high, kind: rule}
trends:
  - {id: t1, text: "IEEE 802.15.4ab (NBA, MMS, sensing, LE-UWB, at least 50 Mb/s data) is in balloting: SA ballot from January 2026, RevCom planned December 2026 (PAR extension); FiRa and CCC are building 4ab into their specs, and ST and Calterah chips are sampling.", horizon: now, refs: [r2], conf: med, for_us: "A 4ab anchor SoC with an on-chip NBA radio is the gap in our UWB line (see case auto-uwb-15-4ab); the NBA band also creates a new 5.7-6.4 GHz filter/switch socket in every anchor."}
  - {id: t2, text: "Narrowband assist moves discovery, control and synchronisation off UWB onto an O-QPSK radio in UNII-3/UNII-5 so UWB is used only for MMS ranging fragments; trade press quotes up to 18 dB more link budget and up to 8x range (vendor claim, not verified here).", horizon: 2-3y, refs: [r2], conf: med, for_us: "Fewer BLE-only anchors and longer-range exterior positions; our UNII-3/5 filtering and V2X notch know-how (SKY5A1005, QPQ2230Q) maps directly onto the NBA path."}
  - {id: t3, text: "UWB spectrum squeeze: channel 5 lost to Wi-Fi 6E/7 and IMT; WRC-27 item 1.7 studies 7.125-8.4 GHz for IMT, which overlaps channel 9; CCC is lobbying against it.", horizon: 2-3y, refs: [r3, r2], conf: med, for_us: "More blocking resilience needed in the anchor receiver: higher-linearity LNA/switch and sharper filtering near 7-8.4 GHz; a selling point for an external anchor FEM."}
  - {id: t4, text: "Interior UWB anchors double as radar for child presence detection, intrusion and occupancy; 4ab adds a standard sensing mode, and ML on CIR data is the main research direction.", horizon: now, refs: [r5, r2], conf: high, for_us: "QPF5100Q already offers ranging plus radar on one automotive chip; competes with 60 GHz cabin radar on system cost (no extra module)."}
  - {id: t5, text: "Security is now judged at the receiver: published attacks (Cicada, ghost peak, adaptive fake-peak) against thresholding receivers, and a provable STS receiver with FiRa security levels (1e-6, 2^-48) that certification can test.", horizon: now, refs: [r4], conf: high, for_us: "UWB SoC firmware and certification must show the secure first-path test; front-end distortion must not hurt first-path detection."}
  - {id: t6, text: "New coexistence tools in 802.15.4ab: spectrum-sensing-based deferral (SSBD, LBT with linear backoff), enhanced detect-and-avoid, explicit channel-map exclusion and broadcast schedules other radios can follow.", horizon: 2-3y, refs: [r2], conf: high, for_us: "Partly replaces hardware filtering for in-band Wi-Fi; filters are still needed for out-of-band emissions and blocking."}
skyworks_fit:
  - {fn: uwb_soc, parts: ["QPF5100Q", "DW3300Q", "QM35825"], note: "QPF5100Q and DW3300Q are automotive (to 105 C) 802.15.4z parts; QM35825 has radar/ML but automotive grade is not stated. No public 802.15.4ab/NBA part yet."}
  - {fn: uwb_fem, parts: ["QM14068", "QM14070"], note: "QM14068 bypass switch + LNA 6.2-8.3 GHz (covers ch5 and ch9); QM14070 PA with bypass 6-9 GHz only makes up losses under the -41.3 dBm/MHz cap. Automotive grade not stated in the catalogue for either."}
  - {fn: rf_switch, parts: ["SKY5A2108", "QPC8019Q"], note: "SKY5A2108 AEC-Q100 Grade 2, 2.4-8.3 GHz, lists UWB and Wi-Fi 6E; QPC8019Q is specified only to 8.0 GHz, so it does not cover the top of ch9 (our reading). SKY13298-360LF (UWB SP2T) is last-time-buy."}
  - {fn: filter_saw_baw, parts: ["SKY5A1008", "SKY5A1005", "QPQ2230Q"], note: "Placed on the coexisting radios: SKY5A1008 6 GHz Wi-Fi BAW (5.945-7.125 GHz, 50 dB rejection to cellular/BT/UNII 1-3; rejection at UWB ch9 not stated); SKY5A1005 and QPQ2230Q V2X notch. No catalogued filter for the 4ab NBA band yet."}
  - {fn: v2x_fem, parts: ["QPF1004Q", "QPF1005Q"], note: "The V2X transmitter next to the NBA band; owning both sides helps with coexistence design-in."}
