block_diagram:
  name: "Phone-as-key car access with UWB anchors (802.15.4z today, 802.15.4ab next)"
  note: >-
    Drawn by us from r1-r6 and the repo cases (not copied). Exterior anchors range to the phone or fob on UWB channel 9;
    the interior anchor also runs radar for child presence. BLE today (the 802.15.4ab NBA radio next) wakes the anchors and
    carries control, as trigger-before-transmit requires. Anchors report to the access ECU or zone controller over CAN/LIN.
    Wi-Fi 6E/7 and 5.9 GHz V2X in the same car are the main interferers for the UWB and NBA receivers.
