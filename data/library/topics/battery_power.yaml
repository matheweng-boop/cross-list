topic: battery_power
title: "Battery and power distribution in the EV: BMS, battery disconnect, isolation monitoring and 12 V / 48 V zonal eFuses"
summary: "The high-voltage battery of an EV (400 V or 800 V) is watched by a battery management system: cell monitor ICs on every module measure each cell and pass the data along an isolated daisy chain (transformer or capacitor coupled) or, in newer packs, over a 2.4 GHz wireless link to the battery controller. The battery junction box (battery disconnect unit) holds the main contactors, a pre-charge path that fills the inverter capacitors slowly before the contactors close, a pyro-fuse that cuts the pack in a crash or a hard short, the pack current and voltage sensing and the insulation monitor that checks the HV rails against the chassis. Each of these crosses the HV / chassis barrier, so each needs an isolated amplifier, isolated switch driver, isolator or isolated bias supply, mostly in ASIL C / D safety chains. A DC-DC converter turns the HV battery into the 12 V (and more and more 48 V) low-voltage net, which zonal controllers now distribute with eFuses and smart high-side switches in place of melting fuses and relays. Skyworks fits the isolated sensing, isolated FET drivers, isolators and isolated DC-DC; the cell monitors, wireless BMS chips and the 12 / 48 V eFuses are gaps."
why_customer:
  - "The battery is the most expensive part of the car and the BMS decides how much of it can be used: cell voltage and current accuracy set the usable state-of-charge window, and a wrong reading can overcharge a cell (r1, est)."
  - "Safety: the pack must be disconnected on a fault, a crash or an insulation fault, and the measurement chains (current, HV voltage, insulation resistance) are ASIL C / D; TI now offers a pack monitor with current, voltage and insulation sensing in one ASIL-D-capable chip (r1)."
  - "Wiring and weight: the daisy-chain harness of a wired BMS is costly and a failure point; GM reports up to 90 % less pack wiring with a wireless BMS (r2)."
  - "Inrush: the inverter and charger capacitors must be pre-charged before the contactors close; solid-state pre-charge with an isolated switch driver replaces the pre-charge relay and resistor (r4, r5)."
  - "Zonal architectures move fuse protection into electronics: eFuses with I²t curves are resettable, report faults and allow thinner wires, so the fuse box and many relays go away (r3)."
references:
  - {id: r1, title: "BQ79631-Q1: Automotive high-voltage battery pack monitor with voltage, current and insulation resistance sensing (product page)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/product/BQ79631-Q1", type: app_note, licence: "TI copyright; internal summary with citation only", retrieved: 2026-11-02, why: "One public description of the whole battery junction box sensing job: pack current on a low-side shunt, HV voltages, insulation resistance, isolated differential daisy chain, ASIL D capability, and the claim that it removes the BJB safety MCU and CAN transceivers. Read for the current-sensing case (iso-current-sense-charging), reused here."}
  - {id: r2, title: "Wireless Battery Management Systems: Innovations, Challenges, and Future Perspectives (Z. Cao, W. Gao, Y. Fu, C. Mi; Energies 17(13), 3277, 4 Jul 2024)", publisher: "MDPI Energies (author copy, San Diego State University)", year: 2024, url: "https://chrismi.sdsu.edu/publications/223.pdf", type: paper, licence: "CC BY 4.0 (stated on the paper); summary and short quotes", retrieved: 2026-11-11, why: "Peer-reviewed review of wired vs wireless BMS: architectures, radio choices (BLE, Zigbee, NFC, Wi-Fi, cellular), commercial wBMS from ADI, TI, NXP and Dukosi (Table 3), GM Ultium as the first large-scale use, and the open issues (security, interference, no common standard). DOI 10.3390/en17133277; mdpi.com blocks our reader, so the authors' own copy was read."}
  - {id: r3, title: "Replacing Melting Fuses with TI Smart eFuse High-Side Switches (SDAA247, P. Shalton, Jan 2026)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/lit/pdf/sdaa247", type: app_note, licence: "TI copyright; internal summary with citation only", retrieved: 2026-10-28, why: "Explains why zonal cars drop melting fuses: 25 % derating plus temperature rerating (a 10 A fuse is good for about 6.8 A at 85 °C), wide opening times, no diagnostics; eFuse high-side switches with an I²t curve, resettable trip and fault reporting allow thinner wires and smaller connectors. Cached copy from the hot-swap report, re-read."}
  - {id: r4, title: "TPSI3050-Q1: Automotive reinforced isolated switch driver with integrated 10 V gate supply (product page; reference design TIDA-050063, solid-state active pre-charge)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/product/TPSI3050-Q1", type: app_note, licence: "TI copyright; internal summary with citation only", retrieved: 2026-10-23, why: "The competitor benchmark for the pre-charge and solid-state contactor socket: reinforced 5 kVrms, 1000 Vrms working, self-powered secondary (no isolated bias), $2.30 at 1k. Read for the hot-swap report (auto-hv-hot-swap), reused here."}
  - {id: r5, title: "AN1052: Selecting a FET For Use With the Si875x Driver (Rev. 0.1, 26 Jul 2021)", publisher: "Skyworks Solutions", year: 2021, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/an1052-selecting-fet-si875x-driver.pdf", type: app_note, licence: "Skyworks public document (own company); summary with citation", retrieved: 2026-10-23, why: "Our own isolated FET driver for custom solid-state relays: self-generated 8-12 V gate drive (no secondary supply), switching at or below 7.5 kHz, about 500 µs turn-on into 600 pF; FET choice by threshold, BVDSS with transient margin and thermal current limit. Cached in the BizDev app-note store."}
  - {id: r6, title: "Si8921/22 Isolated Amplifiers for Current Shunt Measurement, data sheet (Rev. 206437E, 10 Jun 2026)", publisher: "Skyworks Solutions", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si8921-22-datasheet.pdf", type: datasheet, licence: "Skyworks public document (own company); summary with citation", retrieved: 2026-11-11, why: "Isolation ratings we can quote for HV battery sensing: WB stretched SOIC-8 5 kVrms, VIOWM 1500 Vrms, VIORM 2121 Vpk, VIOTM 7070 Vpk, surge 10.4 kVpk, creepage and clearance 8.5 mm; NB SOIC-8 2.5 kVrms, 445 Vrms working, 4 mm; CMTI 50 min / 75 typ kV/µs; battery management named as an application. Cached copy (var/datasheets)."}
block_diagram:
  name: "EV battery and power distribution: BMS, battery junction box and 12 V / 48 V zones"
  note: "Drawn by us from r1-r6 and the battery diagrams already in the Block diagram library (TI, NXP and Renesas EV BMS, TI 12 V / 48 V battery, TI HV-to-LV DC-DC, TI power distribution box). Top row: the HV domain (pack, cell monitors, battery junction box, DC-DC primary); every arrow from it to the BMS controller or the chassis crosses a reinforced barrier. Bottom row: the 12 V / 48 V side (safety supply, insulation monitoring readout, zonal eFuses). Cell data goes over an isolated daisy chain or a 2.4 GHz wireless BMS (r2)."
