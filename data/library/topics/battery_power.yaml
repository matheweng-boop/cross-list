design_rules:
  - {id: d1, area: "Isolation rating (800 V)", rule: "Give every part that bridges the HV pack and the 12 V side reinforced isolation with a DC working rating above the full-charge pack voltage plus transients: for an 800 V pack (about 900 V full charge) a VIORM of about 2 kVpk is comfortable (r6: 2121 Vpk, 1500 Vrms working, 10.4 kVpk surge in WB SOIC-8). A narrow-body part (r6: 445 Vrms / 630 Vpk) is only basic at 400 V.", why: "The barrier is the shock protection between the pack and anything the driver or service can touch; DC stress is continuous for the life of the car.", refs: [r6, r4], conf: high, kind: rule}
  - {id: d2, area: "Creepage at 400 / 800 V", rule: "Plan PCB and package creepage for reinforced insulation at pollution degree 2: about 4 mm at 400 V and about 8 mm at 800 V (twice the basic value for material group I; check IEC 60664-1 and the OEM's own rule, often stricter for condensation in the pack). Use wide-body packages (r6: 8.5 mm) and slots or coating where the board is tight.", why: "Creepage, not the chip's kVrms rating, is often what limits a BMS or BJB board at 800 V; a package shorter than the board rule forces slots or conformal coating.", refs: [r6], conf: med, kind: rule}
  - {id: d3, area: "CMTI", rule: "Choose isolators and isolated amplifiers with CMTI of at least 50 kV/µs for BMS and BJB sense points, and 100 kV/µs or more for anything next to a SiC bridge (DC-DC, charger). r6 guarantees 50 kV/µs min (75 typ) and defines failure as more than 100 mV output error for 1 µs.", why: "Contactor closing, pre-charge and the DC-DC switching put fast common-mode steps across the barrier; a CMTI glitch is a wrong current or voltage reading in a safety chain.", refs: [r6], conf: med, kind: rule}
  - {id: d4, area: "ASIL / ISO 26262", rule: "Treat pack current, pack voltage, cell voltage and insulation resistance as safety measurements (typically ASIL C / D for overcharge, overcurrent and electric-shock goals). Use two independent current paths (shunt with isolated amplifier or monitor, plus a Hall or fluxgate sensor) and compare them, and use parts with a safety manual and FMEDA (r1 claims systematic and hardware capability up to ASIL D).", why: "A single current or voltage chain is a single-point fault for the overcharge and overcurrent safety goals; diversity gives decomposition and diagnostic coverage (est from the traction topic's method).", refs: [r1, r6], conf: med, kind: rule}
  - {id: d5, area: "Cell monitoring link", rule: "Isolate every module boundary of a wired daisy chain (transformer or capacitor coupled differential link) and run it in a ring so that one broken link does not lose a module. For a wireless BMS, budget for encryption and authentication, frequency hopping and a fall-back for lost packets, and check the latency against the fault-reaction time.", why: "The daisy-chain harness and connectors are the BMS's main mechanical failure point; a wireless link removes them but brings security, interference and certification questions, and there is no common protocol yet.", refs: [r2, r1], conf: med, kind: rule}
  - {id: d6, area: "Pre-charge", rule: "Pre-charge the DC link to about 95 % of pack voltage before closing the main contactors. A solid-state pre-charge uses a high-voltage FET or SiC switch with an isolated driver that makes its own gate supply (r4: reinforced, no secondary bias; r5: 8-12 V output, at or below 7.5 kHz, about 500 µs turn-on into 600 pF); pick the FET for BVDSS with transient margin and for its pulse SOA.", why: "Without pre-charge, the inrush into hundreds of µF at 800 V reaches kiloamperes and welds contactors; the pre-charge FET works in linear mode or PWM and must survive the energy pulse.", refs: [r4, r5], conf: high, kind: rule}
  - {id: d7, area: "Isolated FET driver voltage", rule: "Match the driver's gate voltage to the switch: r5's 8-12 V suits logic and standard MOSFETs and SiC cascode JFETs, not SiC MOSFETs that want 15-18 V. For an 800 V SiC pre-charge or solid-state contactor, use a reinforced driver with a higher gate supply.", why: "Under-driving a SiC MOSFET raises RDS(on) and heat during the pre-charge pulse.", refs: [r5, r4], conf: med, kind: rule}
  - {id: d8, area: "Insulation monitoring", rule: "Measure insulation resistance of HV+ and HV− to chassis by switching known resistors and reading the bridge voltage, with switches rated for the full pack voltage plus test voltages; compare with the usual 100 Ω/V (DC) and 500 Ω/V (AC) limits from ISO 6469-3 (standard not read). Integrated pack monitors now include this (r1).", why: "An undetected first insulation fault turns the chassis live on the second fault; the monitor must also survive HiPot and charger surge tests.", refs: [r1], conf: med, kind: rule}
  - {id: d9, area: "Pyro-fuse and disconnect", rule: "Fire the pyro-fuse from two sources: the airbag crash signal and the BMS overcurrent decision, with a squib driver that tests its loop. Keep the pyro-fuse and contactor decision independent of the main MCU where the safety goal needs it.", why: "Contactors cannot always break a short-circuit current at 800 V DC; the pyro-fuse is the last resort and must work when other electronics have failed (est).", refs: [r1], conf: low, kind: rule}
  - {id: d10, area: "12 V / 48 V zonal eFuse", rule: "Replace melting fuses with eFuse high-side switches that follow the wire's I²t curve: size the current rating without the 25 % fuse derating and temperature rerating, set nominal, I²t, fixed-delay and instant-trip levels, and use the diagnostic SPI so that the zone can report and retry faults.", why: "A fuse is chosen oversize (a 10 A fuse is good for about 6.8 A at 85 °C) and opens over two to three orders of magnitude of time, so the wire is oversize too; an accurate eFuse lets wire and connectors shrink.", refs: [r3], conf: high, kind: rule}
  - {id: d11, area: "Sense accuracy", rule: "Budget the pack-current chain as shunt tolerance plus amplifier offset, gain error and drift over −40 to 125 °C (r6: gain error ±0.2 %, offset 0.15 mV max at 25 °C on Si8921), and calibrate the shunt at end of line; use a modulator or ADC whose bandwidth catches short-circuit current for the pyro-fuse decision.", why: "Coulomb counting integrates offset error over hours; the SOC error eats usable battery range.", refs: [r6, r1], conf: med, kind: rule}
trends:
  - {id: t1, text: "800 V packs spread from premium cars to mid-range platforms. Every barrier part moves to reinforced isolation with a higher working voltage and wider creepage, and the pre-charge and disconnect switches move to SiC.", horizon: now, refs: [r6, r4], conf: med, for_us: "Si892x / Si893x / Si894x in WB SOIC-8 (5 kVrms, 1500 Vrms working, 8.5 mm) fit; our Si875x isolated FET driver is basic 2.5 kVrms only, so the 800 V pre-charge socket goes to TPSI3050-class parts (est)."}
  - {id: t2, text: "Wireless BMS replaces the daisy-chain harness: GM Ultium (with ADI) is the first large-scale use, TI, NXP and Dukosi offer chipsets, most on proprietary 2.4 GHz protocols.", horizon: 2-3y, refs: [r2], conf: med, for_us: "The radio is inside the pack at short range, so a front-end module is rarely needed (est). The isolation between cell monitors goes away, but the HV / LV barrier in the BJB and DC-DC stays. Watch the protocol and the security requirement."}
  - {id: t3, text: "Battery junction boxes integrate: one pack monitor measures current, HV voltages and insulation resistance and talks over the isolated daisy chain, removing the BJB's own MCU, CAN transceivers and some isolated amplifiers.", horizon: now, refs: [r1], conf: high, for_us: "Risk to discrete isolated amplifier sockets in the BJB (est). Our role shifts to the redundant path, the DC-DC and charger sense points, and the isolated bias."}
  - {id: t4, text: "Zonal architectures replace the fuse box and many relays with eFuses and smart high-side switches with I²t wire protection, at 12 V and on new 48 V low-voltage nets.", horizon: 2-3y, refs: [r3], conf: high, for_us: "Gap: no automotive eFuse or smart high-side switch in the Skyworks or Qorvo catalogue. Qorvo's ACT4910 / ACT85610 integrate eFuse FETs for power-loss protection, but they are not automotive."}
  - {id: t5, text: "Solid-state relays take over pre-charge and insulation-monitor switching, and are discussed for the main disconnect, driven by isolated switch drivers that make their own gate supply.", horizon: 2-3y, refs: [r4, r5], conf: med, for_us: "Si8751 / Si8752 are the right architecture at 400 V; a reinforced successor with a 12-18 V gate supply would cover 800 V SiC (the ask in the hot-swap report)."}
  - {id: t6, text: "Cell-to-pack and cell-to-body packs remove modules, so cell monitors sit on flexible circuits along the cells and the number of daisy-chain links falls (est).", horizon: 2-3y, refs: [r2], conf: low, for_us: "Fewer module-to-module isolators (not our socket today); no change to the BJB and DC-DC barrier (est)."}
skyworks_fit:
  - {fn: isolated_amplifier, parts: ["SI8921BD-AS4", "SI8922BD-AS4", "SI8931D-AS4", "SI8941AB-AS"], note: "Si892x shunt amplifiers for pack and DC-DC current, Si893x isolated voltage sensors for HV+, HV− and DC-link voltage, Si894x delta-sigma modulators where the BMS MCU has a sigma-delta filter. WB SOIC-8 options: 5 kVrms reinforced, 1500 Vrms working, 8.5 mm creepage (r6). CMTI 50 kV/µs min is lower than TI's newer parts (75-100 kV/µs)."}
  - {fn: isolated_switch_driver, parts: ["SI8751AB-AS", "SI8752AB-AS"], note: "Si875x automotive isolated FET drivers: solid-state pre-charge, insulation-monitor switches and active discharge with a self-generated 8-12 V gate drive (r5). Only 2.5 kVrms in NB SOIC-8, so basic insulation at 400 V; not enough for an 800 V reinforced barrier (TI TPSI3050-Q1 is 5 kVrms reinforced, r4)."}
  - {fn: digital_isolator, parts: ["SI86S600AE-AS4", "SI86S620BE-AS4"], note: "Si86Sx automotive isolators (6 kVrms in SSO-8) for SPI to an HV-side pack monitor, contactor and pyro commands and fault lines across the BJB barrier, and for control signals in the DC-DC."}
  - {fn: isolated_dcdc, parts: ["SI88620ED-AS", "SI88240BC-AS"], note: "Si88xx automotive isolators with an integrated DC-DC controller (external transformer, up to about 5 W): floating 5 V for HV-side sense amplifiers and the pre-charge circuit, plus two isolated signals. Si88620ED-AS is 5 kVrms."}
  - {fn: gate_driver, parts: ["SI82B40ABC-AS", "SI8285BD-AS", "SI8233BD-AS"], note: "Isolated gate drivers for the HV-to-LV DC-DC primary bridge: Si82Bx (6 kVrms reinforced, 200 kV/µs) for 800 V SiC, Si8285 (DESAT, basic) or Si823x half-bridge drivers for 400 V designs."}
  - {fn: wide_vin_buck, parts: ["ACT4751MQI101"], note: "Qorvo ACT4751M, automotive-grade programmable buck with bias rails (4.5-40 V in): a possible supply for zone controller MCUs on the 12 V net. It is the only automotive Qorvo power part in our catalogue data."}
  - {fn: efuse_hotswap, parts: [], note: "Gap: no 12 V or 48 V automotive eFuse, smart high-side switch or high-side FET controller. Qorvo ACT4910 / ACT85610 integrate eFuse FETs for SSD power-loss protection (not automotive). See the hot-swap report."}
  - {fn: battery_monitor, parts: [], note: "Gap: no cell monitor, pack monitor or wireless BMS chipset; these belong to TI, ADI, NXP, Infineon, ST, Renesas and Dukosi (r1, r2)."}
  - {fn: current_sensor, parts: [], note: "Gap: no coreless Hall or fluxgate current sensor for the redundant pack-current path; the shunt path is covered by Si892x / Si894x."}
competitors:
  - {fn: battery_monitor, names: ["TI BQ79616-Q1, BQ79631-Q1 / BQ79731-Q1 (pack monitor with current and insulation sensing, r1)", "ADI (wired BMS and the GM Ultium wireless BMS: ADRF8850 / ADRF8800, r2)", "NXP MC33771 cell controller with KW37 / KW38 for wBMS (r2)", "Infineon, ST, Renesas (est, not read)", "Dukosi (one radio-equipped monitor per cell, near-field bus antenna, r2)"], note: "Cell and pack monitors are the core of the BMS and come with the daisy-chain and wireless links; we sell around them, not into them."}
  - {fn: isolated_switch_driver, names: ["TI TPSI3050-Q1 (reinforced, 10 V self-powered gate drive, TIDA-050063 pre-charge, r4)", "TI TPSI2140-Q1 (1200 V isolated switch for insulation monitoring, from the hot-swap report)", "Infineon solid-state isolators (est)"], note: "TI owns the reinforced solid-state pre-charge and insulation-monitor sockets with reference designs; our Si875x is basic only."}
  - {fn: isolated_amplifier, names: ["TI AMC1302-Q1, AMC3302-Q1 (integrated DC-DC), AMC0x02 (from the current-sensing case)", "ADI (est)", "Infineon XENSIV coreless Hall for BDU current (from the current-sensing case)"], note: "TI's integrated isolated power and higher CMTI are the benchmark; integrated pack monitors (r1) take part of the socket."}
  - {fn: efuse_hotswap, names: ["TI TPS2HCS10-Q1 smart eFuse high-side switch, TPS4811-Q1 / TPS1213-Q1 high-side FET drivers (r3 and the hot-swap report)", "Infineon PROFET and SPOC Wire Guard, 2ED4820-EM 48 V driver", "ST VIPower, NXP, onsemi (est)"], note: "Zonal eFuses are a crowded market led by TI and Infineon."}
  - {fn: relay_driver, names: ["Contactor and pyro-fuse makers: TE, Sensata, Panasonic, Littelfuse, Eaton, Mersen, Autoliv (named from general knowledge, est)"], note: "Mechanical disconnect parts; customers or partners, not competitors."}
market:
  - {segment: "Method", text: "Estimated market for the isolation and sensing parts in the EV battery and power distribution, by socket: cars a year x content per car. No market report was read; every number is our estimate (est).", refs: [], conf: low}
  - {segment: "EV volume (est)", text: "About 20 M battery-electric and plug-in hybrid cars a year in 2025-2026, rising (est from public sales figures used in the current-sensing case; IEA not re-read).", refs: [], conf: low}
  - {segment: "BJB / BMS isolation content (about $80-200 M, est)", text: "Per car: 2-4 isolated amplifiers or modulators (pack current, HV voltages), 1-3 isolated switch drivers (pre-charge, insulation monitor, discharge), 1-3 isolators and 1-2 isolated bias supplies: about $4-10 per car (est). Integrated pack monitors (r1) can halve the amplifier count (est).", refs: [r1, r6], conf: low}
  - {segment: "HV-to-LV DC-DC (about $40-100 M, est)", text: "One DC-DC per EV: 2-4 isolated gate-driver channels across the barrier, 1-2 isolated sense points, 1-2 isolators: about $2-5 per car (est). Often integrated with the on-board charger.", refs: [r6], conf: low}
  - {segment: "12 V / 48 V zonal eFuses (gap, est)", text: "Tens of eFuse and smart high-side channels per zonal car at well under $1 each: likely larger than the isolation sockets above, and in every car, not only EVs, but we have no product (est).", refs: [r3], conf: low}
open_questions:
  - "Does the BU plan a reinforced Si875x successor with a 12-18 V gate supply for 800 V SiC pre-charge and solid-state contactors? (Same ask as the hot-swap report.)"
  - "How many isolated amplifiers stay in an 800 V battery junction box once integrated pack monitors (BQ79631 class) measure current, voltage and insulation? Which OEMs still want a discrete redundant path?"
  - "Is CMTI 50 kV/µs min (Si892x / Si893x) enough in a BJB next to SiC pre-charge and DC-DC switching, or do customers ask for 100 kV/µs as TI offers?"
  - "Wireless BMS: is there any role for a 2.4 GHz front end or for our timing parts in GM / ADI, TI or NXP wBMS designs, or is the radio always on the BMS chip (est: no FEM)?"
  - "Which creepage rule do OEMs apply in the battery pack at 800 V (8 mm reinforced, PD2, or more for condensation)? ISO 6469-3 and the OEM rules were not read (paid)."
  - "Is a 12 V / 48 V automotive eFuse worth a Qorvo / Active-Semi power project, building on the eFuse FETs of the ACT4910 / ACT85610 PLP ICs?"
