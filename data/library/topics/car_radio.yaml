market:
  - {segment: "Volume", text: "About 90-92 M radio systems a year, flat; light-vehicle production 92.1 M in 2026 (S&P Global Mobility, in the radio-tuner-next case). Growth comes from content per car, not units (est).", refs: [], conf: med}
  - {segment: "Radio content (tuners + demodulators)", text: "Analyst figures span $0.89-2.31 B (2024); the case keeps that band and does not project it (est: analyst press releases, low confidence). Public list prices: tuners $4.60-10, decoders $16-19 (snippets, far above contract prices).", refs: [], conf: low}
  - {segment: "Digital radio mix", text: "DAB+ in most new European cars (4.4 M DAB cars sold in 2018 in WorldDAB's count, r5); HD Radio in more than 60 % of new US cars; DRM in about 1 in 3 Indian cars; China's CDR/DRM mandate drafted, not adopted (case background).", refs: [r5], conf: med}
  - {segment: "Remote tuner modules (est)", text: "A premium and multi-region niche of about 2-5 M a year by 2030 (est); no public module volumes were found.", refs: [r6], conf: low}
  - {segment: "Software radio (est)", text: "About 3-5 M new cars a year by 2030, 3-5 % of production (est); the tuner socket stays, the demodulator socket shrinks.", refs: [], conf: low}
open_questions:
  - "EN 303 345-4 (DAB) and -2 (AM) limits were not read in this run; only the FM part (r4)."
  - "EN 55032 clause 13.4 (car-radio conducted emissions) limits were not read; is our tuner's antenna-port emission margin documented?"
  - "Does AMIC run on the Si4790x tuners and as software on a cockpit processor (case radio-tuner-next feature f-amic-sw)?"
  - "Which network link do module makers want next: A2B 2.0 or automotive Ethernet, and do they want decoded audio or raw I/Q?"
  - "Current WorldDAB in-car guidelines (2025 draft) were not read; the 2019 version 2 is the reference here."
  - "Is QPC8010Q AEC-Q qualified (catalogue flag empty), and which SDARS LNA is the current recommendation?"
