design_rules:
  - {id: d1, area: "Regulatory (EU)", rule: "An FM receiver with an external antenna input must reach 40 dB audio SNR (no clicks for 10 s) at -90 dBm conducted at 98 MHz; with an integral antenna the field-strength limit is 50 dBµV/m (relaxed to 67 dBµV/m).", why: "EN 303 345-3 table 2 is the harmonised limit under article 3.2 of the Radio Equipment Directive; it is set from the broadcast planning rules (ITU-R BS.412). A car radio meets it easily; it is the floor, not the target.", refs: [r4], conf: high, kind: rule}
  - {id: d2, area: "Regulatory (EU)", rule: "With a wanted FM signal at -84 dBm conducted, the receiver must tolerate a noise-modulated FM signal 3 dB stronger at +/-200 kHz, 17 dB at +/-300 kHz and 30 dB at +/-400 kHz, and an AM blocker 30 dB stronger at +/-800 kHz.", why: "EN 303 345-3 tables 3-4: eight offsets per test; the wanted level is 6 dB above the sensitivity limit. Front-end linearity and channel filtering set the margin (est).", refs: [r4], conf: high, kind: rule}
  - {id: d3, area: "Regulatory (EU)", rule: "Conducted spurious emissions of a car radio at its antenna port are tested to the car-radio clause of EN 55032 (13.4), not the clause for other receivers.", why: "The tuner's synthesizers and the digital parts leak to the antenna port; car radios have their own limits because the antenna sits close to other vehicle receivers (our reading).", refs: [r4], conf: high, kind: rule}
  - {id: d4, area: "Tuner count", rule: "Plan at least two tuners per broadcast standard in mid and premium radios: one for listening (with FM phase diversity or HD/DAB MRC across two antennas when both tuners work together), one for background scanning and data.", why: "WorldDAB names dual DAB tuners as needed for a dynamic, accurate station list and good DAB performance; the dual tuner does phase diversity and MRC only with two tuners.", refs: [r5, r1], conf: high, kind: rule}
  - {id: d5, area: "Service following", rule: "Implement service following (FM-DAB, DAB-DAB, and IP when the car is connected) on by default per ETSI TS 103 176, with an importer option to turn off explicit DAB-FM linking where PI and SId codes are not set up.", why: "Drivers want to keep their station; the coprocessor links up to four audio streams (FM/DAB/DAB/IP) with time and level alignment, so the switch is not heard.", refs: [r5, r2], conf: high, kind: rule}
  - {id: d6, area: "Tuner-demodulator interface", rule: "Send I/Q from each tuner to the demodulator on its own ZIF pair with shared clock and frame sync; route the main channel and the background channel separately and keep the capacitive load on each ZIF and clock line inside the tuner's limit.", why: "The tuner has two ZIF I/Q outputs (one per radio DSP) and the coprocessor takes up to four channels; the site's broadcast configurator gives the owner's load budgets (about 30 pF per ZIF net, 50 pF on the clock output) and a star clock from one 36.864 MHz reference.", refs: [r1, r2], conf: med, kind: rule}
  - {id: d7, area: "Sample rates", rule: "Size the I/Q link for the standard: about 744 kS/s for an HD Radio channel, 2.048 MS/s for DAB and 192 kS/s for DRM per channel.", why: "The coprocessor variants are specified at these rates; DAB needs the widest link, which matters when samples leave the module over a network (est).", refs: [r2], conf: high, kind: rule}
  - {id: d8, area: "Bands", rule: "Cover FM 64-108 MHz (Japan and Eastern Europe low band included), AM 520-1710 kHz, LW 144-288 kHz, SW 2.3-30 MHz, DAB Band III 168-240 MHz and the NOAA weather band in one global design; region is then set by software and licence.", why: "One board for all regions is the scaling argument of the tuner family; the RF switch and filters in front must pass the same span (est).", refs: [r1, r2], conf: high, kind: rule}
  - {id: d9, area: "EV noise (AM)", rule: "In electric and hybrid cars, budget for AM interference from the drive train in software: cancel one-sided interference by replacing it with the opposite sideband, plus noise blanker and AGC step compensation, before adding filters or shielding.", why: "AMIC suppresses noise from 50 Hz to 5 kHz, reacts within 10 ms and lifted audio SINAD from 5 dB to 20 dB in lab tests with field-like noise; it is a licence on the existing tuner, no extra hardware.", refs: [r3], conf: high, kind: consideration}
  - {id: d10, area: "Antenna", rule: "Treat the antenna as the first performance limit: prefer roof or well-placed glass antennas with an amplifier near the antenna, and check DAB coverage on test routes; non-roof antennas lose sensitivity.", why: "WorldDAB's performance group names lower-sensitivity non-rooftop antennas and rising interference as the main threats to in-car DAB.", refs: [r5], conf: med, kind: consideration}
  - {id: d11, area: "Remote tuner module", rule: "A tuner module at the antenna needs: 9-18 V input with reverse-polarity protection, an 8-10 V phantom supply for distant antennas, antenna diagnosis, a thermal path to the body and derating above 85 °C, and a digital link (A2B, Ethernet as option) carrying control, audio, data and firmware updates.", why: "Specification of a production off-the-shelf module: 3.2-5 W, -40 to +85 °C full function, reduced features to +95 °C, IP5K0, about 190 g.", refs: [r6], conf: high, kind: rule}
  - {id: d12, area: "Remote tuner module", rule: "Put the demodulator in the module when the head unit should carry no radio silicon; its data-stream interface packs non-audio data for A2B or a DSP over I2S, and self-boot from flash with OTA updates keeps it independent.", why: "The coprocessor lists remote tuner modules and smart antennas as an application and needs no external RAM.", refs: [r2, r6], conf: med, kind: consideration}
  - {id: d13, area: "Power and qualification", rule: "Supply the tuner with 3.3 V analog and 1.8 V digital (I/O at 1.8 or 3.3 V) from low-noise rails, and use AEC-Q100 qualified (A-grade) radio parts.", why: "Data-short supply plan; the A-grade parts are AEC-Q100 qualified. Switching regulators should run outside the AM band or be filtered (est).", refs: [r1], conf: high, kind: rule}
trends:
  - {id: t1, text: "The radio moves out of the head unit: remote tuner modules at the antenna send digital audio over A2B or Ethernet and replace antenna amplifiers and coax; they are sold off the shelf in Europe, US and global variants.", horizon: now, refs: [r6, r2], conf: high, for_us: "Our split tuner + coprocessor fits the module; the case radio-tuner-next proposes a radio node (tuners + decoder + network output) in one package."}
  - {id: t2, text: "Electric drives raise AM interference; carmakers weigh dropping AM, while software cancellers keep it usable for public-safety alerts.", horizon: now, refs: [r3], conf: high, for_us: "AMIC is a licence on Si4796x/7x/8x tuners and is listed as compatible with SDR, cockpit and remote-tuner systems: a differentiator to extend across the family."}
  - {id: t3, text: "Hybrid radio: FM, DAB and IP work together (RadioDNS), with one station list and automatic best-signal selection; voice control on top.", horizon: now, refs: [r5, r2], conf: med, for_us: "Seamless linking with an IP stream is on the coprocessor; the value shifts to software and linking quality."}
  - {id: t4, text: "Digital radio by law: EU car radios must receive digital terrestrial radio from the end of 2020; DAB+ is standard in most new European cars.", horizon: now, refs: [r5], conf: high, for_us: "Raises DAB content per car in Europe; China (CDR) and India (DRM or HD) are the next regulatory steps (see the radio-tuner-next case)."}
  - {id: t5, text: "Software radio: tuners send I/Q to the cockpit processor, which demodulates; the tuner stays, the demodulator chip may go.", horizon: 2-3y, refs: [r1, r2], conf: med, for_us: "Our tuners already output I/Q; keep a sample mode and partner software so we win the tuner socket even without our demodulator (est)."}
  - {id: t6, text: "Receiver rules tighten in Europe: harmonised standards now set minimum sensitivity, selectivity and blocking for every broadcast receiver, with radiated and conducted limits to be unified.", horizon: 2-3y, refs: [r4], conf: med, for_us: "A compliance point for cheap aftermarket and software radios; our tuners exceed the limits (est)."}
