block_diagram:
  name: "Car radio from antenna to speaker: dual tuners, digital-radio demodulator, head unit or remote tuner module"
  note: >-
    Drawn by us from r1-r6 and the site's Car radio tuner system diagram (not copied). Two antennas (roof and glass or
    window) feed antenna amplifiers powered over the coax; an RF switch or diplexer splits AM/FM/DAB from SDARS and
    GNSS on a shared antenna. Two tuners give FM phase diversity or digital MRC; a third tuner or second channel scans in
    the background. The tuners send I/Q samples to the demodulator, which decodes HD Radio, DAB/DAB+, DRM or CDR and
    links to FM or IP; audio goes over I2S/TDM to the head unit or out over A2B/Ethernet when tuners and demodulator sit
    in a remote tuner module at the antenna. The traction inverter, DC-DC converter and charger are the AM noise
    sources the tuner software has to cancel.
