order: 17
topic: car_radio
title: "Car radio: AM/FM and digital-radio tuners, demodulators, antenna diversity, EV noise and the remote tuner module"
summary: >-
  Almost every new car still has a broadcast radio: about 90-92 M radio systems a year. A car radio is a chain from
  the glass or roof antennas (with antenna amplifiers on long coax runs) to two or more tuners, a digital-radio
  demodulator for HD Radio, DAB/DAB+, DRM or CDR, and then the head unit's audio path. Two tuners are the norm, not a
  luxury: one for FM phase diversity or digital MRC on two antennas, one for background scanning so the station list
  stays current and the radio can follow a station from DAB to FM to IP. The receiver must meet the EU harmonised
  standard for broadcast receivers (FM: -90 dBm conducted sensitivity, adjacent-channel and blocking limits). Three
  forces change the design: electric drives that swamp AM with interference, digital radio by law in EU cars, and the
  move of the radio from the head unit to a remote tuner module at the antenna or into software on the cockpit
  computer. Skyworks sells the core of this chain (automotive tuners and digital-radio coprocessors); Qorvo adds
  switches, SDARS LNAs and a 12 V buck.
why_customer:
  - "Radio is still expected in the car: a WorldDAB survey quotes 82 % of people saying they would not buy a car without one, and 75 % of in-car audio being live radio (r5, 2019)."
  - "The law sets the floor: EU car radios must receive digital terrestrial radio since the end of 2020 (r5), and every receiver sold in the EU must meet the EN 303 345 limits for sensitivity, selectivity and blocking (r4)."
  - "Electric drives make AM hard to hear; some carmakers dropped AM, others keep it for public-safety alerts, so a software noise canceller that needs no extra hardware is worth a licence (r3)."
  - "Head units are crowded and hot; moving the radio to the antenna removes antenna amplifiers and coax and cuts head-unit variants (r6)."
  - "One tuner family and API from a single-tuner entry radio to a multi-tuner, multi-antenna premium radio lets the Tier-1 reuse one board and one software stack (r1, r2)."
