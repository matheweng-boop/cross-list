design_rules:
  - {id: d1, area: "Variable speed everywhere", rule: "Put every compressor, pump and fan on a variable-speed drive (VFD or EC motor) and control the speed, not a valve or damper.", why: "Deschutes controls pump speed by default to hold a fixed pressure difference, with fixed flow, supply or return temperature as options; at part load a slower motor saves most of the energy (affinity laws, our reasoning, est).", refs: [r2], conf: high, kind: rule}
  - {id: d2, area: "Motor drive efficiency", rule: "Use sensorless FOC with sinusoidal current, low-loss switches (SiC on the 600-800 V DC link, GaN on 48 V fan and pump drives) and size the drive for the operating point where it spends most hours, not the peak.", why: "TI recommends GaN for the CDU fan drive 'to ensure low-loss operation at high switching frequencies'; the drive's own losses add to the cooling load it serves (est).", refs: [r1, r3], conf: med, kind: consideration}
  - {id: d3, area: "Power quality", rule: "Give large drives a power-factor front end: Deschutes asks 0.98-1.00 power factor, voltage THD under 8 % (5 % per harmonic) and current THD under 20 % from 50 to 100 % load, with ride-through to the CBEMA curve.", why: "IEEE 519 guidance in r2; a PFC (or active front end) sits before the inverter in TI's outdoor unit and CDU diagrams.", refs: [r2, r3], conf: high, kind: rule}
  - {id: d4, area: "Isolation for 3-phase drives", rule: "Reinforce the barrier between a 380-480 V three-phase drive and anything a person or the network can touch (controller, RS-485, Ethernet); use isolated gate drivers for the high side, isolated amplifiers for current and DC-link voltage and an isolated bias supply.", why: "IEC 62368-1: between a hazardous ES3 source and touch-safe ES1 a double or reinforced safeguard is needed (r6); TI draws isolated gate drivers in the outdoor unit power stage and isolation between motor and application controller (r3).", refs: [r6, r3], conf: high, kind: rule}
  - {id: d5, area: "Overvoltage category and creepage", rule: "Treat chillers, air handlers and row CDUs fed from the main distribution as OVC III (4000 V transients at 277/480 V, 6000 V at 400/690 V) and in-rack equipment as OVC II (2500 V); at 6000 V a reinforced clearance of 8.0 mm is needed, which a wide-body SOIC-16 isolator gives.", why: "AN1456 zones; placing cooling plant in Zone 2 / OVC III is our reading (est).", refs: [r6], conf: med, kind: rule}
  - {id: d6, area: "Gate-driver protection", rule: "On IGBT and SiC compressor and pump inverters choose isolated gate drivers with desaturation (DESAT) short-circuit protection, soft shutdown, UVLO and high CMTI (100 kV/µs class for SiC).", why: "A shorted motor winding or a shoot-through must not take down a cooling unit that has no spare; CMTI keeps the fast SiC edges from corrupting the gate signal (our reasoning, est).", refs: [r3, r6], conf: med, kind: rule}
  - {id: d7, area: "Current sensing", rule: "Measure two or three phase currents with isolated shunt amplifiers or modulators for FOC and overcurrent, and the DC-link voltage; report pump power per pump.", why: "TI's CDU pump and fan drives include current sense; Deschutes asks the power consumption of each pump as telemetry.", refs: [r1, r2], conf: high, kind: rule}
  - {id: d8, area: "Sensor accuracy", rule: "Specify calibrated sensors: absolute pressure and temperature on every manifold (supply and return, both loops), a flow meter at ±0.5 % of reading validated against a calibrated meter, valve position, pump speed in RPM and percent.", why: "Deschutes telemetry list and validation plan; the controller runs the pumps on a pressure difference and the valve on a 3 °C approach temperature, so sensor error becomes cooling error.", refs: [r2], conf: high, kind: rule}
  - {id: d9, area: "Redundancy", rule: "Build N+1 pumps (each with its own VFD and breaker), at least one and preferably two power feeds, and make redundant pumps and non-critical parts (HMI, possibly the controller) replaceable while the CDU runs.", why: "Deschutes 3.2 and 7.2: CDU output water is a high-availability resource.", refs: [r2], conf: high, kind: rule}
  - {id: d10, area: "Hot-swap and interlocks", rule: "Protect each replaceable drive with hot-swap / eFuse and connector short pins as enables, plus mechanical interlocks so a module is de-energised before it is pulled.", why: "Deschutes asks finger-safe connectors and short pins to stop arcing; TI's CDU drives show a hot-swap block on each motor drive.", refs: [r2, r1], conf: high, kind: rule}
  - {id: d11, area: "Leak detection", rule: "Run leak rope sensors in zones (three in Deschutes) into the PLC, put drip pans with leak detection under overhead water pipes and rear doors, and send the alarm to the building system.", why: "r2 3.2 and 18.12; TI lists leakage sensing among the CDU sensors (r1).", refs: [r2, r1], conf: high, kind: rule}
  - {id: d12, area: "Personnel protection", rule: "Fit a 10 mA GFCI on the incoming AC of a CDU and fuse each line (80-100 A class J at 37 kW per pump).", why: "Deschutes power section: 38 kW at 342 V gives about 64 A per phase.", refs: [r2], conf: high, kind: rule}
  - {id: d13, area: "Controller links", rule: "Offer Modbus TCP (IPv4 and IPv6) or Redfish on Ethernet to the facility, and isolated RS-485 (Modbus RTU) between the main controller and the pump drives; air handlers and chillers add BACnet MS/TP or BACnet/IP.", why: "TI CDU page (RS-485 Modbus or Ethernet Redfish; RS-485 to the subsystems, often isolated); Deschutes 7.2.3; BACnet / Modbus for HVAC from TI's HVAC motor control page (est for chillers).", refs: [r1, r2], conf: high, kind: rule}
  - {id: d14, area: "Fan walls", rule: "In a rack fan wall, monitor the input power (I2C power monitor), buffer the PWM and tach lines and switch each fan with its own FET under one MCU; mains EC fans carry their own 600 V drive and take a 0-10 V or Modbus speed command.", why: "TI fan card / module / wall subsystems (r4); the EC-fan split is our reading (est).", refs: [r4], conf: med, kind: consideration}
  - {id: d15, area: "Monitoring", rule: "Add a watchdog, supply supervisors and board temperature sensing to every controller and drive, and alarm on motor over-temperature.", why: "TI's CDU and outdoor-unit diagrams both have a monitoring subsystem; Deschutes asks alarms for leaks and motor over-temperature.", refs: [r1, r2], conf: high, kind: rule}
trends:
  - {id: t1, text: "From air to liquid: direct-to-chip cold plates fed by CDUs become the default for AI racks; OCP folded cold plate, CDU, door heat exchanger and immersion work into one Cooling Environments project.", horizon: now, refs: [r5, r2], conf: high, for_us: "Each CDU adds two or more high-power pump drives (isolated gate drivers, isolated amplifiers, isolators, isolated RS-485) per row of racks; the content per MW of IT grows (est)."}
  - {id: t2, text: "CDUs grow to megawatt class: Deschutes is 2 MW, 500 GPM, with two 37 kW pump VFDs and an open specification any supplier can build to.", horizon: now, refs: [r2], conf: high, for_us: "Open specifications let new CDU makers enter; they buy drive and isolation parts rather than complete VFDs over time (est)."}
  - {id: t3, text: "Warmer coolant (the OCP '30 °C coolant' roadmap) and heat reuse cut chiller hours; more of the cooling energy moves from compressors to pumps and fans.", horizon: 2-3y, refs: [r5], conf: med, for_us: "Fewer compressor hours but more pump and fan drives; EC fans and pumps with one-chip controllers (PAC5556, PAC5532) fit (est)."}
  - {id: t4, text: "Immersion (single- and two-phase) and two-phase cold plates remove most server fans; pumps, condensers and leak / level / fluid sensing remain.", horizon: 5y+, refs: [r5], conf: low, for_us: "Server fan drives shrink; the pump drive, sensing and isolated link content stays (est)."}
  - {id: t5, text: "48 V and 800 V DC: rack fans and small pumps run on the 48 V bus with GaN drives, and 400 V / 800 V DC distribution could one day feed cooling drives directly without a PFC.", horizon: 2-3y, refs: [r1, r6], conf: low, for_us: "48 V: PAC5527 / PAC5532 / ACT72350 plus our isolators; 800 V DC: reinforced isolated gate drivers and isolated sensing as in the rack power sub-system (est)."}
  - {id: t6, text: "Rear-door heat exchangers bridge air-cooled halls to higher densities (OCP door heat exchanger work on Open Rack V3, active doors with fans).", horizon: now, refs: [r5, r2], conf: med, for_us: "Active doors add a fan row, a valve and sensors per rack: the fan-wall parts again (est)."}
