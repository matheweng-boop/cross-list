order: 14
topic: dc_cooling
title: "Data-center cooling and HVAC: air handlers, chillers, fan walls and liquid cooling for AI racks"
summary: "Almost all the power a data center feeds its processors comes back out as heat, so cooling is the largest load after the IT itself. Air cooling uses computer-room air handlers (CRAH) on chilled water, air conditioners with their own compressor (CRAC), chillers and fan walls. AI racks have outgrown air: Google's open CDU specification plans for 90 kW per rack position and a 2 MW coolant distribution unit (CDU) with two 37 kW pump drives, and the Open Compute Project now runs cold plates, CDUs, rear-door heat exchangers and immersion as one Cooling Environments project. Every one of these machines is built from the same electronics: three-phase motor drives for compressors, pumps and fans (PFC front end, inverter, isolated gate drivers, current sensing), sensors for temperature, pressure, flow and leaks, a controller and an isolated link to the building system (BACnet or Modbus on RS-485, Ethernet). Efficiency of these drives is what moves PUE (total facility energy divided by IT energy)."
references:
  - {id: r1, title: "Liquid cooling distribution unit (CDU): block diagram and subsystems (ti.com/solution/liquid-cooling)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/solution/liquid-cooling", type: app_note, licence: "TI copyright; redrawn and summarised with citation only", retrieved: 2026-11-02, why: "The one public CDU electronics diagram: pump and fan motor drivers (MCU, gate driver, GaN, current sense, hot-swap), valve motor driver, sensors (temperature, humidity, leakage, liquid flow, pressure, level), analog front end, main controller, RS-485 signal isolation, system controller with RS-485 Modbus or Ethernet Redfish, non-isolated AC/DC with PFC, monitoring, HMI; names TIDA-010936 (48 V GaN inverter) for the fan drive"}
  - {id: r2, title: "Project Deschutes: Data Center Facilities, specification 1.0.0 (effective 26 Feb 2026)", publisher: "Open Compute Project (authors: Google)", year: 2026, url: "https://www.opencompute.org/documents/ocp-specification-deschutes-v1-0-pdf/", type: standard, licence: "OCP specification, public; summary with citation", retrieved: 2026-11-02, why: "Open 2 MW CDU: 500 GPM, 3 °C approach, 74 kW consumption, two sealless pumps N+1 each with its own 37 kW VFD at 380-416 V, power factor 0.98-1.00, IEEE 519 THD limits, CBEMA ride-through, 10 mA GFCI, dual feeds, hot-replaceable pumps, leak rope in three zones, ±0.5 % flow meter, telemetry and Modbus TCP over IPv4 / IPv6; 90 kW per rack position; rear-door heat exchangers with leak detection to the building system"}
  - {id: r3, title: "Air conditioner outdoor unit: block diagram and subsystems (ti.com/solution/air-conditioner-outdoor-unit)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/solution/air-conditioner-outdoor-unit", type: app_note, licence: "TI copyright; redrawn and summarised with citation only", retrieved: 2026-11-02, why: "The compressor-and-fan chain of a split or packaged air conditioner, the same as a CRAC or small chiller: non-isolated AC/DC with PFC, power stage with isolated gate drivers (UCC21750, ISO5451) and GaN, current and voltage sense, motor and power controller, compressor, AC and DC fan motors, expansion and four-way valves, RS-485 wired interface, monitoring"}
  - {id: r4, title: "Fan card / module / wall: block diagram and subsystems (ti.com/solution/fan-card-module)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/solution/fan-card-module", type: app_note, licence: "TI copyright; redrawn and summarised with citation only", retrieved: 2026-11-02, why: "The server / rack fan wall: power from the M-PIC connector, I2C power monitor and DC/DC buck, per-fan switching and control with buffers, logic-level and power FETs, and an MCU control unit"}
  - {id: r5, title: "Cooling Environments project page (cold plate, CDU, door heat exchanger, immersion, heat reuse, testing)", publisher: "Open Compute Project", year: 2026, url: "https://www.opencompute.org/projects/cooling-environments/", type: white_paper, licence: "OCP public page; summary with citation", retrieved: 2026-11-02, why: "Shows where cooling is going: one OCP project for cold plates, CDUs, rear-door heat exchangers on Open Rack V3 ('air-assisted liquid cooling'), immersion and heat reuse ('almost 100 % of the energy used in a processor turns into heat'); lists the open documents (rope leak sensor, 30 °C coolant roadmap, door heat exchanger limits, Meta's liquid cooling on AI training platforms)"}
  - {id: r6, title: "AN1456: Understanding Creepage and Clearance Requirements for Data Centers (207474B, 8 Sep 2026)", publisher: "Skyworks", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1456-Data-Center-Creepage-Clearance-Requirements.pdf", type: app_note, licence: "Own public application note; summary with citation", retrieved: 2026-10-30, why: "IEC 62368-1 insulation coordination for data-center equipment: overvoltage categories by zone (OVC III for stages on the main distribution, OVC II in the white space), pollution degree 2, 2500 / 4000 / 6000 V transients, reinforced clearance 8.0 mm at 6000 V, and the wide-body SOIC-16 isolator that meets it; names 400 V / 800 V DC architectures"}
why_customer:
  - "Cooling is the largest load after the IT and the main lever on PUE; fans and pumps on variable-speed drives use far less energy at part load than fixed-speed motors with dampers or valves (affinity laws: power falls roughly with the cube of speed, est)."
  - "AI racks need liquid: Deschutes plans 90 kW per rack position and a 2 MW CDU; a cooling failure stops the GPUs within seconds, so redundancy (N+1 pumps, dual feeds, hot-replaceable drives) is bought, not optional (r2)."
  - "A CDU or chiller is a set of motor drives plus sensors and a controller: the drive vendor needs isolated gate drivers, isolated current sensing, isolators, isolated RS-485 and isolated bias supplies on every pump, compressor and fan (r1, r3)."
  - "Operators demand telemetry and alarms over open protocols (Modbus TCP, Redfish, BACnet) and accurate sensing (flow ±0.5 % of reading), so the controller, its analog front end and its isolated links are part of the specification (r1, r2)."
  - "Leaks next to powered IT are the fear that slows liquid cooling: leak rope sensing in zones, drip pans and alarms into the building system are written into the specification (r2)."
