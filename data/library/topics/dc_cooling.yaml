  note: "Drawn by us from r1 (CDU subsystems), r2 (Deschutes CDU, rack power, rear doors), r3 (compressor and fan chain) and r4 (fan wall). Facility water from the chillers feeds the air handlers, the rear doors and the CDU's heat exchanger; the CDU pumps a separate coolant loop through the cold plates on the processors. Every motor is a variable-speed three-phase drive."
