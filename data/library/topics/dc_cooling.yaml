market:
  - {segment: "Liquid cooling (CDUs, cold plates)", text: "The fastest-growing part of cooling, driven by AI racks; each row CDU carries two or more pump drives from a few kW to 37 kW, plus sensors and controllers (est). Google publishes the open Deschutes CDU and Meta has shared its AI liquid-cooling practice in OCP, so hyperscalers are buying to open specifications (r2, r5).", refs: [r2, r5], conf: med}
  - {segment: "Air handlers, CRAC and chillers", text: "The installed base: every data center has them, and air still removes the part of the heat that cold plates do not (est). Large compressor and fan drives at 380-480 V, sold by HVAC makers with their own or bought VFDs; the drive in Deschutes is an ABB ACH580 (r2).", refs: [r2], conf: med}
  - {segment: "Fan walls and EC fans", text: "High unit volume: many fans per hall and per rack, each with its own BLDC drive; the one-chip controller is the cost lever (est).", refs: [], conf: low}
  - {segment: "Rear doors and immersion", text: "Smaller today; rear doors bridge existing air-cooled halls, immersion is niche but growing (est).", refs: [], conf: low}
open_questions:
  - "Which isolated gate drivers and isolated amplifiers do the main CDU and chiller drive makers use today, and do they buy complete VFDs (as Deschutes does with ABB) or build their own drives? Not read in a primary source."
  - "Are PAC5556 / PAC5253 used in commercial EC fans, and do they meet a 1-3 kW fan drive's needs (gate current, 600 V margin on 400 V mains)? Qorvo data sheets not read (qorvo.com is behind a bot check)."
  - "Market size of data-center cooling electronics (units of CDUs, CRAH / CRAC and EC fans per year): no public market figure was read; market rows are est."
  - "Is a hot-swap / eFuse part, which every replaceable fan and pump drive needs, worth adding to the portfolio?"
  - "Do cooling makers want 800 V DC-fed drives, and when? No public source on 800 V DC cooling drives was read."
