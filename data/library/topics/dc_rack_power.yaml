order: 16
topic: dc_rack_power
title: "Data-center rack power: power shelves, battery backup, 48 V to the GPU and the move to 800 V DC"
summary: "An AI rack draws ten times what a server rack did: NVIDIA's GB200 / GB300 NVL72 racks already need up to eight power shelves, racks are passing 200 kW and NVIDIA plans 1 MW racks on 800 V DC from 2027 (Kyber). Today's chain is AC power shelves that turn 200-277 V AC into a 48-54 V busbar (OCP Open Rack v3: 3 kW PSUs at 51 V, N+1, >97.5 % peak efficiency, 20 ms hold-up), battery backup units on the same bus (3 kW each, at least 4 minutes), and in every compute tray a hot-swap / eFuse, a 48 V to 12 V or 6 V bus converter and multiphase regulators that feed the GPU core with hundreds of amperes to kiloamperes, more and more from directly under the chip (vertical power delivery). GPU training loads swing from about 30 % to 100 % in milliseconds, so capacitors and batteries now smooth the load as well as back it up. Every AC/DC or 800 V converter has a reinforced isolation barrier, and every control, sense and PMBus signal that crosses it needs an isolator: that is where Skyworks' isolated gate drivers, digital isolators and isolated amplifiers sit. The tray side (hot-swap, bus converters, multiphase regulators) is a gap for us."
references:
  - {id: r1, title: "NVIDIA 800 VDC architecture will power the next generation of AI factories (NVIDIA technical blog, 20 May 2025, updated 31 Jul 2025)", publisher: "NVIDIA", year: 2025, url: "https://developer.nvidia.com/blog/nvidia-800-v-hvdc-architecture-will-power-the-next-generation-of-ai-factories/", type: white_paper, licence: "NVIDIA copyright; public blog, summary with citation", retrieved: 2026-10-21, why: "Why 54 V runs out: GB200 / GB300 NVL72 use up to eight power shelves, a 1 MW rack at 54 V would need 64 U of shelves and up to 200 kg of copper busbar; 13.8 kV AC to 800 V DC at the perimeter (transformer or solid-state transformer), 800 V busways carry 85 % more power in the same conductor, an 800 V sidecar shown at GTC 2025, full production with Kyber in 2027; partner list (cached copy re-read 9 Nov 2026)"}
  - {id: r2, title: "Building the 800 VDC ecosystem for efficient, scalable AI factories (N. Srivastava, H. Petty, NVIDIA technical blog, 13 Oct 2025)", publisher: "NVIDIA", year: 2025, url: "https://developer.nvidia.com/blog/building-the-800-vdc-ecosystem-for-efficient-scalable-ai-factories/", type: white_paper, licence: "NVIDIA copyright; public blog, summary with citation", retrieved: 2026-10-28, why: "Hopper to Blackwell: GPU power +75 %, rack power density x3.4; rack power swings from about 30 % to 100 % in milliseconds; multi-timescale storage (capacitors and supercapacitors near the racks, battery storage at the grid connection); today's chain 415 V AC, UPS, PDUs, PSUs to 54 V; Kyber's 64:1 LLC from 800 V to 12 V next to the GPU in 26 % less area; three wires (POS, RTN, PE); partner list (cached copy re-read 9 Nov 2026)"}
  - {id: r3, title: "Open Rack V3 48V PSU Specification, rev 1.0 (Meta, 10 Nov 2022)", publisher: "Open Compute Project", year: 2022, url: "https://www.opencompute.org/documents/orv3-48v-psu-spec-rev-1-0-docx-1/", type: standard, licence: "OCP Contribution License Agreement / OWFa 1.0; summary with citation", retrieved: 2026-11-09, why: "The open rack PSU: 3 kW single-phase, 200-277 V AC (180-305 V), fixed 51 V output with 0.5 V droop (48 V when commanded), efficiency >97.5 % peak and >96.5 % min at 30-100 % load, power factor >0.98, iTHD <5 %, 20 ms / 60 J hold-up, the PSU to BBU hand-over, load steps at 1 A/µs to 140 %, pulse power to 150 %, ±2 % current sharing, N+1 in the shelf, hot plug, 30 A inrush, PMBus and Modbus, blackbox, IEC / UL 62368-1, 0-3050 m"}
  - {id: r4, title: "Open Rack V3 48V BBU Specification, rev 1.4 (Meta, 12 Sep 2023)", publisher: "Open Compute Project", year: 2023, url: "https://www.opencompute.org/documents/open-rack-v3-bbu-module-spec-1-4-pdf/", type: standard, licence: "OWF CLA 1.0 / OWFa 1.0 (Meta, Delta Electronics); summary with citation", retrieved: 2026-11-09, why: "The open rack BBU: six 3 kW BBUs per shelf (5+1), 11S6P Li-ion pack with BMS (cell balance ±1 %, SOC, state-of-health test), 3 kW discharger at 47.5-48 V (about 3 V under the PSUs), at least 240 s at full power, 8-year life, 97 % efficiency including fuse / hot-swap / ORing, 2 ms start-up, load transient ±3 % with a 46 V floor, peak load to 150 %, Modbus and I2C"}
  - {id: r5, title: "Infineon unveils next generation of high-density power modules for vertical power delivery (VPD) in AI data centers (10 Mar 2025)", publisher: "Infineon Technologies", year: 2025, url: "https://www.infineon.com/technology-news/2025/infpss202503-073", type: app_note, licence: "Infineon copyright; public press release, summary with citation", retrieved: 2026-11-09, why: "Vertical power delivery: OptiMOS TDM2454xx quad-phase modules, up to 280 A in 10 x 9 mm (2 A/mm²) with an embedded capacitor layer, used with XDP controllers; power travels through the board under the processor instead of across it, cutting resistive loss"}
  - {id: r6, title: "AN1456: Understanding creepage and clearance requirements for data centers (207474B, 8 Sep 2026)", publisher: "Skyworks Solutions", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1456-Data-Center-Creepage-Clearance-Requirements.pdf", type: app_note, licence: "Own public application note; summary with citation", retrieved: 2026-10-30, why: "Insulation zones in the data center: OVC III (4000 / 6000 V) for solid-state transformers, 800 V / 1500 V DC links and energy storage; OVC II (2500 V) for power shelves, BBUs and capacitor backup units, often in a sidecar rack; 3000 m (Open Rack v3) to 5000 m; 800 V reinforced at PD2 needs 8 mm along the package (material group I) but 16 mm along FR4, so slots or coating; wide-body and the upcoming ultra-wide-body SOIC (15.5 mm clearance)"}
why_customer:
  - "Power, not floor space, now sets the size of an AI data center: racks have gone from tens of kilowatts to well over 100 kW and are heading for 1 MW, and a 1 MW rack cannot be fed at 54 V (64 U of power shelves, up to 200 kg of copper busbar) (r1, r2)."
  - "Every watt lost in the chain is a watt of cooling and a GPU not installed: the open rack PSU already must reach >97.5 % peak efficiency, and NVIDIA promises up to 5 % better end-to-end efficiency from 800 V DC (r1, r3)."
  - "AI training makes the load jump: a rack swings from about 30 % to 100 % in milliseconds, so PSUs must ride load steps and pulse power to 150 %, and capacitors, BBUs and battery storage now smooth the grid as well as back it up (r2, r3, r4)."
  - "Higher voltage and faster GaN / SiC switches make isolation harder: reinforced barriers at 800 V, more creepage at 3000 m, higher dv/dt across every gate driver and isolator (r6; est)."
  - "Operators run the rack by telemetry: every PSU, BBU and tray hot-swap reports power, faults and health over PMBus or Modbus, and that bus has to cross the barrier (r3, r4)."
block_diagram:
  name: "Rack power of an AI data center: from the grid to the GPU core"
  note: "Drawn by us from r1-r6. Today: AC power shelves (PFC + LLC across a reinforced barrier) feed a 48-54 V busbar; BBUs sit on the same bus; in each tray a hot-swap / eFuse, a 48 V to 12 V or 6 V bus converter and multiphase regulators feed the GPU, more and more from under the chip. Next (2027 on): 800 V DC from the perimeter or a power sidecar, with capacitor and battery storage on the 800 V bus, and one isolated 800 V to 12 V or 6 V converter in each tray. The five detailed diagrams are in the Block diagram library under Data center › Rack power."
  groups:
    - {id: g1, label: "Grid and facility: 13.8 kV AC, UPS, PDU / busway (today 415 V AC)", col: 0, row: 0, blocks: [{fn: external_block, label: "Transformer / UPS / PDU"}, {fn: power_module, label: "Rectifier or solid-state transformer (800 V DC)"}]}
    - {id: g2, label: "Power shelf PSU: PFC + LLC, reinforced barrier, 51-54 V", col: 1, row: 0, blocks: [acdc_controller, {fn: gate_driver, label: "PFC and LLC isolated gate drivers"}, {fn: digital_isolator, label: "Control and PMBus across the barrier"}, {fn: isolated_amplifier, label: "Bus voltage / current sense"}, isolated_dcdc]}
    - {id: g3, label: "Battery backup (BBU) and power smoothing", col: 1, row: 1, blocks: [battery_pack, battery_monitor, buck_boost, {fn: dc_link_cap, label: "Capacitors / supercapacitors"}]}
    - {id: g4, label: "48-54 V busbar (or 800 V DC busway)", col: 2, row: 0, blocks: [{fn: external_block, label: "Busbar / busway"}, {fn: efuse_hotswap, label: "Hot-swap / eFuse with PMBus"}]}
    - {id: g5, label: "Tray bus converter: 48 V to 12 / 6 V (or 800 V to 12 / 6 V, isolated)", col: 3, row: 0, blocks: [{fn: power_module, label: "IBC / bus converter"}, half_bridge_driver, power_fets]}
    - {id: g6, label: "GPU / CPU core: multiphase regulators, vertical power delivery", col: 3, row: 1, blocks: [multiphase, {fn: power_module, label: "VPD modules"}, soc]}
    - {id: g7, label: "Rack manager and BMC (telemetry, power capping)", col: 2, row: 1, blocks: [mcu, {fn: rs485_transceiver, label: "Modbus RS-485"}, ethernet_phy]}
  links:
    - [g1, g2, "AC (or 800 V DC to the sidecar)"]
    - [g2, g4, "51-54 V"]
    - [g3, g4, "48 V backup / smoothing"]
    - [g4, g5, "48-54 V"]
    - [g5, g6, "12 V or 6 V"]
    - [g7, g2, "PMBus / Modbus"]
    - [g7, g3, "Modbus"]
    - [g7, g5, "PMBus"]
design_rules:
  - {id: d1, area: "Efficiency", rule: "Design the rack PSU for >97.5 % peak and >96.5 % minimum efficiency from 30 % to 100 % load at 230-277 V (>96.5 % / >95.5 % at 208 V) and at least 94 % from 10 % to 30 %, measured with the fans running", why: "The Open Rack v3 PSU limits; they sit above 80 PLUS Titanium (about 96 % at half load, est, not re-read), and every lost percent is heat the cooling must remove", refs: [r3], conf: high, kind: rule}
  - {id: d2, area: "Output voltage", rule: "Hold the bus narrow: PSUs at a fixed 51 V with 0.5 V droop (50.5 V at full load), BBUs at 47.5-48 V; switch the PSUs to 48 V only on command; set-point accuracy ±0.25 %", why: "A narrow 48 V range lets the trays use fixed-ratio 4:1 (or 8:1) bus converters, and the 3 V gap makes power flow from the batteries without software when AC is lost (Open Rack v2 allowed 40-60 V)", refs: [r3, r4], conf: high, kind: rule}
  - {id: d3, area: "Hold-up time", rule: "Store at least 60 J per 3 kW PSU: 20 ms of hold-up at full load (13.3 ms at 150 %); after half of it (30 J) drop the output by 3 V so the BBUs take over; the BBU must reach full current within 2 ms", why: "Hold-up bridges the AC loss until the BBU discharger is running; the 3 V step is the hand-over signal on the bus, with no communication needed", refs: [r3, r4], conf: high, kind: rule}
  - {id: d4, area: "Transient response", rule: "Meet load steps at 1 A/µs: 50 % step within 0.5 V, 90 % within 1 V, 140 % within 1.5 V, settled in 3 ms; carry pulse power up to 150 % from 40 % of the hold-up energy without triggering the BBUs; BBU output within ±3 % and never below 46 V", why: "AI training swings rack power from about 30 % to 100 % in milliseconds; the PSU and BBU, not the grid, must absorb the first steps", refs: [r3, r4, r2], conf: high, kind: rule}
  - {id: d5, area: "Power quality", rule: "Use active PFC with power factor >0.98 from 30 % to 100 % load (0.95 / 0.90 down to 10 %) and input current THD below 5 % above 30 % load; limit inrush to 30 A", why: "Hundreds of PSUs per hall add up to a large harmonic load on the transformer; inrush limits keep breakers from tripping on hot insertion", refs: [r3], conf: high, kind: rule}
  - {id: d6, area: "Redundancy", rule: "Size the shelf N+1 for PSUs (six 3 kW PSUs for 15 kW) and 5+1 for BBUs; share current within ±2 % above 50 % load on a 50 Hz analog share bus, with droop sharing (5x looser) as fallback", why: "One failed module must not drop the rack; the analog bus keeps sharing alive when the communication bus or one controller fails (N+N with two shelves or feeds is the operator's choice, est)", refs: [r3, r4], conf: high, kind: rule}
  - {id: d7, area: "Battery backup", rule: "Give each BBU 3 kW for at least 240 s at the end-of-life threshold, an 8-year life at 35 °C, ≥97 % efficiency including fuse, hot-swap and ORing, a BMS with ±1 % cell balancing, SOC and a periodic state-of-health discharge test", why: "Four minutes covers the transfer to generators; the self-test proves the capacity without taking the rack down", refs: [r4], conf: high, kind: rule}
  - {id: d8, area: "Telemetry (PMBus / Modbus)", rule: "Report input power, power factor, input current THD, output voltage and current, temperatures and faults over PMBus (100 kHz) and Modbus (115 kbps); keep a blackbox log that survives a catastrophic failure; isolate the signal ground from the 48 V return (10 Ω in Open Rack v3)", why: "The rack manager balances, caps and services power by these readings; in the PSU the controller and the bus often sit on opposite sides of the barrier, so PMBus needs a bidirectional I2C isolator (est)", refs: [r3, r4], conf: high, kind: rule}
  - {id: d9, area: "Hot-swap", rule: "Make every PSU, BBU and tray hot-pluggable: inrush limiting, ORing so a failed unit cannot pull the bus down, and a hot-swap / eFuse with current monitoring at each tray input; on 800 V use a pre-charge and a solid-state disconnect", why: "Units are replaced live; at 800 V a DC arc does not go out by itself, so the switch-off must be electronic and controlled (est from r1, r2)", refs: [r3, r4, r2], conf: med, kind: rule}
  - {id: d10, area: "Isolation and safety", rule: "Certify PSUs to IEC / UL / EN 62368-1 with a reinforced barrier from mains or 800 V to the 48 V / 12 V side; rate power shelves, BBUs and capacitor units for OVC II (2500 V) and solid-state transformers, 800 V DC links and storage for OVC III (4000 / 6000 V)", why: "AN1456 zones the data center by overvoltage category; the PSU spec requires the 62368-1 certificates and a hipot test in production", refs: [r3, r6], conf: high, kind: rule}
  - {id: d11, area: "Creepage at 800 V", rule: "For 800 V DC reinforced isolation at pollution degree 2, plan 8 mm along the isolator package (material group I) and 16 mm along standard FR4 (group IIIa); bridge the difference with a board slot at least 1 mm wide or a certified coating", why: "The board, not the chip, usually sets the creepage; slots narrower than 1 mm are ignored by the standards", refs: [r6], conf: high, kind: rule}
  - {id: d12, area: "Altitude", rule: "Rate rack power for 3000 m (Open Rack v3; the PSU spec says 0-3050 m operating) and check clearance at that altitude, not at 2000 m", why: "Thin air lowers breakdown voltage, so clearance grows: wide-body SOIC (8 mm) covers 300 V systems at 3000 m, the upcoming ultra-wide-body SOIC (15.5 mm) covers almost all categories up to 5000 m", refs: [r3, r6], conf: high, kind: rule}
  - {id: d13, area: "CMTI (GaN / SiC)", rule: "Pick isolated gate drivers and isolators with CMTI well above the switching edges: GaN totem-pole PFC and LLC stages switch at tens to over 100 V/ns, so ask for at least 100-200 kV/µs (est)", why: "A common-mode transient faster than the isolator can reject flips an output and can short a half bridge; GaN and SiC are named by NVIDIA's partners for 800 V converters (r2; numbers est)", refs: [r2, r6], conf: med, kind: consideration}
  - {id: d14, area: "Vertical power delivery", rule: "Feed the processor core from regulators placed under it when currents reach kiloamperes: VPD modules reach 2 A/mm² (280 A in 10 x 9 mm) with the capacitors built in", why: "Lateral copper from regulators beside the chip loses power and limits the current step the core sees", refs: [r5], conf: high, kind: consideration}
  - {id: d15, area: "Power smoothing", rule: "Plan storage in layers: capacitors / supercapacitors next to the racks for milliseconds to seconds, battery storage at the grid connection for seconds to minutes, and PSU / BBU firmware that limits ramp rates", why: "Synchronous training on thousands of GPUs makes hundreds of megawatts ramp in seconds, a risk for the grid that now limits where AI sites can connect", refs: [r2], conf: high, kind: consideration}
trends:
  - {id: t1, text: "800 V DC distribution: 13.8 kV AC turned into 800 V DC at the perimeter and carried on busways to 1 MW racks, in production with NVIDIA Kyber from 2027; the same infrastructure scales from 100 kW to over 1 MW racks", horizon: 2-3y, refs: [r1, r2], conf: high, for_us: "Every 800 V converter needs reinforced isolated gate drivers, isolators and isolated voltage / current sensing rated for 800 V and 3000 m: the case for wide and ultra-wide packages (AN1456)"}
  - {id: t2, text: "Power sidecars and ±400 V: a dedicated power rack next to the compute rack (NVIDIA's 800 V sidecar at GTC 2025, OCP's Diablo 400 power sidecar) holds the AC/DC conversion, the BBUs and capacitor units", horizon: now, refs: [r1, r6], conf: med, for_us: "Sidecars concentrate high-power PSUs and storage in one rack: many isolated drivers and sensors per rack (est); the Diablo 400 details were not read (OCP Academy page not fetched)"}
  - {id: t3, text: "Solid-state transformers at the perimeter: medium-voltage AC straight to 800 V DC with SiC power cells, studied by NVIDIA and partners against conventional transformers", horizon: 3-5y, refs: [r1, r6], conf: med, for_us: "SST cells sit in OVC III with medium voltage on the primary: high-CMTI isolated gate drivers and isolated sensing with the widest creepage (est)"}
  - {id: t4, text: "GaN and SiC everywhere in the chain: totem-pole PFC and LLC in the power shelf, 800 V to 6 / 12 V bus converters (TI showed 97.6 % peak at over 2,000 W/in³, est from eeNews), SiC in the sidecar and SST", horizon: now, refs: [r2], conf: med, for_us: "GaN needs isolated gate drivers with tight timing and high CMTI (Si827x class, est); SiC needs 15-20 V drive with protection (Si828x)"}
  - {id: t5, text: "One conversion step to the GPU: Kyber's 64:1 LLC from 800 V to 12 V beside the GPU (26 % less area than several stages); TI's two-stage 800 V to 6 V to below 1 V", horizon: 2-3y, refs: [r2], conf: high, for_us: "The isolation barrier moves from the power shelf into every compute tray: more isolated drivers and isolators per rack (est)"}
  - {id: t6, text: "Vertical power delivery: regulators move under the processor as core currents reach kiloamperes", horizon: now, refs: [r5], conf: high, for_us: "Non-isolated and outside our catalogue (gap); Skyworks clocks and Qorvo PMICs stay on the board around it"}
  - {id: t7, text: "Battery backup and power smoothing in the rack: BBU shelves on the 48 V bus today, capacitor banks and battery storage on the 800 V bus next, to back up and to flatten the GPU load swings", horizon: now, refs: [r4, r2], conf: high, for_us: "BMS (Qorvo PAC22140 for 10-20 cells fits an 11S BBU pack, est), isolated current sensing and isolated Modbus / CAN for each storage unit"}
skyworks_fit:
  - {fn: gate_driver, parts: ["Si8273AB-IS1", "Si8275AB-IS1", "Si8271AB-IS", "Si8233BD-IS", "Si823H1AB-IS1", "Si82F39ABC-IS1", "Si8285BD-IS"], note: "Si827x for GaN totem-pole PFC, LLC and bus converters; Si823x / Si823Hx isolated half-bridge drivers for PFC, LLC and synchronous rectifiers (5 kV wide body); Si82Fx SelVCD drivers; Si828x with DESAT for SiC in the sidecar and SST"}
  - {fn: digital_isolator, parts: ["Si8600AD-IS", "Si8602AD-IS", "Si8641BD-IS", "Si8661BB-IS1", "Si8620BD-IS"], note: "Si860x: bidirectional I2C / PMBus isolators for telemetry across the PSU barrier; Si864x / Si866x / Si862x for PWM, fault and enable signals between primary and secondary controllers"}
  - {fn: isolated_amplifier, parts: ["Si8921AB-IS", "Si8922BD-IS4", "Si8931D-IS4", "Si8935B-IS", "Si8941AB-IS"], note: "Isolated shunt amplifiers (Si892x) for PFC and bus current, Si893x isolated voltage sensors for the PFC or 800 V bus voltage, Si894x delta-sigma modulators for a digital controller"}
  - {fn: isolated_dcdc, parts: ["Si88240BD-IS", "Si88220BC-IS"], note: "Isolators with an integrated DC-DC: bias for the isolated side of a sense or communication link"}
  - {fn: current_sensor, parts: ["Si8540 High-side DC Current Sensor"], note: "Non-isolated high-side current sensing on the 48 V side (data sheet not re-read for this deep dive)"}
  - {fn: isolated_switch_driver, parts: ["Si8751AB-IS", "Si8752AB-IS"], note: "Isolated FET drivers for solid-state disconnect and pre-charge switches; 2.5 kV today, a reinforced successor is proposed in the eFuse / hot-swap research report for 800 V"}
  - {fn: battery_monitor, parts: ["PAC22140", "PAC25140"], note: "Qorvo 10-20 cell battery management with MCU and balancing; matches the 11S BBU pack (fit est, data sheet not read)"}
  - {fn: power_loss_protection, parts: ["ACT4910QW121-T", "ACT85610QX101-T"], note: "Qorvo power-loss protection ICs with a 12 V eFuse inside: hold-up for SSDs and boot drives in the tray"}
  - {fn: clock_generator, parts: ["Si5332A-GM1"], note: "Clocks for the tray's processors and the PSU / BMC controllers (the timing deep dive has the full tree)"}
  - {fn: efuse_hotswap, parts: [], note: "Gap: no 48 V hot-swap / eFuse (TI TPS1689: 9-80 V, 20 A, PMBus; Infineon XDP710) and no 800 V hot-swap controller."}
  - {fn: multiphase, parts: [], note: "Gap: no multiphase controller, smart power stage or vertical power delivery module for the GPU core."}
  - {fn: power_module, parts: [], note: "Gap: no 48 V bus converter (IBC) and no 800 V to 6 / 12 V converter module."}
  - {fn: acdc_controller, parts: [], note: "Gap: no PFC or LLC controller for the PSU."}
competitors:
  - {fn: gate_driver, names: ["TI (UCC21550 class, GaN power stages with integrated drivers; 800 V to 6 V GaN bus converter, est from eeNews)", "Infineon EiceDRIVER (est)", "STMicroelectronics STGAP (named for 800 V HVDC boards, est)", "ADI, onsemi, Navitas, Rohm (NVIDIA partners, r1 r2)"], note: "NVIDIA's 800 V partner list names TI, Infineon, ADI, ST, onsemi, Renesas, Rohm, Navitas, MPS, Power Integrations, EPC, Innoscience, AOS and Richtek; Skyworks is not on it (r1, r2)."}
  - {fn: digital_isolator, names: ["TI ISO77xx (in TI's 30 kW HVDC PSU reference design PMP23630)", "ADI iCoupler (est, not read)", "Infineon (est)"], note: "TI shows its isolators in its own data-center PSU designs; we have no data-center PSU reference design (est)."}
  - {fn: isolated_amplifier, names: ["TI AMC1336, AMC3306, AMC0236 (PMP23630)", "ADI (est)"], note: "TI pairs isolated modulators with its C2000 controllers in the HVDC PSU."}
  - {fn: efuse_hotswap, names: ["TI TPS1689 / TPS1685 (9-80 V, 20 A, stackable, PMBus)", "Infineon XDP710 / XDP712 (48 V hot-swap controllers, PMBus)", "TI 800 V hot-swap controller (eeNews, Mar 2026)"], note: "48 V eFuses with PMBus are standard in AI trays; TI and Infineon lead (pages read 28 Oct 2026 for the eFuse report)."}
  - {fn: multiphase, names: ["Infineon XDP controllers and TDM2454xx VPD modules (r5)", "MPS, Renesas, TI, ADI (est)", "Vicor (est)"], note: "The GPU core regulator is the largest power-semiconductor socket in the rack and needs process and IP we do not have (est)."}
  - {fn: power_module, names: ["Delta, LiteOn, Flex, Megmeet, Lead Wealth (power shelves and sidecars, r1 r2)", "Vertiv, Eaton, Schneider, ABB, Siemens (facility 800 V systems, r2)"], note: "Power-system makers are the customers for our isolation parts, not competitors."}
market:
  - {segment: "Method", text: "Estimated market for the isolation and sensing parts in data-center rack power, by socket: units a year x our content per unit. No public unit figure was read for this deep dive, so every number is our estimate (est).", refs: [], conf: low}
  - {segment: "Server and rack PSUs (about $50-140 M, est)", text: "About 25-35 M server and power-shelf PSUs a year, including about 2-4 M high-power units for AI racks (est). Isolation content per PSU: 1-3 isolators (PMBus, control), 2-6 isolated gate-driver channels where the primary or synchronous-rectifier drive crosses the barrier, 0-2 isolated amplifiers: about $1.5-4 (est).", refs: [r3], conf: low}
  - {segment: "Battery backup units (about $5-20 M, est)", text: "About 0.5-1.5 M BBU modules a year (an AI rack carries six to a dozen or more, est). Content: BMS, current sensing and an isolated or protected communication link: about $8-15 per module (est).", refs: [r4], conf: low}
  - {segment: "800 V DC converters, sidecars and storage (about $5-30 M in 2027, rising, est)", text: "Each 800 V to 12 / 6 V tray converter needs 4-8 reinforced gate-driver channels, 2-4 isolators and 1-2 isolated sensors (about $10-25, est); sidecars and capacitor / battery units on the 800 V bus add more. Volumes follow Kyber-class racks from 2027; could pass $100 M a year by about 2030 if 800 V DC becomes the norm (est).", refs: [r1, r2], conf: low}
  - {segment: "Tray power we do not serve (gap, est)", text: "Hot-swap / eFuses, 48 V bus converters, multiphase controllers, power stages and VPD modules: the largest share of the rack's power-semiconductor value, without Skyworks parts (est).", refs: [r5], conf: low}
open_questions:
  - "Which public unit figures should replace our estimates (PSUs, AI power shelves, BBUs a year, Kyber-class racks from 2027)? None was read in this run."
