  - {fn: clock_generator, names: ["TI LMK03328, LMK3H0102-Q1 (crystal-free BAW, PCIe Gen 7)", "SiTime SiT95211", "Renesas VersaClock 6E 5P49V6965 (timing now owned by SiTime)", "Microchip (est, not read)"], note: "SiTime SiT95211: four PLLs, 12 outputs, up to 2.9 GHz, the only part in our data with four PLLs besides the Si5397"}
