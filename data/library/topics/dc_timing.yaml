    - [g7, g5, "clean supply"]
design_rules:
  - {id: d1, area: "PCIe REFCLK", rule: "Give every PCIe device a 100 MHz HCSL or LP-HCSL REFCLK within ±100 ppm (Gen 5 / 6); in common clock, meet the RMS jitter limit after every PCIe filter combination: 0.5 ps (Gen 4), 0.15 ps (Gen 5), 0.1 ps (Gen 6)", why: "PCIe Gen 6 defines 16 filter combinations (two PLL bandwidths, a 10 MHz second-order CDR); the limit must hold after each one, and phase-noise measurements must add noise folding up to 200 MHz", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "PCIe architecture", rule: "Use common clock (one generator, buffered to all slots) inside a server; use SRIS with a local XO when the two ends of a link sit on separate boards or in separate boxes (cabled PCIe, GPU trays), and check both ends support it", why: "Separate references may differ by up to 600 ppm (SRNS) and SRIS adds 5000 ppm of spread, so the elastic buffers must be larger; the PCIe standard sets no jitter limit for separate references, the system designer does", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "Spread spectrum", rule: "Use down-spread SSC only: 0 to -0.5 % at 30-33 kHz in common clock, at most -0.3 % in SRIS; never spread the Ethernet SerDes references", why: "SSC lowers the peak emission (from -5 dB to -14 dB in TI's example) but adds jitter and frequency offset (-100 to +2600 ppm in total with -0.5 %); Ethernet links need a fixed frequency (est for the last point)", refs: [r1], conf: high, kind: rule}
  - {id: d4, area: "Fanout", rule: "Budget each buffer stage: the Si532xx adds at most 20 fs (Gen 6 filter) to the generator's jitter; pick LP-HCSL buffers with internal 85 Ω or 100 Ω matching to the board, and an output enable per slot for unused GPUs / NICs", why: "Additive jitter adds in RMS to the source; LP-HCSL needs no external termination resistors and drives longer traces than HCSL, and disabling unused outputs saves power and EMI", refs: [r6, r1], conf: high, kind: rule}
  - {id: d5, area: "SerDes jitter budget", rule: "Derive the reference-clock limit from the SerDes standard: about 10 % of the transmit jitter, integrated from 4 MHz (CDR bandwidth) to fref/10, plus the aliased noise floor: 175 fs (CEI-112G-LR / MR), 125 fs (VSR), 115 fs (400GBASE-FR4), 140-190 fs (800GAUI-8)", why: "The receiver CDR tracks noise below about 4 MHz; noise above fref/2 folds back, so phase-noise analyzer numbers to 20 or 40 MHz look better than the link sees (r3 adds 2x the flat floor and 3 dB margin)", refs: [r3], conf: high, kind: rule}
  - {id: d6, area: "Switch reference clock", rule: "Check the switch vendor's limit and integration method: <35 fs with a 4 MHz first-order high-pass filter at 312.5 MHz (latest 224G-class), <90 fs (12 kHz-20 MHz) at 312.5 MHz (112G class), <150 fs at 156.25 MHz (56G class)", why: "Vendors moved from 12 kHz-20 MHz numbers to the high-pass-filtered method; Si536x gives 22 fs typ / 29 fs max (est from the 72/54 fs ratio) after the 4 MHz HPF", refs: [r2, r3], conf: high, kind: rule}
  - {id: d7, area: "Crystal vs XO", rule: "For a jitter attenuator or clock generator, prefer a crystal on the XA/XB pins for the lowest jitter; if an oscillator is used there, it must be low phase noise with a CMOS (not clipped-sine) output; for PLL bandwidths below 40 Hz (SyncE, PTP) use a TCXO or OCXO instead", why: "Above the PLL bandwidth the reference sets the output phase noise; crystals show wander and phase transients with temperature and vibration below 40 Hz", refs: [r4], conf: high, kind: rule}
  - {id: d8, area: "SyncE / PTP", rule: "Use a network synchronizer with a TCXO / OCXO stability reference (dual-reference type, Si5348 class) in a 1U / 2U switch; set the loop bandwidth to 1-10 Hz for G.8262 EEC option 1 or below 0.1 Hz for option 2; keep a line-card jitter attenuator (bandwidth >10 Hz) for the SerDes when timing is distributed over a backplane", why: "Low-bandwidth loops filter wander and give holdover; Skyworks' dual-reference parts keep the TCXO / OCXO out of the 12 kHz-20 MHz jitter, so no second jitter attenuator is needed", refs: [r4], conf: high, kind: rule}
  - {id: d9, area: "Holdover", rule: "Connect the TCXO / OCXO to the reference pins meant for it (XA/XB on single-reference, REF on dual-reference parts), not to a spare clock input", why: "Only then does the device use it for holdover frequency averaging (up to 120 s of history) and avoid phase jumps when entering or leaving holdover", refs: [r4], conf: high, kind: rule}
  - {id: d10, area: "Redundant inputs", rule: "Require hitless switching between redundant clock inputs: Si536x / Si540x / SKY6310x keep the output phase transient below 150 ps", why: "A switch or timing card has a primary and a backup reference; a phase step on switchover becomes a burst of errors on every SerDes", refs: [r3], conf: high, kind: consideration}
  - {id: d11, area: "Grandmaster", rule: "Size the holdover oscillator for the outage you must ride out: a miniature atomic clock holds about ±1 µs, a high-quality OCXO about ±22 µs; guard GNSS against jamming (holdover) and spoofing (signed messages, reject jumps in time and position)", why: "OCP Time Card rev 1.0 recommendation; a data center grandmaster never moves, so any position jump means an attack", refs: [r5], conf: high, kind: rule}
  - {id: d12, area: "Supplies and layout", rule: "Feed clock devices from low-noise LDOs with a separate supply per clock IC, keep REFCLK traces matched and terminated, and count fanout and connector stages in the jitter budget (est)", why: "Supply noise and reflections become jitter and ringing; PCIe also limits edge rate (0.6-4 V/ns), overshoot (+300 mV) and duty cycle (40-60 %)", refs: [r1, r6], conf: med, kind: consideration}
  - {id: d13, area: "224G SerDes clocks", rule: "For 224G-class SerDes (1.6T ports, scale-up switches), specify the reference as RMS jitter after a 4 MHz first-order high-pass filter at 312.5 MHz (<35 fs for the newest switch chips) and buy with margin: Si536x / SKY6310x give <31 fs by that method; add the fanout's additive jitter and keep one low-noise LDO per clock device", why: "The receiver CDR tracks noise below about 4 MHz, so only the high-frequency jitter (and the aliased floor) reaches the eye; 12 kHz-20 MHz numbers hide it. Each switch generation halved the limit (150, 90, 35 fs)", refs: [r2, r3], conf: high, kind: rule}
  - {id: d14, area: "Spread spectrum in compute trays", rule: "Spread only the 100 MHz PCIe clocks: down-spread 0 to -0.5 % in common clock, SRIS limits where host and tray (or NIC) run on separate references; never spread the Ethernet / scale-up SerDes references or the PTP clocks, and check that every buffer stage passes the spread without adding jitter", why: "Spread spectrum lowers EMI peaks in a dense tray but shifts the frequency by up to several thousand ppm; SerDes and time references must stay fixed. The OCP Universal Baseboard runs its host link in SRIS with spread spectrum and the baseboard itself in common clock (background b3)", refs: [r1, r6], conf: high, kind: rule}
  - {id: d15, area: "Co-packaged optics", rule: "When the switch moves to co-packaged 3.2T modules, plan one 156.25 MHz reference per module from the switch board (±100 ppm, ≤220 fs 12 kHz-20 MHz, AC-coupled, 16 per 51.2T switch) and budget the fanout for it, instead of an XO inside each pluggable", why: "The reference-clock share of the optical link budget is the same method as for pluggables (r3); the OIF 3.2T CPO agreement (background b1) moves the clock source onto the host board", refs: [r3], conf: med, kind: consideration}
  - {id: d16, area: "DCI routers", rule: "Give a DCI (scale-across) router a network synchronizer (Si5403 / SKY69002 class) with an OCXO or TCXO stability reference for holdover, a jitter attenuator for the router ASIC's SerDes, and a jitter attenuator in each coherent module", why: "DCI routers carry SyncE and PTP between halls or sites and must hold time when the upstream reference is lost; router-class switch silicon takes the same <90 / <35 fs SerDes limits as the data center switches, and the reference design recommends the NetSync synchronizers for every generation", refs: [r2, r4], conf: high, kind: rule}
trends:
  - {id: t1, text: "PCIe Gen 6 (64 GT/s) in AI servers now, Gen 7 next: clock vendors already list Gen 7 support for PCIe clocks and buffers", horizon: now, refs: [r1, r2], conf: high, for_us: "Our Gen 7 parts (data sheets read 2 Nov 2026): SKY62101 clock generator (Gen 7 common clock 4 fs typ / 28 fs max against the 67 fs limit) and the SKY53512 / 82 / 42 buffers (2 fs typ / 5 fs max). Si5332 and Si532xx stay stated Gen 1-6. TI lists Gen 7 on LMKDB11xx and LMK3H0102-Q1"}
  - {id: t2, text: "Switch SerDes move from 112G to 224G PAM4 lanes (800G / 1.6T ports), with 448G lanes under discussion; reference-clock limits fall to <35 fs with a 4 MHz high-pass filter", horizon: now, refs: [r3, r2], conf: high, for_us: "Si536x, Si540x and SKY6310x are pitched at exactly this socket; each new switch generation is a design-in"}
  - {id: t3, text: "AI clusters spread one job over thousands of GPUs: back-end fabrics add precise time (PTP) for telemetry, congestion control and scheduling, and open PCIe time cards (OCP Time Card, IEEE P3335) make every server a possible grandmaster", horizon: 2-3y, refs: [r5, r4], conf: med, for_us: "Network synchronizers (Si5403, SKY69002, Si5348) in switches and NICs, and OCXO / clock content on time cards (est)"}
  - {id: t4, text: "Optical modules multiply and speed up: every 800G / 1.6T port has a pluggable or co-packaged optical engine with its own DSP reference clock, and 3.2T is next (owner review, 9 Nov 2026: correct · 1.6T and even up to 3.2T; a 3.2T co-packaged module is already an OIF agreement, background b1)", horizon: now, refs: [r3], conf: high, for_us: "Si545 / Si549 differential XOs and the Si5344H coherent clock: one clock per pluggable, high volume (est); with co-packaged 3.2T modules the socket moves to 156.25 MHz fanouts and jitter attenuators on the switch board (SKY53510, Si536x)"}
  - {id: t5, text: "Edge data centers host 5G fronthaul and O-RAN baseband, so data-center switches need telecom-grade SyncE / PTP (G.8262 and phase accuracy) as well", horizon: 2-3y, refs: [r4], conf: med, for_us: "Reuse of our telecom synchronizers (Si5348 class, AccuTime 1588 software) in data-center gear (est)"}
  - {id: t6, text: "BAW resonators move inside the clock: Skyworks' SKY69002 network synchronizer integrates its own BAW oscillator (plus a crystal) as the reference of its low-phase-noise RF PLL, so no external XO or VCXO is needed; TI sells crystal-free BAW clock generators", horizon: 2-3y, refs: [r2], conf: med, for_us: "What integration could mean for us (est): the same BAW reference inside PCIe clock generators and switch jitter attenuators would remove the external crystal or XO from each tree, cut board space and make the clock less sensitive to vibration and shock. SyncE / PTP still need a TCXO / OCXO for holdover (the SKY69002 summary says so, background b5), so BAW replaces the crystal, not the stability reference. A question for our business unit"}
  - {id: t7, text: "Compute trays split into separate boards (CPU host board, GPU / xPU baseboard, NIC and DPU cards, management module), each with its own clock domain: links between them run in SRIS with spread spectrum, so every board gets its own PCIe clock generator, buffers and XOs", horizon: now, refs: [r1], conf: med, for_us: "A compute-tray clock set (Si5332 / SKY62101 with spread spectrum, Si532xx / SKY535x2 buffers, Si545 / Si549 XOs) for each board, not one per server (est)"}
  - {id: t8, text: "Scale-across: AI clusters that span halls or sites link them with DCI routers and coherent 800ZR / 1600ZR pluggables (OIF agreements, 1600ZR for up to 120 km), carrying SyncE and PTP between sites", horizon: 2-3y, refs: [r4, r2], conf: med, for_us: "Network synchronizers with holdover (Si5403, SKY69002) and coherent-module jitter attenuators (Si5344H class) in each router and module (est)"}
skyworks_fit:
  - {fn: clock_generator, parts: ["Si5332A-GM1", "Si5332A-GM2", "Si5332A-GM3", "SKY62101", "Si5341A", "Si5340A"], note: "Both offer programmable spread spectrum for compute trays (SKY62101: down and center spread, PCIe Gen 1-7). Si5332: 6 / 8 / 12-output any-frequency generator, PCIe Gen 1-6, 190 fs, the server REFCLK and platform clock source; SKY62101: 12 outputs to 3.2 GHz, <55 fs, PCIe Gen 1-7, for Gen 7 platforms and 224G SerDes; Si5341 / Si5340: 10 / 4-output, 90 fs, for switch and NIC references"}
  - {fn: pcie_buffer, parts: ["Si53204-A01", "Si53208-A01", "Si53212-A01", "Si53254", "Si53258", "SKY53582", "SKY53512", "SKY53542"], note: "Si532xx: LP-HCSL PCIe Gen 1-6 fanout, 20 fs additive max (Gen 6), 85 Ω (A02) or 100 Ω (A01) versions; SKY53512 / 82 / 42: 10 / 8 / 4 outputs, PCIe Gen 1-7 (2 fs typ additive at Gen 7) and 35 fs at 156.25 MHz for SerDes"}
  - {fn: jitter_attenuator, parts: ["Si5403A", "SKY69002", "Si5345", "Si5344", "Si5342", "Si5395", "Si5397", "Si5361", "SKY63101", "SKY63104", "Si5348"], note: "Si5345 / Si5395: 90 / 85 fs line-card attenuators (Si5345 meets G.8262); Si536x / SKY6310x: <31 fs (4 MHz HPF) for 224G switches; Si5348: dual-reference network synchronizer for SyncE / PTP; Si5403 (18 outputs, 51 fs, G.8273.1 / .2 / .4) and SKY69002 (16 outputs, 47 fs, integrated BAW oscillator as its RF PLL reference: our BAW-reference product today): the NetSync synchronizers r2 recommends for every switch generation"}
  - {fn: clock_buffer, parts: ["SKY53510", "Si53307-B-GM"], note: "Any-format fanout next to the switch jitter attenuator (r2)"}
  - {fn: crystal_oscillator, parts: ["Si545", "Si549", "Si5344H"], note: "Si545 (80 fs) and Si549 (95 fs, I2C programmable) differential XOs, 0.2-1500 MHz, for optical-module DSPs and NICs; Si5344H coherent-optics clock (a jitter attenuator, listed here for the optical socket). No TCXO / OCXO or atomic clock of our own"}
