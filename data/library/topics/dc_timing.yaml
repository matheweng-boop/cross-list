order: 13
topic: dc_timing
title: "Timing in the AI data center: PCIe and SerDes reference clocks, SyncE / PTP and time cards"
summary: "Every link in a data center runs on a reference clock. This deep dive follows the four data center application areas: front-end / back-end networking (spine, leaf, scale-out and DCI routers with 800G to 1.6T and 3.2T optics), scale-up switches, NICs / DPUs and server / GPU baseboards. Servers give each CPU, GPU, NIC and retimer a 100 MHz PCIe clock (Gen 6: 100 fs RMS after the PCIe filters), with spread spectrum where host and tray run on separate references. Switches, NICs and optics need 156.25 / 312.5 MHz SerDes references: below 35 fs (with a 4 MHz high-pass filter) for 224G-class chips, and a co-packaged 3.2T module takes its 156.25 MHz from the switch board. Back-end fabrics, DCI routers and edge sites also carry SyncE and IEEE 1588 PTP from a grandmaster such as the OCP Time Card. Skyworks covers the whole tree: Si5332 / SKY62101 clock generators and Si532xx / SKY535x2 PCIe buffers in compute trays, Si536x / SKY6310x jitter attenuators and Si5403 / SKY69002 (with its own BAW reference) network synchronizers in switches and routers, and Si545 / Si549 XOs and the Si5344H in optics. TI (PCIe Gen 7 buffers, crystal-free BAW clocks) and SiTime (MEMS oscillators, now with Renesas timing) are the main competitors."
references:
  - {id: r1, title: "Clocking for PCIe Applications (SNAA386, K. Samuel)", publisher: "Texas Instruments", year: 2023, url: "https://www.ti.com/lit/an/snaa386/snaa386.pdf", type: app_note, licence: "TI copyright; public application note, summary with citation", retrieved: 2026-11-02, why: "PCIe REFCLK basics: 100 MHz HCSL / LP-HCSL, CC / SRNS / SRIS architectures, spread spectrum limits, frequency stability and jitter limit per generation (Gen 6: 100 fs), the Gen 6 jitter filters and noise folding"}
  - {id: r2, title: "Timing Solutions for Broadcom SOCs (reference design, May 2026)", publisher: "Skyworks Solutions", year: 2026, url: "https://www.skyworksinc.com/-/media/Skyworks/SL/documents/public/reference-designs/reference-design-timing-solutions-for-broadcom.pdf", type: app_note, licence: "Own public material; summary with citation", retrieved: 2026-11-02, why: "Switch / PHY reference-clock jitter limits per switch generation (Tomahawk 6 / Jericho 4: <35 fs with 4 MHz HPF at 312.5 MHz) and the Skyworks parts recommended for each (Si5403, SKY69002, Si5361/2/3, SKY6310x, Si5395, Si5391, Si5332, SKY53510, Si53307)"}
  - {id: r3, title: "AN1432: Using the Si536x, Si540x and SKY6310x in 112G and 224G SerDes applications (207259A)", publisher: "Skyworks Solutions", year: 2025, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/application-notes/AN1432_112G_224G_SerDes_Applications.pdf", type: app_note, licence: "Own public application note; summary with citation", retrieved: 2026-11-02, why: "How a SerDes jitter budget becomes a reference-clock limit (10 % budget, 4 MHz to fref/10, aliasing of the noise floor), per standard (CEI-112G, 400GBASE-FR4, 800GAUI-8) and the 35 fs / 4 MHz HPF method"}
  - {id: r4, title: "AN1077: Selecting the Right Clocks for Timing Synchronization Applications", publisher: "Skyworks Solutions", year: 2021, url: "https://www.skyworksinc.com/-/media/Skyworks/SL/documents/public/application-notes/an1077-selecting-clocks-for-timing-synchronization.pdf", type: app_note, licence: "Own public application note (Rev. 0.1, 14 Dec 2021); summary with citation", retrieved: 2026-11-02, why: "Jitter vs wander, SyncE / G.8262 loop bandwidths, crystal vs TCXO / OCXO references, holdover, distributed (timing card + line card) and centralized ('pizza box') architectures"}
  - {id: r5, title: "Time Card specification, rev 1.0 (Open Time Server)", publisher: "OCP Time Appliances Project", year: 2022, url: "https://github.com/Time-Appliances-Project/Time-Card/blob/master/README.md", type: standard, licence: "Open Web Foundation Final Specification Agreement (OWFa 1.0)", retrieved: 2026-11-02, why: "Open PCIe grandmaster card: GNSS receiver, atomic clock (±1 µs) or OCXO (±22 µs) holdover, FPGA bridge, PTP hardware clock, 1 PPS / 10 MHz / IRIG-B interfaces (year of rev 1.0 from the linked IEEE paper, est)"}
  - {id: r6, title: "Si53204 / Si53208 / Si53212 PCIe Gen 1-6 LP-HCSL clock fanout buffers, data sheet 206658A", publisher: "Skyworks Solutions", year: 2023, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si532xx-datasheet.pdf", type: app_note, licence: "Own public data sheet; summary with citation", retrieved: 2026-10-22, why: "Our PCIe buffer: Gen 1-6 common clock and SRIS, additive jitter 20 fs max for Gen 6, internal 100 Ω or 85 Ω matching, 1.5 / 1.8 V, per-output enable by pin or I2C (read for data/real/skyworks_timing.yaml)"}
why_customer:
  - "A bad clock shows up as link errors, not as a clock fault: PCIe lanes that retrain or drop to a lower speed, Ethernet ports with high pre-FEC error rates. In an AI cluster one weak link stalls a whole training job, so server and switch makers buy clocks with margin to the limit (r1, r3; est)."
  - "Each PCIe and SerDes generation halves the jitter budget: PCIe REFCLK limits went from 0.5 ps (Gen 4) to 0.15 ps (Gen 5) and 0.1 ps (Gen 6); switch references from <150 fs to <90 fs to <35 fs with a 4 MHz high-pass filter (r1, r2). Every new platform is a new clock socket."
  - "AI back-end networks and edge data centers that host 5G fronthaul need synchronized time as well as clean frequency: SyncE and IEEE 1588 PTP in the switch, and a grandmaster such as the OCP Time Card in the rack (r4, r5)."
  - "One supplier for the whole clock tree (generator, buffers, jitter attenuators, synchronizer, XOs) with one configuration tool (ClockBuilder Pro) shortens a board design; the plan can be drafted in the BizDev Clock planner (/clocks)."
  - "Port speeds keep doubling: 800G ports run on 8 x 112G lanes, 1.6T on 8 x 224G (r3), and the owner's review confirms 1.6T and even up to 3.2T (9 Nov 2026). A co-packaged 3.2T module needs a 156.25 MHz reference within ±100 ppm and 220 fs (12 kHz-20 MHz) from the switch board, 16 of them around a 51.2T switch (OIF, background b1): the clock moves from the pluggable into the switch's own tree."
  - "Compute trays need the whole small-clock set: a PCIe clock generator with spread spectrum where the host link runs on separate references (SRIS, as the OCP Universal Baseboard does toward its host, background b3), PCIe Gen 6 / 7 buffers to every GPU, NIC and retimer, and XOs for local SerDes references, the BMC and the NIC sideband (r1, r6)."
  - "Some customers now ask where parts come from (for example supply outside China and Taiwan). We answer that at company level only and never name a site; the questions are under Questions to ask (Data center), and the answer is for our business unit to give (est)."
block_diagram:
  name: "Clock tree of an AI data center: server, switch, optics and time"
  note: "Drawn by us from r1-r6 and the background specifications. A time card (or GNSS) feeds 1 PPS and time of day to the switch's network synchronizer; the synchronizer and a jitter attenuator give the switch ASIC and its SerDes clean 156.25 / 312.5 MHz references; each optical module has its own low-jitter XO, or takes 156.25 MHz from the switch when co-packaged; DCI routers carry the same SyncE / PTP between sites with OCXO holdover; scale-up switch trays need the cleanest SerDes references but no network time (est); in each compute tray a clock generator with spread spectrum and PCIe buffers give every CPU, GPU, NIC and retimer its 100 MHz REFCLK. The detailed diagrams are in the Block diagram library under Data center: Front-end / back-end networking, Scale-up switches, NICs / DPUs, and Server and GPU / xPU baseboard. Plan a real clock tree with our parts in the Clock planner (/clocks)."
  groups:
    - {id: g1, label: "Time source (OCP Time Card / GNSS grandmaster)", col: 0, row: 0, blocks: [{fn: gnss_lna, label: "GNSS antenna front end"}, {fn: crystal_oscillator, label: "Atomic clock / OCXO holdover"}, {fn: soc, label: "FPGA bridge, PTP hardware clock"}]}
    - {id: g2, label: "Switch: network synchronizer (SyncE / PTP)", col: 1, row: 0, blocks: [{fn: jitter_attenuator, label: "Network synchronizer (DPLL)"}, {fn: crystal_oscillator, label: "TCXO / OCXO + crystal"}]}
    - {id: g3, label: "Switch: SerDes reference clocks", col: 2, row: 0, blocks: [{fn: jitter_attenuator, label: "Jitter attenuator (<35 fs, 4 MHz HPF)"}, {fn: clock_buffer, label: "Any-format fanout"}, {fn: soc, label: "Switch ASIC, 112G / 224G SerDes"}]}
    - {id: g4, label: "Optical modules", col: 3, row: 0, blocks: [{fn: crystal_oscillator, label: "Low-jitter differential XO 156.25 / 312.5 MHz"}, {fn: soc, label: "PAM4 / coherent DSP"}]}
    - {id: g5, label: "AI server: PCIe clock tree", col: 1, row: 1, blocks: [{fn: clock_generator, label: "100 MHz PCIe clock generator (SSC)"}, {fn: pcie_buffer, label: "LP-HCSL fanout buffers"}]}
    - {id: g6, label: "AI server: PCIe devices", col: 2, row: 1, blocks: [{fn: soc, label: "CPU, GPUs / accelerators"}, {fn: redriver, label: "PCIe retimers"}, {fn: ethernet_phy, label: "NIC / DPU"}]}
    - {id: g7, label: "Low-noise supplies", col: 0, row: 1, blocks: [pol_ldo]}
    - {id: g8, label: "DCI router (scale-across, 1600ZR / 800ZR)", col: 3, row: 1, blocks: [{fn: jitter_attenuator, label: "Network synchronizer + OCXO holdover"}, {fn: soc, label: "Router ASIC, coherent ZR optics"}]}
    - {id: g9, label: "Scale-up switch tray", col: 0, row: 2, blocks: [{fn: jitter_attenuator, label: "Jitter attenuator (<35 fs, 4 MHz HPF)"}, {fn: clock_buffer, label: "Fanout to ASICs and retimers"}]}
