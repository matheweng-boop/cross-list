market:
  - {segment: "Method", text: "Estimated market for data-center timing chips by socket, 2026: units a year x timing content per unit at our selling prices. No public unit or price figure was read for this deep dive, so every number below is our estimate (est); the content per unit is counted from the four block diagrams of this sub-system.", refs: [], conf: low}
  - {segment: "Servers and their NICs (about $90-170 M, est)", text: "About 11-13 M servers a year, of which about 2 M AI / GPU servers (est). A general server: one PCIe clock generator, 1-2 buffers and 1-2 NIC XOs, about $4-6 of timing ($50-70 M). An AI / GPU server: 1-2 generators, 6-10 PCIe buffers for GPUs, retimers and 8 or more NICs with their own XOs, about $20-50 ($40-100 M). PCIe Gen 6 / 7 moves the buffers to the newest, lowest-jitter parts (SKY535x2, Si532xx).", refs: [r1, r6], conf: low}
  - {segment: "Switches (about $40-90 M, est)", text: "About 2-3 M data-center switches a year (est). Each: a jitter attenuator and fanout for the SerDes references ($8-15), a CPU / PCIe clock ($2-3) and, in about a third to a half of them (SyncE / PTP), a network synchronizer such as Si5403 or SKY69002 ($10-25): about $15-35 per switch. The highest value per socket, because the <35 fs limits of 224G-class chips leave few qualified suppliers.", refs: [r2, r3], conf: low}
  - {segment: "Optical modules (about $40-120 M, est)", text: "About 40-60 M data-center optical modules a year, most of them 400G / 800G and moving to 1.6T (est). One reference clock each: a low-jitter differential XO at about $1-2, a jitter attenuator at $5-10 in coherent modules, or only a crystal where the DSP has its own PLL (est). The largest unit count, with price pressure from crystal and MEMS oscillator makers.", refs: [r3], conf: low}
  - {segment: "Time cards and grandmasters (about $2-10 M of clock chips, est)", text: "About 50-150 k time cards and grandmaster appliances a year for data centers (est). The atomic clock or OCXO is most of the card's timing cost; the chips we can sell on it (synchronizer or jitter attenuator, buffer) are about $20-60 a card.", refs: [r5], conf: low}
  - {segment: "Total (about $170-400 M a year, est)", text: "The sum of the four sockets, chips only (no TCXO / OCXO or atomic clocks). Recorded as an estimate on the TAM estimates page (dc-timing-sockets-est) for the owner to agree or disagree; one public unit figure per socket would turn each line into a sourced band.", refs: [], conf: low}
open_questions:
  - "Which public unit figures should replace our estimates (servers, AI servers, data-center switches, optical modules a year)? None was read in this run: the market lines are units x content, all est."
  - "Do AI back-end fabrics (InfiniBand or Ethernet) actually run SyncE / PTP today, and to what accuracy? Only the OCP Time Card specification was read; no hyperscaler or network-vendor source."
  - "Is co-packaged optics changing the clock socket (one reference for the whole switch package instead of one XO per module)? Not read."
  - "Microchip's synchronizers and the SiTime-owned Renesas ClockMatrix roadmap were not read (microchip.com is blocked; no new renesas.com document fetched)."
  - "Non-China, non-Taiwan supply (owner, 9 Nov 2026): what may we tell customers about where our data center timing parts are made? Not answered here: the site never names manufacturing sites, and the public company-level statements (annual reports, investor pages) are on hosts this site does not read. Asked under Questions to ask (Data center, business unit) for our business unit to answer."
  - "BAW integration (owner, 9 Nov 2026): is a BAW reference planned for our PCIe clock generators and switch jitter attenuators, as in the SKY69002? Our reading above is an estimate."
  - "3.2T: do customers plan 3.2T as co-packaged optics (156.25 MHz from the switch board) or as pluggables with 16 x 200G or 8 x 400G lanes? Only the OIF CPO agreement was read."
background_references:  # read 9 Nov 2026 (owner: Data center rework, 1.6T / 3.2T, DCI routers, compute trays, BAW) as background; not counted in the six references; "est" marks our reading
  - {id: b1, title: "Implementation Agreement for a 3.2 Tb/s Co-Packaged (CPO) Module (OIF-Co-Packaging-3.2T-Module-01.0)", publisher: "OIF", year: 2023, url: "https://www.oiforum.com/wp-content/uploads/OIF-Co-Packaging-3.2T-Module-01.0.pdf", type: standard, licence: "OIF public implementation agreement; summary with citation", retrieved: 2026-11-09, why: "3.2T modules as building blocks of a 51.2T switch (16 per switch) and their host reference clock (section 5.4, Table 11)", points: ["8 x 400GBASE-DR4 / FR4 optical or copper-cable-attach variants", "Reference clock 156.25 MHz only, ±100 ppm, AC-coupled (100 nF)", "RMS jitter ≤120 fs (12 kHz-1 MHz), ≤150 fs (1-20 MHz), ≤220 fs (12 kHz-20 MHz)"]}
  - {id: b2, title: "Implementation Agreement 1600ZR (OIF-1600ZR-01.0)", publisher: "OIF", year: 2026, url: "https://www.oiforum.com/wp-content/uploads/OIF-1600ZR-01.0.pdf", type: standard, licence: "OIF public implementation agreement; summary with citation", retrieved: 2026-11-09, why: "Coherent 1.6T pluggable for single-span amplified DWDM DCI links", points: ["Up to 120 km, data center interconnect, port density equal to client optics", "Separate host-side and line-side clock domains in the module", "Line rate within ±20 ppm"]}
  - {id: b3, title: "OAI-UBB Base Specification r2.0 v1.0 (Universal Baseboard)", publisher: "Open Compute Project", year: 2023, url: "https://www.opencompute.org/documents/oai-ubb-base-specification-r2-0-v1-0-20230919-pdf/", type: standard, licence: "OCP public specification; summary with citation", retrieved: 2026-11-09, why: "The GPU / xPU baseboard: 8 accelerator modules and its clock architecture", points: ["Host to host-interface board in SRIS, which also supports spread-spectrum clocking for EMC / EMI", "Host-interface board to the baseboard in common clock", "Local clock recommended on each accelerator and expansion card for the 112G SerDes links", "Up to 1000 W per accelerator from 54 / 48 V through a hot-swap controller each"]}
  - {id: b4, title: "OCP NIC 3.0 Design Specification r1.6", publisher: "Open Compute Project", year: 2025, url: "https://www.opencompute.org/documents/ocp-nic-3-0-r1v60-20250410a-tn-no-cb-pdf/", type: standard, licence: "OCP public specification; summary with citation", retrieved: 2026-11-09, why: "NIC / DPU cards: PCIe reference clocks per host and the timing-NIC interface", points: ["One 100 MHz PCIe REFCLK per host (up to 8 on the larger card); limits as in PCIe CEM 5.1", "Timing NIC mode: 10 MHz with an embedded 1 PPS (preferred) or a separate 1 PPS", "Up to 80 W (SFF) or 150 W (DSFF) per card"]}
  - {id: b5, title: "SKY69002 / SKY69001 Low-Phase-Noise Wireless NetSync with Integrated BAW, product summary 207280A", publisher: "Skyworks Solutions", year: 2025, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Product-Summary/SKY69002-01_product_summary.pdf", type: app_note, licence: "Own public product summary; summary with citation", retrieved: 2026-11-02, why: "Our BAW-reference product: what the integrated BAW does and does not replace", points: ["Integrated Skyworks BAW oscillator and crystal oscillator as references for the RF PLL: no external XTAL / XO / VCXO phase-noise reference needed", "An external OCXO / TCXO is not required but typically necessary for IEEE 1588 and SyncE", "47 fs RMS typical, 16 outputs, G.8273.2 / G.8273.4 / G.8262"]}
  - {id: b6, title: "Celestica DS5000 64x800G Switch Specification (clock topology)", publisher: "Open Compute Project", year: 2024, url: "https://www.opencompute.org/documents/celestica-ds5000-64x800gb-switch-specification1-2-pdf/", type: standard, licence: "OCP public specification; summary with citation", retrieved: 2026-11-09, why: "A public 51.2T leaf / spine switch clock tree with named clock parts", points: ["48 MHz crystal into a TI LMK05318 for eight 312.5 MHz SerDes references", "Skyworks Si53108 PCIe buffer: 100 MHz HCSL to the switch, FPGA, NIC and SSDs", "50 MHz and 156.25 MHz LVPECL fanouts for core / timestamp PLLs and the management port"]}
