order: 15
topic: drone_antijam
knowledge: [drone_gnss_map, drone_link_choice]
title: "Drone anti-jamming and anti-spoofing: keeping position and control under interference"
summary: "GNSS signals reach a drone at about −130 dBm, so any transmitter nearby, from the drone's own video link to an illegal jammer, can take the fix away, and a fake GNSS signal can move it. Deliberate interference with licensed or government radio is illegal in the US (47 USC 333), but drones still meet it, and military, border and infrastructure drones must be built for it. The defences are layered: steep filters and notches with a high-linearity LNA (so strong signals do not compress the front end), multi-band and multi-constellation tracking, receiver monitors that flag jamming (AGC, C/N0) and spoofing (consistency and authentication checks), a controlled-reception-pattern antenna array (CRPA) that steers nulls at interferers on larger drones, an inertial and visual fallback, and a command link that hops, uses two antennas and falls back to cellular or satellite. Our parts fit the filters, LNAs, limiters, switches and clocks. This page is about protecting the drone; it gives no jamming methods."
