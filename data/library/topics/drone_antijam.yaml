  - {id: r3, title: "SKY55951-11 Sky5 GNSS L1 + L5 dual-frequency LNA front-end module with post-filter, data sheet 205521I (2 Mar 2026)", publisher: "Skyworks", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/2901-3000/SKY55951-11_205521I.pdf", type: app_note, licence: "Own public data sheet; summary with citation", retrieved: 2026-10-24, why: "Reused: rejection, compression and absolute-maximum input of our drone GNSS LNA"}
  - {id: r4, title: "ETSI EN 303 413 V1.2.1 (2021-04): GNSS receivers operating in 1164-1300 MHz and 1559-1610 MHz; Harmonised Standard for access to radio spectrum", publisher: "ETSI", year: 2021, url: "https://www.etsi.org/deliver/etsi_en/303400_303499/303413/01.02.01_60/en_303413v010201p.pdf", type: standard, licence: "ETSI copyright; free public download", retrieved: 2026-10-21, why: "Reused: the minimum blocking a GNSS receiver must take (at most 1 dB C/N0 loss), and the noise basis behind it"}
