why_customer:
  - "A drone that loses GNSS loses Remote ID, geofencing and every autonomous mode; a drone that is spoofed flies somewhere else. For delivery, inspection and public-safety operators this is a safety and liability question (est)."
  - "Interference is common even where jamming is illegal (r1): the drone's own transmitters, nearby radios and illegal jammers. A front end that stays linear under strong signals keeps the fix (r3, r6)."
  - "Defence, border and critical-infrastructure customers ask for jam resistance as a feature; CRPA arrays and resilient links are where the RF content per drone rises (est)."
  - "Detecting interference is half the defence: a receiver that knows it is jammed can switch to inertial and visual navigation and tell the pilot (r2)."
block_diagram:
  name: "Drone anti-jamming: hardened GNSS front end or CRPA, monitors, inertial fallback and a resilient control link"
  note: "Drawn by us from r1–r6 at block level. Small drones use one antenna with strong filtering and a linear LNA; larger drones add a CRPA array with one coherent channel per element; both feed a receiver that flags jamming and spoofing, and an estimator that falls back to IMU and vision. The control link hops, uses two antennas and falls back to cellular or satellite."
