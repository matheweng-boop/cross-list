market:
  - {segment: "Defence and border", text: "Jam-resistant navigation and links are requirements; CRPA and multi-link C2 raise RF content per drone most (est). Export controls apply (est).", refs: [], conf: low}
  - {segment: "Critical infrastructure and public safety", text: "Inspection and first-responder drones near airports, ports and borders, where interference is more likely (est).", refs: [], conf: low}
  - {segment: "Commercial (delivery, mapping, agriculture)", text: "Filtering, linear LNAs, monitors and inertial fallback rather than arrays (est).", refs: [], conf: low}
  - {segment: "Size", text: "From under a dollar of extra filtering in commercial drones to tens of dollars of RF in a 4–7-element CRPA (est); no public market figure was read.", refs: [], conf: low}
open_questions:
  - "Which drone customers ask for CRPA, and is it a module they buy (NovAtel-type) or a design they build? Export control (ITAR / EAR) on CRPA and on military GNSS signals was not checked."
  - "Does a public test show how much a high-IIP3 LNA plus pre-filter improves C/N0 under a strong out-of-band signal on a drone? Our data covers only the LNA itself."
  - "Is a GNSS LNA with specified rejection at 5725–5850 MHz and a higher input compression point a product worth defining for drones?"
  - "GPS.gov's interference page moved (404 on 2 Nov 2026); EASA / FAA guidance on GNSS interference for drones was not read."
