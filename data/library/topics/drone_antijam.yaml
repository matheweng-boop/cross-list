design_rules:
  - {id: d1, area: "Legal frame", rule: "Design for interference, never for jamming: in the US no person may willfully or maliciously interfere with licensed, authorised or government radio, so countermeasures on a commercial drone are receive-side (filters, arrays, monitors, fallback).", why: "47 USC 333 (r1). Other countries have similar rules; only authorised government users may jam (est).", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "Own transmitters first", rule: "Start with the interferers the drone carries: check GNSS rejection at 0.9, 2.4 and 5.8 GHz. SKY55951-11 L1 rejects 87, 77 and 69 dB at 806–928 MHz, 2.4–2.5 GHz and 5.16–5.56 GHz, with nothing specified at 5725–5850 MHz.", why: "r3 Tables 4 and 5; most GNSS loss on drones is self-inflicted (est). Details in the Navigation deep dive.", refs: [r3], conf: high, kind: rule}
  - {id: d3, area: "Linearity", rule: "Choose the LNA by input compression and IIP3, not only by noise figure: a strong out-of-band signal compresses the LNA and blinds every band, and IM3 products rise 3 dB for every 1 dB of input. SKY55951-11 L1 compresses at −29 dBm input in band.", why: "Textbook relations in r6; part data r3. A high-IIP3 LNA behind a good filter keeps C/N0 under blockers (est).", refs: [r6, r3], conf: high, kind: rule}
  - {id: d4, area: "Filter before or after", rule: "Put a steep pre-filter before the LNA when strong signals are expected and accept its loss in noise figure; use a post-filter only when the signal environment is quiet.", why: "Any loss before the first gain stage adds dB for dB to noise figure (r6); a pre-filter protects linearity (r3, est for the trade).", refs: [r6, r3], conf: high, kind: consideration}
  - {id: d5, area: "Survival", rule: "Protect the LNA input against strong nearby emitters: keep it under the +10 dBm absolute maximum, with a limiter on drones that fly near radars or high-power transmitters.", why: "r3 absolute maximum; the limiter is our reasoning (est).", refs: [r3], conf: med, kind: consideration}
  - {id: d6, area: "Minimum immunity", rule: "Take the EN 303 413 blocking points as the floor, not the goal: they allow at most 1 dB C/N0 loss for blockers set at an interference-to-noise ratio of −6 dB, far below what a jammer produces.", why: "r4 blocking clause and noise basis; the gap to real jammers is our reasoning (est).", refs: [r4], conf: high, kind: consideration}
  - {id: d7, area: "Jamming monitor", rule: "Flag jamming from the receiver's AGC and C/N0 together: in tests AGC detected 7 of 7 chirp-jamming intervals and C/N0 5 of 7 with 23 % false alarms; AGC drifts with temperature, so the front-end gain must be flat and characterised.", why: "r2 results.", refs: [r2], conf: high, kind: rule}
  - {id: d8, area: "Spoofing checks", rule: "Check positions for consistency before trusting them: across constellations and bands, against the IMU and the barometer, and with authenticated signals (Galileo OSNMA) where available; a sudden jump with a clean C/N0 is a warning sign.", why: "r2 covers jamming only; the spoofing checks are our reading of public practice (est).", refs: [r2], conf: low, kind: consideration}
  - {id: d9, area: "CRPA arrays", rule: "For drones that must fly under deliberate jamming, use a CRPA array: an array of N elements can place nulls toward up to about N−1 interferers; small drones fit 2–4 elements, larger ones 7.", why: "Standard adaptive-array result (est, not read in our sources); it needs coherent channels (d10).", refs: [r6], conf: low, kind: consideration}
  - {id: d10, area: "Coherent channels", rule: "In a CRPA, drive every channel from one local oscillator and one sampling clock with low phase noise and matched paths, and calibrate gain and phase over temperature with an injected test signal.", why: "Oscillator noise and reciprocal mixing (r6); channel matching is our reasoning (est).", refs: [r6], conf: med, kind: rule}
  - {id: d11, area: "Hopping control link", rule: "Build the licence-free control link to hop over many channels (in 902–928 MHz at least 50 channels at under 250 kHz, at most 0.4 s on one channel per 20 s) so narrow-band interference hits only part of the time.", why: "47 CFR 15.247 (a)(1) (r5); the resilience argument is our reasoning (est).", refs: [r5], conf: high, kind: rule}
  - {id: d12, area: "Diversity and fallback", rule: "Give the control link two antennas with a diversity switch and a second path (cellular, NTN or a satellite modem) under a link manager with a fail-safe (hold, return home, land).", why: "Diversity within r5's antenna rules; the fallback set is in the Satellite link deep dive and the 'Which link when' table (est).", refs: [r5], conf: med, kind: consideration}
  - {id: d13, area: "Inertial and visual fallback", rule: "Keep position for the time it takes to land or leave the interference with IMU, barometer, optical flow and visual odometry; their drift sets how long that is.", why: "Integrity flags from r2 trigger the switch; the fusion is in the Navigation deep dive (est).", refs: [r2], conf: med, kind: consideration}
trends:
  - {id: t1, text: "GNSS receivers report interference (AGC, C/N0, spectrum) as standard outputs.", horizon: now, refs: [r2], conf: high, for_us: "Flat, characterised LNA gain over temperature is a selling point (est)."}
  - {id: t2, text: "Multi-band, multi-constellation tracking becomes the baseline defence in mid-range drones.", horizon: now, refs: [r3, r4], conf: med, for_us: "More bands, more filters and LNAs per drone (est)."}
  - {id: t3, text: "CRPA arrays shrink from military vehicles to 2–4-element units for larger drones.", horizon: 2-3y, refs: [r6], conf: low, for_us: "Each element needs a limiter, filter, high-IIP3 LNA and coherent clocks: 4–7 times the GNSS front-end content (est)."}
  - {id: t4, text: "Signal authentication (Galileo OSNMA) and consistency checks against spoofing.", horizon: 2-3y, refs: [r2], conf: low, for_us: "Mostly receiver firmware; needs Galileo E1 / E5 in the front end (est)."}
  - {id: t5, text: "Multi-link command and control (radio, cellular, satellite) with automatic fallback.", horizon: 2-3y, refs: [r5], conf: low, for_us: "More radios per drone; see the Satellite link deep dive (est)."}
skyworks_fit:
  - {fn: gnss_lna, parts: ["SKY55951-11", "SKY65943-11", "SKY5A2110"], note: "L1 + L5 and L1 LNA modules with pre- / post-filters; SKY5A2110 has documented blocker behaviour (automotive)."}
  - {fn: lna, parts: ["SKY67151-396LF", "QPL9057", "TQL9093"], note: "High-linearity low-noise amplifiers (OIP3 about 32–41 dBm, noise figure 0.25–0.7 dB) for CRPA channels or a second stage (est fit; not GNSS-specific)."}
  - {fn: rf_limiter, parts: ["TGL2205"], note: "Qorvo 1–6 GHz high-power limiter in front of a GNSS or control-link receiver."}
  - {fn: filter_saw_baw, parts: ["880060", "880273", "QPQ1065"], note: "Qorvo GPS BAW filters; the 1616–1626 MHz SAW protects an Iridium-band path. A 5.8 GHz-rejecting GNSS filter is a gap."}
  - {fn: antenna_switch, parts: ["SKY13414-485LF", "QPC8010Q", "SKY13351-378LF"], note: "Diversity switching and CRPA calibration injection (catalogue function rf_switch)."}
  - {fn: clock_buffer, parts: ["SKY53510", "SKY53540"], note: "Low-additive-jitter fan-out to all CRPA ADCs."}
  - {fn: jitter_attenuator, parts: ["Si5316"], note: "Clean sampling clock from a reference."}
  - {fn: crystal_oscillator, parts: ["Si530"], note: "Low-jitter XO reference."}
  - {fn: rf_synthesizer, parts: ["RFFC5062"], note: "Qorvo 85–4200 MHz synthesizer with mixers: one shared LO for the channels (est fit)."}
