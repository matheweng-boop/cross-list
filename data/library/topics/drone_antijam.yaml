    - {id: g2, label: "Front end per element", col: 1, row: 0, blocks: [{fn: rf_limiter, label: "Limiter"}, {fn: filter_saw_baw, label: "Steep pre-filter and notches"}, {fn: gnss_lna, label: "High-IIP3 LNA"}]}
    - {id: g3, label: "Coherent clocks (CRPA)", col: 1, row: 1, blocks: [{fn: rf_synthesizer, label: "Shared LO"}, {fn: clock_buffer, label: "ADC clock fan-out"}, jitter_attenuator]}
    - {id: g4, label: "Nulling and receiver", col: 2, row: 0, blocks: [{fn: logic, label: "Nulling processor (CRPA)"}, {fn: external_block, label: "Multi-band receiver with jamming / spoofing flags"}]}
    - {id: g5, label: "Fallback navigation", col: 2, row: 1, blocks: [{fn: external_block, label: "IMU"}, {fn: camera_radar, label: "Optical flow / visual odometry"}]}
