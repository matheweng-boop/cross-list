order: 12
topic: drone_cellular
title: "Drone cellular link for beyond-visual-line-of-sight flight: LTE / 5G, RedCap, satellite and eSIM"
summary: "To fly beyond the pilot's sight (BVLOS), delivery, inspection and public-safety drones add a 4G / 5G modem, so commands, telemetry and video travel over the mobile network. The drone is a hard customer for that network: above roof height it sees many base stations in clear line of sight, so its downlink suffers interference from many cells and its uplink disturbs many cells it is not connected to. Base-station antennas point down; field tests cover drones well below about 120 m, higher up new solutions are needed. Commands need only hundreds of kbit/s but must be very reliable; full-HD video needs several Mbit/s and 4K more than 30 Mbit/s in the uplink. The front end is a cellular IoT or RedCap module, often with a satellite (NTN) fallback, dual-band GNSS and an eSIM, next to the broadcast Remote ID that the FAA still requires."
references:
  - {id: r1, title: "Cellular-Connected UAV: Potentials, Challenges and Promising Technologies (arXiv:1804.02217)", publisher: "arXiv (Y. Zeng, J. Lyu, R. Zhang; IEEE Wireless Communications)", year: 2018, url: "https://arxiv.org/pdf/1804.02217", type: paper, licence: "arXiv preprint; licence not checked: summary and short quotes only", retrieved: 2026-10-24, why: "Open overview of drone traffic needs (CNPC hundreds of kbps, video Mbps), aviation spectrum, 3D coverage, line-of-sight interference up and down, and the fixes (directional antennas, 3D beamforming, cooperation)"}
  - {id: r2, title: "Toward Smaller and Lower-Cost 5G Devices with Longer Battery Life: An Overview of 3GPP Release 17 RedCap (arXiv:2203.05634)", publisher: "arXiv (Ericsson authors; IEEE Communications Standards Magazine)", year: 2022, url: "https://arxiv.org/pdf/2203.05634", type: paper, licence: "arXiv preprint; licence not checked (abs page not fetched)", retrieved: 2026-10-21, why: "RedCap device reductions (20 MHz, 1–2 receive branches, half-duplex FDD) and their cost in coverage; reused from the TCU deep dive"}
  - {id: r3, title: "A Tutorial on Non-Terrestrial Networks: Towards Global and Ubiquitous 6G Connectivity (arXiv:2412.16611)", publisher: "arXiv (Univ. Glasgow et al.)", year: 2024, url: "https://arxiv.org/pdf/2412.16611", type: paper, licence: "arXiv preprint; licence not checked (abs page not fetched)", retrieved: 2026-10-21, why: "3GPP NTN path Rel-17 to Rel-19 (IoT-NTN, RedCap over NTN, direct-to-device), the basis for a satellite fallback on remote BVLOS routes; reused from the TCU deep dive"}
  - {id: r4, title: "SKY55951-11 Sky5 GNSS L1 + L5 dual-frequency LNA front-end module with post-filter, data sheet 205521I (2 Mar 2026)", publisher: "Skyworks", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/2901-3000/SKY55951-11_205521I.pdf", type: app_note, licence: "Own public data sheet; summary with citation", retrieved: 2026-10-24, why: "GNSS next to an LTE / 5G transmitter: 70 dB L1 rejection at 1710–1980 MHz, B13 notch for the low-band second harmonic; 4G/5G cellular IoT modules are a listed application"}
  - {id: r5, title: "SKY68040-11 multi-mode multi-band PA module for Cat-M1 / NB-IoT and NTN, product summary 206676B", publisher: "Skyworks", year: 2025, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Product-Summary/SKY68040-11_206676B_PS.pdf", type: app_note, licence: "Own public product summary; summary with citation", retrieved: 2026-10-20, why: "One PA for LTE-M / NB-IoT low and mid bands plus NTN L-band (B24 / n255) and S-band (B23 / n256), 2.8–4.2 V supply, 48 % efficiency at full power, integrated coupler"}
  - {id: r6, title: "Remote Identification of Drones (FAA page, last updated 19 Mar 2025)", publisher: "Federal Aviation Administration", year: 2025, url: "https://www.faa.gov/uas/getting_started/remote_id", type: white_paper, licence: "US government work, public", retrieved: 2026-10-24, why: "Compliance is by broadcast (standard Remote ID drone or broadcast module): a cellular link does not replace the broadcast radio"}
why_customer:
  - "BVLOS is where drone businesses make money (delivery, long inspections, emergency response). The cellular link is what lets one pilot supervise a drone far away, and its reliability is part of the operator's safety case (r1)."
  - "A drone at altitude meets interference that a phone never sees (r1). A front end that holds linearity, controls power finely and can feed more than one antenna keeps the link alive and keeps the operator in good standing with the mobile network."
  - "Weight and power count double on a drone: a RedCap or IoT module with one transmit chain and one supply from a 1S-like rail is lighter and cheaper than a phone-class 5G front end (r2, r5)."
  - "Remote routes leave cell coverage; a PA that also covers the satellite NTN bands (SKY68040-11) gives a telemetry fallback without a second radio (r3, r5)."
