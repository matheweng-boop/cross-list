design_rules:
  - {id: d1, area: "Traffic needs", rule: "Plan two classes of traffic: control and non-payload communication (telemetry, commands, sense-and-avoid data) at hundreds of kbit/s with very high reliability, security and low latency, and payload video at several Mbit/s for full HD and more than 30 Mbit/s for 4K, mostly in the uplink.", why: "r1 section II-A. A drone is an uplink-heavy device, unlike a phone, so PA duty cycle and linearity matter more than downlink peak rate.", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "Altitude and coverage", rule: "Expect usable coverage from base-station sidelobes below about 120 m; above that, or along fixed corridors, plan for gaps and handovers to distant cells.", why: "r1 cites Qualcomm field measurements: satisfactory aerial coverage below 120 m; at 200 m the serving cell is often far away (r1 simulation, cell association at 1.5 m, 90 m, 200 m).", refs: [r1], conf: high, kind: consideration}
  - {id: d3, area: "Line-of-sight interference", rule: "Design the downlink for low SINR (many cells received in line of sight) and limit uplink power at altitude, because the drone's signal reaches many cells it is not connected to.", why: "r1 section III ('severe aerial-ground interference', the 'exposed BS' problem). Needs fine power control and good PA efficiency at back-off (our inference).", refs: [r1], conf: high, kind: rule}
  - {id: d4, area: "Drone antennas", rule: "Consider directional or switched antennas on the drone (for example one up- and one down-looking antenna with a selection switch) to cut interference to and from distant cells.", why: "r1 lists directional antennas and 3D beamforming among the promising technologies; the switched pair is our practical reading (est).", refs: [r1], conf: med, kind: consideration}
  - {id: d5, area: "Module class", rule: "Use LTE-M / NB-IoT or RedCap for telemetry-only drones, LTE Cat-4 and up or 5G for video: RedCap caps bandwidth at 20 MHz with peak about 85 / 90 Mbit/s down / up in full-duplex FDD, enough for a 4K uplink on paper.", why: "r2 RedCap figures; uplink need from r1. Real uplink at the cell edge and in interference is much lower (est).", refs: [r2, r1], conf: med, kind: consideration}
  - {id: d6, area: "RedCap front end", rule: "For RedCap fit one transmit chain and two receive branches; half-duplex FDD can replace a duplexer with a switch, but one receive branch costs coverage.", why: "r2: RedCap allows 1 receive branch and HD-FDD; with 1 branch, coverage recovery is needed for some channels. A drone at the edge of a cell or in interference should keep 2 (our inference, as for NG-eCall in the TCU deep dive).", refs: [r2], conf: high, kind: rule}
  - {id: d7, area: "GNSS next to LTE", rule: "Pick a GNSS front end with high rejection at the drone's own LTE uplink: SKY55951-11 rejects 70 dB at 1710–1980 MHz and 87 dB at 806–928 MHz on L1, and its B13 notch holds the low-band second harmonic at –53 dBm output-referred.", why: "r4 Table 4; GNSS also provides time and Doppler for NTN.", refs: [r4, r3], conf: high, kind: rule}
  - {id: d8, area: "Satellite fallback", rule: "For routes beyond cell coverage, add an IoT-NTN telemetry path in the L / S bands (n255 / n256) on the same PA instead of a second radio: SKY68040-11 covers LTE-M / NB-IoT bands plus B24 / n255 and B23 / n256.", why: "r5 band list; IoT-NTN and RedCap over NTN are Rel-17 to Rel-19 items (r3). Throughput is telemetry-class, not video (est).", refs: [r5, r3], conf: med, kind: consideration}
  - {id: d9, area: "Supply", rule: "Feed the cellular PA from a 2.8–4.2 V rail (a buck from the 2S–14S pack); SKY68040-11 needs no reference voltage and reaches 48 % efficiency at full power.", why: "r5 features.", refs: [r5], conf: high, kind: rule}
  - {id: d10, area: "Remote ID still needed", rule: "Keep a broadcast Remote ID radio on connected drones: the FAA accepts a standard Remote ID drone or a broadcast module, not a network report over the cellular link.", why: "FAA Remote ID page: the ways to comply are broadcast-based (r6).", refs: [r6], conf: high, kind: rule}
  - {id: d11, area: "Protected spectrum", rule: "Treat cellular as a payload and supervision link unless the regulator and operator say otherwise: ICAO wants the safety-critical control link in protected aviation spectrum, and WRC-12 opened 5030–5091 MHz for it.", why: "r1 section II-B.", refs: [r1], conf: high, kind: consideration}
  - {id: d12, area: "Identity and security", rule: "Fit an eSIM (eUICC) or secure element so the operator can provision the drone remotely and the control link is authenticated.", why: "r1: control links need high security; eSIM provisioning (GSMA SGP.32 for IoT) was not read, so the eSIM detail is our judgement (est).", refs: [r1], conf: low, kind: consideration}
trends:
  - {id: t1, text: "Networks add drone-specific features (3D coverage, aerial-UE detection, height-dependent power control) and operators offer drone subscriptions.", horizon: now, refs: [r1], conf: low, for_us: "Aerial UEs need efficient back-off and fine power control in the PA; the 3GPP texts (TR 36.777 for LTE aerial vehicles) and the operator plans were not read (est)."}
  - {id: t2, text: "3D beamforming at base stations and multi-cell cooperation to serve drones and ground users together.", horizon: 2-3y, refs: [r1], conf: med, for_us: "Base-station content (massive MIMO), our Cellular system; on the drone it favours simple, efficient front ends."}
  - {id: t3, text: "RedCap shrinks 5G modules to one transmit chain and 1–2 receivers.", horizon: now, refs: [r2], conf: high, for_us: "A light 5G drone module is an IoT front-end socket (SKY68001-31, SKY66431-11), not a phone LPAMiD."}
  - {id: t4, text: "Satellite direct-to-device (IoT-NTN, RedCap over NTN) gives coverage on remote routes.", horizon: 2-3y, refs: [r3, r5], conf: med, for_us: "SKY68040-11 already covers n255 / n256: offer it as the drone's satellite telemetry option."}
  - {id: t5, text: "Drones combine several links at once (cellular, direct radio, satellite) and switch or bond them for reliability.", horizon: 2-3y, refs: [r1], conf: low, for_us: "More radios per drone means more front ends and more coexistence filtering per drone (est)."}
