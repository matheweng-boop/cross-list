market:
  - {segment: "Delivery", text: "Delivery networks fly beyond sight by design; each drone carries a cellular link and often two (est). Zipline and Wing are in our customer list.", refs: [], conf: low}
  - {segment: "Inspection and public safety", text: "Long linear inspections (power lines, pipelines, rail) and drone-in-a-box systems for first responders rely on cellular video (est).", refs: [], conf: low}
  - {segment: "Agriculture", text: "Mostly within sight; cellular is used for RTK corrections and fleet data rather than control (est).", refs: [], conf: low}
  - {segment: "Defence", text: "Avoid public networks; satellite and frequency-agile military links instead (est).", refs: [], conf: low}
open_questions:
  - "3GPP TR 36.777 (LTE support for aerial vehicles) and the Rel-17/18 NR UAV items were not read: the ETSI copy of TR 136 777 returned 404 on 24 Oct 2026. Which RF features (height reporting, interference detection, power control) do aerial UEs need?"
  - "Which operators sell drone subscriptions (aerial-UE plans) and what do they require from the device (certified modules, power limits, height limits)? Not read in a primary source."
  - "What uplink rate does a drone actually get at 60–120 m in a loaded LTE / 5G network? r1 shows coverage trends, not measured throughput."
  - "Is an eSIM / secure element part worth adding for drones and other IoT, or is the modem's integrated SIM (iSIM) taking that socket?"
