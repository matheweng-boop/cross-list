design_rules:
  - {id: d1, area: "ESC PWM and control loop", rule: "Run the motor phases at 45 kHz PWM or higher (TI tested to 60 kHz), with the FOC current loop and observer at 22.5 kHz and about 2.5 kHz current-loop bandwidth.", why: "Drone motors have low inductance and a short time constant; high PWM cuts current and torque ripple and keeps the switching above ultrasonic distance sensors.", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "Control method", rule: "Use sinusoidal, sensorless FOC for mid- and high-end drones; keep open-loop trapezoidal drives only for the lowest-cost models.", why: "Open-loop control pushes more current than needed into the windings to make sure the motor follows, which wastes energy; closed-loop FOC compensates automatically. TI sees a trend from trapezoidal to sinusoidal control.", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "Dynamic response", rule: "Specify the speed step and acceleration the ESC must reach: TI's design goes from 1 to 10 kRPM in under 0.2 s, up to 86 kRPM/s, and reverses quickly for roll moves (–12 to +12 kRPM).", why: "Yaw and pitch moves are made by changing motor speed; a slow ESC forces the flight controller into constant correction and costs flight time.", refs: [r1], conf: high, kind: consideration}
  - {id: d4, area: "Current and voltage sensing", rule: "Give the sensorless observer seven signals: DC bus voltage, three phase voltages and three phase currents from low-side shunts, sampled in step with the PWM.", why: "The FAST observer in r1 needs all seven; DRV8305 integrates the three current-sense amplifiers, so the shunt amplifier is part of the gate-driver socket.", refs: [r1, r2], conf: high, kind: rule}
  - {id: d5, area: "Power stage sizing", rule: "Size six MOSFETs for the motor's peak current: TI's 60 V, 1.8 mΩ FETs give 15 A RMS / 20 A peak per motor and up to 500 W in the motor from a 2–6 cell pack.", why: "Conduction loss at tens of amps dominates; low RDS(on) in a 5 x 6 mm package keeps the ESC small enough to sit under the motor.", refs: [r1, r2], conf: high, kind: consideration}
  - {id: d6, area: "Voltage rating per pack", rule: "Rate the gate driver, FETs and controller for the fully charged pack plus switching overshoot: about 25 V for 6S (60 V parts, as TI uses), 50.4 V for 12S and 58.8 V for 14S (80–100 V FETs and a driver rated well above 60 V). A 48 V-input controller such as PAC5527 fits up to about 10S (42 V full).", why: "4.2 V per charged LiPo cell; TI's 2–6 cell design uses 60 V FETs (about 2.4x margin over 25.2 V). The 10S limit for a 48 V part is our arithmetic.", refs: [r1, r5], conf: med, kind: rule}
  - {id: d7, area: "Gate drive", rule: "Budget gate-drive power as Q_g x V_GS x f per switch and keep the gate loop short; at 60 kHz with large FETs choose a driver with about 1 A peak or more (DRV8305: 1.25 A source / 1 A sink).", why: "Example (our arithmetic): 50 nC x 10 V x 60 kHz = 30 mW per FET, 0.18 W for six; peak current sets the switching edge and loss.", refs: [r3, r1], conf: high, kind: rule}
  - {id: d8, area: "Isolation", rule: "A low-voltage drone ESC (up to 14S, below 60 V) normally needs no galvanic isolation; use isolated gate drivers and isolated current sensing only where the power stage runs from a high-voltage bus (hybrid generator, tethered supply, eVTOL) or where the control side must be separated.", why: "Our reading: below about 60 V DC the pack counts as safety extra-low voltage, so the cost of isolation buys nothing there; Si823x-class drivers fit the high-voltage cases.", refs: [r4, r3], conf: med, kind: consideration}
  - {id: d9, area: "ESC to flight controller", rule: "Plan the throttle interface as either duty-cycle PWM or a serial link, and send motor state (speed, current, temperature) back to the flight controller.", why: "TI names duty cycle or serial communication as the ESC's link to the flight controller.", refs: [r1], conf: high, kind: rule}
  - {id: d10, area: "Motor protection", rule: "Estimate motor temperature from the change in winding resistance and derate during temporary overload instead of adding a sensor.", why: "r1's InstaSPIN design does this to protect the motor in temporary overload without extra parts.", refs: [r1], conf: high, kind: consideration}
  - {id: d11, area: "Battery management", rule: "Give large packs (10S–20S) a battery SoC with cell monitoring, balancing and a CPU (PAC25140 class) and report state of charge to the flight controller; small 1–2S packs need only a protector and fuel gauge.", why: "Enterprise drones use smart batteries that the flight controller reads before take-off; PAC25140 covers 10s–20s.", refs: [r5], conf: med, kind: consideration}
  - {id: d12, area: "Power-up and redundancy", rule: "Limit the inrush into the ESCs' bulk capacitors when the pack is connected (anti-spark, eFuse or pre-charge) and OR two packs with ideal diodes on heavy drones that must survive a battery fault.", why: "Our reasoning (est): tens of µF to mF of low-ESR bulk capacitance across a 50 V pack draws a large spark current; neither Skyworks nor Qorvo lists an eFuse / hot-swap part in our catalogue.", refs: [r5], conf: low, kind: consideration}
  - {id: d13, area: "Remote ID interlock", rule: "Make the flight controller self-test Remote ID before take-off, block take-off while it fails or is not broadcasting, and keep monitoring it until shutdown with a warning to the pilot.", why: "14 CFR 89.310 (c) and (i) for standard Remote ID drones.", refs: [r6], conf: high, kind: rule}
  - {id: d14, area: "Remote ID data timing", rule: "Time-stamp position and altitude so the broadcast leaves no later than 1.0 s after measurement, at least once per second, with a time mark synchronised to all other message elements.", why: "14 CFR 89.310 (b), (h)(4), (h)(5): the GNSS and the flight controller set the latency, not only the radio.", refs: [r6], conf: high, kind: rule}
  - {id: d15, area: "Positioning accuracy", rule: "Specify GNSS for Remote ID at 100 ft horizontal (95 %) for drone and control station, 150 ft drone altitude and 15 ft control-station altitude; a single-band L1 receiver meets this, dual-band L1 + L5 is for RTK and precision work.", why: "14 CFR 89.310 (h)(1)–(3); the L1 / L5 split is our judgement (est).", refs: [r6], conf: med, kind: consideration}
trends:
  - {id: t1, text: "Drone ESCs move from trapezoidal to sinusoidal sensorless FOC, and with it to higher PWM (45–60 kHz and rising) and stronger MCUs.", horizon: now, refs: [r1], conf: high, for_us: "Qorvo's PAC55xx / PAC52xx put an Arm Cortex-M4F with three-phase gate drivers and the supply in one package: the natural one-chip ESC. Skyworks has no non-isolated three-phase driver."}
  - {id: t2, text: "48 V-class drives adopt GaN FETs for higher PWM in small high-speed drives (TI lists a 48 V / 10 A high-frequency GaN inverter next to its drone ESC).", horizon: 2-3y, refs: [r2], conf: med, for_us: "Controllers and drivers must handle faster edges and higher PWM; a GaN-ready one-chip controller is a feature to ask the PAC team about."}
  - {id: t3, text: "Remote ID makes the broadcast radio a flight-critical item tied to the flight controller and GNSS (self-test, take-off interlock, 1 s latency).", horizon: now, refs: [r6], conf: high, for_us: "Sell the BLE / Wi-Fi front end and the GNSS LNA together with the flight-controller timing parts as one Remote ID set."}
  - {id: t4, text: "Heavy-lift drones (agriculture, delivery) use higher pack voltages, 12S–14S and above, and smart batteries with cell-level management.", horizon: now, refs: [r5], conf: low, for_us: "PAC5532B / ACT72350 (160 V) and PAC25140 (10s–20s) already match these packs; few drone-specific parts in this voltage class exist (est)."}
  - {id: t5, text: "Hybrid and tethered drones and eVTOL bring a high-voltage bus into the airframe.", horizon: 5y+, refs: [r4], conf: low, for_us: "Here isolated gate drivers, isolated current sensing and digital isolators (Si823x, Si827x, Si86xx) become drone parts; today they are not (est)."}
