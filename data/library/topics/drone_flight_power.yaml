order: 10
topic: drone_flight_power
title: "Drone flight control, motor drives (ESC) and battery power"
summary: "A multirotor drone flies on four to eight brushless (BLDC) motors, each run by its own electronic speed controller (ESC), from a 2S to 14S lithium-polymer pack (7.4 V nominal for 2S, up to 58.8 V fully charged for 14S). The flight controller reads the IMU, barometer, compass and GNSS and sends a throttle command to every ESC many hundred times a second. Good ESCs now run sensorless field-oriented control (FOC) at 45–60 kHz PWM, which gives longer flight time and faster response than the older trapezoidal drives. Around them sit the battery management, the power distribution with its 5 V / 3.3 V rails, and, since the FAA Remote ID rule, a take-off interlock: the drone must not take off unless its Remote ID broadcast works."
