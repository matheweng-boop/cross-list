why_customer:
  - "Flight time sells the drone. Sinusoidal FOC puts only the current the motor needs into the windings, so it is more efficient than open-loop trapezoidal drives and the drone flies longer on the same battery (r1)."
  - "Stability and agility come from the ESC: the faster it changes motor speed (TI: 1 to 10 kRPM in under 0.2 s), the less the flight controller has to correct, which also saves energy (r1)."
  - "A one-chip motor controller (CPU, three-phase gate drivers and supply in one package) shrinks the 4-in-1 ESC board, the part count and the weight (r5, est)."
  - "Remote ID is a flight-controller feature, not only a radio: the drone must test it before take-off, refuse to fly without it and report the take-off position and altitude with GNSS-grade accuracy (r6)."
  - "Heavy-lift agriculture and delivery drones move to 12S–14S packs to cut current and cable weight; every part on the power path then needs 80–100 V ratings (est)."
