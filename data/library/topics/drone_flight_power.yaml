market:
  - {segment: "Consumer", text: "Camera drones and FPV: high volume, low price per drone, 2S–6S packs, one controller chip per ESC is the cost lever (est). Led by DJI, Autel and others in our customer list.", refs: [], conf: low}
  - {segment: "Enterprise and industrial", text: "Inspection, mapping and public safety: smart batteries, redundancy and Remote ID-compliant flight controllers; fewer units, more content per drone (est).", refs: [], conf: low}
  - {segment: "Agriculture", text: "Spraying and seeding drones carry tens of litres; 12S–14S packs and 8 or more motors per drone make them the largest motor-drive content per unit (est). XAG is in our customer list.", refs: [], conf: low}
  - {segment: "Delivery", text: "Beyond-sight flights need redundant power paths, cellular links and certified flight controllers; Zipline and Wing are in our customer list (est).", refs: [], conf: low}
  - {segment: "Defence", text: "Large volumes of low-cost FPV drones and loitering munitions use the consumer ESC and battery stack; export rules and customer screening apply (est).", refs: [], conf: low}
open_questions:
