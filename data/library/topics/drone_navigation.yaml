    - {id: g2, label: "GNSS front end", col: 1, row: 0, blocks: [{fn: filter_saw_baw, label: "Pre-filter / notch"}, {fn: gnss_lna, label: "L1 + L5 LNA"}, {fn: diplexer, label: "Band split"}, {fn: load_switch, label: "Antenna bias-T"}]}
    - {id: g3, label: "GNSS receiver", col: 2, row: 0, blocks: [{fn: external_block, label: "Multi-band RTK receiver"}, {fn: crystal_oscillator, label: "TCXO"}]}
