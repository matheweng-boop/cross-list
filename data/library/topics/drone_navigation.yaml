design_rules:
  - {id: d1, area: "Bands", rule: "Use L1 + L5 for drones that map, spray or fly autonomously, L1 alone only for low-cost consumer drones; budget about 3 mA for both bands (SKY55951-11: 1 mA L1 and 1.9 mA L5 at 1.8 V, 17 dB gain, 1.4 / 1.1 dB noise figure).", why: "r1 features and tables; L5 helps against multipath and for RTK (est).", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "Accuracy gain", rule: "Expect about 1.2 m horizontal rms with single-frequency PPP and an IMU, about 9 cm with dual and 7 cm with triple frequency on a low-cost patch antenna; the IMU improves the result by 10–40 % during outages with 0–2 satellites.", why: "r3 land-vehicle results; drones see more sky but more vibration (est).", refs: [r3], conf: high, kind: consideration}
  - {id: d3, area: "Gain window", rule: "Keep the net gain from antenna to receiver input, after cable and filter losses, inside the receiver's window (17–40 dB for an all-band receiver in normal mode).", why: "r2: too little gain adds noise figure, too much overloads the receiver's front end.", refs: [r2], conf: high, kind: rule}
  - {id: d4, area: "Active antenna", rule: "Specify an active antenna module with noise figure under 3.5 dB, about 40 dB out-of-band rejection and under 10 ns in-band group-delay variation for carrier-phase (RTK) use.", why: "r2 active-antenna requirements.", refs: [r2], conf: high, kind: rule}
  - {id: d5, area: "Own transmitters", rule: "Check rejection at each on-board transmit band: SKY55951-11 L1 rejects 87 dB at 806–928 MHz, 77 dB at 2.4–2.5 GHz and 69 dB at 5.16–5.56 GHz, but nothing is specified at 5725–5850 MHz video.", why: "r1 Tables 4 and 5 (also rule d6 of the radio-links deep dive). Deliberate jamming is in the Anti-jamming deep dive.", refs: [r1], conf: high, kind: rule}
  - {id: d6, area: "Overload", rule: "Keep the strongest on-board signal at the LNA input well below its compression point (L1 IP1dB −29 dBm in band) and always below the +10 dBm absolute maximum.", why: "r1 electrical and absolute-maximum tables; the margin needed is our reasoning (est).", refs: [r1], conf: high, kind: rule}
  - {id: d7, area: "EU blocking", rule: "For Europe, pass the EN 303 413 blocking points (for example a −65 dBm blocker at 1524 MHz and −85 dBm at 1627 MHz) with at most 1 dB C/N0 loss for each declared signal.", why: "r4 clause on blocking; each added band adds test cases.", refs: [r4], conf: high, kind: rule}
  - {id: d8, area: "L-band corrections", rule: "If corrections arrive over L-band satellites, let the antenna pass about 1525–1559 MHz while still falling steeply below 1525 MHz, and check the receiver's gain window (it does not cover L-band).", why: "r2 and r4; widening L1 for corrections moves the filter edge toward the satellite downlink.", refs: [r2, r4], conf: med, kind: consideration}
  - {id: d9, area: "Remote ID", rule: "Meet Remote ID accuracy from the GNSS alone: drone position within 100 ft (95 %), drone altitude within 150 ft, reported at least once a second and within 1 s of measurement.", why: "r5 (e) and (h).", refs: [r5], conf: high, kind: rule}
  - {id: d10, area: "Antenna placement", rule: "Put the GNSS antenna on top of the frame over a ground plane (specifications are measured on about 120 mm), as far as possible from transmit antennas, motors and ESCs.", why: "r2 placement guidance; motor and ESC noise is our reasoning (est).", refs: [r2], conf: med, kind: consideration}
  - {id: d11, area: "Antenna feed", rule: "Feed an active antenna through a bias-T with an inductor above 500 Ω across 1–1.8 GHz, a current limit and short / open detection.", why: "r2 bias-T guidance.", refs: [r2], conf: high, kind: rule}
  - {id: d12, area: "Integrity", rule: "Pass the receiver's AGC and C/N0 flags to the estimator so it can lower the weight of GNSS and lean on IMU and vision when interference rises.", why: "r6 shows AGC and C/N0 detect jamming; the use in fusion is our reasoning (est). See the Anti-jamming deep dive.", refs: [r6], conf: med, kind: consideration}
  - {id: d13, area: "Sensor fusion", rule: "Time-stamp every sensor (IMU, magnetometer, barometer, optical flow, rangefinder, GNSS 1 PPS) on one clock and fuse them in the flight controller's estimator; use two or three IMUs on enterprise drones.", why: "r3 shows the value of IMU integration; the clock and redundancy points are our reasoning (est).", refs: [r3], conf: med, kind: consideration}
trends:
  - {id: t1, text: "GNSS moves from L1 to L1 + L5 in drones that map, spray or fly autonomously.", horizon: now, refs: [r1], conf: med, for_us: "SKY55951-11 is a ready dual-band LNA; a version with rejection specified at 5.8 GHz would fit drones better."}
  - {id: t2, text: "All-band receivers (L1 / L2 / L5 / E6 plus L-band) with one RF input and PPP-RTK corrections.", horizon: now, refs: [r2], conf: high, for_us: "A single-input triplexed front end with a group-delay specification is the matching socket (est)."}
  - {id: t3, text: "Low-cost triple-frequency PPP fused with MEMS IMUs reaches centimetres without a local base station.", horizon: 2-3y, refs: [r3], conf: high, for_us: "Pushes a third band (L2 or E6) into mid-range drones; Qorvo's 880368 1280 MHz BAW filter fits E6 (est)."}
  - {id: t4, text: "Receivers report interference (AGC, C/N0, spectrum) for the estimator to use.", horizon: now, refs: [r6], conf: high, for_us: "Flat, characterised LNA gain over temperature makes these flags reliable (est)."}
  - {id: t5, text: "Remote ID makes GNSS mandatory content in every standard drone in the US.", horizon: now, refs: [r5], conf: high, for_us: "Every drone is a GNSS socket, even the cheapest."}
