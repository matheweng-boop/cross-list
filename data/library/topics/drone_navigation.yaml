order: 14
topic: drone_navigation
knowledge: [drone_gnss_map]
title: "Drone navigation: multi-band GNSS, RTK and sensor fusion"
summary: "A drone needs its position at least once a second for Remote ID and continuously for every autonomous mode. Hobby drones use L1 GNSS with a magnetometer and a barometer; mapping, spraying, delivery and inspection drones move to L1 + L5 (and L2 / E6) with RTK or PPP-RTK corrections for centimetre accuracy, fused with two or three IMUs, optical flow, a rangefinder and visual odometry so the estimate survives when GNSS is weak. The RF part is the GNSS front end: a low-noise LNA with pre- and post-filters that also rejects the drone's own 0.9 / 2.4 / 5.8 GHz transmitters, a band split for the receiver, a DC feed for an active antenna, and an antenna on top of the frame. How to keep position under deliberate jamming or spoofing is in the Anti-jamming deep dive."
