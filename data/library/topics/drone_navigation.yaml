why_customer:
  - "Remote ID makes a good GNSS fix a legal requirement for every standard drone in the US (r5): 100 ft horizontal accuracy at 95 %, reported every second."
  - "Mapping, spraying and precision landing need centimetres: dual- or triple-frequency GNSS with corrections gives decimetres or better, single frequency about a metre (r3)."
  - "The drone's own radios are the nearest interferers; a GNSS front end that rejects them keeps the fix without a redesign of the frame (r1)."
  - "When GNSS fades (under bridges, near buildings, under interference) the IMU and vision sensors carry the estimate; a stable clock and clean supplies for those sensors are parts we sell (est)."
block_diagram:
  name: "Drone navigation: multi-band GNSS with RTK, fused with inertial and vision sensors"
  note: "Drawn by us from r1–r6. One GNSS antenna and front end on top of the frame; corrections arrive over the control radio, cellular or L-band; the flight controller fuses GNSS with IMU, magnetometer, barometer, optical flow, rangefinder and, near the dock, UWB."
