market:
  - {segment: "Consumer", text: "L1 (often multi-constellation) GNSS, magnetometer, barometer and optical flow; one GNSS LNA or none (receiver-integrated) per drone (est).", refs: [], conf: low}
  - {segment: "Enterprise, mapping, agriculture", text: "L1 + L5 or all-band RTK, often two antennas for heading; two front ends per drone (est).", refs: [], conf: low}
  - {segment: "Remote ID", text: "Every standard US drone must report its position (r5): GNSS is in every drone.", refs: [r5], conf: high}
  - {segment: "Size", text: "GNSS front-end content per drone is under a dollar for consumer drones and a few dollars for RTK drones (est); volume is set by drone shipments, not read in a primary source.", refs: [], conf: low}
open_questions:
  - "Which rejection does SKY55951-11 (or a successor) have at 5725–5850 MHz, the most common drone video band?"
  - "Do drone makers buy the GNSS LNA separately, or take it inside a u-blox / Septentrio module or an active antenna? Who designs the antenna module?"
  - "Is there demand for an L1 + L2 / E6 + L5 single-input module for drones, and at what price?"
  - "Should we offer a TCXO for GNSS and NTN modems? None is in our catalogue."
