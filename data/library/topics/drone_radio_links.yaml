order: 11
topic: drone_radio_links
title: "Drone radio links: control link, video downlink, GNSS, Remote ID and ADS-B In"
summary: "A drone carries four to five radios at once: a long-range control link (sub-GHz 868/915 MHz or 2.4 GHz, frequency hopping), a video downlink at 2.4 or 5.8 GHz (digital, or analog FM in FPV), GNSS (L1, more and more L1 + L5), a Remote ID broadcast over Bluetooth or Wi-Fi and, on larger drones, an ADS-B In receiver. All but GNSS and ADS-B sit in licence-free bands, so the rules set the power: in the US up to 1 W conducted with a 6 dBi antenna (36 dBm EIRP) in 902–928, 2400–2483.5 and 5725–5850 MHz, in Europe only 20 dBm EIRP at 2.4 GHz. That 16 dB gap decides range, PA size and how many product variants a maker needs. The hard engineering problem is coexistence: a 1 W video or control transmitter a few centimetres from a GNSS antenna that must hear signals near –130 dBm."
references:
  - {id: r1, title: "47 CFR 15.247: Operation within the bands 902–928 MHz, 2400–2483.5 MHz and 5725–5850 MHz", publisher: "US eCFR, via Cornell LII", year: 2026, url: "https://www.law.cornell.edu/cfr/text/47/15.247", type: standard, licence: "US federal regulation, public domain", retrieved: 2026-10-24, why: "The US power and hopping rules for drone control and video links: 1 W conducted, 6 dBi antenna, hop counts and dwell times, 20 dB out-of-band rule"}
  - {id: r2, title: "ETSI EN 300 328 V2.2.2 (2019-07): Wideband transmission systems in the 2.4 GHz band, harmonised standard", publisher: "ETSI", year: 2019, url: "https://www.etsi.org/deliver/etsi_en/300300_300399/300328/02.02.02_60/en_300328v020202p.pdf", type: standard, licence: "ETSI free download; copyright ETSI, reproduction restricted", retrieved: 2026-10-24, why: "The EU 2.4 GHz limits: 20 dBm EIRP for FHSS and wideband equipment, 10 dBm/MHz for non-FHSS, listen-before-talk thresholds, medium utilisation"}
  - {id: r3, title: "14 CFR 89.310: Minimum performance requirements for standard remote identification unmanned aircraft", publisher: "US eCFR, via Cornell LII", year: 2021, url: "https://www.law.cornell.edu/cfr/text/14/89.310", type: standard, licence: "US federal regulation, public domain", retrieved: 2026-10-24, why: "Remote ID broadcast rules: non-proprietary broadcast in Part 15 spectrum compatible with personal wireless devices, maximised range, no interference with other on-board radios, accuracy and timing"}
  - {id: r4, title: "Remote Identification of Drones (FAA page, last updated 19 Mar 2025)", publisher: "Federal Aviation Administration", year: 2025, url: "https://www.faa.gov/uas/getting_started/remote_id", type: white_paper, licence: "US government work, public", retrieved: 2026-10-24, why: "Who must comply and the three ways to comply: standard Remote ID drone, add-on broadcast module (visual line of sight only), or flying in an FAA-recognised identification area (FRIA)"}
  - {id: r5, title: "SKY55951-11 Sky5 GNSS L1 + L5 dual-frequency LNA front-end module with post-filter, data sheet 205521I (2 Mar 2026)", publisher: "Skyworks", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/2901-3000/SKY55951-11_205521I.pdf", type: app_note, licence: "Own public data sheet; summary with citation", retrieved: 2026-10-24, why: "Our L1 + L5 GNSS front end: gain, noise figure, compression, absolute maximum input, and its out-of-band rejection at exactly the drone's own control and video bands"}
  - {id: r6, title: "Skyworks and Qorvo RF parts in our catalogue: sub-GHz and 2.4 GHz front ends, Wi-Fi FEMs, PAs, switches (data/catalog, collected 19 Oct 2026)", publisher: "Skyworks and Qorvo public product pages (collected by us)", year: 2026, url: "https://www.skyworksinc.com/en/Products/Front-end-Modules", type: app_note, licence: "Public product listings; summary with citation", retrieved: 2026-10-19, why: "Band edges, output power and gain of the parts that fit each drone radio socket (SKY66427-11, RFX2411N, SKY66118-11, SE5004L, SKY85748-11, QPF4216, QPF4526, SKY65111-348LF, SKY13351-378LF, QPC8010Q)"}
why_customer:
  - "Range and link loss: losing the control link triggers a fail-safe or a crash; the PA power, LNA noise figure and antenna diversity decide how far the drone can go before that happens."
  - "One design for many regions: the US allows 36 dBm EIRP, Europe 20 dBm at 2.4 GHz (r1, r2). A front end with a good efficiency curve at backed-off power lets one board serve both with a power table."
  - "Remote ID is mandatory for registered drones in the US (r4). A small, efficient BLE / Wi-Fi front end that maximises broadcast range, as the rule asks (r3), is a compliance item, not an option."
  - "The drone's own transmitters are the worst GNSS jammers it meets. A GNSS front end with specified rejection at 868/915 MHz, 2.4 GHz and 5.8 GHz keeps the position fix, which Remote ID and every autonomous mode depend on (r3, r5)."
block_diagram:
  name: "Drone radio set: control link, video downlink, GNSS, Remote ID and ADS-B In"
  note: "Drawn by us from r1–r6. The control link and the video link each use two antennas with a diversity switch; GNSS sits on top of the airframe as far as possible from the transmit antennas. ADS-B In (1090 MHz, and 978 MHz in the US) is receive-only and found on larger drones (est, not read in a primary text)."
