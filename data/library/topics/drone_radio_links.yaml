market:
  - {segment: "Consumer and FPV", text: "Every drone needs a control link, most a video link and, in the US, Remote ID; content is a few front ends per drone (est).", refs: [], conf: low}
  - {segment: "Enterprise, agriculture, delivery", text: "Dual-band GNSS, ADS-B In and longer-range links raise the RF content per drone (est).", refs: [], conf: low}
  - {segment: "Remote ID modules", text: "The FAA allows add-on broadcast modules for drones without built-in Remote ID (r4): a retrofit market for small BLE / Wi-Fi front ends.", refs: [r4], conf: med}
  - {segment: "Defence", text: "Frequency-agile links and jam-resistant GNSS; also the counter-drone jammers in our GaN ideas (est).", refs: [], conf: low}
open_questions:
  - "ASTM F3411 (Remote ID over Bluetooth 4 legacy, Bluetooth 5 long range, Wi-Fi beacon and Wi-Fi NAN) was not read (paywalled); which transport do US and EU drones actually ship, and at what transmit power?"
  - "EU rules not read: Commission Delegated Regulation (EU) 2019/945 direct remote identification, and ERC Recommendation 70-03 limits for 868 MHz and 5.8 GHz short-range devices; EUR-Lex was not reachable in an earlier run."
  - "ADS-B: 14 CFR 107.53 (no ADS-B Out on Part 107 drones) and the use of ADS-B In were not read in this run."
  - "What isolation do drone makers reach between a 5.8 GHz video antenna and the GNSS patch, and does SKY55951-11 hold its noise figure with a 1 W 5.8 GHz transmitter on the same frame?"
  - "Skyworks drone / UAV solution pages on skyworksinc.com were not checked in this run."
