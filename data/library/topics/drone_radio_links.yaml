design_rules:
  - {id: d1, area: "US power limit", rule: "Size the control and video PA for at most 1 W (30 dBm) peak conducted in 902–928, 2400–2483.5 and 5725–5850 MHz with antennas up to 6 dBi (36 dBm EIRP); above 6 dBi cut conducted power dB for dB. Exceptions: 0.125 W for 2.4 GHz hopping with fewer than 75 channels, 0.25 W for 902–928 MHz hopping with 25–49 channels.", why: "47 CFR 15.247 (b)(1)–(4); the 1:1 reduction applies to all but fixed point-to-point links.", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "US hopping rules", rule: "For a hopping control link in 902–928 MHz use at least 50 channels (20 dB bandwidth under 250 kHz) or at least 25 (250–500 kHz), with at most 0.4 s on one channel per 20 s or 10 s; in 2.4 GHz at least 15 channels; in 5725–5850 MHz at least 75 channels of up to 1 MHz. Digital (non-hopping) links need at least 500 kHz 6 dB bandwidth.", why: "47 CFR 15.247 (a)(1)–(2). A 500 kHz-wide chirp link at 915 MHz on fewer than 50 channels is held to 0.25 W (our reading of (a)(1)(i) with (b)(2)).", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "EU 2.4 GHz limit", rule: "In Europe keep 2.4 GHz control, video and Remote ID transmitters at 20 dBm EIRP or less (FHSS and wideband), and non-hopping equipment at 10 dBm/MHz; above 10 dBm EIRP the equipment must be adaptive (listen before talk with a threshold of –70 dBm/MHz scaled by 10 log(100 mW / Pout)).", why: "ETSI EN 300 328 V2.2.2 clauses 4.3.1–4.3.2. 16 dB less EIRP than the US means about 6 times less free-space range at the same receiver (our arithmetic: 10^(16/20) = 6.3).", refs: [r2], conf: high, kind: rule}
  - {id: d4, area: "One board for both regions", rule: "Design one front end and set power by region: about 30 dBm conducted for the US, about 18 dBm conducted behind a 2 dBi antenna for the EU at 2.4 GHz; pick FEMs whose efficiency and linearity hold at the lower setting.", why: "Our arithmetic from r1 and r2; the US limit is conducted (with a 6 dBi cap), the EU limit is EIRP, so the antenna gain counts differently.", refs: [r1, r2], conf: med, kind: consideration}
  - {id: d5, area: "Out-of-band emissions", rule: "Keep emissions in any 100 kHz outside the band at least 20 dB below the in-band peak (US); harmonics of a 915 MHz PA also land near GNSS and 2.4 GHz receivers on the same drone, so add a harmonic filter after the PA.", why: "47 CFR 15.247 (d); the on-board coexistence point is our reasoning (the 2nd harmonic of 915 MHz is 1830 MHz, the 3rd 2745 MHz).", refs: [r1], conf: med, kind: rule}
  - {id: d6, area: "GNSS rejection of own transmitters", rule: "Check the GNSS front end's rejection at every on-board transmit band: SKY55951-11 L1 rejects 87 dB at 806–928 MHz, 77 dB at 2.4–2.5 GHz and 69 dB at 5.16–5.56 GHz, but nothing is specified at the 5725–5850 MHz video band; the L5 path rejects only 48 dB at 2.4 GHz and 52 dB at 5.16–5.56 GHz.", why: "r5 Tables 4 and 5. A 5.8 GHz video transmitter is the common drone case that today's GNSS data sheets do not cover.", refs: [r5], conf: high, kind: consideration}
  - {id: d7, area: "GNSS front-end overload", rule: "Keep the power reaching the GNSS LNA input below its +10 dBm absolute maximum and well below the in-band compression (L1 IP1dB –29 dBm, L5 –13.8 dBm): with a 30 dBm transmitter on board, get at least 20 dB antenna isolation for survival and far more for linear operation.", why: "r5 absolute maximum and electrical tables; the isolation figure is our arithmetic.", refs: [r5], conf: high, kind: rule}
  - {id: d8, area: "Dual-band GNSS cost", rule: "Budget about 3 mA and two filters for L1 + L5: SKY55951-11 draws 1 mA (L1) and 1.9 mA (L5) at 1.8 V with 17 dB gain and 1.4 / 1.1 dB noise figure.", why: "r5 features and tables; L5 gives better multipath and RTK performance for mapping and agriculture drones (est).", refs: [r5], conf: high, kind: consideration}
  - {id: d9, area: "Remote ID content and timing", rule: "Broadcast drone and control-station latitude, longitude and geometric altitude at least once per second, within 1.0 s of measurement, with 100 ft horizontal (95 %), 150 ft drone altitude and 15 ft control-station altitude accuracy, and with error correction.", why: "14 CFR 89.310 (e) and (h).", refs: [r3], conf: high, kind: rule}
  - {id: d10, area: "Remote ID radio", rule: "Use a non-proprietary broadcast in Part 15 spectrum that personal wireless devices can receive (in practice Bluetooth and Wi-Fi), integrated without changing its authorised RF parameters, designed for maximum range within Part 15, and not interfering with, nor disturbed by, the other on-board radios.", why: "14 CFR 89.310 (f) and (g). The Bluetooth / Wi-Fi methods are defined in ASTM F3411, which was not read (paywalled).", refs: [r3], conf: high, kind: rule}
  - {id: d11, area: "Remote ID module market", rule: "Offer front ends for two Remote ID products: built-in (standard Remote ID drone) and the add-on broadcast module that retrofits older drones; the module broadcasts the take-off location and may only be used within visual line of sight.", why: "FAA Remote ID page: the three ways to comply.", refs: [r4], conf: high, kind: consideration}
  - {id: d12, area: "Video FEM band edge", rule: "Check that the 5.8 GHz FEM covers 5725–5850 MHz with margin: SE5004L and QPF4526 stop at 5.85 GHz, SKY85748-11 and QPF4506B reach 5.925 GHz; many Wi-Fi FEMs are specified only to 5.85 or 5.895 GHz.", why: "Band edges from r6; US band from r1. The EU 5.8 GHz short-range band and its limits were not read.", refs: [r6, r1], conf: high, kind: rule}
  - {id: d13, area: "Sub-GHz PA", rule: "A 600–1100 MHz InGaP PA such as SKY65111-348LF (2 W class, 40 dB gain, 50 % PAE at 915 MHz) must be run backed off to stay within the 1 W US limit; full power suits licensed or government links only.", why: "Part data r6, limit r1.", refs: [r6, r1], conf: med, kind: consideration}
  - {id: d14, area: "Antenna diversity", rule: "Use two antennas with a diversity switch on the control link and the video link (e.g. RFX2411N has the switch built in; SKY13351-378LF or QPC8010Q as discrete SPDT up to 6 GHz).", why: "A drone rolls and banks, so one antenna often sits in a null of the pattern; switching to the better antenna avoids link loss (our reasoning). Parts from r6.", refs: [r6], conf: med, kind: consideration}
trends:
  - {id: t1, text: "Broadcast Remote ID is now required for registered drones in the US, via built-in Remote ID or an add-on module.", horizon: now, refs: [r4, r3], conf: high, for_us: "One BLE / Wi-Fi front end per drone, plus a retrofit-module market; SKY66118-11 (+20 dBm BLE FEM) and RFX2411N fit."}
  - {id: t2, text: "GNSS moves from L1 only to L1 + L5 in drones that map, spray or fly autonomously.", horizon: now, refs: [r5], conf: med, for_us: "SKY55951-11 is a ready dual-band part; a version with specified rejection at 5.8 GHz would answer the video-link problem in d6."}
  - {id: t3, text: "Long-range control links use chirp (LoRa-type) or narrow-band hopping in 868/915 MHz and 2.4 GHz, with telemetry back to the pilot.", horizon: now, refs: [r1], conf: low, for_us: "Sub-GHz front ends (SKY66427-11 for 902–928 MHz) and 2.4 GHz boosters with diversity switch fit; based on common hobby systems, not read (est)."}
  - {id: t4, text: "Digital HD video (Wi-Fi-like OFDM at 5.8 GHz) replaces analog FM video in FPV and is standard in camera drones.", horizon: 2-3y, refs: [r1], conf: low, for_us: "Digital video needs linear FEMs (EVM), not the saturated PAs of analog transmitters: our 5 GHz Wi-Fi FEMs fit (est)."}
  - {id: t5, text: "Jamming and spoofing push military and border drones to multi-band GNSS with high out-of-band rejection, and to frequency-agile links.", horizon: 2-3y, refs: [r5], conf: low, for_us: "GNSS front ends with specified blocking and linearity become a selling point (est); defence sales need export checks."}
