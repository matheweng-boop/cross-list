market:
  - {segment: "Delivery and long inspection", text: "Remote routes beyond cells: a satellite telemetry fallback on top of cellular (est).", refs: [], conf: low}
  - {segment: "Maritime, border, agriculture on large farms", text: "Areas without cell coverage; IoT-NTN or a satellite modem for tracking and commands (est).", refs: [], conf: low}
  - {segment: "Public safety", text: "Disaster areas where towers are down; NTN is named for disaster relief and resilience (r1).", refs: [r1], conf: med}
  - {segment: "Size", text: "Satellite content per drone: one PA and filters if NTN shares the cellular path, a full module if a satellite modem; a few US dollars of RF per drone (est), on a small share of drones today.", refs: [], conf: low}
open_questions:
  - "How does the FCC treat drones on cellular and direct-to-cell bands outside the Part 22 cellular service (Parts 24 and 27)? 47 CFR 22.925 was read; the FCC's drone and SCS orders were not (docs.fcc.gov stopped our reader with a 403 on 2 Nov 2026)."
  - "Which bands are listed for SCS in 47 CFR 2.106(d)(33)(i)? Not read."
  - "Starlink's Direct to Cell page needs JavaScript and showed no text to our reader; AST SpaceMobile and Lynk pages were not tried (5-document limit). What data rates do they offer to IoT and drones?"
  - "Does SKY68040-11 support NTN PC2 (26 dBm), and how much noise does it put into 1559–1610 MHz?"
  - "What rejection do our GNSS front ends have at 1610–1660 MHz (n254 / n255 / Iridium uplinks)?"
