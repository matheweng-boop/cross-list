order: 13
topic: drone_satellite_link
knowledge: [drone_link_choice]
title: "Drone satellite link: 3GPP NTN (IoT and NR), direct-to-cell and satellite modems"
summary: "Where no cell reaches, a drone can keep telemetry and commands over a satellite. Three ways exist. 3GPP NTN puts NB-IoT / LTE-M (and later NR) on satellite bands next to GNSS: L-band n255 (uplink 1626.5–1660.5 MHz) and S-band n256 (uplink 1980–2010 MHz) since Release 17, n254 (uplink 1610–1626.5 MHz) since Release 18, and one multimode PA can serve both the terrestrial and the satellite bands. Direct-to-cell (DTC) uses the operator's own LTE / 5G bands from low-orbit satellites, so a standard radio works; in the US it is licensed as supplemental coverage from space (SCS). A dedicated satellite modem (Iridium-class or L-band MSS) is the older, separate path. All of them carry kbit/s, not video, and all transmit within 15–90 MHz of GNSS L1, which the NTN modem itself needs for timing and Doppler. The RF work is a link budget (sky-facing antenna, PA power, low loss) and GNSS coexistence."
references:
  - {id: r1, title: "Non-Terrestrial Networks (NTN): technology deep dive (J. Krause, 3GPP MCC)", publisher: "3GPP", year: 2024, url: "https://www.3gpp.org/technologies/ntn-overview", type: white_paper, licence: "3GPP public web page (dated 14 May, year not shown; 2024 from its text, est); copyright 3GPP partners; summary with citation", retrieved: 2026-11-02, why: "Orbits and delays (LEO 500–2000 km, GEO 35 786 km, up to a few hundred ms), transparent vs regenerative payloads, the Release 15–19 path, IoT-NTN (NB-IoT / eMTC), bands n255 / n256 (Rel-17) and n254 (Rel-18, 1610–1626.5 / 2483.5–2500 MHz), 30 MHz channels, and the rule that NTN UEs use GNSS to pre-compensate timing advance and Doppler"}
  - {id: r2, title: "3GPP TS 38.101-5 V19.6.0 (ETSI TS 138 101-5): NR UE radio transmission and reception, Part 5: Satellite access", publisher: "ETSI / 3GPP", year: 2026, url: "https://www.etsi.org/deliver/etsi_ts/138100_138199/13810105/19.06.00_60/ts_13810105v190600p.pdf", type: standard, licence: "ETSI free download; copyright ETSI/3GPP, reproduction restricted", retrieved: 2026-10-21, why: "Reused from the TCU deep dive: NTN power classes PC1 / PC2 / PC3, n255 / n256 duplex gaps and self-desense allowances, GNSS-band emission limits (NS_02N)"}
  - {id: r3, title: "Maximising the benefit of future satellite communications for automotive (technical report v1.0)", publisher: "5GAA", year: 2024, url: "https://5gaa.org/content/uploads/2024/09/5gaa-ntn-ras-technical-report.pdf", type: white_paper, licence: "Public download; copyright 5GAA", retrieved: 2026-10-20, why: "Reused from the TCU deep dive: NTN link budgets for a small terminal (uplink rate against power and antenna gain), receiver noise figure needed, antenna size limits"}
  - {id: r4, title: "47 CFR 25.125: Applications for supplemental coverage from space (SCS)", publisher: "US eCFR, via Cornell LII", year: 2024, url: "https://www.law.cornell.edu/cfr/text/47/25.125", type: standard, licence: "US federal regulation, public domain", retrieved: 2026-11-02, why: "The US rule behind direct-to-cell: the satellite operator needs a lease with the terrestrial licensee(s) holding all co-channel licences in a geographic area; SCS devices are 'licensed by rule' and certified under Parts 22, 24 or 27"}
  - {id: r5, title: "SKY68040-11 multi-mode multi-band PA module for Cat-M1 / NB-IoT and NTN, product summary 206676B", publisher: "Skyworks", year: 2025, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Product-Summary/SKY68040-11_206676B_PS.pdf", type: app_note, licence: "Own public product summary; summary with citation", retrieved: 2026-10-20, why: "Reused from the drone cellular deep dive: one PA for LTE-M / NB-IoT bands plus NTN L-band and S-band, 2.8–4.2 V, 48 % efficiency at full power, integrated coupler"}
  - {id: r6, title: "47 CFR 22.925: Prohibition on airborne operation of cellular telephones", publisher: "US eCFR, via Cornell LII", year: 2026, url: "https://www.law.cornell.edu/cfr/text/47/22.925", type: standard, licence: "US federal regulation, public domain", retrieved: 2026-11-02, why: "Cellular telephones on aircraft must not be operated while airborne (Part 22 cellular service): a regulatory question for drones using cellular or direct-to-cell in that band"}
why_customer:
  - "Delivery, pipeline, power-line, maritime and border drones fly where cells end. A satellite path keeps telemetry and a 'return home' command alive, which is part of the BVLOS safety case (est)."
  - "With 3GPP NTN the satellite path is a band option on the same modem and PA, not a second radio (r1, r5): less weight, one certification, one supplier for the front end."
  - "Direct-to-cell needs no new RF hardware at all (r4); the drone maker's question becomes link budget (antenna on top, full PA power, low loss) and whether the operator and regulator allow airborne use (r6)."
  - "The NTN modem needs GNSS to connect (r1), and its own L-band uplink sits next to GNSS L1 (r2). A supplier that can show the PA, the filters and the GNSS front end working together removes the drone maker's biggest integration risk (est)."
block_diagram:
  name: "Drone satellite link: IoT-NTN module, direct-to-cell path and GNSS"
  note: "Drawn by us from r1–r6. The IoT-NTN path and the terrestrial LTE-M path share one multimode PA (r5); direct-to-cell uses the normal cellular front end with a sky-facing antenna; GNSS feeds the modem for timing advance and Doppler (r1)."
