design_rules:
  - {id: d1, area: "Bands", rule: "Plan for three NTN band pairs next to GNSS: n255 (L-band, uplink 1626.5–1660.5 MHz, downlink 1525–1559 MHz) and n256 (S-band, uplink 1980–2010 MHz, downlink 2170–2200 MHz) from Release 17, and n254 (uplink 1610–1626.5 MHz, downlink 2483.5–2500 MHz) from Release 18; channels up to 30 MHz.", why: "r1 band history and channel bandwidths; band edges from r2. n254 transmits right at the top of the GNSS L1 / RNSS band.", refs: [r1, r2], conf: high, kind: rule}
  - {id: d2, area: "GNSS is part of the link", rule: "Treat GNSS as a required input of the NTN modem: before random access the UE needs a valid GNSS fix and the satellite ephemeris to pre-compensate timing advance and Doppler, so the GNSS must keep tracking while the NTN PA transmits.", why: "r1: NTN UEs are expected to be GNSS-capable and pre-compensate TA and Doppler themselves.", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "Power class", rule: "Choose the NTN power class from the link budget: PC3 23 dBm (±2 dB), PC2 26 dBm and PC1 31 dBm in n255 / n256; PC1 is 'not targeted for smartphone form factor', so a drone can use it if weight and battery allow.", why: "r2 power-class tables (as read for the TCU deep dive). A PA for PC3 needs headroom above 23 dBm for the NTN power-boost options.", refs: [r2], conf: high, kind: rule}
  - {id: d4, area: "n255 vs n256", rule: "Expect n255 to be the harder band: its duplex gap is 67.5 MHz against 160 MHz for n256, and the spec allows more receiver desense in n255 at the higher power classes (up to 3.3 dB at PC1 4Tx).", why: "r2 duplex gaps and REFSENS allowances; the duplexer and transmit-noise filtering decide the n255 design.", refs: [r2], conf: high, kind: consideration}
  - {id: d5, area: "GNSS-band emissions", rule: "Hold transmit emissions in 1559–1605 MHz to at most −50 dBm / 700 Hz and −40 dBm / 1 MHz when the network signals NS_02N on n255; then check the drone's own GNSS front end for rejection at 1610–1660 MHz, which our GNSS data sheets read so far do not specify.", why: "r2 emission limits; the data-sheet gap was found in the GNSS and drone radio-links deep dives (SKY5A2110, SKY55951-11 rejection tables).", refs: [r2], conf: high, kind: rule}
  - {id: d6, area: "Link budget", rule: "Budget the uplink with a link budget, not with phone experience: a small terminal reaches under 1 Mbit/s at 23 dBm with a 0 dBi antenna and about 11 Mbit/s at 29 dBm with 6 dBi; 5GAA recommends more than 23 dBm and more than 3 dBi. Free-space loss at 1.6 GHz is about 157 dB to a LEO satellite 1100 km away and about 188 dB to GEO, about 30 dB more (our arithmetic, est).", why: "Rates and recommendation from r3; path loss from 20 log(4πd/λ). The 30 dB gap is why GEO IoT-NTN is kbit/s telemetry.", refs: [r3], conf: med, kind: rule}
  - {id: d7, area: "Antenna", rule: "Mount a sky-facing L / S-band antenna on top of the frame, away from the GNSS patch: a 0 dBi dual-band antenna fits in under 5 × 5 cm, 3 dBi for both bands needs two radiators and more area.", why: "Sizes from r3; placement against GNSS is our reasoning (est). A drone banks and its arms and battery shadow part of the sky (est).", refs: [r3], conf: med, kind: consideration}
  - {id: d8, area: "Receiver noise figure", rule: "Do not over-specify the satellite LNA: about 7 dB system noise figure (phone level) is enough for the S-band downlink; antenna gain, transmit power and loss before the antenna matter more.", why: "r3 recommended UE parameters.", refs: [r3], conf: med, kind: consideration}
  - {id: d9, area: "One PA for both", rule: "Use one multimode PA for the terrestrial LTE-M / NB-IoT bands and the NTN L / S bands, fed from a 2.8–4.2 V rail: SKY68040-11 reaches 48 % efficiency at full power and has an integrated coupler.", why: "r5 features.", refs: [r5], conf: high, kind: rule}
  - {id: d10, area: "Delay", rule: "Use the satellite path for telemetry, mission commands and 'return home', not for stick control: GEO adds up to a few hundred ms, LEO (500–2000 km) much less but with moving cells and handovers.", why: "Delays and orbit heights from r1; the use split is our reasoning (est).", refs: [r1], conf: med, kind: consideration}
  - {id: d11, area: "Doppler and frequency", rule: "Give the modem a stable TCXO and a GNSS fix: LEO satellites move fast, so cells, Doppler and delay change quickly, and the UE corrects them itself.", why: "r1 on LEO / MEO motion, Doppler and delay variation; the TCXO point is our reasoning (est).", refs: [r1], conf: med, kind: consideration}
  - {id: d12, area: "Direct-to-cell rules (US)", rule: "For direct-to-cell in the US, check that the drone's operator has an SCS partner: the satellite operator must lease the band from the terrestrial licensee(s) holding all co-channel licences in the area, and the device is certified under the terrestrial rules (Parts 22, 24 or 27), not as a satellite terminal.", why: "47 CFR 25.125 (a), (c), (e). The bands listed in § 2.106(d)(33)(i) were not read (docs.fcc.gov is stopped for our reader).", refs: [r4], conf: high, kind: rule}
  - {id: d13, area: "Airborne use", rule: "Check airborne use per band before relying on cellular or direct-to-cell on a drone: the FCC bars operating cellular telephones on airborne aircraft in the Part 22 cellular service.", why: "47 CFR 22.925. How it applies to drones, and to other bands (Parts 24 and 27), was not read; operators sell drone plans under their own terms (est).", refs: [r6], conf: med, kind: rule}
  - {id: d14, area: "Release roadmap", rule: "Plan IoT-NTN (NB-IoT / eMTC over satellite) now, from Release 17 (first normative NTN, ASN.1 frozen June 2022); expect RedCap over NTN, regenerative payloads and store-and-forward from Release 19.", why: "r1 release history.", refs: [r1], conf: high, kind: consideration}
trends:
  - {id: t1, text: "IoT-NTN modules (NB-IoT / LTE-M over satellite, Release 17) ship in trackers, cars and watches; drones adopt them as a telemetry fallback.", horizon: now, refs: [r1, r5], conf: med, for_us: "SKY68040-11 covers the terrestrial and NTN bands on one PA: the drone version of an IoT front-end socket."}
  - {id: t2, text: "Direct-to-cell from LEO constellations in the operators' own bands, licensed in the US as supplemental coverage from space.", horizon: now, refs: [r4], conf: med, for_us: "No new RF block; it rewards efficient, linear phone-band PAs at full power and a second receive branch (est)."}
  - {id: t3, text: "Release 19 brings RedCap over NTN, regenerative payloads and store-and-forward for coverage gaps.", horizon: 2-3y, refs: [r1], conf: high, for_us: "Higher-rate satellite links for drones (est) need RedCap-class front ends with L / S-band coverage."}
  - {id: t4, text: "Higher power classes (PC2 26 dBm, PC1 31 dBm) for non-phone NTN terminals.", horizon: 2-3y, refs: [r2, r3], conf: med, for_us: "A 26–31 dBm L / S-band PA with low noise in the GNSS band is a gap we can fill (est)."}
  - {id: t5, text: "New band n254 (uplink 1610–1626.5 MHz) right at the top of the GNSS band.", horizon: 2-3y, refs: [r1, r2], conf: high, for_us: "GNSS front ends need specified rejection at 1610–1660 MHz; a combined NTN + GNSS front-end reference would be new (est)."}
skyworks_fit:
