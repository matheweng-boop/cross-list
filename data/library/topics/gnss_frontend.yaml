topic: gnss_frontend
title: "Automotive multi-band GNSS front ends for lane-level ADAS"
summary: "Lane-level positioning in cars is moving from L1-only to dual- and triple-frequency GNSS (L1/E1, L2, L5/E5, E6) with PPP-RTK corrections over cellular or L-band satellites, and receivers now take every band through one RF input. The antenna-side front end in the shark fin (filters, LNA, band split, and DC feed over the coax) has to deliver 17 to 40 dB of gain after cable loss with low noise figure. It also has to keep out the car's own LTE/5G, V2X, Wi-Fi and, soon, NTN transmitters, and pass the EU rule of at most 1 dB C/N0 loss under blocking (ETSI EN 303 413). Skyworks' SKY5A2110 already covers L1 + L5 with documented rejection up to 7.1 GHz. The gaps are L2/E6, L-band, a single input, Grade 1, and data on the NTN band next to L1."
references:
  - {id: r1, title: "ETSI EN 303 413 V1.2.1 (2021-04): GNSS receivers operating in 1164-1300 MHz and 1559-1610 MHz; Harmonised Standard for access to radio spectrum", publisher: "ETSI", year: 2021, url: "https://www.etsi.org/deliver/etsi_en/303400_303499/303413/01.02.01_60/en_303413v010201p.pdf", type: standard, licence: "ETSI copyright; free public download", retrieved: 2026-10-21, why: "EU RED requirement for every GNSS receiver: blocking test points, ΔC/N0 ≤ 1 dB, spurious emission limits"}
  - {id: r2, title: "ZED-X20P Integration manual R05 (UBXDOC-963802114-12901)", publisher: "u-blox", year: 2026, url: "https://content.u-blox.com/sites/default/files/documents/ZED-X20P_IntegrationManual_UBXDOC-963802114-12901.pdf", type: app_note, licence: "u-blox copyright; C1-Public document", retrieved: 2026-10-21, why: "All-band (L1/L2/L5/E6, L-band) receiver: external gain window, active-antenna NF/rejection/group-delay spec, rejection budget, B13/B14 notch, bias-T, spectrum monitor"}
  - {id: r3, title: "SKY5A2110 Automotive GNSS L1 + L5 LNA front-end module with pre- and post-filter and diplexed output, data sheet 206174G", publisher: "Skyworks Solutions", year: 2025, url: "https://www.skyworksinc.com/-/media/SkyWorks/Documents/Products/Data-Sheet/SKY5A2110_206174G.pdf", type: app_note, licence: "Skyworks copyright; public datasheet", retrieved: 2026-10-20, why: "Our automotive part: measured per-band out-of-band rejection (600 MHz-7.1 GHz), B13 harmonic, gain under +10/+15 dBm blockers, NF over temperature"}
  - {id: r4, title: "Low-Cost, Triple-Frequency, Multi-GNSS PPP and MEMS IMU Integration for Continuous Navigation in Simulated Urban Environments (Vana, Bisnath)", publisher: "NAVIGATION (Institute of Navigation) 70(2)", year: 2023, url: "https://navi.ion.org/content/navi/70/2/navi.578.full.pdf", type: paper, licence: "CC BY 4.0", retrieved: 2026-10-21, why: "Land-vehicle study quantifying single- vs dual- vs triple-frequency PPP + IMU with a low-cost patch antenna"}
  - {id: r5, title: "GNSS Jamming Detection with Automatic Gain Control (AGC) and Carrier-to-Noise Ratio Density (CNO) Observables from a COTS receiver (Kazim, Darwich, Marais)", publisher: "arXiv 2602.12688", year: 2026, url: "https://arxiv.org/pdf/2602.12688", type: paper, licence: "arXiv distribution licence (specific licence not checked)", retrieved: 2026-10-21, why: "Interference monitoring with front-end observables; measured detection and false-alarm rates for AGC vs C/N0"}
  - {id: r6, title: "Microwave and RF Design IV: Modules (Steer), 4.3 Noise Characterization", publisher: "LibreTexts / NC State University", year: 2020, url: "https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Electronics/Microwave_and_RF_Design_IV:_Modules_(Steer)/04:_Noise_Distortion_and_Dynamic_Range/4.03:_Noise_Characterization", type: textbook, licence: "Page states 'not declared' licence (LibreTexts); read only", retrieved: 2026-10-21, why: "Friis cascade, attenuator noise figure and the first-stage rule behind pre- vs post-filter and cable-loss budgets"}
block_diagram:
  name: "Automotive all-band GNSS active antenna to receiver"
  note: "A roof or shark-fin active antenna (RHCP patch, pre-filter/notch, per-band LNAs, post-filters, diplexer) feeds one coax, carrying RF up and DC down, to an all-band receiver with internal LNA/AGC and a spectrum monitor. Corrections arrive over cellular or L-band, and the receiver feeds ADAS fusion. Aggressors in the same fin are shown. Drawn by us from r2, r3 and r6 (not copied)."
  groups:
    - {id: g1, label: "Antenna element (RHCP patch, L1 + L2/L5/E6 + L-band)", col: 0, row: 0, blocks: [{fn: antenna, label: "Multi-band patch, ground plane"}]}
    - {id: g2, label: "Active antenna front end (shark fin)", col: 1, row: 0, blocks: [{fn: filter_saw_baw, label: "Pre-filter / B13-B14 notch"}, {fn: gnss_lna, label: "L1/E1 LNA"}, {fn: gnss_lna, label: "L2/L5/E5/E6 LNA"}, {fn: filter_saw_baw, label: "Post-filters"}, {fn: diplexer, label: "Band split / diplexer"}, {fn: tvs_esd, label: "ESD protection"}]}
    - {id: g3, label: "Same-fin aggressors", col: 1, row: 1, blocks: [{fn: modem, label: "LTE/5G incl. B13, n77/n79, NTN"}, {fn: v2x_fem, label: "V2X 5.9 GHz"}, {fn: wifi_fem, label: "Wi-Fi 2.4/5/6 GHz"}]}
    - {id: g4, label: "Receiver side (TCU / ADAS ECU)", col: 2, row: 0, blocks: [{fn: rf_passive, label: "Bias-T"}, {fn: load_switch, label: "Antenna supply current limit, short/open detect"}, {fn: soc, label: "All-band GNSS receiver (internal LNA, PGA/AGC, spectrum monitor)"}]}
    - {id: g5, label: "Corrections", col: 2, row: 1, blocks: [{fn: modem, label: "Cellular SSR / NTRIP"}, {fn: soc, label: "L-band correction receiver"}]}
    - {id: g6, label: "Positioning and ADAS", col: 3, row: 0, blocks: [{fn: adas_processor, label: "PPP-RTK + IMU fusion, lane-level"}]}
  links:
    - [g1, g2, "GNSS RF (-130 dBm class)"]
    - [g3, g1, "coupled interference (isolation 6-20 dB)"]
    - [g2, g4, "coax: RF up, DC bias down"]
    - [g5, g4, "SPARTN / CLAS / RTCM corrections"]
    - [g4, g6, "position, raw data, AGC/jamming flags"]
design_rules:
  - {id: d1, area: "Gain budget", rule: "Net gain from antenna to receiver input, including cable, filter and connector losses, must be 17-40 dB (receiver LNA normal mode) or 20-50 dB (low-gain mode); these ratings do not apply to L-band", why: "Below the minimum, cable and receiver noise add to NF; above the maximum, the receiver PGA runs out of dynamic range", refs: [r2], conf: high, kind: rule}
  - {id: d2, area: "Active antenna spec", rule: "Active antenna module: NF < 3.5 dB, out-of-band rejection 40 dB typ, in-band group-delay variation < 10 ns typ; L1/L2/L5/E6 element gain 3 dBic typ, L-band 4 dBic typ", why: "Receiver maker's minimum for all-band RTK; group delay is the new constraint compared with L1-only antennas", refs: [r2], conf: high, kind: rule}
  - {id: d3, area: "Noise figure", rule: "Budget NF with the Friis cascade: any loss before the LNA (pre-filter, notch, input split) adds dB for dB to NF; compare modules with bare LNAs on cascaded NF including the filter the bare LNA needs", why: "F = F1 + (F2-1)/G1 + …; a passive attenuator's NF equals its loss. Our example: a 1.3 dB / 18 dB LNA followed by 6 dB cable and a 3 dB receiver gives ≈1.6 dB in total; with 28 dB gain it stays within 0.05 dB", refs: [r6, r3], conf: high, kind: rule}
  - {id: d4, area: "Out-of-band rejection", rule: "Required rejection = (aggressor Tx power - antenna isolation) - receiver immunity limit; plan on 15-20 dB isolation (6-10 dB in very small modules), usually met with one or two SAW filters, and remember that LNA gain reduces the effective rejection", why: "The cellular uplink (+23 to +30 dBm) is more than 150 dB above the GNSS signal at the antenna", refs: [r2], conf: high, kind: rule}
  - {id: d5, area: "B13/B14 harmonic", rule: "Place a 777-798 MHz notch before the first active stage; target B13 2fo of about -108 dBm typ (SKY5A2110: -108.5 typ, -97 max at NTC)", why: "The 2nd harmonic of LTE B13/B14 uplink lands at 1554-1596 MHz, on L1/E1/B1I, and is generated inside the LNA if the fundamental reaches it", refs: [r2, r3], conf: high, kind: rule}
  - {id: d6, area: "Blocker robustness", rule: "Specify LNA gain under in-fin blockers: SKY5A2110 holds 17-21 dB gain with +15 dBm at 600-960 MHz and +10 dBm at 1.7-8 GHz; absolute maximum input +10 dBm, in-band IIP3 -8.6 dBm typ", why: "With 15-20 dB isolation, a +23 dBm UE puts about +3 to +8 dBm at the GNSS antenna; compression collapses C/N0 on all bands", refs: [r3, r2], conf: high, kind: rule}
  - {id: d7, area: "Per-aggressor check", rule: "Check the worst-case (max) rejection line for each in-fin radio, not the typical: SKY5A2110 L1 shows -42 dB max at 2.4/5 GHz Wi-Fi, -47 dB max at 1710-1980 MHz and B13/B14, and -50 dB max at 5.15-7.125 GHz (V2X/Wi-Fi 7), against -58 to -66 dB typ", why: "Typical rejection hides 10-20 dB of spread; V2X and Wi-Fi transmitters share the fin", refs: [r3], conf: high, kind: consideration}
  - {id: d8, area: "ETSI EN 303 413", rule: "Each declared constellation/signal must lose ≤ 1 dB C/N0 with a 1 MHz AWGN blocker at 1524 MHz/-65 dBm, 1548/-95, 1554/-105, 1615/-105 and 1627/-85 dBm (L1 band), and at 1154 MHz/-75 and 1310 MHz/-85 dBm (1164-1300 MHz band)", why: "Presumption of conformity under the EU Radio Equipment Directive; adding L2/E6 adds signals that each must pass", refs: [r1], conf: high, kind: rule}
  - {id: d9, area: "ETSI noise basis", rule: "Near-band blocker levels are set at I/N = -6 dB: -174 dBm/Hz + 73 dB-Hz (20 MHz) + 2 dB NF - 6 dB = -105 dBm; declared NF and RF bandwidth enter the calculation", why: "I/N of -6 dB costs about 1 dB C/N0 (10·log(1.25)); a low-NF, narrow front end has the least margin to near-band MSS signals", refs: [r1], conf: high, kind: consideration}
  - {id: d10, area: "Spurious emissions and stability", rule: "Receiver spurious emissions at the antenna port must be ≤ -57 dBm/100 kHz (30 MHz-1 GHz) and ≤ -47 dBm/1 MHz (1-8.3 GHz); require LNA stability k ≥ 1.5 out to 15 GHz across temperature", why: "A high-gain active antenna on a long coax can oscillate or radiate; SKY5A2110 specifies k ≥ 1.5 from 10 to 15000 MHz", refs: [r1, r3], conf: high, kind: rule}
  - {id: d11, area: "DC feed over coax", rule: "Bias-T inductor > 500 Ω across 1-1.8 GHz and ≥ 300 mA rated; current limit (60 mA example) with antenna short and open detection; active antennas draw 5-20 mA typ", why: "Antenna diagnostics and protection against short circuits in the harness; RF must not leak into the supply", refs: [r2], conf: high, kind: rule}
  - {id: d12, area: "Temperature", rule: "Budget NF at the hot corner: SKY5A2110 L1 NF 1.2 dB typ / 2.4 dB max and L5 1.4-1.5 typ / 3.0 max at -40 to +105 °C (Grade 2, TJ max 105 °C)", why: "Roof modules get hot; the max NF approaches the 3.5 dB antenna-module limit before cable and filter loss", refs: [r3, r2], conf: high, kind: consideration}
  - {id: d13, area: "L-band corrections", rule: "If the antenna also serves L-band corrections, the L1 path must pass about 1525/1535-1602 MHz yet still fall steeply below 1525 MHz (ETSI -65 dBm point at 1524 MHz); the receiver's external-gain window does not cover L-band", why: "Widening the L1 filter for corrections moves the stopband edge toward the MSS downlink", refs: [r1, r2], conf: med, kind: consideration}
  - {id: d14, area: "Placement", rule: "Mount the GNSS antenna on the roof or fin over a ground plane (spec measured on a 120 mm plane); under-dash and rear-view-mirror positions are unsuitable", why: "Sky view, multipath and axial ratio set the C/N0 that the front end can preserve", refs: [r2], conf: high, kind: consideration}
trends:
  - {id: t1, text: "Triple-frequency PPP / PPP-RTK fused with a MEMS IMU on low-cost patch antennas for L3 lane-level positioning: 7 cm (triple frequency) vs 9 cm (dual) vs 124 cm (single) horizontal rms, and 10-40 % better than dual frequency during outages with 0-2 satellites", horizon: 2-3y, refs: [r4], conf: high, for_us: "Supports adding a third band (L2 or E6) to the automotive front end; the value is continuity in urban driving, which OEMs can weigh"}
  - {id: t2, text: "All-band receivers with one RF input and three internal LNA paths (L1/L2/L5/E6 plus L-band), with SPARTN corrections over IP or L-band and CLAS", horizon: now, refs: [r2], conf: high, for_us: "Two-input L1 + L5 modules fit poorly; a single-input, triplexed L1 + L2/E6 + L5 module with a group-delay spec is the matching socket"}
  - {id: t3, text: "Interference monitoring from front-end observables (AGC, C/N0, spectrum analyser): AGC detected 7 of 7 chirp jamming intervals, C/N0 5 of 7 with 23 % false alarms; AGC drifts with temperature", horizon: now, refs: [r5, r2], conf: high, for_us: "A front end with flat, characterised gain over temperature (or a built-in power-detect or interference flag) makes the receiver's jamming detection more reliable"}
  - {id: t4, text: "More transmitters co-located in the roof fin (5G n77/n79, V2X, Wi-Fi 6E/7 up to 7.125 GHz, NTN): GNSS rejection specs now extend to 7.1 GHz", horizon: 2-3y, refs: [r3, r2], conf: med, for_us: "One supplier for GNSS, V2X and cellular front ends can publish co-location data; rejection near 1610-1660 MHz (NTN uplink) is a gap to close"}
  - {id: t5, text: "Harmonised-standard conformance per declared signal (ΔC/N0 ≤ 1 dB); more bands mean more test cases and tighter near-band filtering", horizon: now, refs: [r1], conf: high, for_us: "Offer pre-tested EN 303 413 blocking data per band with the module, to shorten Tier-1 compliance"}
  - {id: t6, text: "Group delay and phase-centre stability become front-end specs for carrier-phase positioning (< 10 ns in-band group-delay variation, < 10 mm phase-centre variation)", horizon: 2-3y, refs: [r2], conf: high, for_us: "BAW/SAW selection for multi-band modules must be specified on group-delay ripple as well as insertion loss and rejection"}
skyworks_fit:
  - {fn: gnss_lna, parts: ["SKY5A2110"], note: "Automotive L1 + L5 module, AEC-Q104 Grade 2, with pre/post filters, B13 notch and diplexed output; two RF inputs; no L2/E6/L-band"}
  - {fn: gnss_lna, parts: ["SKY55951-11", "SKY65943-11", "SKY65728-11", "SKY65730-13"], note: "Non-automotive building blocks: L1 + L5 module, L1 pre/post-filter FEM, L5 LNA with pre-filter, L5/E5a LNA (1166-1217 MHz; catalogue lists SKY65730-13 under rf_frontend)"}
  - {fn: filter_saw_baw, parts: ["880272", "880273", "880060", "880094"], note: "Qorvo BAW and wideband GPS L1 filters (880273: 1575 MHz, IL 2.35 dB typ); no E6 or L-band filter in the catalogue; automotive qualification not stated"}
  - {fn: diplexer, parts: ["QPQ1028", "TQM2M9016"], note: "L1/L2 SAW diplexer (IL 3.0/2.6 dB typ) and automotive SDARS/GPS diplexer; the 890084/890085/890086 L1/L2 and L1/L5 SAW diplexers are discontinued"}
  - {fn: v2x_fem, parts: ["SKY5A2105", "QPF1003Q"], note: "Same-fin V2X front ends: aggressors we can characterise against our own GNSS module"}
  - {fn: filter_saw_baw, parts: ["QPQ2230Q", "SKY5A1005"], note: "V2X notch filters on the transmitter side reduce 5.9 GHz energy reaching the GNSS antenna"}
open_questions:
  - "Is there a newer EN 303 413 version (V1.3.x) with changed blocking points, e.g. for NTN or L-band? Only V1.2.1 (2021) was read."
  - "What are the 3GPP n255/n256 NTN UE emission and co-location limits next to L1 (1626.5-1660.5 MHz uplink, from memory; not read in this run)?"
  - "What is the receiver immunity limit in dBm per band? u-blox gives it only as plots (ZED-X20P Figs. 16-17)."
  - "What are SKY5A2110's cascaded NF and C/N0 against TI TRF3302-Q1 plus SAW in a real fin with V2X and LTE transmitting?"
  - "Can Qorvo BAW deliver a 1525/1535-1602 MHz L1 + L-band filter with a steep lower edge (ETSI 1524 MHz point) and low group-delay ripple, automotive qualified?"
  - "Do OEMs require a jamming/interference flag or antenna diagnostics from the antenna module itself, or only from the receiver?"
