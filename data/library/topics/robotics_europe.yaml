design_rules:
  - {id: d1, area: "EU market access", rule: "Plan every robot, cobot, AMR and robot cell placed on the EU market from 20 January 2027 against the Machinery Regulation (EU) 2023/1230; before that date the Machinery Directive 2006/42/EC applies, and a maker may already state conformity with both.", why: "r4: the Regulation is mandatory from 20 January 2027; machinery placed earlier must comply with the Directive.", refs: [r4], conf: high, kind: rule}
  - {id: d2, area: "AI-powered safety functions", rule: "Treat any safety function that learns or uses AI (person detection by camera, adaptive speed limits) as a safety function under the Machinery Regulation, with its own risk assessment and, for higher-risk cases, a notified body.", why: "r4: the Regulation integrates provisions for machinery with AI-powered safety functions and addresses the conformity assessment of higher-risk machinery. Under the EU AI Act such AI is likely high-risk as a safety component of a regulated product (est, the AI Act was not read).", refs: [r4], conf: med, kind: rule}
  - {id: d3, area: "Cyber-safety", rule: "Protect the safety software and its data against corruption and unauthorised change (signed firmware, secure boot, logged changes) in the robot controller and the safety controller.", why: "r4: the Regulation adds cyber-safety for compliance-relevant software, data and safety control systems; r5: the CRA adds secure updates and vulnerability handling for products with digital elements.", refs: [r4, r5], conf: high, kind: rule}
  - {id: d4, area: "Cyber Resilience Act timing", rule: "Have a vulnerability-reporting process running now and the full CRA design obligations (secure by default, security updates over the support period) ready for products placed on the market from 11 December 2027.", why: "r5: reporting obligations apply from 11 September 2026, main obligations from 11 December 2027, shown by the CE marking.", refs: [r5], conf: high, kind: rule}
  - {id: d5, area: "Safe torque off (STO)", rule: "Build STO with two independent channels: one blocks the PWM at the gate-driver inputs through a digital isolator, the other removes the gate-driver supply; feed back both states to the safety controller for diagnostics.", why: "Common practice for PL e / SIL 3 STO in European servo drives (est, IEC 61800-5-2 and EN ISO 13849-1 not read: iso.org is blocked); Si86xx isolators and Si875x isolated FET drivers fit both paths (r6).", refs: [r6], conf: med, kind: rule}
  - {id: d6, area: "Gate drive and short-circuit", rule: "Use isolated gate drivers with desaturation detection, soft shut-down and a safe output state on supply loss for each half-bridge; check the dead time and bootstrap or isolated bias supply at the chosen PWM.", why: "r6: Si828x are isolated gate drivers with integrated system safety (DESAT), 4 A; a robot axis may stall or short in a crash, and the driver must turn the IGBT or SiC switch off safely (est).", refs: [r6], conf: high, kind: rule}
  - {id: d7, area: "CMTI", rule: "Choose isolators and gate drivers with a CMTI well above the dv/dt of the power stage (tens of V/ns for IGBT, 100 V/ns or more for SiC and GaN axes, est).", why: "A fast switching edge across the isolation barrier can flip a digital isolator output and cause a shoot-through; SiC and GaN in compact joint drives raise the dv/dt (est).", refs: [r6], conf: med, kind: rule}
  - {id: d8, area: "Phase current sensing", rule: "Measure two or three phase currents with a shunt and an isolated delta-sigma modulator (±62.5 mV input class) when the FOC loop runs in the controller FPGA or MCU; use an isolated amplifier where an analog ADC input is kept.", why: "r6: Si8941 is an isolated delta-sigma modulator with ±62.5 mV input, Si8922 an isolated amplifier with 8-62.5 mV range; the accuracy of the shunt path sets torque ripple and positioning (est).", refs: [r6], conf: high, kind: rule}
  - {id: d9, area: "Holding brake", rule: "Drive the 24 V holding brake from an isolated high-side switch with load diagnostics and include it in safe brake control (two channels when a vertical axis can fall).", why: "r6: Si834x isolated smart switch, 2.5 A sourcing, with channel status and low-voltage indicators; a gravity-loaded axis that drops is a crushing hazard (est).", refs: [r6], conf: med, kind: consideration}
  - {id: d10, area: "Encoders", rule: "Isolate the RS-485 link to the absolute encoder (EnDat 2.2, BiSS-C or the one-cable HIPERFACE DSL) where the encoder cable runs with the motor phases.", why: "r6: Si85833D is a 5 kV isolated RS-485 transceiver for up to 1 Mbit/s; one-cable encoders run their data inside the motor cable, where the phase dv/dt couples in (est).", refs: [r6], conf: med, kind: consideration}
  - {id: d11, area: "24 V I/O and IO-Link", rule: "Use IEC 61131-2 type 1 / 3 isolated inputs and isolated high-side outputs on the controller and the tool flange; reserve IO-Link ports for smart grippers and sensors.", why: "r6: Si838x eight-channel 24 V isolated inputs (2.5 kVrms, 4 µs) and Si834x outputs fit; IO-Link (IEC 61131-9, est) is the European standard for the last metre to sensors and tools, and we have no IO-Link PHY.", refs: [r6], conf: med, kind: rule}
  - {id: d12, area: "Drive network", rule: "Offer the drive interface for EtherCAT first in robots and motion control, PROFINET for Siemens-led factories, and plan for TSN; a single multi-protocol Ethernet controller covers all three.", why: "European robot and machine builders favour EtherCAT (Beckhoff, ETG) for motion and PROFINET (Siemens, PI) for factory networks; TSN (IEC/IEEE 60802) is coming (est, ethercat.org and profibus.com not read).", refs: [r2], conf: low, kind: consideration}
  - {id: d13, area: "Single Pair Ethernet", rule: "Consider 10BASE-T1L (IEEE 802.3cg, up to 1 km, 10 Mbit/s, power over the pair) for sensors and the robot base, and 100BASE-T1 inside the arm, to save cable and slip-ring channels.", why: "Our reading of SPE and Ethernet-APL (est, not read in a primary source); fewer wires through the arm joints matter for cobots and humanoids.", refs: [r3], conf: low, kind: consideration}
  - {id: d14, area: "Cobots and ISO 10218", rule: "Design power and force limiting (PFL) of collaborative robots to ISO 10218-1 / -2:2025, which now carry the collaborative-application content that was in ISO/TS 15066, and keep the body-region force and pressure limits in the risk assessment.", why: "Our reading (est): the 2025 revision of ISO 10218 folds in ISO/TS 15066; harmonised EN versions give the presumption of conformity under r4. iso.org is blocked, the standards were not read.", refs: [r4], conf: low, kind: rule}
  - {id: d15, area: "AMR radio and positioning", rule: "Give the AMR Wi-Fi 6 / 7 for the fleet, a private 5G option in n78 (3.7-3.8 GHz local licences in Germany, est) for large sites, and UWB for docking and precise positioning where laser SLAM is weak.", why: "Transport and logistics robots are the largest service-robot application (r3); our reading of European campus networks (est).", refs: [r3], conf: med, kind: consideration}
trends:
  - {id: t1, text: "Europe automates slowly but steadily: the EU's robot stock rose from 390,000 (2015) to 712,000 (2025); installations grew 3% a year from 2020 to 2025 but fell 11% in 2025 to 60,500, with automotive down 25%.", horizon: now, refs: [r2], conf: high, for_us: "Robot volume alone is small for us (est); the same isolators, gate drivers and current-sense parts sell into the much larger servo-drive and PLC market that robots pull along."}
  - {id: t2, text: "Global demand keeps growing: 655,000 installations expected in 2026 and 806,000 in 2029; reshoring and labour shortage in high-wage countries drive automation.", horizon: 2-3y, refs: [r1], conf: high, for_us: "European reshoring favours European robot and drive makers, who are long-time users of isolated gate drivers and digital isolators (est)."}
  - {id: t3, text: "Humanoids move from demos into car plants: IFR shows NEURA Robotics humanoids in automotive assembly (NEURA 4NE-1, est); Agile Robots, Figure, Apptronik, Unitree and others compete (est).", horizon: 2-3y, refs: [r3], conf: med, for_us: "A humanoid has 20-40 joints on a 48 V battery (est): many small motor drives (PAC5527, ACT72350 class), isolated sensing only at the battery and charger, plus Wi-Fi and UWB; content per robot is many times a 6-axis arm (est)."}
  - {id: t4, text: "AI, machine vision and sensing expand what robots can do, and easier programming cuts deployment cost (r1); the Machinery Regulation now covers AI-powered safety functions (r4).", horizon: now, refs: [r1, r4], conf: high, for_us: "More cameras and compute on the robot raise the timing and power content; AI safety functions keep the two-channel safety architecture (isolators) in place (est)."}
  - {id: t5, text: "Chinese robot makers enter the EU with European distribution hubs; KUKA is already Chinese-owned (Midea, since 2017, est).", horizon: now, refs: [r2], conf: med, for_us: "Price pressure on the robot bill of materials; Chinese isolator makers (NOVOSENSE, est) follow their robot customers into Europe."}
  - {id: t6, text: "Mobile robots grow faster than arms: professional service robots +24% in 2025, transport and logistics the largest application (about 117,000 units).", horizon: now, refs: [r3], conf: high, for_us: "AMRs carry our RF: Wi-Fi 7 FEMs, 5G n78 front ends and UWB (Qorvo) plus timing; this is where Skyworks and Qorvo content per robot is largest (est)."}
  - {id: t7, text: "Cybersecurity becomes a CE-marking topic: CRA reporting from September 2026 and full obligations from December 2027.", horizon: 2-3y, refs: [r5], conf: high, for_us: "Secure elements and signed firmware in robot controllers; no direct part of ours, but it lengthens design cycles in 2026-2027 (est)."}
