why_customer:
  - "Europe is a large robot market that is growing slowly: the EU runs 712,000 robots and installed 60,500 in 2025, 11% fewer than in 2024, while Asia and the Americas each grew 14% (r2). Every new robot design for the EU must meet the Machinery Regulation from 20 January 2027 (r4), so 2026-2027 designs are being reworked now (est)."
  - "Safety is the European design driver: the Machinery Regulation adds AI-powered safety functions and the cyber-safety of safety software and data (r4); the robot maker proves PL d / PL e under EN ISO 13849-1 for safe torque off, safe stop and safe brake control, which needs two independent channels and isolators and drivers with a defined safe state (est)."
  - "Each axis is a servo drive: isolated gate drivers with desaturation (DESAT) protection drive the half-bridge, isolated amplifiers or delta-sigma modulators read the phase shunt, and the FOC current loop runs on that data; better CMTI and current-sense accuracy give smoother motion and finer torque control (r6, est)."
  - "Labour shortage and reshoring are the stated reasons to automate in Europe (r1, r2); cobots and mobile robots bring robots to small and medium firms that have no robot cell today (est)."
  - "Connected robots fall under the Cyber Resilience Act: secure updates, vulnerability handling and reporting from 11 September 2026 and full obligations from 11 December 2027 (r5); this pushes secure boot, secure elements and remote update into the controller and the AMR (est)."
  - "Mobile robots are the fastest-growing part: professional service robots grew 24% to almost 250,000 units in 2025, led by transport and logistics with about 117,000 (r3). Each AMR carries Wi-Fi or private 5G, often UWB, a 48 V battery and two to four motor drives (est)."
block_diagram:
  name: "European robot cell: controller, safety, six servo axes, joints, 24 V / IO-Link tools and the AMR that feeds it"
  note: "Drawn by us from r4 (safety functions and cyber-safety in the Machinery Regulation), r6 (our isolation parts) and the three Robotics (European view) block diagrams in the Block diagram library. Voltages and protocols are typical European practice (est): 400 V AC mains, 560-750 V DC link, 24 V control, EtherCAT or PROFINET to the drives, IO-Link to the tool."
  groups:
    - {id: g1, label: "Robot controller (motion planning, EtherCAT / PROFINET master)", col: 0, row: 0, blocks: [soc, {fn: ethernet_phy, label: "EtherCAT / PROFINET / TSN ports"}, clock_generator, secure_element]}
    - {id: g2, label: "Safety controller (two channels, PL d / PL e, est)", col: 0, row: 1, blocks: [{fn: mcu, label: "Safety MCU x2 (FSoE / PROFIsafe)"}, digital_isolator, isolated_digital_input, watchdog]}
    - {id: g3, label: "Servo axis x6 (560-750 V DC link)", col: 1, row: 0, blocks: [{fn: gate_driver, label: "Isolated gate drivers with DESAT"}, {fn: isolated_amplifier, label: "Isolated delta-sigma modulator on the shunt"}, power_module, isolated_dcdc]}
    - {id: g4, label: "Safe torque off and brake", col: 1, row: 1, blocks: [{fn: digital_isolator, label: "STO channels"}, {fn: isolated_smart_switch, label: "24 V brake output"}]}
    - {id: g5, label: "Joint (PMSM, gearbox, encoder, brake)", col: 2, row: 0, blocks: [motor, {fn: rs485_transceiver, label: "Isolated RS-485 to EnDat / BiSS encoder"}, position_sensor]}
    - {id: g6, label: "Tool: 24 V I/O and IO-Link", col: 2, row: 1, blocks: [isolated_smart_switch, isolated_digital_input, {fn: external_block, label: "IO-Link master / device PHY"}]}
    - {id: g7, label: "Mobile robot (AMR): radio and positioning", col: 3, row: 0, blocks: [wifi_fem, {fn: rf_frontend, label: "Private 5G (n78) front end"}, uwb_soc, crystal_oscillator]}
    - {id: g8, label: "AMR drives and 48 V battery", col: 3, row: 1, blocks: [motor_controller, battery_monitor, {fn: wireless_power, label: "Inductive charging"}]}
  links:
    - [g1, g3, "EtherCAT, distributed clocks"]
    - [g2, g4, "STO / SS1 / safe brake control"]
    - [g4, g3, "gate enable"]
    - [g3, g5, "3 phases"]
    - [g5, g3, "position"]
    - [g1, g6, "IO-Link / 24 V"]
    - [g1, g7, "Wi-Fi / private 5G to the fleet"]
