market:
  - {segment: "EU installed base", text: "712,000 industrial robots in operation in the EU-27 in 2025, 84% of Europe's; 390,000 in 2015.", refs: [r2], conf: high}
  - {segment: "Installations by country (2025)", text: "Germany 24,800 (41% of the EU, fifth in the world, automotive 23% and metal 21% of its demand); Italy 7,800 (13%, metal 29%); France 4,500 (7%, automotive 21%); Spain 4,300 (7%, automotive 43%). EU total 60,500, down 11%.", refs: [r2, r1], conf: high}
  - {segment: "By industry (EU 2025)", text: "Automotive 14,900 (-25%), metal 13,000 (-13%), plastics and chemicals 7,400 (-3%), food and beverage 5,300 (+4%).", refs: [r2], conf: high}
  - {segment: "European robot makers", text: "ABB Robotics (Swiss-Swedish; sale to SoftBank announced in 2025, est), KUKA (Augsburg, Germany, owned by China's Midea since 2017, est), Stäubli (Switzerland / France; its robotics head is IFR vice president, r3), Comau (Turin, Italy, est), Universal Robots (Odense, Denmark, owned by Teradyne, est), Franka Robotics (Munich, part of Agile Robots, est), NEURA Robotics (Metzingen, Germany; humanoid 4NE-1, est), Agile Robots (Munich, est). They compete with Fanuc Europe (Luxembourg, est) and Yaskawa Europe (Germany, with a robot plant in Slovenia, est) and with new Chinese entrants (r2).", refs: [r3, r2], conf: med}
  - {segment: "Mobile robots", text: "Almost 250,000 professional service robots sold worldwide in 2025 (+24%), about 117,000 for transport and logistics; the European share was not in the pages read (est).", refs: [r3], conf: med}
  - {segment: "Our socket value (est)", text: "Our estimate: about USD 15-25 of isolation, gate-drive and current-sense content per servo axis, about USD 100-150 per six-axis robot, so about USD 6-9 million a year across the EU's 60,500 new robots; the far larger value is in the servo drives, PLCs and AMRs around them (est).", refs: [], conf: low}
open_questions:
  - "Which European robot and servo makers (KUKA, Stäubli, Comau, Universal Robots, NEURA) already use Skyworks isolators or gate drivers, and which use Infineon / TI? No public design-win data was read."
  - "Does the EU AI Act classify AI safety functions in robots as high-risk from August 2027, and has the Digital Omnibus moved that date? eur-lex.europa.eu is blocked by a bot check; the AI Act was not read (est)."
  - "Is an IO-Link transceiver (device or master) worth adding next to Si838x / Si834x? The IO-Link consortium pages and market data were not read."
  - "What share of European AMRs use private 5G versus Wi-Fi, and do they buy modules or chip-down radios? No public figure was read."
  - "Are the ISO 10218-1 / -2:2025 editions harmonised under the Machinery Regulation yet, and does the 2025 edition fully replace ISO/TS 15066? iso.org is blocked; not read."
  - "Is the SoftBank purchase of ABB Robotics closed, and does it change ABB's European supply chain? Press reports only, not read here."
