  - {fn: clock_generator, parts: ["Si5341A"], note: "Controller clocks for multi-port EtherCAT / TSN and the vision compute (est)."}
  - {fn: crystal_oscillator, parts: ["Si545"], note: "Reference clock for Ethernet PHYs and radios."}
  - {fn: wifi_fem, parts: ["QPF4557", "QM45655"], note: "Qorvo Wi-Fi 7 FEMs for AMR fleet links (5 GHz and 5-7 GHz)."}
  - {fn: rf_frontend, parts: ["SKY58261-11"], note: "5G NR n77 / n78 front end for private campus 5G (est fit: designed for phones)."}
  - {fn: uwb_soc, parts: ["QM33120W", "DWM3001C"], note: "Qorvo UWB for AMR docking, positioning and worker-robot distance (est)."}
  - {fn: uwb_fem, parts: ["QM14068"], note: "UWB LNA / bypass switch for longer-range anchors in large halls."}
  - {fn: motor_controller, parts: ["PAC5527QM", "ACT72350"], note: "Qorvo one-chip BLDC controllers for 48 V AMR wheels, grippers and humanoid joints; PAC5527 up to 48 V, ACT72350 up to 160 V."}
