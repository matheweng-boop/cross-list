order: 13
topic: robotics_europe
title: "Robotics in Europe: robot makers, installations, EU rules, fieldbuses and where our parts sit"
summary: "Europe runs about 712,000 industrial robots in the EU alone (2025) and installs about 60,500 a year, 41% of them in Germany, then Italy, France and Spain. The robots are built by European makers (ABB, KUKA, Stäubli, Comau, Universal Robots, Franka, NEURA Robotics, Agile Robots) competing with the European arms of Fanuc and Yaskawa, and now Chinese entrants. Inside each robot sit six or more servo axes with isolated gate drivers and isolated current sensing, safe torque off (STO) and a safety controller, absolute encoders and holding brakes, linked by EtherCAT or PROFINET; mobile robots (AMR) add safety laser scanners, a 48 V battery and Wi-Fi, private 5G and UWB. From 20 January 2027 every robot placed on the EU market falls under the new Machinery Regulation (EU) 2023/1230, and from December 2027 under the Cyber Resilience Act."
