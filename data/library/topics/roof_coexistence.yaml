    - [g9, g3, "DC / phantom feed"]
    - [g9, g4, "power"]
design_rules:
  - {id: d1, area: "Isolation vs filtering budget", rule: "Budget V2X/Wi-Fi coexistence as antenna isolation + filter rejection. With only a broadband LTCC filter on the V2X TX path, more than 80 dB of antenna isolation is needed for a 1 km V2X link next to 5 GHz Wi-Fi. With a B47 BAW coexistence filter in the TCU, about 15 dB is enough. With more than 20 dB, one coexistence filter in the active antenna may be enough.", why: "Antenna isolation inside one fin or roof module is usually only 15-25 dB, so the filters have to supply the rest.", refs: [r4], conf: med, kind: rule}
  - {id: d2, area: "Aggressor-side filtering", rule: "Put a V2X-band (5855-5925 MHz) notch on the 5 GHz Wi-Fi transmit path. The source reports up to 18 dB of V2X receiver desense without it and almost none with a well-designed BAW notch.", why: "Wideband noise from the Wi-Fi PA falls in-band at the V2X receiver, so no filter on the victim side can remove it.", refs: [r4], conf: med, kind: rule}
  - {id: d3, area: "V2X emissions (EU)", rule: "Keep the V2X transmitter within 33 dBm e.i.r.p. and 23 dBm/MHz. Out-of-band emissions (5835-5855 and 5925-5945 MHz) and spurious emissions (1-18 GHz) must stay at or below -30 dBm/MHz e.i.r.p. The in-band mask is -26/-32/-40/-50 dBc at +/-5/5.5/10/15 MHz offset (10 MHz channel).", why: "These are the harmonised-standard limits. The 5925-5945 MHz edge is also where Wi-Fi UNII-5 starts.", refs: [r1], conf: high, kind: rule}
  - {id: d4, area: "Tolling (CEN DSRC) protection", rule: "Protect 5795-5815 MHz: in receive mode, spurious emissions must stay at or below -60 dBm (antenna 2 m or less above ground) or -65 dBm (above 2 m) e.i.r.p. per MHz. A notch at the V2X FEM input is one way to bring transmit output under the -65 dBm/MHz ETC level.", why: "ETC sits only 40 MHz below the ITS band in Europe, North America and China.", refs: [r1, r4], conf: high, kind: rule}
  - {id: d5, area: "Victim receiver selectivity", rule: "Size the V2X receive filter and LNA so that blocking is at least -30 dBm at +/-50, 100 and 200 MHz, adjacent-channel rejection is at least 16 dB and alternate-channel rejection is at least 32 dB (BPSK 1/2; lower for higher-order modulation).", why: "Co-located Wi-Fi UNII-3/4/5 and cellular n47 transmitters land at exactly these offsets.", refs: [r1], conf: high, kind: rule}
  - {id: d6, area: "Linearity / intermodulation", rule: "For each receiver, compute the worst blocker at its LNA input (aggressor power - antenna isolation - filter rejection). Check IIP3 against it: IM3 grows 3 dB for every 1 dB of the two tones, and SFDR = 2/3 x (IIP3 - input noise floor).", why: "IM products of two co-located transmitters (for example cellular plus Wi-Fi) can fall in-band and cannot be filtered after the nonlinearity.", refs: [r6], conf: high, kind: rule}
  - {id: d7, area: "Harmonics", rule: "Check harmonics of every roof transmitter against every roof receiver. For example, twice LTE Band 13 uplink (777-787 MHz) is 1554-1574 MHz, right under GNSS L1/E1 (1575.42 MHz). This needs low-pass/harmonic filtering at the cellular PA plus a GNSS pre-filter.", why: "Harmonics are generated after the TX filter if the antenna or switch path is nonlinear, and they land in-band at the victim.", refs: [r6], conf: med, kind: rule}
  - {id: d8, area: "Reciprocal mixing", rule: "For strong close-in blockers, budget LO phase noise. The in-channel noise from reciprocal mixing is roughly blocker power + L(offset) + 10log(channel bandwidth), and it must stay below the receiver noise floor.", why: "A clean filter does not help when the receiver's own LO noise mixes the blocker into the channel. This matters most for V2X next to Wi-Fi and for cellular next to cellular.", refs: [r6], conf: med, kind: consideration}
  - {id: d9, area: "Passive intermodulation (mechanical)", rule: "Avoid ferromagnetic platings (nickel, steel) and dissimilar-metal pressure contacts in the high-power RF path (fin clips, ground springs, connectors). Keep current density low and contacts tight.", why: "PIM from contacts and ferromagnetic materials cannot be filtered out once generated. With a cellular TX next to GNSS/SDARS in one housing, it becomes a desense source.", refs: [r6], conf: high, kind: consideration}
  - {id: d10, area: "Board-level desense in integrated modules", rule: "In a roof module with an SoC, use multi-cavity RF shields between the digital SoC and the RF front ends, dedicated ground planes, buried stripline for fast buses, tuned drive strength, spread-spectrum clocks and local filtering at the noise source.", why: "GbE switches, DDR, PCIe and switching supplies radiate broadband noise that raises the noise floor of the nearby GNSS and cellular receivers.", refs: [r5], conf: high, kind: rule}
  - {id: d11, area: "Coexistence architecture", rule: "Solve coexistence in three layers. Get antenna isolation from spatial diversity and orthogonal polarization, add sharp acoustic-wave (BAW/SAW) filters between active bands, and use time-domain multiplexing of transmit schedules in software.", why: "No single layer is enough in a very small volume that holds cellular, Wi-Fi, BT, UWB and GNSS together.", refs: [r5, r4], conf: high, kind: rule}
  - {id: d12, area: "Cable loss and active antennas", rule: "When the radios stay in the cabin (up to about 5 m of coax), put gain at the antenna: a GNSS active antenna with a SAW pre-filter and about 28 dB LNA gain, and V2X compensators. Otherwise integrate the radio at the antenna to remove the several-dB coax loss at GHz.", why: "Coax loss before the first LNA adds directly to the noise figure, and GHz cellular, Wi-Fi and V2X runs lose several dB.", refs: [r5, r3], conf: med, kind: rule}
  - {id: d13, area: "Thermal and mechanical", rule: "Design the roof module as a sealed unit with no fan. Use the cast aluminium housing as the heat sink, use TIMs to move heat away from critical parts, and add software throttling of compute and TX power during solar-load peaks while safety-critical links are kept.", why: "Solar load on the roof adds to heat from the modem and processor. A backup battery in the module makes the thermal limits tighter.", refs: [r5], conf: high, kind: consideration}
  - {id: d14, area: "Glass roofs", rule: "Budget up to about 8 dB of average gain loss (with deep side nulls) for a 5.9 GHz monopole on a full glass roof compared with a 1 m metal ground plane. Get the low-E/metallic coating layout from the glass supplier. The simulation shows a coating on top of the glass, under the antenna, recovers much of the loss.", why: "Coatings and layered dielectrics reflect and scatter the wave. Pure tempered glass alone did not cause the loss.", refs: [r3], conf: high, kind: rule}
  - {id: d15, area: "Fin envelope and antenna count", rule: "Assume a shark-fin envelope under 70 mm high and under 120 mm long. Prefer multi-band elements (for example one folded monopole covering 617-5925 MHz plus GNSS L1 at 58 x 37 x 17 mm, efficiency 50-90%) over more single-band antennas.", why: "Each added antenna in the fin raises coupling and shadowing and lowers isolation.", refs: [r3], conf: high, kind: consideration}
  - {id: d16, area: "Automotive EMC verification", rule: "Plan component EMC against CISPR 25 (ALSE, DUT 50 mm above a ground plane of at least 2 x 2 m, antenna at 1 m, 150 kHz up to 5.925 GHz in Ed. 5; conducted 0.15-108 MHz) and ISO 11452-2 (200 MHz-18 GHz, typically 30-200 V/m set by the OEM, 1 kHz 80% AM) plus ISO 11452-4 BCI (1-400 MHz, typically 60-200 mA).", why: "CISPR 25 limits exist to protect the vehicle's own receivers, so the roof module is both a victim and a source. Exact limits are in the paid standards and OEM specifications.", refs: [r2], conf: med, kind: rule}
trends:
  - {id: t1, text: "The TCU moves to the roof: an OEM-designed Connectivity Hub Module combines modem, RF transceivers, antenna arrays, compute and a backup battery at the best RF location, with an Ethernet interface to the vehicle network instead of up to 5 m of coax.", horizon: now, refs: [r5], conf: high, for_us: "The FEM, filter and LNA sockets move from the cabin TCU board into a hot, sealed roof module. That means more automotive-grade (high-temperature) Sky5 cellular FEMs, Wi-Fi/V2X FEMs and BAW filters per module, and the TCU maker and the antenna maker merge into one customer."}
  - {id: t2, text: "Coexistence becomes a board-level problem. Self-generated digital noise (DDR, PCIe, GbE, power supplies) and radio-to-radio coexistence replace cable loss as the main limit.", horizon: now, refs: [r5], conf: high, for_us: "Demand rises for high-rejection filters and shielded, filtered modules (pre-filtered GNSS LNA FEMs, integrated filter + LNA). Our Skyworks timing and isolation parts with low EMI also fit (spread-spectrum clocks)."}
  - {id: t3, text: "Wi-Fi 5/6 GHz (UNII-3/4/5) on both sides of the 5.9 GHz ITS band needs BAW band-pass on the V2X path and a 5.9 GHz BAW notch on the Wi-Fi path, often in both the TCU and the active antenna.", horizon: now, refs: [r4, r1], conf: med, for_us: "This is a direct socket for SKY5A1005/1006/1008 and QPQ2200Q/QPQ2230Q. The combined company can offer a matched V2X FEM, notch and band-pass set. Any overlap between the two lines should be managed."}
  - {id: t4, text: "Full glass roofs remove the metal ground plane. Antennas move to under-roof, glass-integrated or spoiler and mirror positions, and losses of about 8 dB at 5.9 GHz must be recovered.", horizon: 2-3y, refs: [r3], conf: high, for_us: "There is more need for active compensation (LNA or compensator at the antenna) and for more antennas and diversity paths. This favours compact LNAs, switches and V2X compensators."}
  - {id: t5, text: "CISPR 25 Ed. 5 extends component emissions testing to 5.925 GHz. Module emissions in the Wi-Fi and V2X bands are now in scope at component level.", horizon: now, refs: [r2], conf: med, for_us: "FEM spurious and harmonic performance and on-module filtering become EMC selling points. Customers will ask for CISPR 25 data on EVBs."}
  - {id: t6, text: "Antenna consolidation: single multi-band radiators (617-5925 MHz plus GNSS) replace separate elements in the size-limited fin.", horizon: 2-3y, refs: [r3], conf: high, for_us: "Fewer, wider-band antennas push more selectivity onto multiplexers and acoustic filters behind each port, which favours diplexers and multiplexers and switch-plus-filter modules."}
  - {id: t7, text: "Thermal limits of sealed roof modules (solar load, no fan, battery inside) drive TX-power throttling and higher temperature ratings.", horizon: 2-3y, refs: [r5], conf: med, for_us: "Grade 1 (125 C) PA/FEM options, BAW filters with low temperature drift and efficient PAs (less heat) become differentiators. Whether OEMs actually require Grade 1 for the roof is still unconfirmed."}
skyworks_fit:
  - {fn: filter_saw_baw, parts: ["SKY5A1005", "SKY5A1006", "SKY5A1008", "QPQ2200Q", "QPQ2230Q", "QPQ2254Q"], note: "BAW coexistence filters. SKY5A1005 is a C-V2X notch (5855-5925 MHz) for the Wi-Fi path; SKY5A1006/1008 are 5 GHz (5170-5835 MHz) and 6 GHz (5945-7125 MHz) Wi-Fi filters (all Preview, automotive). QPQ2200Q is a 5.855-5.925 GHz BAW band-pass, QPQ2230Q a V2X notch, QPQ2254Q a 2.4 GHz WLAN BAW (automotive status not stated in the catalogue)."}
  - {fn: v2x_fem, parts: ["SKY5A2105", "SKYA21043", "QPF1004Q", "QPF1005Q", "QPF4554Q"], note: "5.9 GHz V2X front ends for the roof TCU or as an antenna compensator. SKY5A2105 is Preview; QPF4554Q (Wi-Fi + C-V2X, 5.18-5.925 GHz) has catalogue status unknown."}
  - {fn: gnss_lna, parts: ["SKY5A2110", "SKY65728-11"], note: "SKY5A2110: automotive L1+L5 LNA FEM with pre- and post-filters (Active). SKY65728-11: shielded L5 pre-filter LNA (automotive status not stated). Older Skyworks GNSS FEMs had B13 notches, which shows the harmonic problem in d7."}
  - {fn: lna, parts: ["QPL6202Q", "QPL6220Q"], note: "2.32-2.345 GHz LNAs for the SDARS active antenna (automotive grade not stated in the catalogue)."}
  - {fn: diplexer, parts: ["TQM2M9016"], note: "Automotive diplexer that splits SDARS and GPS from one antenna (catalogue status unknown)."}
  - {fn: wifi_fem, parts: ["SKYA21040", "SKYA21041", "QPF4554Q"], note: "AEC-Q100 2.4 GHz and 5 GHz Wi-Fi switch/LNA front ends. They pair with the SKY5A1005 notch on the Wi-Fi path."}
  - {fn: pa_module, parts: ["SKY5A3036", "SKY5A3047", "SKYA21055"], note: "Automotive Sky5 cellular TX/RX FEMs (catalogue function rf_frontend) and an automotive multimode PA module, for the roof TCU."}
  - {fn: diversity_rx_module, parts: ["SKY5A5003", "SKY5A5009"], note: "Automotive 4x4 MIMO and NR UHB diversity receive modules (filters + LNAs) for the multi-antenna roof."}
  - {fn: rf_switch, parts: ["SKY5A5110", "SKYA21003", "QPC8013Q"], note: "AEC-Q100 band and antenna switches. QPC8013Q: SP4T, 617-6000 MHz, 48 dB isolation."}
  - {fn: am_fm_tuner, parts: ["Si47952", "Si47902"], note: "Broadcast tuners stay in the head unit on the legacy coax path. GM's CHM list (r5) does not name AM/FM/SDARS."}
open_questions:
  - "Does GM's CHM (and the LG/Harman roof TCUs) carry V2X, SDARS and broadcast as well, or only cellular/Wi-Fi/BT/UWB/GNSS as r5 lists? Which radios stay on coax to the cabin?"
  - "What ambient temperature and grade do OEMs specify for a sealed roof module (Grade 1, 125 C?), and what TX duty cycle or throttling do they assume?"
  - "What antenna isolation do real integrated modules achieve between Wi-Fi 5/6 GHz and V2X, and between cellular n77/n79 and Wi-Fi? r4's 15-20 dB is a 2020 vendor figure."
  - "Exact CISPR 25 Ed. 5 limit lines above 2.5 GHz and the OEM-specific ISO 11452 field levels. Both are paid or OEM documents, and only secondary values are recorded here."
  - "How is the digital link to the zone computer made (Multi-Gig Ethernet or SerDes), and does any OEM digitise broadcast or SDARS at the roof?"
  - "Is the 2.5 GHz upper limit for CISPR 25 conducted and radiated tests in TI SLLA569B (older edition) or the 5.925 GHz in r2 the current edition for the target OEMs?"
