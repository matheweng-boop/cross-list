order: 5
topic: roof_coexistence
title: "Multi-radio roof and smart-antenna module: coexistence, filtering and EMC"
summary: "Today's roof carries 4G/5G MIMO, GNSS, V2X, Wi-Fi/BT, UWB, SDARS and broadcast antennas within a fin about 70 mm high, and OEMs such as GM are now moving the whole TCU (modem, radios, compute) into that roof module behind an Ethernet link. Long coax runs disappear with that move, but desense from the module's own digital noise and from neighbouring transmitters becomes the main design problem, together with sealed-box thermal limits. Coexistence is budgeted in three places: antenna isolation (often only 15-20 dB is practical), sharp acoustic (BAW/SAW) band-pass and notch filters on both the aggressor and the victim path, and time-domain scheduling. Component EMC follows CISPR 25 (emissions, now up to 5.925 GHz) and ISO 11452 (immunity); glass roofs can cost about 8 dB of antenna gain at 5.9 GHz."
references:
  - {id: r1, title: "ETSI EN 302 571 V2.1.1: Intelligent Transport Systems; radiocommunications equipment operating in the 5 855 MHz to 5 925 MHz frequency band; Harmonised Standard", publisher: "ETSI", year: 2017, url: "https://www.etsi.org/deliver/etsi_en/302500_302599/302571/02.01.01_60/en_302571v020101p.pdf", type: standard, licence: "Free download; (c) ETSI, no reproduction without permission (paraphrased, clause numbers cited)", retrieved: 2026-10-21, why: "Gives the regulatory numbers that set the V2X side of the roof coexistence budget: out-of-band and spurious emissions, receiver blocking, selectivity and CEN DSRC tolling protection"}
  - {id: r2, title: "Application Note: Automotive EMC Testing - Meeting ISO 11452 and CISPR 25 Requirements (v1.0)", publisher: "Com-Power Corporation", year: 2025, url: "https://www.com-power.com/uploads/technote/Automotive_EMC_Testing_ISO11452_CISPR25.pdf", type: app_note, licence: "(c) Com-Power 2025; summarised with citation", retrieved: 2026-10-21, why: "Free secondary description of the CISPR 25 and ISO 11452 test setups and typical levels (the standards themselves are paid; iso.org is blocked)"}
  - {id: r3, title: "Design of a compact multi-band (cellular 5G/GNSS/V2X) antenna and rigorous analysis of antenna performance on glass roofs for vehicular platforms (PhD dissertation)", publisher: "Oakland University (A. Ibrahim, adviser D. Aloi)", year: 2023, url: "https://our.oakland.edu/bitstreams/24d16b69-ff52-4a87-ac32-d5ba37ca72fd/download", type: paper, licence: "(c) author 2023, all rights reserved; open in the university repository", retrieved: 2026-10-20, why: "Automotive-specific measurements: shark-fin envelope, a 617-5925 MHz multi-band roof element, the active GNSS LNA chain and an 8 dB glass-roof loss at C-V2X"}
  - {id: r4, title: "Mitigating Spectrum Coexistence of V2X Systems with High-Performance Filters (A. Bawangaonwala, Qorvo)", publisher: "Microwaves & RF (contributed by Qorvo)", year: 2020, url: "https://www.mwrf.com/technologies/components/semiconductors/article/21137924/qorvo-mitigating-spectrum-coexistence-of-v2x-systems-with-high-performance-filters", type: app_note, licence: "(c) Endeavor Business Media / author; summarised with citation", retrieved: 2026-10-21, why: "Vendor (now our own Qorvo) design note that quantifies the antenna-isolation versus filter trade (LTCC compared with BAW) and the Wi-Fi-path notch for V2X and Wi-Fi/ETC coexistence"}
  - {id: r5, title: "Rethinking vehicle connectivity: The engineering behind the integrated Connectivity Hub Module (CHM)", publisher: "General Motors Engineering (A. Leiba)", year: 2026, url: "https://engineering.gm.com/home.detail.html/Pages/news/us/en/engineering/2026/may/0527-rethinking-vehicle-connectivity.html", type: white_paper, licence: "(c) General Motors; summarised with citation", retrieved: 2026-10-21, why: "Primary OEM statement that the TCU, radios and antennas move into one roof module with a digital (Ethernet) interface, and of the resulting desense, coexistence and thermal rules"}
  - {id: r6, title: "Microwave and RF Design IV: Modules (M. Steer), ch. 4 Noise, Distortion and Dynamic Range (4.4 Oscillator noise, 4.5 Nonlinear distortion, 4.6 Dynamic range, 4.7 Passive intermodulation)", publisher: "LibreTexts / NC State University", year: 2019, url: "https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Electronics/Microwave_and_RF_Design_IV%3A_Modules_(Steer)/04%3A_Noise_Distortion_and_Dynamic_Range", type: textbook, licence: "Book CC BY-NC 4.0 per LibreTexts listing (the page footers say 'not declared'); internal use with attribution", retrieved: 2026-10-21, why: "Textbook basis for the desense mechanisms: compression, IM3 and intercept points, SFDR/DR formulas, phase noise (for reciprocal mixing) and PIM in passive parts"}
block_diagram:
  name: "Integrated roof connectivity module (smart antenna or roof TCU) and its coexistence chain"
  note: "Drawn by us from r3, r4 and r5, not copied. Antennas feed antenna-side filters and multiplexers, then active antenna stages (GNSS/SDARS LNAs, V2X compensator), then, in the integrated roof TCU, the cellular, Wi-Fi and V2X front ends and transceivers. The module talks to the zonal or central computer over automotive Ethernet. The legacy alternative, coax to a TCU or head-unit tuner in the cabin, is kept for broadcast radio. Coexistence filters sit on both the aggressor path (Wi-Fi TX notch at 5.9 GHz) and the victim path (V2X band-pass, GNSS pre-filter)."
  groups:
    - {id: g1, label: "Roof antennas (fin / under-roof / glass)", col: 0, row: 0, blocks: [{fn: antenna, label: "4G/5G MIMO (617-5925 MHz)"}, {fn: antenna, label: "GNSS L1/L5"}, {fn: antenna, label: "V2X 5.9 GHz"}, {fn: antenna, label: "Wi-Fi/BT, UWB"}, {fn: antenna, label: "SDARS / AM-FM / DAB"}]}
    - {id: g2, label: "Antenna-side filtering and multiplexing", col: 1, row: 0, blocks: [{fn: filter_saw_baw, label: "BAW band-pass / notch (V2X, Wi-Fi 5/6 GHz)"}, {fn: diplexer, label: "GNSS/SDARS diplexer, cellular multiplexer"}, {fn: rf_switch, label: "band / antenna switch"}]}
    - {id: g3, label: "Active antenna stages", col: 2, row: 0, blocks: [{fn: gnss_lna, label: "GNSS pre-filter + LNA (about 28 dB gain)"}, {fn: lna, label: "SDARS LNA"}, {fn: v2x_fem, label: "V2X compensator / FEM"}, {fn: active_antenna_amp, label: "AM/FM amplifier"}]}
    - {id: g4, label: "Roof TCU front ends", col: 3, row: 0, blocks: [{fn: pa_module, label: "cellular TX FEM / PAMiD"}, {fn: diversity_rx_module, label: "MIMO diversity RX"}, {fn: wifi_fem, label: "Wi-Fi FEM + V2X notch"}, {fn: uwb_fem}]}
    - {id: g5, label: "Transceivers and modem", col: 4, row: 0, blocks: [{fn: modem, label: "5G modem (+NTN)"}, {fn: wifi_soc}, {fn: v2x_transceiver}]}
    - {id: g6, label: "Digital link to the vehicle", col: 5, row: 0, blocks: [{fn: ethernet_phy, label: "automotive Ethernet"}, {fn: serdes, label: "optional SerDes"}]}
    - {id: g7, label: "Zonal / central compute", col: 6, row: 0, blocks: [{fn: soc, label: "central computer / zone controller"}]}
    - {id: g8, label: "Legacy coax path to the cabin", col: 3, row: 1, blocks: [{fn: am_fm_tuner, label: "head-unit tuner"}, {fn: digital_radio_demod, label: "DAB/HD/SDARS demod"}]}
    - {id: g9, label: "Power, protection and EMC", col: 2, row: 1, blocks: [{fn: wide_vin_buck}, {fn: pol_ldo, label: "low-noise LDO for LNAs"}, {fn: tvs_esd}]}
  links:
    - [g1, g2, "RF"]
