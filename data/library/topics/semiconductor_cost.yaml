order: 7
topic: semiconductor_cost
title: "What an IC costs and why its price falls with volume: silicon, yield, NRE, packaging, test and margins"
summary: "A packaged chip's cost is wafer cost divided by good dies, plus package, test and the design and mask cost (NRE) spread over the units sold; the supplier then adds a gross margin (about 39 % at Infineon, mid-40s at Skyworks, about 60 % or more at TI/ADI) and a distributor adds its own. For the small analog, isolation and RF dies in our families (about 1–5 mm2) random-defect yield is close to 100 %, so die cost grows almost linearly with area; yield only bites for large dies (tens of mm2), and analog area hardly shrinks with newer nodes because mismatch and noise set it. Test is priced per second of tester time (about 2 US cents per second for a single-site mixed-signal cell in the 2004 Rivoir/Agilent model) and multi-site testing roughly halves it. Low volumes carry the amortised NRE, which is what makes the price fall with volume; for expensive complex parts the fixed per-order handling is a small share, so distributor curves are flatter."
