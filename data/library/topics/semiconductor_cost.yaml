block_diagram:
  name: "Cost build-up of a packaged IC, from wafer to distributor shelf"
  note: "Recurring cost flows left to right (front end, back end, test); NRE and margins are added on top. A multi-die part (isolator, gate driver, module) multiplies die cost and yields at die attach. Drawn by us from r1, r3, r4, r5 and r6 (not copied)."
  groups:
    - {id: g1, label: "Front end (fab)", col: 0, row: 0, blocks: [{fn: external_block, label: "Wafer (process, node, 150/200/300 mm)"}, {fn: external_block, label: "Masks and process steps"}]}
    - {id: g2, label: "Wafer sort", col: 1, row: 0, blocks: [{fn: external_block, label: "Probe test (multi-site, probe card)"}, {fn: external_block, label: "Known-good die / ink map"}]}
    - {id: g3, label: "Back end: assembly", col: 2, row: 0, blocks: [{fn: external_block, label: "Back-grind and dicing"}, {fn: external_block, label: "Die attach (1–n dies)"}, {fn: external_block, label: "Wire bond (Au/Cu) or flip chip"}, {fn: external_block, label: "Mold, plating, wettable flank, singulation"}]}
    - {id: g4, label: "Back end: test", col: 3, row: 0, blocks: [{fn: external_block, label: "Final test (digital / mixed-signal / RF tester)"}, {fn: external_block, label: "Automotive: multi-temperature, PAT"}, {fn: external_block, label: "Burn-in (where required)"}]}
    - {id: g5, label: "Fixed cost per design (NRE)", col: 1, row: 1, blocks: [{fn: external_block, label: "Design, IP, verification"}, {fn: external_block, label: "Mask set"}, {fn: external_block, label: "Qualification (AEC-Q100/Q104), PPAP"}]}
    - {id: g6, label: "Supplier", col: 3, row: 1, blocks: [{fn: external_block, label: "Cost of goods sold (die + package + test + yield loss)"}, {fn: external_block, label: "Gross margin (R&D, SG&A, profit)"}]}
    - {id: g7, label: "Channel", col: 4, row: 1, blocks: [{fn: external_block, label: "Distributor (margin, ship-and-debit)"}, {fn: external_block, label: "Direct OEM / Tier-1 contract"}]}
  links:
    - [g1, g2, "wafers"]
    - [g2, g3, "good dies"]
    - [g3, g4, "packaged units"]
    - [g4, g6, "good units (COGS)"]
    - [g5, g6, "amortised over lifetime volume"]
    - [g6, g7, "supplier price"]
design_rules:
  - {id: d1, area: "Die cost", rule: "Compute die cost as wafer cost / (gross dies x die yield), gross dies = pi(d/2)^2/A - pi d/sqrt(2A); example: a 1 mm2 die on a 200 mm wafer gives about 31,000 gross dies, so at USD 750 per wafer about USD 0.024 per good die.", why: "Standard textbook relation; the edge-loss term matters for larger dies.", refs: [r6], conf: high, kind: rule}
  - {id: d2, area: "Yield model", rule: "Use the negative-binomial (clustered) yield Y = (1 + D0 A / alpha)^-alpha with alpha about 3 (r6) to 10 (r1); Poisson exp(-D0 A) is the alpha -> infinity limit and is pessimistic for large dies.", why: "Defects cluster, so real yield for big dies is higher than Poisson predicts; Seeds/Murphy are other special cases.", refs: [r1, r6], conf: high, kind: rule}
  - {id: d3, area: "Defect density", rule: "Take D0 about 0.05–0.2 defects/cm2 for production processes (r1: 0.08 at 14 nm, 0.09 at 7 nm, 0.11 at 5 nm, 0.2 early 3 nm; 0.05 RDL); treat the course value 0.5–1/cm2 (r6) as a conservative, older bound.", why: "D0 drives yield only through D0 x A; mature analog fabs are at the low end (our judgement, no mature-node number read).", refs: [r1, r6], conf: med, kind: rule}
  - {id: d4, area: "When yield matters", rule: "Ignore random-defect yield for dies below about 5 mm2 (yield > 99 % at D0 = 0.1/cm2); include it for complex dies of 20 mm2 and more (98 % at 20 mm2, 86 % at 30 mm2 if D0 = 0.5).", why: "D0 x A is tiny for small dies, so die cost is close to linear in area; yield falls faster than area grows only once D0 x A approaches 1 (our arithmetic on the r1/r6 model).", refs: [r1, r6], conf: high, kind: consideration}
  - {id: d5, area: "Analog scaling", rule: "Do not expect analog/RF block area to shrink with the node: key transistor area is set by noise (kT/C) and mismatch; for fixed speed and accuracy the power stays the same or rises as supply falls.", why: "Speed x accuracy^2 / power is a technology constant; mismatch improves only slightly with scaling (Pelgrom: offset sigma ~ A_VT / sqrt(WL), so area ~ 1/sigma^2).", refs: [r2], conf: high, kind: rule}
  - {id: d6, area: "Node choice for mixed-signal", rule: "Keep analog-heavy, high-voltage and RF parts on mature nodes (130–180 nm on 200 mm, 40–90 nm on 300 mm): a newer node raises wafer and mask cost but not analog density.", why: "300 mm wafer cost rises from about USD 2,000 (130 nm) to 4,500 (22 nm) and 7,000 (14 nm) (2019), while analog area stays put; lower supply removes cascodes.", refs: [r2, r6], conf: med, kind: consideration}
  - {id: d7, area: "NRE amortisation", rule: "Add NRE / lifetime volume to the unit cost: fixed NRE (masks, IP, full-chip verification) is independent of die area and dominates at low volume; it is negligible once volume is large.", why: "r1 splits cost into RE and amortised NRE; r6 lists design time, masks, CAD and company costs as fixed per design (ITRS 2009: modern ASIC on the order of USD 50 M).", refs: [r1, r6], conf: high, kind: rule}
  - {id: d8, area: "Multi-die yield", rule: "For multi-die parts multiply yields along the flow (Y = Y_wafer x Y_die x Y_packaging x Y_test) and count dies scrapped by packaging failures (wasted known-good dies); test each die at wafer sort before assembly.", why: "A packaging defect throws away every good die in the package; in r1's AMD example packaging was 30 % of cost for the 16-core system.", refs: [r1], conf: high, kind: rule}
  - {id: d9, area: "Test cost rate", rule: "Price test time from the test-cell cost: capital / (depreciation years x utilisation) + operating cost; a USD 1 M cell at 65 % utilisation over 5 years is 0.98 cents/s plus about 0.97 cents/s operating (USD 35/h), about 2 cents/s single-site.", why: "Capital and operating cost were about 75 % of test cost in the example; 2004 dollars, so treat as order of magnitude.", refs: [r3], conf: high, kind: rule}
  - {id: d10, area: "Multi-site test", rule: "Assume 4–8 sites for mixed-signal parts with limited per-site analog resources (up to about 12 if fully parallel); 7 sites cut test cost by almost 50 % in the example.", why: "Sequential portions (shared instruments) add about 10 % per extra site and erase the gain beyond the optimum; per-site resource cost USD 10k–200k moves the optimum only from 8 to 4.", refs: [r3], conf: high, kind: rule}
  - {id: d11, area: "Test time", rule: "Count the full time on the cell, not only test time: stepping/index (0.4 s per touchdown in the example), lot change-over (15 min) and retest (3 %) are paid too; single-site mixed-signal example: 4.7 s total, 9 cents per device.", why: "Short tests on cheap parts are dominated by index and handling time, which multi-site shares.", refs: [r3], conf: high, kind: consideration}
  - {id: d12, area: "Automotive package", rule: "Specify wettable-flank QFN/SON (step-cut, dimple or plated flank) for automotive so solder fillets (about 100 um at Cpk 1.67) are visible to AOI; board-level cycling -40/+125 C, 1000 cycles target.", why: "Standard QFN copper flanks oxidise and do not wet; without a fillet the joint needs X-ray inspection.", refs: [r5], conf: high, kind: rule}
  - {id: d13, area: "Gross margin floor", rule: "Set the margin floor near 40 %: Infineon's gross margin was 39.2 % in FY2025 (41.8 % FY2024) while R&D (15 %) and SG&A (10.8 %) of revenue still have to be covered.", why: "Below about 40 % an analog/power supplier's operating margin goes toward zero; Skyworks reported 47.1 % in Q3 FY25 (prepared remarks, read), analog peers TI/ADI about 58–62 % GAAP (search snippets).", refs: [r4], conf: med, kind: consideration}
  - {id: d14, area: "Distributor price", rule: "Model distributor price as supplier price plus a channel margin that is largest at small quantities; the channel can request price adjustments (ship-and-debit) for design-registered customers, so distributor book price overstates what large customers pay.", why: "r4 describes distributor price adjustments and ship-and-debit credit notes; broadline distributor gross margin about 12 % (Arrow components 2024, snippet) is far below catalogue small-quantity mark-ups.", refs: [r4], conf: med, kind: consideration}
  - {id: d15, area: "Outsourcing", rule: "Expect commodity process steps and standard packages to be outsourced (foundry, OSAT) and differentiated processes kept in-house; cost of outsourced steps is a market price, not an internal cost.", why: "Infineon uses external partners for front-end processes with little differentiation and back-end standard package types.", refs: [r4], conf: high, kind: consideration}
trends:
  - {id: t1, text: "Analog and power move to 300 mm wafers (Infineon 300 mm thin-wafer power, GaN on 300 mm; SiC to 200 mm), lowering cost per die at mature nodes.", horizon: now, refs: [r4], conf: high, for_us: "Competitors' mature-node cost per mm2 drops; our 200 mm/GaAs flows need utilisation and consolidation to keep up."}
  - {id: t2, text: "Multi-die and chiplet integration is used to raise yield and reuse dies; the cost now hinges on packaging yield and wasted known-good dies.", horizon: 2-3y, refs: [r1], conf: high, for_us: "Isolators, gate drivers and RF modules are already multi-die: KGD test and assembly yield set their cost floor."}
  - {id: t3, text: "Analog design productivity and signal integrity, not density, limit mixed-signal SoCs; analog stays on older nodes while digital moves on.", horizon: now, refs: [r2], conf: med, for_us: "Complex mixed-signal parts (car-radio tuners, RF front ends) stay on mature processes with long product lives; price erosion is slower than in digital."}
  - {id: t4, text: "Wettable-flank QFN/SON is now standard for automotive leadless packages, with new low-cost plating options alongside step-cut and dimple lead frames.", horizon: now, refs: [r5], conf: high, for_us: "Automotive versions of small-package parts need wettable flanks; budget a small adder over the industrial package."}
  - {id: t5, text: "Test cost is cut more by parallelism (multi-site, concurrent, reduced pin-count test) than by cheaper testers.", horizon: now, refs: [r3], conf: high, for_us: "RF and mixed-signal parts with expensive per-site instruments gain most from design-for-test that lets more sites run in parallel."}
  - {id: t6, text: "Mask and design NRE rise steeply with node (hundreds of k USD at 180–90 nm, above USD 1 M at 28 nm, above USD 10 M at 7 nm; secondary sources), reinforcing mature nodes for medium-volume parts.", horizon: now, refs: [r6], conf: low, for_us: "Low-volume automotive variants are viable on mature nodes; at advanced nodes NRE alone would dominate the price at 100k units a year."}
skyworks_fit:
  - {fn: digital_isolator, parts: ["SI8600AB-AS", "SI8610BB-AS"], note: "Commodity to standard class: two small CMOS dies (about 1 mm2 each) on 200 mm, SOIC lead frame; cost dominated by package (wide body, high-CTI mold for creepage) and hipot test, not silicon; yield ~100 %."}
  - {fn: gate_driver, parts: ["SI8230BD-AS", "SI82390AB-AS1"], note: "Standard class: two dies (CMOS + driver), wide SOIC; more test (timing, UVLO, hipot) and an automotive variant with multi-temperature test."}
  - {fn: isolated_amplifier, parts: ["SI8921AB-AS"], note: "Standard class: precision trim makes test time the main cost driver after the package."}
  - {fn: rf_switch, parts: ["SKY5A2108", "SKY59608-711LF"], note: "Commodity to standard class: one small RF-SOI die (under about 1.5 mm2) in a small QFN/DFN; RF test per site needs expensive RF ports, so multi-site efficiency decides test cost."}
  - {fn: am_fm_tuner, parts: ["Si47962"], note: "Complex class: large mixed-signal/RF SoC (AM/FM + HD Radio/DAB/DRM) whose analog/RF area does not shrink; high NRE (software, certification), long RF/multi-standard test, automotive multi-temperature screening, few suppliers and long supply terms; flat distributor curve (owner's check: slope about -0.055)."}
  - {fn: rf_frontend, parts: ["SKY5A2205", "SKY5A2206"], note: "Complex class: multi-die laminate modules (PA, switch, filters): yields stack across dies and assembly (known-good die), laminate substrate and RF test dominate; AEC-Q104."}
open_questions:
  - "AEC-Q001 (part average testing), AEC-Q004 (zero defects) and AEC-Q100 test flows could not be read (aecouncil.com did not resolve/TLS failed): what multiple of test cost does automotive screening (3 temperatures, PAT, burn-in) add? Our judgement 1.5–3x is unchecked."
  - "No public, current wafer prices for 200 mm RF-SOI, BCD, SiGe or 150 mm GaAs were found beyond old trade-press claims (2007: 200 mm 0.13 um CMOS about USD 1,000; 150 mm GaAs up to USD 2,500 claimed)."
  - "No public package cost per pin was found; the only number is a trade-press example (fine-pitch BGA: 40 % more material and 13x assembly cost vs a 7x7 mm QFN)."
  - "HD Radio royalty per receiver chip and the learning-curve (experience-curve) slope for analog/RF prices were not found in a readable public source."
  - "Test time per class for RF parts (switch, FEM, tuner) is not public; Rivoir's 4.7 s mixed-signal example is from 2004."
