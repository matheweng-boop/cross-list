order: 4
topic: tcu_rf
title: "Telematics unit (TCU) RF front end: 5G, RedCap, satellite NTN and NG-eCall"
summary: "The car's telematics unit is a multi-radio box: a 4G/5G cellular front end (one or two transmit paths, 2–4 receive paths for MIMO), a satellite (NTN) path in the L/S bands n255/n256, GNSS, often V2X and Wi-Fi, and a crash-robust emergency-call path. The 3GPP NTN radio spec (Rel-19) now defines 26 dBm and 31 dBm transmit classes for n255/n256 next to the 23 dBm phone class, and the satellite uplink sits only about 50 MHz above GNSS L1, so the hardest problems are transmit power, filtering and coexistence inside one car. Value TCUs for EU NG-eCall go the other way: RedCap with one transmitter and 1–2 receivers at the lowest cost. All parts must meet AEC-Q104/Q100 Grade 2 (–40 to +105 °C)."
