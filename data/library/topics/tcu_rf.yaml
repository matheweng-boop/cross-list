design_rules:
  - {id: d1, area: "NTN transmit power", rule: "Size the n255/n256 PA for the power class targeted: PC3 23 dBm ±2 dB, PC2 26 dBm +2/–3 dB, PC1 31 dBm +2/–3 dB at the antenna connector; every other NTN FR1 band (n250–n254) is PC3 only.", why: "Rel-19 TS 38.101-5 Table 6.2.1-1; PC1 is noted as not targeted at smartphones, i.e. a vehicle/fixed class.", refs: [r1], conf: high, kind: rule}
  - {id: d2, area: "NTN transmit diversity", rule: "With 2Tx or 4Tx the power class is the sum over antenna connectors; the PC1 4Tx MPR table assumes at least 15 dB isolation between the transmit antennas.", why: "PC1 can be reached with four ~25 dBm chains instead of one 31 dBm PA, but only with well-isolated antennas on the roof.", refs: [r1], conf: high, kind: rule}
  - {id: d3, area: "n255 duplexer / self-desense", rule: "Budget the n255 receive sensitivity loss when transmitting at high power: allowed REFSENS degradation is 0.8–0.9 dB (PC2 1Tx), 1.6–1.7 dB (PC2 2Tx), 2 dB (PC1 1Tx) and 3.3 dB (PC1 4Tx); n256 allows 0 dB at PC2.", why: "n255 has only 67.5 MHz between DL top (1559 MHz) and UL bottom (1626.5 MHz) versus 160 MHz duplex gap in n256, so the n255 duplexer is the hard part.", refs: [r1], conf: high, kind: rule}
  - {id: d4, area: "NTN–GNSS coexistence (spec)", rule: "When NS_02N is signalled on n255 the UE's emissions in 1559–1605 MHz must stay at or below –50 dBm/700 Hz and –40 dBm/1 MHz (ramping up to 1610 MHz); n254 (NS_03N) has the same GNSS-band limits with a steeper ramp.", why: "Protects RNSS/GNSS receivers; the NTN transmit filter needs deep rejection only ~20 MHz below the n255 uplink edge.", refs: [r1], conf: high, kind: rule}
  - {id: d5, area: "NTN–GNSS coexistence (in the car)", rule: "Check the GNSS front end's blocking at the car's own NTN uplink (1610–1660.5 MHz): SKY5A2110 specifies L1 out-of-band rejection only from 1710 MHz (typ –66 dB, max –47 dB) and none at n254/n255 uplink frequencies.", why: "A 23–31 dBm NTN transmitter a few tens of cm from a GNSS antenna is outside what today's GNSS LNAs are specified for; NR-NTN UEs also rely on GNSS for timing and Doppler pre-compensation.", refs: [r3, r1, r6], conf: med, kind: consideration}
  - {id: d6, area: "NTN receive", rule: "A receive noise figure of about 7 dB (smartphone level) is enough for L/S-band NTN downlink in a vehicle; spend effort on antenna gain and transmit power instead.", why: "5GAA link budgets show NF and antenna gain have only a moderate influence on S-band DL rate.", refs: [r2], conf: high, kind: consideration}
  - {id: d7, area: "NTN antenna", rule: "A 0 dBi dual-band (n255+n256) antenna fits under 5 × 5 cm; 3 dBi over 30–90° elevation is feasible in < 5 × 5 cm only for one band direction (80–100 MHz); 3 dBi dual-band needs two radiators and > 5 × 5 cm.", why: "Antenna gain choice sets how much PA power the TCU must supply.", refs: [r2], conf: high, kind: rule}
  - {id: d8, area: "NTN uplink budget", rule: "For wideband NTN plan > 23 dBm and > 3 dBi: S-band uplink rate rises from < 1 Mbps (23 dBm, 0 dBi) to about 11 Mbps (29 dBm, 6 dBi).", why: "Uplink is the limiting link for vehicle NTN; transmit power and antenna gain are the only levers.", refs: [r2], conf: high, kind: consideration}
  - {id: d9, area: "NTN regulatory power", rule: "NTN limits from regulation (EIRP) are converted to conducted limits with a 0 dBi reference antenna (e.g. n254 27 dBm/4 kHz mean density); with a higher-gain vehicle antenna, check EIRP-based limits and back off conducted power accordingly.", why: "A 3 dBi roof antenna raises EIRP by 3 dB for the same PA output (our inference from the 0 dBi convention).", refs: [r1], conf: med, kind: consideration}
  - {id: d10, area: "NTN power boosting", rule: "Leave PA headroom above 23 dBm for PC3 power boosting (powerBoosting-NTN-r19, and Rel-18 boosts for pi/2-BPSK/QPSK), which raises the reference power and the allowed MPR/A-MPR by the boost.", why: "A 'PC3' NTN PA may need to deliver more than 23 dBm with low-PAPR waveforms.", refs: [r1], conf: high, kind: rule}
  - {id: d11, area: "RedCap receive branches", rule: "For a RedCap NG-eCall TCU fit 2 receive branches: with 1 branch, FR1 downlink needs coverage recovery for random-access Message 2 in urban micro; with 2 branches no recovery is needed.", why: "Emergency calls must work at the cell edge; the second receiver is cheap relative to the coverage risk.", refs: [r5], conf: high, kind: consideration}
  - {id: d12, area: "RedCap front-end scope", rule: "Rel-17 RedCap caps FR1 bandwidth at 20 MHz, needs only 1 receive branch, drops CA/DC and allows HD-FDD; peak about 85/90 Mbps DL/UL in FD-FDD (15 kHz SCS). The front end can be one transmit chain; HD-FDD can replace duplexers with a switch.", why: "These reductions cut modem BOM about 65 % in FR1; the RF front end should follow.", refs: [r5], conf: high, kind: rule}
  - {id: d13, area: "Terrestrial HPUE", rule: "Provide a 4.5 V PA supply (APT) where PC2 (26 dBm) is needed on n40/n41 with today's automotive PA; other bands stay PC3.", why: "SKY5A2206 supports n40/n41 PC2 at 4.5 V; APT-optimized.", refs: [r4], conf: high, kind: rule}
  - {id: d14, area: "Automotive qualification", rule: "Specify AEC-Q104 Grade 2 (–40 to +105 °C) for RF modules, AEC-Q100 Grade 2 for single-die switches, with PPAP and IMDS; check characterisation at the automotive extreme condition (A-ETC –40/+105 °C), not just 25 °C.", why: "The SKY5A2110 data sheet specifies separate NTC, ETC (–30/+85) and A-ETC (–40/+105) limits; the Sky5A telematics set is AEC-Q104 Grade 2.", refs: [r3, r4], conf: high, kind: rule}
  - {id: d15, area: "V2X / Wi-Fi coexistence", rule: "Expect V2X transmit up to +29 dBm (LTE-V2X) or +26.5 dBm (NR-V2X, 2.5 dB MPR) at 5.9 GHz in the same car; GNSS front ends specify only –42 to –52 dB (max) rejection at 5–7 GHz Wi-Fi/V2X frequencies.", why: "The highest-power transmitters in the TCU are V2X and NTN, both close in frequency to receivers (Wi-Fi 5.8/6 GHz, GNSS).", refs: [r3, r4], conf: high, kind: consideration}
  - {id: d16, area: "Cellular TX/RX switch", rule: "Use a TX/RX switch module with separate LB and M/HB antenna ports for downlink inter-band CA, harmonics below –50 dBm, IEC antenna ESD and a forward coupler for power control.", why: "SKY5A2205 integrates these to serve multiple regional variants on one PCB.", refs: [r4], conf: high, kind: rule}
trends:
  - {id: t1, text: "Rel-19 TS 38.101-5 adds PC2 (26 dBm) and PC1 (31 dBm) for n255/n256 with 2Tx/4Tx options and NTN power boosting; 5GAA's 26 dBm vehicle request is now standard text.", horizon: now, refs: [r1, r2], conf: high, for_us: "An automotive 26 dBm NTN module is a standard power class, not a proprietary option; PC1 at 31 dBm is a vehicle-only opportunity (high-power PA or multi-PA at the roof antenna)."}
  - {id: t2, text: "NTN band list widens: L/S bands n250–n256 (incl. n254 1610–1626.5 MHz uplink, n252 2000–2020 MHz) and Ku/Ka bands (n247/n248/n508/n509 Ku, n510–n512 Ka).", horizon: now, refs: [r1, r6], conf: high, for_us: "A broadband 1.6–2.2 GHz NTN PA with switched filters fits better than per-band parts; n254 puts an uplink even closer to GNSS, raising the value of our GNSS + NTN filter pair."}
  - {id: t3, text: "RedCap over NTN, IoT-NTN uplink capacity (OCC repetitions) and regenerative payloads are Rel-19 items; GNSS-independent operation is being studied.", horizon: 2-3y, refs: [r6], conf: med, for_us: "Value NG-eCall TCUs could add a satellite fallback on one small module; same single-transmit front end serves terrestrial and NTN RedCap."}
  - {id: t4, text: "RedCap trims the device to 20 MHz, 1–2 receivers and optional half-duplex; Rel-18 continues with further reduced devices (eRedCap).", horizon: now, refs: [r5], conf: high, for_us: "Content per value TCU shrinks to one transmit chain and 1–2 receivers: compete with integrated single-transmit modules, not with 4×4 MIMO sets."}
  - {id: t5, text: "Vehicle terminals are becoming a distinct NTN UE type: 5GAA asks 3GPP for NF 7 dB, 23/26 dBm and 0/3 dBi at L/S band, and 25–33 dBi flat arrays at Ka band after 2030.", horizon: 5y+, refs: [r2], conf: high, for_us: "L/S-band NTN content now; Ka-band arrays need automotive-cost beamformers we do not have today."}
  - {id: t6, text: "NTN is moving into the 6G design from the start (integrated TN/NTN, direct-to-device, AI-driven resource management).", horizon: 5y+, refs: [r6], conf: med, for_us: "Satellite stops being an add-on path: long-term the NTN bands fold into the main mid-band module (one PA module with terrestrial and satellite bands)."}
skyworks_fit:
  - {fn: pa_module, parts: ["SKY5A2206", "SKY68040-11"], note: "SKY5A2206 is the AEC-Q104 LMH PA (PC2 n40/n41 at 4.5 V; catalogue lists it as rf_frontend with a copied description). SKY68040-11 covers n255 and n256 (and B23/B24) but is not automotive and its output power is not stated; the catalogue maps it to power_amplifier."}
  - {fn: rf_frontend, parts: ["SKY5A2205", "SKY5A3048"], note: "TX/RX switch module with 15 TRX ports and coupler (SKY5A2205); UHB L-PAMiF (SKY5A3048)."}
  - {fn: lna, parts: ["SKY5A2203"], note: "LMHB LNA bank; no NTN downlink LNA (1525–1559 / 2170–2200 MHz) in the automotive set."}
  - {fn: diversity_rx_module, parts: ["SKY5A5010", "SKY5A5005", "SKY5A5009"], note: "DRx and MIMO receive modules for 2–4 receive paths; oversized for 1–2 Rx RedCap."}
  - {fn: gnss_lna, parts: ["SKY5A2110"], note: "L1+L5 with pre/post filters and B13 notch; rejection at 1610–1660 MHz (NTN uplink) not specified — the key open item for NTN coexistence."}
  - {fn: v2x_fem, parts: ["SKY5A2105", "QPF1004Q"], note: "SKY5A2105 has PA+LNA+switch, +29 dBm LTE-V2X, compensator mode; Qorvo QPF1004Q C-V2X/DSRC FEM."}
  - {fn: antenna_switch, parts: ["QPC8013Q", "QPC8020Q", "QPC1251Q"], note: "AEC-Q100 SP4T switches and the Qorvo antenna-routing switch for main/backup eCall antenna swap (catalogue function rf_switch)."}
  - {fn: filter_saw_baw, parts: ["QPQ1040Q", "QPQ1041Q", "QPQ2200Q", "QPQ2230Q"], note: "Q-suffix BAW for B40/B41 and V2X (pass and notch); no n255/n256 duplexer or GNSS-protecting NTN filter in the catalogue."}
  - {fn: diplexer, parts: [], note: "Opportunity: n255/n256 duplexers with deep rejection at 1559–1610 MHz."}
open_questions:
  - "What NG-eCall RF requirements apply to the antenna and backup path (UN R144 crash tests, CEN/TS 17184/17240)? Primary texts were not readable (unece.org blocked by a bot check; CEN/EUR-Lex not reachable)."
  - "How much isolation can a roof module give between an n255 transmit patch and the GNSS L1 patch, and what blocking level must the GNSS LNA survive at 1626.5–1660.5 MHz?"
  - "Does 3GPP Rel-19 define a vehicle-mounted UE (antenna gain other than 0 dBi) for FR1-NTN, or only power classes? Not found in TS 38.101-5 V19.6.0 text read."
  - "What output power, linearity and temperature range does SKY68040-11 reach at n255/n256, and can the die meet AEC-Q104?"
  - "Rel-18 eRedCap exact RF capabilities (5 MHz bandwidth, peak rate) were not read in a primary document here."
  - "Will NTN power boosting (Rel-19) push 'PC3' NTN PAs above 25 dBm saturated, and by how much?"
