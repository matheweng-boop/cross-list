order: 6
topic: traction_asil_d
title: "Isolation in the ASIL-D traction inverter (400 V / 800 V, SiC and IGBT)"
summary: "A traction inverter needs a galvanic barrier wherever a signal or supply crosses from the 12 V control side to the 400 V or 800 V power stage. It sits in six isolated gate drivers, their isolated bias supplies, and the isolated current and voltage sensing. Because a single wrong gate signal can cause unintended torque, the gate-drive chain is usually rated ASIL D. Modern smart drivers therefore add fast short-circuit detection, soft turn-off, gate monitoring, SPI with CRC, built-in self-tests and a hardware path to a safe state (active short circuit or freewheel). With 800 V SiC, the driver must detect a short in well under a microsecond and tolerate dv/dt above 100 V/ns, while still needing reinforced isolation."
references:
  - {id: r1, title: "HEV/EV Traction Inverter Design Guide Using Isolated IGBT and SiC Gate Drivers (SLUA963B)", publisher: "Texas Instruments", year: 2022, url: "https://www.ti.com/lit/an/slua963b/slua963b.pdf", type: app_note, licence: "TI copyright; internal summary with citation only", retrieved: 2026-10-21, why: "Most complete public walk-through of inverter failure modes mapped to gate-driver protections (DESAT/OC, 2-level and soft turn-off, Miller clamp, VGE monitor, ASC) and the three bias-supply architectures"}
  - {id: r2, title: "Towards Functional Safety in Traction Inverter: Design Approach and Component Overview (SDAA370)", publisher: "Texas Instruments", year: 2026, url: "https://www.ti.com/lit/an/sdaa370/sdaa370.pdf", type: app_note, licence: "TI copyright; internal summary with citation only", retrieved: 2026-10-21, why: "Worked ISO 26262 flow for an inverter: safety goals, FTA, FMEA, FSR/TSR tables, safe states (zero torque, freewheel, ASC), DFA, ASIL decomposition for current and position sensing, bias-supply redundancy"}
  - {id: r3, title: "Understanding Functional Safety for Gate Drivers and Traction Inverter Systems (SSZT066)", publisher: "Texas Instruments", year: 2022, url: "https://www.ti.com/lit/ta/sszt066/sszt066.pdf", type: white_paper, licence: "TI copyright; internal summary with citation only", retrieved: 2026-10-21, why: "Short primer that states the ASIL-D hardware metrics (SPFM >= 99 %, LFM >= 90 %, PMHF <= 10 FIT) and the documentation levels (FIT, FMD, FMEDA, FTA, safety manual) a gate-driver supplier must provide"}
  - {id: r4, title: "Si82900/10/11/13 Isolated Safety Gate Drivers Product Summary (207561A)", publisher: "Skyworks Solutions", year: 2026, url: "https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/product-summaries/Si829x-product-summary.pdf", type: app_note, licence: "Skyworks public document (own company); summary with citation", retrieved: 2026-10-21, why: "Our own ASIL-D traction gate driver: current-mode ProVCD drive (15 A, integrated 15 A Miller clamp), DESAT plus current-mirror SCP, SPI with CRC, BIST, forced output state, 6 kVrms reinforced, 125 kV/us CMTI; half-bridge application circuit"}
  - {id: r5, title: "Analysis and Design of Desaturation Short-Circuit Protection for SiC MOSFET Under High Switching Voltage Transients (arXiv 2609.23000)", publisher: "arXiv (Pogulaguntla, Karuppaswamy)", year: 2026, url: "https://arxiv.org/abs/2609.23000", type: paper, licence: "arXiv; licence not checked (default arXiv distribution licence assumed): summary and short quotes only", retrieved: 2026-10-21, why: "Open-access, quantitative design method for SiC DESAT: withstand time vs detection time, blanking-capacitor sizing, dv/dt-induced false trips, concrete component values"}
  - {id: r6, title: "6.622 Power Electronics, Lecture 38: Gate Drive, Level Shift, Layout", publisher: "MIT OpenCourseWare (D. Perreault)", year: 2023, url: "https://ocw.mit.edu/courses/6-622-power-electronics-spring-2023/resources/mit6_622_s23_lec38_pdf2/", type: course, licence: "CC BY-NC-SA 4.0", retrieved: 2026-10-21, why: "Textbook-level basis for gate-drive power (P = V*Q*f), gate-loop inductance and layout, floating (isolated) supplies and shoot-through; the physics under the vendor rules"}
block_diagram:
  name: "ASIL-D traction inverter: isolation and safety chain"
  note: "Drawn by us from r1 (Fig 2-4, 3-1, 4-1..4-3), r2 (Fig 2-1, 3-9, 3-14..3-17) and r4 (Fig 10). Left: LV (12 V) domain. Centre: the galvanic barrier, crossed only by isolated parts. Right: the HV (400/800 V) domain. Each power switch has one isolated gate driver with its own secondary supply (VCC2/VEE2). The safety logic gives a second, MCU-independent path to ASC or freewheel."
  groups:
    - {id: g1, label: "LV supply & supervision", col: 0, row: 0, blocks: [{fn: pmic, label: "Safety PMIC (VMON, Q&A watchdog)"}, {fn: watchdog}, {fn: pre_regulator, label: "Pre-regulator for bias supplies"}]}
    - {id: g2, label: "Control & safety logic", col: 1, row: 0, blocks: [{fn: mcu, label: "Lockstep MCU (FOC, PWM, SPI)"}, {fn: external_block, label: "Independent ASC / freewheel logic (CPLD)"}, {fn: can_transceiver}]}
    - {id: g3, label: "Isolated bias supply", col: 1, row: 1, blocks: [{fn: isolated_dcdc, label: "HS bias VCC2/VEE2 (x3)"}, {fn: isolated_dcdc, label: "LS bias (shared or x3)"}, {fn: hv_flyback, label: "Redundant HV-fed bias for LS drivers"}]}
    - {id: g4, label: "Isolated gate drivers (barrier)", col: 2, row: 0, blocks: [{fn: gate_driver, label: "Smart isolated driver x6: DESAT/OC, STO/2LTO, Miller clamp, VGE monitor, ASC pin, SPI+CRC, BIST"}]}
    - {id: g5, label: "Isolated sensing (barrier)", col: 2, row: 1, blocks: [{fn: isolated_amplifier, label: "DC-link voltage (isolated amp or sigma-delta)"}, {fn: current_sensor, label: "Phase current x3 (coreless Hall or shunt)"}, {fn: digital_isolator, label: "Fault / ADC back-channel"}]}
    - {id: g6, label: "Power stage (HV)", col: 3, row: 0, blocks: [{fn: hv_battery}, {fn: dc_link_cap}, {fn: power_module, label: "SiC MOSFET or IGBT half-bridges x3"}, {fn: temperature_sensor, label: "Module NTC / diode via driver ADC"}]}
    - {id: g7, label: "Motor & discharge", col: 3, row: 1, blocks: [{fn: motor}, {fn: position_interface, label: "Resolver / inductive position x2 (redundant)"}, {fn: isolated_switch_driver, label: "DC-link active discharge"}]}
