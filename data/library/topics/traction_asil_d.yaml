design_rules:
  - {id: d1, area: "Short-circuit protection (SiC)", rule: "Set the total short-circuit detection time (blanking + driver delay + deglitch) below the switch's short-circuit withstand time with margin. In r5's 650 V SiC example at 400 V, the estimated withstand time was 1.2 us and the target detection time <= 600 ns. A conventional DESAT with 100 pF blanking gave 1.04 us, which was too slow.", why: "SiC MOSFETs reach up to 10x rated current in a short and typically withstand less than 3 us, much less than IGBTs", refs: [r5], conf: high, kind: rule}
  - {id: d2, area: "Short-circuit protection (SiC)", rule: "Size the DESAT network so that the dv/dt-induced peak on the blanking capacitor stays 1-2 V above the driver threshold and below the DESAT pin rating. r5 recommends a diode with Cj <= 5 pF, Cblk = 350 pF and Re <= 500 ohm (type-1 with external resistor), or Cblk = 500 pF and R1 = 600 ohm (type-2).", why: "Turn-off dv/dt (40 V/ns in r5's analysis) injects displacement current through the HV diode, which causes false trips. A smaller Cblk is faster but noisier.", refs: [r5], conf: high, kind: rule}
  - {id: d3, area: "Fault turn-off", rule: "After DESAT or OC detection, never hard-switch the device off. Use soft turn-off (r1: 400 mA pull-down) or two-level turn-off (r1: gate held at about 9 V plateau, then ramped down), and make the profile programmable for SiC vs IGBT.", why: "Fault current x loop inductance gives destructive overshoot. A slower di/dt keeps VDS/VCE inside its rating.", refs: [r1, r4], conf: high, kind: rule}
  - {id: d4, area: "Miller clamp / CMTI", rule: "Hold the off-state gate with an active Miller clamp (r1: engages below 2 V on OUTL; r4: integrated 15 A clamp plus external-clamp output) and a negative gate rail. Specify driver CMTI >= 100 kV/us for SiC (r4: 125 kV/us; r1: UCC217xx > 150 V/ns, UCC5870 > 100 V/ns).", why: "SiC edges couple through Cgd and can turn the opposite switch on (shoot-through), and through the barrier capacitance they can corrupt the PWM or fault channels", refs: [r1, r4], conf: high, kind: rule}
  - {id: d5, area: "Gate voltage levels", rule: "Check VCC2/VEE2 with UVLO and OVLO on both rails, with thresholds chosen per switch type. r1's IGBT example uses a 12 V VDD UVLO, and r5 tests SiC at +15/-4 V. On r4, VPOS is regulated on-chip from an 18-30 V VDDO and VNEG follows from it.", why: "Under-drive raises conduction loss and the risk of desaturation. Over-drive degrades SiC gate oxide. A supply fault must fail to gate-low.", refs: [r1, r4, r5], conf: high, kind: rule}
  - {id: d6, area: "Safe state", rule: "Provide a hardware ASC / freewheel path that does not depend on the main MCU: a primary-side and a secondary-side ASC input on each driver, driven by independent logic. Use ASC at high speed (back-EMF > battery voltage) and freewheel (all switches off) at low speed.", why: "At high speed, opening all switches makes the PMSM back-EMF force regenerative current into the battery, which brakes the vehicle hard. ASC limits the phase current to a constant value.", refs: [r2, r1], conf: high, kind: rule}
  - {id: d7, area: "ISO 26262 metrics", rule: "Budget the gate-drive chain inside the item-level ASIL-D targets: SPFM >= 99 %, LFM >= 90 %, PMHF <= 10 FIT. Ask the driver supplier for the FIT, FMD, FMEDA, FTA and safety manual.", why: "The gate driver is a first-order cut-set for 'unintended acceleration torque' (r2 SG1, ASIL C/D, example FTTI 750 ms)", refs: [r3, r2], conf: high, kind: rule}
  - {id: d8, area: "Latent faults", rule: "Cover latent faults with power-on and on-demand BIST of the protection circuits (UVLO/OVLO, DESAT/OC comparators, ASC logic, isolation-lane check) plus SPI CRC on configuration and NVM. Check gate voltage against PWM every cycle.", why: "A failed DESAT comparator or ASC path is a multiple-point fault. Without BIST it stays latent and LFM cannot reach 90 %.", refs: [r2, r1, r4], conf: high, kind: rule}
  - {id: d9, area: "Bias supply architecture", rule: "Do not feed all six drivers from one isolated supply in an ASIL-D design. Use distributed (one per driver) or semi-distributed (one per HS driver plus a shared LS supply) bias, and consider a redundant HV-battery-fed supply for the low-side drivers so that ASC still works if the 12 V net is lost.", why: "A centralized supply is a single point of failure that removes every safe state at once. A semi-distributed or redundant supply keeps at least one switch group able to reach ASC.", refs: [r1, r2], conf: high, kind: rule}
  - {id: d10, area: "Current sensing", rule: "Measure all three phase currents even though two are enough for FOC, and use Ia+Ib+Ic = 0 as a plausibility check. This allows ASIL decomposition, for example ASIL B(D) per sensor. Add range checks and a torque cross-check.", why: "Wrong current gives wrong torque (an SG1 cut-set). Range detection alone gives only about 60 % coverage (r2).", refs: [r2], conf: high, kind: rule}
  - {id: d11, area: "Isolation rating", rule: "For the barrier between 12 V and an 800 V bus, use reinforced isolation certified to IEC 60747-17 (VDE 0884-17) and UL 1577, with a working voltage that covers the peak bus voltage plus overshoot. r4 offers 6 kVrms (1 min), 1500 Vrms working and 10 kV surge. Creepage (IEC 60664-1, material group I mould compound, sealed housing = pollution degree 2): reinforced needs 8.0 mm at 800 V and 10 mm at 1000 V, so a wide-body 8 mm package is just enough at 800 V and an extra-wide (14.5 mm) one is needed when the barrier is designed for the full-charge or 1000 V level. At pollution degree 3 (condensation expected) basic needs 10-12.5 mm and reinforced 20-25 mm, so the housing is sealed or the board coated or potted instead.", why: "In the inverter the gate driver is the human-safety barrier. Narrow-body 3.9-4 mm packages are adequate only at lower working voltages. The creepage figures are from public reproductions of the IEC 60664-1 table (TI SLUP419/SLUP421, MINMAX); see the creepage specification guide for the full table and sources.", refs: [r4], conf: med, kind: consideration}
  - {id: d12, area: "Isolation lane integrity", rule: "Treat the PWM and ASC channels across the barrier as safety signals. Use a driver that compares the output or gate state with the input (IN_MON, gate monitor) and reports a mismatch (isolation-lane detection), and make the output default low when the input side loses power.", why: "Barrier failure or a stuck output is an SPF for SG1. r2 assigns TSR 1.6.10-1.6.12 (ASIL D) to the gate driver.", refs: [r2, r4], conf: high, kind: rule}
  - {id: d13, area: "Gate-drive power and layout", rule: "Size each isolated bias supply for P = Vdrive_total x Qg x fsw per switch, plus driver quiescent and ADC load. Keep the gate loop and its return stacked and short, and use a Kelvin source.", why: "Gate energy is dissipated mostly in the driver and gate resistors, independent of R. Loop inductance limits the switching speed and causes ringing that defeats Miller clamping.", refs: [r6], conf: high, kind: rule}
  - {id: d14, area: "Drive strength", rule: "Tune switching speed per operating point instead of with a fixed worst-case gate resistor. Use split outputs (separate turn-on and turn-off paths) or current-mode drive with on-the-fly SPI updates, trading switching loss against overshoot and EMI.", why: "A fixed resistor is set for worst case (cold, maximum bus voltage) and wastes efficiency at the typical point. r6 shows that faster edges raise EMI and overshoot.", refs: [r4, r6], conf: med, kind: consideration}
trends:
  - {id: t1, text: "800 V SiC is now the mainstream. SiC short-circuit withstand times below 3 us force sub-microsecond detection (DESAT redesign, current-mirror or sense-FET SCP, dv/dt sensing) and CMTI of 100-200 kV/us.", horizon: now, refs: [r5, r4, r1], conf: high, for_us: "Si829x (125 kV/us, DESAT plus current-mirror SCP) and Si82Bx/Ex/Fx (200 kV/us, 6 kVrms reinforced) fit. The gap is a published Si829x full datasheet with DESAT timing and CMTI min."}
  - {id: t2, text: "Active (programmable) gate driving replaces fixed gate resistors with current-mode or multi-step drive that changes per temperature, speed and bus voltage, cycle by cycle over SPI.", horizon: 2-3y, refs: [r4, r1], conf: med, for_us: "ProVCD in Si829x and SelVCD in Si82Cx/Fx are differentiators. They need application notes and loss/EMI data to win sockets against Infineon 1EDI3041AS slew control and the TI UCC5880/81."}
  - {id: t3, text: "Gate drivers absorb sensing and health monitoring: on-chip ADC for NTC/diode temperature and DC-link voltage, Vth measurement, rise/fall-time capture and RDS(on) estimation for predictive maintenance.", horizon: now, refs: [r1, r4], conf: high, for_us: "Si829x has a 4-channel ADC and Vth measurement. This may cut external isolated amplifiers for DC-link voltage (risk to Si893x attach rate), but it keeps the gate driver as the main socket."}
  - {id: t4, text: "Functional safety is moving from 'ASIL-D capable' to certified SEooC drivers with BIST, CRC-protected SPI and isolation-lane diagnostics. Regulations (GB/T 43254-2023, EU 2019/2144, SAE J2980) make inverter safety goals mandatory.", horizon: now, refs: [r2, r3], conf: high, for_us: "Si829x is 'developed according to ISO 26262' with 'ASIL D (Pending)'. Customers will ask for a certificate, FMEDA and safety manual, and closing that is a sales priority."}
  - {id: t5, text: "Redundant and distributed bias supplies (per-driver isolated DC-DC plus a backup supply fed from the HV battery) are becoming standard for fail-safe ASC.", horizon: 2-3y, refs: [r2, r1], conf: high, for_us: "Si88xx (isolator plus DC-DC controller, 1414 Vpk working, basic) suits per-driver bias at 400 V. There is no Skyworks HV flyback or integrated reinforced isolated DC-DC module in the repo data, which is an opportunity."}
  - {id: t6, text: "High dv/dt makes common-mode EMI and crosstalk a design driver. This pushes Faraday shielding, low inter-winding capacitance bias transformers and tight layout (and, in research, multilevel and filterless WBG inverters).", horizon: 2-3y, refs: [r6, r5], conf: med, for_us: "Low barrier capacitance and high CMTI isolators and bias controllers are selling points. Multilevel (3-level ANPC) inverters double the driver count per phase."}
  - {id: t7, text: "GaN for traction inverters is still at research or early stage (mostly multilevel at 400 V). It would need faster short-circuit protection than DESAT and lower gate voltage levels.", horizon: 5y+, refs: [r5], conf: low, for_us: "Watch only. Current Skyworks drivers with 5-6 V UVLO grades (Si827x, Si823H) could fit low-voltage GaN stages, not 800 V traction."}
skyworks_fit:
  - {fn: gate_driver, parts: ["SI82900AA-AU", "SI82900AB-AU", "SI82900BA-AU", "SI82900BB-AU"], note: "Si829x ASIL-D (pending) SPI safety gate driver for traction: 15 A ProVCD, 15 A Miller clamp, DESAT plus current-mirror SCP, BIST, FOS safe state, 6 kVrms reinforced, 125 kV/us. Product summary only (no full datasheet), so UVLO, timing and creepage are not public. The repo lacks the Si82910/11/13 two-package variants."}
  - {fn: gate_driver, parts: ["SI8285BD-AS", "SI8286BC-AS"], note: "Si8285/86 4 A drivers with DESAT, soft shutdown and Miller clamp (Si8285 has split VH/VL). Basic isolation only (5 kVrms, 8 mm creepage), 125 kV/us. Fits IGBT or 400 V designs at QM-ASIL B level with external diagnostics."}
  - {fn: gate_driver, parts: ["SI82B40ABC-AS", "SI82E39ABC-AS1", "SI82F39ABC-AS1"], note: "Si82Bx/Ex/Fx automotive voltage-mode (6 A) and SelVCD current-source drivers: reinforced up to 6 kVrms, 200 kV/us, no DESAT. They need external short-circuit protection and diagnostics, so they suit auxiliary SiC stages (OBC/DC-DC) rather than an ASIL-D main inverter."}
  - {fn: isolated_dcdc, parts: ["SI88240BC-AS", "SI88340EC-AS", "SI88440EC-AS", "SI88640EC-AS"], note: "Si88xx digital isolator with an integrated isolated DC-DC controller (external transformer). Automotive, basic isolation, 1414 Vpk working, 7.6 mm creepage. Fits a per-driver (distributed) bias supply plus a fault back-channel. Reinforced isolation for 800 V needs checking."}
  - {fn: isolated_amplifier, parts: ["SI8921AB-AS", "SI8941AB-AS", "SI8931B-AS", "SI8935B-AS"], note: "Si892x/894x shunt current (+-62.5 mV, analog or sigma-delta bitstream) and Si893x DC-link voltage amplifiers and modulators. Reinforced; SSO-8 options rated 5 kVrms with 8-8.5 mm creepage; 50 kV/us CMTI min. They need a secondary-side supply from the bias network. CMTI is lower than the drivers', so check them at SiC dv/dt."}
  - {fn: digital_isolator, parts: ["SI86S600AC-AS"], note: "Si86Sxx automotive reinforced isolators (up to 6 kVrms in SOIC-16W/SSO-8, 100-150 kV/us, 2121 Vpk working) for SPI, fault and ADC back-channels and safety-logic signals across the barrier."}
  - {fn: isolated_switch_driver, parts: [], note: "Si8751A/Si8752A automotive isolated FET drivers are in the Skyworks catalogue (data/catalog) for DC-link active discharge or pre-charge switches, but are not imported in data/real."}
  - {fn: current_sensor, parts: [], note: "No Skyworks isolated (coreless Hall) phase-current sensor in the repo. Only Si8540 (non-isolated, last-time-buy). The shunt route is covered by the Si892x/Si894x isolated amplifiers."}
open_questions:
  - "Si829x full datasheet: DESAT blanking and response time, soft-shutdown current, CMTI min, creepage of SSOP-36, and the status of 'ASIL D (Pending)' (certificate, FMEDA, safety manual availability)?"
  - "Do 800 V OEMs size the inverter barrier for the nominal 800 V (8 mm reinforced, PD2) or for the full-charge / 1000 V level (9-10 mm), and do they accept coating or potting to stay at 8 mm? The IEC 60664-1 numbers now come from public reproductions (see the creepage guide); ISO 6469-3 and LV 123 set voltage classes, not creepage, and were not read (paid)."
  - "Is the Si88xx basic barrier acceptable for HS bias at 800 V, or is a reinforced isolated DC-DC needed? There is no reinforced Skyworks bias controller in the repo data."
  - "Do Si893x/Si894x (50 kV/us CMTI min) hold accuracy next to SiC legs switching at 100+ V/ns? Is a higher-CMTI sensing family on the roadmap?"
  - "Coreless Hall vs shunt + isolated sigma-delta: which way are 800 V SiC platforms trending (TI TMCS2100 and integrated module shunts are cited in r2)?"
  - "Typical SiC gate rails for 800 V traction modules (+18/-3 V vs +15/-4 V): only r5's +15/-4 V test point and r4's 18-30 V VDDO range were read. Module vendor data is still needed."
