order: 1
topic: v2x_frontend
title: "5.9 GHz V2X front ends (C-V2X, ITS-G5/802.11p/bd) and coexistence with car Wi-Fi"
summary: "A V2X front end puts a PA, an LNA, a T/R switch and a 5855–5925 MHz BAW filter next to the roof antenna or in the telematics unit. A step attenuator and a power detector make up the cable loss (compensator mode). Output power is set by EIRP limits: 33 dBm e.i.r.p. in Europe, and in 3GPP the limit falls by the declared gain after the antenna connector. Linearity is set by the transmit mask, ACLR, EVM and power back-off (MPR/A-MPR) of each waveform. Research is moving to several carriers in one car: ITS-G5 with LTE-V2X in the same channel, NR-V2X time-shared with LTE-V2X on one PA, 802.11bd with 256-QAM and 20 MHz channels, and in the US, UNII-4 Wi-Fi directly below the C-V2X channels. That calls for faster switching, more linear PAs, steeper filters and dual-path front ends."
references:
  - {id: r1, title: "ETSI EN 302 571 V2.1.1: ITS radiocommunications equipment operating in 5855–5925 MHz (Harmonised Standard)", publisher: "ETSI", year: 2017, url: "https://www.etsi.org/deliver/etsi_en/302500_302599/302571/02.01.01_60/en_302571v020101p.pdf", type: standard, licence: "Free download; no reproduction without ETSI permission (we paraphrase and cite clauses)", retrieved: 2026-10-21, why: "The legal RF limits in Europe for any 5.9 GHz V2X radio: power, PSD, mask, out-of-band, receiver blocking and selectivity, tolling protection"}
  - {id: r2, title: "3GPP TR 38.886 V16.3.0: V2X Services based on NR; User Equipment (UE) radio transmission and reception", publisher: "3GPP", year: 2021, url: "https://www.3gpp.org/ftp/Specs/archive/38_series/38.886/38886-g30.zip", type: standard, licence: "Free; © 3GPP (paraphrased, clause-cited)", retrieved: 2026-10-21, why: "The NR-V2X RF rules for n47: power class, MPR/A-MPR, post-connector gain, ACLR, EVM, REFSENS, ACS, TDM with LTE-V2X on one PA (zip was cut off at 94 %; main text recovered)"}
