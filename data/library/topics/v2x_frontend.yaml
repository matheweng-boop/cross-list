  - {id: r5, title: "Co-channel coexistence between ITS-G5 and LTE-V2X: mitigation methods (WP 2091 V1.0)", publisher: "CAR 2 CAR Communication Consortium", year: 2021, url: "https://www.car-2-car.org/fileadmin/documents/General_Documents/C2CCC_WP_2091_Co-ChannelCoexistence_MitigationMethods_V1.0.pdf", type: white_paper, licence: "Free download; no reproduction without permission (summarised)", retrieved: 2026-10-21, why: "Evaluates ETSI TR 103 766 methods A–F for ITS-G5 and LTE-V2X in the same EU channel; the chosen method makes one radio send both waveforms back to back"}
