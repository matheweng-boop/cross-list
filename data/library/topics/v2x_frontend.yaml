block_diagram:
  name: "V2X front end at the roof antenna (compensator mode) beside car Wi-Fi"
  note: "Drawn by us from r1–r5 (not copied). One V2X path is shown, as in SKY5A2105: T/R switch, BAW band-pass, PA, LNA, step attenuator, log detector and temperature sensor. It sits next to the V2X antenna and makes up the coax loss to the V2X chipset. A dual-carrier car (US 20 + 10 MHz, EU ITS-G5 + C-V2X) has two such paths. The car's Wi-Fi 5/6 GHz front end shares the roof module and needs its own filter so it does not leak into 5855–5925 MHz."
