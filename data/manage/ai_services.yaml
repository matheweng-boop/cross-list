# AI services we may deploy later (owner, 27 Oct 2026: "we should keep a list of running AI services we may want to
# deploy in the future"). Read-only list on Data management › AI services (later), owner only (/manage/ai-services).
# None of these runs today: the site sends nothing to an AI service. Each one needs an API key and the owner's approval
# of the data it would send out before it is built. The daily run adds an entry whenever the owner mentions a future AI
# use (docs/daily_update.md).
#
# Fields: id, name, does (what it would do), where (page), data_out (what would leave the site: the data-protection
# impact), status (idea | parked), needs, added, quote (the owner's words that started it).
services:
  - id: research_agent
    name: Research agent page
    does: Runs a research question end to end (search, read, summarise) and returns a report draft for review.
    where: Future growth › Research & ideas
    data_out: The research question and the public pages it reads; no customer data, volumes or prices.
    status: parked
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "we should keep a list of running AI services we may want to deploy in the future"
  - id: qspice_answers
    name: QSPICE answers in sentences
    does: Answers a QSPICE question in a few sentences from the library's own summaries, citing the threads, instead of a ranked list.
    where: Engineering knowledge › QSPICE library (Ask box)
    data_out: The typed question (screened, no names) and the matching library summaries, which come from public sources.
    status: idea
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "a full user library where I can ask questions"
  - id: text_to_blocks
    name: Smarter text-to-block-diagram parsing
    does: Reads a free-text system description beyond the word list and proposes blocks and links for the owner to check.
    where: Systems & applications › Block editor ("Describe your system")
    data_out: The typed description, which may name a customer's system, so it would need screening before it leaves.
    status: idea
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "we should keep a list of running AI services we may want to deploy in the future"
  - id: auto_gists
    name: Gists and abstracts for To confirm
    does: Writes the one-sentence gist and the short abstract of each new research item, which the daily run now writes by hand.
    where: Data management › To confirm
    data_out: Our own research texts (summaries of public sources); no owner comments or guest input.
    status: idea
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "we should keep a list of running AI services we may want to deploy in the future"
  - id: datasheet_reader
    name: Datasheet reader
    does: Reads public datasheets to fill and check part values (data rate, CMTI, supply range) with page references.
    where: Products › part pages and Data quality
    data_out: Public datasheet PDFs only.
    status: idea
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "we should keep a list of running AI services we may want to deploy in the future"
  - id: shareable_drafts
    name: Drafting shareable documents
    does: Drafts the text of a shareable report or slides from site content, for the owner to edit before sharing.
    where: Shareable
    data_out: The site content picked for the document; only public information is meant to be shareable.
    status: idea
    needs: API key; the owner's approval of the data sharing
    added: 2026-10-27
    quote: "we should keep a list of running AI services we may want to deploy in the future"
