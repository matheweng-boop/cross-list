# Known answers for the daily cross accuracy check (scripts/check_cross_accuracy.py; docs/daily_update.md).
# The daily run adds each pair the owner marked on Products › Cross a list (inbox sections "Cross list: wrong
# crosses" and "Cross list: confirmed crosses"): their = the competitor part, ours = our part (a prefix covers every
# ordering code that starts with it), expect = right | wrong, date, note. The engineer notes in data/cross_notes.yaml
# count too (best / next best / acceptable = right, not recommended = wrong); they are read from there, not copied.
pairs:
  - their: ISO7761QDWRQ1
    ours: SI86S661EE-AS2
    expect: right
    date: 2026-10-27
    note: "Marked Right 26 and 27 Oct 2026. Owner: revisit CMTI, higher for both parts. Checked 28 Oct: ISO7761-Q1
      CMTI is 85 min / 100 typ (iso7761-q1.pdf p.13, 15, 17); Si86S661EE (E code) is 100 min, no typical (si86s6xx
      p.23, 27, 31; 150 min only for the F / H deglitch codes). No higher typical in either datasheet; values kept."
  - their: ISO7761QDWRQ1
    ours: SI8661ED-AS
    expect: right
    date: 2026-10-27
    note: Marked Right 26 and 27 Oct 2026.
