# Answers of the cross-list lookup run (docs/daily_update.md, step "Cross-list lookups"; also the hourly run).
# The parts come from "Update cross-lists" on Products › Cross a list (inbox section "Cross-list lookups (queued
# parts)", or GET /api/inbox/crosslist-lookups). The run cannot write the live database, so it records each answer
# here; the site reads this file to show per-part status on Data management › Site data › Requests (kind
# "Cross-list lookup"), and a part listed here is no longer queued once the file is live.
#   lookup: the lookup id from the inbox (for the record: an answer counts for every lookup that sent the part)
#   part: the part number as listed in the inbox
#   status: found | not_found
#   source: the maker's public datasheet URL (found), or the page checked (not_found)
#   date: YYYY-MM-DD
#   note: short reason, e.g. "added to data/real/isolators_xyz.yaml" or "no public datasheet on the maker's site"
parts: []
