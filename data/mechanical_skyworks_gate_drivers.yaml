# Lead and PCB land pattern data for the new Skyworks gate-driver packages of
# data/real/skyworks_gate_drivers_more.yaml (format: data/mechanical.yaml). Packages already in
# data/mechanical.yaml / mechanical_si823x.yaml are not repeated (a repeated key would replace them).
Skyworks:
  SOIC-24W:
    lead_width_mm:
    - 0.31
    - 0.51
    lead_length_mm:
    - 0.4
    - 1.27
    sides: 2
    source: Si8281-82-83-84.pdf section 6.3
    land_patterns:
    - name: Recommended
      pad_length_mm: 1.9
      pad_width_mm: 0.6
      row_spacing_mm: 9.4
      source: Si8281-82-83-84.pdf Table 6.2
  DFN-14 (5x5):
    lead_width_mm:
    - 0.25
    - 0.35
    lead_length_mm:
    - 0.5
    - 0.7
    sides: 2
    source: Si823Hx-DataSheet.pdf Table 7.5
    note: b = pad width, L = pad length; pads pulled back L1 0.05-0.15 from the body edge; no exposed pad
    land_patterns:
    - name: Recommended
      pad_length_mm: 0.8
      pad_width_mm: 0.4
      row_spacing_mm: 4.2
      source: Si823Hx-DataSheet.pdf Table 8.5
      note: X1 0.80 is the pad dimension along the lead, Y1 0.40 across it (Figure 8.5); NSMD pads
  LGA-13 (5x5):
    lead_width_mm:
    - 0.25
    - 0.35
    lead_length_mm:
    - 0.55
    - 0.75
    sides: 2
    source: 'Si82Ex-datasheet.pdf Figure 49 (Detail A: pad 0.3 +/- 0.05 x 0.65 +/- 0.1)'
    note: pad positions 0.65 mm apart, 13 of 14 used (position opposite pin 4 empty)
    land_patterns:
    - name: Recommended
      pad_length_mm: 0.65
      pad_width_mm: 0.3
      row_spacing_mm: 4.15
      source: Si82Ex-datasheet.pdf Figure 52 (metallization, 13X 2.075 from the centre line)
  DIP-8 GW:
    lead_width_mm:
    - 0.35
    - 0.55
    lead_length_mm:
    - 0.38
    - 0.89
    sides: 2
    source: Si826x.pdf Table 17
    land_patterns:
    - name: Recommended
      pad_length_mm: 1.7
      pad_width_mm: 0.65
      row_spacing_mm: 8.9
      source: Si826x.pdf Table 18
      note: Table 18 gives min-max (C 8.85-8.90, X 0.60-0.65, Y 1.65-1.70); max used
  SDIP-6:
    lead_width_mm:
    - 0.31
    - 0.51
    lead_length_mm:
    - 0.4
    - 1.27
    sides: 2
    source: Si826x.pdf Table 19
    land_patterns:
    - name: Recommended
      pad_length_mm: 2.05
      pad_width_mm: 0.6
      row_spacing_mm: 10.5
      source: Si826x.pdf Table 20
      note: Table 20 gives min-max (C 10.45-10.50, X 0.55-0.60, Y 2.00-2.05); max used
  SSOP-36W:
    lead_width_mm:
    - 0.25
    - 0.35
    lead_length_mm:
    - 0.4
    - 1.27
    sides: 2
    source: Si829x-product-summary.pdf Table 8
    note: no land pattern in the product summary
