# Lead (terminal) data of the timing packages in data/real/skyworks_timing.yaml, read from the package dimension
# tables of the Skyworks datasheets (b = terminal width, L = terminal length; min and max). Format: data/mechanical.yaml.
# Competitor timing packages have no lead data yet (their drawings are images): docs/timing_backlog.md.
Skyworks:
  QFN-32 5x5 p0.5 EP:
    lead_width_mm: [0.18, 0.30]
    lead_length_mm: [0.30, 0.50]
    sides: 4
    source: si5332-datasheet.pdf Table 7.3 (32-QFN); si532xx-datasheet.pdf 32-QFN outline
  QFN-40 6x6 p0.5 EP:
    lead_width_mm: [0.18, 0.30]
    lead_length_mm: [0.30, 0.50]
    sides: 4
    source: si5332-datasheet.pdf Table 7.2 (40-QFN)
  QFN-48 6x6 p0.4 EP:
    lead_width_mm: [0.15, 0.25]
    lead_length_mm: [0.30, 0.50]
    sides: 4
    source: si5332-datasheet.pdf Table 7.1 (48-QFN); si532xx-datasheet.pdf 48-QFN outline
  QFN-48 7x7 p0.5 EP:
    lead_width_mm: [0.20, 0.30]
    lead_length_mm: [0.35, 0.45]
    sides: 4
    source: si5332-automotive-grade-datasheet.pdf 7.1 (Si5332-AM3 48-QFN)
  QFN-44 7x7 p0.5 EP:
    lead_width_mm: [0.18, 0.30]
    lead_length_mm: [0.30, 0.50]
    sides: 4
    source: si5341-40-d-datasheet.pdf 10.2 (Si5340 44-QFN)
  QFN-64 9x9 p0.5 EP:
    lead_width_mm: [0.18, 0.30]
    lead_length_mm: [0.30, 0.50]
    sides: 4
    source: si5341-40-d-datasheet.pdf 10.1 (Si5341 64-QFN); si532xx-datasheet.pdf 64-QFN outline
  XO-6 7x5 (Si5xx):
    lead_width_mm: [1.30, 1.50]
    lead_length_mm: [1.17, 1.37]
    sides: 2
    source: si545-datasheet.pdf 5.1 (5 x 7 mm outline)
