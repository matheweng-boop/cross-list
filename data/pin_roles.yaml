# Pin roles: what a datasheet's control pins do, so the cross engine compares them by function, not by name (owner,
# 2 Nov 2026: "pins 7 and 10 (control pins), as one rule"; app/matching/pinroles.py).
#
# pins: one entry per datasheet pin, keyed by the datasheet file and the pin name as stored in the part's pinout
#   (data/real/*.yaml), with the page it is read from. A part takes the entries of the datasheet its pinout was read
#   from (its pinout source), else of its own datasheet.
# pairs: how our pin (the candidate) takes the board wiring of the competitor's pin (the part being crossed), by role.
#   match = no pin deviation; conditional = a fit for one board wiring only, shown with its note (never a full drop-in);
#   mismatch = a pin deviation. "any" = any pin with a role here. Two roles with no pair: the same role matches,
#   different roles do not (the pin name never decides then: "same name, different job" is a mismatch).
#   default_variants: our default output is fixed by the ordering code while theirs follows the board wiring, so the
#   drop-in is offered in both default-output variants (B/F = low, E/H = high; app/services/alternates.output_variants).
# input_side: isolated amplifiers whose datasheet numbers the input (sensing) side 2, where we and TI call it side 1 /
#   A: their side-1 and side-2 supply and ground pins swap before the pins are compared (owner, 2 Nov 2026).

roles:
  nc: not connected inside the part; any board wiring is harmless
  output_enable: output enable, active high, pulled up inside (open = on); tied low, the outputs go high impedance
  default_output_control: sets the outputs' state while the other side is unpowered (open = high); no effect otherwise
  refresh_enable: refresh and watchdog enable; tied to ground in normal use
  input_disable: input disable, active high (outputs go to the fail-safe state); low or open in normal use

pairs:
  - {ours: nc, theirs: default_output_control, result: match, default_variants: true}
  - {ours: nc, theirs: any, result: match}
  - {ours: output_enable, theirs: output_enable, result: match}
  - {ours: output_enable, theirs: default_output_control, result: conditional,
     note: "Works if {pins} tied high or left open on the board; tied low, our outputs switch off"}
  - {ours: output_enable, theirs: nc, result: conditional,
     note: "Works if {pins} tied high or left open on the board; tied low, our outputs switch off"}
  - {ours: output_enable, theirs: refresh_enable, result: mismatch}
  - {ours: output_enable, theirs: input_disable, result: mismatch}

