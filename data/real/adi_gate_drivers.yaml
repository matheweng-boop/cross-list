# Analog Devices (ADI) isolated gate drivers: ADuM4121/ADuM4121-1, ADuM4122, ADuM4136, ADuM4137, ADuM4138, ADuM4177.
# One part per orderable code in each datasheet's ordering guide (evaluation boards left out). Vocabulary per
# data/sources/GATE_DRIVER_DATA.md. Values only as the datasheets state them; "typ" first for performance values.
# Peak currents: the datasheet's single "Peak Current" (IPK) row, used for both source and sink, at the VDD2 it is
# stated at (12 V for ADuM4121/4122/4136, 15 V for ADuM4137/4138); ADuM4177: the 40 A source / 30 A sink
# short-circuit headline (both output pins), typical conditions VDD2 = 18 V.
# uvlo_v: the VDD2 positive-going threshold, typ (ADI states the measured threshold, not a class).
# Not in the comparison vocabulary, so only in notes: thermal shutdown (all but ADuM4121-1), adjustable slew rate
# (ADuM4122 SRC pin, ADuM4177 SPI), integrated isolated flyback controller (ADuM4138), built-in self tests and SPI /
# EEPROM configuration (ADuM4137/4138/4177), isolated temperature sensing, ASC input, fault / ready outputs.
# Lifecycle: the datasheets state no production status, so it stays unknown.
source: Analog Devices public datasheets (Rev. as listed), uploaded by the owner on 30 Oct 2026; analog.com itself was not fetched
