    Grade A (VDD2 UVLO 4.4 V typ, minimum output voltage 4.5 V); tube. Two gate outputs for slew-rate control: VOUT
    follows VIN+, VOUT_SRC follows VIN+ or goes high-Z under control of the primary-side SRC pin (p1, p8, p14).
