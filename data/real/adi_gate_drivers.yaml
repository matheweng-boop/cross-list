# ---------------------------------------------------------------- ADuM4122 (Rev. 0)
- mpn: ADuM4122ARIZ
  manufacturer: Analog Devices
  family: gate_driver
  description: 'ADuM4122: 5-kVrms isolated single-channel gate driver, adjustable slew rate (second output VOUT_SRC), 2-A, 4.4-V UVLO (grade A), SOIC_IC-8'
