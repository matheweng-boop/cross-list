# Analog Devices (ADI) isolated amplifiers for voltage sensing: ADuM3195/ADuM4195 (adjustable gain: an uncommitted
# op amp on the input side) and ADuM4195-1 (fixed gain = 1), both with single-ended analog output.
# One part per orderable code in each datasheet's ordering guide (evaluation boards left out).
# Side naming: ADI calls the sensing (input) side "side 2" (VDD2, GND2) and the output side "side 1". The rules'
# vdd1_range_v / idd1_ma mean the high-side (input) supply, so they hold ADI's VDD2 / IDD2 values, and vdd2_range_v /
# idd2_ma hold ADI's VDD1 / IDD1. Supply currents are the max values, as in skyworks_isolated_amplifiers.yaml.
# Not in the comparison vocabulary, so only in notes: the uncommitted input op amp and the two 2.5 V references
# (ADuM3195/4195), the SHTD shutdown input (ADuM4195-1).
# Packages: the ADuM3195/4195 datasheet gives no outline drawing (it links to analog.com's package index, not
# fetched), so RQ-16 and RI-16-2 dimensions are est. (JEDEC QSOP-16, and the RW-16 wide-body outline); RI-8-1 is
# the outline drawn in the ADuM4122 datasheet (same package option as the gate drivers).
# Lifecycle: the datasheets state no production status, so it stays unknown.
source: Analog Devices public datasheets (Rev. as listed), uploaded by the owner on 30 Oct 2026; analog.com itself was not fetched
