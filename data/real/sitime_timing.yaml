- mpn: 8A34001
  manufacturer: Renesas
  family: timing
  description: ClockMatrix synchronization management unit, 8 channels, 12 differential outputs
  package: Renesas 144-CABGA 10x10
  pinout: []
  datasheet: 8a34001-datasheet.pdf
  datasheet_url: https://www.renesas.com/en/document/dst/8a34001-datasheet
  product_url: https://www.renesas.com/en/products/8a34001
  notes: 'ClockMatrix (Renesas timing, now owned by SiTime): 8 timing channels, each a synthesizer, jitter attenuator,
    DCO or DPLL; IEEE 1588 / SyncE (G.8262, G.8273.2). 8 differential inputs, 12 differential outputs (LVCMOS, LVDS,
    LVPECL, HCSL, CML, SSTL, HSTL), 0.5 Hz–1 GHz. Jitter below 150 fs (10 kHz–20 MHz, a wider band than 12 kHz). Core
    VDD_DIG 1.14–1.89 V plus 1.8 V and 2.5 / 3.3 V analog rails. A network-synchronisation part: a fair match for
    Si5345-class sockets on telecom line cards, more than a plain jitter cleaner needs.'
  lifecycle:
    status: active
    source: 'renesas.com product page: Active'
  params:
    function_type: jitter_attenuator
    outputs: 12
    output_formats: [LVPECL, LVDS, HCSL, CML, LVCMOS]
