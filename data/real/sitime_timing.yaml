- mpn: SiT95211
  manufacturer: SiTime
  family: timing
  description: Quad-PLL 12-output ultra-low-jitter clock generator, up to 2.9 GHz
  package: SiTime 64-QFN 9x9
  pinout: []
  datasheet: SiT95211-datasheet.pdf
  datasheet_url: https://www.sitime.com/sites/default/files/gated/SiT95211-datasheet.pdf
  product_url: https://www.sitime.com/products/clock-generators/sit95211
  notes: 'Four fractional PLLs with a DPLL front end, 4 differential inputs, 12 differential outputs (LVPECL, LVDS,
    HCSL, CML, LVCMOS), 0.5 Hz–2949 MHz. 72 fs typ. at 156.25 MHz, 64 fs at 625 MHz (12 kHz–20 MHz; SiTime headlines
    21 fs with a 4 MHz high-pass filter, not comparable). VDD 1.8 V core plus 3.3 V input / crystal rail. No PCIe
    compliance stated. The competitor for Si5341 / Si5395 / Si5397 class sockets (SerDes, 224G PAM4).'
  lifecycle:
    status: active
    source: 'sitime.com product page: Production'
  params:
    function_type: clock_generator
    outputs: 12
    output_formats: [LVPECL, LVDS, HCSL, CML, LVCMOS]
