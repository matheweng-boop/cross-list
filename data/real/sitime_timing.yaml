  notes: 'VersaClock 6E (Renesas timing, now owned by SiTime). 4 universal output pairs (LVPECL, LVDS, HCSL or 2 x
    LVCMOS) plus an LVCMOS reference output; 1 kHz–350 MHz differential (LVCMOS to 200 MHz). 0.5 ps typ.
    (12 kHz–20 MHz). PCIe Gen 1–5 with spread spectrum off (Gen 1–4 with SSC on). 1.8 / 2.5 / 3.3 V, OTP + I2C.
    Classic competitor for Si5332 in industrial / networking designs.'
