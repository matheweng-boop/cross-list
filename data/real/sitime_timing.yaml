    vdd_range_v: [1.71, 1.89]
    jitter_fs: 72
    qualification: industrial
    temp_range_c: [-40, 85]
    inputs: 4
    control: [I2C, SPI]
  param_sources:
    function_type: SiT95211-datasheet.pdf p1
    outputs: SiT95211-datasheet.pdf p1
