- mpn: SiT9365
  manufacturer: SiTime
  family: timing
  description: Standard-frequency differential MEMS XO, 25–325 MHz, 225 fs
  package: SiTime 7050 6-pin
  pinout: [OE/NC, NC, GND, OUT+, OUT-, VDD]
  datasheet: SiT9365-datasheet.pdf
  datasheet_url: https://www.sitime.com/sites/default/files/gated/SiT9365-datasheet.pdf
  product_url: https://www.sitime.com/products/differential-oscillators/sit9365
  notes: 'MEMS XO with 32 standard frequencies between 25 and 325 MHz (other frequencies: SiT9366 / SiT9367).
    LVPECL, low-swing LVPECL, LVDS, HCSL. 225 fs typ. at 156.25 MHz, 12 kHz–20 MHz (0.1 ps with the 10GbE
    1.875–20 MHz band). Supply options 2.5 / 2.8 / 3.0 / 3.3 V ±10 % (no 1.8 V). Stability down to ±10 ppm;
    –40 to 105 °C option. Also 3.2 x 2.5 and 5.0 x 3.2 mm; the 7.0 x 5.0 mm one is recorded here. Same 6-pad
    layout as the Skyworks Si545 5 x 7 mm, but with a centre pad (no electrical function).'
  lifecycle:
    status: active
    source: 'sitime.com product page: Production'
