  notes: 'Elite platform MEMS oscillator programmable over I2C or SPI to any frequency 1–340 MHz, with DCO pulling up
    to ±3200 ppm. LVPECL, LVDS or HCSL. 210 fs typ. at 156.25 MHz (12 kHz–20 MHz). 2.5–3.3 V options (no 1.8 V).
    Stability down to ±10 ppm, –40 to 105 °C option. 10-lead 5.0 x 3.2 mm QFN: a different footprint from the
    Si549 (5 x 7, 3.2 x 5 or 2.5 x 3.2 mm ceramic).'
