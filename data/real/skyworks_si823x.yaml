# Skyworks Si823x 0.5 / 4.0 A isolated gate drivers (ISOdrivers), from si823x-datasheet.pdf rev 206326B.
# Every OPN in Table 1 (ordering guide, p.2-4): industrial (-I...) and automotive (-A..., AEC-Q100) columns.
# Tape-and-reel ("R" suffix, ordering guide note 4) variants are not listed separately.
# MPNs are written with an upper-case "SI" like skyworks_si86.yaml; the datasheet prints "Si" and states
# (ordering guide note 2) that "Si" and "SI" are interchangeable.
#
# Packages (dimensions: p.37 Table 21, p.39 Table 22, p.40 Table 23, p.41 Table 24):
# - SOIC-16N / SOIC-16W: identical to the codes in skyworks_si86.yaml (D 9.90 / E1 3.90 / E 6.00 / A 1.75 and
#   D 10.30 / E1 7.50 / E 10.30 / A 2.65), so the same codes are reused.
# - SOIC-14W (IS3): same 10.3 x 7.5 mm MS-013 body as SOIC-16W but 14 leads. The pin tables (p.30-32) say
#   "WB SOIC-14 with IS3 Package Designation (has Pins 12 and 13 missing)", i.e. 16-pin positions 12 and 13 have
#   no lead. The outline (p.38, "11X e", corner pins 1/8/9/14) and land pattern (p.43, pads 14,13,12 then a two-pad
#   gap then 11,10,9 on the right column) number the remaining leads 1-14, so pins 12/13/14 sit at 16-pin positions
#   14/15/16 (GNDA/VOA/VDDA). positions_total 16, pin_positions [1..11, 14, 15, 16].
# - LGA-14 (5x5): D = E = 5.00 BSC, e 0.65, A 0.74-0.94, 7 pads per side, no thermal pad. All 14 positions are
#   used: pin 11 is a real pad, named NC (no connection) in Tables 18/19/20 (p.33-35).
source: si823x-datasheet.pdf rev 206326B (2024-12-05), transcribed 2026-10-19
