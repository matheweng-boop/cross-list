# ---------------------------------------------------------------- Si5332: 6/8/12-output any-frequency clock generator
- mpn: Si5332A-GM1
  manufacturer: Skyworks
  family: timing
  description: 6-output any-frequency clock generator, 5–333 MHz, PCIe Gen 1–6
  package: QFN-32 5x5 p0.5 EP
  pinout: []
  datasheet: si5332-datasheet.pdf
  datasheet_url: https://www.skyworksinc.com/-/media/SkyWorks/SL/documents/public/data-sheets/si5332-datasheet.pdf
  product_url: https://www.skyworksinc.com/en/Products/Timing/Low-Jitter-Clock-Generators/Si5332A-GM1
  notes: 'Grade A: integer and fractional synthesis, 5–333.33 MHz differential (LVCMOS to 170 MHz). Jitter 190 fs
    typ. (integer mode, external crystal, 12 kHz–20 MHz; 250 fs fractional). Core VDDA / VDD_DIG / VDD_XTAL 1.71–3.63 V;
    output banks 1.8, 2.5 or 3.3 V. Grades B / D stop at 200 MHz, C / D are integer only; E–L have the crystal inside
    (LGA package). Configured with ClockBuilder Pro (factory-programmed custom part numbers) or over I2C.'
  lifecycle:
    status: unknown
    source: skyworksinc.com catalogue (no status shown)
  params:
    function_type: clock_generator
    outputs: 6
    output_formats: [LVPECL, LVDS, HCSL, LVCMOS]
    freq_range_mhz: [5, 333.33]
    vdd_range_v: [1.71, 3.63]
    jitter_fs: 190
    qualification: industrial
    temp_range_c: [-40, 85]
    pcie_gen: gen6
    inputs: 1
    control: [I2C, pin]
  param_sources:
    function_type: si5332-datasheet.pdf p1
    outputs: si5332-datasheet.pdf p5 (ordering guide, 32-pin = 6 outputs)
    output_formats: si5332-datasheet.pdf p1
    freq_range_mhz: si5332-datasheet.pdf p5 (ordering guide)
    vdd_range_v: si5332-datasheet.pdf Table 5.1
    jitter_fs: si5332-datasheet.pdf Table 5.10
    temp_range_c: si5332-datasheet.pdf Table 5.1
    pcie_gen: si5332-datasheet.pdf p1 (PCIe Gen 1/2/3/4/5/6 compliant)
- mpn: Si5332A-GM2
  like: Si5332A-GM1
  description: 8-output any-frequency clock generator, 5–333 MHz, PCIe Gen 1–6
  package: QFN-40 6x6 p0.5 EP
  product_url: https://www.skyworksinc.com/en/Products/Timing/Low-Jitter-Clock-Generators/Si5332A-GM2
  lifecycle:
    status: unknown
    source: skyworksinc.com catalogue (no status shown)
  params:
    outputs: 8
- mpn: Si5332A-GM3
  like: Si5332A-GM1
  description: 12-output any-frequency clock generator, 5–333 MHz, PCIe Gen 1–6
  package: QFN-48 6x6 p0.4 EP
