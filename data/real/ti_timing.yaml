  datasheet_url: https://www.ti.com/lit/ds/symlink/cdce6214-q1.pdf
  product_url: https://www.ti.com/product/CDCE6214-Q1
  notes: 'AEC-Q100 grade 2 (–40 to 105 °C). One frac-N PLL, 4 differential outputs (LVDS-like, LP-HCSL or LVCMOS)
    plus an LVCMOS reference output, 24 kHz–328.125 MHz. 350 fs typ. integer mode, differential, 12 kHz–20 MHz
    (1.7 ps fractional). PCIe Gen 1–6 without SSC (Gen 1–4 with SSC). 1.8 / 2.5 / 3.3 V. The usual TI answer to
    Si5332-AM1 in ADAS and infotainment.'
