- mpn: LMK04832
  manufacturer: TI
  family: timing
  description: Dual-loop JESD204B jitter cleaner, 14 outputs, up to 3255 MHz
  package: TI NKD 64-pin WQFN 9x9
  pinout: []
  datasheet: lmk04832.pdf
  datasheet_url: https://www.ti.com/lit/ds/symlink/lmk04832.pdf
  product_url: https://www.ti.com/product/LMK04832
  notes: 'Dual-loop jitter cleaner (external VCXO on PLL1) with SYSREF for JESD204B data converters. 14 device-clock
    outputs (CML, LVPECL, LCPECL, HSDS, LVDS, 2x LVCMOS; no HCSL) up to 3255 MHz. 54 fs typ. at 2500 MHz (12 kHz–20
    MHz): measured at a much higher output frequency than the Skyworks 90 fs figures. Lowest output frequency taken as
    2440 MHz VCO / 1023 divider (worked out, not stated). Single 3.3 V supply. Not a like-for-like part for Si5345:
    it needs an external VCXO and is configured over SPI only.'
  lifecycle:
    status: active
    source: ti.com datasheet (PRODUCTION DATA)
  params:
    function_type: jitter_attenuator
    outputs: 14
    output_formats: [CML, LVPECL, LVDS, LVCMOS]
    freq_range_mhz: [2.4, 3255]
    vdd_range_v: [3.15, 3.45]
    jitter_fs: 54
    qualification: industrial
    temp_range_c: [-40, 85]
    inputs: 3
    control: [SPI]
  param_sources:
    function_type: lmk04832.pdf p1
    outputs: lmk04832.pdf p1
    output_formats: lmk04832.pdf p1
    freq_range_mhz: lmk04832.pdf p1 (max 3255 MHz; minimum worked out from VCO / divider)
    vdd_range_v: lmk04832.pdf 6.3
    jitter_fs: lmk04832.pdf p1 (at 2500 MHz)
    temp_range_c: lmk04832.pdf 6.3
