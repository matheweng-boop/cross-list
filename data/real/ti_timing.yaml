parts:
- mpn: LMK03328
  manufacturer: TI
  family: timing
  description: 8-output dual-PLL ultra-low-jitter clock generator, PCIe Gen 1–6
  package: TI RHS 48-pin WQFN 7x7
  pinout: []
  datasheet: lmk03328.pdf
  datasheet_url: https://www.ti.com/lit/ds/symlink/lmk03328.pdf
  product_url: https://www.ti.com/product/LMK03328
  notes: 'Two fractional-N PLLs, 8 outputs (AC-LVPECL, AC-LVDS, AC-CML, HCSL or LVCMOS), 1–1000 MHz (LVCMOS to 200
    MHz). 100 fs typ. (50 MHz crystal, integer mode, 12 kHz–20 MHz; 120 fs with 19.2–38.88 MHz crystals). Single 3.3 V
    core, outputs 1.8 / 2.5 / 3.3 V. Pin mode, I2C or EEPROM start-up. Closest TI match for Si5332 (6–12 outputs)
    and the 4-output Si5340, but it needs a 3.3 V core rail.'
  lifecycle:
    status: active
    source: ti.com datasheet (PRODUCTION DATA)
  params:
    function_type: clock_generator
    outputs: 8
    output_formats: [LVPECL, LVDS, CML, HCSL, LVCMOS]
    freq_range_mhz: [1, 1000]
    vdd_range_v: [3.135, 3.465]
    jitter_fs: 100
    qualification: industrial
    temp_range_c: [-40, 85]
    pcie_gen: gen6
    inputs: 2
    control: [I2C, pin]
  param_sources:
    function_type: lmk03328.pdf p1
    outputs: lmk03328.pdf p1
    output_formats: lmk03328.pdf p1
    freq_range_mhz: lmk03328.pdf 6.x output characteristics (AC-LVPECL / CML 1–1000 MHz)
    vdd_range_v: lmk03328.pdf 6.5 conditions (3.3 V ±5 %)
    jitter_fs: lmk03328.pdf 6.x RMS phase jitter (50 MHz crystal, integer-N)
    temp_range_c: lmk03328.pdf p1
    pcie_gen: lmk03328.pdf p1 (PCIe Gen1–Gen6) and RJGEN6 spec
- mpn: LMK3H0102-Q1
  manufacturer: TI
  family: timing
  description: Automotive reference-less BAW clock generator, 2 differential outputs, PCIe Gen 1–7
  package: TI RGT 16-pin VQFN 3x3
  pinout: []
  datasheet: lmk3h0102-q1.pdf
  datasheet_url: https://www.ti.com/lit/ds/symlink/lmk3h0102-q1.pdf
  product_url: https://www.ti.com/product/LMK3H0102-Q1
  notes: 'AEC-Q100 grade 2 (–40 to 105 °C). Built-in BAW resonator: no crystal needed, ±25 ppm total stability.
    2 differential outputs (AC-LVDS, DC-LVDS, LP-HCSL) or up to 5 LVCMOS, 2.5–400 MHz. 12 kHz–20 MHz random jitter only
    stated as 0.5 ps max (LVCMOS, 50 MHz; no typical differential figure); built for PCIe (Gen 6 CC 34.5 fs max with SSC). 1.8 / 2.5 / 3.3 V. A smaller, crystal-free answer to
    Si5332-AM where only one or two PCIe / Ethernet clocks are needed.'
  lifecycle:
    status: active
    source: ti.com datasheet (PRODUCTION DATA)
  params:
    function_type: clock_generator
    outputs: 2
    output_formats: [LVDS, HCSL, LVCMOS]
    freq_range_mhz: [2.5, 400]
    vdd_range_v: [1.71, 3.465]
    jitter_fs: 500
    qualification: automotive
    temp_range_c: [-40, 105]
    pcie_gen: gen7
    inputs: 0
    control: [I2C, pin]
  param_sources:
    function_type: lmk3h0102-q1.pdf p1
    outputs: lmk3h0102-q1.pdf p1
    output_formats: lmk3h0102-q1.pdf p1
    freq_range_mhz: lmk3h0102-q1.pdf p1
