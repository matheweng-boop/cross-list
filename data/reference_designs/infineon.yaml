# Infineon reference designs (competitor reference), from the public Reference Design Finder and evaluation-board finder.
# Format and rules: README.md in this folder.
#
# How collected: the finder page (reference-design-finder) embeds a React product table whose data comes from
# /dataApi/en/product-table/reference-design-finder.product-table.en.json (93 boards, collection /reference_sf/).
# The finder only shows that curated collection, so the evaluation-board finder table
# (/dataApi/en/product-table/evaluation-board.product-table.en.json, 1885 boards) was also read and every board whose
# Board Type includes "Reference Board" or whose name starts with REF was added. `in_finder: true` marks the 93
# entries listed by the Reference Design Finder itself.
# applications = the table's Target Application / Sub Application / Applications values (plus the page's Applications list).
# parts = Infineon parts from each board's public bill-of-material JSON (evaluation-board.billmaterial.en.json; empty for
# about half the boards), plus part numbers named in the title / description. functions and markets are inferred
# from part families and description keywords (check before relying on them). Titles and summaries come from the
# board page (fetched for the 158 isolation / automotive / motor / power / RF priority boards) or else from the table.
# isolation: true = isolated gate driver, digital / solid-state isolator, ISOFACE, transformer driver, isolated DC-DC
# (DAB / CLLC / phase-shift / brick) or "isolated" in the description.
# documents = the main public document the table links (user manual / application note); design files not downloaded.

source: {vendor: Infineon, pages: ["https://www.infineon.com/design-resources/finder-selection-tools/reference-design-finder", "https://www.infineon.com/design-resources/finder-selection-tools/evaluation-board"], collected: 2026-10-19, method: "finder product-table JSON (reference-design-finder + evaluation-board, Board Type = Reference Board or REF*); per-board BOM JSON; board pages for 158 priority designs"}
