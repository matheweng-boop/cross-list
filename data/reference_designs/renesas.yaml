source:
  vendor: Renesas
  pages:
  - https://www.renesas.com/en/applications
  - https://www.renesas.com/en/design-resources
  collected: '2026-10-19'
  method: 'Winning Combinations: the 25 application sub-category pages under /en/applications list every Winning Combination (grouped by the page''s
    own sub-application headings); each Winning Combination page was fetched once (robots.txt allows; 1 request at a time, >=1.2 s apart). Parts
    = products attached to the clickable blocks of the page''s interactive (inline SVG) block diagram; functions = BizDev ids mapped by keyword
    from block labels and product categories; documents = the interactive diagram anchor plus application notes / boards linked from the blocks.
    Reference boards: the 3 pages of /en/design-resources/boards-kits?board_kit_type=reference (116 boards, table listing) give id, title and
    URL; the board pages themselves were not fetched (fetch budget), so their parts / functions are inherited from the Winning Combination that
    links to the board (or shares its diagram number, e.g. CN032), and are empty otherwise. Renesas does not publish BOM or schematic files for
    Winning Combinations on these pages, so none are recorded.'
