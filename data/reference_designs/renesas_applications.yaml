  REN-WC-EVBMS: {title: "Standard EV Battery Management System - Winning Combination", url: "https://www.renesas.com/en/applications/automotive/ev-hev-vehicles/standard-ev-battery-management-system", note: "diagram AS201"}
  REN-WC-BIDCDC: {title: "Bidirectional DC/DC Converter for 12V/48V EV/HEV Systems - Winning Combination", url: "https://www.renesas.com/en/applications/automotive/ev-hev-vehicles/bi-directional-dcdc-converter-12v-48v-ev-hev-systems", note: "diagram AS218"}
  REN-WC-TTYPE: {title: "Three-Level T-Type Traction Motor Inverter - Winning Combination", url: "https://www.renesas.com/en/applications/automotive/ev-hev-vehicles/three-level-t-type-traction-motor-inverter", note: "diagram WS200"}
