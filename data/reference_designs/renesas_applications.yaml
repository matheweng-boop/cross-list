# Application block diagrams from public Renesas "Winning Combination" pages (competitor reference), for the
# block-diagram generator. Same format as data/blocks/research/ti_block_diagrams.yaml, with `vendor_parts` in place of
# `ti_parts`.
#
# How these were read: each renesas.com/en/applications/<market>/<segment>/<slug> page embeds its system block diagram
# as an inline (Visio) SVG; blocks drawn in blue are clickable and jump to a product list for that block (block name,
# optional one-line description, Renesas parts). The SVG was rendered locally and read; groups below follow the figure's
# own boxes / labels, links are the arrows and buses drawn. White (non-Renesas) blocks are kept with empty vendor_parts.
# "pages" for a REN-WC source = the diagram number printed on the figure (e.g. WS199) + the linked product lists.
# vendor_parts = the Renesas parts the page attaches to that block (competitor reference only, not recommendations).
# Collected 2026-10-19 (robots.txt allows; one request at a time, >= 1 s apart).
#
# Field notes (same conventions as ti_block_diagrams.yaml):
#   groups[].side      lv | hv | barrier | field | backplane | rf (where the figure draws it); omitted when not meaningful
#   groups[].fn_hint   BizDev function ids (data/blocks/functions.yaml) for the blocks
#   links              [from, to, label] = arrows / buses drawn in the figure (label "" when unlabelled)
#   features[]         high-level design questions a user would answer for this application; choices are options, not answers
#   features[].filters existing BizDev parameter names where one fits; otherwise a plain-words attribute marked "(new)"

docs:
  REN-WC-OBC66: {title: "6.6kW Single-Stage Onboard Charger (OBC) - Winning Combination", url: "https://www.renesas.com/en/applications/automotive/ev-hev-vehicles/6-6kw-single-stage-onboard-charger", note: "diagram WS199"}
