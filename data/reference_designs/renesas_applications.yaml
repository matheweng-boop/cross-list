  REN-WC-UPS3K: {title: "Bidirectional 3000W UPS Power - Winning Combination", url: "https://www.renesas.com/en/applications/industrial/renewable-energy-grid/bidirectional-3000w-ups-power", note: "diagram CN048"}
  REN-WC-PFCINV20K: {title: "20kW 3-phase PFC Inverter - Winning Combination", url: "https://www.renesas.com/en/applications/industrial/renewable-energy-grid/20kw-3-phase-pfc-inverter", note: "diagram CN078"}
