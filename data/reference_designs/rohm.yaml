  method: 'robots.txt allows /reference-designs/<id> but disallows the listing''s own data endpoint (/*?p_p_id=*, POST), so the listing could
    not be read. Design ids were enumerated by probing /reference-designs/<id> per id series seen in the sitemap and in web-search results (REF66xxx-REF69xxx,
    REFACDC, REFLED, REFLD, REFSENS, REFRPT, REFRPY, REFPDT, REFPTR, REFMOT, REFLVBMS, REFDCDC), stopping each series after several consecutive
    misses past the highest known id; a page whose <title> starts with the id counts as a hit. One request at a time, >= 1.2 s apart. Fields from
    each design page: name, description, Related Documents / Design Resources tables (public fscdn.rohm.com links, not downloaded) and Key Components
    (parts). Functions are mapped by keyword from the key-component product categories / URLs (passives and diodes skipped); applications and
    markets by keyword from name and description.'
