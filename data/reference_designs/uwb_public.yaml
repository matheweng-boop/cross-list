# Public UWB block diagrams from several publishers (owner, 28 Oct 2026: "if we can find more block diagrams, please
# do so"). Format and rules: README.md in this folder. Collected 28 Oct 2026: robots.txt of each host read first, GET
# only, one request at a time, >= 10 s per host (15 s for arxiv.org); nothing behind a log-in. Only the blocks each page
# or document shows are listed as functions; our summaries, the files themselves are linked, not stored. The Murata
# module diagrams found in the same run are in murata.yaml. Hosts not used: NXP, Qorvo, Qualcomm (blocked or never
# requested); ST's product site (st.com) was not requested, its blog was read from an earlier run's cache.
source: {vendor: "UWB public diagrams (Infineon, MobileKnowledge, Android, arXiv)", pages: ["https://www.infineon.com/products/wireless-connectivity/airoc-uwb/airoc-automotive-ultra-wide-band-solutions", "https://www.themobileknowledge.com/product/mk-uwb-kit-robotics/", "https://source.android.com/docs/core/connect/uwb", "https://arxiv.org/abs/2003.04380"], collected: 2026-10-28, method: "application pages with block diagrams (block lists read from the page's structured data or the public block-diagram JSON), product briefs read with pdftotext and their diagram page rendered locally, one paper abstract page"}
