# Typical-application data (see data/schematic/README.md). Quotes are verbatim from the datasheet text.
covers:
- data/real/skyworks_si86.yaml
datasheets:
- datasheet: si863x-datasheet.pdf
  doc: Si8630/31/35 Data Sheet, Low-Power Triple-Channel Digital Isolators (206522A, March 14, 2023)
  supplies:
  - pin: VDD1
    ground: GND1
    range_v:
    - 2.5
    - 5.5
    page: 11
    quote: Supply Voltage V 2.5 — 5.5 V DD1
  - pin: VDD2
    ground: GND2
    range_v:
    - 2.5
    - 5.5
    page: 11
    quote: V 2.5 — 5.5 V DD2
  components:
  - kind: capacitor
    value: 0.1 µF
    pins: ^VDD[12]$
    to: GND
    series: false
    required: true
    note: one per side, as close as possible to the package
    page: 9
    quote: The Si863x family requires a 0.1 µF bypass capacitor between V and GND1 and V and GND2
  - kind: resistor
    value: 50–300 Ω
    pins: ^(IN|OUT)[A-F]$
    to: SIGNAL
    series: true
    required: false
    note: optional, if the system is excessively noisy
    page: 9
    quote: the user may also include resistors (50–300 Ω ) in series with the inputs and outputs if the system is excessively noisy
  pin_rules:
  - pins: ^EN[12]$
    rule: 'active-high output enable, internally pulled up to local VDD: high or floating = outputs enabled, low = outputs high-impedance'
    page: 8
    quote: These inputs are internally pulled-up to local VDD allowing them to be connected to an external logic level (high or low) or left floating.
  - pins: ^EN[12]$
    rule: if unused, connect to an external logic level (especially in noisy environments); if left floating, do not connect any trace to it
    page: 8
    quote: If EN1, EN2 are unused, it is recommended they be connected to an external logic level
  - pins: ^EN[12]$
    rule: no traces on a floating EN pin
    page: 8
    quote: To minimize noise coupling, do not connect circuit traces to EN1 or EN2 if they are left floating.
  - pins: ^NC$
    rule: not internally connected; may be left floating, tied to VDD or tied to GND
    page: 26
    quote: These pins are not internally connected. They can be left floating, tied to VDD or tied to GND.
  - pins: ^GND[12]$
    rule: 'narrow-body packages: connect every GND pin (pins 2, 8 on side 1; 9, 15 on side 2) to that side''s ground'
    page: 26
    quote: Pin 2 and Pin 8 GND must be externally connected to respective ground. Pin 9 and Pin 15 must also be connected to external ground.
  notes: No bulk capacitor or other external components stated beyond the 0.1 µF bypass caps and the optional 50–300 Ω series resistors. The datasheet does not state whether GND1 and GND2 must stay separate.
    EN1 is NC on Si8630/35, EN2 is NC on Si8635.
