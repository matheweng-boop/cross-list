- datasheet: si860x.pdf
  doc: Si860x Data Sheet, Bidirectional I2C Isolators with Unidirectional Digital Channels (Rev. 206852A, February 23, 2024)
  supplies:
  - pin: VDD1
    ground: GND1
    range_v:
    - 3.0
    - 5.5
    page: 13
    quote: AVDD 3.0 — 5.5 V
  - pin: VDD2
    ground: GND2
    range_v:
    - 3.0
    - 5.5
    page: 13
    quote: BVDD 3.0 — 5.5 V
  components:
  - kind: capacitor
    value: 0.1 µF
    pins: ^VDD[12]$
    to: GND
    series: false
    required: true
    note: datasheet names AVDD/AGND and BVDD/BGND; as close as possible to the package
    page: 11
    quote: The Si860x family requires a 0.1 µF bypass capacitor between AVDD and AGND and BVDD and BGND.
  - kind: resistor
    value: 3k
    pins: ^IO[ABD]$
    to: VDD
    series: false
    required: true
    note: I2C/SMBus bus pull-up on each side (SDA, SCL); 3k as drawn in the typical application diagrams; bus normally used with 0.5–3 mA pull-up
    page: 8
    quote: 3k 3k 0.1 µF 0.1 µF 3k 3k
  - kind: resistor
    value: ''
    pins: ^IO[ABD]$
    to: VDD
    series: false
    required: true
    note: 'text: no external components except the I2C/SMBus pull-ups'
    page: 6
    quote: require no external components except the I2C/SMBus pull-up resistors
  - kind: resistor
    value: 50–300 Ω
    pins: ^(IN|OUT)[BC]$
    to: SIGNAL
    series: true
    required: false
    note: optional, if the system is excessively noisy
    page: 11
    quote: the user may also include resistors (50–300 Ω ) in series with the inputs and outputs if the system is excessively noisy
  pin_rules:
  - pins: ^NC$
    rule: no connection (no further handling stated)
    page: 24
    quote: 2 NC No connection.
  notes: 'Datasheet pin names: AVDD/AGND = VDD1/GND1, BVDD/BGND = VDD2/GND2, ASDA/ASCL/BSDA/BSCL = IO pins. Side A (anti-latch) has special logic levels. Pull-up value appears only in the application figures
    (3k); the Si8602 figure shows pull-ups on SDA only. No bulk cap stated. Nothing stated about keeping grounds separate.'
- datasheet: si86s60x-datasheet.pdf
  doc: Si86S60x data sheet (206551B, August 17, 2023)
  supplies:
  - pin: VDD1
    ground: GND1
    range_v:
    - 3.0
    - 5.5
    page: 2
    quote: Side A power supply terminal; connect to a source of 3.0 to 5.5 V.
  - pin: VDD2
    ground: GND2
    range_v:
    - 3.0
    - 5.5
    page: 2
    quote: Side B power supply terminal; connect to a source of 3.0 to 5.5 V.
  components:
  - kind: capacitor
    value: 0.1 µF
    pins: ^VDD[12]$
    to: GND
    series: false
    required: true
    note: as close as possible to the respective supply pin
    page: 6
    quote: The Si86S60x family requires 0.1 and 10 µF bypass capacitors between AVDD, AGND and BVDD, BGND.
  - kind: capacitor
    value: 10 µF
    pins: ^VDD[12]$
    to: GND
    series: false
    required: true
    note: in addition to the 0.1 µF
    page: 6
    quote: The Si86S60x family requires 0.1 and 10 µF bypass capacitors between AVDD, AGND and BVDD, BGND.
  - kind: resistor
    value: 3k
    pins: ^IO[ABD]$
    to: VDD
    series: false
    required: true
    note: I2C bus pull-ups as drawn in the typical application diagrams; normally used with a 0.5–3 mA pull-up
    page: 9
    quote: 3k 3k 10 µF 0.1 µF 0.1 µF 10 µF 3k 3k
  - kind: resistor
    value: 50–300 Ω
    pins: ^(IN|OUT)[BC]$
    to: SIGNAL
    series: true
    required: false
    note: optional, if excessively noisy; adding them changes the default pull-up strength of the bus
    page: 6
    quote: the user may also include resistors (50 to 300Ω) in series with the inputs and outputs if the system is excessively noisy
  pin_rules:
  - pins: ^NC$
    rule: no connection (no further handling stated)
    page: 3
    quote: 2 NC No connection.
  notes: 'Contradiction: section 3.3.2 says the parts ''require no external components'', yet the application diagrams and the I2C timing text use external pull-up resistors. Recommended Operating Conditions
    table lists no supply voltage; range taken from the pin descriptions (3.0–5.5 V). Nothing stated about keeping grounds separate.'
