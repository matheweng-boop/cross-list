    pin_rules: []
    notes: "No supply pin. Evaluation board BOM also lists CBYP 10 pF 'Decoupling capacitor' but the text does not say which pin it sits on, so it is omitted. Exposed backside ground pad must be grounded through a low-impedance path (p.2); not in the pin list."

