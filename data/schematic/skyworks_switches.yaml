# Typical-application data for the Skyworks RF switches (see README.md for the format).
# Source: the local datasheet text in var/text/skyworks_switches/<stem>.txt; quotes are verbatim from it.
covers: [data/real/skyworks_switches.yaml]
datasheets:
  # ---------------------------------------------------------------- GaAs / pHEMT, positive control, no supply pin
  - datasheet: 200177D.pdf
    doc: "AS183-92/AS183-92LF: 300 kHz-2.5 GHz pHEMT GaAs SPDT Switch, 200177D"
    supplies: []
    components:
      - kind: capacitor
        value: "100 pF"
        pins: '^(RF1|RF2|RFC)$'
        to: RF
        series: true
        required: true
        note: "DC blocking on all three RF ports (J1/J2/J3, Note 1); 100 pF for >500 MHz, larger values for lower frequency"
        page: 2
        quote: "A 100 pF blocking capacitor is required for >500 MHz operation. Use larger value capacitors for lower frequency operation."
    pin_rules: []
    notes: "No supply pin (control pins V1/V2 only). The evaluation board schematic (Figure 6) has no component values in the text. Nothing stated about control-line components."

  - datasheet: 200193D.pdf
    doc: "AS213-92, AS213-92LF: PHEMT GaAs IC SPDT Switch, 200193 Rev. D"
    supplies: []
    components:
      - kind: capacitor
        value: "100 pF"
        pins: '^(RF1|RF2|RFC)$'
        to: RF
        series: true
        required: true
        note: "CBL on J1, J2, J3 for positive-voltage operation; 100 pF for >500 MHz"
        page: 1
        quote: "DC blocking capacitors (CBL) must be supplied externally for positive voltage operation. CBL = 100 pF for operation >500 MHz."
    pin_rules: []
    notes: "No supply pin. Nothing stated about control-line or ground components."

  - datasheet: 201098D.pdf
    doc: "SKY13322-375LF: 20 MHz-6.0 GHz GaAs SP4T Switch, 201098D"
