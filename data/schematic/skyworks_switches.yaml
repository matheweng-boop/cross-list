  # ---------------------------------------------------------------- PIN-diode high-power switches
  - datasheet: SKY12209-478LF_201905E_discontinued.pdf
    doc: "SKY12209-478LF: 0.9 to 4.0 GHz 40 W High Power Silicon PIN Diode SPDT Switch, 201905E"
    supplies: []
    components:
      - kind: resistor
        value: "540 Ω"
        pins: '^RF1_BIAS$'
        to: SUPPLY
        series: true
        required: true
        note: "R2: forward bias for the diode between pins 14 and 11 from the RF1_BIAS bias source; nominally 540 Ω for 28 V / ~50 mA, otherwise (Vs - VDIODE)/I; evaluation board uses it off board, rated >1.35 W at 28 V / 50 mA"
        page: 8
        quote: "forward bias through R2 to the diode connected between pins 14"
      - kind: resistor
        value: "540 Ω"
        pins: '^RF2_BIAS$'
        to: SUPPLY
        series: true
        required: true
        note: "R3: forward bias for the diode between pins 7 and 9 from the RF2_BIAS bias source; same sizing as R2"
        page: 8
        quote: "forward bias through R3 to the diode connected between pins 7"
    pin_rules:
      - pins: '^GND$'
        rule: "connect to ground with the lowest possible impedance"
        page: 2
        quote: "GND Ground. Must be connected to ground using"
    notes: "Bias-controlled PIN diode switch (5 V on RFC, 28 V / 0 V on the RF and bias ports). The evaluation board BOM (p.11) lists 1000 pF and 1 µF capacitors, 22 nH inductors and R1 = 80 Ω, but the text does not tie them to pins, so they are omitted. No logic supply pin."

  - datasheet: SKY12210-478LF_201634J_discontinued.pdf
    doc: "SKY12210-478LF: 0.9 to 5.0 GHz, 100 W High-Power Silicon PIN Diode SPDT T/R Switch, 201634J"
    supplies: []
    components:
      - kind: resistor
        value: "31 Ω"
        pins: '^RFC$'
        to: SUPPLY
        series: true
        required: true
        note: "R1 in the ANT bias path: sets 100 mA forward current with 5 V applied to the ANT port bias pin (evaluation board: two 62 Ω in parallel)"
        page: 8
        quote: "The value of resistor R1, 31 Ω, is selected to provide 100 mA of"
      - kind: resistor
        value: "262 Ω"
        pins: '^RX_BIAS$'
        to: SUPPLY
        series: true
        required: true
        note: "R2: forward bias through RX_BIAS to the diode between pins 7 and 9; value for ~100 mA, (Vs - VDIODE)/I; off board on the evaluation board, >2.7 W at 28 V / 100 mA"
        page: 8
        quote: "forward bias through R2 to the diode connected between pins 7"
    pin_rules:
      - pins: '^GND$'
        rule: "connect to ground with the lowest possible impedance"
        page: 2
        quote: "Ground. Must be connected to ground using"
    notes: "Bias-controlled PIN diode switch. Evaluation board BOM (p.11) capacitors (1000 pF, 1 µF) and inductors are not tied to pins in the text, so omitted. No logic supply pin."

  - datasheet: SKY12212_478LF_202368E.pdf
    doc: "SKY12212-478LF: 0.05 to 2.70 GHz, 100 W High Power Silicon PIN Diode SPDT T/R Switch, 202368E"
    supplies: []
    components:
      - kind: resistor
        value: "31 Ω"
        pins: '^RFC$'
        to: SUPPLY
        series: true
        required: true
        note: "R1 in the ANT bias path: 100 mA forward current with 5 V applied to the ANT port bias pin (evaluation board: two 62 Ω in parallel)"
        page: 9
        quote: "The value of resistor R1 (31 Ω) is selected to provide 100 mA of"
      - kind: resistor
        value: "262 Ω"
        pins: '^RX_BIAS$'
        to: SUPPLY
        series: true
        required: true
        note: "R2: forward bias through RX_BIAS (0 V/+28 V DC bias) to the diode between pins 7 and 9; off board on the evaluation board, >2.7 W at 28 V / 100 mA"
        page: 9
        quote: "forward bias through R2 to the diode connected between pins 7"
    pin_rules:
      - pins: '^GND$'
        rule: "connect to ground with the lowest possible impedance"
        page: 2
        quote: "Ground. Must be connected to ground using"
      - pins: '^NC$'
        rule: "not internally connected: leave open or ground"
        page: 11
        quote: "The N/C pins (4, 5, 10, 11, 12, and 16) are not internally connected, so they can be left open or grounded."
    notes: "Bias-controlled PIN diode switch. Evaluation board BOM (p.11) capacitors (1000 pF, 10000 pF, 1 µF) and 820 nH inductors are not tied to specific pins in the text, so omitted."

  - datasheet: SKY12245-492LF_204135P.pdf
    doc: "SKY12245-492LF: 0.3 to 5.0 GHz, 100 W Compact High-Power SPDT Switch with Integrated Driver, 204135P"
    supplies:
      - {pin: VDD, ground: GND, range_v: [4.5, 5.5], page: 3, quote: "Module supply voltage VCC 4.5 5 5.5 V"}
    components: []
    pin_rules:
      - pins: '^GND$'
        rule: "connect to ground with the lowest possible impedance"
        page: 2
        quote: "Ground. Must be connected to ground using lowest possible impedance."
      - pins: '^RFC$'
        rule: "ANT is two pins (2, 3); the RF line must connect to both"
        page: 2
        quote: "RF input line must be connected to both pins."
    notes: "VDD here is the datasheet's VCC. The evaluation board BOMs (Tables 8-12, per band) list capacitors, inductors, resistors, a D1 Schottky rectifier and an RX shunt PIN diode, but the text does not tie them to pins, so none are recorded. Recommended shutdown order: RF off, VCTRL off, VCC off (not mandatory)."

