        page: 2
        quote: "Note 1: A 47 pF blocking capacitor is required for >1 GHz operation. Use larger value capacitors for lower frequency operation."
    pin_rules: []
    notes: "No supply pin. Evaluation board (p.5): \"Exposed ground paddle should be grounded for best performance\" (the exposed pad is not in the pin list). N/C pin: no connection, nothing further stated."

  - datasheet: 201341C.pdf
    doc: "SKY13355-374LF: 0.1-6.0 GHz DPDT Switch, 201341C"
    supplies: []
    components:
      - kind: capacitor
        value: "47 pF"
        pins: '^(RF1|RF2|RFC1|RFC2)$'
        to: RF
        series: true
