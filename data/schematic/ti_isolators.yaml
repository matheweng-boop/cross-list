covers:
- data/real/ti_digital_isolators.yaml
datasheets:
- datasheet: iso6420-q1.pdf
  doc: ISO642x-Q1 General-Purpose, Basic and Reinforced, Dual-Channel Digital Isolators datasheet, SLLSG23 – APRIL 2026
  supplies:
  - pin: VDD1
    ground: GND1
    range_v:
    - 2.25
    - 5.5
    quote: Supply Voltage Side 1 (Recommended Operating V = 2.5V to 5V (3) 2.25 5.5 V
    page: 6
  - pin: VDD2
    ground: GND2
    range_v:
    - 2.25
    - 5.5
    quote: Supply Voltage Side 2 (Recommended Operating V = 2.5V to 5V (3) 2.25 5.5 V
    page: 6
  components:
  - kind: capacitor
    value: 0.1 µF
    to: GND
    series: false
    required: true
    pins: ^VDD1$
    note: 'VCC1 to GND1; place as close to the supply pin as possible; datasheet: only two external bypass capacitors are
      required'
    quote: Decoupling capacitor between V and GND1 0.1µF
    page: 28
  - kind: capacitor
    value: 0.1 µF
    to: GND
    series: false
    required: true
    pins: ^VDD2$
    note: 'VCC2 to GND2; place as close to the supply pin as possible; datasheet: only two external bypass capacitors are
      required'
    quote: Decoupling capacitor from V and GND2 0.1µF
    page: 28
  pin_rules: []
  notes: Datasheet VCC1/VCC2 mapped to VDD1/VDD2; GND1 is the return for VCC1 and GND2 for VCC2. Only external components
    stated are the 0.1 uF bypass capacitors on each supply; no pull-ups, series resistors or filters stated. No enable or
    special pins. Handling of unused inputs not stated.
