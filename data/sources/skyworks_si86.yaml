# Curated facts for Skyworks Si86xx / Si86Sxx / Si86Px digital isolators.
#
# Part numbers, channel counts, isolation rating, default output, data rate,
# propagation delay, supplies and package per OPN come from Skyworks' product
# table (fetched by app/sources/skyworks.py). This file adds what the table lacks,
# read from the public datasheets. Every fact has an `evidence` regex that the
# importer looks up in the datasheet text; the import fails if it is not found,
# and the page it is found on is stored as the source page.

manufacturer: {name: Skyworks, role: reference, website: https://www.skyworksinc.com}

# Product-table pages on skyworksinc.com (Sitecore item IDs used by its own grid).
product_tables:
  Si86xx: "{97741772-AE23-40E0-990D-2C2E8777F13F}"
  Si86xx automotive: "{A1A01F10-FD63-4ABD-AB69-848959283338}"
  Si86xxT: "{15E35BA5-E70F-4F17-8934-4834251B4D9A}"
  Si86xxT automotive: "{FC057EF6-9245-44E2-95D4-E89573F41B37}"
  Si86Sx: "{F604842E-5C60-4DC7-8F8D-1BBA04AE8D71}"
  Si86Sx automotive: "{2548127D-F7BB-45C5-B003-0CCD26329C32}"
  Si86Px: "{10B63547-2A7F-4914-B2D9-26A9F9F62FEF}"

# Package names used by Skyworks -> package code; dimensions from the datasheet
# package outline tables (nominal values, mm).
packages:
  - {code: SOIC-8N,  aliases: [NB SOIC8, NB SOIC-8], name: "SOIC-8 narrow body", pin_count: 8, pitch_mm: 1.27, body_length_mm: 4.9, body_width_mm: 3.9, span_mm: 6.0, height_mm: 1.75}
  - {code: SSO-8,    aliases: [SSO-8, SSO8], name: "SSO-8 stretched SOIC-8 (wide body)", pin_count: 8, pitch_mm: 1.27, body_length_mm: 5.84, body_width_mm: 7.49, span_mm: 11.5, height_mm: 2.79}
  - {code: SOIC-16N, aliases: [NB SOIC16, NB SOIC-16], name: "SOIC-16 narrow body", pin_count: 16, pitch_mm: 1.27, body_length_mm: 9.9, body_width_mm: 3.9, span_mm: 6.0, height_mm: 1.75}
  - {code: SOIC-16W, aliases: [WB SOIC16, WB SOIC-16], name: "SOIC-16 wide body", pin_count: 16, pitch_mm: 1.27, body_length_mm: 10.3, body_width_mm: 7.5, span_mm: 10.3, height_mm: 2.65}
  - {code: QSOP-16,  aliases: [QSOP16, QSOP-16], name: "QSOP-16", pin_count: 16, pitch_mm: 0.635, body_length_mm: 4.9, body_width_mm: 3.9, span_mm: 6.0, height_mm: 1.75}
  - {code: SOIC-20W, aliases: [WB SOIC-20, WB SOIC20], name: "SOIC-20 wide body", pin_count: 20, pitch_mm: 1.27, body_length_mm: 12.8, body_width_mm: 7.5, span_mm: 10.3, height_mm: 2.65}

# Pin layouts. `ch` lists (side-1 pin, side-2 pin) per channel slot; `fixed` gives
# the other pins; `ctl` lists control pins filled per base part.
layouts:
  quad16:   {pins: 16, ch: [[3,14],[4,13],[5,12],[6,11]], fixed: {1: VDD1, 2: GND1, 8: GND1, 9: GND2, 15: GND2, 16: VDD2}, ctl: [7, 10]}
  quad16x:  {pins: 16, ch: [[3,14],[4,13],[5,12],[6,11],[7,10]], fixed: {1: VDD1, 2: GND1, 8: GND1, 9: GND2, 15: GND2, 16: VDD2}, ctl: []}
  tri16:    {pins: 16, ch: [[3,14],[4,13],[5,12]], fixed: {1: VDD1, 2: GND1, 6: NC, 8: GND1, 9: GND2, 11: NC, 15: GND2, 16: VDD2}, ctl: [7, 10]}
  penta16:  {pins: 16, ch: [[2,15],[3,14],[4,13],[5,12],[6,11]], fixed: {1: VDD1, 8: GND1, 9: GND2, 16: VDD2}, ctl: [7, 10]}
  penta16b: {pins: 16, ch: [[3,14],[4,13],[5,12],[6,11],[7,10]], fixed: {1: VDD1, 2: GND1, 8: GND1, 9: GND2, 15: GND2, 16: VDD2}, ctl: []}
  hexa16:   {pins: 16, ch: [[2,15],[3,14],[4,13],[5,12],[6,11],[7,10]], fixed: {1: VDD1, 8: GND1, 9: GND2, 16: VDD2}, ctl: []}
  dual8:    {pins: 8, ch: [[2,7],[3,6]], fixed: {1: VDD1, 4: GND1, 5: GND2, 8: VDD2}, ctl: []}
  single8:  {pins: 8, ch: [[2,6]], fixed: {1: VDD1, 3: VDD1/NC, 4: GND1, 5: GND2/NC, 7: GND2/NC, 8: VDD2}, ctl: []}
  single8s: {pins: 8, ch: [[2,6]], fixed: {1: VDD1, 3: NC, 4: GND1, 5: GND2, 7: NC, 8: VDD2}, ctl: []}
  single16w: {pins: 16, ch: [[4,13]], fixed: {1: GND1, 2: NC, 3: VDD1, 5: NC, 6: NC, 7: GND1, 8: NC, 9: GND2, 10: NC, 11: NC, 12: NC, 14: VDD2, 15: NC, 16: GND2}, ctl: []}
  dual16w:  {pins: 16, ch: [[4,13],[5,12]], fixed: {1: GND1, 2: NC, 3: VDD1, 6: NC, 7: GND1, 8: NC, 9: GND2, 10: NC, 11: NC, 14: VDD2, 15: NC, 16: GND2}, ctl: []}
  i2c8:     {pins: 8, ch: [[2,7],[3,6]], fixed: {1: VDD1, 4: GND1, 5: GND2, 8: VDD2}, ctl: []}
  i2c16w:   {pins: 16, ch: [[5,12],[6,11]], fixed: {1: GND1, 2: NC, 3: VDD1, 4: NC, 7: GND1, 8: NC, 9: GND2, 10: NC, 13: NC, 14: VDD2, 15: NC, 16: GND2}, ctl: []}
  i2c16:    {pins: 16, ch: [[3,14],[4,13],[5,12],[6,11]], fixed: {1: VDD1, 2: NC, 7: NC, 8: GND1, 9: GND2, 10: NC, 15: NC, 16: VDD2}, ctl: []}
  power16:  {pins: 16, ch: [[7,10],[8,9]], fixed: {1: DNC, 2: VI, 3: GNDI, 4: GNDI, 5: VDD1, 6: GND1, 11: VDD2, 12: CTRL, 13: GND2, 14: DNC, 15: GNDO, 16: VO}, ctl: []}
  power20:  {pins: 20, ch: [[7,14],[8,13],[9,12],[10,11]], fixed: {1: DNC, 2: VI, 3: GNDI, 4: GNDI, 5: VDD1, 6: GND1, 15: VDD2, 16: CTRL, 17: GND2, 18: DNC, 19: GNDO, 20: VO}, ctl: []}
  qspi16:   {pins: 16, ch: [[3,14],[4,13],[5,12],[6,11],[7,10]], fixed: {1: VDD1, 2: EN1, 8: GND1, 9: GND2, 15: EN2, 16: VDD2}, ctl: []}

# Base parts: channel directions per slot (F forward, R reverse, B bidirectional),
# layout per package (default = any other package), control pins, and where the
# pinout was read. `inferred` marks pinouts not drawn in the datasheet.
base_parts:
  # --- Si861x/2x (also 1 Mbps versions) ---
  Si8610: {dirs: F,  layout: {SOIC-8N: single8, SOIC-16W: single16w}, pinout_evidence: ["Si8610 SOIC-8", "Si861x/2x Narrow Body SOIC-8 Pin Descriptions"]}
  Si8620: {dirs: FF, layout: {SOIC-8N: dual8, SOIC-16W: dual16w}, pinout_evidence: ["Si8620 SOIC-8", "Si861x/2x Narrow Body SOIC-8 Pin Descriptions"]}
  Si8621: {dirs: FR, layout: {SOIC-8N: dual8, SOIC-16W: dual16w}, pinout_evidence: ["Si8621 SOIC-8", "Si861x/2x Narrow Body SOIC-8 Pin Descriptions"]}
  Si8622: {dirs: RF, layout: {SOIC-8N: dual8, SOIC-16W: dual16w}, pinout_evidence: ["Si8622 SOIC-8", "Si861x/2x Narrow Body SOIC-8 Pin Descriptions"]}
  # --- Si863x ---
  Si8630: {dirs: FFF, layout: tri16, ctl: [NC, EN2], pinout_evidence: ["EN1/NC2 7 Digital Input Side 1 active high enable. NC on Si8630/35", "Si863x Pin Descriptions"]}
