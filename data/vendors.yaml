# One name per company on every page (app/services/vendors.py, Jinja filter |vendor). Source files keep the name
# they were collected with; pages show `display`.
#   display: the short form the company uses on its own site
#   legal:   the long form, for reports
#   aliases: other names the data files use (matched ignoring case)
#   parent:  owner, when the brand is a subsidiary (pSemi is a Murata company)
vendors:
