[project]
name = "cross-list"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
markers = [
    "browser: clicks through pages in Chromium against the app on a real port (tests/test_browser.py)",
    "smoke: the quick check run while working (uv run pytest -m smoke): main pages, Cross a list, data files, one PDF",
]
