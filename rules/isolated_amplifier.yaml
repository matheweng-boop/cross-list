family: isolated_amplifier
title: Isolated amplifiers & modulators (current / voltage sense)
params:
  # --- Priority 1: must be equal or better ---
  - {key: isolation_rating_kvrms, label: Isolation rating, unit: kVrms, priority: 1, kind: number, direction: higher}
  - {key: isolation_class, label: Isolation class, priority: 1, kind: ordinal, levels: [basic, reinforced]}
  - {key: creepage_mm, label: Creepage, unit: mm, priority: 1, kind: number, direction: higher}
  - {key: output_type, label: Output type, priority: 1, kind: category, hard: true}
  - {key: qualification, label: "Automotive grade (AEC-Q100)", priority: 1, kind: ordinal, levels: [commercial, industrial, automotive], must_meet: true}
  - {key: cmti_kv_us, label: CMTI (min), unit: kV/µs, priority: 1, kind: number, direction: higher}
  # What the part does: current (shunt) vs voltage sensing and its input range.
  - {key: sense_type, label: Sense type, priority: 1, kind: category, hard: true}
  - {key: input_range, label: Linear input range, priority: 1, kind: category}
  # --- Priority 2: for information ---
  - {key: vdd1_range_v, label: High-side supply, unit: V, priority: 2, kind: range}
  - {key: vdd2_range_v, label: Low-side supply, unit: V, priority: 2, kind: range}
  - {key: temp_range_c, label: Operating temperature, unit: °C, priority: 2, kind: range}
  # --- Priority 3: for information ---
  - {key: gain, label: Gain (sensitivity), priority: 3, kind: category}
  - {key: offset_uv, label: Input offset (max), unit: µV, priority: 3, kind: number, direction: lower}
  - {key: gain_error_pct, label: Gain error (max), unit: "%", priority: 3, kind: number, direction: lower}
  - {key: nonlinearity_pct, label: Nonlinearity (max), unit: "%", priority: 3, kind: number, direction: lower}
  - {key: bandwidth_khz, label: Bandwidth, unit: kHz, priority: 3, kind: number, direction: higher}
  - {key: snr_db, label: SNR (noise), unit: dB, priority: 3, kind: number, direction: higher}
  - {key: idd1_ma, label: High-side supply current, unit: mA, priority: 3, kind: number, direction: lower}
  - {key: idd2_ma, label: Low-side supply current, unit: mA, priority: 3, kind: number, direction: lower}
