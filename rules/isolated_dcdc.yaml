# Isolated DC-DC converters (owner, 26 Oct 2026: "add something for UCC12051QDVERQ1"). A family entry only, so a
# pasted isolated DC-DC part is recognised and shown with its datasheet values: no crossing rules yet (every
# parameter is priority 3, for information) and no Skyworks/Qorvo part in this family. Skyworks Si88xx are digital
# isolators with a DC-DC controller that need an external transformer (family digital_isolator), not modules.
