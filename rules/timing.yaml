family: timing
title: Timing (clocks, buffers, oscillators)
# Owner, 22 Oct 2026: for timing, look at function, jitter and outputs, not at pin-to-pin replacements.
functional_focus: true
# One family for every timing part; `function_type` says which kind it is, and only parts of the same kind are
# compared. Pin-to-pin drop-ins are rare across vendors in timing: each vendor has its own pinout, programming
# interface and configuration software (Skyworks ClockBuilder Pro, TI TICS Pro, Renesas Timing Commander, SiTime
# Time Machine), so most crosses are functional (a board change and a new configuration file), not drop-in.
params:
  # --- Priority 1: must be equal or better ---
  # clock_generator, jitter_attenuator, clock_buffer, pcie_buffer, crystal_oscillator (the block-diagram function ids)
  - {key: function_type, label: Function, priority: 1, kind: category, hard: true}
  # Differential outputs (a pair counts once); a part with fewer outputs cannot feed every load of the reference.
  - {key: outputs, label: Outputs, priority: 1, kind: number, direction: higher}
  # Every output format the reference offers must be available on the candidate (LVPECL, LVDS, HCSL, CML, LVCMOS).
  - {key: output_formats, label: Output formats, priority: 1, kind: set}
  # The candidate's output frequency range must cover the reference's.
  - {key: freq_range_mhz, label: Output frequency range, unit: MHz, priority: 1, kind: range, tolerance: 0.01}
  # Core supply (the main VDD pin). Other rails (an extra 3.3 V analog rail, output-bank supplies) are in the notes.
  - {key: vdd_range_v, label: Core supply range, unit: V, priority: 2, kind: range}
  # Owner, 26 Oct 2026: core supply ranges differ by rail (Si5341: VDD 1.8 V and VDDA 3.3 V, both core). The number of
  # separate core rails the part needs: one more rail than the reference is a board change.
  - {key: core_rails, label: Core supply rails needed, priority: 2, kind: number, direction: lower, tolerance: 0}
  # --- Priority 2: should match ---
  # Typical RMS jitter, 12 kHz to 20 MHz unless the notes say otherwise. Clock generators, jitter attenuators and
  # oscillators: phase jitter of the output. Buffers: additive jitter; PCIe buffers: the newest PCIe generation's
  # additive jitter the datasheet states. Vendors measure at different frequencies and with different filters, so
  # values within 10 % count as equal.
  # Owner, 26 Oct 2026: jitter depends on the output frequency (LMK03328: 100 fs typ. stated for fOUT >= 100 MHz).
  # The value is stored with its output frequency (jitter_fout_mhz); a part with jitter_curve is read at the other's.
  - {key: jitter_fs, label: RMS jitter (typ.), unit: fs, priority: 1, kind: number, direction: lower, tolerance: 0.1, at: jitter_fout_mhz, curve: jitter_curve}
  # An AEC-Q100 reference only gets AEC-Q100 candidates. Parts that state no grade are the usual industrial kind.
  - {key: qualification, label: "Automotive grade (AEC-Q100)", priority: 2, kind: ordinal, levels: [commercial, industrial, automotive], must_meet: true, default: industrial}
  - {key: temp_range_c, label: Operating temperature, unit: °C, priority: 2, kind: range}
  # Highest PCIe generation the datasheet states compliance with; `none` = no PCIe compliance stated.
  - {key: pcie_gen, label: PCIe compliance (up to), priority: 2, kind: ordinal, levels: [none, gen1, gen2, gen3, gen4, gen5, gen6, gen7], default: none}
  # --- Priority 3: informative ---
  - {key: inputs, label: Reference / clock inputs, priority: 3, kind: number, direction: higher}
  - {key: control, label: Configuration interface, priority: 3, kind: set}
  # Oscillators: total frequency stability (best option offered), ± ppm.
  - {key: stability_ppm, label: Frequency stability (best option), unit: ± ppm, priority: 3, kind: number, direction: lower, unknown_ok: true}
  - {key: jitter_fout_mhz, label: Jitter stated at output frequency, unit: MHz, priority: 3, kind: number, direction: match, unknown_ok: true}
  - {key: jitter_curve, label: RMS jitter vs output frequency, unit: fs, x_unit: MHz, priority: 3, kind: curve}
